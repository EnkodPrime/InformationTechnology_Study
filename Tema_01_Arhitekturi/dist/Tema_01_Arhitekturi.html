 "ch04_cpu": {
  "file": "04_isa.c",
  "code": "typedef struct { int op, rd, rs, rt, imm; } instr_t;  /* rs == NO_BASE: пряк адрес */\ntypedef struct { int pc; int r[NREG]; int mem[NMEM]; const instr_t *imem; int n; } cpu_t;\n\nstatic void wr(cpu_t *c, int rd, int v) { if (rd != 0) c->r[rd] = v; } /* R0 = 0 */\n\n/* Изпълнява една инструкция. Връща 1 — продължава, 0 — HALT, -1 — грешка. */\nint step(cpu_t *c)\n{\n    if (c->pc < 0 || c->pc >= c->n) return -1;          /* PC извън програмата */\n    instr_t ir = c->imem[c->pc];\n    c->pc = c->pc + 1;                  /* следваща по ред */\n    long long ea;                       /* без препълване при Rs + off */\n    switch (ir.op) {\n    case OP_LI:   wr(c, ir.rd, ir.imm); break;\n    case OP_MOV:  wr(c, ir.rd, c->r[ir.rs]); break;\n    case OP_ADD:  wr(c, ir.rd, (int)((unsigned)c->r[ir.rs] + (unsigned)c->r[ir.rt])); break;\n    case OP_SUB:  wr(c, ir.rd, (int)((unsigned)c->r[ir.rs] - (unsigned)c->r[ir.rt])); break;\n    case OP_SLT:  wr(c, ir.rd, c->r[ir.rs] < c->r[ir.rt]); break;\n    case OP_ADDI: wr(c, ir.rd, (int)((unsigned)c->r[ir.rs] + (unsigned)ir.imm)); break;\n    case OP_LOAD:\n    case OP_STORE:\n        ea = (ir.rs == NO_BASE ? 0LL : (long long)c->r[ir.rs]) + ir.imm;  /* ефективен адрес */\n        if (ea < 0 || ea >= NMEM) return -1;\n        if (ir.op == OP_LOAD) wr(c, ir.rd, c->mem[ea]);\n        else                  c->mem[ea] = c->r[ir.rd];\n        break;\n    case OP_BEQ:  if (c->r[ir.rs] == c->r[ir.rt]) c->pc = ir.imm; break;\n    case OP_BNE:  if (c->r[ir.rs] != c->r[ir.rt]) c->pc = ir.imm; break;\n    case OP_JMP:  c->pc = ir.imm; break;\n    case OP_NOP:  break;\n    case OP_HALT: return 0;\n    }\n    return 1;\n}",

  "file": "05_pipeline.c",
  "code": "/* Стадиите на текущия такт: индекс на инструкция, EMPTY или WRONG. */\nstatic int writes(const pinstr_t *p, int x, int r)\n{\n    return x >= 0 && r != 0 && p[x].rd == r && p[x].kind != K_STORE && p[x].kind != K_BR;\n}\n\n/* 1, ако инструкцията в ID трябва да чака (зависимост по данни). */\nstatic int hazard(const pinstr_t *p, const int st[NSTAGE], int fwd)\n{\n    int i = st[S_ID];\n    if (i < 0) return 0;\n    int src[2] = {p[i].rs, p[i].rt};\n    for (int k = 0; k < 2; k++) {\n        int r = src[k];\n        if (r == 0) continue;\n        if (writes(p, st[S_EX], r)) {                   /* най-младият производител */\n            if (!fwd || p[st[S_EX]].kind == K_LOAD)\n                return 1;\n        } else if (writes(p, st[S_MEM], r) && !fwd) {\n            return 1;\n        }\n    }\n    return 0;\n}\n\nint pipeline(const pinstr_t *p, int n, int fwd, int predict, int unified,\n             int diag[MAXI][MAXCYC], pstats_t *s)\n{\n    int st[NSTAGE] = {EMPTY, EMPTY, EMPTY, EMPTY, EMPTY};\n    int next = 0, retired = 0, cyc = 0;\n    memset(s, 0, sizeof *s);\n    for (int i = 0; i < n; i++) for (int c = 0; c < MAXCYC; c++) diag[i][c] = -1;\n    while (retired < n && cyc < MAXCYC) {\n        /* --- преход от такт cyc към cyc+1 (първият такт е 1) --- */\n        int nx[NSTAGE];\n        nx[S_WB] = st[S_MEM];\n        nx[S_MEM] = st[S_EX];\n        int flush = st[S_EX] >= 0 && p[st[S_EX]].kind == K_BR && p[st[S_EX]].taken && predict;\n        int stall = !flush && hazard(p, st, fwd);\n        int hold_if = 0;\n        if (flush) {                                            /* погрешният път се отхвърля */\n            s->flushed += (st[S_ID] == WRONG) + (st[S_IF] == WRONG);\n            nx[S_EX] = EMPTY; nx[S_ID] = EMPTY; nx[S_IF] = EMPTY;\n            next = st[S_EX] + 1;\n        } else if (stall) {                                     /* мехурче в EX */\n            s->data_stalls++;\n            nx[S_EX] = EMPTY; nx[S_ID] = st[S_ID]; nx[S_IF] = st[S_IF];\n            hold_if = 1;\n        } else {\n            nx[S_EX] = st[S_ID]; nx[S_ID] = st[S_IF]; nx[S_IF] = EMPTY;\n        }\n        if (!hold_if) {                                         /* извличане (IF) */\n            int last = next - 1;                                /* последно извлечената */\n            int br_open = 0;\n            for (int k = S_ID; k <= S_EX; k++)\n                if (nx[k] >= 0 && p[nx[k]].kind == K_BR) br_open = 1;\n            int port_busy = unified && nx[S_MEM] >= 0 &&\n                            (p[nx[S_MEM]].kind == K_LOAD || p[nx[S_MEM]].kind == K_STORE);\n            if (!predict && br_open) {\n                s->branch_stalls++;\n            } else if (port_busy && (next < n || (predict && last >= 0 && p[last].kind == K_BR && p[last].taken && br_open))) {\n                s->struct_stalls++;\n            } else if (predict && last >= 0 && p[last].kind == K_BR && p[last].taken && br_open) {\n                nx[S_IF] = WRONG;            /* предсказано \"не е взето\" */\n            } else if (next < n) {\n                nx[S_IF] = next++;\n            }\n        }\n        if (nx[S_WB] >= 0) retired++;\n        memcpy(st, nx, sizeof st);\n        cyc++;\n        for (int k = 0; k < NSTAGE; k++) if (st[k] >= 0) diag[st[k]][cyc] = k;\n    }\n    s->cycles = cyc;\n    return cyc;\n}",

 "ch06_cache": {
  "file": "06_cache.c",
  "code": "typedef struct { int valid, dirty; unsigned tag; long stamp; } line_t;\ntypedef struct {\n    int sets, ways, block;          /* брой набори, линии в набор, байтове в линия */\n    int lru, write_back;            /* 1 = LRU, 0 = FIFO;  1 = write-back, 0 = write-through */\n    line_t L[MAXLINES];\n    long clock;\n    int hits, misses, evictions, writebacks, mem_writes;\n} cache_t;\n\nstatic int log2i(int x) { int k = 0; while ((1 << k) < x) k++; return k; }\n\n/* Връща 1 при попадение, 0 при пропуск. is_write: 0 четене, 1 запис. */\nint cache_access(cache_t *c, unsigned addr, int is_write)\n{\n    int ob = log2i(c->block), ib = log2i(c->sets);\n    unsigned offset = addr & (unsigned)(c->block - 1);\n    unsigned index = (addr >> ob) & (unsigned)(c->sets - 1);\n    unsigned tag = addr >> (ob + ib);\n    (void)offset;\n    line_t *set = &c->L[index * (unsigned)c->ways];\n    c->clock++;\n    for (int w = 0; w < c->ways; w++)\n        if (set[w].valid && set[w].tag == tag) {\n            c->hits++;\n            if (c->lru) set[w].stamp = c->clock;   /* FIFO не обновява */\n            if (is_write) {\n                if (c->write_back) set[w].dirty = 1;\n                else c->mem_writes++;\n            }\n            return 1;\n        }\n    c->misses++;\n    if (is_write && !c->write_back) {                        /* no-write-allocate */\n        c->mem_writes++;\n        return 0;\n    }\n    int victim = -1;\n    for (int w = 0; w < c->ways; w++)                        /* свободна линия? */\n        if (!set[w].valid) { victim = w; break; }\n    if (victim < 0) {                                        /* най-стар печат */\n        victim = 0;\n        for (int w = 1; w < c->ways; w++)\n            if (set[w].stamp < set[victim].stamp) victim = w;\n        c->evictions++;\n        if (set[victim].dirty) { c->writebacks++; c->mem_writes++; }\n    }\n    set[victim].valid = 1; set[victim].tag = tag;\n    set[victim].dirty = is_write;\n    set[victim].stamp = c->clock;\n    return 0;\n}",

 "ch07_io": {
  "file": "07_io.c",
  "code": "io_t simulate(int mode, int N, int gap, int copy, int isr, int setup,\n              int H, char *cpu, char *dev)\n{\n    io_t r = {0, 0, 0, 0, 0, 0};\n    int got = 0;               /* байтове в паметта */\n    int busy = 0, kind = C_WORK, want_copy = 0, setup_done = 0, irq = 0;\n    if (mode == 2) { kind = C_SETUP; busy = setup; }\n    for (int t = 0; t < H && t < TMAX; t++) {\n        int ready = got < N && t >= (got + 1) * gap;\n        dev[t] = (char)(t > 0 && t % gap == 0 && t / gap <= N ? D_READY : D_NONE); /* пристига байт */\n        if (busy == 0) {                                          /* CPU е свободен */\n            kind = C_WORK;\n            if (mode == 0 && got < N) {\n                if (want_copy) { kind = C_COPY; busy = copy; want_copy = 0; }\n                else { kind = C_POLL; busy = 1; r.polls++;\n                       want_copy = ready; }\n            } else if (mode == 1 && ready) {\n                kind = C_ISR; busy = isr + copy; r.irqs++;\n            } else if (mode == 2 && irq) {\n                kind = C_ISR; busy = isr; irq = 0; r.irqs++;\n            }\n        }\n        if (mode == 2 && setup_done && ready) {                   /* DMA пренася */\n            dev[t] = D_DMA; got++; r.copies++;\n            if (got == N) irq = 1;          /* прекъсване \"готово\" */\n        }\n        cpu[t] = (char)kind;\n        if (kind == C_WORK) r.useful++; else r.cpu_io++;\n        if (busy > 0 && --busy == 0) {                            /* край на действие */\n            if (kind == C_COPY || (kind == C_ISR && mode == 1)) { got++; r.copies++; }\n            if (kind == C_SETUP) setup_done = 1;\n            if (r.end == 0 && got == N && (mode != 2 || kind == C_ISR)) r.end = t + 1;\n        }\n    }\n    return r;\n}",

<script>
/* Раздел 1 — архитектура и организация: архитектура срещу микроархитектура,
   фон Нойман срещу Харвард (симулатор на шината), три логически шини. */
(function () {
  const S = window.Study, h = S.h;

  /* ---------- чисти функции ---------- */
  function parseProg(str) {
    const s = String(str).toUpperCase().replace(/[\s,;]+/g, "");
    if (!s.length) throw new Error("Въведи поне една инструкция: A (без достъп до данни), L (LOAD) или S (STORE).");
    if (s.length > 14) throw new Error("Най-много 14 инструкции.");
    const bad = s.replace(/[ALS]/g, "");
    if (bad) throw new Error(`„${bad[0]}“ не е позволено. Използвай само A, L и S.`);
    return s;
  }

  const algos = {
    /** Същият алгоритъм като run_bus() в c/01_bus.c */
    run_bus({ prog, arch }) {
      const p = parseProg(prog), n = p.length, harvard = arch === "harvard";
      const st = { такта: 0, извличания: 0, "достъпи до данни": 0, конфликти: 0 };
      const hist = [], F = [];
      let next = 0, pending = -1;
      const snap = (o) => F.push(Object.assign({ p, harvard, hist: hist.map((x) => ({ ...x })), next, pending, stats: { ...st },
        vars: { next, pending, cycle: st.такта } }, o));
      snap({ at: "init", msg: `Програма от ${n} инструкции: <code>${p}</code>. ${harvard ? "Харвард: отделни шини за инструкции и данни." : "Фон Нойман: една обща шина за инструкции и данни."}` });
      while (next < n || pending >= 0) {
        st.такта++;
        const cur = { f: null, d: null, conf: false };
        hist.push(cur);
        snap({ at: ["tick", "loop"], msg: `Такт <b>${st.такта}</b>. ${pending >= 0 ? `Инструкция I${pending + 1} (${p[pending]}) чака достъп до данни.` : "Няма чакащ достъп до данни."}` });
        let dbusy = 0;
        if (pending >= 0) {
          st["достъпи до данни"]++; cur.d = pending; dbusy = 1;
          const was = pending; pending = -1;
          snap({ at: ["data", "dchk"], bus: "d", msg: `Транзакция за <b>данни</b> на I${was + 1} (${p[was] === "L" ? "LOAD чете" : "STORE записва"}). ${harvard ? "Използва шината за данни." : "Заема <b>общата</b> шина."}`, log: `т${st.такта}: D I${was + 1}` });
        }
        const fbusy = harvard ? 0 : dbusy;
        if (next < n && !fbusy) {
          st.извличания++; cur.f = next;
          const ls = p[next] === "L" || p[next] === "S";
          const idx = next;
          if (ls) pending = next;
          next++;
          snap({ at: ls ? ["needd", "fetch"] : ["fetch", "fchk"], bus: "f", msg: `<b>Извличане</b> на I${idx + 1} (${p[idx]})${harvard && dbusy ? " — в <b>същия</b> такт, защото пътят за инструкции е отделен" : ""}.${ls ? " Тя е LOAD/STORE — в следващия такт ще ѝ трябва шината за данни." : ""}`, log: `т${st.такта}: F I${idx + 1}` });
        } else if (next < n) {
          st.конфликти++; cur.conf = true;
          snap({ at: ["conf", "fchk"], bus: "x", msg: `Извличането на I${next + 1} <b>чака</b>: общата шина е заета с данни. Това е ограничението на модела на фон Нойман.`, log: `т${st.такта}: F чака` });
        }
      }
      snap({ at: "ret", done: true, msg: `Край: <b>${st.такта}</b> такта за ${n} инструкции (${st.извличания} извличания, ${st["достъпи до данни"]} достъпа до данни, ${st.конфликти} конфликта).` });
      return { frames: F, result: [st.такта, st.извличания, st["достъпи до данни"], st.конфликти] };
    },
  };

  /* ---------- съдържание ---------- */
  const html = `
<div class="prose">
  <p>Компютърната <dfn data-g="архитектура">архитектура</dfn> описва принципите на работа и характеристиките на машината, които са съществени за програмиста: инструкции, регистри, типове данни, адресиране и механизми за изпълнение. <dfn data-g="микроархитектура">Микроархитектурата</dfn> определя как конкретен процесор реализира тази архитектура: изпълнителни устройства, конвейери, кешове и управляваща логика. Два процесора могат да изпълняват един и същ машинен код, но да имат различна производителност и вътрешна организация.</p>
  <p>Основните функционални части са процесор, памет, входно-изходни устройства и връзки между тях. Процесорът включва <dfn data-g="уу">управляващо устройство</dfn>, <dfn data-g="алу">аритметично-логическо устройство</dfn> и <dfn data-g="регистър">регистри</dfn>. <dfn data-g="брояч на командите">Броячът на командите</dfn> определя откъде се извлича следващата инструкция; преходите могат да променят нормалната последователност.</p>
</div>

<div class="block">
  <h3>Един договор, различни реализации</h3>
  <p class="prose"><dfn data-g="isa">Архитектурата на системата от инструкции</dfn> е договорът, по който машинната програма разговаря с процесора: какви регистри съществуват, как се назовават операциите и какъв наблюдаем резултат трябва да дадат. Микроархитектурата е вътрешният механизъм, който изпълнява договора. Щракни върху реализация — резултатът остава същият, времето не.</p>
  <div class="cards" id="impl"></div>
  <div class="key" id="impl-d"></div>
  <details class="trap"><summary>Капан: „съвместим“ значи ли „еднакво бърз“?</summary><div>
    <p>Не. ISA съвместимостта гарантира поведение, а времето зависи от микроархитектурата, кешовете, паметта, честотата и конкретните зависимости в програмата. Единият процесор може да има по-дълъг конвейер, повече кеш и различно предсказване на преходи.</p>
  </div></details>
  <details class="trap"><summary>Капан: „32-битов процесор“</summary><div>
    <p>Самостоятелно не определя ширината на всички шини, размера на всяка инструкция или максималния размер на физическата памет. Трябва да се уточни дали става дума за регистри, адреси, операции или интерфейс. Битът е двоична цифра, байтът в разглежданите съвременни системи е осем бита, а машинната дума зависи от архитектурата. Инструкцията може да заема няколко байта, а да обработва един байт данни.</p>
  </div></details>
</div>

<div class="block">
  <h3>Фон Нойман и Харвард: какво точно се разделя</h3>
  <div class="split">
    <div class="key"><b><dfn data-g="фон нойман">Фон Нойман</dfn></b><p>Програмата и данните са в обща памет и минават по общ път. Общият път може да ограничи едновременното извличане на инструкция и четене на данни.</p></div>
    <div class="key"><b><dfn data-g="харвард">Харвард</dfn></b><p>Отделни памети и пътища за инструкции и данни — допуска едновременни достъпи. Един и същ числов адрес може да означава различни места в двете пространства.</p></div>
  </div>
  <p class="prose">Симулаторът брои такта по шината в учебен модел: всяка инструкция се извлича с една транзакция (F), а LOAD/STORE правят още една за данни (D) в следващия такт. Изпиши програма от <b>A</b> (аритметика, без данни), <b>L</b> (LOAD) и <b>S</b> (STORE) и сравни двете организации.</p>
  <div id="v-bus"></div>
  <details class="hint"><summary>Хинт: откъде идват числата</summary><div>
    <p>При Харвард всяка инструкция заема пътя за инструкции точно 1 такт, а достъпът за данни се припокрива с извличането на следващата. Затова времето е n + 1, ако последната инструкция е LOAD/STORE, иначе n. При фон Нойман всеки достъп до данни „краде“ такт от извличането: n + (брой L и S).</p>
    <p>Моделът показва само конфликта за пътя. Реален процесор има кешове, конвейер и изчаквания на паметта.</p>
  </div></details>
  <p class="prose">На практика се срещат <dfn data-g="смесена организация">смесени организации</dfn>: отделни кешове за инструкции и данни пред обща основна памет. Така един процесор може да има единно програмно адресно пространство и все пак два независими пътя на първото кеш ниво. Следователно разделянето трябва да се разглежда на конкретно равнище от йерархията.</p>
  <div id="mixed"></div>
  <details class="trap"><summary>Капан: „Харвард значи RISC, фон Нойман значи CISC“</summary><div>
    <p>Не следва. Това са различни класификационни оси: едната е организацията на достъпа до паметта, другата — сложността на системата от инструкции. Названието „Харвард“ идва от историческата връзка с Harvard Mark I; важният признак днес е организацията на достъпа, а не мястото на производство.</p>
  </div></details>
  <details class="trap"><summary>Капан: два кеша означават ли две основни памети?</summary><div>
    <p>Не. Кешовете за инструкции и данни могат да извличат блокове от обща RAM. Отделянето на първо кеш ниво не означава две отделни основни RAM памети. За класификацията трябва да се разгледат адресните пространства, пътищата и конкретното ниво.</p>
  </div></details>
</div>

<div class="block">
  <h3>Адресна шина, шина за данни, управляваща шина</h3>
  <p class="prose"><dfn data-g="адресна шина">Адресната шина</dfn> отговаря на „къде“, <dfn data-g="шина за данни">шината за данни</dfn> — „каква стойност“, а <dfn data-g="управляваща шина">управляващите сигнали</dfn> — „каква операция и кога“. Избери транзакция; посоките зависят от текущия инициатор, тук CPU.</p>
  <div class="row" id="bus-btns"></div>
  <div id="bus-svg"></div>
  <div class="key" id="bus-d"></div>
  <details class="hint"><summary>Хинт: трите шини са логически роли</summary><div>
    <p>В реален интерфейс адресът и данните могат да споделят линии в различни моменти. Изобразените три шини са логическо разделение на ролите, не задължително три групи проводници.</p>
  </div></details>
</div>

<div class="key"><b>За запомняне.</b> Архитектура = какво вижда програмата; микроархитектура = как е направено. Фон Нойман/Харвард е въпрос за <i>пътищата до паметта</i> и винаги трябва да се каже <i>на кое равнище</i>.</div>`;

  /* ---------- данни за интерактивните схеми ---------- */
  const IMPL = [
    { t: "Реализация A", s: "къс конвейер, малък кеш", d: "ADD x3, x1, x2 при x1 = 5, x2 = 3 дава x3 = 8. С малък кеш програма с много пропуски чака паметта по-често." },
    { t: "Реализация B", s: "дълъг конвейер, голям кеш, предсказване", d: "Същата инструкция дава <b>същото</b> x3 = 8. Повече инструкции са едновременно в движение; времето за програма с много разклонения зависи от точността на предсказването." },
    { t: "Ibex (RISC-V)", s: "реално отворено ядро", d: "Документацията описва отделни decoder, controller, register file, ALU и load-store unit. Изпълнява RV32I — същият договор." },
  ];

  function arrowDefs(svg, id) {
    const d = S.svg("defs");
    d.append(S.svg("marker", { id, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" },
      S.svg("path", { d: "M0,0 L10,5 L0,10 z", fill: "currentColor" })));
    svg.append(d);
  }
  let mk = 0;
  function box(svg, x, y, w, hh, label, cls, sub) {
    const g = S.svg("g", { class: "node " + (cls || "") });
    g.append(S.svg("rect", { x, y, width: w, height: hh, rx: 6, fill: "var(--cb, var(--panel))", stroke: "var(--c, var(--ink-2))", "stroke-width": 2 }));
    g.append(S.svg("text", { x: x + w / 2, y: y + hh / 2 + (sub ? -3 : 5), "text-anchor": "middle", "font-weight": 600, text: label }));
    if (sub) g.append(S.svg("text", { x: x + w / 2, y: y + hh / 2 + 14, "text-anchor": "middle", class: "wt", text: sub }));
    svg.append(g);
    return g;
  }
  function line(svg, x1, y1, x2, y2, cls, id, both) {
    const ln = S.svg("line", { x1, y1, x2, y2, class: "edge " + (cls || ""), "marker-end": id ? `url(#${id})` : null, "marker-start": both && id ? `url(#${id})` : null });
    ln.style.color = cls ? "var(--c)" : "var(--line)";
    svg.append(ln);
    return ln;
  }

  /* ---------- mount ---------- */
  function mount(root) {
    // реализации
    const ib = root.querySelector("#impl"), idd = root.querySelector("#impl-d");
    const btns = IMPL.map((I, i) => h("button", { class: "card", "aria-pressed": i === 0 ? "true" : "false", onclick: () => pick(i) },
      h("span", { class: "eyebrow", text: "ISA: RV32I" }), h("h4", { text: I.t }), h("p", { text: I.s })));
    ib.append(...btns);
    function pick(i) { btns.forEach((b, j) => b.setAttribute("aria-pressed", i === j ? "true" : "false")); idd.innerHTML = `<p>${IMPL[i].d}</p><p class="muted">Програмно наблюдаваното поведение е еднакво; времевите характеристики — не. Схемата не твърди еднакво време за всички входове.</p>`; }
    pick(0);

    // симулатор на шината
    S.viz(root.querySelector("#v-bus"), {
      id: "bus", title: "Път на инструкциите и данните — такт по такт", sub: "F — извличане на инструкция, D — достъп до данни",
      code: "ch01_bus",
      inputs: [{ id: "prog", label: "Програма (A, L, S)", value: "LAAS", width: "12em" },
        { id: "arch", label: "Организация", type: "select", value: "vonneumann", options: [["vonneumann", "фон Нойман"], ["harvard", "Харвард"]] }],
      presets: [{ label: "Само аритметика", values: { prog: "AAAA" } }, { label: "Само LOAD", values: { prog: "LLLL" } }, { label: "Смесена", values: { prog: "LASALASA" } }],
      random: () => ({ prog: Array.from({ length: S.randInt(4, 10) }, () => "AALS"[S.randInt(0, 3)]).join("") }),
      legend: [["s-act", "извличане (F)"], ["s-piv", "данни (D)"], ["s-swap", "F чака шината"]],
      build: algos.run_bus,
      draw(st, f) {
        st.innerHTML = "";
        const W = 620, H = 190, id = "ar" + (mk++);
        const svg = S.svg("svg", { class: "g", viewBox: `0 0 ${W} ${H}`, width: W });
        arrowDefs(svg, id);
        box(svg, 20, 60, 120, 70, "CPU", "s-act", f.next < f.p.length ? `следв.: I${f.next + 1}` : "всички извлечени");
        const fOn = f.bus === "f", dOn = f.bus === "d", xOn = f.bus === "x";
        if (f.harvard) {
          box(svg, 440, 10, 160, 60, "Памет за инструкции", fOn ? "s-act" : "");
          box(svg, 440, 120, 160, 60, "Памет за данни", dOn ? "s-piv" : "");
          line(svg, 140, 80, 438, 40, fOn ? "s-act" : "", id, true);
          line(svg, 140, 110, 438, 150, dOn ? "s-piv" : "", id, true);
          svg.append(S.svg("text", { x: 290, y: 50, "text-anchor": "middle", class: "wt", text: "шина за инструкции" }));
          svg.append(S.svg("text", { x: 290, y: 150, "text-anchor": "middle", class: "wt", text: "шина за данни" }));
        } else {
          box(svg, 440, 50, 160, 90, "Обща памет", dOn ? "s-piv" : fOn ? "s-act" : xOn ? "s-swap" : "", "инструкции + данни");
          line(svg, 140, 95, 438, 95, dOn ? "s-piv" : fOn ? "s-act" : xOn ? "s-swap" : "", id, true);
          svg.append(S.svg("text", { x: 290, y: 85, "text-anchor": "middle", class: "wt", text: "обща шина" }));
          if (xOn) svg.append(S.svg("text", { x: 290, y: 125, "text-anchor": "middle", fill: "var(--st-swap)", text: "F чака — шината е заета" }));
        }
        st.append(svg);
        // времева таблица
        const n = f.hist.length;
        const tb = h("table", { class: "t grid" });
        tb.append(h("tr", null, h("th", { text: "такт" }), ...f.hist.map((_, k) => h("th", { text: k + 1 }))));
        const rowF = h("tr", null, h("th", { text: f.harvard ? "шина I" : "шина (F)" }));
        const rowD = h("tr", null, h("th", { text: f.harvard ? "шина D" : "шина (D)" }));
        f.hist.forEach((c, k) => {
          const last = k === n - 1 && !f.done;
          rowF.append(h("td", { class: c.f != null ? (last ? "s-act" : "") : c.conf ? "s-swap" : "", text: c.f != null ? "I" + (c.f + 1) : c.conf ? "чака" : "" }));
          rowD.append(h("td", { class: c.d != null ? (last ? "s-piv" : "") : "", text: c.d != null ? "I" + (c.d + 1) : "" }));
        });
        tb.append(rowF, rowD);
        st.append(h("div", { class: "tbl-wrap" }, tb));
        if (f.done) {
          const other = algos.run_bus({ prog: f.p, arch: f.harvard ? "vonneumann" : "harvard" }).result[0];
          st.append(h("p", { class: "muted", html: `Същата програма при ${f.harvard ? "фон Нойман" : "Харвард"}: <b>${other}</b> такта.` }));
        }
      },
    });

    // смесена организация
    const mx = root.querySelector("#mixed");
    {
      const W = 520, H = 170, id = "mx" + (mk++);
      const svg = S.svg("svg", { class: "g", viewBox: `0 0 ${W} ${H}`, width: W });
      arrowDefs(svg, id);

<script>
/* Раздел 2 — вътрешността на CPU: АЛУ (събиране бит по бит, флагове, логически операции),
   УУ и едноцикличен датапът за ADD, ADDI, LW, SW, BEQ (RV32I). */
(function () {
  const S = window.Study, h = S.h;

  /* ---------- чисти функции ---------- */
  const u8 = (v, name) => S.int(v, 0, 255, name);
  const bin8 = (v) => (v & 255).toString(2).padStart(8, "0");
  const hex = (v) => "0x" + (v >>> 0).toString(16).toUpperCase();

  /* кодиране на RV32I (за показване на машинния код) */
  const INSTR = {
    add: { asm: "ADD x3, x1, x2", ir: 0x002081B3 },
    addi: { asm: "ADDI x5, x5, 1", ir: 0x00128293 },
    lw: { asm: "LW x5, 4(x4)", ir: 0x00422283 },
    sw: { asm: "SW x5, 4(x4)", ir: 0x00522223 },
    beq: { asm: "BEQ x1, x2, +16", ir: 0x00208863 },
  };
  const IBASE = 0x1000, DBASE = 0x2000;
  function sext(x, bits) { const m = 2 ** (bits - 1); x = x % (2 * m); return x >= m ? x - 2 * m : x; }
  function immOf(ir) {
    const op = ir & 0x7f;
    if (op === 0x13 || op === 0x03) return sext(ir >>> 20, 12);
    if (op === 0x23) return sext(((ir >>> 25) << 5) | ((ir >>> 7) & 0x1f), 12);
    if (op === 0x63) return sext(((ir >>> 31) << 12) | (((ir >>> 7) & 1) << 11) | (((ir >>> 25) & 0x3f) << 5) | (((ir >>> 8) & 0xf) << 1), 13);
    return 0;
  }
  function control(opcode) {
    const k = { reg_write: 0, alu_src: 0, mem_read: 0, mem_write: 0, mem_to_reg: 0, branch: 0, alu_op: "+" };
    let tag = null;
    switch (opcode) {
      case 0x33: k.reg_write = 1; tag = "c_r"; break;
      case 0x13: k.reg_write = 1; k.alu_src = 1; tag = "c_i"; break;
      case 0x03: k.reg_write = 1; k.alu_src = 1; k.mem_read = 1; k.mem_to_reg = 1; tag = "c_lw"; break;
      case 0x23: k.alu_src = 1; k.mem_write = 1; tag = "c_sw"; break;
      case 0x63: k.branch = 1; k.alu_op = "-"; tag = "c_b"; break;
    }
    return { k, tag };
  }

  const algos = {
    /** Същото като alu8_add() в c/02_cpu.c */
    alu_add({ a, b }) {
      a = u8(a, "A"); b = u8(b, "B");
      const F = [];
      let carry = 0, cmsb = 0, r = 0;
      const carries = Array(9).fill(null), sums = Array(8).fill(null);
      carries[0] = 0;
      const snap = (o) => F.push(Object.assign({ a, b, r, carries: carries.slice(), sums: sums.slice() }, o));
      snap({ at: "init", vars: { a, b, carry }, msg: `A = ${bin8(a)}₂ = ${a}, B = ${bin8(b)}₂ = ${b}. Събираме бит по бит отдясно наляво; входният пренос е 0.` });
      for (let i = 0; i < 8; i++) {
        const ai = (a >> i) & 1, bi = (b >> i) & 1;
        snap({ at: ["bits", "loop"], col: i, vars: { i, ai, bi, carry }, msg: `Бит ${i}: aᵢ = ${ai}, bᵢ = ${bi}, входящ пренос = ${carry}.` });
        const s = ai ^ bi ^ carry;
        if (i === 7) cmsb = carry;
        const nc = (ai & bi) | (ai & carry) | (bi & carry);
        sums[i] = s; carry = nc; carries[i + 1] = nc;
        r |= s << i;
        snap({ at: i === 7 ? ["sum", "msb"] : ["sum", "carry"], col: i, vars: { i, s, carry, r }, msg: `sᵢ = ${ai} ⊕ ${bi} ⊕ ${carries[i]} = <b>${s}</b>; изходящ пренос = мнозинство(${ai}, ${bi}, ${carries[i]}) = <b>${nc}</b>.${i === 7 ? ` Преносът <i>в</i> старшия бит беше ${cmsb}.` : ""}`, log: `бит ${i}: s=${s} c=${nc}` });
      }
      const C = carry, V = cmsb ^ carry, Z = r === 0 ? 1 : 0, N = (r >> 7) & 1;
      snap({ at: "flagc", done: true, flags: { C }, vars: { r, C }, msg: `<b>C = ${C}</b>: ${C ? "има пренос извън 8-те бита — резултатът без знак не се побира" : "няма пренос извън 8-те бита"}.` });
      snap({ at: "flagv", done: true, flags: { C, V }, vars: { r, C, V }, msg: `<b>V = ${V}</b> = (пренос в старшия бит ${cmsb}) ⊕ (пренос от него ${C}). ${V ? "Знаково препълване: два операнда с еднакъв знак дават резултат с друг знак." : "Няма знаково препълване."}` });
      snap({ at: ["flagz", "flagn"], done: true, flags: { C, V, Z, N }, vars: { r, C, V, Z, N }, msg: `Z = ${Z}, N = ${N}. Резултат: ${bin8(r)}₂ = <b>${r}</b> без знак = <b>${r > 127 ? r - 256 : r}</b> в допълнителен код.`, log: `= ${r} C=${C} V=${V} Z=${Z} N=${N}` });
      return { frames: F, result: `${r} C=${C} V=${V} Z=${Z} N=${N}` };
    },
    alu_logic(a, b, op) { a &= 255; b &= 255; return op === "&" ? a & b : op === "|" ? a | b : op === "^" ? a ^ b : 0; },

    /** Един такт на едноцикличния датапът — същото като cycle() в c/02_cpu.c */
    datapath({ instr, x1, x2, x5, m }) {
      const I = INSTR[instr];
      if (!I) throw new Error("Непозната инструкция.");
      x1 = S.int(x1, -2147483648, 2147483647, "x1"); x2 = S.int(x2, -2147483648, 2147483647, "x2");
      x5 = S.int(x5, -2147483648, 2147483647, "x5"); m = S.int(m, -2147483648, 2147483647, "Думата в 0x2004");
      const x = Array(32).fill(0); x[1] = x1 | 0; x[2] = x2 | 0; x[4] = DBASE; x[5] = x5 | 0;
      const mem = { [DBASE + 4]: m | 0 };
      let pc = IBASE;
      const F = [], ir = I.ir;
      const snap = (o) => F.push(Object.assign({ instr, asm: I.asm, x: x.slice(), mem: { ...mem }, pc }, o));
      snap({ at: "if", act: ["pc", "imem"], vars: { pc: hex(pc) }, msg: `<b>Извличане.</b> PC = ${hex(pc)} → паметта за инструкции връща 32-битовата дума ${hex(ir)} = <code>${I.asm}</code>.` });
      const opcode = ir & 0x7f;
      const { k, tag } = control(opcode);
      const rd = (ir >>> 7) & 31, rs1 = (ir >>> 15) & 31, rs2 = (ir >>> 20) & 31;
      snap({ at: ["dec", tag], act: ["cu"], ctrl: k, vars: { opcode: hex(opcode), rd, rs1, rs2 }, msg: `<b>Декодиране.</b> opcode = ${hex(opcode)} → УУ вдига сигналите: ${Object.entries(k).filter(([n, v]) => n !== "alu_op" && v).map(([n]) => n).join(", ") || "—"}; АЛУ: „${k.alu_op}“.` });
      const imm = immOf(ir);
      const a = x[rs1], b = x[rs2];
      snap({ at: ["rf", "imm"], act: ["rf", "imm"], ctrl: k, vars: { rs1: `x${rs1} = ${a}`, rs2: `x${rs2} = ${b}`, imm }, msg: `<dfn data-g=\"register file\">Регистровият файл</dfn> чете x${rs1} = ${a} и x${rs2} = ${b} (два порта за четене). Генераторът на константа дава imm = ${imm}.` });
      const opb = k.alu_src ? imm : b;
      snap({ at: "mux", act: ["mux"], ctrl: k, vars: { alu_src: k.alu_src, opB: opb }, msg: `<dfn data-g="mux">MUX</dfn> пред вход B на АЛУ: alu_src = ${k.alu_src} → B = ${k.alu_src ? "imm" : "x" + rs2} = <b>${opb}</b>.` });
      const y = k.alu_op === "+" ? (a + opb) | 0 : (a - opb) | 0, zero = y === 0;
      snap({ at: "alu", act: ["alu"], ctrl: k, vars: { y: k.mem_read || k.mem_write ? hex(y) : y, zero }, msg: k.branch ? `АЛУ изважда: ${a} − ${opb} = ${y} → zero = <b>${zero}</b>. Това е сравнението „равни ли са“.` : k.mem_read || k.mem_write ? `АЛУ събира база и отместване: ${hex(a)} + ${opb} = <b>${hex(y)}</b> — това е <dfn data-g="ефективен адрес">ефективният адрес</dfn>, не стойност.` : `АЛУ: ${a} + ${opb} = <b>${y}</b>.` });
      let mdata = 0;
      if (k.mem_read) { mdata = (y >= DBASE && y + 4 <= DBASE + 64 && !(y & 3)) ? (mem[y] || 0) : 0; snap({ at: "mem", act: ["dmem"], ctrl: k, vars: { addr: hex(y), data: mdata }, msg: `<b>Четене</b> на думата от адрес ${hex(y)}: ${mdata}. Адресът избира мястото; ${mdata} е съдържанието.` }); }
      else if (k.mem_write) { if (y >= DBASE && y + 4 <= DBASE + 64 && !(y & 3)) mem[y] = b; snap({ at: "mem", act: ["dmem"], ctrl: k, vars: { addr: hex(y), data: b }, msg: `<b>Запис</b> на x${rs2} = ${b} в адрес ${hex(y)}. Няма запис в целеви регистър.` }); }
      else snap({ at: "mem", act: [], ctrl: k, vars: {}, msg: "Етап памет: mem_read = mem_write = 0 — паметта за данни не се използва." });
      if (k.reg_write && rd !== 0) {
        x[rd] = k.mem_to_reg ? mdata : y;
        snap({ at: "wb", act: ["wbmux", "rf"], ctrl: k, vars: { [`x${rd}`]: x[rd] }, msg: `<b>Обратен запис:</b> mem_to_reg = ${k.mem_to_reg} → x${rd} ← ${k.mem_to_reg ? "данните от паметта" : "резултата на АЛУ"} = <b>${x[rd]}</b>.` });
      } else snap({ at: "wb", act: [], ctrl: k, vars: {}, msg: `reg_write = 0 — ${k.branch ? "разклонението" : "STORE"} не записва регистър.` });
      const npc = k.branch && zero ? (pc + imm) >>> 0 : (pc + 4) >>> 0;
      snap({ at: "pc", act: ["pcmux", "pc"], ctrl: k, done: true, vars: { pc: hex(npc) }, msg: k.branch ? `branch = 1 и zero = ${zero} → PC = ${zero ? `${hex(pc)} + ${imm} = <b>${hex(npc)}</b> (взето)` : `${hex(pc)} + 4 = <b>${hex(npc)}</b> (не е взето)`}.` : `Следващ последователен адрес: PC = ${hex(pc)} + 4 = <b>${hex(npc)}</b>.`, log: `${I.asm}: pc=${hex(npc)}` });
      pc = npc;
      F[F.length - 1].pc = pc;
      return { frames: F, result: `pc=${hex(pc)} x3=${x[3] | 0} x5=${x[5] | 0} m=${(mem[DBASE + 4] ?? 0) | 0}` };
    },
  };

  /* ---------- съдържание ---------- */
  const html = `
<div class="prose">
  <p><dfn data-g="cpu">CPU</dfn> е централният процесор. За да се разбере изпълнението на програма, трябва да се разграничат три функции: <b>съхраняване</b> на текущи стойности в регистри, <b>преобразуване</b> на стойности от изпълняващи блокове и <b>управление</b> на избора и последователността. Блоковете по-долу показват функции на изрично опростен учебен процесор, а не задължителни физически граници във всеки чип.</p>
</div>

<div class="block" style="min-width:0">
  <h3>АЛУ изпълнява избрана операция</h3>
  <p class="prose"><dfn data-g="алу">АЛУ</dfn> получава <dfn data-g="операнд">операнди</dfn> и код за избор на операция. Резултатът може да е сума, побитова логическа операция, изместване или резултат от сравнение. АЛУ не избира самостоятелно коя инструкция следва: <dfn data-g="уу">УУ</dfn> подава изборите, а регистрите предоставят и приемат стойности.</p>
  <div id="v-alu"></div>
  <div id="logic" style="display:grid;gap:10px;min-width:0"></div>
  <details class="hint"><summary>Хинт: как се смята V</summary><div>
    <p>При събиране в допълнителен код препълване има точно когато двата операнда имат еднакъв знак, а резултатът — различен. Еквивалентно: преносът <i>в</i> старшия бит се различава от преноса <i>от</i> него. Точно това прави редът <code>o.v = c_into_msb ^ carry</code>.</p>
  </div></details>
  <details class="trap"><summary>Капан: carry и signed overflow едно и също ли са?</summary><div>
    <p>Не. <dfn data-g="флаг">Флаговете</dfn> <dfn data-g="carry">C</dfn> и <dfn data-g="signed overflow">V</dfn> описват различни свойства. При 8-битово 255 + 1 има пренос извън осемте бита (C = 1), а резултатът 0 е без знаково препълване. При знаково 127 + 1 битовият шаблон е 10000000₂ = −128: V = 1, но няма пренос (C = 0). Пусни двата бутона в симулатора.</p>
    <p>Наличието и имената на статусни флагове са архитектурно зависими. <b>RV32I няма общ регистър с аритметични флагове</b> — ADD записва ниските 32 бита, а условията се проверяват със сравнения и разклонения. Блоковата схема с флагове обяснява функция, а не обещава еднакъв набор регистри.</p>
  </div></details>
</div>

<div class="block">
  <h3>УУ декодира и координира; регистрите пазят стойности</h3>
  <p class="prose">Декодерът разглежда полета като <dfn data-g="opcode">opcode</dfn> и номерата на регистри. Логиката за управление определя кой вход на <dfn data-g="mux">мултиплексор</dfn> да се използва, каква операция да извърши АЛУ, дали да се чете или записва памет и дали регистър да приеме резултата. <dfn data-g="datapath">Датапътят</dfn> е съвкупността от блоковете и връзките; управлението избира как да бъде използван.</p>
  <p class="prose">Симулаторът е учебен едноцикличен датапът за пет реални RV32I инструкции (машинният код е истинският). Начално състояние: PC = 0x1000, x4 = 0x2000, думата в 0x2004 се задава. Проследи как <b>една</b> инструкция минава през блоковете и кои управляващи сигнали са вдигнати.</p>
  <div id="v-dp"></div>
  <div class="tbl-wrap"><table class="t" id="ctrl-tbl"></table></div>
  <details class="hint"><summary>Хинт: ADD, LOAD и STORE са функционално различни</summary><div>
    <p>За ADD са нужни два регистрови операнда и запис в регистър. За LOAD — адрес, заявка за четене и запис на върнатата стойност. За STORE — адрес и запис към паметта, без запис на прочетен резултат в целеви регистър. Таблицата с управляващите сигнали показва точно тази разлика.</p>
    <p>Последователността LW x5, 4(x4) → ADDI x5, x5, 1 → SW x5, 4(x4) е „зареди, промени, запиши“: при x4 = 0x2000 и дума 42 в 0x2004 се получава 43 обратно в паметта. Пусни трите поред, като въвеждаш резултата от предишната.</p>
    <p>В реално ядро зарежданията и записите обслужва <dfn data-g="lsu">LSU</dfn>: интерфейсът към паметта отчита момента на заявката, готовността и евентуална грешка, а CPU не може да използва заредена стойност, която още не е пристигнала.</p>
  </div></details>
  <details class="trap"><summary>Капан: една инструкция означава ли един такт?</summary><div>
    <p>Не като общ закон. Fetch, decode, execute и write-back са логически действия. Този едноцикличен учебен модел изпълнява всичко за един дълъг такт; при Ibex има конкретен конвейер; инструкция може да чака отговор от паметта или многотактово изпълнение. Тактът не е команда „извърши цяла инструкция“.</p>
  </div></details>
  <details class="trap"><summary>Капан: регистрите адреси в RAM ли са? PC — номер на ред?</summary><div>
    <p>Регистровият номер x3 не е адрес 3 в RAM; регистърът може да <i>съдържа</i> адрес като стойност. PC не е „номер на следващия ред от изходния код“: един ред на език от високо ниво може да стане много инструкции. И PC + 4 не е универсално правило: 16-битова компресирана RISC-V инструкция е с дължина 2 байта.</p>
  </div></details>
</div>

<div class="block">
  <h3>Роли на регистрите</h3>
  <div class="tbl-wrap"><table class="t" id="regs"></table></div>
  <p class="prose muted"><dfn data-g="mar">MAR</dfn> и <dfn data-g="mdr">MDR</dfn> са учебни имена; ролята на SP за x2 в RISC-V идва от програмното споразумение (<dfn data-g="abi">ABI</dfn>), не от самите инструкции. Таблицата различава роли, а не задължителен физически списък. Имената и видимостта зависят от архитектурата и реализацията.</p>
</div>

<div class="block">
  <h3>Ядро, кеш и цял чип</h3>
  <p class="prose"><dfn data-g="ядро">Ядрото</dfn> е изпълняващият процесорен блок; чипът може да съдържа едно или много ядра и други подсистеми. <dfn data-g="mcu">MCU</dfn> обикновено интегрира ядро, памети и периферия; <dfn data-g="soc">SoC</dfn> е по-общо понятие. В реален Cortex-M0 има <dfn data-g="nvic">NVIC</dfn> и <dfn data-g="ahb">AHB</dfn>-Lite интерфейс (от семейството <dfn data-g="amba">AMBA</dfn>) — блоковият чертеж е по-богат от АЛУ плюс УУ. Изпълняващата част може да съдържа <dfn data-g="fpu">FPU</dfn>, множители, делители и SIMD блокове; операция по ISA и физически блок не са едно към едно.</p>
  <details class="hint"><summary>Хинт: комбинационна логика и регистри</summary><div>
    <p>Комбинационната логика формира изходи от текущите входове, а регистрите запазват състояние при определени събития на тактовия сигнал. При конвейер различни инструкции заемат различни етапи едновременно — виж <a href="#konveier">раздел 5</a>.</p>
  </div></details>
</div>

<div class="key"><b>За запомняне.</b> АЛУ преобразува; УУ избира; регистрите пазят. Данни, адрес и управляващ сигнал могат да са все битове, но имат различна роля. C ≠ V; адрес ≠ стойност; инструкция ≠ такт.</div>`;

  const REGS = [
    ["GPR", "gpr", "операнди, адреси, междинни резултати", "x1…x31 в RV32I"],
    ["PC", "брояч на командите", "адрес, свързан с текущата инструкция", "0x1000 → 0x1004"],
    ["IR", "ir", "извлечената инструкция (учебно име)", "0x002081B3"],
    ["SP", "sp", "указател към стека", "x2 по програмното споразумение на RISC-V"],
    ["ACC", "acc", "подразбиращ се регистър (не е универсален)", "акумулаторни архитектури"],
    ["MAR / MDR", "mar", "адрес / данни при паметен обмен (учебни имена)", "0x2004 / 42"],
  ];

  /* ---------- рисуване на датапъта ---------- */
  let mk = 0;
  function drawDP(st, f) {
    st.innerHTML = "";
    const W = 720, H = 300, id = "dp" + (mk++);
    const svg = S.svg("svg", { class: "g", viewBox: `0 0 ${W} ${H}`, width: W });
    const d = S.svg("defs");
    d.append(S.svg("marker", { id, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 6, markerHeight: 6, orient: "auto" }, S.svg("path", { d: "M0,0 L10,5 L0,10 z", fill: "currentColor" })));
    svg.append(d);
    const act = new Set(f.act || []);
    const B = (key, x, y, w, hh, lab, sub) => {
      const g = S.svg("g", { class: "node " + (act.has(key) ? (key === "dmem" ? "s-piv" : key === "cu" ? "s-cmp" : "s-act") : "") });
      g.append(S.svg("rect", { x, y, width: w, height: hh, rx: 5, fill: "var(--cb, var(--panel))", stroke: "var(--c, var(--ink-2))", "stroke-width": 2 }));
      g.append(S.svg("text", { x: x + w / 2, y: y + hh / 2 + (sub ? -2 : 5), "text-anchor": "middle", "font-weight": 600, "font-size": 12, text: lab }));
      if (sub) g.append(S.svg("text", { x: x + w / 2, y: y + hh / 2 + 13, "text-anchor": "middle", class: "wt", "font-size": 11, text: sub }));
      svg.append(g);
    };
    const L = (pts, on, dash) => {
      const p = S.svg("polyline", { points: pts, class: "edge " + (on ? "s-act" : ""), "marker-end": `url(#${id})`, "stroke-dasharray": dash ? "5 4" : null });
      p.style.color = on ? "var(--c)" : "var(--line)";
      svg.append(p);
    };
    const k = f.ctrl || {};
    B("pc", 10, 120, 50, 50, "PC", "0x" + (f.pc >>> 0).toString(16));
    B("imem", 80, 105, 90, 80, "Памет I", "инструкции");
    B("cu", 210, 10, 120, 46, "УУ", "декодер + управл.");
    B("rf", 210, 100, 110, 90, "Рег. файл", "2 чет. / 1 зап.");
    B("imm", 210, 215, 110, 40, "imm ген.");
    B("mux", 350, 150, 40, 60, "MUX");
    B("alu", 420, 100, 80, 90, "АЛУ", k.alu_op ? "„" + k.alu_op + "“" : "");
    B("dmem", 530, 100, 90, 90, "Памет D", "данни");
    B("wbmux", 645, 120, 40, 60, "MUX");
    B("pcmux", 10, 220, 60, 40, "PC+4 / +imm");
    const on = (k2) => act.has(k2);
    L("60,145 78,145", on("imem"));
    L("170,145 208,145", on("rf"));
    L("170,130 190,130 190,33 208,33", on("cu"), true);
    L("170,165 190,165 190,235 208,235", on("imm"));
    L("320,125 418,125", on("alu"));
    L("320,165 348,165", on("mux"));
    L("320,235 340,235 340,195 348,195", on("mux") && k.alu_src);
    L("390,180 418,180", on("alu"));
    L("500,145 528,145", on("dmem"));
    L("500,115 515,115 515,85 635,85 635,135 643,135", on("wbmux") && !k.mem_to_reg);
    L("620,160 643,160", on("wbmux") && k.mem_to_reg);
    L("665,180 665,285 265,285 265,192", on("wbmux"));
    L("320,180 330,180 330,270 515,270 515,190", on("dmem") && k.mem_write);
    L("40,218 40,172", on("pc"));
    // управляващи сигнали
    const sig = ["reg_write", "alu_src", "mem_read", "mem_write", "mem_to_reg", "branch"];
    sig.forEach((s, i) => {
      const v = k[s];
      svg.append(S.svg("text", { x: 345 + (i % 3) * 125, y: 22 + Math.floor(i / 3) * 18, "font-size": 11, fill: v ? "var(--st-cmp)" : "var(--muted)", "font-weight": v ? 700 : 400, text: `${s}=${v == null ? "·" : v}` }));
    });
    st.append(svg);
    // регистри и памет
    const regs = [1, 2, 3, 4, 5].map((r) => `x${r} = ${r === 4 ? "0x" + (f.x[r] >>> 0).toString(16) : f.x[r] | 0}`).join(" · ");
    st.append(h("p", { class: "mono", style: { fontSize: ".85rem" }, text: `${f.asm}   |   ${regs}   |   mem[0x2004] = ${(f.mem[DBASE + 4] ?? 0) | 0}` }));
  }

  /* ---------- mount ---------- */
  function mount(root) {
    // АЛУ
    S.viz(root.querySelector("#v-alu"), {
      id: "alu", title: "8-битово събиране в АЛУ — бит по бит, с флагове", sub: "Учебен 8-битов модел; флаговете C, V, Z, N са учебни",
      code: "ch02_alu_add",
      inputs: [{ id: "a", label: "A (0..255)", type: "number", value: 5, width: "6em" }, { id: "b", label: "B (0..255)", type: "number", value: 3, width: "6em" }],
      presets: [{ label: "255 + 1 (carry)", values: { a: 255, b: 1 } }, { label: "127 + 1 (overflow)", values: { a: 127, b: 1 } }, { label: "128 + 128 (C и V)", values: { a: 128, b: 128 } }, { label: "200 + 100", values: { a: 200, b: 100 } }],
      random: () => ({ a: S.randInt(0, 255), b: S.randInt(0, 255) }),
      legend: [["s-act", "текущ бит"], ["s-cmp", "пренос"], ["s-done", "готов бит"], ["s-swap", "вдигнат флаг"]],
      build: algos.alu_add,
      draw(st, f) {
        st.innerHTML = "";
        const tb = h("table", { class: "t grid" });
        const hdr = h("tr", null, h("th", { text: "" }));
        for (let i = 7; i >= 0; i--) hdr.append(h("th", { text: "b" + i }));
        hdr.append(h("th", { text: "дес." }));
        tb.append(hdr);
        const cr = h("tr", null, h("th", { text: "пренос" }));
        for (let i = 7; i >= 0; i--) cr.append(h("td", { class: f.carries[i] ? "s-cmp" : "", text: f.carries[i] == null ? "" : f.carries[i] }));
        cr.append(h("td", { class: f.carries[8] ? "s-swap" : "", text: f.carries[8] == null ? "" : "C→" + f.carries[8] }));
        tb.append(cr);
        const row = (name, v) => {
          const tr = h("tr", null, h("th", { text: name }));
          for (let i = 7; i >= 0; i--) tr.append(h("td", { class: f.col === i ? "s-act" : "", text: (v >> i) & 1 }));
          tr.append(h("td", { text: v }));
          return tr;
        };
        tb.append(row("A", f.a), row("B", f.b));
        const sr = h("tr", null, h("th", { text: "A + B" }));
        for (let i = 7; i >= 0; i--) sr.append(h("td", { class: f.sums[i] == null ? "" : f.col === i ? "s-act" : "s-done", text: f.sums[i] == null ? "" : f.sums[i] }));
        sr.append(h("td", { text: f.sums.every((x) => x != null) ? f.r : "" }));
        tb.append(sr);
        st.append(h("div", { class: "tbl-wrap" }, tb));
        if (f.flags) {
          const fl = h("div", { class: "row", style: { marginTop: "10px" } });
          [["C", "пренос"], ["V", "знак. препълване"], ["Z", "нула"], ["N", "отрицателен"]].forEach(([k, t]) => {
            if (f.flags[k] == null) return;
            fl.append(h("span", { class: "pill " + (f.flags[k] ? "s-swap" : "s-done"), text: `${k} = ${f.flags[k]} · ${t}` }));
          });
          st.append(fl);
        }
      },
    });

    // логически операции — статично: едни входове, различен код
    const lg = root.querySelector("#logic");
    const la = h("input", { type: "number", value: 5, min: 0, max: 255, style: { width: "6em" }, "aria-label": "A" });
    const lb = h("input", { type: "number", value: 3, min: 0, max: 255, style: { width: "6em" }, "aria-label": "B" });
    const lout = h("div", { class: "tbl-wrap" });
    const lmsg = h("p", { class: "muted" });
    function renderLogic() {
      let a, b;
      try { a = u8(la.value, "A"); b = u8(lb.value, "B"); lmsg.textContent = "Едни и същи входове дават различни резултати според управляващия код."; }
      catch (e) { lmsg.textContent = e.message; lout.innerHTML = ""; return; }
      const tb = h("table", { class: "t grid" }, h("tr", null, h("th", { text: "код" }), h("th", { text: "двоично" }), h("th", { text: "десетично" })));
      tb.append(h("tr", null, h("th", { text: "A" }), h("td", { text: bin8(a) }), h("td", { text: a })));
      tb.append(h("tr", null, h("th", { text: "B" }), h("td", { text: bin8(b) }), h("td", { text: b })));
      [["ADD", (a + b) & 255], ["AND", algos.alu_logic(a, b, "&")], ["OR", algos.alu_logic(a, b, "|")], ["XOR", algos.alu_logic(a, b, "^")]].forEach(([n, v]) =>
        tb.append(h("tr", null, h("th", { text: n }), h("td", { class: "s-done", text: bin8(v) }), h("td", { text: v }))));
      lout.innerHTML = ""; lout.append(tb);
    }
    la.addEventListener("input", renderLogic); lb.addEventListener("input", renderLogic);
    lg.append(h("div", { class: "row" }, h("label", { class: "field" }, h("span", { text: "A" }), la), h("label", { class: "field" }, h("span", { text: "B" }), lb)), lout, lmsg);
    S.codeView(lg, "ch02_alu_logic", ["sel"]);
    renderLogic();

    // датапът
    S.viz(root.querySelector("#v-dp"), {
      id: "dp", title: "Едноцикличен датапът: една RV32I инструкция през блоковете", sub: "Плътна линия — данни/адрес, пунктир — към УУ; вдигнатите сигнали са оранжеви",
      code: "ch02_datapath",
      inputs: [{ id: "instr", label: "Инструкция", type: "select", value: "add", options: Object.keys(INSTR).map((k) => [k, INSTR[k].asm]) },
        { id: "x1", label: "x1", type: "number", value: 5, width: "7em" }, { id: "x2", label: "x2", type: "number", value: 3, width: "7em" },
        { id: "x5", label: "x5", type: "number", value: 42, width: "7em" }, { id: "m", label: "дума в 0x2004", type: "number", value: 42, width: "7em" }],
      presets: [{ label: "ADD 5 + 3", values: { instr: "add", x1: 5, x2: 3 } }, { label: "LW (42)", values: { instr: "lw", m: 42 } }, { label: "ADDI → 43", values: { instr: "addi", x5: 42 } }, { label: "SW 43", values: { instr: "sw", x5: 43, m: 42 } },
        { label: "BEQ взето", values: { instr: "beq", x1: 7, x2: 7 } }, { label: "BEQ не", values: { instr: "beq", x1: 5, x2: 3 } }],
      legend: [["s-act", "активен блок/път"], ["s-cmp", "УУ"], ["s-piv", "памет за данни"]],
      build: algos.datapath,
      draw: drawDP,
    });

    // таблица на сигналите
    const ct = root.querySelector("#ctrl-tbl");
    const sig = ["reg_write", "alu_src", "mem_read", "mem_write", "mem_to_reg", "branch", "alu_op"];
    ct.append(h("tr", null, h("th", { text: "инструкция" }), ...sig.map((s) => h("th", { class: "mono", text: s }))));
    Object.keys(INSTR).forEach((k) => {
      const c = control(INSTR[k].ir & 0x7f).k;
      ct.append(h("tr", null, h("td", { class: "mono", text: INSTR[k].asm }), ...sig.map((s) => h("td", { class: "mono " + (c[s] === 1 ? "s-cmp" : ""), text: String(c[s]) }))));
    });

    // роли на регистрите
    const rg = root.querySelector("#regs");
    rg.append(h("tr", null, h("th", { text: "Регистър" }), h("th", { text: "Роля" }), h("th", { text: "Пример" })));
    REGS.forEach(([n, g, r, e]) => rg.append(h("tr", null, h("td", null, h("dfn", { "data-g": g, text: n })), h("td", { text: r }), h("td", { class: "mono", text: e }))));
  }

  S.chapter({ id: "cpu", order: 2, num: "2", group: "Основа", title: "CPU: АЛУ, УУ, регистри и пътят на инструкцията",
    lead: "Какво прави всеки блок, защо carry ≠ overflow и как една инструкция минава от PC до записан резултат.", html, mount, algos });
})();

</script>
<script>
/* Раздел 3 — последователна и паралелна обработка: Флин, SISD срещу SIMD,
   конкурентност срещу паралелност (кръгово разпределение), споделена и разпределена памет. */
(function () {
  const S = window.Study, h = S.h;

  /* ---------- чисти функции ---------- */
  const algos = {
    /** Същото като vec_add_sisd / vec_add_simd в c/03_parallel.c */
    vec_add({ n, W, mode }) {
      n = S.int(n, 0, 19, "n"); W = S.int(W, 2, 8, "Ширина W");
      if (![2, 4, 8].includes(W)) throw new Error("Ширината трябва да е 2, 4 или 8 ленти.");
      const a = Array.from({ length: n }, (_, i) => i + 1), b = a.map((x) => 10 * x), c = Array(n).fill(null);
      const F = [];
      let ops = 0;
      const snap = (o) => F.push(Object.assign({ a, b, c: c.slice(), W, mode, stats: { инструкции: ops } }, o));
      if (mode === "sisd") {
        snap({ at: "s_loop", lanes: [], vars: { n, i: 0 }, msg: `SISD: ${n} елемента → очакваме ${n} скаларни събирания.` });
        for (let i = 0; i < n; i++) {
          c[i] = a[i] + b[i]; ops++;
          snap({ at: "s_add", lanes: [i], vars: { i, "c[i]": c[i] }, msg: `Една скаларна инструкция: c[${i}] = ${a[i]} + ${b[i]} = ${c[i]}.`, log: `ADD #${ops}: c[${i}]` });
        }
        snap({ at: "s_ret", lanes: [], done: true, vars: { ops }, msg: `Общо <b>${ops}</b> инструкции за събиране.` });
      } else {
        let i = 0;
        snap({ at: "v_loop", lanes: [], vars: { n, W, i }, msg: `SIMD с ${W} ленти: ⌊${n}/${W}⌋ = ${Math.floor(n / W)} векторни + ${n % W} скаларни за опашката.` });
        for (; i + W <= n; i += W) {
          const lanes = [];
          for (let l = 0; l < W; l++) { c[i + l] = a[i + l] + b[i + l]; lanes.push(i + l); }
          ops++;
          snap({ at: ["v_add", "v_cnt"], lanes, vec: true, vars: { i, W }, msg: `<b>Една</b> векторна инструкция събира ${W} ленти: ${lanes.map((k) => `${a[k]}+${b[k]}`).join(", ")}.`, log: `VADD #${ops}: c[${i}..${i + W - 1}]` });
        }
        for (; i < n; i++) {
          c[i] = a[i] + b[i]; ops++;
          snap({ at: ["t_add", "t_loop"], lanes: [i], vars: { i }, msg: `Опашка: остават по-малко от ${W} елемента — скаларно c[${i}] = ${c[i]}.`, log: `ADD #${ops}: c[${i}] (опашка)` });
        }
        snap({ at: "v_ret", lanes: [], done: true, vars: { ops }, msg: `Общо <b>${ops}</b> инструкции (срещу ${n} при SISD). Операцията е една и съща за всички ленти — данните са различни.` });
      }
      return { frames: F, result: ops, sum: c.reduce((s, x) => s + (x || 0), 0) };
    },

    /** Същото като round_robin() в c/03_parallel.c */
    round_robin({ lens, deps, cores, q }) {
      const len = S.parseNums(lens, { min: 1, max: 9, minLen: 1, maxLen: 6 });
      const n = len.length;
      cores = S.int(cores, 1, 4, "Брой ядра"); q = S.int(q, 0, 9, "Квант");
      const dep = Array(n).fill(-1);
      const dstr = String(deps).trim();
      if (dstr) for (const part of dstr.split(/[\s,;]+/).filter(Boolean)) {
        const m = /^([A-F])<([A-F])$/i.exec(part);
        if (!m) throw new Error(`„${part}“: зависимост се пише като B<A („B чака A“).`);
        const x = m[1].toUpperCase().charCodeAt(0) - 65, y = m[2].toUpperCase().charCodeAt(0) - 65;
        if (x >= n || y >= n) throw new Error(`Задача ${m[x >= n ? 1 : 2].toUpperCase()} не съществува.`);
        if (x === y) throw new Error("Задача не може да чака себе си.");
        dep[x] = y;
      }
      // цикли в зависимостите
      for (let i = 0; i < n; i++) { let k = i, s = 0; while (k >= 0 && s <= n) { k = dep[k]; s++; } if (s > n) throw new Error("Зависимостите образуват цикъл — никоя задача не може да започне."); }
      const L = (i) => String.fromCharCode(65 + i);
      const rem = len.slice(), queued = Array(n).fill(0), fin = Array(n).fill(-1), queue = [];
      const cur = Array(cores).fill(-1), used = Array(cores).fill(0), tl = Array.from({ length: cores }, () => []);
      let done = 0, t = 0;
      const F = [];
      const snap = (o) => F.push(Object.assign({ n, len, rem: rem.slice(), fin: fin.slice(), cores, tl: tl.map((r) => r.slice()), queue: queue.slice(), cur: cur.slice(), t, stats: { време: t, завършени: done } }, o));
      snap({ at: "loop", vars: { cores, q }, msg: `${n} задачи (${len.map((x, i) => L(i) + "=" + x).join(", ")}) върху ${cores} ${cores === 1 ? "ядро" : "ядра"}, квант ${q || "∞ (без отнемане)"}.` });
      while (done < n && t < 200) {
        const add = [];
        for (let i = 0; i < n; i++) if (!queued[i] && (dep[i] < 0 || fin[dep[i]] >= 0)) { queue.push(i); queued[i] = 1; add.push(L(i)); }
        const pre = [];
        for (let k = 0; k < cores; k++) if (cur[k] >= 0 && q > 0 && used[k] === q) { queue.push(cur[k]); pre.push(L(cur[k])); cur[k] = -1; }
        const pick = [];
        for (let k = 0; k < cores; k++) if (cur[k] < 0 && queue.length) { cur[k] = queue.shift(); used[k] = 0; pick.push(`ядро ${k}←${L(cur[k])}`); }
        snap({ at: pre.length ? ["pick", "preempt"] : add.length ? ["pick", "ready"] : "pick", vars: { t }, msg: `Момент ${t}.${add.length ? ` Готови: ${add.join(", ")}.` : ""}${pre.length ? ` Изтекъл квант: ${pre.join(", ")} обратно в опашката.` : ""}${pick.length ? ` Избор: ${pick.join(", ")}.` : ""}` });
        const fn = [];
        for (let k = 0; k < cores; k++) {
          tl[k][t] = cur[k];
          if (cur[k] < 0) continue;
          rem[cur[k]]--; used[k]++;
          if (rem[cur[k]] === 0) { fin[cur[k]] = t + 1; done++; fn.push(L(cur[k])); cur[k] = -1; }
        }
        t++;
        const run = tl.map((r, k) => r[t - 1] >= 0 ? `ядро ${k}: ${L(r[t - 1])}` : `ядро ${k}: празно`).join("; ");
        snap({ at: fn.length ? ["finish", "run"] : "run", vars: { t }, msg: `Единица ${t - 1}→${t}: ${run}.${fn.length ? ` Завършва ${fn.join(", ")}.` : ""}`, log: `t=${t}: ${tl.map((r) => (r[t - 1] >= 0 ? L(r[t - 1]) : "·")).join(" ")}` });
      }
      const busy = tl.reduce((s, r) => s + r.filter((x) => x >= 0).length, 0);
      snap({ at: "ret", done: true, vars: { T: t }, msg: `Край в момент <b>${t}</b>. Сумата от работата е ${len.reduce((a, b) => a + b, 0)}; заетост ${busy}/${t * cores} = ${Math.round((100 * busy) / (t * cores))}%.${cores === 1 ? " На едно ядро задачите са <b>конкурентни</b> (редуват се), но не паралелни." : " Задачи на различни ядра в един момент са <b>паралелни</b>."}` });
      const lines = tl.map((r) => Array.from({ length: t }, (_, k) => (r[k] >= 0 ? L(r[k]) : ".")).join(""));
      return { frames: F, T: t, fin, result: `${t} | ${fin.join(" ")} | ${lines.join(" ")}` };
    },
  };

  /* ---------- съдържание ---------- */
  const html = `
<div class="prose">
  <p>При последователното решаване действията се изпълняват едно след друго. Паралелната обработка изпълнява едновременно части от работата чрез повече изчислителни ресурси. <dfn data-g="конкурентност">Конкурентността</dfn> означава съвместно напредване на задачи и е възможна дори върху едно ядро чрез превключване; <dfn data-g="паралелност">паралелността</dfn> предполага действително едновременно изпълнение.</p>
</div>

<div class="block">
  <h3>Класификацията на Флин — две оси</h3>
  <p class="prose"><dfn data-g="флин">Класификацията на Флин</dfn> разглежда броя потоци от инструкции и данни. <dfn data-g="sisd">SISD</dfn>, <dfn data-g="simd">SIMD</dfn>, <dfn data-g="misd">MISD</dfn> и <dfn data-g="mimd">MIMD</dfn> са четирите клетки. Поток инструкции е последователност от управляващи операции, а поток данни — последователност от обработвани стойности. Щракни клетка.</p>
  <div id="flynn"></div>
  <div class="key" id="flynn-d"></div>
  <details class="trap"><summary>Капан: MISD = конвейер?</summary><div>
    <p>Не. <dfn data-g="misd">MISD</dfn> е рядка формална категория с различни потоци инструкции върху един поток данни. Не трябва да се използва като общо название на конвейера — конвейерът припокрива етапи на <i>последователни</i> инструкции от един поток.</p>
  </div></details>
  <details class="trap"><summary>Капан: CUDA — пети клас?</summary><div>
    <p><dfn data-g="gpu">GPU</dfn> често се програмира чрез <dfn data-g="simt">SIMT</dfn> — нишките в група споделят изпълнение на инструкции, но програмният модел и поведението при разклонения изискват отделно обяснение. CUDA е програмна платформа, а не отделен клас по Флин.</p>
  </div></details>
</div>

<div class="block">
  <h3>SISD срещу SIMD: една инструкция върху няколко ленти</h3>
  <p class="prose"><dfn data-g="simd">SIMD</dfn> прилага една инструкция върху множество елементи и е подходящ за векторни операции. При векторно събиране [1,2,3]+[10,20,30] резултатът е [11,22,33]: позициите са различни данни, действието е общо. Конкретната ширина и типовете зависят от ISA; пример е векторно събиране с Arm NEON.</p>
  <div id="v-simd"></div>
  <details class="hint"><summary>Хинт: защо C кодът има вътрешен цикъл по лентите</summary><div>
    <p>Преносимият C11 няма векторни типове. Вътрешният цикъл <i>изобразява</i> една векторна инструкция — в реален код на Arm това би било например <code>vaddq_s32</code> от NEON (4 × int32). Броячът <code>ops</code> брои тези „инструкции“, а не итерациите на вътрешния цикъл. Компилаторът често сам векторизира такъв цикъл при <code>-O2/-O3</code>.</p>
    <p>Формулата за брой инструкции: ⌊n/W⌋ + (n mod W).</p>
  </div></details>
</div>

<div class="block">
  <h3>MIMD: независими потоци инструкции</h3>
  <p class="prose">При <dfn data-g="mimd">MIMD</dfn> отделни изпълнители могат да напредват по различни инструкции: едно ядро декодира аудио, друго обработва мрежови пакети. Дори ако двете ядра в даден момент случайно изпълняват ADD, организацията не става SIMD — класификацията описва възможността за независимо управление, а не съвпадението на конкретен такт. Многоядрените Intel Core и AMD Ryzen са примери за MIMD на равнище ядра.</p>
  <div id="mimd"></div>
  <details class="hint"><summary>Хинт: може ли процесор да е едновременно MIMD и SIMD?</summary><div>
    <p>Да, когато описваме различни равнища. Независимите ядра са MIMD; векторната операция във всяко ядро е SIMD. Не са дадени две противоположни оценки за едно и също равнище.</p>
  </div></details>
</div>

<div class="block">

  <p class="prose">Две задачи са конкурентни, ако напредъкът им се организира в припокриващи се интервали. На едно ядро това става чрез редуване; паралелността изисква едновременна работа на различни ресурси. Симулаторът разпределя задачи (A–F) кръгово (round robin) върху 1–4 ядра. <b>Квантът</b> е колко единици задачата работи, преди да бъде върната в опашката (0 = до край). Зависимост <code>B&lt;A</code> означава „B чака да завърши A“.</p>

  </div></details>

<div class="key"><b>За запомняне.</b> Флин: две оси — потоци инструкции × потоци данни. SIMD = една операция, много ленти. MIMD = независимо управление. Конкурентност = редуване; паралелност = едновременност. Зависимостите, не ядрата, определят колко паралелизъм има.</div>`;

  const FLYNN = {

      presets: [{ label: "n = 3 (ръководството)", values: { n: 3, W: 4 } }, { label: "n = 16, W = 8", values: { n: 16, W: 8 } }],

        st.append(h("span", { class: "eyebrow", text: "a" })); S.drawArray(st, f.a, { cls, gapAt: gap, append: true, index: false });

    // MIMD
    {

      legend: [["s-act", "работи"], ["s-done", "завършена"], ["s-dim", "празно ядро"]],

            const v = f.tl[c][k];

          }
          tb.append(tr);
        }
        st.append(h("div", { class: "tbl-wrap" }, tb));
        const info = h("div", { class: "row", style: { marginTop: "8px" } });
        for (let i = 0; i < f.n; i++) info.append(h("span", { class: "pill " + (f.fin[i] >= 0 ? "s-done" : f.cur.includes(i) ? "s-act" : ""), text: `${L(i)}: ${f.len[i] - f.rem[i]}/${f.len[i]}${f.fin[i] >= 0 ? " ✓ t=" + f.fin[i] : ""}` }));
        st.append(info);
        st.append(h("p", { class: "muted", text: "Опашка: " + (f.queue.length ? f.queue.map(L).join(" ") : "празна") }));
      },
    });

    // памет
    const MEM = {
      sh: { t: "Споделена памет", d: "Участниците обменят данни чрез общи адреси: ядро 1 записва x, ядро 2 го чете от същия адрес. Нужна е синхронизация, за да се знае кога стойността е готова." },
      di: { t: "Разпределена памет", d: "Всеки възел има собствена памет; обменът е чрез съобщения по мрежа. Адрес в паметта на възел 1 не означава нищо за възел 2." },
      cl: { t: "Клъстер (смесено)", d: "Един клъстер може да комбинира и двете организации: вътре във възела ядрата споделят памет, между възлите — съобщения." },
    };
    const mb = root.querySelector("#mem-btns"), ms = root.querySelector("#mem-svg"), md = root.querySelector("#mem-d");
    const btn = Object.keys(MEM).map((k) => h("button", { class: "btn", text: MEM[k].t, onclick: () => drawMem(k) }));
    mb.append(...btn);
    function drawMem(k) {
      btn.forEach((b, i) => b.setAttribute("aria-pressed", Object.keys(MEM)[i] === k ? "true" : "false"));
      const W = 560, H = 200, id = "mm" + (mk++);

      const d = S.svg("defs"); d.append(S.svg("marker", { id, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 6, markerHeight: 6, orient: "auto-start-reverse" }, S.svg("path", { d: "M0,0 L10,5 L0,10 z", fill: "currentColor" }))); svg.append(d);
      const R = (x, y, w, hh, t, cls) => { const g = S.svg("g", { class: "node " + (cls || "") }); g.append(S.svg("rect", { x, y, width: w, height: hh, rx: 5, fill: "var(--cb, var(--panel))", stroke: "var(--c, var(--ink-2))", "stroke-width": 2 })); g.append(S.svg("text", { x: x + w / 2, y: y + hh / 2 + 5, "text-anchor": "middle", text: t })); svg.append(g); };

        A(150, 40, 208, 40, "s-piv", true); A(330, 40, 388, 40, "s-piv", true);
        svg.append(S.svg("text", { x: 280, y: 175, "text-anchor": "middle", class: "wt", text: "съобщения по мрежа (send / receive)" }));
      } else {

          [0, 1].forEach((i) => { R(x0 + 15 + i * 115, 30, 95, 36, "ядро " + i, "s-act"); A(x0 + 62 + i * 115, 66, x0 + 62 + i * 115, 108, "s-act", true); });

          svg.append(S.svg("text", { x: x0 + 120, y: 172, "text-anchor": "middle", class: "wt", text: "възел " + n }));
        });
        A(260, 128, 298, 128, "s-cmp", true);
      }
      ms.innerHTML = ""; ms.append(svg);
      md.innerHTML = `<p><b>${MEM[k].t}.</b> ${MEM[k].d}</p>`;
    }
    drawMem("sh");
  }

  S.chapter({ id: "paralelna", order: 3, num: "3", group: "Паралелизъм", title: "Последователна и паралелна обработка",
    lead: "Флин като две оси, SIMD срещу SISD в брой инструкции, конкурентност срещу паралелност и организации на паметта.", html, mount, algos });
})();

    REF.forEach((r) => rf.append(h("tr", null, h("td", { class: "mono", text: r[0] }), h("td", { class: "mono", text: r[1] }), h("td", { text: r[2] }))));

      id: "isa", title: "CPU на учебната ISA: регистри, PC, памет", sub: "Кадри: извличане → декодиране → изпълнение",
      code: "ch04_cpu",
      inputs: [{ id: "prog", label: "Програма (редове или „|“)", value: PROGS.array.prog.replace(/\n/g, " | "), width: "34em" }, { id: "mem", label: "Памет (адрес:стойност)", value: PROGS.array.mem, width: "16em" }],
      presets: Object.keys(PROGS).map((k) => ({ label: PROGS[k].t, values: { prog: PROGS[k].prog.replace(/\n/g, " | "), mem: PROGS[k].mem } })),
      legend: [["s-act", "текуща инструкция / записан регистър"], ["s-cmp", "прочетен регистър"], ["s-piv", "клетка на ефективния адрес"], ["s-swap", "грешка"]],

        f.P.forEach((I, k) => pl.append(h("tr", null, h("td", { class: "mono " + (k === f.cur ? (f.err ? "s-swap" : "s-act") : ""), style: k === f.cur ? { outline: "2px solid var(--c)", outlineOffset: "-2px", background: "var(--cb)" } : null, text: (k === f.pc ? "▸" : " ") + String(k).padStart(2) }), h("td", { class: "mono", style: { whiteSpace: "pre" }, text: I.text }))));
        // регистри
        const rg = h("table", { class: "t grid" });
        rg.append(h("tr", null, h("th", { text: "PC" }), h("td", { class: f.phase === "fetch" || (f.cur != null && f.P[f.cur] && ["BEQ", "BNE", "JMP"].includes(f.P[f.cur].op) && f.phase === "exec") ? "s-act" : "", text: f.pc })));
        for (let i = 0; i < NREG; i++) {
          const c = (f.rw || []).includes(i) ? "s-act" : (f.rr || []).includes(i) ? "s-cmp" : "";
          rg.append(h("tr", null, h("th", { text: "R" + i }), h("td", { class: c, text: f.r[i] })));
        }
        wrap.append(h("div", { class: "tbl-wrap" }, h("span", { class: "eyebrow", text: "Памет за инструкции" }), pl), h("div", null, h("span", { class: "eyebrow", text: "Регистри" }), rg));
        st.append(wrap);

        const cls = {};

      },

    {

      const st = [["Извличане", "IR ← mem[PC]"], ["PC ← PC + 1", "или +4 в RV32I"], ["Декодиране", "opcode, операнди"], ["Изпълнение", "АЛУ / памет / преход"]];

      const back = S.svg("polyline", { points: "512,70 512,100 74,100 74,72", class: "edge", "marker-end": `url(#${id})` }); back.style.color = "var(--ink-2)"; svg.append(back);
      svg.append(S.svg("text", { x: 293, y: 115, "text-anchor": "middle", class: "wt", text: "преход или изключение може да промени PC" }));

    }

    rc.append(h("tr", null, h("th", { text: "" }), h("th", null, h("dfn", { "data-g": "risc", text: "RISC" })), h("th", null, h("dfn", { "data-g": "cisc", text: "CISC" }))));
    RC.forEach((r) => rc.append(h("tr", null, ...r.map((x, i) => h(i ? "td" : "th", { text: x })))));
  }

  algos.PROGS = PROGS;
  S.chapter({ id: "isa", order: 4, num: "4", group: "Изпълнение на инструкции", title: "Система от инструкции",
    lead: "ISA като договор, адресни режими и стъпков CPU — извличане, декодиране, изпълнение — синхронно с интерпретатор на C.", html, mount, algos });

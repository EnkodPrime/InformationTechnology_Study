 "ch04_single": {
  "file": "04_list.c",
  "code": "typedef struct SNode { int v; struct SNode *next; } SNode;\n\n/* Добавяне в началото: Θ(1) */\nvoid s_push_front(SNode **head, int x)\n{\n    SNode *n = malloc(sizeof *n);\n    n->v = x;\n    n->next = *head;\n    *head = n;\n}\n\n/* Добавяне в края без tail: първо се търси последният — Θ(n) */\nvoid s_push_back(SNode **head, int x)\n{\n    SNode *n = malloc(sizeof *n);\n    n->v = x;\n    n->next = NULL;\n    if (*head == NULL) { *head = n; return; }\n    SNode *p = *head;\n    while (p->next != NULL) { p = p->next; g_hops++; }\n    p->next = n;\n}\n\n/* Търсене по стойност: O(n). Връща указател или NULL. */\nSNode *s_find(SNode *head, int x, int *index)\n{\n    int i = 0;\n    for (SNode *p = head; p != NULL; p = p->next, i++) {\n        g_cmp++;\n        if (p->v == x) { *index = i; return p; }\n        g_hops++;\n    }\n    *index = -1;\n    return NULL;\n}\n\n/* Вмъкване на x след първия възел със стойност key.\n   Самото свързване е Θ(1); търсенето на P е O(n). */\nint s_insert_after(SNode *head, int key, int x)\n{\n    int i;\n    SNode *P = s_find(head, key, &i);\n    if (P == NULL) return -1;\n    SNode *X = malloc(sizeof *X);\n    X->v = x;\n    X->next = P->next;          /* 1) запазваме остатъка */\n    P->next = X;                /* 2) едва после пренасочваме P */\n    return 0;\n}\n\n/* Изтриване на първия възел със стойност x: нужен е предходният. */\nint s_delete(SNode **head, int x)\n{\n    SNode *prev = NULL, *cur = *head;\n    while (cur != NULL) {\n        g_cmp++;\n        if (cur->v == x) break;\n        prev = cur;\n        cur = cur->next;\n        g_hops++;\n    }\n    if (cur == NULL) return -1;\n    if (prev == NULL) *head = cur->next;   /* първи възел */\n    else prev->next = cur->next;           /* прескачаме cur */\n    free(cur);                     /* след free cur не се ползва */\n    return 0;\n}",

 "ch04_double": {
  "file": "04_list.c",
  "code": "/* Двусвързан кръгов списък със сентинел S:\n   празен списък: S.next == S.prev == &S. Няма NULL указатели и няма специален\n   случай за първи/последен/единствен възел. */\ntypedef struct DNode { int v; struct DNode *prev, *next; } DNode;\n\nvoid d_init(DNode *S) { S->next = S->prev = S; }\n\n/* Вмъкване на нов възел след възела a: Θ(1) */\nstatic void d_link_after(DNode *a, int x)\n{\n    DNode *n = malloc(sizeof *n);\n    n->v = x;\n    n->prev = a;\n    n->next = a->next;\n    a->next->prev = n;\n    a->next = n;\n}\nvoid d_push_front(DNode *S, int x) { d_link_after(S, x); }\nvoid d_push_back(DNode *S, int x)  { d_link_after(S->prev, x); }\n\nDNode *d_find(DNode *S, int x, int *index)\n{\n    int i = 0;\n    for (DNode *p = S->next; p != S; p = p->next, i++) {\n        g_cmp++;                    /* край: връщане до S, не NULL */\n        if (p->v == x) { *index = i; return p; }\n        g_hops++;\n    }\n    *index = -1;\n    return NULL;\n}\nint d_insert_after(DNode *S, int key, int x)\n{\n    int i;\n    DNode *P = d_find(S, key, &i);\n    if (P == NULL) return -1;\n    d_link_after(P, x);\n    return 0;\n}\n/* Откачане на известен възел X: две пренасочвания, Θ(1) */\nint d_delete(DNode *S, int x)\n{\n    int i;\n    DNode *X = d_find(S, x, &i);\n    if (X == NULL) return -1;\n    X->prev->next = X->next;\n    X->next->prev = X->prev;\n    free(X);\n    return 0;\n}",

 "ch05_shape": {
  "file": "05_tree.c",
  "code": "/* full (proper): всеки възел има 0 или 2 деца */\nint is_full(const TNode *r)\n{\n    if (r == NULL) return 1;\n    if ((r->left == NULL) != (r->right == NULL)) return 0;\n    return is_full(r->left) && is_full(r->right);\n}\n/* complete: при обход по нива след първата празна позиция няма възли */\nint is_complete(TNode *r)\n{\n    TNode *q[128];\n    int head = 0, tail = 0, gap = 0;\n    q[tail++] = r;\n    while (head < tail) {\n        TNode *p = q[head++];\n        if (p == NULL) { gap = 1; continue; }\n        if (gap) return 0;                 /* възел след празнина */\n        q[tail++] = p->left;\n        q[tail++] = p->right;\n    }\n    return 1;\n}\n/* perfect: n == 2^(h+1) - 1 */\nint is_perfect(const TNode *r)\n{\n    int h = height(r);\n    return count(r) == (1 << (h + 1)) - 1;\n}",

 "ch05_expr": {
  "file": "05_tree.c",
  "code": "/* Дърво за израз от постфиксен запис: операндите са листа, операциите — вътрешни възли.\n   Построяването използва стек от указатели; изчисляването е следреден обход. */\ntypedef struct ENode { char tok[12]; struct ENode *l, *r; } ENode;\nvoid expr_free(ENode *e);\n\nENode *expr_build(const Op *t)\n{\n    ENode *st[64];\n    int top = 0, bad = 0;\n    for (int i = 0; i < t->n && !bad; i++) {\n        ENode *n = calloc(1, sizeof *n);\n        strncpy(n->tok, t->arg[i], sizeof n->tok - 1);\n        if (strchr(\"+-*/\", n->tok[0]) && n->tok[1] == 0) {\n            if (top < 2) { free(n); bad = 1; break; }   /* липсва операнд */\n            n->r = st[--top];\n            n->l = st[--top];\n        }\n        st[top++] = n;\n    }\n    if (!bad && top == 1) return st[0];\n    while (top) expr_free(st[--top]);      /* грешен запис: освобождаваме */\n    return NULL;\n}\nlong expr_eval(const ENode *e)\n{\n    if (e->l == NULL) return atol(e->tok);  /* лист: операнд */\n    long a = expr_eval(e->l);               /* първо лявото */\n    long b = expr_eval(e->r);               /* после дясното */\n    switch (e->tok[0]) {                    /* накрая корена */\n    case '+': return a + b;\n    case '-': return a - b;\n    case '*': return a * b;\n    default:  return b ? a / b : 0;\n    }\n}",

  "code": "/* Търсене: на всяка стъпка инвариантът изключва цяло поддърво. O(h). */\nBNode *bst_search(BNode *r, int key, int *depth)\n{\n    *depth = 0;\n    while (r != NULL) {\n        g_cmp++;\n        if (key == r->key) return r;\n        g_cmp++;\n        if (key < r->key) r = r->left;     /* дясното отпада */\n        else              r = r->right;    /* лявото отпада */\n        (*depth)++;\n    }\n    return NULL;\n}\n\n/* Вмъкване: същият път като търсенето до празна позиция. O(h). */\nint bst_insert(BNode **link, int key)\n{\n    while (*link != NULL) {\n        BNode *r = *link;\n        g_cmp++;\n        if (key == r->key) return -1;      /* дубликат: политика — отказ */\n        g_cmp++;\n        link = key < r->key ? &r->left : &r->right;\n    }\n    BNode *n = malloc(sizeof *n);\n    n->key = key;\n    n->left = n->right = NULL;\n    *link = n;                             /* закачаме на празното място */\n    return 0;\n}\n\n/* Изтриване — три случая. Работим с адреса на връзката (link), която сочи възела,\n   за да не се налага отделен случай за корена. */\nint bst_delete(BNode **link, int key)\n{\n    while (*link != NULL && (*link)->key != key) {\n        g_cmp += 2;\n        link = key < (*link)->key ? &(*link)->left : &(*link)->right;\n    }\n    if (*link == NULL) return -1;\n    g_cmp++;\n    BNode *x = *link;\n    if (x->left == NULL && x->right == NULL) {\n        *link = NULL;                      /* 1) лист: откачаме */\n    } else if (x->left == NULL || x->right == NULL) {\n        *link = x->left ? x->left : x->right;  /* 2) едно дете: заместваме */\n    } else {\n        /* 3) две деца: симетричният наследник = най-малкият в дясното поддърво */\n        BNode **s = &x->right;\n        while ((*s)->left != NULL) s = &(*s)->left;\n        BNode *y = *s;\n        x->key = y->key;                   /* пренасяме ключа */\n        *s = y->right;                     /* y няма ляво дете */\n        x = y;\n    }\n    free(x);\n    return 0;\n}\n\nint bst_min(const BNode *r) { while (r->left)  r = r->left;  return r->key; }\nint bst_max(const BNode *r) { while (r->right) r = r->right; return r->key; }\nint bst_height(const BNode *r)             /* в ребра; празно = -1 */\n{\n    if (r == NULL) return -1;\n    int a = bst_height(r->left), b = bst_height(r->right);\n    return 1 + (a > b ? a : b);\n}",

  "file": "08_extra.c",
  "code": "/* Min-heap в масив, индексиране от 0: деца на i са 2i+1 и 2i+2, родител (i-1)/2.\n   Форма: complete. Правило: a[родител] <= a[дете]. */\ntypedef struct { int a[64]; int n; } Heap;\n\nstatic void hswap(int *x, int *y) { int t = *x; *x = *y; *y = t; g_swaps++; }\n\nint heap_push(Heap *h, int x)                                /* O(log n) */\n{\n    if (h->n == 64) return -1;\n    int i = h->n++;\n    h->a[i] = x;                           /* следващата свободна позиция */\n    while (i > 0) {\n        int p = (i - 1) / 2;\n        if (h->a[p] <= h->a[i]) break;     /* редът е възстановен */\n        hswap(&h->a[p], &h->a[i]);         /* изкачване */\n        i = p;\n    }\n    return 0;\n}\nint heap_pop(Heap *h, int *out)                              /* O(log n) */\n{\n    if (h->n == 0) return -1;\n    *out = h->a[0];                        /* минимумът е в корена */\n    h->a[0] = h->a[--h->n];                /* последният заема корена */\n    int i = 0;\n    for (;;) {\n        int l = 2 * i + 1, r = l + 1, m = i;\n        if (l < h->n && h->a[l] < h->a[m]) m = l;\n        if (r < h->n && h->a[r] < h->a[m]) m = r;\n        if (m == i) break;\n        hswap(&h->a[i], &h->a[m]);         /* спускане */\n        i = m;\n    }\n    return 0;\n}",

  "code": "/* AVL: BST + |h(left) - h(right)| <= 1 във всеки възел. Височина в ребра, празно = -1. */\ntypedef struct A { int key, h; struct A *l, *r; } A;\n\nstatic int ht(const A *t) { return t ? t->h : -1; }\nstatic void upd(A *t) { int a = ht(t->l), b = ht(t->r); t->h = 1 + (a > b ? a : b); }\nstatic int bf(const A *t) { return ht(t->l) - ht(t->r); }    /* balance factor */\n\nstatic A *rot_right(A *y)                  /* ляво дете x се издига */\n{\n    A *x = y->l;\n    y->l = x->r;\n    x->r = y;\n    upd(y); upd(x); g_rot++;\n    return x;\n}\nstatic A *rot_left(A *x)                   /* дясно дете y се издига */\n{\n    A *y = x->r;\n    x->r = y->l;\n    y->l = x;\n    upd(x); upd(y); g_rot++;\n    return y;\n}\nA *avl_insert(A *t, int key)\n{\n    if (t == NULL) {\n        A *n = malloc(sizeof *n);\n        n->key = key; n->h = 0; n->l = n->r = NULL;\n        return n;\n    }\n    if (key < t->key)      t->l = avl_insert(t->l, key);\n    else if (key > t->key) t->r = avl_insert(t->r, key);\n    else return t;                         /* дубликат: без промяна */\n    upd(t);\n    int b = bf(t);\n    if (b > 1 && key < t->l->key)  return rot_right(t);                 /* ляво-ляво */\n    if (b < -1 && key > t->r->key) return rot_left(t);                  /* дясно-дясно */\n    if (b > 1)  { t->l = rot_left(t->l);  return rot_right(t); }        /* ляво-дясно */\n    if (b < -1) { t->r = rot_right(t->r); return rot_left(t); }         /* дясно-ляво */\n    return t;\n}",

<script>
/* Тема 4 — общи функции за рисуване (само за draw; алгоритмите в algos не ги ползват).
 *   T4.tree(stage, root, opts)   двоично дърво: root = {id, key, l, r} (вложено), opts.cls {id: "s-act"}, opts.edge {id: cls} (реброто към id),
 *                                 opts.sub {id: "текст под възела"}, opts.top {id: "текст над"}, opts.ghost [{x:"left"|..}] (не се ползва)
 *   T4.list(stage, st, opts)      свързани възли (кутии и стрелки): st = {nodes: {id: {v, next, prev}}, head, sentinel}
 *   T4.ring(stage, cells, opts)   кръгов буфер като окръжност
 */
(function () {
  const S = window.Study, h = S.h, sv = S.svg;
  const T4 = (window.T4 = {});

  function arrowHead(x, y, ang, cls) {
    const a = 7, w = 4.2;
    const p1 = [x - a * Math.cos(ang) + w * Math.sin(ang), y - a * Math.sin(ang) - w * Math.cos(ang)];
    const p2 = [x - a * Math.cos(ang) - w * Math.sin(ang), y - a * Math.sin(ang) + w * Math.cos(ang)];
    return sv("polygon", { points: `${x},${y} ${p1[0]},${p1[1]} ${p2[0]},${p2[1]}`, class: "ah " + (cls || "") });
  }
  T4.arrowHead = arrowHead;

  /* ---------------- двоично дърво ---------------- */
  T4.tree = function (st, root, o = {}) {
    const box = o.append ? h("div") : st;
    if (!o.append) st.innerHTML = "";
    if (!root) { box.append(h("p", { class: "muted", text: o.emptyText || "Празно дърво (root = NULL)." })); if (o.append) st.append(box); return; }
    const pos = [];
    let ix = 0, maxD = 0;
    (function walk(n, d) { if (!n) return; walk(n.l, d + 1); pos.push({ n, x: ix++, d }); maxD = Math.max(maxD, d); walk(n.r, d + 1); })(root, 0);
    const R = o.r || 17, dx = o.dx || 44, dy = o.dy || 58, padX = 26, padY = (o.top ? 30 : 22);
    const W = Math.max(ix * dx + padX * 2 - dx + 2 * R + (o.nulls ? dx * 0.5 : 0), 120), H = maxD * dy + padY + R * 2 + (o.sub ? 34 : 14) + (o.nulls ? dy * 0.4 : 0);
    const svg = sv("svg", { class: "g t4tree", viewBox: `0 0 ${W} ${H}`, width: W, style: `max-width:100%;height:auto` });
    const P = new Map();
    pos.forEach((p) => P.set(p.n, { x: padX + R + p.x * dx, y: padY + R + p.d * dy }));
    const g1 = sv("g"), g2 = sv("g");
    pos.forEach((p) => {
      const a = P.get(p.n);
      for (const c of [p.n.l, p.n.r]) {
        if (!c) continue;
        const b = P.get(c);
        const ang = Math.atan2(b.y - a.y, b.x - a.x);
        g1.append(sv("line", { x1: a.x + R * Math.cos(ang), y1: a.y + R * Math.sin(ang), x2: b.x - R * Math.cos(ang), y2: b.y - R * Math.sin(ang), class: "edge " + ((o.edge && o.edge[c.id]) || "") }));
      }
      if (o.nulls) for (const [c, side] of [[p.n.l, -1], [p.n.r, 1]]) if (!c) {
        const x = a.x + side * dx * 0.42, y = a.y + dy * 0.55;
        g1.append(sv("line", { x1: a.x + side * R * 0.7, y1: a.y + R * 0.7, x2: x, y2: y - 6, class: "edge nil" }));
        g1.append(sv("text", { x, y: y + 5, "text-anchor": "middle", class: "wt", text: "∅" }));
      }
    });
    pos.forEach((p) => {
      const a = P.get(p.n), cls = (o.cls && o.cls[p.n.id]) || "";
      const g = sv("g", { class: "node " + cls });
      g.append(sv("circle", { cx: a.x, cy: a.y, r: R }));
      const lab = o.label ? o.label(p.n) : String(p.n.key);
      g.append(sv("text", { x: a.x, y: a.y + 4.5, "text-anchor": "middle", style: `font-weight:600;font-size:${lab.length > 3 ? 11 : 13}px`, text: lab }));
      if (o.sub && o.sub[p.n.id] != null) g.append(sv("text", { x: a.x, y: a.y + R + 14, "text-anchor": "middle", class: "wt", text: o.sub[p.n.id] }));
      if (o.top && o.top[p.n.id] != null) g.append(sv("text", { x: a.x, y: a.y - R - 6, "text-anchor": "middle", class: "lbl", text: o.top[p.n.id] }));
      if (o.onclick) { g.style.cursor = "pointer"; g.addEventListener("click", () => o.onclick(p.n)); }
      g2.append(g);
    });
    svg.append(g1, g2);
    box.append(svg);
    if (o.append) st.append(box);
    return svg;
  };

  /* ---------------- свързани възли ----------------
     st.nodes: {id: {v, next, prev, freed, label}}; st.head: id или null; st.sentinel: id (кръгов двусвързан);
     opts.ptr: {id: ["p", "cur"]}; opts.cls: {id: cls}; opts.ecls: {"id>next"|"id<prev": cls}; opts.double; opts.headName */
  T4.list = function (stage, st, o = {}) {
    stage.innerHTML = "";
    const N = st.nodes, BW = 58, BH = 34, GAP = 40, X0 = 70, Y0 = 46, ROW2 = 102;
    const pos = {};
    const chain = [];
    const seen = new Set();
    if (st.sentinel != null) {
      chain.push(st.sentinel); seen.add(st.sentinel);
      let c = N[st.sentinel].next;
      while (c != null && !seen.has(c) && N[c]) { chain.push(c); seen.add(c); c = N[c].next; }
    } else {
      let c = st.head;
      while (c != null && !seen.has(c) && N[c]) { chain.push(c); seen.add(c); c = N[c].next; }
    }
    chain.forEach((id, i) => (pos[id] = { x: X0 + i * (BW + GAP), y: Y0 }));
    // откъснати възли (нов X, освободен) — под реда, до възела, който сочи към тях или към който сочат
    let extra = 0;
    Object.keys(N).forEach((id) => {
      id = isNaN(id) ? id : +id;
      if (pos[id]) return;
      const n = N[id];
      let ax = null;
      for (const k in pos) if (N[k] && N[k].next === id) ax = pos[k].x + (BW + GAP) / 2;
      if (ax == null && n.next != null && pos[n.next]) ax = pos[n.next].x - (BW + GAP) / 2;
      if (ax == null && n.prev != null && pos[n.prev]) ax = pos[n.prev].x + (BW + GAP) / 2;
      if (ax == null) ax = X0 + (chain.length + extra) * (BW + GAP);
      pos[id] = { x: ax, y: Y0 + ROW2 };
      extra++;
    });
    const xs = Object.values(pos).map((p) => p.x);
    const W = Math.max(...xs, X0) + BW + 60;
    const anyLow = Object.values(pos).some((p) => p.y > Y0);
    const H = Y0 + BH + (anyLow ? ROW2 : 0) + (st.sentinel != null || o.double ? 54 : 34);
    const svg = sv("svg", { class: "g t4list", viewBox: `0 0 ${W} ${H}`, width: W, style: "max-width:none;height:auto" });
    const gE = sv("g"), gN = sv("g");
    const dbl = !!o.double;
    // head
    if (st.sentinel == null) {
      const hx = 8, hy = Y0 + BH / 2;
      gN.append(sv("text", { x: hx, y: hy - 14, class: "lbl", text: o.headName || "head" }));
      if (st.head != null && pos[st.head]) gE.append(...edge(hx + 30, hy, pos[st.head].x, hy, (o.ecls && o.ecls["head"]) || ""));
      else gN.append(sv("text", { x: hx + 10, y: hy + 5, class: "wt", text: "∅" }));
    }
    function edge(x1, y1, x2, y2, cls, curve) {
      const out = [];
      if (!curve) {
        out.push(sv("line", { x1, y1, x2: x2 - 1, y2, class: "edge arr " + cls }));
        out.push(arrowHead(x2, y2, Math.atan2(y2 - y1, x2 - x1), cls));
      } else {
        const cx = (x1 + x2) / 2, cy = curve;
        out.push(sv("path", { d: `M${x1},${y1} Q${cx},${cy} ${x2},${y2}`, class: "edge arr " + cls }));
        out.push(arrowHead(x2, y2, Math.atan2(y2 - cy, x2 - cx), cls));
      }
      return out;
    }
    Object.keys(pos).forEach((k) => {
      const id = isNaN(k) ? k : +k, n = N[id], p = pos[id];
      const isS = id === st.sentinel;
      const cls = (o.cls && o.cls[id]) || (n.freed ? "s-dim" : isS ? "s-piv" : "");
      const g = sv("g", { class: "node lnode " + cls });
      g.append(sv("rect", { x: p.x, y: p.y, width: BW, height: BH, rx: 4 }));
      const split = dbl ? 0.28 : 0;
      if (dbl) g.append(sv("line", { x1: p.x + BW * split, y1: p.y, x2: p.x + BW * split, y2: p.y + BH, class: "div" }));
      g.append(sv("line", { x1: p.x + BW * 0.7, y1: p.y, x2: p.x + BW * 0.7, y2: p.y + BH, class: "div" }));
      g.append(sv("text", { x: p.x + BW * (dbl ? 0.49 : 0.35), y: p.y + BH / 2 + 5, "text-anchor": "middle", style: "font-weight:600", text: isS ? "S" : n.freed ? "✗" : String(n.v) }));
      // указатели-имена над възела
      const nm = o.ptr && o.ptr[id];
      if (nm && nm.length) g.append(sv("text", { x: p.x + BW / 2, y: p.y - 8, "text-anchor": "middle", class: "lbl ptrn", text: nm.join(", ") }));
      gN.append(g);
      // next
      const sx = p.x + BW * 0.85, sy = p.y + (dbl ? BH * 0.35 : BH / 2);
      const ec = (o.ecls && o.ecls[id + ">"]) || "";
      if (n.next == null) {
        gN.append(sv("text", { x: sx, y: sy + 5, "text-anchor": "middle", class: "wt", text: "∅" }));
      } else if (pos[n.next]) {
        const t = pos[n.next];
        const ty = t.y + (dbl ? BH * 0.35 : BH / 2);
        if (t.y === p.y && t.x > p.x && Math.abs(t.x - p.x - BW - GAP) < 1) gE.append(...edge(sx, sy, t.x, ty, ec));
        else if (n.next === id) gE.append(...edge(sx, sy, p.x + BW * 0.15, p.y, ec, p.y - 34));
        else if (t.y === p.y) gE.append(...edge(sx, p.y, t.x + BW * 0.3, t.y, ec, p.y - 36 - Math.abs(t.x - p.x) * 0.04));
        else gE.append(...edge(sx, sy + (t.y > p.y ? BH / 2 : -BH / 2) * 0.6, t.x + (t.x > p.x ? 0 : BW * 0.3), t.y + (t.y > p.y ? 0 : BH), ec, (p.y + t.y) / 2 + (t.y > p.y ? -10 : 10)));
      }
      // prev
      if (dbl) {
        const px = p.x + BW * 0.14, py = p.y + BH * 0.72;
        const pc = (o.ecls && o.ecls[id + "<"]) || "prev";
        if (n.prev == null) gN.append(sv("text", { x: px, y: py + 4, "text-anchor": "middle", class: "wt", text: "∅" }));
        else if (pos[n.prev]) {
          const t = pos[n.prev], ty = t.y + BH * 0.72;
          if (t.y === p.y && t.x < p.x && Math.abs(p.x - t.x - BW - GAP) < 1) gE.append(...edge(p.x, py, t.x + BW, ty, pc));
          else if (n.prev === id) gE.append(...edge(px, p.y + BH, p.x + BW * 0.6, p.y + BH, pc, p.y + BH + 30));
          else if (t.y === p.y) gE.append(...edge(px, p.y + BH, t.x + BW * 0.7, t.y + BH, pc, p.y + BH + 34 + Math.abs(t.x - p.x) * 0.03));
          else gE.append(...edge(px, t.y > p.y ? p.y + BH : p.y, t.x + BW * (t.x > p.x ? 0.1 : 0.9), t.y > p.y ? t.y : t.y + BH, pc, (p.y + t.y) / 2));
        }
      }
    });
    svg.append(gE, gN);
    stage.append(svg);
    return svg;
  };

  /* ---------------- кръгов буфер ----------------
     cells: масив (null = свободна), opts: {head, tail, cls:{i:cls}, size} */
  T4.ring = function (host, cells, o = {}) {
    const C = cells.length, R = 78, cx = 150, cy = 140, W = 300, H = 280;
    const svg = sv("svg", { class: "g t4ring", viewBox: `0 0 ${W} ${H}`, width: W, style: "max-width:100%;height:auto;flex:none" });
    for (let i = 0; i < C; i++) {
      const a0 = -Math.PI / 2 + (i / C) * 2 * Math.PI, a1 = -Math.PI / 2 + ((i + 1) / C) * 2 * Math.PI;
      const r1 = R - 26, r2 = R + 14;
      const p = (r, a) => `${cx + r * Math.cos(a)},${cy + r * Math.sin(a)}`;
      const large = a1 - a0 > Math.PI ? 1 : 0;
      const d = `M${p(r1, a0)} L${p(r2, a0)} A${r2},${r2} 0 ${large} 1 ${p(r2, a1)} L${p(r1, a1)} A${r1},${r1} 0 ${large} 0 ${p(r1, a0)} Z`;
      const cls = (o.cls && o.cls[i]) || (cells[i] == null ? "s-dim" : "");
      const g = sv("g", { class: "node " + cls });
      g.append(sv("path", { d, class: "seg" }));
      const am = (a0 + a1) / 2;
      g.append(sv("text", { x: cx + (R - 6) * Math.cos(am), y: cy + (R - 6) * Math.sin(am) + 5, "text-anchor": "middle", style: "font-weight:600", text: cells[i] == null ? "" : String(cells[i]) }));
      g.append(sv("text", { x: cx + (R + 26) * Math.cos(am), y: cy + (R + 26) * Math.sin(am) + 4, "text-anchor": "middle", class: "wt", text: i }));
      svg.append(g);
    }
    const mark = (i, txt, inner) => {
      if (i == null) return;
      const am = -Math.PI / 2 + ((i + 0.5) / C) * 2 * Math.PI, r = R + (inner ? 58 : 44);
      svg.append(sv("text", { x: cx + r * Math.cos(am), y: cy + r * Math.sin(am) + (inner ? 12 : 4), "text-anchor": "middle", class: "lbl" + (inner ? " ptrn" : ""), text: txt }));
    };
    if (o.head != null && o.tail != null && o.head === o.tail) mark(o.head, o.hn || "head=tail", false);
    else { mark(o.head, o.hn || "head", false); mark(o.tail, o.tn || "tail", true); }
    if (o.center) svg.append(sv("text", { x: cx, y: cy + 5, "text-anchor": "middle", class: "lbl", text: o.center }));
    host.append(svg);
    return svg;
  };

  /* общ CSS за рисунките на тема 4 */

<script>
/* Раздел 1 — абстрактен тип и конкретна реализация. */
(function () {
  const S = window.Study, h = S.h;

  /* Разбор на програма от операции: "push 4, push(7), pop" -> [{name, args, text}] */
  function parseProg(str, spec, maxOps = 40) {
    const parts = String(str).split(/[,;\n]+/).map((s) => s.trim()).filter(Boolean);
    if (parts.length > maxOps) throw new Error(`Най-много ${maxOps} операции.`);
    return parts.map((p) => {
      const t = p.replace(/[()]/g, " ").trim().split(/\s+/);
      const nm = t[0].toLowerCase();
      const key = Object.keys(spec).find((k) => k === nm || (spec[k].alias || []).includes(nm));
      if (!key) throw new Error(`Непозната операция „${t[0]}“. Допустими: ${Object.keys(spec).join(", ")}.`);
      const args = t.slice(1).map((x) => {
        const v = Number(x);
        if (!Number.isInteger(v)) throw new Error(`„${x}“ в „${p}“ не е цяло число.`);
        if (Math.abs(v) > 9999) throw new Error(`Стойностите трябва да са между −9999 и 9999.`);
        return v;
      });
      const n = spec[key].args;
      if (n === "many" ? args.length < 1 : args.length !== n) throw new Error(`„${key}“ очаква ${n === "many" ? "поне 1 аргумент" : n === 0 ? "без аргументи" : n + " аргумент(а)"}: „${p}“.`);
      return { name: key, args, text: p };
    });
  }

  const algos = {
    /** Един и същ клиентски код върху две реализации на стека. impl = "array" | "list" — чии стъпки се показват. */
    adt({ prog, cap, impl }) {
      const ops = parseProg(prog, { push: { args: 1 }, pop: { args: 0 }, top: { args: 0, alias: ["peek"] }, empty: { args: 0 } });
      cap = S.int(cap, 1, 10, "Капацитет");
      const isArr = impl !== "list";
      const F = [], arr = [], outA = [], outL = [];
      let nodes = {}, top = null, nid = 1;
      const snap = (o) => F.push(Object.assign({
        arr: arr.slice(), cap, list: { nodes: JSON.parse(JSON.stringify(nodes)), head: top },
        outA: outA.slice(), outL: outL.slice(), impl: isArr ? "array" : "list",
        stats: { "size (масив)": arr.length, "възли (списък)": Object.keys(nodes).length },
      }, o));
      snap({ msg: `Програма от ${ops.length} операции. Клиентът вижда само договора <code>StackOps</code>; отдолу работят две реализации едновременно.` });
      ops.forEach((op, k) => {
        const cl = { push: "c_push", pop: "c_pop", top: "c_top", empty: "c_empty" }[op.name];
        // кадър на клиента (при масива: преди операцията; при списъка също)
        snap({ cAt: cl, msg: `Клиентът извиква <code>ops-&gt;${op.name}(${op.args.join(", ")})</code> — не знае как е разположен стекът.`, log: `${k + 1}. ${op.text}` });
        // ---- масив: една стъпка
        let aAt, aMsg, aHi = null;
        if (op.name === "push") {
          if (arr.length === cap) { outA.push("full"); aAt = "a_full"; aMsg = `масив: size == cap (${cap}) → <b>-1 „няма място“</b>. Свързаната реализация няма такъв лимит.`; aHi = "full"; }
          else { arr.push(op.args[0]); outA.push("ok"); aAt = "a_push"; aMsg = `масив: a[${arr.length - 1}] = ${op.args[0]}, size = ${arr.length}. Θ(1).`; aHi = arr.length - 1; }
        } else if (op.name === "pop") {
          if (!arr.length) { outA.push("E"); aAt = "a_empty"; aMsg = "масив: size == 0 → <b>-1 „празен“</b>."; }
          else { aHi = arr.length - 1; const v = arr.pop(); outA.push(String(v)); aAt = "a_pop"; aMsg = `масив: --size, върнат a[${aHi}] = ${v}. Клетката не се изтрива — просто е извън [0, size).`; }
        } else if (op.name === "top") {
          if (!arr.length) { outA.push("E"); aAt = "a_empty"; aMsg = "масив: празен → -1."; }
          else { aHi = arr.length - 1; outA.push(String(arr[aHi])); aAt = "a_top"; aMsg = `масив: a[size−1] = ${arr[aHi]} (без премахване).`; }
        } else { outA.push(String(arr.length === 0 ? 1 : 0)); aAt = "a_isempty"; aMsg = `масив: size == 0 → ${arr.length === 0 ? 1 : 0}.`; }
        if (isArr) snap({ at: aAt, cAt: cl, aHi, msg: aMsg });
        // ---- списък: всяка промяна на указател е отделна стъпка
        const L = (o) => { if (!isArr) snap(Object.assign({ cAt: cl }, o)); };
        if (op.name === "push") {
          const id = nid++;
          nodes[id] = { v: op.args[0], next: null };
          L({ at: "l_push", lcls: { [id]: "s-done" }, msg: `списък: malloc на нов възел ${op.args[0]} (още не е свързан).` });
          nodes[id].next = top;
          L({ at: "l_link", lcls: { [id]: "s-done" }, msg: "списък: <code>n-&gt;next = top</code> — новият сочи стария връх." });
          top = id; outL.push("ok");
          L({ at: "l_head", lcls: { [id]: "s-done" }, msg: "списък: <code>top = n</code>. Θ(1) — без преместване, но с алокация." });
        } else if (op.name === "pop") {
          if (top == null) { outL.push("E"); L({ at: "l_empty", msg: "списък: top == NULL → -1." }); }
          else {
            const id = top;
            outL.push(String(nodes[id].v));
            L({ at: "l_pop", lcls: { [id]: "s-cmp" }, msg: `списък: <code>*out = n-&gt;v</code> = ${nodes[id].v}.` });
            top = nodes[id].next;
            L({ at: "l_unlink", lcls: { [id]: "s-swap" }, msg: "списък: <code>top = n-&gt;next</code> — възелът е откачен." });
            nodes[id].freed = true;
            L({ at: "l_free", lcls: { [id]: "s-dim" }, msg: "списък: <code>free(n)</code>. След това n не бива да се чете." });
            delete nodes[id];
          }
        } else if (op.name === "top") {
          if (top == null) { outL.push("E"); L({ at: "l_empty", msg: "списък: празен → -1." }); }
          else { outL.push(String(nodes[top].v)); L({ at: "l_top", lcls: { [top]: "s-cmp" }, msg: `списък: <code>top-&gt;v</code> = ${nodes[top].v}.` }); }
        } else { outL.push(String(top == null ? 1 : 0)); L({ at: "l_isempty", msg: `списък: top == NULL → ${top == null ? 1 : 0}.` }); }
      });
      const A = outA.join(" "), Ls = outL.join(" ");
      snap({ done: true, msg: `Край. Изход на масива: <b>${A || "—"}</b>; изход на списъка: <b>${Ls || "—"}</b>. ${A === Ls ? "Еднакво наблюдаемо поведение — един договор." : "Разликата идва от капацитета: договорът позволява отказ „няма място“, а реализациите го използват различно."}` });
      return { frames: F, outA: A, outL: Ls };
    },
  };

  function draw(st, f) {
    st.innerHTML = "";
    const row = h("div", { class: "t4row" });
    const aBox = h("div", { class: "t4col", style: { opacity: f.impl === "array" ? 1 : 0.55 } }, h("span", { class: "t4cap", text: `Реализация 1 · масив (cap = ${f.cap})` }));
    const cells = Array.from({ length: f.cap }, (_, i) => (i < f.arr.length ? f.arr[i] : null));
    const cls = {};
    cells.forEach((v, i) => { if (v == null) cls[i] = "s-dim"; });
    if (f.impl === "array" && f.aHi === "full") cells.forEach((_, i) => (cls[i] = "s-swap"));
    else if (f.impl === "array" && f.aHi != null) cls[f.aHi] = f.at === "a_push" ? "s-done" : "s-cmp";
    const ab = h("div");
    S.drawArray(ab, cells, { cls, ptr: f.arr.length ? { "връх": f.arr.length - 1 } : {} });
    aBox.append(ab, h("span", { class: "muted mono", style: { fontSize: ".78rem" }, text: `size = ${f.arr.length}; върхът е a[size−1]` }));
    const lBox = h("div", { class: "t4col", style: { opacity: f.impl === "list" ? 1 : 0.55, minWidth: "0" } }, h("span", { class: "t4cap", text: "Реализация 2 · свързани възли" }));
    const lb = h("div", { class: "t4scroll" });
    T4.list(lb, f.list, { headName: "top", cls: f.impl === "list" ? f.lcls : null });
    lBox.append(lb, h("span", { class: "muted mono", style: { fontSize: ".78rem" }, text: "top сочи първия възел = върха" }));
    row.append(aBox, lBox);
    st.append(row);
    const outs = h("div", { class: "t4row", style: { marginTop: "10px" } });

<script>
/* Раздел 2 — стек: динамичен масив с удвояване, амортизация, скоби, постфиксен израз. */
(function () {
  const S = window.Study, h = S.h;

  function parseProg(str, spec, maxOps = 40) {
    const parts = String(str).split(/[,;\n]+/).map((s) => s.trim()).filter(Boolean);
    if (parts.length > maxOps) throw new Error(`Най-много ${maxOps} операции.`);
    return parts.map((p) => {
      const t = p.replace(/[()]/g, " ").trim().split(/\s+/);
      const nm = t[0].toLowerCase();
      const key = Object.keys(spec).find((k) => k === nm || (spec[k].alias || []).includes(nm));
      if (!key) throw new Error(`Непозната операция „${t[0]}“. Допустими: ${Object.keys(spec).join(", ")}.`);
      const args = t.slice(1).map((x) => { const v = Number(x); if (!Number.isInteger(v) || Math.abs(v) > 9999) throw new Error(`„${x}“ в „${p}“ не е цяло число между −9999 и 9999.`); return v; });
      if (args.length !== spec[key].args) throw new Error(`„${key}“ очаква ${spec[key].args ? spec[key].args + " аргумент" : "без аргументи"}: „${p}“.`);
      return { name: key, args, text: p };
    });
  }

  const algos = {
    /** Стек върху динамичен масив с удвояване — стъпка по стъпка, включително копирането. */
    dyn({ prog, cap0 }) {
      const ops = parseProg(prog, { push: { args: 1 }, pop: { args: 0 }, top: { args: 0, alias: ["peek"] } });
      cap0 = S.int(cap0, 1, 8, "Начален капацитет");
      let a = new Array(cap0).fill(null), size = 0, cap = cap0, copies = 0, grows = 0;
      const out = [], F = [];
      const st = () => ({ size, cap, копирания: copies, удвоявания: grows });
      const snap = (o) => F.push(Object.assign({ a: a.slice(), size, cap, out: out.slice(), vars: { size, cap }, stats: st() }, o));
      snap({ msg: `Празен стек: size = 0, cap = ${cap0}.` });
      ops.forEach((op, k) => {
        if (op.name === "push") {
          const x = op.args[0];
          snap({ at: "full", hi: { [size]: "s-cmp" }, msg: `push(${x}): size == cap? ${size} == ${cap} → <b>${size === cap}</b>.`, log: `${k + 1}. ${op.text}` });
          if (size === cap) {
            const ncap = cap * 2, b = new Array(ncap).fill(null);
            snap({ at: "grow", b: b.slice(), msg: `Няма място: заделяме нов масив с ncap = 2·cap = ${ncap}. Това е <b>геометричен</b> растеж.` });
            for (let i = 0; i < size; i++) {
              b[i] = a[i]; copies++;
              snap({ at: "copy", b: b.slice(), hi: { [i]: "s-cmp" }, bhi: { [i]: "s-done" }, vars: { size, cap, ncap, i }, msg: `Копиране b[${i}] = a[${i}] = ${a[i]}. (Всяко копиране е Θ(1); общо Θ(size) за това push.)` });
            }
            a = b; cap = ncap; grows++;
            snap({ at: "swapbuf", msg: `free(стария); a = b; cap = ${cap}. Цената на това единично push е ${size} копирания + 1 запис.` });
          }
          a[size] = x; size++;
          snap({ at: "push", hi: { [size - 1]: "s-done" }, msg: `a[${size - 1}] = ${x}; size = ${size}.` });
        } else {
          snap({ at: "empty", msg: `${op.name}(): size == 0? → <b>${size === 0}</b>.`, log: `${k + 1}. ${op.text}` });
          if (size === 0) { out.push("E"); snap({ at: "empty", hi: {}, msg: `Празен стек: по договора връщаме <b>-1</b> (грешка), не произволна стойност.` }); return; }
          if (op.name === "pop") {
            size--; const v = a[size]; out.push(String(v));
            snap({ at: "pop", hi: { [size]: "s-swap" }, ghost: size, msg: `*out = a[--size] = <b>${v}</b>. Капацитетът не намалява.` });
          } else {
            out.push(String(a[size - 1]));
            snap({ at: "top", hi: { [size - 1]: "s-cmp" }, msg: `top: a[size−1] = <b>${a[size - 1]}</b>, без премахване.` });
          }
        }
      });
      snap({ done: true, msg: `Край. Изход: <b>${out.join(" ") || "—"}</b>. size = ${size}, cap = ${cap}, копирания = ${copies}, удвоявания = ${grows}.` });
      return { frames: F, out: out.join(" ") || "-", size, cap, copies, grows };
    },

    /** Амортизация: m последователни push при начален капацитет 1. */
    amort({ m }) {
      m = S.int(m, 1, 1024, "m");
      let cap = 1, size = 0, copies = 0, grows = 0;
      const cost = [], F = [];
      for (let i = 0; i < m; i++) {
        let c = 1, grew = false;
        if (size === cap) { c += size; copies += size; cap *= 2; grows++; grew = true; }
        size++; cost.push(c);
        F.push({ at: grew ? ["grow", "push"] : "push", cost: cost.slice(), stats: { "push-а": i + 1, копирания: copies, "общо (запис+копиране)": copies + size, "граница 3m": 3 * size, "средно за push": ((copies + size) / size).toFixed(2) }, vars: { size, cap }, msg: grew ? `push №${i + 1}: пълно → копираме ${c - 1} елемента; единичната цена е ${c}. Средната цена до момента е ${((copies + size) / size).toFixed(2)}.` : `push №${i + 1}: има място → цена 1.`, log: grew ? `push ${i + 1}: удвояване до ${cap}, ${c - 1} копирания` : null });
      }
      F[F.length - 1].msg += ` Общо копирания ${copies} &lt; 2m = ${2 * m}: геометричната сума 1 + 2 + 4 + … е по-малка от удвоения последен член.`;
      return { frames: F, copies, grows };
    },

    /** Проверка на скоби. */
    brackets({ s }) {
      s = String(s);
      if (s.length > 60) throw new Error("Най-много 60 символа.");
      const F = [], st = [], OPEN = "([{", CLOSE = ")]}";
      const snap = (o) => F.push(Object.assign({ s, st: st.slice(), vars: { top: st.length } }, o));
      snap({ at: "init", i: -1, msg: "Празен стек: top = 0." });
      let i;
      for (i = 0; i < s.length; i++) {
        const c = s[i];
        if (OPEN.includes(c)) {
          st.push(c);
          snap({ at: ["loop", "push"], i, cls: "s-done", msg: `„${c}“ е отваряща → push. Стекът пази незатворените отварящи скоби.`, log: `${i}: ${c} push` });
        } else if (CLOSE.includes(c)) {
          const want = OPEN[CLOSE.indexOf(c)];
          if (!st.length) { snap({ at: ["loop", "underflow"], i, cls: "s-swap", bad: true, msg: `„${c}“ е затваряща, но стекът е празен → <b>грешка на позиция ${i}</b>: няма отваряща.`, log: `${i}: ${c} — празен стек` }); return { frames: F, result: i }; }
          if (st[st.length - 1] !== want) { snap({ at: ["loop", "mismatch"], i, cls: "s-swap", bad: true, topBad: true, msg: `„${c}“ трябва да затвори „${want}“, но върхът е „${st[st.length - 1]}“ → <b>грешка на позиция ${i}</b>. Броят може да е еднакъв, но редът е грешен.`, log: `${i}: ${c} ≠ връх ${st[st.length - 1]}` }); return { frames: F, result: i }; }
          snap({ at: ["loop", "mismatch"], i, cls: "s-cmp", topHi: true, msg: `„${c}“ съвпада с върха „${want}“.` });
          st.pop();
          snap({ at: ["loop", "pop"], i, cls: "s-done", msg: `pop — „${want}“ е затворена.`, log: `${i}: ${c} pop` });
        } else snap({ at: "loop", i, cls: "s-dim", msg: `„${c}“ не е скоба — пропускаме.` });
      }
      const ok = st.length === 0;
      snap({ at: "end", i: s.length, bad: !ok, msg: ok ? "Край на низа и стекът е празен → <b>коректно</b> (-1). Θ(n) време, O(n) допълнителна памет." : `Край на низа, но в стека остават ${st.length} незатворени → <b>грешка</b> (позиция ${s.length} = дължината).` });
      return { frames: F, result: ok ? -1 : s.length };
    },

    /** Постфиксен израз. */
    postfix({ expr }) {
      const toks = String(expr).trim().split(/\s+/).filter(Boolean);
      if (!toks.length) throw new Error("Въведи израз, напр. 3 4 + 2 *");
      if (toks.length > 40) throw new Error("Най-много 40 лексеми.");
      toks.forEach((t) => { if (!/^[-+*/]$/.test(t) && !/^-?\d{1,6}$/.test(t)) throw new Error(`„${t}“ не е цяло число или операция + − * /. Лексемите се разделят с интервал.`); });
      const F = [], st = [];
      const snap = (o) => F.push(Object.assign({ toks, st: st.slice(), vars: { top: st.length } }, o));
      snap({ at: "init", i: -1, msg: "Чете се отляво надясно. Операндите отиват в стека; операцията взема двата горни." });
      const T = (x) => Math.trunc(x);
      for (let i = 0; i < toks.length; i++) {
        const t = toks[i];
        if ("+-*/".includes(t) && t.length === 1) {
          if (st.length < 2) { snap({ at: ["loop", "underflow"], i, bad: true, msg: `Операция „${t}“ изисква два операнда, а в стека има ${st.length} → <b>грешка</b>.` }); return { frames: F, result: "E" }; }
          const b = st.pop();
          snap({ at: ["loop", "popb"], i, b, msg: `pop → b = ${b} (десният операнд е отгоре!).` });
          const a = st.pop();
          snap({ at: ["loop", "popa"], i, a, b, msg: `pop → a = ${a}.` });
          if (t === "/" && b === 0) { snap({ at: ["loop", "apply"], i, bad: true, msg: "Деление на 0 → <b>грешка</b>." }); return { frames: F, result: "E" }; }
          const r = t === "+" ? a + b : t === "-" ? a - b : t === "*" ? a * b : T(a / b);
          snap({ at: ["loop", "apply"], i, a, b, msg: `r = a ${t} b = ${a} ${t} ${b} = <b>${r}</b>.${t === "/" ? " (Целочислено деление, отрязване към 0 — както в C.)" : ""}` });
          st.push(r);
          snap({ at: ["loop", "pushr"], i, hiTop: true, msg: `push(${r}).`, log: `${a} ${t} ${b} = ${r}` });
        } else {
          st.push(Number(t));
          snap({ at: ["loop", "push"], i, hiTop: true, msg: `${t} е операнд → push.`, log: `push ${t}` });
        }
      }
      if (st.length !== 1) { snap({ at: "end", i: toks.length, bad: true, msg: `В края в стека има ${st.length} стойности вместо 1 → <b>грешка</b> (излишни операнди).` }); return { frames: F, result: "E" }; }
      snap({ at: ["end", "ret"], i: toks.length, done: true, msg: `В стека остава точно една стойност: резултат <b>${st[0]}</b>.` });
      return { frames: F, result: st[0] };
    },
  };

  /* ---------- рисуване ---------- */
  function stackCol(items, o = {}) {
    const col = h("div", { class: "t4stack" });
    items.forEach((v, i) => {
      const top = i === items.length - 1;
      const c = h("div", { class: "cell " + ((top && o.topCls) || ""), style: { width: o.w || "64px", height: "32px" } }, String(v));
      if (top) c.append(h("span", { class: "ix", style: { bottom: "auto", top: "8px", left: "calc(100% + 6px)" }, text: "← връх" }));
      col.append(c);
    });
    if (!items.length) col.append(h("div", { class: "muted", style: { fontSize: ".8rem" }, text: "(празен)" }));
    return h("div", { class: "t4col" }, h("span", { class: "t4cap", text: o.cap || "стек" }), h("div", { style: { borderLeft: "2px solid var(--line)", borderRight: "2px solid var(--line)", borderBottom: "2px solid var(--line)", padding: "4px", width: "max-content", paddingRight: "70px" } }, col));
  }

  function drawDyn(st, f) {
    st.innerHTML = "";
    const cls = {};
    f.a.forEach((v, i) => { if (i >= f.size) cls[i] = "s-dim"; });
    Object.assign(cls, f.hi || {});
    const row = h("div", { class: "t4col" }, h("span", { class: "t4cap", text: `a[] · cap = ${f.cap}` }));
    const show = f.a.map((v, i) => (i < f.size || i === f.ghost ? v : null));
    S.drawArray(row, show, { cls, append: true, ptr: f.size ? { "връх": f.size - 1 } : {} });
    st.append(row);
    if (f.b) {
      const r2 = h("div", { class: "t4col" }, h("span", { class: "t4cap", text: `нов b[] · ncap = ${f.b.length}` }));
      const bc = {}; f.b.forEach((v, i) => { if (v == null) bc[i] = "s-dim"; }); Object.assign(bc, f.bhi || {});
      S.drawArray(r2, f.b, { cls: bc, append: true });
      st.append(r2);
    }

  function drawBr(st, f) {

  const html = `
<div class="prose">
  <p><dfn data-g="стек">Стекът</dfn> поддържа дисциплина <dfn data-g="lifo">LIFO</dfn>: последният добавен елемент е първият изваден. Основните операции са <dfn data-g="push">push</dfn> за добавяне, <dfn data-g="pop">pop</dfn> за премахване на върха, top или peek за прочитане без премахване и empty за проверка. Поведението при празен стек трябва да е определено: грешка, изключение или друг изричен резултат.</p>
  <p>LIFO описва реда, не задължителна посока на растеж на адресите. Машинният стек може да расте към по-ниски адреси; абстрактният стек няма такова изискване.</p>

<div class="block">

<div class="block">

    <p>Ако растежът е <b>аритметичен</b> (cap += k), сумата на копиранията е Θ(m²/k) и амортизираната цена вече не е константа.</p>

<div class="block">

<script>
/* Раздел 3 — опашка: кръгов буфер, пълно/празно, свързана опашка, дек. */
(function () {
  const S = window.Study, h = S.h;

  function parseProg(str, spec, maxOps = 40) {
    const parts = String(str).split(/[,;\n]+/).map((s) => s.trim()).filter(Boolean);
    if (parts.length > maxOps) throw new Error(`Най-много ${maxOps} операции.`);
    return parts.map((p) => {
      const t = p.replace(/[()]/g, " ").trim().split(/\s+/);
      const nm = t[0].toLowerCase();
      const key = Object.keys(spec).find((k) => k === nm || (spec[k].alias || []).includes(nm));
      if (!key) throw new Error(`Непозната операция „${t[0]}“. Допустими: ${Object.keys(spec).join(", ")}.`);
      const args = t.slice(1).map((x) => { const v = Number(x); if (!Number.isInteger(v) || Math.abs(v) > 9999) throw new Error(`„${x}“ в „${p}“ не е цяло число между −9999 и 9999.`); return v; });
      if (args.length !== spec[key].args) throw new Error(`„${key}“ очаква ${spec[key].args ? spec[key].args + " аргумент" : "без аргументи"}: „${p}“.`);
      return { name: key, args, text: p };
    });
  }
  const QSPEC = { enq: { args: 1, alias: ["enqueue", "push"] }, deq: { args: 0, alias: ["dequeue", "pop"] }, front: { args: 0, alias: ["peek"] } };

  const algos = {
    /** Стек срещу опашка върху една и съща поредица (схема 6). */
    order({ vals }) {
      const a = S.parseNums(vals, { minLen: 1, maxLen: 10, min: -999, max: 999 });
      const F = [], st = [], q = [], os = [], oq = [];
      const snap = (o) => F.push(Object.assign({ st: st.slice(), q: q.slice(), os: os.slice(), oq: oq.slice() }, o));
      snap({ msg: "Едни и същи стойности влизат в стек и в опашка." });
      a.forEach((v) => { st.push(v); q.push(v); snap({ msg: `push(${v}) / enqueue(${v}).`, log: `добавено ${v}` }); });
      while (st.length) { os.push(st.pop()); oq.push(q.shift()); snap({ msg: `pop → <b>${os[os.length - 1]}</b> (последният добавен) · dequeue → <b>${oq[oq.length - 1]}</b> (най-дълго чакалият).`, log: `${os[os.length - 1]} | ${oq[oq.length - 1]}` }); }
      snap({ done: true, msg: `Стекът изважда в обратен ред (<b>LIFO</b>), опашката — в реда на пристигане (<b>FIFO</b>). Физическата реализация може да е различна.` });
      return { frames: F, stack: os.join(" "), queue: oq.join(" ") };
    },

    /** Кръгов буфер с head и size. */
    ring({ prog, C, head0, ow }) {
      const ops = parseProg(prog, QSPEC);
      C = S.int(C, 2, 12, "Капацитет C");
      head0 = S.int(head0, 0, C - 1, "Начален head");
      const over = ow === true || ow === "true" || ow === "1";
      const a = new Array(C).fill(null);
      let head = head0, size = 0;
      const out = [], F = [];
      const tail = () => (head + size) % C;
      const snap = (o) => F.push(Object.assign({ a: a.slice(), head, size, C, out: out.slice(), vars: { head, size, "tail=(head+size)%C": tail() }, stats: { size, свободни: C - size } }, o));
      snap({ msg: `Празна опашка: head = ${head}, size = 0. Празно ⇔ size == 0; пълно ⇔ size == C = ${C}.` });
      ops.forEach((op, k) => {
        if (op.name === "enq") {
          const x = op.args[0];
          snap({ at: "full", msg: `enqueue(${x}): size == C? ${size} == ${C} → <b>${size === C}</b>.`, log: `${k + 1}. ${op.text}` });
          if (size === C) {
            if (!over) { out.push("full"); snap({ at: "reject", bad: true, msg: "Пълно. Политика „отказ“: връщаме <b>-1</b>, данните не се променят." }); return; }
            const old = a[head];
            a[head] = null; head = (head + 1) % C; size--;
            snap({ at: "drop", hi: { [(head - 1 + C) % C]: "s-swap" }, msg: `Пълно. Политика „презаписване“: най-старият (${old}) се губи — head = ${head}.` });
          }
          const t = tail();
          snap({ at: "tail", hi: { [t]: "s-cmp" }, msg: `tail = (head + size) mod C = (${head} + ${size}) mod ${C} = <b>${t}</b>.${head + size >= C ? " Прехвърляне през края — без преместване на елементи." : ""}` });
          a[t] = x; size++;
          snap({ at: "write", hi: { [t]: "s-done" }, msg: `a[${t}] = ${x}; size = ${size}.` });
        } else {
          snap({ at: "empty", msg: `${op.name === "deq" ? "dequeue" : "front"}(): size == 0? → <b>${size === 0}</b>.`, log: `${k + 1}. ${op.text}` });
          if (!size) { out.push("E"); snap({ at: "empty", bad: true, msg: "Празна опашка → <b>-1</b>." }); return; }
          if (op.name === "front") { out.push(String(a[head])); snap({ at: "front", hi: { [head]: "s-cmp" }, msg: `front = a[head] = a[${head}] = <b>${a[head]}</b>.` }); return; }
          const v = a[head];
          snap({ at: "read", hi: { [head]: "s-cmp" }, msg: `*out = a[head] = a[${head}] = <b>${v}</b>.` });
          out.push(String(v)); a[head] = null;
          const oh = head; head = (head + 1) % C; size--;
          snap({ at: "advance", hi: { [oh]: "s-swap" }, msg: `head = (head + 1) mod C = <b>${head}</b>; size = ${size}. Нищо не се мести.` });
        }
      });
      snap({ done: true, msg: `Край. Изход: <b>${out.join(" ") || "—"}</b>. head = ${head}, size = ${size}.` });
      return { frames: F, out: out.join(" ") || "-", head, size };
    },

    /** Вариант само с head и tail, една неизползвана клетка. */
    ring2({ prog, C }) {
      const ops = parseProg(prog, { enq: QSPEC.enq, deq: QSPEC.deq });
      C = S.int(C, 2, 12, "Капацитет C");
      const a = new Array(C).fill(null);
      let head = 0, tail = 0;
      const out = [], F = [];
      const full = () => (tail + 1) % C === head, empty = () => head === tail;
      const snap = (o) => F.push(Object.assign({ a: a.slice(), head, tail, C, out: out.slice(), vars: { head, tail, "(tail+1)%C": (tail + 1) % C }, stats: { "полезен капацитет": C - 1, елементи: (tail - head + C) % C } }, o));
      snap({ msg: `head == tail == 0 → празно. Полезният капацитет е C − 1 = ${C - 1}: една клетка винаги остава празна.` });
      ops.forEach((op, k) => {
        if (op.name === "enq") {
          snap({ at: ["full", "isfull"], hi: { [(tail + 1) % C]: "s-cmp" }, msg: `enqueue(${op.args[0]}): (tail + 1) mod C == head? (${tail} + 1) mod ${C} = ${(tail + 1) % C} vs ${head} → <b>${full()}</b>.`, log: `${k + 1}. ${op.text}` });
          if (full()) { out.push("full"); snap({ at: "full", bad: true, msg: `Пълно, въпреки че клетка ${tail} е свободна: ако я запишем, tail ще стане == head и няма да различим пълно от празно.` }); return; }
          a[tail] = op.args[0];
          snap({ at: "write", hi: { [tail]: "s-done" }, msg: `a[tail] = a[${tail}] = ${op.args[0]}.` });
          tail = (tail + 1) % C;
          snap({ at: "advt", msg: `tail = ${tail}.` });
        } else {
          snap({ at: ["empty", "isempty"], msg: `dequeue(): head == tail? ${head} == ${tail} → <b>${empty()}</b>.`, log: `${k + 1}. ${op.text}` });
          if (empty()) { out.push("E"); snap({ at: "empty", bad: true, msg: "Празно → -1." }); return; }
          const v = a[head]; out.push(String(v));
          snap({ at: "read", hi: { [head]: "s-cmp" }, msg: `*out = a[${head}] = <b>${v}</b>.` });
          a[head] = null; head = (head + 1) % C;
          snap({ at: "advh", msg: `head = ${head}.` });
        }
      });
      snap({ done: true, msg: `Край. Изход: <b>${out.join(" ") || "—"}</b>. head = ${head}, tail = ${tail}.` });
      return { frames: F, out: out.join(" ") || "-", head, tail };
    },

    /** Свързана опашка с front и rear. */
    linked({ prog }) {
      const ops = parseProg(prog, { enq: QSPEC.enq, deq: QSPEC.deq });
      const nodes = {}; let front = null, rear = null, nid = 1;
      const out = [], F = [];
      const snap = (o) => F.push(Object.assign({ list: { nodes: JSON.parse(JSON.stringify(nodes)), head: front }, front, rear, out: out.slice(), vars: { front: front == null ? "NULL" : "→" + nodes[front].v, rear: rear == null ? "NULL" : "→" + nodes[rear].v } }, o));
      snap({ msg: "Празна опашка: front = rear = NULL." });
      ops.forEach((op, k) => {
        if (op.name === "enq") {
          const id = nid++; nodes[id] = { v: op.args[0], next: null };
          snap({ at: "new", lcls: { [id]: "s-done" }, msg: `Нов възел ${op.args[0]}, next = NULL.`, log: `${k + 1}. ${op.text}` });
          snap({ at: "isempty", lcls: { [id]: "s-done" }, msg: `rear == NULL? → <b>${rear == null}</b>.` });
          if (rear == null) { front = id; snap({ at: "first", lcls: { [id]: "s-done" }, msg: "Първи елемент: front = n." }); }
          else { nodes[rear].next = id; snap({ at: "link", lcls: { [id]: "s-done", [rear]: "s-cmp" }, msg: "rear->next = n — закачаме в края за Θ(1), без обхождане." }); }
          rear = id;
          snap({ at: "rear", lcls: { [id]: "s-done" }, msg: "rear = n." });
        } else {
          snap({ at: "empty", msg: `dequeue(): front == NULL? → <b>${front == null}</b>.`, log: `${k + 1}. ${op.text}` });
          if (front == null) { out.push("E"); snap({ at: "empty", bad: true, msg: "Празна → -1." }); return; }
          const id = front; out.push(String(nodes[id].v));
          snap({ at: "read", lcls: { [id]: "s-cmp" }, msg: `*out = front->v = <b>${nodes[id].v}</b>.` });
          front = nodes[id].next;
          snap({ at: "unlink", lcls: { [id]: "s-swap" }, msg: "front = n->next." });
          if (front == null) { rear = null; snap({ at: "clearrear", lcls: { [id]: "s-swap" }, msg: "Опашката стана празна → и <b>rear = NULL</b>. Иначе rear би сочил освободен възел." }); }
          nodes[id].freed = true;
          snap({ at: "free", lcls: { [id]: "s-dim" }, msg: "free(n)." });
          delete nodes[id];
        }
      });
      let len = 0; for (let c = front; c != null; c = nodes[c].next) len++;
      snap({ done: true, msg: `Край. Изход: <b>${out.join(" ") || "—"}</b>; в опашката: ${len}.` });
      return { frames: F, out: out.join(" ") || "-", len, rearNull: rear == null ? 1 : 0 };
    },

    /** Дек върху кръгов буфер. */
    deque({ prog, C }) {
      const ops = parseProg(prog, { pushb: { args: 1 }, pushf: { args: 1 }, popf: { args: 0 }, popb: { args: 0 } });
      C = S.int(C, 2, 12, "Капацитет C");
      const a = new Array(C).fill(null);
      let head = 0, size = 0;
      const out = [], F = [];
      const snap = (o) => F.push(Object.assign({ a: a.slice(), head, size, C, out: out.slice(), vars: { head, size, back: (head + size - 1 + C) % C } }, o));
      snap({ msg: "Празен дек: head = 0, size = 0." });
      ops.forEach((op, k) => {
        const log = `${k + 1}. ${op.text}`;
        if (op.name === "pushb" || op.name === "pushf") {
          if (size === C) { out.push("full"); snap({ at: "full", bad: true, msg: `${op.name}(${op.args[0]}): пълен → -1.`, log }); return; }
          if (op.name === "pushb") { const t = (head + size) % C; a[t] = op.args[0]; size++; snap({ at: "pb", hi: { [t]: "s-done" }, msg: `push_back(${op.args[0]}): a[(head+size) mod C] = a[${t}].`, log }); }
          else { head = (head - 1 + C) % C; a[head] = op.args[0]; size++; snap({ at: "pf", hi: { [head]: "s-done" }, msg: `push_front(${op.args[0]}): head = (head − 1 + C) mod C = ${head}. „+ C“ пази остатъка неотрицателен (в C % на отрицателно число е отрицателен).`, log }); }
        } else {
          if (!size) { out.push("E"); snap({ at: "empty", bad: true, msg: `${op.name}(): празен → -1.`, log }); return; }
          if (op.name === "popf") { const v = a[head]; out.push(String(v)); a[head] = null; const o = head; head = (head + 1) % C; size--; snap({ at: "popf", hi: { [o]: "s-swap" }, msg: `pop_front → <b>${v}</b>; head = ${head}.`, log }); }
          else { const t = (head + size - 1) % C; const v = a[t]; out.push(String(v)); a[t] = null; size--; snap({ at: "popb", hi: { [t]: "s-swap" }, msg: `pop_back → a[${t}] = <b>${v}</b>.`, log }); }
        }
      });
      snap({ done: true, msg: `Край. Изход: <b>${out.join(" ") || "—"}</b>.` });
      return { frames: F, out: out.join(" ") || "-", head, size };
    },
  };

  /* ---------- рисуване ---------- */
  const pills = (lab, arr) => h("div", { class: "t4out" }, h("span", { class: "muted", text: lab }), ...(arr.length ? arr.map((x) => h("span", { class: "pill " + (x === "full" || x === "E" ? "s-swap" : ""), text: x })) : [h("span", { class: "muted", text: "—" })]));

  function drawRing(st, f, two) {
    st.innerHTML = "";
    const row = h("div", { class: "t4row" });
    const cls = {}; f.a.forEach((v, i) => { if (v == null) cls[i] = "s-dim"; });
    Object.assign(cls, f.hi || {});
    if (f.bad) f.a.forEach((v, i) => { if (v != null) cls[i] = "s-swap"; });
    const t = two ? f.tail : (f.head + f.size) % f.C;
    T4.ring(row, f.a, { head: f.head, tail: t, cls, tn: "tail", center: two ? `${(f.tail - f.head + f.C) % f.C}/${f.C - 1}` : `size ${f.size}/${f.C}` });
    const lin = h("div", { class: "t4col", style: { minWidth: "0" } }, h("span", { class: "t4cap", text: "същият масив, разгънат" }));
    const box = h("div", { class: "t4scroll" });
    const ptr = { head: f.head }; if (t !== f.head) ptr.tail = t; else ptr["head=tail"] = t;
    S.drawArray(box, f.a, { cls, ptr: t === f.head ? { "h=t": t } : ptr });
    lin.append(box);
    // логически ред
    const ord = []; const n = two ? (f.tail - f.head + f.C) % f.C : f.size;
    for (let k = 0; k < n; k++) ord.push(`${f.a[(f.head + k) % f.C]}@${(f.head + k) % f.C}`);
    lin.append(h("div", { class: "t4out" }, h("span", { class: "muted", text: "логически ред (стойност@индекс):" }), ...(ord.length ? ord.map((x) => h("span", { class: "pill", text: x })) : [h("span", { class: "muted", text: "празно" })])));
    lin.append(pills("изход:", f.out));
    row.append(lin);
    st.append(row);
  }

  function drawLinked(st, f) {
    st.innerHTML = "";
    const ptr = {};
    if (f.front != null) (ptr[f.front] = ptr[f.front] || []).push("front");
    if (f.rear != null) (ptr[f.rear] = ptr[f.rear] || []).push("rear");
    const box = h("div", { class: "t4scroll" });
    T4.list(box, f.list, { ptr, cls: f.lcls, headName: "front" });
    st.append(box, pills("изход:", f.out));
  }

  function drawOrder(st, f) {
    st.innerHTML = "";
    const row = h("div", { class: "t4mini" });
    const sc = h("div", { class: "t4col" }, h("span", { class: "t4cap", text: "стек (връх вдясно)" }));
    S.drawArray(sc, f.st.length ? f.st : [null], { append: true, cls: f.st.length ? { [f.st.length - 1]: "s-act" } : { 0: "s-dim" }, index: false });
    sc.append(pills("изважда:", f.os.map(String)));
    const qc = h("div", { class: "t4col" }, h("span", { class: "t4cap", text: "опашка (начало вляво)" }));
    S.drawArray(qc, f.q.length ? f.q : [null], { append: true, cls: f.q.length ? { 0: "s-act" } : { 0: "s-dim" }, index: false });
    qc.append(pills("изважда:", f.oq.map(String)));
    row.append(sc, qc);
    st.append(row);
  }

  const html = `
<div class="prose">
  <p><dfn data-g="опашка">Опашката</dfn> поддържа дисциплина <dfn data-g="fifo">FIFO</dfn>: първият добавен е първият изваден. <dfn data-g="enqueue">enqueue</dfn> добавя в края, <dfn data-g="dequeue">dequeue</dfn> премахва отпред, front прочита първия. <dfn data-g="приоритетна опашка">Приоритетната опашка</dfn> е различен АТД: редът се определя от приоритет, а не просто от пристигането.</p>
</div>

<div class="block">
  <h3>Стекът и опашката имат различен ред на изваждане (схема 6)</h3>
  <div id="v3-ord"></div>
</div>

<div class="block">
  <h3>Кръгов буфер с head и size (схема 7)</h3>
  <p class="prose"><dfn data-g="кръгов буфер">Кръговият буфер</dfn> използва масив с фиксиран капацитет C, начало head и брой size. Следващата позиция за запис е (head+size) mod C. При премахване head става (head+1) mod C, а size намалява. Така не се преместват всички елементи. Празно означава size=0, а пълно — size=C. При capacity=6, head=3 и size=4 редът е 3,4,5,0; следващата позиция за запис е 1 — бутонът „схема 7“ стига до точно това състояние.</p>
  <div class="key"><span class="formula">tail = (head + size) mod C</span><br><span class="formula">head ← (head + 1) mod C</span><br><span class="formula">празно: size = 0;  пълно: size = C</span></div>
  <div id="v3-ring"></div>
  <details class="hint"><summary>Хинт: политиката при препълване</summary><div>
    <p>Ако буферът е пълен, трябва да е ясно дали записът <b>отказва</b>, <b>изчаква</b> или <b>презаписва</b> най-старите данни. Това е семантика, която не следва от самата кръгова форма. Отметката „презаписване“ показва третия вариант — удобен за лог на последните N измервания, недопустим за опашка от команди. Изчакването изисква синхронизация (виж FreeRTOS Queue по-долу).</p>
  </div></details>
</div>

<div class="block">
  <h3>Само head и tail: как се различават пълно и празно</h3>
  <p class="prose">При реализация само с два индекса трябва да се реши как се различават пълно и празно състояние. Самите head и tail могат да дадат еднакви индекси и при празно, и при пълно. Варианти са отделен брояч, флаг или оставяне на една неизползвана позиция. Последният вариант намалява полезния капацитет — виж го тук.</p>
  <div id="v3-ring2"></div>
  <details class="trap"><summary>Капан: „head == tail значи празно“</summary><div>
    <p>Само ако договорът гарантира, че буферът никога не се запълва докрай (празна клетка) или ако има брояч/флаг. Без такова правило след C записа tail се връща точно на head и състоянието е неразличимо от празното. Сравни горния визуализатор (с size — използва всички C клетки) с този (без size — C − 1 клетки).</p>
  </div></details>
</div>

<div class="block">
  <h3>Свързана опашка</h3>
  <p class="prose">Свързаната опашка пази указатели към първия и последния възел. Добавянето в края и премахването отпред са Θ(1). При премахване на последния елемент и двата указателя трябва да отразяват празното състояние. Ако се пази само първият възел, намирането на края може да изисква Θ(n).</p>
  <div id="v3-lq"></div>
  <details class="trap"><summary>Капан: забравеното rear = NULL</summary><div>
    <p>След dequeue на последния елемент front става NULL, но ако rear не се нулира, той сочи освободен възел. Следващото enqueue ще запише <code>rear-&gt;next = n</code> в освободена памет. Пробвай бутона „изпразване“ — стъпката <code>rear = NULL</code> е изрично показана.</p>
  </div></details>
</div>

<div class="block">
  <h3>Дек и приоритетна опашка</h3>
  <p class="prose"><dfn data-g="дек">Deque</dfn>, double-ended queue, допуска добавяне и премахване в двата края. В кръгов буфер това е естествено: push_front мести head назад с прехвърляне. Приоритетната опашка избира по приоритет, а не непременно по време на пристигане; честа нейна реализация е двоичната пирамида — виж <a href="#dopalnenie">раздел 8</a> <span class="extra-tag">разширение</span>.</p>
  <div id="v3-dq"></div>
  <p class="muted">Кръговият масив и кръговият свързан списък (схема 8) са и двете логически кръгови, но достъпът и представянето им са различни: първият е индексен с mod, вторият — по указатели. Виж <a href="#spisak">раздел 4</a>.</p>
</div>

<div class="block">
  <h3>Приложения и реални опашки</h3>
  <p class="prose">Опашки се използват при обслужване на заявки и обход в ширина (<dfn data-g="bfs">BFS</dfn>). При граф всеки новооткрит връх се маркира и поставя в опашката; така се обработват последователни слоеве. За граф със списъци на съседство обходът е O(V+E). Обходът на дърво по нива в <a href="#darvo">раздел 5</a> е същият механизъм.</p>
  <p class="prose">Реални опашки: C++ <code>std::queue</code>; Python <code>collections.deque</code> с append и popleft; FreeRTOS Queue за обмен между задачи. Последната добавя и синхронизация, копиране на елементи и правила за изчакване. Тя не е просто масив с индекси, защото договорът включва конкурентен достъп и изчакване (<dfn data-g="rtos">RTOS</dfn>).</p>
</div>`;

  function mount(root) {
    S.viz(root.querySelector("#v3-ord"), {
      id: "c3ord", title: "Една поредица — стек и опашка", sub: "Въведи стойности; първо всички се добавят, после всички се изваждат.", code: false,
      inputs: [{ id: "vals", label: "Стойности", value: "4 7 2", width: "14em" }],
      random: () => ({ vals: S.randArray(S.randInt(3, 7), 1, 50).join(" ") }),
      build: algos.order, draw: drawOrder,
    });
    S.viz(root.querySelector("#v3-ring"), {
      id: "c3ring", title: "Кръгов буфер (head + size)", sub: "операции: <code>enq x</code>, <code>deq</code>, <code>front</code>",
      code: "ch03_ring",
      inputs: [
        { id: "prog", label: "Програма", value: "enq 4, enq 7, enq 2, deq, front", width: "22em" },
        { id: "C", label: "C", type: "number", value: 6, width: "4em" },
        { id: "head0", label: "начален head", type: "number", value: 0, width: "4em" },
        { id: "ow", label: "презаписване при пълно", type: "checkbox", value: false },
      ],
      presets: [
        { label: "схема 7: head 3, ред 3,4,5,0", values: { prog: "enq 10, enq 11, enq 12, enq 13", C: 6, head0: 3, ow: false } },
        { label: "прехвърляне и пълно", values: { prog: "enq 1, enq 2, enq 3, enq 4, deq, deq, deq, enq 5, enq 6, enq 7, enq 8, enq 9", C: 6, head0: 3, ow: false } },
        { label: "презаписване", values: { prog: "enq 1, enq 2, enq 3, enq 4, enq 5, deq, deq", C: 4, head0: 0, ow: true } },
      ],
      legend: [["s-cmp", "tail / чете се"], ["s-done", "записан"], ["s-swap", "изваден / отказ"], ["s-dim", "свободна"]],

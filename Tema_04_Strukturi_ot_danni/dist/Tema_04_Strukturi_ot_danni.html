    });
    S.viz(root.querySelector("#v3-ring2"), {
      id: "c3ring2", title: "Кръгов буфер само с head и tail", sub: "операции: <code>enq x</code>, <code>deq</code>",
      code: "ch03_ring2",
      inputs: [{ id: "prog", label: "Програма", value: "enq 1, enq 2, enq 3, enq 4, deq, enq 5, enq 6", width: "22em" }, { id: "C", label: "C", type: "number", value: 4, width: "4em" }],
      presets: [{ label: "празно", values: { prog: "deq, enq 7, deq, deq", C: 5 } }],
      legend: [["s-cmp", "(tail+1)%C / чете се"], ["s-done", "записан"], ["s-swap", "отказ"]],
      build: algos.ring2, draw: (st, f) => drawRing(st, f, true),
    });
    S.viz(root.querySelector("#v3-lq"), {
      id: "c3lq", title: "Свързана опашка (front, rear)", sub: "операции: <code>enq x</code>, <code>deq</code>",
      code: "ch03_linked",
      inputs: [{ id: "prog", label: "Програма", value: "enq 4, enq 7, enq 2, deq, deq", width: "22em" }],
      presets: [{ label: "изпразване", values: { prog: "enq 1, deq, deq, enq 5" } }],
      legend: [["s-done", "нов"], ["s-cmp", "чете се / rear"], ["s-swap", "откачен"], ["s-dim", "освободен"]],
      build: algos.linked, draw: drawLinked,
    });
    S.viz(root.querySelector("#v3-dq"), {
      id: "c3dq", title: "Дек върху кръгов буфер", sub: "операции: <code>pushb x</code>, <code>pushf x</code>, <code>popf</code>, <code>popb</code>",
      code: "ch03_deque",
      inputs: [{ id: "prog", label: "Програма", value: "pushb 1, pushb 2, pushf 0, pushf 9, popb, popf, popf", width: "24em" }, { id: "C", label: "C", type: "number", value: 5, width: "4em" }],
      presets: [{ label: "пълен", values: { prog: "pushf 1, pushf 2, pushf 3, pushf 4, pushb 5, popb, popb", C: 4 } }],
      legend: [["s-done", "добавен"], ["s-swap", "изваден / отказ"], ["s-dim", "свободна"]],
      build: algos.deque, draw: (st, f) => drawRing(st, Object.assign({}, f), false),
    });
  }

  S.chapter({ id: "opashka", order: 3, num: "3", group: "Линейни структури", title: "Опашка", lead: "FIFO. Кръгов буфер с формулите за head/tail, разграничаване на пълно и празно, свързана опашка и дек.", html, mount, algos });
})();

</script>
<script>
/* Раздел 4 — линеен свързан списък: едносвързан, двусвързан кръгов със сентинел, грешен ред на връзките. */
(function () {
  const S = window.Study, h = S.h;

  function parseProg(str, spec, maxOps = 30) {
    const parts = String(str).split(/[,;\n]+/).map((s) => s.trim()).filter(Boolean);
    if (parts.length > maxOps) throw new Error(`Най-много ${maxOps} операции.`);
    return parts.map((p) => {
      const t = p.replace(/[()]/g, " ").trim().split(/\s+/);
      const nm = t[0].toLowerCase();
      const key = Object.keys(spec).find((k) => k === nm || (spec[k].alias || []).includes(nm));
      if (!key) throw new Error(`Непозната операция „${t[0]}“. Допустими: ${Object.keys(spec).join(", ")}.`);
      const args = t.slice(1).map((x) => { const v = Number(x); if (!Number.isInteger(v) || Math.abs(v) > 999) throw new Error(`„${x}“ в „${p}“ не е цяло число между −999 и 999.`); return v; });
      if (args.length !== spec[key].args) throw new Error(`„${key}“ очаква ${spec[key].args} аргумент(а): „${p}“.`);
      return { name: key, args, text: p };
    });
  }
  const LSPEC = { pushf: { args: 1, alias: ["push_front"] }, pushb: { args: 1, alias: ["push_back"] }, find: { args: 1, alias: ["search"] }, ins: { args: 2, alias: ["insert"] }, del: { args: 1, alias: ["delete", "remove"] } };

  const algos = {
    /** Едносвързан (mode = "single") или двусвързан кръгов със сентинел (mode = "double"). */
    list({ prog, mode }) {
      const ops = parseProg(prog, LSPEC);
      const dbl = mode === "double";
      const N = {}; let head = null, nid = 1, cmp = 0, hops = 0;
      const SID = "S";
      if (dbl) N[SID] = { v: 0, next: SID, prev: SID };
      const out = [], F = [];
      if (Object.keys(N).length > 40) throw new Error("Твърде много възли.");
      const snap = (o) => F.push(Object.assign({ dbl, st: { nodes: JSON.parse(JSON.stringify(N)), head, sentinel: dbl ? SID : null }, out: out.slice(), stats: { сравнения: cmp, "преходи p=p->next": hops } }, o));
      const firstId = () => (dbl ? N[SID].next : head);
      const isEnd = (id) => (dbl ? id === SID : id == null);
      const val = (id) => (id == null || id === SID ? "∅" : N[id].v);
      snap({ msg: dbl ? "Празен списък: S.next == S.prev == &S. Сентинелът S не е потребителски елемент." : "Празен списък: head = NULL." });

      // търсене — общо за find / ins / del(dbl)
      function find(x, tagLoop, tagCmp, tagNone, extra) {
        let i = 0;
        for (let p = firstId(); !isEnd(p); p = N[p].next, i++) {
          cmp++;
          const eq = N[p].v === x;
          snap(Object.assign({ at: [tagCmp, tagLoop].concat(extra || []), ptr: { [p]: ["p"] }, cls: { [p]: eq ? "s-done" : "s-cmp" }, vars: { x, i, "p->v": N[p].v }, msg: `p->v == x? ${N[p].v} == ${x} → <b>${eq}</b>.` }));
          if (eq) return { id: p, i };
          hops++;
        }
        snap({ at: [tagNone].concat(extra || []), vars: { x, return: dbl ? "NULL" : "NULL" }, msg: dbl ? `Върнахме се до сентинела S → ${x} липсва. Краят се разпознава по p == S, не по NULL.` : `p == NULL → ${x} липсва. Обходихме целия списък: O(n).` });
        return { id: null, i: -1 };
      }

      // двусвързано свързване след a
      function linkAfter(a, x, tag) {
        const id = nid++;
        N[id] = { v: x, next: null, prev: null };
        const cl = { [id]: "s-done" };
        snap({ at: ["dl_new", tag], cls: cl, ptr: { [a]: ["a"], [id]: ["n"] }, msg: `Нов възел n = ${x}. Свързваме го след a = ${val(a) === "∅" ? "S" : val(a)}.` });
        N[id].prev = a; snap({ at: ["dl_1", tag], cls: cl, ptr: { [a]: ["a"], [id]: ["n"] }, msg: "n->prev = a." });
        N[id].next = N[a].next; snap({ at: ["dl_2", tag], cls: cl, ptr: { [a]: ["a"], [id]: ["n"] }, msg: "n->next = a->next. Новият възел знае и двамата съседи; списъкът още не е променен." });
        N[N[a].next].prev = id; snap({ at: ["dl_3", tag], cls: cl, ptr: { [a]: ["a"], [id]: ["n"] }, msg: "a->next->prev = n — следващият вече сочи назад към n." });
        N[a].next = id; snap({ at: ["dl_4", tag], cls: cl, ptr: { [a]: ["a"], [id]: ["n"] }, msg: "a->next = n. Четири присвоявания, Θ(1), без специален случай за празен списък или край." });
      }

      ops.forEach((op, k) => {
        const log = `${k + 1}. ${op.text}`;
        if (Object.keys(N).length > 40) throw new Error("Твърде много възли (до 40).");
        if (op.name === "pushf") {
          const x = op.args[0];
          if (dbl) { snap({ at: "dpf", msg: `push_front(${x}) = свързване след S.`, log }); linkAfter(SID, x, "dpf"); return; }
          const id = nid++; N[id] = { v: x, next: null };
          snap({ at: "pf_new", cls: { [id]: "s-done" }, msg: `push_front(${x}): нов възел.`, log });
          N[id].next = head; snap({ at: "pf_link", cls: { [id]: "s-done" }, msg: "n->next = head." });
          head = id; snap({ at: "pf_head", cls: { [id]: "s-done" }, msg: "head = n. Θ(1)." });
        } else if (op.name === "pushb") {
          const x = op.args[0];
          if (dbl) { snap({ at: "dpb", msg: `push_back(${x}) = свързване след S->prev — краят е достъпен за Θ(1).`, log }); linkAfter(N[SID].prev, x, "dpb"); return; }
          const id = nid++; N[id] = { v: x, next: null };
          snap({ at: "pb_new", cls: { [id]: "s-done" }, msg: `push_back(${x}): нов възел с next = NULL.`, log });
          if (head == null) { head = id; snap({ at: "pb_empty", cls: { [id]: "s-done" }, msg: "Празен списък: head = n." }); return; }
          let p = head;
          snap({ at: "pb_start", ptr: { [p]: ["p"] }, cls: { [id]: "s-done", [p]: "s-cmp" }, msg: "Без tail указател трябва да стигнем до последния възел." });
          while (N[p].next != null) { p = N[p].next; hops++; snap({ at: "pb_walk", ptr: { [p]: ["p"] }, cls: { [id]: "s-done", [p]: "s-cmp" }, msg: `p = p->next (${N[p].v}).` }); }
          N[p].next = id; snap({ at: "pb_link", ptr: { [p]: ["p"] }, cls: { [id]: "s-done" }, msg: `p->next = n. Общо Θ(n) заради обхождането; самото свързване е Θ(1).` });
        } else if (op.name === "find") {
          const x = op.args[0];
          snap({ at: dbl ? "df_loop" : "f_loop", msg: `find(${x}): линейно търсене от началото.`, log });
          const r = dbl ? find(x, "df_loop", "df_cmp", "df_none") : find(x, "f_loop", "f_cmp", "f_none");
          out.push(String(r.i));
          if (r.id != null) snap({ at: dbl ? "df_cmp" : "f_cmp", cls: { [r.id]: "s-done" }, ptr: { [r.id]: ["p"] }, msg: `Намерено на позиция <b>${r.i}</b>.` });
        } else if (op.name === "ins") {
          const [key, x] = op.args;
          snap({ at: dbl ? "dia_find" : "ia_find", msg: `insert_after(${key}, ${x}): първо намираме P — O(n).`, log });
          const r = dbl ? find(key, "df_loop", "df_cmp", "df_none", ["dia_find"]) : find(key, "f_loop", "f_cmp", "f_none", ["ia_find"]);
          if (r.id == null) { out.push("nf"); if (!dbl) snap({ at: "ia_none", msg: `Няма възел ${key} → -1, нищо не се вмъква.` }); return; }
          const P = r.id;
          if (dbl) { linkAfter(P, x, "dia_find"); return; }
          const id = nid++; N[id] = { v: x, next: null };
          const Q = N[P].next;
          const ptr = { [P]: ["P"], [id]: ["X"] }; if (Q != null) ptr[Q] = ["Q"];
          snap({ at: "ia_new", ptr, cls: { [id]: "s-done", [P]: "s-cmp" }, msg: `Нов възел X = ${x}. Свързването оттук нататък е Θ(1).` });
          N[id].next = Q;
          snap({ at: "ia_1", ptr, cls: { [id]: "s-done", [P]: "s-cmp" }, ecls: { [id + ">"]: "s-act" }, msg: `<b>1)</b> X.next = P.next — X вече държи остатъка (${Q == null ? "NULL" : "Q = " + N[Q].v}).` });
          N[P].next = id;
          snap({ at: "ia_2", ptr, cls: { [id]: "s-done" }, ecls: { [P + ">"]: "s-act" }, msg: "<b>2)</b> P.next = X. Нито една връзка не е загубена." });
        } else if (op.name === "del") {
          const x = op.args[0];
          if (dbl) {
            snap({ at: "dd_find", msg: `delete(${x}): намираме X; предходният не е нужен — X->prev го знае.`, log });
            const r = find(x, "df_loop", "df_cmp", "df_none", ["dd_find"]);
            if (r.id == null) { out.push("nf"); return; }
            const X = r.id, Ap = N[X].prev, B = N[X].next;
            const ptr = { [X]: ["X"] };
            N[Ap].next = B; snap({ at: "dd_1", ptr, cls: { [X]: "s-swap" }, ecls: { [Ap + ">"]: "s-act" }, msg: "X->prev->next = X->next." });
            N[B].prev = Ap; snap({ at: "dd_2", ptr, cls: { [X]: "s-swap" }, ecls: { [B + "<"]: "s-act" }, msg: "X->next->prev = X->prev. X е откачен с две пренасочвания, Θ(1) (след като е намерен)." });
            N[X].freed = true; snap({ at: "dd_free", ptr, cls: { [X]: "s-dim" }, msg: "free(X). Ако X беше единствен, S.next = S.prev = S — без специален случай." });
            delete N[X];
            return;
          }
          let prev = null, cur = head;
          const pp = () => { const o = {}; if (prev != null) o[prev] = ["prev"]; if (cur != null) (o[cur] = o[cur] || []).push("cur"); return o; };
          snap({ at: "d_init", ptr: pp(), msg: `delete(${x}): prev = NULL, cur = head. Ще ни трябва предходният възел.`, log });
          while (cur != null) {
            cmp++;
            const eq = N[cur].v === x;
            snap({ at: ["d_cmp", "d_loop"], ptr: pp(), cls: { [cur]: eq ? "s-swap" : "s-cmp" }, vars: { x, "cur->v": N[cur].v }, msg: `cur->v == x? ${N[cur].v} == ${x} → <b>${eq}</b>.` });
            if (eq) break;
            prev = cur; cur = N[cur].next; hops++;
            snap({ at: "d_step", ptr: pp(), msg: "prev = cur; cur = cur->next." });
          }
          if (cur == null) { out.push("nf"); snap({ at: "d_none", ptr: pp(), msg: `${x} липсва → -1.` }); return; }
          if (prev == null) { head = N[cur].next; snap({ at: "d_head", ptr: pp(), cls: { [cur]: "s-swap" }, msg: "Изтриваме първия възел: head = cur->next (специален случай без сентинел)." }); }
          else { N[prev].next = N[cur].next; snap({ at: "d_link", ptr: pp(), cls: { [cur]: "s-swap" }, ecls: { [prev + ">"]: "s-act" }, msg: "prev->next = cur->next — прескачаме cur." }); }
          N[cur].freed = true; snap({ at: "d_free", ptr: pp(), cls: { [cur]: "s-dim" }, msg: "free(cur). След това cur не бива да се чете (use-after-free)." });
          delete N[cur];
        }
      });
      const lst = [], back = [];
      if (dbl) { for (let p = N[SID].next; p !== SID; p = N[p].next) lst.push(N[p].v); for (let p = N[SID].prev; p !== SID; p = N[p].prev) back.push(N[p].v); }
      else for (let p = head; p != null; p = N[p].next) lst.push(N[p].v);
      snap({ done: true, msg: `Край. Списък: <b>${lst.join(" → ") || "празен"}</b>. Изход: ${out.join(" ") || "—"}.${dbl ? " Обратно (по prev): " + (back.join(" → ") || "—") + "." : ""}` });
      return { frames: F, out: out.join(" ") || "-", list: lst.join(" ") || "-", back: back.join(" ") || "-", cmp, hops };
    },

    /** Грешният ред на присвояванията при вмъкване (схема 9, обратно). */
    wrong({ vals, after, x }) {
      const a = S.parseNums(vals, { minLen: 2, maxLen: 8, min: -999, max: 999 });
      after = S.int(after, -999, 999, "P");
      x = S.int(x, -999, 999, "X");
      const pi = a.indexOf(after);
      if (pi < 0) throw new Error(`Няма възел ${after} в списъка.`);
      if (pi === a.length - 1) throw new Error("Избери P, който не е последен — иначе няма остатък за губене.");
      const N = {}; a.forEach((v, i) => (N[i + 1] = { v, next: i + 2 <= a.length ? i + 2 : null }));
      const P = pi + 1, Q = pi + 2, X = 99;
      N[X] = { v: x, next: null };
      const F = [];
      const snap = (o) => F.push(Object.assign({ st: { nodes: JSON.parse(JSON.stringify(N)), head: 1 } }, o));
      snap({ ptr: { [P]: ["P"], [Q]: ["Q"], [X]: ["X"] }, cls: { [X]: "s-done" }, msg: "Нов възел X, още несвързан. Опитваме ГРЕШНИЯ ред." });
      N[P].next = X;
      const lost = {}; for (let k = Q; k <= a.length; k++) lost[k] = "s-swap";
      snap({ at: "w_1", ptr: { [P]: ["P"], [X]: ["X"] }, cls: Object.assign({ [X]: "s-done" }, lost), ecls: { [P + ">"]: "s-act" }, msg: `P.next = X. Единственият указател към Q (${a[pi + 1]}) беше P.next — <b>остатъкът е недостижим</b> (червено). В C това е изтичане на памет.` });
      N[X].next = N[P].next;
      snap({ at: "w_2", ptr: { [P]: ["P"], [X]: ["X"] }, cls: Object.assign({ [X]: "s-swap" }, lost), ecls: { [X + ">"]: "s-swap" }, done: true, msg: "X.next = P.next — но P.next вече е X, така че X сочи себе си. Обход оттук никога не стига NULL." });
      return { frames: F };
    },
  };

  function drawList(st, f) {
    st.innerHTML = "";
    const box = h("div", { class: "t4scroll" });
    T4.list(box, f.st, { ptr: f.ptr, cls: f.cls, ecls: f.ecls, double: f.dbl });
    st.append(box);
    if (f.out) st.append(h("div", { class: "t4out" }, h("span", { class: "muted", text: "изход (find → позиция, nf → няма):" }), ...(f.out.length ? f.out.map((x) => h("span", { class: "pill " + (x === "nf" || x === "-1" ? "s-swap" : ""), text: x })) : [h("span", { class: "muted", text: "—" })])));
  }

  const html = `
<div class="prose">
  <p><dfn data-g="едносвързан списък">Едносвързаният списък</dfn> се състои от <dfn data-g="възел">възли</dfn> с данни и връзка към следващия. Началният указател определя първия възел; последният сочи към празна връзка при некръговия вариант. <dfn data-g="двусвързан списък">Двусвързаният</dfn> възел има и връзка към предходния, което позволява движение в двете посоки срещу допълнителна памет и изменения.</p>
  <p>Добавяне в началото е Θ(1). Добавяне след известен възел е Θ(1) за свързването. Но ако първо трябва да се намери позицията, общата операция може да е Θ(n). Индексният достъп и търсенето по стойност в несортиран списък са O(n); списъкът няма директния индексен достъп на масива.</p>
</div>

<div class="block">
  <h3>Кутии и стрелки: вмъкване, търсене, изтриване (схеми 9 и 10)</h3>
  <p class="prose">Въведи своя програма. Всяко присвояване на указател е отделна стъпка; оранжевото име над кутия е локален указател (p, prev, cur, P, X), а стрелката, която току-що е променена, е оцветена. В двусвързания режим пунктирът е <code>prev</code>, а виолетовата кутия S е <dfn data-g="сентинел">сентинелът</dfn>.</p>
  <div id="v4-list"></div>
  <div class="key"><span class="formula">вмъкване на X след P:   X.next = P.next;   P.next = X;</span><br><span class="formula">изтриване на наследника Q:   P.next = Q.next;   free(Q);</span></div>
  <details class="hint"><summary>Хинт: защо за изтриване в едносвързан списък трябва предходният</summary><div>
    <p>Връзката, която трябва да се промени, е <b>в предходния</b> възел (prev->next). Възелът няма как да „намери“ предходния си без обхождане от началото. Затова изтриването държи двойка prev/cur. Специални случаи са първи възел (тогава се променя head), единствен възел и последен възел при поддържан tail.</p>
    <p>При двусвързан списък известен валиден възел може да се откачи чрез двете му връзки: A.next = B и B.prev = A — Θ(1), без prev/cur обхождане (обхождането е само за <i>намирането</i> по стойност).</p>
  </div></details>
  <details class="trap"><summary>Капан: „добавяне в списък е O(1)“</summary><div>
    <p>Има скрита предпоставка: мястото вече е известно. Ако трябва да се намери петстотният възел, достигането до него е O(n). Броячите горе разделят двете цени: „сравнения“ и „преходи“ са търсенето; самото свързване е 2 присвоявания (едносвързан) или 4 (двусвързан).</p>
    <p>„push_back без tail“ също е Θ(n) — пробвай с много pushb и гледай брояча на преходите.</p>
  </div></details>
</div>

<div class="block">
  <h3>Как редът на присвояванията губи списъка</h3>
  <p class="prose">Редът на присвояванията пази връзката към остатъка. Ако първо P.next се пренасочи към X и старият наследник не е запазен, част от списъка може да се загуби. След освобождаване указателят към възела не трябва да се използва.</p>
  <div id="v4-wrong"></div>
  <details class="trap"><summary>Капан: четене след free</summary><div>
    <p>За изтриване на наследника Q първо се запазва достъпът до него, P.next се насочва към Q.next и едва тогава Q се освобождава. След освобождаване четенето на Q.next е недопустимо в обичайния C/C++ модел. Типичната грешка е цикъл <code>for (p = head; p; p = p-&gt;next) free(p);</code> — <code>p-&gt;next</code> се чете след <code>free(p)</code>.</p>
  </div></details>
</div>

<div class="block">
  <h3>Сентинел и кръгов списък</h3>
  <p class="prose">Sentinel е служебен възел, който може да унифицира граничните случаи. Той не е допълнителен потребителски елемент. <dfn data-g="кръгов списък">Кръговият свързан списък</dfn> е друг вариант: последната връзка се връща към началото или sentinel; обходът приключва при връщане до началото, а не при празен указател. Той не е кръгов масивен буфер. Думата „кръгов“ описва логическо затваряне, а механизмът на достъп остава различен.</p>
  <p class="prose">Сравни кода за двата режима горе: в едносвързания <code>s_delete</code> има отделен клон за първи възел (<code>*head = cur-&gt;next</code>), а в двусвързания със сентинел изтриването е само два реда за всички случаи. Сентинелът не премахва нуждата от инварианти: <code>S.next</code> и <code>S.prev</code> трябва винаги да сочат валидни възли.</p>
  <details class="hint"><summary>Хинт: реални контейнери</summary><div>
    <p><code>std::forward_list</code> е едносвързан списък, <code>std::list</code> е двусвързан, <code>std::vector</code> е динамичен масив. Имената на контейнерите не бива да се смесват с абстрактните операции. Двусвързаният кръгов списък със служебен възел е класическа схема (напр. в ядрото на Linux <code>list_head</code>) — но конкретната реализация на <code>std::list</code> не е задължена от стандарта.</p>
  </div></details>
</div>`;

  <details class="hint"><summary>Хинт: кой ред за коя задача</summary><div>

  </div></details>

<div class="block">
  <h3>Дълбочина и височина при броене на ребра (схеми 13 и 14)</h3>
  <p class="prose">Ще измерваме <dfn data-g="дълбочина">дълбочина</dfn> и <dfn data-g="височина">височина</dfn> в ребра: коренът има дълбочина 0, а листът височина 0. При друга учебна конвенция може да се броят възлите, затова конвенцията трябва да се заяви. Дълбочина се измерва спрямо корена на цялото дърво; височина описва път надолу от разглеждания възел. Два възела могат да имат еднаква дълбочина и различна височина.</p>
  <div class="key"><span class="formula">n възела ⇒ n − 1 ребра      височина h ⇒ най-много 2^(h+1) − 1 възела</span></div>
  <div id="v5-h"></div>
  <details class="trap"><summary>Капан: „височината е 3“ — в ребра или във възли?</summary><div>
    <p>Някои учебници броят възли и получават разлика с единица. Това е различна конвенция, а не непременно грешка в изчислението. Тук празно поддърво има височина −1, затова листът получава 1 + max(−1, −1) = 0.</p>
  </div></details>
</div>

<div class="block">
  <h3>Full, complete и perfect (схема 15)</h3>
  <p class="prose">Имената се употребяват различно в някои учебници. Тук се използват изричните правила: <dfn data-g="full binary tree">full</dfn> или proper означава всеки възел да има нула или две деца; <dfn data-g="complete binary tree">complete</dfn> означава всички нива преди последното да са запълнени, а последното да се запълва отляво; <dfn data-g="perfect binary tree">perfect</dfn> означава всеки вътрешен възел да има две деца и всички листа да са на една дълбочина. Тези свойства описват формата; не определят BST подредба по ключове.</p>
  <div id="v5-shape"></div>
  <details class="trap"><summary>Капан: full и complete като синоними</summary><div>
    <p>Лявото дърво от схема 15 (<code>1 2 3 - - 4 5</code>) е full, но не complete: липсват позиции вляво на последното ниво, докато вдясно има възли. Средното (<code>1 2 3 4 5 6</code>) е complete, но не full: възелът 3 има единствено дете. Дясното (<code>1 2 3 4 5 6 7</code>) е perfect и удовлетворява и другите две правила.</p>
  </div></details>
</div>

<div class="block">
  <h3>Представяне на дърво в масив</h3>
  <p class="prose">При индексиране от нула децата на позиция i са 2i + 1 и 2i + 2, а родителят е ⌊(i − 1)/2⌋. Връзките не се пазят — изчисляват се. Така се съхранява двоичната пирамида в <a href="#dopalnenie">раздел 8</a>. За complete дърво масивът няма празнини; за изродено дърво празнините растат експоненциално с височината.</p>
  <div id="v5-arr"></div>
</div>

<div class="block">
  <h3>Дърво за израз (схема 16)</h3>
  <p class="prose">При дърво за израз вътрешните възли могат да са операции, а листата да са операнди. За (a + b) × c коренът е умножението, лявото поддърво е събирането, а дясното е c. Изпълнението трябва да получи резултата от a + b преди умножението, затова следредният обход е естествен за изчисляването. Предредът дава префиксно представяне, следредът — постфиксно. При симетричен обход скобите трябва да се възстановят според структурата, за да не се загуби групирането. Тук ключовете не образуват нареден речник: дървото моделира зависимости в израза.</p>
  <div id="v5-ex"></div>

<script>
/* Раздел 6 — двоично дърво за търсене: търсене, вмъкване, изтриване (3 случая), височина. */
(function () {
  const S = window.Study, h = S.h;

  function parseProg(str, maxOps = 30) {

      const nm = t[0].toLowerCase();
      const key = Object.keys(spec).find((k) => k === nm || spec[k].includes(nm));

      return { name: key, args, text: p };

      let root = null, nid = 1, cmp = 0;

      // връзка към възел: {get,set}

          while (r[side]) { r = r[side]; path.push(r.id); snap({ at: op.name, cur: r.id, path: path.slice(), msg: `→ ${r.key}` }); }

          snap({ at: op.name, cur: r.id, path, found: r.id, msg: `${op.name === "min" ? "Минимум" : "Максимум"}: <b>${r.key}</b> (няма ${side === "l" ? "ляво" : "дясно"} дете).` });

        }

          if (op.name === "find") {

              const left = key < r.key;
              snap({ at: left ? "s_left" : "s_right", cur: r.id, path: path.slice(), cut: (left ? r.r : r.l) ? (left ? r.r : r.l).id : null, msg: `${key} &lt; ${r.key}? → <b>${left}</b> ⇒ ${left ? "наляво; цялото дясно поддърво отпада" : "надясно; цялото ляво поддърво отпада"}.` });
              r = left ? r.l : r.r; d++;
            }
            out.push("nf");
            snap({ at: "s_none", path, msg: `Стигнахме NULL → ${key} липсва. Посетени ${path.length} възела ≤ h + 1.` });
          } else if (op.name === "ins") {

              cmp++;
              const left = key < r.key;
              snap({ at: "i_go", cur: r.id, path: path.slice(), msg: `${key} ${left ? "&lt;" : "&gt;"} ${r.key} ⇒ ${left ? "наляво" : "надясно"}.` });

            if (!x.l && !x.r) {
              snap({ at: "d_c0", cur: x.id, del: x.id, path, msg: `<b>Случай 1 — лист.</b> ${key} няма деца.` });

              snap({ at: "d_leaf", path, msg: "Откачаме: връзката от родителя става NULL. free." });
            } else if (!x.l || !x.r) {

              link.set(c);
              snap({ at: "d_one", found: c.id, path, msg: "*link = детето. Редът се запазва: цялото поддърво беше от същата страна на родителя." });
            } else {
              snap({ at: ["d_c2", "d_c0", "d_c1"], cur: x.id, del: x.id, path, msg: `<b>Случай 3 — две деца.</b> Търсим симетричния наследник: най-малкия в дясното поддърво.` });
              let s = childLink(x, "r");
              snap({ at: "d_succ0", cur: x.id, mark: s.get().id, del: x.id, msg: `Тръгваме от дясното дете ${s.get().key}.` });

      (function a(n) { if (!n) return; a(n.l); ino.push(n.key); a(n.r); })(root);
      (function b(n) { if (!n) return; pre.push(n.key); b(n.l); b(n.r); })(root);
      snap({ done: true, msg: `Край. Симетричен обход: <b>${ino.join(" ") || "—"}</b>. Височина ${height(root)}, сравнения ${cmp}.` });
      return { frames: F, out: out.join(" ") || "-", in: ino.join(" ") || "-", pre: pre.join(" ") || "-", height: height(root), cmp };
    },

    /** Балансирано срещу изродено — едни и същи ключове в различен ред. */
    shapes({ keys, find }) {
      const ks = S.parseNums(keys, { minLen: 1, maxLen: 31, min: -999, max: 999 });
      if (new Set(ks).size !== ks.length) throw new Error("Ключовете трябва да са различни.");
      find = S.int(find, -999, 999, "Търсеният ключ");
      const ins = (t, k, id) => { if (!t) return { id, key: k, l: null, r: null }; if (k < t.key) t.l = ins(t.l, k, id); else t.r = ins(t.r, k, id); return t; };
      let A = null; ks.forEach((k, i) => (A = ins(A, k, i)));
      const sorted = ks.slice().sort((a, b) => a - b);
      let B = null, id = 100;
      (function bal(lo, hi) { if (lo > hi) return; const m = lo + ((hi - lo) >> 1); B = ins(B, sorted[m], id++); bal(lo, m - 1); bal(m + 1, hi); })(0, sorted.length - 1);
      const path = (t) => { const p = []; while (t) { p.push(t.id); if (find === t.key) break; t = find < t.key ? t.l : t.r; } return p; };
      const pA = path(A), pB = path(B);
      const n = ks.length;
      return { frames: [{ A, B, pA, pB, msg: `n = ${n}. В реда на въвеждане: височина <b>${height(A)}</b>, търсенето на ${find} посещава ${pA.length} възела. Балансирано (средата първа): височина <b>${height(B)}</b> = ⌊log₂ n⌋ = ${Math.floor(Math.log2(n))}, посещава ${pB.length}. Симетричният ред е един и същ.` }], hA: height(A), hB: height(B), vA: pA.length, vB: pB.length };
    },
  };

  /* ---------- рисуване ---------- */
  function drawBst(st, f) {
    st.innerHTML = "";
    const cls = {}, edge = {};
    (f.path || []).forEach((id) => { cls[id] = "s-cmp"; edge[id] = "s-cmp"; });
    if (f.cut != null) (function dim(n) { if (!n) return; cls[n.id] = "s-dim"; dim(n.l); dim(n.r); })(find(f.root, f.cut));
    if (f.mark != null) cls[f.mark] = "s-piv";
    if (f.del != null) cls[f.del] = "s-swap";

    st.append(tb);
    st.append(h("div", { class: "t4out" }, h("span", { class: "muted", text: "изход (find → дълбочина):" }), ...(f.out.length ? f.out.map((x) => h("span", { class: "pill " + (x === "nf" || x === "dup" || x === "E" ? "s-swap" : ""), text: x })) : [h("span", { class: "muted", text: "—" })])));
  }
  function find(n, id) { if (!n) return null; if (n.id === id) return n; return find(n.l, id) || find(n.r, id); }

<div class="prose">

  <div id="v6-sh"></div>

    <p>Пълно, съвършено и балансирано дърво са различни понятия и не трябва да се използват като синоними. „Двоично“ ограничава броя деца, BST задава ред на ключовете, а балансът ограничава формата или височината. AVL и червено-черните дървета ограничават височината чрез допълнителни правила и ротации — <a href="#dopalnenie">раздел 8</a>.</p>

<script>
/* Раздел 7 — съпоставка на реализации: таблица на сложностите и броене на стъпки за една операция. */
(function () {
  const S = window.Study, h = S.h;

  /** Брои стъпките точно както 07_compare.c (масив 0..n-1, списък 0..n-1, BST балансирано и изродено). */
  function counts(n, k, x) {
    const r = {};
    r.arrGet = 1;
    r.lstGet = k + 1;
    const fa = x >= 0 && x < n ? x + 1 : n;
    r.arrFind = fa; r.lstFind = fa;
    // балансирано BST: средата първа
    let lo = 0, hi = n - 1, c = 0;
    while (lo <= hi) { const m = lo + ((hi - lo) >> 1); c++; if (x === m) break; if (x < m) hi = m - 1; else lo = m + 1; }
    r.balFind = c;
    r.degFind = x >= 0 && x < n ? x + 1 : (x < 0 ? 1 : n);
    r.arrIns = n - k + 1;
    r.lstIns = k === 0 ? 2 : (k - 1) + 2;
    return r;
  }

  const algos = {
    counts,
    /** Анимира една операция върху избраната структура. */
    run({ n, op, k, x, ds }) {
      n = S.int(n, 1, 24, "n");
      k = S.int(k, 0, n - 1, "k");
      x = S.int(x, -99, 99, "x");
      const a = Array.from({ length: n }, (_, i) => i);
      const F = [];
      let steps = 0;
      const snap = (o) => F.push(Object.assign({ ds, n, stats: { стъпки: steps } }, o));
      if (ds === "array") {
        if (op === "get") { steps++; snap({ at: "get", arr: a, cls: { [k]: "s-done" }, msg: `a[${k}] = ${a[k]}: адресът се изчислява (база + k·размер) — <b>1 стъпка</b> за всяко k.` }); }
        else if (op === "find") {
          snap({ arr: a, msg: `Търсим ${x} в несортиран масив отляво надясно.` });
          for (let i = 0; i < n; i++) { steps++; const eq = a[i] === x; snap({ at: "find", arr: a, cls: { [i]: eq ? "s-done" : "s-cmp" }, dim: i, msg: `a[${i}] == ${x}? ${eq}.` }); if (eq) break; }
        } else {
          const b = a.concat([null]);
          snap({ arr: b.slice(), msg: `Вмъкване на позиция ${k}: всичко от k нататък се измества надясно.` });
          for (let i = n; i > k; i--) { b[i] = b[i - 1]; steps++; snap({ at: "shift", arr: b.slice(), cls: { [i]: "s-swap", [i - 1]: "s-cmp" }, msg: `a[${i}] = a[${i - 1}].` }); }
          b[k] = "X"; steps++; snap({ at: "put", arr: b.slice(), cls: { [k]: "s-done" }, msg: `a[${k}] = X. Измествания: ${n - k}.` });
        }
      } else if (ds === "list") {
        const N = {}; a.forEach((v, i) => (N[i] = { v, next: i + 1 < n ? i + 1 : null }));
        const st = () => ({ nodes: JSON.parse(JSON.stringify(N)), head: 0 });
        if (op === "get" || op === "ins") {
          const target = op === "get" ? k : k - 1;
          if (op === "ins" && k === 0) {
            N.X = { v: "X", next: 0 }; steps++;
            snap({ at: "head", st: { nodes: JSON.parse(JSON.stringify(N)), head: 0 }, cls: { X: "s-done" }, msg: "k = 0: X.next = head." });
            steps++; snap({ at: "head", st: { nodes: JSON.parse(JSON.stringify(N)), head: "X" }, cls: { X: "s-done" }, msg: "head = X. 2 стъпки — без обхождане." });
          } else {
            let p = 0;
            snap({ st: st(), ptr: { 0: ["p"] }, msg: op === "get" ? `Елемент №${k}: няма адресна аритметика — вървим по next.` : `Вмъкване на позиция ${k}: първо стигаме възел ${k - 1}.` });
            for (let i = 0; i < target; i++) { p = N[p].next; steps++; snap({ at: "walk", st: st(), ptr: { [p]: ["p"] }, cls: { [p]: "s-cmp" }, msg: `p = p->next (${i + 1}).` }); }
            if (op === "get") { steps++; snap({ at: "get", st: st(), ptr: { [p]: ["p"] }, cls: { [p]: "s-done" }, msg: `Стигнахме: ${N[p].v}. Стъпки: ${steps} = k + 1.` }); }
            else {
              N.X = { v: "X", next: N[p].next }; steps++;
              snap({ at: "link1", st: st(), ptr: { [p]: ["p"], X: ["X"] }, cls: { X: "s-done" }, msg: "X.next = p.next." });
              N[p].next = "X"; steps++;
              snap({ at: "link2", st: st(), ptr: { [p]: ["p"], X: ["X"] }, cls: { X: "s-done" }, msg: `p.next = X. Обхождане ${k - 1} + свързване 2. Без изместване на данни.` });
            }
          }
        } else {
          snap({ st: st(), msg: `Търсим ${x} по веригата.` });
          for (let p = 0; p != null; p = N[p].next) { steps++; const eq = N[p].v === x; snap({ at: "find", st: st(), ptr: { [p]: ["p"] }, cls: { [p]: eq ? "s-done" : "s-cmp" }, msg: `p->v == ${x}? ${eq}.` }); if (eq) break; }
        }
      } else {
        const bal = ds === "bal";
        const ins = (t, kk, id) => { if (!t) return { id, key: kk, l: null, r: null }; if (kk < t.key) t.l = ins(t.l, kk, id); else t.r = ins(t.r, kk, id); return t; };
        let T = null;
        if (bal) (function b(lo, hi) { if (lo > hi) return; const m = lo + ((hi - lo) >> 1); T = ins(T, m, m); b(lo, m - 1); b(m + 1, hi); })(0, n - 1);
        else for (let i = 0; i < n; i++) T = ins(T, i, i);
        if (op !== "find") { snap({ tree: T, msg: "За BST операциите по позиция (индекс) не са основни — BST се търси по ключ. Избери „търсене“." }); return { frames: F, steps: null }; }
        const path = [];
        let t = T;
        snap({ tree: T, path: [], msg: `Търсим ${x}: ${bal ? "балансирано дърво" : "изродено дърво (вмъкнато нарастващо)"}.` });
        while (t) { steps++; path.push(t.id); const eq = x === t.key; snap({ at: eq ? "eq" : "go", tree: T, path: path.slice(), found: eq ? t.id : null, msg: `${x} vs ${t.key}: ${eq ? "намерено" : x < t.key ? "наляво" : "надясно"}.` }); if (eq) break; t = x < t.key ? t.l : t.r; }
      }
      const c = counts(n, k, x);
      F[F.length - 1].done = true;
      F[F.length - 1].msg += ` <span class="muted">(Общо ${steps} стъпки.)</span>`;
      return { frames: F, steps, c };
    },
  };

  const CODE = { array: "ch07_array", list: "ch07_list", bal: "ch07_bst", deg: "ch07_bst" };

  function draw(st, f) {
    st.innerHTML = "";
    const box = h("div", { class: "t4scroll" });
    if (f.arr) { const cls = Object.assign({}, f.cls || {}); if (f.dim != null) for (let i = 0; i < f.dim; i++) cls[i] = cls[i] || "s-dim"; S.drawArray(box, f.arr, { cls }); }
    else if (f.st) T4.list(box, f.st, { ptr: f.ptr, cls: f.cls });
    else if (f.tree) { const cls = {}, edge = {}; (f.path || []).forEach((id) => { cls[id] = "s-cmp"; edge[id] = "s-cmp"; }); if (f.found != null) cls[f.found] = "s-done"; T4.tree(box, f.tree, { cls, edge, dx: 32, dy: f.ds === "deg" ? 26 : 46, r: 13 }); }
    st.append(box);
  }

  function table(host, n, k, x) {
    const c = counts(n, k, x);
    host.innerHTML = "";
    const t = h("table", { class: "t grid" });
    t.append(h("tr", null, ...["Операция", "Масив", "Свързан списък", "BST баланс.", "BST изродено"].map((s) => h("th", { text: s }))));
    const row = (name, ...v) => t.append(h("tr", null, h("th", { style: { textAlign: "left" }, text: name }), ...v.map((x2) => h("td", { text: x2 == null ? "—" : x2 }))));
    row(`достъп по индекс k = ${k}`, c.arrGet, c.lstGet, null, null);
    row(`търсене на x = ${x}`, c.arrFind, c.lstFind, c.balFind, c.degFind);
    row(`вмъкване на позиция k = ${k}`, c.arrIns, c.lstIns, null, null);
    host.append(h("div", { class: "tbl-wrap" }, t));
  }

  const html = `
<div class="block">
  <h3>Сравнителна таблица (схема 24)</h3>
  <div class="tbl-wrap"><table class="t">
    <tr><th>Операция</th><th>Динамичен масив</th><th>Свързан списък</th><th><dfn data-g="bst">BST</dfn></th></tr>
    <tr><td>Достъп по индекс</td><td class="mono">Θ(1)</td><td class="mono">O(n)</td><td>Не е основна операция</td></tr>
    <tr><td>Търсене в общия случай</td><td class="mono">O(n) несортиран</td><td class="mono">O(n)</td><td class="mono">O(h)</td></tr>
    <tr><td>Добавяне след известна позиция</td><td class="mono">O(n) с изместване</td><td class="mono">Θ(1) свързване</td><td class="mono">O(h) по ключ</td></tr>
    <tr><td>Добавяне в края</td><td class="mono">амортизирано Θ(1)</td><td class="mono">Θ(1) с tail; Θ(n) без</td><td>—</td></tr>
    <tr><td>Памет</td><td class="mono">Θ(n) плюс капацитет</td><td class="mono">Θ(n) плюс връзки</td><td class="mono">Θ(n) плюс връзки</td></tr>
  </table></div>
  <p class="prose">Таблицата не включва специализирани оптимизации и приема обичайните реализации. При масива <dfn data-g="капацитет">капацитетът</dfn> може да е по-голям от броя елементи. При списъка известната позиция трябва да е достъпна чрез подходящ указател. При BST оценката O(h) не означава гарантирано O(log n). Редът „добавяне в края“ е обобщение на разделите <a href="#stek">2</a> и <a href="#spisak">4</a>.</p>
  <div class="tbl-wrap"><table class="t">
    <tr><th>АТД</th><th>Операция</th><th>Масив / кръгов буфер</th><th>Свързани възли</th></tr>
    <tr><td><dfn data-g="стек">Стек</dfn></td><td>push / pop / top</td><td class="mono">Θ(1) (push амортизирано при растеж)</td><td class="mono">Θ(1) + алокация</td></tr>
    <tr><td><dfn data-g="опашка">Опашка</dfn></td><td>enqueue / dequeue</td><td class="mono">Θ(1) с head + size</td><td class="mono">Θ(1) с front + rear</td></tr>
    <tr><td><dfn data-g="двоично дърво">Двоично дърво</dfn></td><td>обход</td><td class="mono">Θ(n)</td><td class="mono">Θ(n), стек O(h) / опашка O(ширина)</td></tr>
  </table></div>
</div>

<div class="block">
  <h3>Броене на стъпки: една операция върху различни структури</h3>
  <p class="prose">Числата 0…n−1 са записани в масив, в едносвързан списък, в балансирано BST и в BST, получено от нарастващо вмъкване (верига). Стъпка = една елементарна операция: достъп до клетка, преход по указател, сравнение в дървото, изместване или присвояване на връзка. Таблицата се преизчислява при всяко „Изпълни“; визуализаторът показва стъпките на избраната структура.</p>
  <div id="v7-tbl"></div>

  <details class="hint"><summary>Хинт: кога списъкът печели и кога губи</summary><div>

  </div></details>

<div class="block">
  <h3>Изборът зависи от операциите и модела за памет</h3>
  <div class="prose">
    <p>Масивът дава пряк индексиран достъп и добра пространствена локалност. Вмъкване по средата може да изисква изместване. Свързаният списък дава локална промяна на връзки при известно място, но изисква обход за индекс и допълнителна памет за връзки. BST поддържа ред по ключ, а не непременно достъп по числов индекс. Така въпросът „коя структура е най-бърза“ няма един отговор без набор операции. Стекът и опашката описват ред на обслужване, а не една задължителна физическа структура.</p>
    <p>Сложността брои операции в избран модел. Реалното време включва кеш пропуски, алокации и пренасяне на данни. Малък масив с линейно търсене може да е по-бърз от сложна структура за малък конкретен набор, без да опровергава асимптотичната оценка. Практическият резултат и математическият растеж са различни твърдения и могат едновременно да са верни.</p>
  </div>
  <details class="trap"><summary>Капан: „O на едно и също n означава еднакво време“</summary><div>
    <p>Не. O(n) ограничава асимптотичния растеж. Константите, паметният достъп и цената на сравнение остават различни. Линейното търсене в масив и в свързан списък има еднакъв брой стъпки горе, но в масива съседните елементи са последователни в паметта и много от тях споделят един кеш ред (напр. 16 int в 64-байтов ред), а всеки преход по next може да е кеш пропуск (тема 1).</p>
  </div></details>

<script>
/* Раздел 8 — допълнение извън основния обхват: heap, AVL, red-black, B/B+, trie, хеш. */
(function () {
  const S = window.Study, h = S.h;

  function parseProg(str, spec, maxOps = 30) {
    const parts = String(str).split(/[,;\n]+/).map((s) => s.trim()).filter(Boolean);
    if (parts.length > maxOps) throw new Error(`Най-много ${maxOps} операции.`);
    return parts.map((p) => {
      const t = p.replace(/[()]/g, " ").trim().split(/\s+/);
      const nm = t[0].toLowerCase();
      const key = Object.keys(spec).find((k) => k === nm || (spec[k].alias || []).includes(nm));
      if (!key) throw new Error(`Непозната операция „${t[0]}“. Допустими: ${Object.keys(spec).join(", ")}.`);
      const args = t.slice(1).map((x) => { const v = Number(x); if (!Number.isInteger(v) || Math.abs(v) > 999) throw new Error(`„${x}“ в „${p}“ не е цяло число между −999 и 999.`); return v; });
      if (spec[key].args === "many" ? !args.length : args.length !== spec[key].args) throw new Error(`Грешен брой аргументи: „${p}“.`);
      return { name: key, args, text: p };
    });
  }

  // дърво от масив (heap) за рисуване: id = индекс
  const heapTree = (a) => { const mk = (i) => (i < a.length ? { id: i, key: a[i], l: mk(2 * i + 1), r: mk(2 * i + 2) } : null); return mk(0); };

  const algos = {
    heap({ prog }) {
      const ops = parseProg(prog, { push: { args: "many", alias: ["insert"] }, pop: { args: 0, alias: ["extract"] } });
      const a = [], out = [], F = [];
      let swaps = 0;
      const snap = (o) => F.push(Object.assign({ a: a.slice(), out: out.slice(), stats: { n: a.length, размени: swaps } }, o));
      snap({ msg: "Празна min-пирамида." });
      ops.forEach((op, k) => {
        const log = `${k + 1}. ${op.text}`;
        if (op.name === "push") {
          op.args.forEach((x) => {
            if (a.length >= 63) throw new Error("Най-много 63 елемента.");
            let i = a.length; a.push(x);
            snap({ at: "put", cls: { [i]: "s-done" }, msg: `push(${x}): заема следващата свободна позиция ${i} — формата остава complete.`, log: `push ${x}` });
            while (i > 0) {
              const p = (i - 1) >> 1;
              snap({ at: "up", cls: { [i]: "s-act", [p]: "s-cmp" }, msg: `родител a[${p}] = ${a[p]} ≤ a[${i}] = ${a[i]}? → <b>${a[p] <= a[i]}</b>.` });
              if (a[p] <= a[i]) { snap({ at: "upok", cls: { [i]: "s-done" }, msg: "Редът е възстановен." }); break; }
              [a[p], a[i]] = [a[i], a[p]]; swaps++;
              snap({ at: "upswap", cls: { [p]: "s-swap", [i]: "s-swap" }, msg: `Размяна — ${a[p]} се изкачва на позиция ${p}.` });
              i = p;
            }
          });
        } else {
          if (!a.length) { out.push("E"); snap({ at: "empty", msg: "pop от празна → -1.", log }); return; }
          const m = a[0]; out.push(String(m));
          snap({ at: "min", cls: { 0: "s-done" }, msg: `Минимумът е в корена: <b>${m}</b>.`, log });
          const last = a.pop();
          if (a.length) { a[0] = last; snap({ at: "last", cls: { 0: "s-act" }, msg: `Последният (${last}) заема корена; сега се спуска.` }); }
          let i = 0;
          for (;;) {
            if (!a.length) break;
            const l = 2 * i + 1, r = l + 1; let mm = i;
            if (l < a.length && a[l] < a[mm]) mm = l;
            if (r < a.length && a[r] < a[mm]) mm = r;
            const c = { [i]: "s-act" }; if (l < a.length) c[l] = "s-cmp"; if (r < a.length) c[r] = "s-cmp";
            snap({ at: ["down", "pick"], cls: c, msg: `По-малкото дете на позиция ${i}: ${l < a.length ? a[l] : "—"} / ${r < a.length ? a[r] : "—"}.` });
            if (mm === i) { snap({ at: "downok", cls: { [i]: "s-done" }, msg: "Няма по-малко дете — редът е възстановен." }); break; }
            [a[i], a[mm]] = [a[mm], a[i]]; swaps++;
            snap({ at: "downswap", cls: { [i]: "s-swap", [mm]: "s-swap" }, msg: `Размяна с ${a[i]}.` });
            i = mm;
          }
        }
      });
      const ino = []; (function f(i) { if (i >= a.length) return; f(2 * i + 1); ino.push(a[i]); f(2 * i + 2); })(0);
      snap({ done: true, msg: `Масив: [${a.join(", ")}]. Симетричен обход: ${ino.join(", ") || "—"} — <b>не</b> е непременно сортиран: heap не е BST.` });
      return { frames: F, out: out.join(" ") || "-", arr: a.join(" ") || "-", swaps };
    },

    avl({ keys }) {
      const ks = S.parseNums(keys, { minLen: 1, maxLen: 20, min: -999, max: 999 });
      let nid = 0, rot = 0;
      const F = [];
      const ht = (t) => (t ? t.h : -1);
      const upd = (t) => { t.h = 1 + Math.max(ht(t.l), ht(t.r)); };
      const bf = (t) => ht(t.l) - ht(t.r);
      let root = null;
      const cl = (n) => (n ? { id: n.id, key: n.key, h: n.h, l: cl(n.l), r: cl(n.r) } : null);
      const snap = (o) => F.push(Object.assign({ root: cl(root), stats: { ротации: rot, височина: ht(root) } }, o));
      const rr = (y) => { const x = y.l; y.l = x.r; x.r = y; upd(y); upd(x); rot++; return x; };
      const rl = (x) => { const y = x.r; x.r = y.l; y.l = x; upd(x); upd(y); rot++; return y; };
      // вмъкване с връщане по пътя; снимки след всяка проверка/ротация
      function ins(t, key, setParent) {
        if (!t) { const n = { id: nid++, key, h: 0, l: null, r: null }; setParent(n); snap({ at: "new", cur: n.id, msg: `Нов лист ${key}.` }); return n; }
        if (key === t.key) { snap({ at: "dup", cur: t.id, msg: `${key} вече е в дървото.` }); return t; }
        if (key < t.key) t.l = ins(t.l, key, (n) => (t.l = n)); else t.r = ins(t.r, key, (n) => (t.r = n));
        upd(t);
        const b = bf(t);
        snap({ at: "upd", cur: t.id, msg: `Връщаме се през ${t.key}: h = ${t.h}, balance factor = h(L) − h(R) = ${ht(t.l)} − (${ht(t.r)}) = <b>${b}</b>.${Math.abs(b) > 1 ? " Нарушение!" : ""}` });
        let nt = t, kind = null;
        if (b > 1 && key < t.l.key) { kind = "LL"; nt = rr(t); }
        else if (b < -1 && key > t.r.key) { kind = "RR"; nt = rl(t); }
        else if (b > 1) { kind = "LR"; t.l = rl(t.l); setParent(t); snap({ at: "LR", cur: t.id, msg: `Ляво-дясно: първо лява ротация при ${t.l.l.key} — ${t.l.key} се издига.` }); nt = rr(t); }
        else if (b < -1) { kind = "RL"; t.r = rr(t.r); setParent(t); snap({ at: "RL", cur: t.id, msg: `Дясно-ляво: първо дясна ротация при ${t.r.r.key} — ${t.r.key} се издига.` }); nt = rl(t); }
        if (kind) {
          setParent(nt);
          const nm = { LL: "ляво-ляво → дясна ротация", RR: "дясно-дясно → лява ротация", LR: "… после дясна ротация", RL: "… после лява ротация" }[kind];
          snap({ at: kind, cur: nt.id, rotated: true, msg: `Случай ${kind}: ${nm}. ${nt.key} е новият корен на поддървото; симетричният ред е запазен.`, log: `${kind} при ${t.key}` });
        }
        return nt;
      }
      snap({ msg: "Празно AVL дърво. Над всеки възел е balance factor." });
      ks.forEach((k) => { snap({ at: "goleft", msg: `insert(${k}): BST вмъкване надолу, проверка на баланса нагоре.`, log: `insert ${k}` }); root = ins(root, k, (n) => (root = n)); });
      const pre = [], ino = [];
      (function p(t) { if (!t) return; pre.push(t.key); p(t.l); p(t.r); })(root);
      (function i(t) { if (!t) return; i(t.l); ino.push(t.key); i(t.r); })(root);
      snap({ at: "ok", done: true, msg: `Край. Височина ${ht(root)} за n = ${ino.length} (⌊log₂ n⌋ = ${Math.floor(Math.log2(ino.length))}); ротации ${rot}. Симетричен ред: ${ino.join(" ")}.` });
      return { frames: F, pre: pre.join(" "), in: ino.join(" "), height: ht(root), rot };
    },

    trie({ words, query }) {
      const ws = String(words).split(/[\s,]+/).filter(Boolean);
      if (ws.length > 12) throw new Error("Най-много 12 думи.");
      ws.forEach((w) => { if (!/^[a-z]{1,8}$/.test(w)) throw new Error(`„${w}“: само малки латински букви, до 8.`); });
      query = String(query).trim();
      if (!/^[a-z]{0,8}$/.test(query)) throw new Error("Заявката: малки латински букви.");
      let id = 0;
      const root = { id: id++, ch: "", end: false, kids: {} };
      ws.forEach((w) => { let n = root; for (const c of w) { if (!n.kids[c]) n.kids[c] = { id: id++, ch: c, end: false, kids: {} }; n = n.kids[c]; } n.end = true; });
      const F = [], path = [root.id];
      F.push({ root, path: path.slice(), msg: `Trie с ${ws.length} думи и ${id} възела. Търсим „${query}“ символ по символ.` });
      let n = root, ok = true;
      for (let i = 0; i < query.length; i++) {
        const c = query[i];
        if (!n.kids[c]) { ok = false; F.push({ root, path: path.slice(), miss: true, msg: `Няма ребро „${c}“ — „${query}“ не е нито дума, нито префикс.` }); break; }
        n = n.kids[c]; path.push(n.id);
        F.push({ root, path: path.slice(), msg: `„${query.slice(0, i + 1)}“ — ребро „${c}“.` });
      }
      if (ok) {
        const under = []; (function col(x, pre) { if (x.end) under.push(pre); Object.keys(x.kids).sort().forEach((c) => col(x.kids[c], pre + c)); })(n, query);
        F.push({ root, path, hit: n.end, done: true, msg: n.end ? `„${query}“ е <b>записан ключ</b> (маркер за край). Думи с този префикс: ${under.join(", ")}.` : `„${query}“ е път/префикс, но <b>не е записан ключ</b> — няма маркер за край. Думи с този префикс: ${under.join(", ") || "—"}.` });
      }
      return { frames: F, nodes: id, isWord: ok && n.end };
    },
  };

  /* ---------- рисуване ---------- */
  function drawHeap(st, f) {
    st.innerHTML = "";
    const row = h("div", { class: "t4row" });
    const tb = h("div", { class: "t4scroll" });
    const top = {}; f.a.forEach((_, i) => (top[i] = "[" + i + "]"));
    T4.tree(tb, heapTree(f.a), { cls: f.cls, top, emptyText: "Празна пирамида." });
    const ab = h("div", { class: "t4col t4scroll", style: { flex: "1 1 280px" } }, h("span", { class: "t4cap", text: "масив (деца на i: 2i+1, 2i+2)" }));
    S.drawArray(ab, f.a.length ? f.a : [null], { cls: f.a.length ? f.cls : { 0: "s-dim" }, append: true });
    ab.append(h("div", { class: "t4out" }, h("span", { class: "muted", text: "изведени:" }), ...(f.out.length ? f.out.map((x) => h("span", { class: "pill " + (x === "E" ? "s-swap" : "s-done"), text: x })) : [h("span", { class: "muted", text: "—" })])));
    row.append(tb, ab);
    st.append(row);
  }

  function drawAvl(st, f) {
    st.innerHTML = "";
    const cls = {}, top = {};
    (function w(t) { if (!t) return; const b = (t.l ? t.l.h : -1) - (t.r ? t.r.h : -1); top[t.id] = (b > 0 ? "+" : "") + b; if (Math.abs(b) > 1) cls[t.id] = "s-swap"; w(t.l); w(t.r); })(f.root);
    if (f.cur != null) cls[f.cur] = f.rotated ? "s-done" : cls[f.cur] || "s-act";
    const tb = h("div", { class: "t4scroll" });
    T4.tree(tb, f.root, { cls, top, emptyText: "Празно дърво." });
    st.append(tb);
  }

  function drawTrie(st, f) {
    st.innerHTML = "";
    const conv = (n) => { const ks = Object.keys(n.kids).sort(); return { id: n.id, key: n.ch || "·", end: n.end, kids: ks.map((c) => conv(n.kids[c])) }; };
    const T = conv(f.root);
    // общо дърво: рисуваме по листа
    let x = 0; const pos = {}; let maxD = 0;
    (function lay(n, d) { maxD = Math.max(maxD, d); if (!n.kids.length) { pos[n.id] = { x: x++, d }; return; } n.kids.forEach((c) => lay(c, d + 1)); const xs = n.kids.map((c) => pos[c.id].x); pos[n.id] = { x: (Math.min(...xs) + Math.max(...xs)) / 2, d }; })(T, 0);
    const dx = 40, dy = 50, R = 15, W = Math.max(x, 1) * dx + 40, H = maxD * dy + 50;
    const sv = S.svg, svg = sv("svg", { class: "g", viewBox: `0 0 ${W} ${H}`, width: W, style: "max-width:none" });
    const P = (id) => ({ x: 20 + R + pos[id].x * dx, y: 20 + pos[id].d * dy });
    const onPath = new Set(f.path);
    (function e(n) { n.kids.forEach((c) => { const a = P(n.id), b = P(c.id); svg.append(sv("line", { x1: a.x, y1: a.y + R, x2: b.x, y2: b.y - R, class: "edge " + (onPath.has(c.id) ? "s-cmp" : "") })); e(c); }); })(T);
    (function d(n) {
      const p = P(n.id);
      let cls = onPath.has(n.id) ? "s-cmp" : "";
      if (f.done && n.id === f.path[f.path.length - 1]) cls = f.hit ? "s-done" : "s-swap";
      const g = sv("g", { class: "node " + cls });
      g.append(sv("circle", { cx: p.x, cy: p.y, r: R, style: n.end ? "stroke-width:4" : "" }));
      g.append(sv("text", { x: p.x, y: p.y + 4.5, "text-anchor": "middle", style: "font-weight:600", text: n.key }));
      svg.append(g);
      n.kids.forEach(d);
    })(T);
    const tb = h("div", { class: "t4scroll" }); tb.append(svg);
    st.append(tb, h("p", { class: "muted", style: { fontSize: ".8rem" }, text: "Удебелен кръг = маркер за край на дума. Символът е този на влизащото ребро; коренът „·“ е празният префикс." }));
  }

  // статични схеми: red-black, B, B+
  function rbFigure(host) {
    // валиден пример: 20(B) 10(B) 30(R) 25(B) 40(B) 5(R) — черни височини еднакви
    const T = { id: 0, key: 20, l: { id: 1, key: 10, l: { id: 5, key: 5, l: null, r: null }, r: null }, r: { id: 2, key: 30, l: { id: 3, key: 25, l: null, r: null }, r: { id: 4, key: 40, l: null, r: null } } };
    const color = { 0: "B", 1: "B", 2: "R", 3: "B", 4: "B", 5: "R" };
    const cls = {}; for (const k in color) cls[k] = color[k] === "R" ? "s-swap" : "";
    T4.tree(host, T, { cls, label: (n) => n.key + color[n.id], nulls: true });
  }
  function bFigure(host, plus) {

    const svg = sv("svg", { class: "g", viewBox: `0 0 ${W} ${H}`, width: W, style: "max-width:100%;height:auto" });

<div class="block">
  <h3>AVL дърво и ротации (схеми 21 и 22)</h3>
  <p class="prose"><dfn data-g="avl">AVL</dfn> е BST с допълнително правило: за всеки възел височините на лявото и дясното поддърво се различават най-много с 1. <dfn data-g="balance factor">Balance factor</dfn> = h(left) − h(right) ∈ {−1, 0, +1}, като празно поддърво има височина −1. След добавяне на 30, 20 и 10 при 30 разликата става 2 и трябва дясна <dfn data-g="ротация">ротация</dfn>: 20 става корен, 10 остава вляво, 30 застава вдясно. При 30, 10, 20 възниква случай ляво-дясно: първо лява ротация при 10, след това дясна при 30. Поддържаните AVL операции търсене, вмъкване и изтриване имат най-лоша цена O(log n).</p>

  </div></details>

<div class="block">

<div class="block">

  <p class="prose"><dfn data-g="b-tree">B-tree</dfn> е многоразклонено дърво за търсене: един възел съдържа няколко наредени ключа и може да има повече от две деца. Възел [20 | 40] разделя три области: под 20, между 20 и 40 и над 40. Листата са на едно ниво. При <dfn data-g="b+ tree">B+ tree</dfn> вътрешните ключове насочват търсенето, а записите са в листата; равенство с разделителя насочва надясно и не приключва търсенето. Листата са свързани за последователно преминаване: за диапазон 12…27 се намира първият подходящ лист и се продължава. При запълнен възел вмъкване може да предизвика разделяне, <dfn data-g="split">split</dfn> — различно от двоична ротация. Голямото разклоняване намалява броя нива и посетените страници при блоков достъп — затова B-tree индексите са в базите от данни (тема 6).</p>

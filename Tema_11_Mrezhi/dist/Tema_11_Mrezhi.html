<script>
/* Раздел 5 — IP адресиране и маршрутизация: калкулатор на подмрежи, най-дълъг префикс, NAT, TTL. */
(function () {
  const S = window.Study, h = S.h;

  function parseIPv4(s, name) {
    const m = String(s).trim().match(/^(\d+)\.(\d+)\.(\d+)\.(\d+)$/);
    if (!m) throw new Error(`${name}: очаква се IPv4 адрес, напр. 192.168.10.70.`);
    const o = m.slice(1).map(Number); if (o.some((x) => x > 255)) throw new Error(`${name}: октетите са 0…255.`);
    return ((o[0] << 24) | (o[1] << 16) | (o[2] << 8) | o[3]) >>> 0;
  }
  const ipS = (v) => [v >>> 24, (v >>> 16) & 255, (v >>> 8) & 255, v & 255].join(".");
  const maskOf = (p) => (p ? (0xffffffff << (32 - p)) >>> 0 : 0);
  const bin32 = (v) => (v >>> 0).toString(2).padStart(32, "0");

  function parseRoutes(txt) {
    const lines = String(txt).split(/\n|;/).map((x) => x.trim()).filter(Boolean);
    if (!lines.length) throw new Error("Таблицата е празна.");
    if (lines.length > 12) throw new Error("Най-много 12 маршрута.");
    return lines.map((l) => {
      const m = l.match(/^(\d+\.\d+\.\d+\.\d+)\s*\/\s*(\d+)\s*(?:->|→)?\s*(.*)$/);
      if (!m) throw new Error(`„${l}“: формат „префикс/дължина -> следващ хоп“.`);
      const a = parseIPv4(m[1], "Префикс"), len = S.int(m[2], 0, 32, "Дължината на префикса");
      if (((a & maskOf(len)) >>> 0) !== a) throw new Error(`${m[1]}/${len}: има единици в хостовата част — мрежовият адрес е ${ipS((a & maskOf(len)) >>> 0)}.`);
      return { pfx: a, len, via: m[3].trim() || "—", txt: `${m[1]}/${len}` };
    });
  }

  const algos = {
    /* Като subnet() в C */
    subnet({ ip, prefix }) {
      const a = parseIPv4(ip, "Адрес"), p = S.int(prefix, 0, 32, "Префиксът");
      const F = [], mask = maskOf(p), net = (a & mask) >>> 0, bc = (net | (~mask >>> 0)) >>> 0, size = 2 ** (32 - p);
      const base = { a, p, mask, net, bc };
      F.push(Object.assign({ step: 0, msg: `Адрес ${ipS(a)} в двоичен вид. /${p} означава: първите ${p} бита са мрежова част, останалите ${32 - p} — хостова.`, vars: { addr: ipS(a), prefix: p } }, base));
      F.push(Object.assign({ step: 1, at: "mask", msg: `Маска = ${p} единици, после нули: <b>${ipS(mask)}</b>.`, vars: { mask: ipS(mask) }, log: `mask ${ipS(mask)}` }, base));
      F.push(Object.assign({ step: 2, at: "net", msg: `Мрежов адрес = addr AND mask → хостовите битове стават 0: <b>${ipS(net)}</b>.`, vars: { net: ipS(net) }, log: `net ${ipS(net)}` }, base));
      F.push(Object.assign({ step: 3, at: "bcast", msg: `Broadcast = net OR ~mask → хостовите битове стават 1: <b>${ipS(bc)}</b>.`, vars: { bcast: ipS(bc) }, log: `bcast ${ipS(bc)}` }, base));
      F.push(Object.assign({ step: 4, at: "size", msg: `Размер на блока = 2^${32 - p} = <b>${size.toLocaleString("bg")}</b> адреса.`, vars: { size } }, base));
      let first, last, hosts;
      if (p >= 31) {
        first = net; last = bc; hosts = p === 31 ? 2 : 1;
        F.push(Object.assign({ step: 5, at: "special", first, last, hosts, msg: p === 31 ? `<b>Специален случай /31</b>: двата адреса се използват за връзка точка–точка — няма отделни адреси за мрежата и за broadcast (RFC 3021).` : `<b>/32</b>: един адрес — маршрут до конкретен хост.`, vars: { hosts }, log: `хостове ${hosts}` }, base));
      } else {
        first = net + 1; last = bc - 1; hosts = size - 2;
        F.push(Object.assign({ step: 5, at: "hosts", first, last, hosts, msg: `Обичайни хостове: от <b>${ipS(first)}</b> до <b>${ipS(last)}</b> — ${hosts.toLocaleString("bg")} адреса (без мрежовия и broadcast).`, vars: { first: ipS(first), last: ipS(last), hosts }, log: `хостове ${hosts}` }, base));
      }
      F.push(Object.assign({ step: 6, at: "ret", first, last, hosts, done: true, msg: `${ipS(a)}/${p} е в мрежа ${ipS(net)}/${p}.`, vars: {} }, base));
      return { frames: F, result: [ipS(mask), ipS(net), ipS(bc), ipS(first), ipS(last), hosts].join(" ") };
    },

    /* Като lookup() в C */
    lpm({ routes, dst }) {
      const rt = parseRoutes(routes), d = parseIPv4(dst, "Цел");
      const F = [];
      let best = -1;
      F.push({ rt, d, best, msg: `Пакет към <b>${ipS(d)}</b>. Проверяваме <b>всеки</b> ред — редът в таблицата не е важен, важна е дължината на съвпадението.`, vars: { dst: ipS(d) } });
      rt.forEach((r, i) => {
        const m = maskOf(r.len), ok = ((d & m) >>> 0) === r.pfx;
        F.push({ at: ["mask", "cmp"], rt, d, best, i, ok, msg: `${r.txt}: ${ipS(d)} AND ${ipS(m)} = ${ipS((d & m) >>> 0)} ${ok ? "= префикса → <b>съвпада</b>" : "≠ " + ipS(r.pfx)}.`, vars: { i, "dst&mask": ipS((d & m) >>> 0), best }, log: `${r.txt}: ${ok ? "да" : "не"}` });
        if (ok) {
          const prev = best, better = best < 0 || r.len > rt[best].len;
          if (better) best = i;
          F.push({ at: better ? ["match", "best"] : "match", rt, d, best, i, ok, msg: better ? (prev < 0 ? `Първо съвпадение → best = ${i} (/${r.len}).` : `/${r.len} е по-дълъг от /${rt[prev].len} → по-специфичен, best = ${i}.`) : `Съвпада, но /${r.len} не е по-дълъг от /${rt[best].len} — пропускаме.`, vars: { i, best } });
        }
      });
      F.push({ at: "ret", rt, d, best, done: true, msg: best < 0 ? "Няма съвпадение и няма default маршрут → пакетът се отхвърля." : `Избран е <b>${rt[best].txt}</b> → ${S.esc(rt[best].via)}.${rt[best].len === 0 ? " Това е default маршрутът — по-специфично съвпадение няма." : ""}`, vars: { return: best }, stats: { "редове": rt.length } });
      return { frames: F, result: best };
    },

    /* Като nat_out()/nat_in() в C */
    nat({ events, pub }) {
      const P = parseIPv4(pub, "Публичен адрес");
      const ev = String(events).split(/[,;\n]+/).map((x) => x.trim()).filter(Boolean);
      if (!ev.length) throw new Error("Въведи поне едно събитие.");
      if (ev.length > 16) throw new Error("Най-много 16 събития.");
      const tab = [], F = [], res = [];
      let next = 40000;
      F.push({ tab: [], pub: P, msg: `NAT устройство с публичен адрес ${ipS(P)}. Таблицата е празна.`, vars: { next } });
      ev.forEach((e) => {
        let m = e.match(/^out\s+(\d+\.\d+\.\d+\.\d+):(\d+)$/i);
        if (m) {
          const ip = parseIPv4(m[1], "Вътрешен адрес"), port = S.int(m[2], 1, 65535, "Портът");
          let k = tab.findIndex((t) => t.ip === ip && t.port === port);
          F.push({ at: "find", tab: tab.map((t) => ({ ...t })), pub: P, cur: k, ev: e, msg: `Изходящ пакет от ${ipS(ip)}:${port}. Има ли вече запис?`, vars: { src: `${ipS(ip)}:${port}` } });
          if (k >= 0) { res.push(tab[k].out); F.push({ at: "hit", tab: tab.map((t) => ({ ...t })), pub: P, cur: k, ev: e, msg: `Да — използваме същия публичен порт ${tab[k].out}. Пакетът излиза като <b>${ipS(P)}:${tab[k].out}</b>.`, vars: { out: tab[k].out }, log: `${ipS(ip)}:${port} → ${ipS(P)}:${tab[k].out}` }); }
          else { tab.push({ ip, port, out: next++ }); k = tab.length - 1; res.push(tab[k].out); F.push({ at: "new", tab: tab.map((t) => ({ ...t })), pub: P, cur: k, isNew: true, ev: e, msg: `Не — нов запис: ${ipS(ip)}:${port} ↔ ${ipS(P)}:${tab[k].out}. Адресът <b>и портът</b> на изпращача се подменят.`, vars: { out: tab[k].out, next }, log: `нов: ${ipS(ip)}:${port} → ${tab[k].out}` }); }
          return;
        }
        m = e.match(/^in\s+(\d+)$/i);
        if (m) {
          const dport = S.int(m[1], 1, 65535, "Портът");
          const k = tab.findIndex((t) => t.out === dport);
          F.push({ at: "rfind", tab: tab.map((t) => ({ ...t })), pub: P, cur: k, ev: e, msg: `Входящ пакет към ${ipS(P)}:${dport}. Търсим запис с този публичен порт.`, vars: { dport } });
          if (k >= 0) { res.push(`${ipS(tab[k].ip)}:${tab[k].port}`); F.push({ at: "rhit", tab: tab.map((t) => ({ ...t })), pub: P, cur: k, ev: e, msg: `Намерен → превежда се към <b>${ipS(tab[k].ip)}:${tab[k].port}</b>.`, vars: {}, log: `in ${dport} → ${ipS(tab[k].ip)}:${tab[k].port}` }); }
          else { res.push(0); F.push({ at: "rmiss", tab: tab.map((t) => ({ ...t })), pub: P, cur: -1, miss: true, ev: e, msg: `Няма запис → няма към кого да се преведе; пакетът не стига до вътрешна машина. Това е <b>страничен ефект</b> на преобразуването, не политика за защита.`, vars: {}, log: `in ${dport} → няма запис` }); }
          return;
        }
        throw new Error(`„${e}“: очаква се „out IP:порт“ или „in порт“.`);
      });
      return { frames: F, res };
    },
  };

  const DEF_RT = "0.0.0.0/0 -> default 203.0.113.1; 10.0.0.0/8 -> R2; 10.1.0.0/16 -> R3; 10.1.2.0/24 -> eth1 (директно); 192.168.10.0/24 -> eth0 (директно)";

  function bitRow(lab, v, p, extra = {}) {
    const b = bin32(v), r = h("div", { class: "mono", style: { display: "flex", gap: "2px", alignItems: "center", fontSize: "12px", flexWrap: "nowrap" } }, h("span", { style: { width: "6em", flex: "none" }, text: lab }));
    for (let i = 0; i < 32; i++) {
      let cls = i < p ? "s-piv" : extra.hostCls || "s-dim";
      if (extra.cls) cls = extra.cls(i) || cls;
      r.append(h("span", { class: cls, style: { width: "1.25em", textAlign: "center", background: "var(--cb)", border: "1px solid var(--c, var(--line))", borderRadius: "2px", marginRight: i % 8 === 7 && i < 31 ? "6px" : 0 }, text: b[i] }));
    }
    r.append(h("span", { style: { marginLeft: "8px" }, text: ipS(v) }));
    return r;
  }

  const html = `
<div class="prose">
  <p>IPv4 използва 32-битови адреси, а IPv6 — 128-битови. <dfn data-g="префикс">Префиксът</dfn> указва мрежовата част. При IPv4 адрес 192.168.10.34/24 мрежовият адрес е 192.168.10.0, маската е 255.255.255.0, а обичайният broadcast адрес е 192.168.10.255. Конкретните правила за използваеми адреси имат специални случаи, например /31 връзки.</p>
</div>

<div class="block">
  <h3>Калкулатор на подмрежи (Схема 17)</h3>
  <p class="prose">За /26 маската е 255.255.255.192 и блокът съдържа 64 адреса. Адрес 192.168.10.70/26 принадлежи на блока 64–127: мрежа 192.168.10.64 и broadcast 192.168.10.127; обичайният диапазон за хостове е 65–126. Първите два бита от последния октет са мрежови, а останалите шест — хостови. <b>Условие:</b> стандартна IPv4 подмрежа с broadcast семантика.</p>
  <div id="v-sub"></div>
  <div class="key"><span class="formula">net = addr &amp; mask · bcast = net | ~mask · размер = 2^(32−p) · хостове = размер − 2</span> (за p ≤ 30)</div>
  <details class="hint"><summary>Хинт: пресмятане наум за /26</summary><div>
    <p>Хостовите битове са 6 → блок 64. Блоковете в последния октет започват на 0, 64, 128, 192. 70 е в блока 64–127. Мрежата е първото число на блока (.64), broadcast — последното (.127). Това е опорният план: „Пресмятам /24 и /26“.</p>
  </div></details>
  <details class="trap"><summary>Капан: „броят хостове е винаги 2ⁿ − 2“</summary><div>
    <p>Правилото приема стандартна подмрежа с broadcast. При /31 двата адреса се използват за връзка точка–точка; /32 е един конкретен адрес.</p>
  </div></details>
</div>

<div class="block">
  <h3>Най-дългият съвпадащ префикс (Схема 19)</h3>
  <p class="prose"><dfn data-g="маршрутизатор">Маршрутизаторът</dfn> избира <dfn data-g="longest prefix match">най-дългия съответстващ префикс</dfn>. <dfn data-g="маршрут">Маршрутът</dfn> указва следващ хоп или директен интерфейс. <dfn data-g="default маршрут">Default маршрутът</dfn> /0 се използва, когато няма по-специфично съответствие. Редактирай таблицата (маршрутите се разделят с „;“) и целта.</p>
  <div id="v-lpm"></div>
  <details class="trap"><summary>Капан: „първият подходящ ред печели“</summary><div>
    <p>Longest prefix match избира най-специфичния съвпадащ префикс, а не първия визуално сходен ред. Административни предпочитания и метрики действат при построяване на таблицата и при избор между маршрути <b>към същия префикс</b>.</p>
  </div></details>
  <details class="hint"><summary>Хинт: построяване на таблицата срещу препращане</summary><div>
    <p>Разпределената маршрутизация обменя информация за достижимост — например <dfn data-g="bgp">BGP</dfn> между автономни системи. Локалното препращане на всеки пакет използва вече изградената таблица. Това са два отделни механизма: маршрутният протокол разпространява пътища, препращането ги прилага.</p>
  </div></details>
</div>

<div class="block">
  <h3>NAT: преобразуване на адреси и портове</h3>
  <p class="prose"><dfn data-g="nat">NAT</dfn> преобразува адреси, а често и портове. Той позволява споделяне на публичен IPv4 адрес, но не е равнозначен на защитна стена и не е същото като маршрутизация, макар да се извършва в същото устройство. Частният адрес не е глобално уникална интернет идентичност. Учебен модел с преобразуване на портове: <code>out IP:порт</code> — изходящ пакет, <code>in порт</code> — входящ пакет към публичния адрес.</p>
  <div id="v-nat"></div>
  <details class="trap"><summary>Капан: „NAT е защитна стена“</summary><div>
    <p>Това, че входящ пакет без запис не се превежда, е следствие от преобразуването, не политика за сигурност. Защитната стена е отделен механизъм с изрични правила.</p>
  </div></details>
</div>

    <p>MTU, Maximum Transmission Unit, ограничава преносимия пакет за интерфейс или път. При IPv6 маршрутизаторите не фрагментират транзитни пакети по начина на класическия IPv4 модел.</p>
  </div>

<script>
/* Раздел 6 — Транспортни протоколи: TCP установяване/затваряне (машина на състоянията),
   поток срещу дейтаграми (рамкиране), надеждно предаване с прозорец, контрол на поток и задръстване. */
(function () {
  const S = window.Study, h = S.h;
  const SN = ["CLOSED", "LISTEN", "SYN_SENT", "SYN_RCVD", "ESTABLISHED", "FIN_WAIT_1", "FIN_WAIT_2", "CLOSE_WAIT", "LAST_ACK", "TIME_WAIT"];

  const algos = {
    /* Като tcp_session() в C */
    tcp({ x, y, n, listening }) {
      x = S.int(x, 0, 4294967000, "ISN на клиента"); y = S.int(y, 0, 4294967000, "ISN на сървъра"); n = S.int(n, 0, 100000, "Байтовете данни");
      const L = !!listening, F = [], segs = [];
      let cs = "CLOSED", ss = L ? "LISTEN" : "CLOSED";
      const st = (o) => F.push(Object.assign({ cs, ss, segs: segs.slice() }, o));
      const seg = (dir, flags, seq, ack, len, at, msg, extra = {}) => {
        const sg = { dir, flags, seq, ack, len };
        segs.push(sg);
        st(Object.assign({ at, sg, msg, vars: { "C": cs, "S": ss, seq, ack }, log: `${dir} ${flags} seq=${seq} ack=${ack}${len ? " len=" + len : ""}` }, extra));
      };
      st({ at: "init", msg: L ? "Сървърът е отворил слушащ сокет (LISTEN). Клиентът е CLOSED." : "На този порт <b>няма</b> слушащ сокет.", vars: { C: cs, S: ss } });
      cs = "SYN_SENT";
      seg("C>S", "SYN", x, 0, 0, "syn", `Клиентът изпраща <dfn data-g="syn">SYN</dfn> с начален номер x = ${x}. SYN заема една позиция в последователността.`);
      if (!L) { cs = "CLOSED"; seg("S>C", "RST+ACK", 0, x + 1, 0, "rst", "Няма слушащ процес → сървърният хост отговаря с RST. Транспортът отказва — на ниво IP хостът е достижим."); return { frames: F, segs }; }
      ss = "SYN_RCVD";
      seg("S>C", "SYN+ACK", y, x + 1, 0, "synack", `Сървърът връща SYN+ACK: своя начален номер y = ${y} и потвърждение ack = x+1 = ${x + 1} („очаквам байт ${x + 1}“).`);
      cs = "ESTABLISHED";
      seg("C>S", "ACK", x + 1, y + 1, 0, "ack3", `Клиентът потвърждава y+1 = ${y + 1}. За него връзката е установена.`);
      ss = "ESTABLISHED";
      st({ at: "est", msg: "Сървърът получи ACK — и за двете страни състоянието е ESTABLISHED. Ръкостискането съгласува състояние, <b>не удостоверява</b> самоличност.", vars: { C: cs, S: ss }, inv: { text: "трипосочно ръкостискане завърши", ok: true } });
      if (n > 0) {
        seg("C>S", "PSH+ACK", x + 1, y + 1, n, "data", `Клиентът изпраща ${n} байта; seq = ${x + 1} е номерът на първия от тях.`);
        seg("S>C", "ACK", y + 1, x + 1 + n, 0, "dack", `Сървърът потвърждава: ack = ${x + 1} + ${n} = ${x + 1 + n} — следващата очаквана позиция.`);
      }
      const cf = x + 1 + n;
      cs = "FIN_WAIT_1";
      seg("C>S", "FIN+ACK", cf, y + 1, 0, "fin1", `Клиентът приключва изпращането: <dfn data-g="fin">FIN</dfn> с seq = ${cf}. FIN също заема позиция.`);
      ss = "CLOSE_WAIT";
      seg("S>C", "ACK", y + 1, cf + 1, 0, "finack1", `Сървърът потвърждава FIN (ack = ${cf + 1}). Половин затворена връзка: сървърът още може да изпраща.`);
      cs = "FIN_WAIT_2";
      st({ at: "fw2", msg: "Клиентът чака FIN от сървъра.", vars: { C: cs, S: ss } });
      ss = "LAST_ACK";
      seg("S>C", "FIN+ACK", y + 1, cf + 1, 0, "fin2", "Сървърното приложение също затваря: FIN от сървъра.");
      cs = "TIME_WAIT";
      seg("C>S", "ACK", cf + 1, y + 2, 0, "finack2", `Клиентът потвърждава (ack = ${y + 2}) и влиза в TIME_WAIT — изчаква 2·MSL, за да може да повтори последния ACK, ако се загуби, и закъснелите стари сегменти на тази връзка да изтекат.`);
      ss = "CLOSED";
      st({ at: "closed", done: true, msg: "Сървърът получава последния ACK → CLOSED. Клиентът ще затвори след изтичане на TIME_WAIT.", vars: { C: cs, S: ss } });
      return { frames: F, segs };
    },

    /* Като feed() в C: поток с префикс за дължина, нарязан на порции */
    frame({ msgs, cuts }) {
      const M = String(msgs).split(/[,\s]+/).filter(Boolean);
      if (!M.length) throw new Error("Въведи поне едно съобщение.");
      if (M.length > 8) throw new Error("Най-много 8 съобщения.");
      M.forEach((m) => { if (m.length > 20 || !/^[\x21-\x7e]+$/.test(m)) throw new Error(`„${m}“: до 20 видими ASCII символа.`); });
      const stream = []; M.forEach((m) => { stream.push(m.length); for (const c of m) stream.push(c.charCodeAt(0)); });
      const C = S.parseNums(cuts, { min: 1, max: 200, maxLen: 30, minLen: 1 });
      const tot = C.reduce((a, b) => a + b, 0);
      if (tot !== stream.length) throw new Error(`Сборът на порциите е ${tot}, а потокът е ${stream.length} байта.`);
      const F = [], buf = [], out = [], res = [];
      let pos = 0;
      F.push({ stream, pos, buf: [], out: [], msg: `Изпращачът извиква send() ${M.length} пъти. Всяко съобщение е предшествано от 1 байт дължина. Общо ${stream.length} байта в потока.` });
      C.forEach((c, k) => {
        const chunk = stream.slice(pos, pos + c); pos += c; buf.push(...chunk);
        F.push({ at: "append", stream, pos, chunk: c, buf: buf.slice(), out: out.slice(), msg: `recv() №${k + 1} връща ${c} байта. TCP не знае къде свършва съобщението — те просто се добавят в буфера.`, vars: { получени: c, буфер: buf.length } });
        const got = [];
        while (buf.length >= 1) {
          const L = buf[0];
          F.push({ at: "len", stream, pos, buf: buf.slice(), out: out.slice(), hl: 0, msg: `Първият байт в буфера казва: съобщение с дължина ${L}.`, vars: { L, буфер: buf.length } });
          if (buf.length - 1 < L) { F.push({ at: "wait", stream, pos, buf: buf.slice(), out: out.slice(), wait: true, msg: `Налични са само ${buf.length - 1} от ${L} байта — чакаме следващата порция.`, vars: { L, буфер: buf.length } }); break; }
          const m = String.fromCharCode(...buf.slice(1, 1 + L)); buf.splice(0, 1 + L); out.push(m); got.push(m);
          F.push({ at: ["msg", "shift"], stream, pos, buf: buf.slice(), out: out.slice(), newm: m, msg: `Цяло съобщение „<b>${S.esc(m)}</b>“ → предава се на приложението.`, vars: { буфер: buf.length }, log: `recv${k + 1}: „${m}“` });
        }
        res.push(`[${c}:${got.map((g) => " " + g).join("")} |${buf.length}]`);
      });
      F.push({ done: true, stream, pos, buf: buf.slice(), out: out.slice(), msg: `Получени ${out.length} съобщения — същите като изпратените, независимо как TCP е нарязал байтовете.`, stats: { "send()": M.length, "recv()": C.length, съобщения: out.length } });
      return { frames: F, res: res.join(" ") };
    },

    /* Като arq() в C */
    arq({ N, W, lost, mode }) {
      N = S.int(N, 1, 30, "Броят сегменти"); W = S.int(W, 1, 16, "Прозорецът");
      const LS = String(lost).trim() ? S.parseNums(lost, { min: 0, max: N - 1, maxLen: N }) : [];
      const sr = mode === "sr", lostA = Array(N).fill(0); LS.forEach((s) => (lostA[s] = 1));
      let base = 0, exp = 0, tx = 0, to = 0, round = 0;
      const got = Array(N).fill(0), sent = Array(N).fill(0), F = [], rows = [];
      const snap = (o) => F.push(Object.assign({ N, W, base, exp, got: got.slice(), rows: rows.map((r) => r.slice()), stats: { предавания: tx, "изтекли таймери": to, рундове: round }, vars: { base, exp } }, o));
      snap({ msg: `${N} сегмента, прозорец W = ${W}, ${sr ? "Selective Repeat" : "Go-Back-N"}. Губи се първото предаване на: ${LS.length ? LS.join(", ") : "нищо"}. Един рунд ≈ 1 RTT.` });
      while (base < N) {
        round++;
        const end = Math.min(base + W, N), row = [];
        rows.push(row);
        for (let s = base; s < end; s++) {
          if (sr && got[s]) continue;
          tx++;
          const drop = lostA[s] && !sent[s]; sent[s]++;
          if (drop) { row.push([s, "lost"]); snap({ at: ["send", "lost"], cur: s, msg: `Рунд ${round}: сегмент ${s} е изпратен и <b>загубен</b>.`, log: `р${round}: ${s} ✕` }); continue; }
          if (s === exp || (sr && s < exp + W)) {
            got[s] = 1;
            const e0 = exp; while (exp < N && got[exp]) exp++;
            row.push([s, s === e0 ? "ok" : "buf"]);
            snap({ at: ["accept", "advance"], cur: s, msg: s === e0 ? `Сегмент ${s} пристига по ред → приет; очакваният става ${exp}.` : `Сегмент ${s} пристига извън ред → SR го <b>буферира</b> (очакван е ${e0}).`, log: `р${round}: ${s} ${s === e0 ? "✓" : "буфер"}` });
          } else {
            row.push([s, "drop"]);
            snap({ at: ["accept", "discard"], cur: s, msg: `Сегмент ${s} пристига, но очакван е ${exp} → Go-Back-N го <b>изхвърля</b>; ще се изпрати отново.`, log: `р${round}: ${s} изхвърлен` });
          }
        }
        if (exp < end) { to++; snap({ at: "timeout", msg: `Край на рунда: кумулативното ACK казва „очаквам ${exp}“. Сегмент ${exp} липсва → таймерът му изтича.` }); }
        base = exp;
        snap({ at: "slide", msg: `Прозорецът се плъзга: base = ${base}.${base < N ? ` Следващ рунд: ${sr ? "само липсващите" : "всичко"} от ${base} до ${Math.min(base + W, N) - 1}.` : ""}` });
      }
      snap({ at: "done", done: true, msg: `Всички ${N} сегмента са доставени по ред за ${round} рунда с <b>${tx}</b> предавания (${tx - N} повторни).` });
      return { frames: F, tx, to };
    },
  };

  const html = `
<div class="prose">

  const algos = {
    /* Като encode_qname() в C */
    qname({ name }) {
      name = String(name).trim().toLowerCase().replace(/\.$/, "");
      if (!name) throw new Error("Въведи домейнно име.");
      if (name.length > 100) throw new Error("Най-много 100 символа.");

      const out = [], F = [];
      F.push({ out: [], labels, li: -1, msg: `Името се разделя на ${labels.length} етикета по точките. В DNS съобщението точки няма — всеки етикет е предшестван от байт с дължината си.` });
      labels.forEach((l, i) => {

        out.push(l.length);
        F.push({ at: "lenbyte", out: out.slice(), labels, li: i, cur: out.length - 1, msg: `Байт за дължина: <code>${hx(l.length)}</code>.`, vars: { len: l.length } });
        for (const c of l) out.push(c.charCodeAt(0));

      });
      out.push(0);

    dns({ queries }) {

        lastT = t;
        return { name: m[1].toLowerCase().replace(/\.$/, ""), t };
      });

      const cget = (k, now) => { const c = C.get(k); return c && c.exp > now ? c : null; };
      const snapC = (now) => [...C.entries()].map(([k, v]) => ({ k, a: v.a, left: v.exp - now }));
      Q.forEach(({ name, t }, qi) => {

        if (c) { base({ at: "hit", hitK: "A " + name, ans: c.a, msg: `Кеширан отговор, валиден още ${c.exp - t} s → <b>${c.a}</b> без нито една заявка навън.`, log: `t=${t} ${name}: от кеша`, stats: { заявки: 0 } }); res.push(`${c.a} q=0`); return; }

        for (let i = Z.length - 1; i > 0; i--) if (inZone(name, Z[i].zone) && cget("NS " + Z[i].zone, t)) { z = i; break; }

        for (;;) {
          q++;
          base({ at: "ask", z, q, msg: `Заявка №${q} към ${Z[z].server}: „A ${name}?“`, vars: { сървър: Z[z].server }, log: `t=${t} ${name}: питам ${Z[z].zone || "."}` });

    /* DHCP DORA — учебна последователност без C (протоколен обмен, не алгоритъм) */
    dora({ lease, t }) {
      lease = S.int(lease, 60, 86400, "Наемът"); t = S.int(t, 0, 3 * lease, "Моментът");
      const F = [], M = [];

      add({ who: "C", m: { d: "C>*", n: "DISCOVER", src: "0.0.0.0:68", dst: "255.255.255.255:67", body: "„Има ли DHCP сървър?“" }, msg: "<b>D</b>iscover: broadcast от 0.0.0.0, защото клиентът още няма адрес. UDP, порт 68 → 67.", log: "DISCOVER (broadcast)" });

      add({ who: "S", m: { d: "S>C", n: "ACK", src: "192.168.10.1:67", dst: "→ клиента", body: "потвърждава 192.168.10.34, наем " + lease + " s" }, msg: "<b>A</b>cknowledgment: сървърът потвърждава. Клиентът конфигурира интерфейса.", log: "ACK" });
      const half = Math.floor(lease / 2);
      const t2 = Math.floor(lease * 7 / 8);   /* T2 = 0,875 · наема (RFC 2131 §4.4.5) */
      if (t >= t2 && t < lease) add({ who: "C", m: { d: "C>*", n: "REQUEST", src: "192.168.10.34:68", dst: "255.255.255.255:67", body: "повторно обвързване (rebinding)" }, renew: true, msg: `t = ${t} s ≥ T2 = ${t2} s (7/8 от наема): ако подновяването до сървъра не е успяло, клиентът изпраща REQUEST като <b>broadcast</b> към всеки DHCP сървър (REBINDING).`, log: "rebinding (broadcast)" });
      else if (t >= half && t < lease) add({ who: "C", m: { d: "C>S", n: "REQUEST", src: "192.168.10.34:68", dst: "192.168.10.1:67", body: "подновяване на наема" }, renew: true, msg: `t = ${t} s ≥ T1 = половината от наема (${half} s): клиентът подновява директно към сървъра — <b>не</b> повтаря целия DORA.`, log: "подновяване (unicast)" });
      else if (t >= lease) add({ who: "C", expired: true, msg: `t = ${t} s ≥ наема: без подновяване адресът изтича и клиентът започва отначало.`, log: "наемът изтече" });

<script>
/* Раздел 9 — Допълнение за оценки: L/R, разпространение, RTT, произведение капацитет–закъснение,
   ефективна скорост при ограничен прозорец. */
(function () {
  const S = window.Study, h = S.h;

  function num(v, lo, hi, name) {
    const n = Number(String(v).replace(",", "."));
    if (!Number.isFinite(n)) throw new Error(`${name} трябва да е число.`);
    if (n < lo || n > hi) throw new Error(`${name} трябва да е между ${lo} и ${hi}.`);
    return n;
  }
  const fmtT = (s) => (s >= 1 ? s.toFixed(3) + " s" : s >= 1e-3 ? (s * 1e3).toFixed(3) + " ms" : (s * 1e6).toFixed(3) + " μs");
  const fmtB = (b) => (b >= 1e6 ? (b / 1e6).toFixed(2) + " MB" : b >= 1e3 ? (b / 1e3).toFixed(1) + " kB" : Math.round(b) + " B");

  const algos = {
    /* Като estimate() в C. Входове: L байта, R Mbit/s, d km, v ×10^8 m/s, W байта */
    delay({ L, R, d, v, W }) {
      L = num(L, 1, 1e7, "L (байта)"); const Rb = num(R, 0.001, 1e5, "R (Mbit/s)") * 1e6; const dm = num(d, 0, 4e4, "Разстоянието (km)") * 1e3;
      const vm = num(v, 0.1, 3, "Скоростта на сигнала (×10⁸ m/s)") * 1e8; W = num(W, 1, 1e9, "W (байта)");
      const F = [];
      const tx = (L * 8) / Rb, prop = dm / vm, rtt = 2 * prop + tx, bdp = (Rb * rtt) / 8, per = (W * 8) / rtt, eff = Math.min(per, Rb), util = eff / Rb;
      const e = { tx, prop, rtt, bdp, eff, util, L, Rb, dm, vm, W };
      F.push(Object.assign({ step: 0, msg: `Пакет от ${L} байта = ${L * 8} бита; канал ${Rb / 1e6} Mbit/s; разстояние ${dm / 1e3} km.` }, e));
      F.push(Object.assign({ step: 1, at: "tx", msg: `<b>Време за предаване</b> L/R = ${L * 8} / ${Rb.toExponential(2)} = <b>${fmtT(tx)}</b> — колко време отнема да „избутаме“ битовете в канала.`, vars: { tx: fmtT(tx) }, log: `L/R = ${fmtT(tx)}` }, e));
      F.push(Object.assign({ step: 2, at: "prop", msg: `<b>Време за разпространение</b> d/v = ${dm} / ${vm.toExponential(1)} = <b>${fmtT(prop)}</b> — колко пътува един бит. Не зависи от скоростта на канала.`, vars: { prop: fmtT(prop) }, log: `d/v = ${fmtT(prop)}` }, e));
      F.push(Object.assign({ step: 3, at: "rtt", msg: `<b>RTT</b> ≈ 2·d/v + L/R = <b>${fmtT(rtt)}</b> (потвърждението е кратко; опашки и обработка не са включени). ${prop > tx ? "Тук закъснението е доминирано от разпространението." : "Тук доминира времето за предаване."}`, vars: { rtt: fmtT(rtt) }, log: `RTT = ${fmtT(rtt)}` }, e));
      F.push(Object.assign({ step: 4, at: "bdp", msg: `<b>Капацитет × закъснение</b> = R·RTT = <b>${fmtB(bdp)}</b> — толкова данни трябва да са „в движение“, за да е каналът зает непрекъснато.`, vars: { bdp: fmtB(bdp) }, log: `BDP = ${fmtB(bdp)}` }, e));
      F.push(Object.assign({ step: 5, at: "eff", msg: `Най-много W = ${fmtB(W)} без потвърждение на RTT → W/RTT = ${(per / 1e6).toFixed(3)} Mbit/s; ограничено от R → <b>${(eff / 1e6).toFixed(3)} Mbit/s</b>.`, vars: { eff: (eff / 1e6).toFixed(3) + " Mbit/s" }, log: `eff = ${(eff / 1e6).toFixed(3)} Mbit/s` }, e));
      F.push(Object.assign({ step: 6, at: ["util", "ret"], done: true, msg: `Използване на канала: <b>${(util * 100).toFixed(2)} %</b>. ${W < bdp ? `W (${fmtB(W)}) &lt; BDP (${fmtB(bdp)}) → каналът стои неизползван част от времето: „бърза мрежа“ не означава бърз обмен.` : "W ≥ BDP → прозорецът е достатъчен, каналът е запълнен."}`, vars: { util: (util * 100).toFixed(2) + " %" } }, e));
      const line = `tx=${(tx * 1e6).toFixed(3)}us prop=${(prop * 1e6).toFixed(3)}us rtt=${(rtt * 1e6).toFixed(3)}us bdp=${bdp.toFixed(1)}B eff=${(eff / 1e6).toFixed(3)}Mbit/s util=${util.toFixed(4)}`;
      return { frames: F, line };
    },
  };

  const html = `
<div class="prose">
  <p>Времето за предаване на L бита по канал със скорост R bit/s е <b>L/R</b>. То се различава от времето за разпространение, приблизително разстояние/скорост на сигнала. За 1500 байта при 100 Mbit/s предаването на тези 12000 бита е <b>120 микросекунди</b>, без служебни разходи и изчакване.</p>
  <p><dfn data-g="rtt">RTT</dfn> е време за двупосочно преминаване. При голям RTT и ограничен обем непотвърдени данни ефективната скорост може да е далеч под капацитета. Изпитното изложение трябва да различава скорост на канала, полезен обем и закъснение, вместо да ги обобщава с „бърза мрежа“.</p>
</div>

<div class="block">
  <h3>Три компонента на закъснението (Схема 28)</h3>
  <p class="prose">Модел без опашки, обработка и загуби. Скоростта на сигнала в мед и оптика обичайно се приема около 2·10⁸ m/s. Задай пакета, канала и разстоянието; W е колко байта могат да са изпратени, преди да дойде потвърждение (виж прозореца в <a href="#transport">раздел 6</a>).</p>
  <div id="v-delay"></div>
  <div class="key"><span class="formula">t_пред = L/R · t_разпр = d/v · RTT ≈ 2d/v + L/R · BDP = R·RTT · ефективна скорост ≤ min(R, W/RTT)</span></div>
  <details class="hint"><summary>Хинт: защо „100 мегабита“ не определя времето за отговор</summary><div>
    <p>R влияе само на L/R. Разпространението зависи от разстоянието и средата; опашките, обработката и повторенията добавят още закъснение. При 3000 km разпространението е ≈ 15 ms в едната посока — то не намалява, ако купим по-бърз канал.</p>
  </div></details>
  <details class="trap"><summary>Капан: размерите не са едно и също</summary><div>
    <p><dfn data-g="mtu">MTU</dfn> ограничава преносимия пакет за интерфейс или път. Приложно съобщение, TCP сегмент и MTU не са еднакви размери. <dfn data-g="bdp">Произведението капацитет–закъснение</dfn> показва колко данни могат да са в движение при зададения модел.</p>
  </div></details>
</div>`;

  function mount(root) {
    S.viz(root.querySelector("#v-delay"), {
      id: "delay", title: "Оценка на закъснението и ефективната скорост", sub: "Лентите са в мащаб спрямо RTT.",
      code: "ch09_delay",
      inputs: [
        { id: "L", label: "L (байта)", type: "number", value: 1500, width: "6em" }, { id: "R", label: "R (Mbit/s)", type: "number", value: 100, width: "6em" },
        { id: "d", label: "d (km)", value: "3000", width: "6em" }, { id: "v", label: "v (×10⁸ m/s)", value: "2", width: "5em" }, { id: "W", label: "W (байта)", type: "number", value: 65535, width: "7em" },
      ],
      presets: [
        { label: "1500 B, 100 Mbit/s, LAN", values: { L: 1500, R: 100, d: "0.1", v: "2", W: 1500 } },
        { label: "Изпрати и чакай, 3000 km", values: { L: 1500, R: 100, d: "3000", v: "2", W: 1500 } },
        { label: "1 Gbit/s, 10000 km", values: { L: 1500, R: 1000, d: "10000", v: "2", W: 4000000 } },
      ],
      legend: [["s-act", "предаване L/R"], ["s-cmp", "разпространение"], ["s-done", "полезно използване"]],
      build: algos.delay,
      draw(st, f) {
        st.innerHTML = "";
        const W = 600, sx = (t) => 110 + (t / f.rtt) * (W - 130);
        const svg = S.svg("svg", { class: "g", viewBox: `0 0 ${W} 120`, width: W });
        const bar = (y, x0, x1, cls, lab, show) => { if (!show) return; svg.append(S.svg("g", { class: cls }, S.svg("rect", { x: x0, y, width: Math.max(2, x1 - x0), height: 18, rx: 3, fill: "var(--cb)", stroke: "var(--c)" }))); svg.append(S.svg("text", { x: 4, y: y + 14, class: "wt", text: lab })); };
        bar(8, sx(0), sx(f.tx), "s-act", "предаване", f.step >= 1);
        bar(34, sx(f.tx), sx(f.tx + f.prop), "s-cmp", "път натам", f.step >= 2);
        bar(60, sx(f.tx + f.prop), sx(f.rtt), "s-cmp", "ACK обратно", f.step >= 3);
        if (f.step >= 6) { svg.append(S.svg("g", { class: "s-done" }, S.svg("rect", { x: sx(0), y: 88, width: Math.max(2, (sx(f.rtt) - sx(0)) * f.util), height: 18, rx: 3, fill: "var(--cb)", stroke: "var(--c)" }))); svg.append(S.svg("text", { x: 4, y: 102, class: "wt", text: "използване" })); }
        svg.append(S.svg("line", { x1: sx(f.rtt), y1: 2, x2: sx(f.rtt), y2: 112, stroke: "var(--muted)", "stroke-dasharray": "3 3" }));
        st.append(svg);
        const tb = h("table", { class: "t grid" });
        [["L/R", fmtT(f.tx), 1], ["d/v", fmtT(f.prop), 2], ["RTT", fmtT(f.rtt), 3], ["BDP", fmtB(f.bdp), 4], ["ефективно", (f.eff / 1e6).toFixed(3) + " Mbit/s", 5], ["използване", (f.util * 100).toFixed(2) + " %", 6]]
          .forEach(([k, v, s]) => tb.append(h("tr", null, h("th", { text: k }), h("td", { class: f.step === s ? "s-act" : "", text: f.step >= s ? v : "…" }))));
        st.append(h("div", { class: "tbl-wrap" }, tb));
      },
    });
  }

  S.chapter({ id: "ocenki", order: 9, num: "9", group: "Транспорт и услуги", title: "Оценки: скорост, закъснение, RTT", lead: "L/R срещу разпространение; защо при голям RTT и малък прозорец бързият канал стои празен.", html, mount, algos });

<script>
/* Раздел 10 — Автомобилни и индустриални комуникации (извън конспекта):
   CAN арбитраж, LIN график, FlexRay слотове, RS-485, Modbus RTU/TCP, шлюзове. */
(function () {
  const S = window.Study, h = S.h;
  const hx = (b) => b.toString(16).toUpperCase().padStart(2, "0");
  const b11 = (v) => v.toString(2).padStart(11, "0");

  function crc16(b, F) {
    let c = 0xffff;
    F && F.push({ at: "init", c, msg: "Начало: регистър FFFF." });
    b.forEach((x, i) => {
      c ^= x;
      F && F.push({ at: "xor", i, c, msg: `Байт ${i} = ${hx(x)} се XOR-ва в младшия байт.`, log: `[${i}] ^${hx(x)} → ${c.toString(16).toUpperCase().padStart(4, "0")}` });
      for (let k = 0; k < 8; k++) { const l = c & 1; c = l ? (c >>> 1) ^ 0xa001 : c >>> 1; F && F.push({ at: ["bit", l ? "poly" : "shift"], i, k, lsb: l, c, msg: `Бит ${k}: младшият е ${l} → ${l ? "изместване и XOR с A001" : "само изместване"}.` }); }
    });

  }
  function parseHexBytes(s, max) {
    const p = String(s).trim().split(/[\s,]+/).filter(Boolean);
    if (!p.length) throw new Error("Въведи поне един байт.");
    if (p.length > max) throw new Error(`Най-много ${max} байта.`);
    return p.map((x) => { if (!/^[0-9a-fA-F]{1,2}$/.test(x)) throw new Error(`„${x}“ не е байт в hex.`); return parseInt(x, 16); });
  }

  const algos = {
    /* Като can_arbitrate() в C */
    can({ ids }) {
      const p = String(ids).trim().split(/[\s,]+/).filter(Boolean);
      if (p.length < 2) throw new Error("Нужни са поне два възела.");

<div class="block">
  <h3>CAN: недеструктивен побитов арбитраж (Схема 30)</h3>
  <p class="prose">При едновременно начало участниците наблюдават шината. Доминантният бит 0 надделява над рецесивния 1. Ако възел предава рецесивен бит, но прочете доминантен в арбитражното поле, той прекратява участието си и остава приемник. При 0x100 и 0x180 първата различаваща позиция е 0 срещу 1 — 0x100 печели. <b>Условие:</b> стандартни 11-битови кадри за данни; пълните правила за всички формати не са моделирани.</p>
  <div id="v-can"></div>
  <details class="trap"><summary>Капан: „CAN идентификаторът е адрес на ECU“, „CAN ACK = командата е изпълнена“</summary><div>
    <p>Идентификаторът участва в арбитража и филтрирането; по-висок протокол може да зададе адресни роли, но това е допълнителен договор. CAN ACK показва, че поне един участник е приел кадъра без протоколна грешка — не че приложението е изпълнило командата. CRC и ACK не са удостоверяване или шифроване.</p>
  </div></details>
  <p class="prose">Classical CAN има до 8 байта данни в кадър, <dfn data-g="can fd">CAN FD</dfn> — до 64, с възможна по-висока скорост в частта за данни; арбитражът не се превръща автоматично в тази скорост. Контролерът оформя и проверява кадрите, трансивърът преобразува TX/RX към диференциалната шина CAN_H/CAN_L. <dfn data-g="canopen">CANopen</dfn> и SAE J1939 добавят по-високи договори; Linux SocketCAN е реална софтуерна реализация, която не превръща суров кадър автоматично в CANopen или J1939 съобщение.</p>
</div>

    <tr><td>5 Сесиен</td><td>ISO 14229-2 сесийни услуги</td><td>Не е отделен задължителен слой при CANopen</td></tr>

  </div></details>

<div class="block">
  <h3>RS-485: електрически интерфейс, не приложен протокол (Схема 33)</h3>
  <div class="prose">
    <p>RS-485 (TIA/EIA-485) задава електрически характеристики на драйвери и приемници за балансирана комуникация. При двупроводна <dfn data-g="half-duplex">half-duplex</dfn> връзка една диференциална двойка се използва за двете посоки по различно време. <dfn data-g="uart">UART</dfn> генерира символите от логическата страна, трансивърът реализира електрическото свързване; управлението на разрешението за предаване е отделна задача.</p>
    <p>Обичайната топология е основна линия с къси отклонения. Когато е нужно <dfn data-g="терминиране">терминиране</dfn>, резисторите са при <b>двата физически края</b>, не при всеки възел; често 120 Ω, но стойността следва кабела и проектирането. Означенията A/B не гарантират еднаква полярност при различни продукти; диференциален сигнал не е синоним на галванична изолация.</p>
  </div>
  <details class="hint"><summary>Хинт: два уреда на една двойка, едната скорост, различни протоколи</summary><div>
    <p>Единият използва Modbus RTU, другият — собствен формат. Физически обменят символи, но не разбират едни и същи команди. Електрическата съвместимост е различна от протоколната.</p>
  </div></details>
</div>

<div class="block">
  <h3>Modbus: една операция, два стека (Схеми 34 и 35)</h3>
  <p class="prose">Учебно устройство 1 има holding register с протоколен адрес 0 и стойност 250; документацията му (допускане на примера) задава мащаб 0,1 °C → 25,0 °C. Function 03 чете holding registers. RTU заявката е <code>01 03 00 00 00 01 84 0A</code>; TCP заявката е <code>00 01 00 00 00 06 01 03 00 00 00 01</code> — без <code>84 0A</code>.</p>
  <div id="v-mb"></div>
  <div id="v-crc16"></div>
  <details class="trap"><summary>Капан: „40001“ се изпраща като адрес</summary><div>
    <p>40001 в много документации е референтен номер за първи holding register, а не число в PDU. В примера изпратеният адрес е точно 0. Редът на няколко регистъра за 32-битови числа и float трябва да се провери в картата на устройството. „Поддържа Modbus“ не определя автоматично този договор.</p>
  </div></details>
  <p class="prose">libmodbus е реална библиотека с RTU и TCP backends: <code>modbus_new_rtu</code> и <code>modbus_new_tcp</code> избират пренасянето, а <code>modbus_read_registers</code> изразява приложната операция.</p>
</div>

<div class="block">
  <h3>Шлюзове: кое се запазва</h3>
  <div class="prose">
    <p>Шлюзът между CAN и Modbus не е просто преходник между два конектора: трябва да знае кое CAN поле отговаря на кой регистър, какъв е мащабът, коя стойност е актуална и как се отразява липса на данни. Суров CAN кадър, сериализиран в UDP/TCP, е тунелиране — не прозрачен L2 мост. Шлюз, който декодира J1939 обороти и ги публикува чрез MQTT или HTTP/JSON, преобразува приложни протоколи и данни. Практическият въпрос е какво се запазва: целият кадър, диагностичното съобщение или само извлечени сигнали.</p>
  </div>
  <div class="key">Смяна на физически интерфейс ≠ преобразуване на протокол ≠ преобразуване на смисъл.</div>

<script>
/* Раздел 11 — Bluetooth мрежи (извън конспекта): Classic и LE, роли, откриване и връзка,
   GAP/GATT, декодиране на стойност, шлюз към IP, Mesh с управлявано наводняване. */
(function () {
  const S = window.Study, h = S.h;
  const hx = (b) => b.toString(16).toUpperCase().padStart(2, "0");

  function bytes(s, n) {
    const p = String(s).trim().split(/[\s,]+/).filter(Boolean);
    if (p.length !== n) throw new Error(`Очакват се точно ${n} байт${n === 1 ? "" : "а"} в hex.`);
    return p.map((x) => { if (!/^[0-9a-fA-F]{1,2}$/.test(x)) throw new Error(`„${x}“ не е байт в hex.`); return parseInt(x, 16); });
  }

  const algos = {
    /* Като battery_level()/temp_decitenths()/to_json() в C */
    gatt({ kind, val }) {
      const F = [];
      if (kind === "battery") {
        const v = bytes(val, 1);
        F.push({ kind, v, at: "blen", msg: "Battery Service (UUID 0x180F) → характеристика Battery Level (UUID 0x2A19). Спецификацията ѝ: един байт.", vars: { n: 1 } });
        if (v[0] > 100) { F.push({ kind, v, at: "brange", bad: true, msg: `0x${hx(v[0])} = ${v[0]} е извън 0…100 → не е валиден процент по спецификацията.`, vars: { стойност: v[0] } }); return { frames: F, result: -1 }; }
        F.push({ kind, v, at: ["brange", "bret"], done: true, res: v[0], msg: `0x${hx(v[0])} = <b>${v[0]} %</b>. Значението следва спецификацията на характеристиката — не е общо правило за всеки Bluetooth байт.`, vars: { процент: v[0] } });
        return { frames: F, result: v[0] };
      }
      const v = bytes(val, 2);
      F.push({ kind, v, at: "tlen", msg: "Собствена характеристика на учебния датчик. <b>Договор на примера:</b> 2 байта без знак, little-endian, стъпка 0,1 °C.", vars: { n: 2 } });
      const d = v[0] | (v[1] << 8);
      F.push({ kind, v, at: "tle", d, msg: `Little-endian: ${hx(v[0])} е младшият байт → 0x${hx(v[1])}${hx(v[0])} = ${d} десети от градуса.`, vars: { deci: d } });
      const js = `{"temperature_c":${Math.floor(d / 10)}.${d % 10}}`;
      F.push({ kind, v, at: "json", d, js, done: true, msg: `Шлюзът създава <b>нов приложен запис</b> ${S.esc(js)} и го изпраща с HTTP през Ethernet или Wi-Fi. Датчикът няма нужда от IP адрес.`, vars: { json: js } });
      return { frames: F, result: d, js };
    },

    /* Bluetooth Mesh: управлявано наводняване с TTL и кеш на видени съобщения (без C — модел) */
    mesh({ ttl, relays }) {
      ttl = S.int(ttl, 0, 8, "TTL");
      const R = new Set(String(relays).split(/[\s,]+/).filter(Boolean).map((x) => { if (!/^[A-G]$/i.test(x)) throw new Error(`„${x}“: възлите са A…G.`); return x.toUpperCase(); }));
      const N = { K: [40, 90], A: [140, 40], B: [140, 140], C: [260, 30], D: [260, 150], E: [380, 60], F: [380, 160], G: [500, 100] };
      const E = [["K", "A"], ["K", "B"], ["A", "C"], ["A", "B"], ["B", "D"], ["C", "E"], ["D", "F"], ["C", "D"], ["E", "G"], ["F", "G"], ["E", "F"]];
      const nb = (n) => E.filter((e) => e.includes(n)).map((e) => (e[0] === n ? e[1] : e[0]));
      const seen = new Set(["K"]), F = [];
      let wave = [["K", ttl]], tx = 0, dup = 0;
      F.push({ N, E, R, seen: [...seen], wave: ["K"], msg: `Ключът K публикува команда към груповия адрес „лампи“ с TTL ${ttl}. Ретранслатори: ${[...R].join(", ") || "няма"}.`, stats: { предавания: 0, дубликати: 0 } });
      while (wave.length) {
        const next = [], hops = [];
        for (const [n, t] of wave) {
          if (n !== "K" && !R.has(n)) continue;
          if (t < 1 && n !== "K") continue;
          if (n === "K" && t < 0) continue;
          tx++;
          for (const m of nb(n)) {
            hops.push([n, m]);
            if (seen.has(m)) { dup++; continue; }
            seen.add(m); next.push([m, t - 1]);
          }
        }
        if (!hops.length) break;
        F.push({ N, E, R, seen: [...seen], hops, wave: next.map((x) => x[0]), msg: `Вълна: ${hops.map(([a, b]) => a + "→" + b).join(", ")}. Нови получатели: ${next.map((x) => `${x[0]} (TTL при препредаване ${x[1]})`).join(", ") || "няма"}. Вече видени съобщения се изхвърлят (кеш на дубликати).`, stats: { предавания: tx, дубликати: dup }, log: `вълна: +${next.map((x) => x[0]).join(",") || "—"}` });
        wave = next;
      }
      const lamps = ["C", "D", "E", "F", "G"].filter((x) => seen.has(x));
      F.push({ N, E, R, seen: [...seen], wave: [], done: true, msg: `Командата стигна до ${lamps.length} от 5 лампи (${lamps.join(", ") || "—"}). Разпространението е ограничено от TTL и от това кои възли са relay — не е „безкрайно повторение от всеки възел“.`, stats: { предавания: tx, дубликати: dup } });
      return { frames: F, reached: lamps.length, tx };
    },
  };

  const FLOW = [
    ["Advertising", "Датчикът излъчва advertising пакети на трите първични канала. Може да носи малко данни — приемник може да научи нещо и без връзка.", "advertising"],
    ["Scanning", "Телефонът наблюдава за advertising пакети. Име в списъка не доказва, че устройството приема връзки (не всяко advertising е connectable).", "scanning"],
    ["Връзка", "Central започва установяването на връзка към connectable advertiser. После обменът става в планирани connection events — възможности за обмен, не непрекъснато предаване.", "central"],
    ["Откриване на услуги", "GATT client открива услугите и характеристиките на server-а. Връзката сама по себе си не значи, че приложението ги знае или има разрешение.", "gatt"],
    ["Read / Notification", "Read иска текущата стойност. За уведомления client записва CCCD. Notification е без ATT потвърждение, indication — с потвърждение.", "cccd"],
  ];

  const html = `
<p class="prose"><span class="extra-tag">извън конспекта</span> Целият раздел е допълнителен материал от учебното ръководство (глава 10).</p>
<div class="prose">
  <p><dfn data-g="bluetooth">Bluetooth</dfn> е семейство технологии за безжична комуникация в обхвата 2,4 GHz. Типичната му употреба е <dfn data-g="pan">PAN</dfn> — лична мрежа около човек или устройство. PAN описва обхвата, а Bluetooth — начина на комуникация. Bluetooth е собствено име, а не акроним; <dfn data-g="sig">SIG</dfn> е организацията зад спецификациите.</p>
  <p><dfn data-g="bluetooth classic">Bluetooth Classic</dfn> използва <dfn data-g="br/edr">BR/EDR</dfn> и 79 канала по 1 MHz. <dfn data-g="ble">Bluetooth LE</dfn> използва 40 канала по 2 MHz, от които три са първични advertising канали. Каналите са честотни области, а не брой устройства. LE поддържа и LE Audio — „Classic е за звук, LE е само за датчици“ е грешно като общо правило. <dfn data-g="a2dp">A2DP</dfn> е Classic профил за звук; <dfn data-g="hid">HID</dfn> се отнася до клавиатури и мишки.</p>
</div>

<div class="block">
  <h3>Piconet и роли (Схема 36)</h3>
  <p class="prose">При Classic един central координира обмена с до седем активни peripherals в една <dfn data-g="piconet">piconet</dfn>. Ограничението не означава седем запаметени сдвоявания и не е общ лимит за LE. При LE <dfn data-g="central">central</dfn> започва връзката, <dfn data-g="peripheral">peripheral</dfn> е от другата страна — роли в конкретна връзка, не класификация по размер.</p>
</div>

<div class="block">
  <h3>Откриване, връзка и достъп до данни (Схема 37)</h3>
  <div class="row" id="flow-b"></div>
  <div class="key" id="flow-d"></div>
  <p class="prose"><dfn data-g="gap">GAP</dfn> описва откриване и свързване; <dfn data-g="gatt">GATT</dfn> организира атрибутите като services и characteristics; <dfn data-g="att">ATT</dfn> е протоколът за достъп до атрибути; <dfn data-g="l2cap">L2CAP</dfn> — логически канали и адаптация; <dfn data-g="hci">HCI</dfn> — интерфейс между host и controller. Това са части от Bluetooth архитектурата, а не буквални седем OSI слоя.</p>
</div>

<div class="block">
  <h3>Две различни двойки роли (Схема 38)</h3>
  <p class="muted">Превключвай ролите. Типичната комбинация е телефон = central + GATT client, датчик = peripheral + GATT server — но тя не е задължителна.</p>
  <div class="row"><label class="field"><span>Телефонът във връзката е</span><select id="r-conn"><option value="c">central</option><option value="p">peripheral</option></select></label>
    <label class="field"><span>Телефонът за атрибутите е</span><select id="r-gatt"><option value="c">GATT client</option><option value="s">GATT server</option><option value="b">и client, и server</option></select></label></div>
  <div id="r-svg"></div>
  <details class="trap"><summary>Капан: „central = GATT client“</summary><div>
    <p>Central е роля във връзката, GATT client — роля при атрибутния достъп. Те отговарят на различни въпроси: кой как участва във връзката и кой предоставя атрибутите. Едно устройство може да изпълнява и client, и server функции.</p>
  </div></details>
</div>

<div class="block">
  <h3>От услуга и характеристика към смисъл на байт (Схеми 39 и 40)</h3>
  <p class="prose">Service групира характеристики; characteristic представя стойност с тип и операции; <dfn data-g="uuid">UUID</dfn> идентифицира типа, а handle — конкретен атрибут в server-а. UUID не е адрес на устройство, handle не е TCP порт. Battery Service е 0x180F, Battery Level — 0x2A19: 0x64 = 100 %, 0x32 = 50 %. Втората характеристика е собствена — смисълът ѝ е изрично допускане на примера.</p>
  <div id="v-gatt"></div>
  <div class="key">Медиаконверторът сменя сигнала; шлюзът тук <b>създава нов приложен запис</b> според смисъла. MAC адреси, IP адреси и UUID имат различни роли и не се преобразуват един в друг по обща формула.</div>
</div>

<div class="block">
  <h3>Сдвояване, bonding и защита</h3>
  <div class="prose">
    <p><dfn data-g="pairing">Pairing</dfn> установява ключове и параметри на защита; <dfn data-g="bonding">bonding</dfn> ги запазва за бъдещи връзки; connection е текущата връзка. Може да има връзка без bonding, а запазен bond — без текуща връзка. Just Works не осигурява защита срещу активен посредник при самото сдвояване. Открит advertising пакет не е доказателство за доверено устройство.</p>
  </div>
</div>

<div class="block">
  <h3>Bluetooth Mesh: управлявано наводняване (Схема 41)</h3>
  <p class="prose"><dfn data-g="bluetooth mesh">Bluetooth Mesh</dfn> изгражда комуникация между много възли върху LE; съобщенията достигат други възли чрез препредаване. <dfn data-g="provisioning">Provisioning</dfn> въвежда устройство в мрежата. Relay препредава, Proxy дава достъп през GATT, Friend пази съобщения за Low Power Node. Управляваното наводняване използва ограничаване на живота (TTL) и обработка на дубликати. Учебен модел: ключ K, лампи C–G; задай кои възли са relay.</p>
  <div id="v-mesh"></div>
  <details class="trap"><summary>Капан: „няколко датчика към телефон = Mesh“</summary><div>
    <p>Това могат да бъдат няколко отделни LE връзки. Mesh има собствено въвеждане на възли, адресиране, модели и механизми за пренасяне. Mesh Proxy към телефон също не е автоматично IP маршрутизатор.</p>
  </div></details>
</div>`;

    pick(0);

    const rc = root.querySelector("#r-conn"), rg = root.querySelector("#r-gatt"), rs = root.querySelector("#r-svg");
    function drawR() {

      const svg = S.svg("svg", { class: "g", viewBox: "0 0 560 170", width: 560 });
      const box = (x, t, l1, l2, c1, c2) => {
        svg.append(S.svg("text", { x: x + 80, y: 18, "text-anchor": "middle", text: t }));
        svg.append(S.svg("g", { class: c1 }, S.svg("rect", { x, y: 28, width: 160, height: 46, rx: 6, fill: "var(--cb)", stroke: "var(--c)" })), S.svg("text", { x: x + 80, y: 56, "text-anchor": "middle", text: l1 }));
        svg.append(S.svg("g", { class: c2 }, S.svg("rect", { x, y: 92, width: 160, height: 46, rx: 6, fill: "var(--cb)", stroke: "var(--c)" })), S.svg("text", { x: x + 80, y: 120, "text-anchor": "middle", text: l2 }));
      };

      box(370, "датчик", pc ? "peripheral" : "central", gd, "s-act", "s-piv");
      svg.append(S.svg("line", { x1: 190, y1: 51, x2: 370, y2: 51, class: "edge s-act" }), S.svg("text", { x: 280, y: 45, "text-anchor": "middle", class: "wt", text: "връзка (GAP)" }));

      id: "gatt", title: "Прочетена стойност → смисъл → JSON", sub: "",

    u.append(h("tr", null, ...["Слой (интернет стек)", "Единица", "Идентификатор", "Протоколи", "Раздел"].map((x) => h("th", { text: x }))));
    UNITS.forEach(([a, b, c, d, s]) => u.append(h("tr", null, h("td", { text: a }), h("td", { text: b }), h("td", { text: c }), h("td", { text: d }), h("td", null, h("a", { href: "#" + s, text: "#" + s })))));

    const fq = root.querySelector("#faq"), qi = root.querySelector("#faq-q"), qf = root.querySelector("#faq-f");
    function renderFaq() {
      const s = qi.value.toLowerCase().trim(), f = qf.value;
      fq.innerHTML = "";
      FAQ.filter((F) => (!f || (f === "e") === !!F.extra) && (!s || (F.q + F.a).toLowerCase().includes(s))).forEach((F) =>
        fq.append(h("details", { class: "hint" }, h("summary", null, F.q, F.extra ? h("span", { class: "extra-tag", text: "извън" }) : null), h("div", null, h("p", { text: F.a }), h("p", null, h("a", { href: "#" + F.sec, text: "→ към раздела" }))))));
      if (!fq.children.length) fq.append(h("p", { class: "muted", text: "Няма съвпадения." }));
    }
    qi.addEventListener("input", renderFaq); qf.addEventListener("change", renderFaq); renderFaq();

    const pl = root.querySelector("#plan");
    PLAN.forEach((P, i) => pl.append(h("div", { class: "card" },
      h("h4", null, `${i + 1}. `, h("a", { href: "#" + P.sec, text: P.t })),

      h("p", null, h("b", { text: "Пример: " }), P.ex),
      P.sec2 ? h("p", null, h("a", { href: "#" + P.sec2, text: "→ и капсулирането" })) : null)));
    const re = root.querySelector("#real");
    REAL.forEach(([k, v]) => re.append(h("p", { class: "prose" }, h("b", { text: k + ": " }), v)));

    const src = root.querySelector("#src");
    SOURCES.forEach(([t, u2]) => src.append(h("li", null, u2 ? h("a", { href: u2, target: "_blank", rel: "noopener", text: t }) : t)));
  }

  S.chapter({ id: "sistematizacia", order: 12, num: "12", group: "Обобщение", title: "Систематизация и опорен план", lead: "Сравнителни таблици, равнищата в едно изречение, изяснените въпроси и опорният план за устния изпит.", html, mount, algos: {} });
})();

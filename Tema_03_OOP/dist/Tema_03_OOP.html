<script>
/* Раздел 3 — Наследяване и композиция. */
(function () {
  const S = window.Study, h = S.h;

  /* Матрица на достъпа при наследяване — стойностите са ИЗЧИСЛЕНИ от компилатора в 03_inheritance.cpp (SFINAE). */
  const KINDS = ["public", "protected", "private"];
  const RULE = {
    public: { pub: "public", prot: "protected", priv: "недостъпен" },
    protected: { pub: "protected", prot: "protected", priv: "недостъпен" },
    private: { pub: "private", prot: "private", priv: "недостъпен" },
  };

  const algos = {
    /** Достъп до членовете на AB през D (наследен с kind): отвън, от D, от наследник на D; плюс upcast D* → AB*. */
    inherit_access({ kind }) {
      if (!RULE[kind]) throw new Error("Вид наследяване: public, protected или private.");
      const R = RULE[kind], F = [];
      const out = [], self = [], inside = [];
      ["pub", "prot", "priv"].forEach((m) => {
        const eff = R[m];
        out.push(eff === "public" ? 1 : 0);
        self.push(eff !== "недостъпен" ? 1 : 0);
        F.push({ m, eff, vars: { член: "AB::" + m, "вид наследяване": kind, "в D става": eff }, msg: m === "priv" ? "<code>priv</code> е private в AB — остава в базовия подобект, но D няма пряк достъп до него при <b>никакъв</b> вид наследяване." : `<code>${m}</code> (${m === "pub" ? "public" : "protected"} в AB) при ${kind} наследяване става <b>${eff}</b> в D.`, log: `${m} → ${eff}` });
      });
      ["pub", "prot"].forEach((m) => inside.push(R[m] === "public" || R[m] === "protected" ? 1 : 0));
      const up = kind === "public" ? 1 : 0;
      F.push({ m: "up", done: true, vars: { "D* → AB* отвън": up ? "да" : "не" }, msg: up ? "При public наследяване външният код може да ползва D като AB (upcast) — отношението „е вид“ е публично." : `При ${kind} наследяване външният код <b>не</b> може да преобразува D* в AB* — наследяването е детайл на реализацията, не публично „е вид“.`, log: `upcast: ${up ? "да" : "не"}` });
      return { frames: F, out: out.join(" "), self: self.join(" "), inside: inside.join(" "), up };
    },

    /** Upcast и разположение на Logger : TemperatureSensor, Clock (отместванията — от C++ програмата). */
    upcast({ target }) {
      const L = [
        { n: "Sensor::id", off: 0, sz: 4, part: "Sensor" }, { n: "TemperatureSensor::celsius", off: 4, sz: 4, part: "TemperatureSensor" },
        { n: "Clock::ticks", off: 8, sz: 8, part: "Clock" }, { n: "Logger::lines", off: 16, sz: 4, part: "Logger" }, { n: "padding", off: 20, sz: 4, part: "pad" },
      ];
      const T = { TemperatureSensor: { off: 0, parts: ["Sensor", "TemperatureSensor"], tag: "up1" }, Sensor: { off: 0, parts: ["Sensor"], tag: "up2" }, Clock: { off: 8, parts: ["Clock"], tag: "up3" } };
      const sel = target === "all" ? ["TemperatureSensor", "Sensor", "Clock"] : [target];
      if (sel.some((x) => !T[x])) throw new Error("Непознат базов тип.");
      const F = [];
      F.push({ at: "mi_field", L, sel: null, vars: { "&lg": "0x2000", "sizeof(Logger)": 24 }, msg: "Обектът <code>Logger</code> съдържа подобект <code>TemperatureSensor</code> (с подобект <code>Sensor</code>) и подобект <code>Clock</code>. Тук (Itanium C++ ABI) невиртуалните базови подобекти са преди собствените полета — стандартът не задава това разположение.", log: "Logger lg;" });
      const res = [];
      sel.forEach((s) => {
        const t = T[s];
        res.push(t.off);
        F.push({ at: t.tag, L, sel: t.parts, vars: { цел: s + "*", адрес: "0x" + (0x2000 + t.off).toString(16), отместване: t.off }, msg: t.off ? `<code>${s}* c = &amp;lg</code> — <b>адресът се променя</b> с +${t.off}: подобектът Clock не е в началото. Компилаторът добавя отместването автоматично.` : `<code>${s}* = &amp;lg</code> — подобектът е в началото, адресът е същият (+0). Upcast е безопасен и неявен при public наследяване.`, log: `${s}*: +${t.off}` });
      });
      F[F.length - 1].done = true;
      return { frames: F, result: res.join(" ") };
    },

    /** Отрязване: какво вижда всяка функция. */
    slicing({ how }) {
      const H = {
        assign: { tag: "assign", r: "Shape", copy: true, txt: "<code>Shape copy = b</code> — създава се <b>нов</b> обект Shape: копира се само базовата част (w). depth не се копира; vptr на копието сочи vtable на Shape." },
        val: { tag: ["call_val", "byval"], r: "Shape", copy: true, txt: "<code>by_value(b)</code> — параметърът е Shape по стойност: нов Shape, конструиран от базовата част на b. Вътре <code>s.name()</code> намира vtable на Shape." },
        ref: { tag: ["call_ref", "byref"], r: "Box", copy: false, txt: "<code>by_ref(b)</code> — референцията сочи <b>оригиналния</b> обект: статичен тип Shape, динамичен Box. <code>name()</code> е виртуален → Box::name." },
        ptr: { tag: ["call_ptr", "byptr"], r: "Box", copy: false, txt: "<code>by_ptr(&amp;b)</code> — указател към оригинала: както при референцията, динамичният тип се запазва." },
      };
      const seq = how === "all" ? ["assign", "val", "ref", "ptr"] : [how];
      if (seq.some((x) => !H[x])) throw new Error("Непознат начин.");
      const F = [{ at: "mk", step: null, vars: { "sizeof(Box)": 16 }, msg: "<code>Box b</code>: vptr → vtable на Box, w = 1 (от Shape), depth = 5 (производна част).", log: "Box b;" }];
      const res = [];
      seq.forEach((k) => { res.push(H[k].r); F.push({ at: H[k].tag, step: k, copy: H[k].copy, r: H[k].r, vars: { "name()": H[k].r, "нов обект?": H[k].copy ? "да" : "не" }, msg: H[k].txt, log: `${k}: ${H[k].r}` }); });
      F[F.length - 1].done = true;
      return { frames: F, result: res.join(" ") };
    },

    /** Диамант: ред на конструкторите и брой подобекти Device. */
    diamond({ virt }) {
      const v = virt === true || virt === "true" || virt === "1";
      const F = [], ev = [];
      const N = v ? ["NetV", "UsbV", "ComboV"] : ["NetA", "UsbA", "ComboA"];
      const add = (o) => { if (o.ev) ev.push(o.ev); F.push(Object.assign({}, o, { ev: ev.slice(), v })); };
      add({ at: v ? "cv" : "ca", msg: `<code>${N[2]} x;</code> — ${v ? "Net и Usb наследяват Device <b>виртуално</b>." : "Net и Usb наследяват Device обикновено."}` });
      if (v) {
        add({ at: "dev", cur: "Device", ev: "Device()", msg: "Виртуалната база се изгражда <b>първа и веднъж</b> — от най-производния клас ComboV, преди невиртуалните бази.", log: "Device()" });
        add({ at: "nv", cur: "NetV", ev: "NetV()", msg: "NetV — без собствен Device: използва споделения.", log: "NetV()" });
        add({ at: "uv", cur: "UsbV", ev: "UsbV()", msg: "UsbV — също използва споделения Device.", log: "UsbV()" });
      } else {
        add({ at: "dev", cur: "Device₁", ev: "Device()", msg: "Пътят през NetA изгражда своя Device.", log: "Device()" });
        add({ at: "na", cur: "NetA", ev: "NetA()", log: "NetA()", msg: "NetA()." });
        add({ at: "dev", cur: "Device₂", ev: "Device()", msg: "Пътят през UsbA изгражда <b>втори</b> Device.", log: "Device()" });
        add({ at: "ua", cur: "UsbA", ev: "UsbA()", log: "UsbA()", msg: "UsbA()." });
      }
      add({ at: v ? "cv" : "ca", cur: N[2], ev: N[2] + "()", log: N[2] + "()", msg: `Тялото на ${N[2]}().` });
      add({ at: v ? "one" : "amb", done: true, bad: !v, msg: v ? "Един подобект Device → <code>y.serial</code> е еднозначно." : "Два подобекта Device → <code>x.serial</code> е <b>двусмислено</b> (грешка при компилация); трябва <code>x.NetA::serial</code> или <code>x.UsbA::serial</code>.", inv: { text: `брой подобекти Device = ${v ? 1 : 2}`, ok: v } });
      return { frames: F, result: ev.join("|"), devices: v ? 1 : 2 };
    },

    /** Композиция: DataLogger събира пробите на датчика, към който държи референция. */
    compose({ seq }) {
    if (!/^[TP][1-9]$/.test(seq)) throw new Error("Вход: T или P и брой проби 1–9.");
      const kind = seq[0], n = +seq.slice(1), v = kind === "T" ? 21 : 1013, F = [];
      let sum = 0;
      F.push({ at: "c_has", vars: { src: kind === "T" ? "Temp" : "Press", sum: 0 }, k: kind, msg: `<code>DataLogger d(${kind === "T" ? "tp" : "pr"})</code> — регистраторът запазва референция към датчика. Той <b>има</b> датчик.`, log: "DataLogger d" });
      for (let i = 0; i < n; i++) {
        F.push({ at: "c_sample", vars: { i, sum }, k: kind, msg: `<code>sample()</code> → <code>src.read()</code> — виртуално извикване през ISensor&amp;.` });
        sum += v;
        F.push({ at: kind === "T" ? "c_temp" : "c_press", vars: { i, sum }, k: kind, hit: true, msg: `Изпълнява се <code>${kind === "T" ? "Temp" : "Press"}::read()</code> → ${v}. sum = ${sum}.`, log: `read → ${v}` });
      }
      F[F.length - 1].done = true;
      return { frames: F, result: sum };
    },
  };

  /* ---------- съдържание ---------- */
  const html = `
<div class="prose">
  <p><dfn data-g="наследяване">Наследяването</dfn> създава <dfn data-g="производен клас">производен клас</dfn> от <dfn data-g="базов клас">базов</dfn>. При публично наследяване то изразява отношение <b>„е вид“</b> и позволява използване на производен обект чрез интерфейса на базовия. <dfn data-g="композиция">Композицията</dfn> изразява <b>„има“</b>: автомобилът има двигател, а електромобилът може да е вид автомобил в подходящ модел.</p>
</div>

<div class="block">
  <h3>Два вида отношения — щракни върху връзка или клас</h3>
  <div class="split">
    <div class="diag" id="rel-diag"></div>
    <div class="key" id="rel-info"></div>
  </div>
  <div id="v-compose"></div>
  <details class="hint"><summary>Хинт: композицията не изключва полиморфизма</summary><div><p><code>DataLogger</code> държи <code>const ISensor&amp;</code>. Един и същ код на регистратора работи с Temp и с Press — изборът е по динамичния тип на сочения датчик. Композицията позволява подмяна на съставните обекти без задължително наследяване. <span class="extra-tag">разширение</span></p></div></details>
</div>

<div class="block">
  <h3>Принцип на заместване</h3>
  <p class="prose"><dfn data-g="принцип на заместване">Принципът на заместване</dfn> изисква клиент, работещ с базовия договор, да не бъде изненадан от производния тип. Ако Base обещава приемане на всяко неотрицателно число, Derived не бива необявено да допуска само числа над 100. Типовата съвместимост се проверява от компилатора, но поведенческите обещания изискват проект и проверки.</p>
  <details class="trap"><summary>Капан: „компилира се, значи моделът е правилен“</summary><div><p>Синтактично допустимо наследяване не доказва правилно моделиране. Ако производен клас забранява операция, която договорът на базовия обещава, заместването се нарушава. Наследяване само за получаване на готов код може да създаде неподходящи публични обещания.</p></div></details>
</div>

<div class="block">
  <h3>Обектът на производния клас съдържа базов подобект</h3>
  <p class="prose">Базовият подобект е част от производния обект. Преобразуването „нагоре“ (upcast) от <code>Logger*</code> към указател на база е неявно при public наследяване; при множествено наследяване адресът може да се отмести.</p>
  <div id="v-upcast"></div>
</div>

<div class="block">
  <h3>Достъп при public, protected и private наследяване</h3>
  <p class="prose">Публичното наследяване запазва публичните членове като публични и защитените като защитени. При protected или private наследяване достъпността им се стеснява. Частните членове на базовия остават част от базовия подобект, но производният няма пряк достъп до тях само поради наследяването. Таблицата е <b>изчислена от компилатора</b> (SFINAE проверки в <code>03_inheritance.cpp</code>), не въведена на ръка.</p>
  <div class="tbl-wrap"><table class="t mx" id="inh-mx"></table></div>
  <div id="v-inh"></div>
</div>

<div class="block">
  <h3>Отрязване на обект (object slicing)</h3>
  <p class="prose">При предаване на Derived по стойност като Base се копира само базовата част — <dfn data-g="отрязване на обект">отрязване</dfn>. Производните полета и динамичното поведение на отделения Base обект не се запазват. Референцията запазва достъп до действителния обект, чийто живот трябва да остане валиден.</p>
  <div id="v-slice"></div>
  <details class="trap"><summary>Капан: отрязването не „поврежда“ оригинала</summary><div><p>Отрязването се отнася до <b>отделения</b> базов обект (копието). Оригиналният Box е непокътнат; просто копието е истински Shape с vptr към vtable на Shape.</p></div></details>
</div>

        s.append(line(80, 110, 210, 150), line(340, 110, 210, 150), box(30, 80, N[0], N[0]), box(290, 80, N[1], N[1]), box(160, 150, N[2], N[2]));

<script>
/* Раздел 4 — Полиморфизъм и виртуални методи: vtable, статично/динамично свързване,
   претоварване / предефиниране / скриване, виртуално извикване в конструктор. */
(function () {
  const S = window.Study, h = S.h;

  /* модел на класовете от 04_virtual.cpp */
  const VT = {
    Sensor: [["read", "Sensor::read", 0], ["unit", "Sensor::unit", "?"]],
    Temp: [["read", "Temp::read", 21], ["unit", "Temp::unit", "C"]],
    Press: [["read", "Press::read", 1013], ["unit", "Sensor::unit", "?"]],
  };
  const KIND = { Sensor: "Sensor::kind", Temp: "Temp::kind", Press: "Sensor::kind" };   // невиртуален: в израза решава статичният тип Sensor
  const NAMES = { S: "Sensor", T: "Temp", P: "Press" };
  const ADDR = { Sensor: "0x4000", Temp: "0x4010", Press: "0x4020" };
  const VTADDR = { Sensor: "vtable·Sensor", Temp: "vtable·Temp", Press: "vtable·Press" };

  const algos = {
    /** poll(): извиква метод m през const Sensor* за всеки обект; връща реда, който печата C++. */
    dispatch({ seq, method, lang }) {
      const q = String(seq).toUpperCase().replace(/[\s,]/g, "");
      if (!/^[STP]{1,8}$/.test(q)) throw new Error("Редицата е от букви S (Sensor), T (Temp), P (Press) — от 1 до 8.");
      const m = S.int(method, 0, 2, "Методът");
      const c = lang === "c";
      if (c && m === 2) throw new Error("В C версията няма невиртуален kind() — избери read или unit.");
      const objs = [...q].map((ch) => NAMES[ch]);
      const F = [], out = [];
      let vcalls = 0, scalls = 0;
      const tg = (cpp, cc) => (c ? cc : cpp);
      F.push({ at: tg("loop", "loop"), objs, k: -1, vars: { n: objs.length }, msg: `Масив от указатели <code>const Sensor*</code>. <dfn data-g="статичен тип">Статичният тип</dfn> на всеки елемент е Sensor; <dfn data-g="динамичен тип">динамичните</dfn> типове са: ${objs.join(", ")}.`, log: "poll(" + q + ")" });
      objs.forEach((o, i) => {
        F.push({ at: tg("load", "load"), objs, k: i, step: "load", vars: { i, s: ADDR[o], "статичен тип": "const Sensor*" }, stats: { "динамични": vcalls, "статични": scalls }, msg: `<code>s = p[${i}]</code> → адрес ${ADDR[o]}. Компилаторът знае само, че това е Sensor.` });
        if (m === 2) {
          scalls++;
          out.push("Sensor");
          F.push({ at: ["call_kind", "s_kind"], objs, k: i, step: "static", vars: { i, "извиква се": "Sensor::kind" }, stats: { "динамични": vcalls, "статични": scalls }, msg: `<code>s->kind()</code> не е виртуален → <dfn data-g="статично свързване">статично свързване</dfn>: адресът на <code>Sensor::kind</code> е вграден в кода при компилация. Динамичният тип (${o}) не се гледа${o === "Temp" ? " — <code>Temp::kind</code> само <dfn data-g=\"скриване на име\">скрива</dfn> името, не го предефинира" : ""}.`, log: `kind → Sensor` });
          return;
        }
        const [mn, impl, val] = VT[o][m];
        vcalls++;
        F.push({ at: tg(m ? "call_unit" : "call_read", "call"), objs, k: i, step: "vptr", vars: { i, "s->vptr": VTADDR[o] }, stats: { "динамични": vcalls, "статични": scalls }, msg: `<dfn data-g="динамично свързване">Динамично свързване</dfn>, стъпка 1: прочита се скритият указател <b>vptr</b> от началото на обекта → ${VTADDR[o]}.` });
        F.push({ at: tg(m ? "call_unit" : "call_read", "call"), objs, k: i, step: "slot", slot: m, vars: { i, слот: m, "vtable[слот]": impl }, stats: { "динамични": vcalls, "статични": scalls }, msg: `Стъпка 2: от таблицата се взема слот ${m} (<code>${mn}</code>) → <code>${impl}</code>${o === "Press" && m === 1 ? " — Press не предефинира unit(), затова слотът е наследен от Sensor" : ""}.` });
        const implTag = c ? null : { "Sensor::read": "s_read", "Sensor::unit": "s_unit", "Temp::read": "t_read", "Temp::unit": "t_unit", "Press::read": "p_read" }[impl];
        const cTag = c ? { "Sensor::read": "vt_s", "Sensor::unit": "vt_s", "Temp::read": "vt_t", "Temp::unit": "vt_t", "Press::read": "vt_p" }[impl] : null;
        out.push(String(val));
        F.push({ at: c ? ["call", cTag] : [implTag, m ? "call_unit" : "call_read"], objs, k: i, step: "jump", slot: m, vars: { i, return: val }, stats: { "динамични": vcalls, "статични": scalls }, msg: `Стъпка 3: непряк скок към <code>${impl}</code> → връща <b>${val}</b>.`, log: `${o}: ${impl} → ${val}` });
      });
      F.push({ at: tg("ret", "ret"), objs, k: -1, done: true, vars: { резултат: out.join(" ") }, stats: { "динамични": vcalls, "статични": scalls }, msg: `Резултат: <code>${out.join(" ")}</code>. Един и същ ред код (<code>s->${["read()", "unit()", "kind()"][m]}</code>) — ${m === 2 ? "една и съща функция за всички обекти." : "различни реализации според динамичния тип. Това е полиморфизъм."}` });
      return { frames: F, result: out.join(" ") };
    },

    /** Търсене на име и избор на функция: обект (b, d, e, rbd, rbe) × извикване. Модел на правилата, използвани от g++ в 04_virtual.cpp. */
    names({ obj, call }) {
      const O = {
        b: { st: "B", dyn: "B" }, d: { st: "D", dyn: "D" }, e: { st: "E", dyn: "E" },
        rbd: { st: "B", dyn: "D", ref: true }, rbe: { st: "B", dyn: "E", ref: true },
      }[obj];
      if (!O) throw new Error("Непознат обект.");
      const C = { "f()": ["f", []], "f(1)": ["f", ["int"]], "g(2.5)": ["g", ["double"]], "g(2)": ["g", ["int"]], "h()": ["h", []] }[call];
      if (!C) throw new Error("Непознато извикване.");
      const [nm, args] = C;
      /* декларации по клас: [име, параметри, virtual?, таг] */
      const DECL = {
        B: [["f", [], true, "b_f"], ["f", ["int"], false, "b_fi"], ["g", ["double"], true, "b_g"], ["h", [], false, "b_h"]],
        D: [["f", [], true, "d_f"], ["g", ["int"], false, "d_g"], ["h", [], false, "d_h"]],
        E: [["f", [], true, "e_f"], ["f", ["int"], false, "e_using", "B"]],   // using B::f внася B::f(int)
      };
      const PARENT = { D: "B", E: "B", B: null };
      const F = [];
      const who = O.ref ? `B&amp; ${obj} (сочи ${O.dyn})` : `${O.st} ${obj}`;
      F.push({ at: null, phase: 0, vars: { израз: `${obj}.${call}`, "статичен тип": O.st, "динамичен тип": O.dyn }, msg: `<code>${obj}.${call}</code> — ${who}. Компилаторът минава три фази: <b>търсене на името</b> → <b>избор между претоварванията</b> → <b>вид на извикването</b>.`, log: `${obj}.${call}` });
      // 1) търсене на името: от статичния тип нагоре, спира при първия клас, който декларира името
      let cls = O.st, found = null;
      while (cls) {
        const here = DECL[cls].filter((d) => d[0] === nm);
        F.push({ at: here.length ? here.map((d) => d[3]) : null, phase: 1, cls, cand: here.map((d) => `${d[4] || cls}::${nm}(${d[1].join(", ")})`), vars: { "търсим в": cls, "намерени": here.length }, msg: here.length ? `Фаза 1: в <code>${cls}</code> има ${here.length} декларации на <code>${nm}</code> → търсенето <b>спира тук</b>. ${cls !== "B" && O.st !== "B" ? "Базовите версии с това име са <b>скрити</b> (освен внесените с using)." : ""}` : `Фаза 1: в <code>${cls}</code> няма <code>${nm}</code> → търсим в базовия клас.` });
        if (here.length) { found = here.map((d) => ({ cls: d[4] || cls, params: d[1], tag: d[3] })); break; }
        cls = PARENT[cls];
      }
      // 2) избор между претоварванията: точно съвпадение или стандартно преобразуване int<->double
      const conv = (a, p) => (a === p ? 2 : (a === "int" && p === "double") || (a === "double" && p === "int") ? 1 : 0);
      const scored = found.map((c) => {
        if (c.params.length !== args.length) return { c, s: -1 };
        let s = 2; args.forEach((a, k) => (s = Math.min(s, conv(a, c.params[k])))); return { c, s: s === 0 ? -1 : s };
      });
      const viable = scored.filter((x) => x.s >= 0).sort((a, b) => b.s - a.s);
      if (!viable.length) {
        F.push({ at: found.map((c) => c.tag), phase: 2, err: true, vars: { резултат: "ERR" }, done: true, msg: `Фаза 2: никой от кандидатите не приема (${args.join(", ") || "без аргументи"}). <b>Грешка при компилация</b> — версията от базовия клас е скрита и не участва.`, inv: { text: "скриване на име", ok: false }, log: "→ грешка" });
        return { frames: F, result: "ERR" };
      }
      const best = viable[0].c;
      F.push({ at: best.tag, phase: 2, vars: { избрана: `${best.cls}::${nm}(${best.params.join(", ")})`, преобразуване: viable[0].s === 2 ? "няма" : args[0] + " → " + best.params[0] }, msg: `Фаза 2 (<dfn data-g="претоварване">претоварване</dfn>): избрана е <code>${best.cls}::${nm}(${best.params.join(", ")})</code>${viable[0].s === 1 ? ` с преобразуване ${args[0]} → ${best.params[0]}` : " — точно съвпадение"}.` });
      // 3) виртуално ли е? ако да — крайната предефинираща реализация по динамичния тип
      let res = `${best.cls}::${nm}(${best.params.join(", ")})`;
      const isVirt = (nm === "f" && !best.params.length) || (nm === "g" && best.params[0] === "double");   // virtual в B
      if (isVirt) {
        // финален предефиниращ: D/E предефинират f(); никой не предефинира g(double)
        const fin = nm === "f" && (O.dyn === "D" || O.dyn === "E") ? O.dyn : "B";
        res = `${fin}::${nm}(${best.params.join(", ")})`;
        const tag = fin === "D" ? "d_f" : fin === "E" ? "e_f" : best.tag;
        F.push({ at: tag, phase: 3, vars: { "крайна реализация": res }, done: true, msg: `Фаза 3: функцията е <dfn data-g="виртуален метод">виртуална</dfn> → изпълнява се крайното <dfn data-g="предефиниране на метод">предефиниране</dfn> за динамичния тип ${O.dyn}: <code>${res}</code>.${nm === "g" && O.dyn === "D" ? " <code>D::g(int)</code> НЕ предефинира <code>g(double)</code> — сигнатурите са различни." : ""}`, log: "→ " + res });
      } else {
        F.push({ at: best.tag, phase: 3, vars: { "извиква се": res }, done: true, msg: `Фаза 3: функцията не е виртуална → статично свързване: <code>${res}</code>, независимо от динамичния тип.`, log: "→ " + res });
      }
      return { frames: F, result: res };
    },

    /** Виртуално извикване в конструктор/деструктор. */
    ctor() {

  const fmt = g6;

    shapes({ script }) {
      const parts = String(script).split(";").map((x) => x.trim()).filter(Boolean);
      if (!parts.length) throw new Error("Празен списък.");
      if (parts.length > 6) throw new Error("Най-много 6 фигури.");
      const shapes = [];
      parts.forEach((p) => {
        const m = p.match(/^([RTQ])\s+([\d.]+)(?:\s+([\d.]+))?$/i);
        if (!m) throw new Error(`„${p}“: пиши R w h (правоъгълник), T a b (правоъгълен триъгълник) или Q s (квадрат).`);
        const k = m[1].toUpperCase(), a = Number(m[2]), b = m[3] != null ? Number(m[3]) : null;

      });
      const F = [], ev = [];
      const live = [];
      const add = (o) => { if (o.ev) [].concat(o.ev).forEach((e) => ev.push(e)); F.push(Object.assign({}, o, { ev: ev.slice(), live: live.map((x) => x.i), shapes })); };
      add({ at: "noinst", msg: "<code>Shape</code> е <dfn data-g=\"абстрактен клас\">абстрактен</dfn>: има <dfn data-g=\"чисто виртуален метод\">чисто виртуална</dfn> <code>area() = 0</code>. <code>Shape s;</code> не се компилира — но <code>unique_ptr&lt;Shape&gt;</code> и <code>Shape&amp;</code> са допустими.", log: "vector<unique_ptr<Shape>> v" });
      shapes.forEach((s, i) => {

  function drawTree(st, f) {

<script>
/* Раздел 7 — Шаблони и статичен полиморфизъм. */
(function () {
  const S = window.Study, h = S.h;
  const PF = { int: "int", double: "double", char: "char", long: "long int", "const char*": "const char*" };   // както ги печата g++ в __PRETTY_FUNCTION__
  const SZ = { char: [1, 1], short: [2, 2], int: [4, 4], double: [8, 8], Big: [24, 1] };

  /* литерал → тип, както го извежда C++ */
  function lit(s) {
    s = s.trim();
    if (/^'.'$/.test(s)) return { t: "char", v: s[1], show: s };
    if (/^"[^"]*"$/.test(s)) return { t: "const char*", v: s.slice(1, -1), show: s };
    if (/^-?\d+L$/.test(s)) return { t: "long", v: Number(s.slice(0, -1)), show: s };
    if (/^-?\d+$/.test(s)) return { t: "int", v: Number(s), show: s };
    if (/^-?\d*\.\d+$|^-?\d+\.\d*$/.test(s)) return { t: "double", v: Number(s), show: s };
    throw new Error(`„${s}“ не е литерал (int, 2.5, 'c', 5L или "текст").`);
  }
  /* като printf("%g") / ostream по подразбиране: 6 значещи цифри, експоненциален запис при X < -4 или X >= 6 */
  const g6 = (v) => { if (v === 0) return Object.is(v, -0) ? "-0" : "0"; const [m, ex] = v.toExponential(5).split("e"), X = Number(ex);
    if (X < -4 || X >= 6) return m.replace(/\.?0+$/, "") + "e" + (X < 0 ? "-" : "+") + String(Math.abs(X)).padStart(2, "0");
    const f = v.toFixed(5 - X); return f.includes(".") ? f.replace(/\.?0+$/, "") : f; };
  const fmt = (t, v) => (t === "double" ? g6(v) : String(v));

  const algos = {
    /** Скрипт от извиквания на larger(...) → кои специализации се генерират и в какъв ред. */
    larger({ script }) {
      const calls = String(script).split(";").map((x) => x.trim()).filter(Boolean);
      if (!calls.length || calls.length > 10) throw new Error("Между 1 и 10 извиквания.");
      const F = [], inst = [], res = [];
      F.push({ at: "tpl", inst: [], msg: "<code>template&lt;class T&gt; T larger(T a, T b)</code> — само <b>описание</b> на семейство функции. Докато никой не я извика, не се генерира нито една функция.", log: "template larger<T>" });
      calls.forEach((c) => {
        const m = c.match(/^larger\s*(?:<\s*(int|double|char|long|const char\s*\*)\s*>)?\s*\(\s*(.+?)\s*,\s*(.+?)\s*\)$/);
        if (!m) throw new Error(`„${c}“: пиши larger(x, y) или larger<тип>(x, y).`);
        const ex = m[1] ? m[1].replace(/\s*\*/, "*").replace("const char*", "const char*") : null;
        const A = lit(m[2]), B = lit(m[3]);
        let T, how;
        if (ex) {
          T = ex;
          const ok = (x) => x.t === T || (["int", "double", "char", "long"].includes(x.t) && ["int", "double", "char", "long"].includes(T));
          if (!ok(A) || !ok(B)) throw new Error(`„${c}“: ${A.t}/${B.t} не се преобразува към ${T}.`);
          how = `T е зададен явно = <b>${T}</b>${A.t !== T || B.t !== T ? "; аргументите се преобразуват" : ""}`;
        } else {
          if (A.t !== B.t) {
            F.push({ at: "conflict", inst: inst.slice(), err: true, call: c, msg: `<code>${c}</code>: от първия аргумент T = ${A.t}, от втория T = ${B.t} — <b>противоречиво извеждане, грешка при компилация</b>. Шаблонът не прави неявни преобразувания при извеждането. Решение: <code>larger&lt;double&gt;(…)</code>.`, inv: { text: "изведеният T трябва да е еднозначен", ok: false }, log: `${c} → грешка` });
            res.push("ERR");
            return;
          }
          T = A.t;
          how = `T се <b>извежда</b> от аргументите: ${A.show} и ${B.show} са ${T}`;
        }
        const isSpec = T === "const char*";
        const sig = isSpec ? "T larger(T, T) [with T = const char*]" : `T larger(T, T) [with T = ${PF[T]}]`;
        const fresh = !inst.includes(sig);
        const num = (x) => (x.t === "char" ? x.v.charCodeAt(0) : Number(x.v));   // 'a' -> 97 (стандартно преобразуване)
        const cv = (x) => {
          if (T === "int" || T === "long") return Math.trunc(num(x));
          if (T === "double") return num(x);
          if (T === "char") { if (x.t === "char") return x.v; const k = Math.trunc(num(x)); if (k < 32 || k > 126) throw new Error(`„${c}“: ${x.show} → char извън печатния ASCII не се демонстрира.`); return String.fromCharCode(k); }
          return x.v;
        };
        const a = cv(A), b = cv(B);
        const less = T === "const char*" ? a < b : a < b;
        const r = less ? b : a;
        F.push({ at: isSpec ? "spec" : "tpl", inst: inst.slice(), call: c, T, msg: `<code>${c}</code>: ${how}.` });
        if (fresh) inst.push(sig);
        F.push({ at: isSpec ? "spec" : "inst", inst: inst.slice(), call: c, T, fresh, cur: inst.indexOf(sig), vars: { T }, stats: { специализации: inst.length },
          msg: isSpec ? `Има <b>явна (пълна) специализация</b> за <code>const char*</code> — тя се използва вместо общия шаблон, защото <code>a &lt; b</code> би сравнило <b>адресите</b>, не текста.${fresh ? "" : " Вече е използвана — нищо ново."}` : fresh ? `<dfn data-g="инстанциране">Инстанциране</dfn>: компилаторът генерира <b>нова</b> функция <code>larger&lt;${T}&gt;</code>.` : `<code>larger&lt;${T}&gt;</code> вече е генерирана — използва се същата функция, нова не се създава.`,
          log: `${c} → larger<${T}>${fresh ? " (нова)" : ""}` });
        F.push({ at: isSpec ? "spec_cmp" : "cmp", inst: inst.slice(), call: c, T, cur: inst.indexOf(sig), vars: { T, a: String(a), b: String(b), return: fmt(T, r) }, stats: { специализации: inst.length },
          msg: isSpec ? `<code>strcmp("${a}", "${b}") &lt; 0</code> → ${less} → връща <b>"${r}"</b>.` : `<code>a &lt; b ? b : a</code> → ${T === "char" ? `'${a}' &lt; '${b}'` : `${fmt(T, a)} &lt; ${fmt(T, b)}`} → ${less} → връща <b>${T === "char" ? r : fmt(T, r)}</b>. Изискване към T: операция <code>&lt;</code> и копиране.` });
        res.push(T === "char" ? r : fmt(T, r));
      });
      F[F.length - 1].done = true;
      return { frames: F, inst, res };
    },

    /** Размер на Stack<T, N> — по същите правила за подравняване като в раздел 1. */
    stack({ T, N }) {
      if (!SZ[T]) throw new Error("Тип: char, short, int, double или Big.");
      const n = S.int(N, 1, 16, "N");
      const [sz, al] = SZ[T];
      const A = Math.max(al, 4);
      const dataEnd = sz * n, topOff = Math.ceil(dataEnd / 4) * 4, end = topOff + 4, size = Math.ceil(end / A) * A;
      const F = [];
      F.push({ at: "three", vars: { T, N: n }, msg: `<code>Stack&lt;${T}, ${n}&gt;</code> — нов, отделен клас. Параметърът N е <b>стойност</b>, известна при компилация.`, size: null });
      F.push({ at: "data", vars: { "sizeof(T)": sz, "data[N]": dataEnd }, msg: `<code>T data[${n}]</code> заема ${n} × ${sz} = ${dataEnd} байта (отместване 0).`, dataEnd, size: null });
      F.push({ at: "top", vars: { "offset(top)": topOff, padding: topOff - dataEnd }, msg: `<code>int top</code> изисква кратно на 4 → отместване ${topOff}${topOff > dataEnd ? ` (${topOff - dataEnd} байта padding)` : ""}.`, dataEnd, topOff, size: null });
      F.push({ at: "three", done: true, vars: { sizeof: size }, msg: `Подравняване на целия клас = ${A} → <b>sizeof = ${size}</b>.`, dataEnd, topOff, size, sz, n });
      return { frames: F, size };
    },
  };

  const html = `
<div class="prose">
  <p><dfn data-g="шаблон">Шаблонът</dfn> описва семейство функции или класове, параметризирани с типове или други допустими параметри. <dfn data-g="инстанциране">Инстанцирането</dfn> формира конкретна <dfn data-g="специализация">специализация</dfn>. Един алгоритъм може да се използва за различни типове, ако те поддържат нужните операции — това е основа на <dfn data-g="обобщено програмиране">обобщеното програмиране</dfn>.</p>
</div>

<div class="block">
  <h3>larger&lt;T&gt;: кои функции се генерират</h3>
  <p class="prose"><code>larger(3, 7)</code> използва T=int; <code>larger(2.5, 1.0)</code> — T=double. Опиши поредица от извиквания: вдясно се трупат специализациите в реда на първото им използване. Списъкът е същият, който програмата отпечатва чрез <code>__PRETTY_FUNCTION__</code> (разширение на g++).</p>
  <div id="v-larger"></div>
  <details class="hint"><summary>Хинт: шаблонът не е текстов макрос</summary><div><p>Макросът <code>#define LARGER(a,b) ((a)&lt;(b)?(b):(a))</code> изчислява един от аргументите (по-големия) два пъти и не знае типове. Шаблонът участва в типизирането: T се извежда, проверява се, че <code>&lt;</code> съществува за T, връщаният тип е T. Грешката „противоречиво извеждане“ е именно типова проверка.</p></div></details>
</div>

<div class="block">
  <h3>Шаблон на клас: Stack&lt;T, N&gt;</h3>
  <p class="prose">Шаблоните на класове параметризират цяла структура. <code>vector&lt;int&gt;</code> и <code>vector&lt;double&gt;</code> са различни специализации с различни елементи. Различните специализации могат да имат различен размер на елементите и различно генериран код.</p>
  <div id="v-stack"></div>
</div>

<div class="block">
  <h3>Статичен и динамичен полиморфизъм</h3>
  <div class="tbl-wrap"><table class="t">
    <tr><th></th><th>Шаблони</th><th>Виртуални методи</th></tr>
    <tr><td>Кога се избира реализацията</td><td>при компилация (статичен полиморфизъм)</td><td>при изпълнение, по динамичния тип</td></tr>
    <tr><td>Изискване към типа</td><td>да поддържа нужните операции (напр. <code>&lt;</code>)</td><td>да наследява базовия клас и да предефинира методите</td></tr>
    <tr><td>Цена</td><td>може да увеличи генерирания код (по една функция за тип)</td><td>vptr в обекта, непряко извикване, по-трудно вграждане</td></tr>
    <tr><td>Нов тип след компилация</td><td>не</td><td>да (напр. от друга библиотека)</td></tr>
  </table></div>
  <p class="prose">Няма общо правило „шаблоните са бързи, виртуалните методи са бавни“. Имат значение размерът на кода, възможността за вграждане, честотата на извикванията и нуждата от избор след компилация. Двата подхода могат да се съчетават в една библиотека (напр. шаблон на контейнер от <code>unique_ptr&lt;Shape&gt;</code>).</p>
  <details class="trap"><summary>Капан: „шаблонът е вид наследяване“</summary><div><p>Не. Шаблонът генерира семейство специализации според параметри; наследяването задава отношение между класове. Могат да участват в една конструкция, но не определят едно и също отношение.</p></div></details>
  <details class="trap"><summary>Капан: Java generics = C++ templates</summary><div><p>Не са взаимозаменяеми — имат различен модел. Реални шаблони: <code>std::vector&lt;int&gt;</code> и <code>std::vector&lt;double&gt;</code> са специализации на шаблон; <code>std::sort</code> е алгоритъм от стандартната библиотека, който изисква подходящо сравнение и достъп, а не наследяване от общ базов клас.</p></div></details>
  <div class="key">Шаблон = схема; инстанциране = конкретна функция/клас за конкретни параметри; едно и също T се генерира веднъж. Изборът е при компилация.</div>
</div>`;

  function mount(root) {

      code: "ch07_larger",
      inputs: [{ id: "script", label: "извиквания", value: "larger(3, 7); larger(2.5, 1.0)", width: "min(34em, 100%)" }],
      presets: [{ label: "Пет типа", values: { script: "larger('a', 'z'); larger(10, -4); larger<double>(3, 2.5); larger<const char*>(\"abc\", \"abd\"); larger(5L, 9L)" } },
        { label: "Повторно int", values: { script: "larger(3, 7); larger(1, 2); larger(9, 8)" } }, { label: "Конфликт", values: { script: "larger(3, 7); larger(3, 2.5)" } }],
      legend: [["s-act", "нова/използвана специализация"], ["s-swap", "грешка при компилация"]],
      build: algos.larger,
      draw(st, f) {
        st.innerHTML = "";
        const box = h("div", { class: "objs" });
        box.append(h("div", { class: "obj s-piv" }, h("div", { class: "oh", text: "template<class T> larger" }), h("div", { class: "orow muted", text: "описание, не код" })));
        const gen = h("div", { class: "obj" }, h("div", { class: "oh", text: "генерирани функции" }));
        if (!f.inst.length) gen.append(h("div", { class: "orow muted", text: "няма" }));
        f.inst.forEach((s, i) => gen.append(h("div", { class: "orow " + (i === f.cur ? (f.fresh ? "s-act" : "s-done") : "") }, h("span", { class: "mono", text: s }))));
        box.append(gen);
        if (f.err) box.append(h("div", { class: "obj s-swap" }, h("div", { class: "oh", text: f.call }), h("div", { class: "orow", text: "противоречиво извеждане на T" })));
        st.append(box);
      },
    });

    S.viz(root.querySelector("#v-stack"), {
      id: "stack", title: "sizeof на специализациите", sub: "x86-64; Big = struct от 24 char.",
      code: "ch07_stack",
      inputs: [{ id: "T", label: "T", type: "select", value: "int", options: ["char", "short", "int", "double", "Big"] }, { id: "N", label: "N", type: "number", value: 4, width: "5em" }],
      presets: [{ label: "Stack<char,10>", values: { T: "char", N: 10 } }, { label: "Stack<double,1>", values: { T: "double", N: 1 } }, { label: "Stack<Big,2>", values: { T: "Big", N: 2 } }],
      legend: [["s-act", "data[N]"], ["s-done", "top"], ["s-swap", "padding"]],
      build: algos.stack,
      draw(st, f) {
        st.innerHTML = "";
        if (f.dataEnd == null) { st.append(h("p", { class: "muted", text: "Нов клас за всяка двойка (T, N)." })); return; }
        const total = f.size || (f.topOff != null ? f.topOff + 4 : f.dataEnd);
        const box = h("div", { class: "mem" });
        for (let b = 0; b < total; b++) {
          let cls = "b ", t = "";
          if (b < f.dataEnd) cls += "s-act";
          else if (f.topOff != null && b >= f.topOff && b < f.topOff + 4) { cls += "s-done"; t = b === f.topOff ? "top" : ""; }
          else cls += "pad s-swap";
          box.append(h("div", { class: cls }, h("span", { class: "o", text: b % 8 === 0 ? b : "" }), t));
        }
        st.append(box);
      },
    });
  }

  S.chapter({ id: "shabloni", order: 7, num: "7", group: "Обобщаване", title: "Шаблони и статичен полиморфизъм", lead: "Инстанциране, извеждане на T, явна специализация, шаблон на клас и сравнение с виртуалните методи.", html, mount, algos });

<script>

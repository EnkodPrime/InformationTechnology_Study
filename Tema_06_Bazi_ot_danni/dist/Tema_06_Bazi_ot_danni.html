<script>
/* Тема 6 — общо ядро за функционални зависимости (чисти функции, без DOM).
   Огледало на c/05_fd.c: множествата са битови маски, ФЗ са {lhs, rhs}.
   Използва се от разделите 5–8. */
(function () {
  const FD = (window.T6FD = {});

  /** "A B C", "A->B; B,C->A" -> {names, fds:[{lhs,rhs}]}  (хвърля Error при грешка) */
  FD.parse = function (attrs, fds) {
    const names = String(attrs).split(/[\s,]+/).filter(Boolean);
    if (!names.length) throw new Error("Схемата няма атрибути.");
    if (names.length > 10) throw new Error("Най-много 10 атрибута (за да е видимо стъпка по стъпка).");
    if (new Set(names).size !== names.length) throw new Error("Повторено име на атрибут в схемата.");
    names.forEach((n) => { if (n.length > 15) throw new Error(`Името „${n}“ е по-дълго от 15 знака.`); if (/->|;/.test(n)) throw new Error(`Невалидно име „${n}“.`); });
    const idx = (n) => { const k = names.indexOf(n); if (k < 0) throw new Error(`Атрибутът „${n}“ не е в схемата.`); return k; };
    const set = (s) => s.split(/[\s,]+/).filter(Boolean).reduce((m, n) => m | (1 << idx(n)), 0);
    const list = [];
    String(fds).split(";").map((x) => x.trim()).filter(Boolean).forEach((p) => {
      const parts = p.split("->");
      if (parts.length !== 2) throw new Error(`„${p}“: зависимост във вида „X->Y“, напр. „A,B->C“.`);
      const lhs = set(parts[0]), rhs = set(parts[1]);
      if (!lhs) throw new Error(`„${p}“: лявата страна е празна.`);
      if (rhs) list.push({ lhs, rhs, txt: p });
    });
    if (list.length > 16) throw new Error("Най-много 16 зависимости.");
    return { names, n: names.length, fds: list, set, all: (1 << names.length) - 1 };
  };
  FD.pop = (s) => { let c = 0; while (s) { c += s & 1; s >>>= 1; } return c; };
  FD.sub = (a, b) => (a & ~b) === 0;
  FD.str = (sch, m) => { const o = []; for (let i = 0; i < sch.n; i++) if (m >> i & 1) o.push(sch.names[i]); return o.length ? o.join(",") : "∅"; };
  FD.fdStr = (sch, d) => FD.str(sch, d.lhs) + " → " + FD.str(sch, d.rhs);

  /** X⁺ с броячи (passes, checks) и по желание — кадри. */
  FD.closure = function (sch, X, cnt, frames, tagged) {
    let res = X, changed = true;
    if (cnt) cnt.closures = (cnt.closures || 0) + 1;
    if (frames) frames.push({ at: "cl_init", res, fi: -1, msg: `X⁺ := X = {${FD.str(sch, X)}}.`, log: `start {${FD.str(sch, X)}}` });
    let pass = 0;
    while (changed) {
      changed = false; pass++;
      if (cnt) cnt.passes = (cnt.passes || 0) + 1;
      if (frames) frames.push({ at: "cl_pass", res, fi: -1, pass, msg: `Проход ${pass} през всички зависимости.` });
      for (let i = 0; i < sch.fds.length; i++) {
        const d = sch.fds[i];
        if (cnt) cnt.checks = (cnt.checks || 0) + 1;
        const lhsIn = FD.sub(d.lhs, res), rhsIn = FD.sub(d.rhs, res);
        if (lhsIn && !rhsIn) {
          const add = d.rhs & ~res;
          if (frames) frames.push({ at: ["cl_fd", "cl_test"], res, fi: i, ok: true, pass, msg: `${FD.fdStr(sch, d)}: {${FD.str(sch, d.lhs)}} ⊆ X⁺ — прилагаме.` });
          res |= d.rhs; changed = true;
          if (frames) frames.push({ at: "cl_apply", res, fi: i, ok: true, added: add, pass, msg: `X⁺ ∪= {${FD.str(sch, d.rhs)}} → нови: <b>${FD.str(sch, add)}</b>.`, log: `+${FD.str(sch, add)} (${FD.fdStr(sch, d)})` });
        } else if (frames) frames.push({ at: ["cl_fd", "cl_test"], res, fi: i, ok: false, pass, msg: lhsIn ? `${FD.fdStr(sch, d)}: дясната страна вече е в X⁺ — нищо ново.` : `${FD.fdStr(sch, d)}: {${FD.str(sch, d.lhs & ~res)}} още не е в X⁺ — не може да се приложи.` });
      }
      if (frames && !changed) frames.push({ at: "cl_pass", res, fi: -1, pass, msg: `Проход ${pass} не добави нищо — неподвижна точка.` });
    }
    if (frames) frames.push({ at: "cl_done", res, fi: -1, done: true, msg: `X⁺ = {<b>${FD.str(sch, res)}</b>}.` });
    return res;
  };

  /** Всички кандидатни ключове (същият ред на обхождане като в C). */
  FD.keys = function (sch, cnt, frames) {
    const keys = [];
    for (let size = 1; size <= sch.n; size++) {
      if (frames) frames.push({ at: "k_size", size, keys: keys.slice(), msg: `Подмножества с ${size} атрибута.` });
      for (let X = 1; X <= sch.all; X++) {
        if (FD.pop(X) !== size) continue;
        const sup = keys.find((k) => FD.sub(k, X));
        if (sup !== undefined) { if (frames) frames.push({ at: ["k_super", "k_skip"], X, size, keys: keys.slice(), skip: sup, msg: `{${FD.str(sch, X)}} ⊇ ключа {${FD.str(sch, sup)}} — не е минимален, пропускаме без затваряне.` }); continue; }
        const c = FD.closure(sch, X, cnt);
        const isKey = c === sch.all;
        if (frames) frames.push({ at: "k_test", X, size, cl: c, keys: keys.slice(), ok: isKey, msg: `{${FD.str(sch, X)}}⁺ = {${FD.str(sch, c)}} ${isKey ? "= всички атрибути" : "≠ всички"}.` });
        if (isKey) { keys.push(X); if (frames) frames.push({ at: "k_found", X, size, cl: c, keys: keys.slice(), ok: true, msg: `<b>Кандидатен ключ: {${FD.str(sch, X)}}</b>. Никой собствен поднабор не е ключ (иначе щеше да е намерен по-рано).`, log: `ключ {${FD.str(sch, X)}}` }); }
      }
    }
    return keys;
  };

  FD.prime = (keys) => keys.reduce((m, k) => m | k, 0);

  /* ---------- нормални форми и разлагане (огледало на c/06_nf.c) ---------- */

  /** Анализ: ключове, първични атрибути, нарушения. kind: 2 частична, 3 — 3НФ, 4 — само BCNF. */
  FD.analyze = function (sch, cnt, frames) {
    const keys = FD.keys(sch, cnt);
    const prime = FD.prime(keys);
    const v = [];
    let partial = false, bad3 = false, badB = false;
    const push = (o) => frames && frames.push({ keys, prime, viol: v.slice(), ...o });
    push({ at: ["an_keys", "an_prime"], msg: `Кандидатни ключове: ${keys.map((k) => "{" + FD.str(sch, k) + "}").join(", ")}. Първични атрибути: {${FD.str(sch, prime)}}.` });
    for (const K of keys) {
      push({ at: "an_key", K, msg: `2НФ: собствените части на ключа {${FD.str(sch, K)}}${FD.pop(K) === 1 ? " — ключът е от един атрибут, няма собствени непразни части" : ""}.` });
      for (let X = (K - 1) & K; X; X = (X - 1) & K) {
        const dep = FD.closure(sch, X, cnt) & ~X & ~prime;
        push({ at: "an_part", K, X, dep, msg: `{${FD.str(sch, X)}}⁺ съдържа непървични: {${FD.str(sch, dep)}}.` });
        for (let a = 0; a < sch.n; a++) if (dep >> a & 1) {
          v.push({ lhs: X, attr: a, kind: 2 }); partial = true;
          push({ at: "an_partbad", K, X, a, bad: 2, msg: `<b>Нарушение на 2НФ:</b> ${sch.names[a]} зависи от {${FD.str(sch, X)}} — собствена част на ключа {${FD.str(sch, K)}}.`, log: `2НФ: ${FD.str(sch, X)} → ${sch.names[a]}` });
        }
      }
    }
    sch.fds.forEach((d, fi) => {
      for (let a = 0; a < sch.n; a++) {
        if (!(d.rhs >> a & 1) || (d.lhs >> a & 1)) continue;
        const sup = FD.closure(sch, d.lhs, cnt) === sch.all;
        push({ at: "an_fd", fi, a, sup, msg: `${FD.str(sch, d.lhs)} → ${sch.names[a]}: ${FD.str(sch, d.lhs)} ${sup ? "<b>е</b> суперключ — допустимо и в BCNF" : "не е суперключ"}.` });
        if (sup) continue;
        badB = true;
        if (prime >> a & 1) {
          v.push({ lhs: d.lhs, attr: a, kind: 4 });
          push({ at: "an_bcnf", fi, a, bad: 4, msg: `${sch.names[a]} е <b>първичен</b> атрибут — 3НФ допуска зависимостта, <b>BCNF я забранява</b>.`, log: `BCNF: ${FD.str(sch, d.lhs)} → ${sch.names[a]}` });
          continue;
        }
        bad3 = true;
        v.push({ lhs: d.lhs, attr: a, kind: 3 });
        push({ at: ["an_bcnf", "an_3nf"], fi, a, bad: 3, msg: `${sch.names[a]} е непървичен, а ${FD.str(sch, d.lhs)} не е суперключ — <b>нарушение на 3НФ</b> (и на BCNF).`, log: `3НФ: ${FD.str(sch, d.lhs)} → ${sch.names[a]}` });
      }
    });
    const level = partial ? 1 : bad3 ? 2 : badB ? 3 : 4;
    push({ at: "an_level", level, done: true, msg: `Най-високата изпълнена форма: <b>${["", "1НФ", "2НФ", "3НФ", "BCNF"][level]}</b>.` });
    return { level, keys, prime, viol: v };
  };

  /** Стандартно BCNF разлагане (същият избор на нарушение като в C). */
  FD.bcnf = function (sch, cnt, frames) {
    const rels = [sch.all];
    const push = (o) => frames && frames.push({ rels: rels.slice(), ...o });
    push({ at: "b_init", msg: `Започваме с R = {${FD.str(sch, sch.all)}}.` });
    for (let i = 0; i < rels.length;) {
      const Ri = rels[i], m = FD.pop(Ri);
      push({ at: "b_pick", ri: i, msg: `Проверяваме R${i + 1} = {${FD.str(sch, Ri)}} за нарушение на BCNF.` });
      let X = 0, c = 0;
      outer: for (let size = 1; size < m; size++) for (let Y = (Ri - 1) & Ri; Y; Y = (Y - 1) & Ri) {
        if (FD.pop(Y) !== size) continue;
        const cc = FD.closure(sch, Y, cnt) & Ri;
        if (cc !== Y && cc !== Ri) { X = Y; c = cc; push({ at: ["b_close", "b_viol"], ri: i, X, c, msg: `{${FD.str(sch, Y)}}⁺ ∩ R${i + 1} = {${FD.str(sch, cc)}}: нетривиално и ≠ R${i + 1} ⇒ {${FD.str(sch, Y)}} е детерминант, който <b>не е суперключ</b> на R${i + 1}.` }); break outer; }
      }
      if (!X || rels.length >= 12) { push({ at: "b_ok", ri: i, okRel: i, msg: `R${i + 1} = {${FD.str(sch, Ri)}} е в BCNF${m <= 2 ? " (всяка релация с два атрибута е в BCNF)" : ""}.`, log: `R${i + 1} = {${FD.str(sch, Ri)}} ✓` }); i++; continue; }
      const rest = Ri & ~(c & ~X);
      rels[i] = c; rels.push(rest);
      push({ at: "b_split", ri: i, X, c, newRel: rels.length - 1, msg: `Разделяме: R${i + 1} := {${FD.str(sch, c)}} (X⁺ ∩ R${i + 1}) и R${rels.length} := {${FD.str(sch, rest)}} (R − (X⁺ − X)). Общият атрибут {${FD.str(sch, X)}} е суперключ на първата част ⇒ разделянето е без загуба.`, log: `раздели по ${FD.str(sch, X)}` });
    }
    push({ done: true, msg: `Резултат: ${rels.map((r) => "{" + FD.str(sch, r) + "}").join(", ")}.` });
    return rels;
  };

  /** Запазена ли е d при разлагането rels? */
  FD.preserved = function (sch, rels, d, cnt, frames) {
    let Z = d.lhs, changed = true;
    const push = (o) => frames && frames.push({ Z, ...o });
    push({ at: "p_init", msg: `Проверяваме ${FD.fdStr(sch, d)}: Z := {${FD.str(sch, Z)}}.` });
    while (changed) {
      changed = false;
      push({ at: "p_loop", msg: "Нов проход през подсхемите." });
      rels.forEach((Ri, i) => {
        const add = FD.closure(sch, Z & Ri, cnt) & Ri;
        const grow = add & ~Z;
        push({ at: ["p_rel", "p_local"], ri: i, add, msg: `В R${i + 1} = {${FD.str(sch, Ri)}}: ({${FD.str(sch, Z & Ri)}})⁺ ∩ R${i + 1} = {${FD.str(sch, add)}}${grow ? ` — нови: <b>${FD.str(sch, grow)}</b>` : " — нищо ново"}.` });
        if (grow) { Z |= add; changed = true; push({ at: "p_grow", ri: i, add, msg: `Z = {${FD.str(sch, Z)}}.` }); }
      });
    }
    const ok = (d.rhs & ~Z) === 0;
    push({ at: "p_res", ok, done: true, msg: ok ? `{${FD.str(sch, d.rhs)}} ⊆ Z ⇒ <b>запазена</b>: проверява се чрез локалните зависимости.` : `{${FD.str(sch, d.rhs & ~Z)}} ⊄ Z ⇒ <b>не е запазена</b>: никоя комбинация от локални проверки не я гарантира.` });
    return ok;
  };

  /** Chase (метод на таблицата). Връща номера (1..) на реда, станал изцяло „a“, или 0. */
  FD.chase = function (sch, rels, frames) {
    const t = rels.map((R, i) => Array.from({ length: sch.n }, (_, j) => (R >> j & 1 ? 0 : 1 + i * 12 + j)));
    let steps = 0, changed = true;
    const snap = (o) => frames && frames.push({ t: t.map((r) => r.slice()), steps, ...o });
    snap({ at: "c_init", msg: "Таблица: ред i е подсхемата Ri. В колоните на Ri пишем отличения символ a; в останалите — b<sub>ij</sub> (уникален за реда)." });
    let pass = 0;
    while (changed) {
      changed = false; pass++;
      snap({ at: "c_pass", msg: `Проход ${pass}: прилагаме всяка ФЗ към всяка двойка редове.` });
      sch.fds.forEach((d, fi) => {
        for (let r1 = 0; r1 < rels.length; r1++) for (let r2 = r1 + 1; r2 < rels.length; r2++) {
          let agree = true;
          for (let j = 0; j < sch.n; j++) if ((d.lhs >> j & 1) && t[r1][j] !== t[r2][j]) agree = false;
          if (!agree) continue;
          for (let j = 0; j < sch.n; j++) {
            if (!(d.rhs >> j & 1) || t[r1][j] === t[r2][j]) continue;
            const keep = Math.min(t[r1][j], t[r2][j]), drop = t[r1][j] + t[r2][j] - keep;
            snap({ at: "c_agree", fi, r1, r2, col: j, msg: `${FD.fdStr(sch, d)}: редове ${r1 + 1} и ${r2 + 1} съвпадат по {${FD.str(sch, d.lhs)}} ⇒ трябва да съвпадат и по ${sch.names[j]}.` });
            for (let r = 0; r < rels.length; r++) if (t[r][j] === drop) t[r][j] = keep;
            changed = true; steps++;
            snap({ at: "c_equate", fi, r1, r2, col: j, msg: `Изравняваме ${sch.names[j]}: ${keep === 0 ? "a" : "b"} замества другия символ навсякъде.`, log: `${FD.fdStr(sch, d)}: ред ${r1 + 1}~${r2 + 1}, ${sch.names[j]}` });
          }
        }
      });
      for (let r = 0; r < rels.length; r++) if (t[r].every((x) => x === 0)) { snap({ at: ["c_check", "c_yes"], full: r, done: true, msg: `Ред ${r + 1} е изцяло от a ⇒ разлагането е <b>без загуба</b>.`, inv: { text: "Съединението на проекциите възстановява точно R", ok: true } }); return { row: r + 1, steps }; }
      snap({ at: "c_check", msg: changed ? "Още няма ред само от a; повтаряме." : "Нищо не се промени." });
    }
    snap({ at: "c_no", done: true, msg: "Неподвижна точка без ред само от a ⇒ разлагането <b>не е</b> гарантирано без загуба: има състояние, в което съединението добавя фалшиви кортежи.", inv: { text: "Възможни са фалшиви кортежи", ok: false } });
    return { row: 0, steps };
  };
})();

  <div class="tbl-wrap"><table class="t">
    <tr><th>Продукт</th><th>Категория по ръководството</th></tr>
    <tr><td>Microsoft SQL Server, MySQL, Oracle Database</td><td><dfn data-g="rdbms">RDBMS</dfn> — релационна СУБД</td></tr>
    <tr><td>PostgreSQL</td><td>по-точно <dfn data-g="ordbms">ORDBMS</dfn> — разширява релационния модел с обектни възможности</td></tr>
    <tr><td>SQLite</td><td>вградена релационна СУБД</td></tr>
    <tr><td>MongoDB · Redis · Neo4j <span class="extra-tag">извън конспекта</span></td><td>документна СУБД · система за структури от данни в паметта · графова СУБД</td></tr>
  </table></div>
  <div class="key">Името СУБД <b>не означава задължително релационен модел</b>. Продуктите могат да поддържат повече от един модел. Реалните продукти са примери за реализации, а не определения на теоретичните категории.</div>
</div>

<div class="block">
  <h3>Схема и състояние</h3>
  <p class="prose"><dfn data-g="схема">Схемата</dfn> описва атрибути, типове и ограничения; <dfn data-g="състояние на база">състоянието</dfn> са конкретните записани кортежи в даден момент. <dfn data-g="метаданни">Метаданните</dfn> описват самите данни. Ако днес всички имена са различни, това <b>не доказва</b>, че Name е ключ. Разликата между наблюдавани данни и допустим модел е основата на нормализацията.</p>
  <div id="v-state"></div>
  <details class="hint"><summary>Защо това е толкова важно за нормализацията</summary><div>
    <p>Ключовете и функционалните зависимости са <i>правила на предметната област</i>. Ако ги извеждаш от текущите редове, всяко ново вмъкване може да ги „опровергае“. Затова в раздели 5–8 зависимостите се задават като вход, а не се откриват от данните.</p>
  </div></details>
</div>

<div class="block">
  <h3>Три равнища на моделиране и независимост на данните</h3>
  <p class="prose"><b>Концептуалното</b> моделиране описва обекти и връзки в предметната област, <b>логическото</b> ги преобразува в избран модел (например релационен), а <b>физическото</b> избира индекси, разположение и други механизми. Не трябва да се започва направо с индекси преди да са ясни смисълът и зависимостите.</p>
  <p class="prose"><dfn data-g="независимост на данните">Независимостта на данните</dfn> цели промени в определени равнища на организация да не изискват промяна на всички приложения. <b>Логическата</b> и <b>физическата</b> независимост са различни степени на тази цел.</p>
  <p class="prose muted">Стандартна рамка за тези степени е трислойната архитектура ANSI/SPARC: <b>външно</b> равнище (изгледите на отделните приложения), <b>концептуално</b> (общата логическа схема) и <b>вътрешно</b> (физическо съхранение). Физическата независимост означава, че промяна във вътрешното равнище не налага промяна на концептуалното; логическата — че промяна в концептуалното не налага промяна на външните изгледи. <span class="extra-tag">извън конспекта</span></p>
  <div id="v-indep"></div>
  <details class="trap"><summary>Капан: независимостта е цел, не абсолютна гаранция</summary><div><p>Ръководството казва „<i>определени</i> равнища“ и „не на <i>всички</i> приложения“. Ако премахнеш данни, които приложение чете, то трябва да се промени. Пробвай промяната „Премахваме колона…“ по-горе.</p></div></details>
</div>

<div class="block">
  <h3>Релационният модел отделя логиката от навигацията</h3>
  <p class="prose">Релационният модел, свързан с работата на Едгар Код от 1970 г., отделя логическото описание на данните от конкретни навигационни пътища в съхранението. Потребителят задава търсените отношения, а системата избира достъп. Това не прави физическото разполагане без значение — прави го <b>отделно проектно равнище</b>. Един и същ логически резултат може да се получи чрез сканиране, <dfn data-g="индекс">индекс</dfn> и различни видове <dfn data-g="съединение">съединение</dfn> (виж <a href="#sql">раздел 4</a>).</p>
</div>`;

  const COMP = [
    { k: "user", t: "Потребител", s: "човек", d: "Работи с потребителските случаи на приложението. Не вижда таблици и файлове." },
    { k: "app", t: "Приложение", s: "напр. студентска система", d: "Реализира потребителските случаи върху услугата на СУБД. Изпраща SQL заявки и получава резултати." },
    { k: "client", t: "Клиентски инструмент", s: "pgAdmin · SSMS · Workbench", d: "Също клиент на СУБД — за администриране и ръчни заявки. <b>Не е</b> самата СУБД." },
    { k: "dbms", t: "СУБД (сървър)", s: "PostgreSQL · SQL Server · MySQL", d: "Управлява дефиниране, четене, промени, права, конкурентен достъп, транзакции и възстановяване. Избира план за изпълнение." },
    { k: "db", t: "База от данни", s: "схема + състояние", d: "Организираните данни и тяхната схема: таблиците Student, Course, Enrollment и ограниченията им." },
    { k: "files", t: "Физически файлове", s: "страници, индекси, журнал", d: "Носителят на данните. Самите файлове <b>не са</b> СУБД — без нея са неразбираеми байтове." },
  ];
  const NAMES = [["PostgreSQL", "dbms"], ["pgAdmin", "client"], ["SSMS", "client"], ["Student (таблица)", "db"], ["SQL", "lang"], ["файл с данни", "files"], ["SQLite", "dbms"], ["студентска система", "app"], ["MySQL Workbench", "client"]];

  function mount(root) {
    /* Схема 1 */
    const host = root.querySelector("#s1-diag"), det = root.querySelector("#s1-detail");
    const W = 720, H = 250;
    const pos = { user: [10, 20], app: [180, 20], client: [180, 140], dbms: [380, 80], db: [570, 40], files: [570, 150] };
    const svg = S.svg("svg", { viewBox: `0 0 ${W} ${H}`, width: W, role: "img", "aria-label": "Приложение, СУБД и данни" });
    const line = (a, b, lab) => {
      const [x1, y1] = pos[a], [x2, y2] = pos[b];
      const p = S.svg("path", { class: "ln", d: `M${x1 + 140} ${y1 + 30} L${x2} ${y2 + 30}` });
      svg.append(p);
      if (lab) svg.append(S.svg("text", { class: "lbl", x: (x1 + 140 + x2) / 2 - 12, y: (y1 + y2) / 2 + 24, text: lab }));
      return p;
    };
    const L = { ua: line("user", "app"), ad: line("app", "dbms", "SQL"), cd: line("client", "dbms", "SQL"), dd: line("dbms", "db"), df: line("dbms", "files") };
    const G = {};
    COMP.forEach((c) => {
      const [x, y] = pos[c.k];
      const g = S.svg("g", { class: "box", tabindex: 0, role: "button", onclick: () => pick(c.k), onkeydown: (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(c.k); } } },
        S.svg("rect", { x, y, width: 140, height: 60, rx: 6 }),
        S.svg("text", { x: x + 8, y: y + 24, text: c.t }),
        S.svg("text", { class: "sm", x: x + 8, y: y + 44, text: c.s }));
      G[c.k] = g; svg.append(g);
    });
    host.append(svg);
    function pick(k, from) {
      Object.entries(G).forEach(([kk, g]) => g.setAttribute("class", "box " + (kk === k ? "s-act" : "")));
      Object.values(L).forEach((p) => p.setAttribute("class", "ln"));
      if (k === "lang") {
        L.ad.setAttribute("class", "ln s-act"); L.cd.setAttribute("class", "ln s-act");
        det.innerHTML = `<p><b>SQL</b> — не е компонент, а <dfn data-g="sql" tabindex="0">език</dfn>: това, което тече по стрелките от приложението и клиента към СУБД. Различните СУБД имат различни диалекти.</p>`;
        return;
      }
      const c = COMP.find((x) => x.k === k);
      det.innerHTML = (from ? `<p><b>${S.esc(from)}</b> → ${c.t}</p>` : "") + `<p><b>${c.t}</b> — ${c.d}</p>`;
    }
    const nm = root.querySelector("#s1-names");
    nm.append(h("span", { class: "muted", text: "Към кое принадлежи:" }));
    NAMES.forEach(([n, k]) => nm.append(h("button", { class: "btn ghost", text: n, onclick: () => pick(k, n) })));
    pick("dbms");

    /* схема и състояние */
    S.viz(root.querySelector("#v-state"), {
      id: "state", title: "Наблюдавани данни срещу правило", sub: "Вмъкваме студенти един по един. Кога name „изглежда“ като ключ?",
      code: false,
      inputs: [{ id: "rows", label: "Имена (разделени със запетая)", value: "Ana, Boris, Vera, Ana", width: "22em" }],
      presets: [{ label: "Без повторение", values: { rows: "Ana, Boris, Vera" } }, { label: "С повторение", values: { rows: "Ana, Boris, Vera, Ana" } }],
      legend: [["s-done", "нов ред"], ["s-swap", "същото име"]],
      build: algos.schema_vs_state,
      draw(st, f) {
        st.innerHTML = "";
        const rowCls = {};
        (f.hl || []).forEach((i) => (rowCls[i] = f.dup ? "s-swap" : "s-done"));
        st.append(T6.table({ name: "Student", cols: ["id", "name"], rows: f.rows.map((r) => [r.id, r.name]) }, { pk: [0], rowCls }));
      },
    });

    /* независимост */
    S.viz(root.querySelector("#v-indep"), {
      id: "indep", title: "Коя промяна стига до приложението?", sub: "Трите равнища и приложението. Червено — засегнато, зелено — непроменено.",
      code: false,
      inputs: [{ id: "change", label: "Промяна", type: "select", value: "index", options: Object.entries(CHANGES).map(([k, v]) => [k, v.t]) }],
      legend: [["s-swap", "засегнато"], ["s-done", "без промяна"]],
      build: algos.propagate,
      draw(st, f) {
        st.innerHTML = "";
        const W2 = 560, rows = [["app", "Приложения", "заявки, екрани"], ["ext", "Външно равнище", "изгледи на отделните приложения"], ["con", "Концептуално (логическо)", "релации, атрибути, ключове"], ["int", "Вътрешно (физическо)", "файлове, страници, индекси"]];
        const svg = S.svg("svg", { viewBox: `0 0 ${W2} ${rows.length * 58}`, width: W2 });
        rows.forEach(([k, t, s], i) => {
          const y = i * 58;
          if (i) svg.append(S.svg("path", { class: "ln", d: `M${W2 / 2} ${y - 14} L${W2 / 2} ${y}` }));
          svg.append(S.svg("g", { class: "box " + (f.st[k] || "") }, S.svg("rect", { x: 0, y, width: W2, height: 44, rx: 6 }),
            S.svg("text", { x: 12, y: y + 20, text: t }), S.svg("text", { class: "sm", x: 12, y: y + 37, text: s })));
        });
        st.append(h("div", { class: "t6-diag" }, svg));
      },
    });
  }

  S.chapter({ id: "subd", order: 1, num: "1", group: "Основа", title: "База от данни и СУБД", lead: "База, СУБД и приложение са различни обекти. Схема ≠ състояние. Три равнища на моделиране и независимост на данните.", html, mount, algos });
})();

</script>
<script>
/* Раздел 2 — допълнение: анатомия на релацията.
   T6.anatomy(host): речник на съответствията, интерактивна таблица с подсветка на всяко понятие,
   релацията като подмножество на декартовото произведение на домейните и проверка на домейн. */
(function () {
  const S = window.Study, h = S.h;

  Object.assign(window.GLOSSARY, {
    "схема на релация": { cat: "Релационен модел", t: "Схема на релация", en: "Relation schema (heading)", d: "Името на релацията и множеството от двойки атрибут : домейн. Записва се R(A₁:D₁, …, Aₙ:Dₙ).", more: "Схемата е постоянна; съдържанието (множеството кортежи) се променя. В SQL схемата се задава с CREATE TABLE." },
    "степен на релация": { cat: "Релационен модел", t: "Степен (арност)", en: "Degree, arity", d: "Броят на атрибутите в схемата на релацията.", more: "Релация със степен 2 е бинарна, със степен 3 — тернарна. В таблицата — броят колони." },
    "мощност на релация": { cat: "Релационен модел", t: "Мощност (кардиналност)", en: "Cardinality", d: "Броят на кортежите в релацията в даден момент.", more: "Мощността се променя при всяко вмъкване и изтриване; степента — само при промяна на схемата." },
    "стойност на атрибут": { cat: "Релационен модел", t: "Стойност на атрибут", en: "Attribute value", d: "Един елемент от домейна, записан в даден кортеж за даден атрибут.", more: "В таблицата — една клетка. В релационния модел стойността е атомарна спрямо операциите на модела." },
  });

  const DOMAINS = {
    SID: { name: "D_SID", set: "цели числа 1 … 99999", test: (v) => /^\d+$/.test(v) && +v >= 1 && +v <= 99999, sql: "INTEGER CHECK (sid BETWEEN 1 AND 99999)" },
    Name: { name: "D_Име", set: "низове с дължина 1 … 40", test: (v) => v.length >= 1 && v.length <= 40, sql: "VARCHAR(40) NOT NULL" },
    Prog: { name: "D_Програма", set: "{Информатика, КН, Математика}", test: (v) => ["Информатика", "КН", "Математика"].includes(v), sql: "VARCHAR(20) CHECK (prog IN ('Информатика','КН','Математика'))" },
    Year: { name: "D_Курс", set: "{1, 2, 3, 4}", test: (v) => ["1", "2", "3", "4"].includes(v), sql: "SMALLINT CHECK (year BETWEEN 1 AND 4)" },
  };
  const COLS = ["SID", "Name", "Prog", "Year"];
  const ROWS = [["1", "Ana", "Информатика", "2"], ["2", "Boris", "КН", "1"], ["3", "Vera", "Информатика", "3"], ["4", "Georgi", "Математика", "2"]];

  const TERMS = [
    { k: "rel", t: "Релация", g: "релация", sql: "Таблица (TABLE)", file: "Файл", d: "Цялата таблица: <b>множество</b> от кортежи с една и съща схема. Редът на кортежите не носи смисъл и няма повторения." },
    { k: "schema", t: "Схема на релацията", g: "схема на релация", sql: "Заглавие / CREATE TABLE", file: "Структура на записа", d: "Името и атрибутите с техните домейни: <span class=\"mono\">Student(SID:D_SID, Name:D_Име, Prog:D_Програма, Year:D_Курс)</span>. Не съдържа данни." },
    { k: "attr", t: "Атрибут", g: "атрибут", sql: "Колона (COLUMN)", file: "Поле", d: "Именувана характеристика. Идентифицира се по <b>име</b>, не по позиция — затова редът на колоните е без значение." },
    { k: "tuple", t: "Кортеж", g: "кортеж", sql: "Ред (ROW)", file: "Запис", d: "Един факт: по една стойност за всеки атрибут. Математически е множество от двойки атрибут–стойност." },
    { k: "value", t: "Стойност", g: "стойност на атрибут", sql: "Клетка", file: "Стойност на поле", d: "Един елемент на домейна в конкретен кортеж. Атомарна спрямо модела (1НФ)." },
    { k: "domain", t: "Домейн", g: "домейн", sql: "Тип + ограничения (CHECK, NOT NULL)", file: "Тип на полето", d: "Множеството допустими стойности на атрибута. Два атрибута могат да имат един домейн." },
    { k: "degree", t: "Степен (арност)", g: "степен на релация", sql: "Брой колони", file: "Брой полета", d: "Броят атрибути. Тук: 4. Променя се само при промяна на схемата." },
    { k: "card", t: "Мощност (кардиналност)", g: "мощност на релация", sql: "Брой редове", file: "Брой записи", d: "Броят кортежи сега. Тук: 4. Променя се при всяко INSERT / DELETE." },
    { k: "key", t: "Ключ", g: "кандидатен ключ", sql: "PRIMARY KEY / UNIQUE", file: "Ключово поле", d: "Минимално множество атрибути, по което кортежите се различават. Тук: {SID}." },
  ];

  function anatomy(host) {
    host.innerHTML = "";
    let sel = "rel", selRow = 1, selCol = 2;

    /* --- съответствия --- */
    const corr = h("table", { class: "t" }, h("tr", null, ...["Релационен модел (математически)", "SQL", "Файлова / практическа", "Какво означава"].map((x) => h("th", { text: x }))));
    TERMS.forEach((T) => corr.append(h("tr", { "data-k": T.k, style: { cursor: "pointer" }, onclick: () => pick(T.k) },
      h("td", null, h("dfn", { "data-g": T.g, tabindex: "0", text: T.t })), h("td", { text: T.sql }), h("td", { text: T.file }), h("td", { html: T.d }))));

    /* --- интерактивна таблица --- */
    const btns = h("div", { class: "row" });
    const bmap = {};
    TERMS.forEach((T) => { const b = h("button", { class: "btn", type: "button", "aria-pressed": "false", onclick: () => pick(T.k), text: T.t }); bmap[T.k] = b; btns.append(b); });
    const stage = h("div", { style: { display: "grid", gap: "10px", minWidth: "0" } });
    const expl = h("div", { class: "key" });

    function pick(k) { sel = k; draw(); }

    function draw() {
      Object.entries(bmap).forEach(([k, b]) => b.setAttribute("aria-pressed", k === sel ? "true" : "false"));
      corr.querySelectorAll("tr[data-k]").forEach((tr) => (tr.style.background = tr.dataset.k === sel ? "var(--accent-soft)" : ""));
      stage.innerHTML = "";
      const tb = h("table", { class: "t grid t6", style: { fontSize: ".95rem" } });
      const relCls = sel === "rel" ? "s-act" : "";
      // заглавие (схема)
      const hr = h("tr");
      COLS.forEach((c, j) => {
        let cls = "";
        if (sel === "schema" || sel === "degree") cls = "s-piv";
        if ((sel === "attr" || sel === "domain") && j === selCol) cls = "s-act";
        if (sel === "key" && j === 0) cls = "s-done";
        if (sel === "value" && j === selCol) cls = "s-cmp";
        const th = h("th", { class: cls, style: { cursor: "pointer" }, title: "Избери атрибут", onclick: () => { selCol = j; if (!["attr", "domain", "value"].includes(sel)) sel = "attr"; draw(); } }, c);
        if (sel === "degree") th.append(h("div", { class: "mono", style: { fontSize: ".7rem" }, text: `#${j + 1}` }));
        hr.append(th);
      });
      tb.append(hr);
      ROWS.forEach((r, i) => {
        const tr = h("tr", { style: { cursor: "pointer" }, onclick: () => { selRow = i; if (!["tuple", "value"].includes(sel)) sel = "tuple"; draw(); } });
        r.forEach((v, j) => {
          let cls = relCls;
          if (sel === "tuple" && i === selRow) cls = "s-act";
          if ((sel === "attr") && j === selCol) cls = "s-act";
          if (sel === "domain" && j === selCol) cls = "s-cmp";
          if (sel === "value" && i === selRow && j === selCol) cls = "s-act";
          if (sel === "value" && (i === selRow) !== (j === selCol)) cls = "s-dim";
          if (sel === "key" && j === 0) cls = "s-done";
          if (sel === "card") cls = "s-cmp";
          tr.append(h("td", { class: cls, onclick: (e) => { if (sel === "value") { e.stopPropagation(); selRow = i; selCol = j; draw(); } } }, v));
        });
        if (sel === "card") tr.append(h("td", { class: "mono muted", style: { border: "none", background: "transparent" }, text: `${i + 1}` }));
        tb.append(tr);
      });
      const tblBox = h("div", { class: "tbl-wrap" }, tb);
      const side = h("div", { style: { display: "grid", gap: "6px", alignContent: "start", minWidth: "0" } });
      const T = TERMS.find((x) => x.k === sel);
      if (sel === "tuple") {
        const r = ROWS[selRow];
        side.append(h("span", { class: "eyebrow", text: "Кортежът математически" }),
          h("div", { class: "mono", text: `⟨${r.join(", ")}⟩` }),
          h("div", { class: "mono", style: { fontSize: ".85rem" }, text: "{ " + COLS.map((c, j) => `${c}: ${r[j]}`).join(", ") + " }" }),
          h("p", { class: "muted", style: { fontSize: ".85rem" }, text: "Вторият запис е по-точен: стойността е свързана с името на атрибута, затова редът на колоните не е част от кортежа." }));
      } else if (sel === "attr" || sel === "domain") {
        const c = COLS[selCol], D = DOMAINS[c];
        const vals = [...new Set(ROWS.map((r) => r[selCol]))];
        side.append(h("span", { class: "eyebrow", text: sel === "attr" ? `Атрибут ${c}` : `Домейн на ${c}` }),
          h("div", null, h("b", { text: D.name + " = " }), h("span", { class: "mono", text: D.set })),
          h("div", null, "Стойности, които се срещат сега: ", h("span", { class: "mono", text: "{" + vals.join(", ") + "}" })),
          h("div", { class: "muted", style: { fontSize: ".85rem" } }, "В SQL: ", h("code", { text: D.sql })),
          h("p", { class: "muted", style: { fontSize: ".85rem" }, text: "Домейнът е всичко допустимо, не само използваното. Срещаните стойности са подмножество на домейна." }));
      } else if (sel === "value") {
        side.append(h("span", { class: "eyebrow", text: "Стойност" }),
          h("div", null, h("span", { class: "mono", text: `${COLS[selCol]} = ${ROWS[selRow][selCol]}` }), ` в кортежа с SID = ${ROWS[selRow][0]}`),
          h("div", { class: "muted", style: { fontSize: ".85rem" } }, `∈ ${DOMAINS[COLS[selCol]].name} = ${DOMAINS[COLS[selCol]].set}`));
      } else if (sel === "degree") side.append(h("span", { class: "eyebrow", text: "Степен" }), h("div", { class: "t6-res", text: `степен = ${COLS.length} (кватернарна релация)` }));
      else if (sel === "card") side.append(h("span", { class: "eyebrow", text: "Мощност" }), h("div", { class: "t6-res", text: `мощност = ${ROWS.length}` }), h("p", { class: "muted", style: { fontSize: ".85rem" }, text: "Добави ред в долния пример за домейни — мощността расте, степента остава 4." }));
      else if (sel === "schema") side.append(h("span", { class: "eyebrow", text: "Схема" }), h("div", { class: "mono", style: { fontSize: ".85rem" }, text: "Student(SID: D_SID, Name: D_Име, Prog: D_Програма, Year: D_Курс)" }));
      else if (sel === "key") side.append(h("span", { class: "eyebrow", text: "Ключ" }), h("div", { class: "mono", text: "{SID}" }), h("p", { class: "muted", style: { fontSize: ".85rem" }, text: "{SID, Name} също различава кортежите, но не е минимално — то е суперключ, не кандидатен ключ." }));
      else side.append(h("span", { class: "eyebrow", text: "Релация" }), h("div", { class: "mono", text: "Student = { " + ROWS.map((r) => "⟨" + r.join(", ") + "⟩").join(", ") + " }" }));
      stage.append(h("div", { class: "split" }, tblBox, side));
      expl.innerHTML = `<b>${T.t}</b> — SQL: ${T.sql}. ${T.d}`;
    }

    /* --- декартово произведение --- */
    const D1 = ["Ana", "Boris", "Vera"], D2 = ["БД", "ОС", "Мрежи"];
    const chosen = new Set(["Ana|БД", "Ana|ОС", "Boris|БД", "Vera|Мрежи"]);
    const prodBox = h("div", { style: { display: "grid", gap: "10px", minWidth: "0" } });
    function drawProd() {
      prodBox.innerHTML = "";
      const g = h("table", { class: "t grid t6" }, h("tr", null, h("th", { text: "D_Студент × D_Курс" }), ...D2.map((c) => h("th", { text: c }))));
      D1.forEach((s) => g.append(h("tr", null, h("th", { text: s }), ...D2.map((c) => {
        const k = s + "|" + c, on = chosen.has(k);
        return h("td", { class: on ? "s-done" : "", style: { cursor: "pointer" }, title: "Включи / изключи кортежа", onclick: () => { on ? chosen.delete(k) : chosen.add(k); drawProd(); } }, on ? "✓" : "·");
      }))));
      const rel = { name: `Enroll ⊆ D_Студент × D_Курс  ·  мощност ${chosen.size} от ${D1.length * D2.length}`, cols: ["Студент", "Курс"], rows: [...chosen].sort().map((k) => k.split("|")) };
      prodBox.append(h("div", { class: "split" }, h("div", { style: { display: "grid", gap: "6px", minWidth: "0" } },
        h("span", { class: "eyebrow", text: `Декартово произведение: ${D1.length} × ${D2.length} = ${D1.length * D2.length} възможни кортежа` }), h("div", { class: "tbl-wrap" }, g),
        h("span", { class: "muted", style: { fontSize: ".85rem" }, text: "Щракни клетка, за да включиш или изключиш кортежа." })), window.T6.table(rel)));
    }

    /* --- проверка на домейн --- */
    const rowsDom = ROWS.map((r) => r.slice());
    const inputs = COLS.map((c, j) => h("input", { type: "text", id: "anat-in-" + c, value: ["5", "Dimitar", "Физика", "2"][j], "aria-label": c, style: { width: j === 1 ? "8em" : j === 2 ? "9em" : "5em" } }));
    const domMsg = h("div", { class: "viz-msg" });
    const domTbl = h("div");
    function drawDom() { domTbl.innerHTML = ""; domTbl.append(window.T6.table({ name: `Student · степен ${COLS.length} · мощност ${rowsDom.length}`, cols: COLS, rows: rowsDom }, { pk: [0] })); }
    const addBtn = h("button", { class: "btn primary", type: "button", text: "INSERT", onclick: () => {
      const vals = inputs.map((x) => x.value.trim());
      const bad = COLS.map((c, j) => (DOMAINS[c].test(vals[j]) ? null : `${c} = „${vals[j]}“ ∉ ${DOMAINS[c].name} ${DOMAINS[c].set}`)).filter(Boolean);
      if (!bad.length && rowsDom.some((r) => r[0] === vals[0])) bad.push(`SID = ${vals[0]} вече съществува — нарушен ключ`);
      if (bad.length) { domMsg.innerHTML = `<div class="warn"><b>Отказано.</b> ${bad.map(S.esc).join("; ")}.</div>`; return; }
      rowsDom.push(vals); drawDom(); domMsg.innerHTML = `<div><b>Вмъкнато.</b> Мощността стана ${rowsDom.length}; степента остава ${COLS.length}.</div>`;
    } });

    host.append(
      h("h3", { text: "Анатомия на релацията" }),
      h("p", { class: "prose", html: "Едни и същи неща имат три имена: в релационната теория, в SQL и в практиката с файлове. Щракни понятие — съответната част на таблицата се подсвечва. Щракането върху ред или колона също избира." }),
      h("div", { class: "tbl-wrap" }, corr),
      h("div", { class: "viz", style: { padding: "12px 14px", display: "grid", gap: "12px" } }, btns, stage, expl),
      h("h3", { text: "Релацията е подмножество на декартовото произведение" }),
      h("p", { class: "prose", html: "Декартовото произведение на домейните изброява <b>всички възможни</b> кортежи. Релацията избира онези от тях, които са <b>верни факти</b> в предметната област. Затова мощността ѝ е най-много произведението от мощностите на домейните." }),
      h("div", { class: "viz", style: { padding: "12px 14px" } }, prodBox),
      h("div", { class: "key" }, h("b", { text: "Формално" }), h("p", { class: "formula", text: "R ⊆ D₁ × D₂ × … × Dₙ ;  степен = n ;  мощност = |R| ≤ |D₁|·|D₂|·…·|Dₙ|" })),
      h("h3", { text: "Домейнът ограничава стойностите" }),
      h("p", { class: "prose", text: "Опитай да вмъкнеш кортеж. СУБД проверява всяка стойност срещу домейна на атрибута (в SQL — тип и CHECK) и ключа." }),
      h("div", { class: "viz", style: { padding: "12px 14px", display: "grid", gap: "10px" } },
        h("div", { class: "row" }, ...inputs.map((x, j) => h("label", { class: "field" }, h("span", { text: COLS[j] + " ∈ " + DOMAINS[COLS[j]].name }), x)), addBtn,
          h("button", { class: "btn ghost", type: "button", text: "Валиден пример", onclick: () => { ["5", "Dimitar", "КН", "4"].forEach((v, j) => (inputs[j].value = v)); } })),
        domMsg, domTbl),
      h("details", { class: "trap" }, h("summary", { text: "Капан: „релация“ = „връзка между таблици“" }), h("div", null, h("p", { html: "Не. Релацията е <b>самата таблица</b> — множеството кортежи. Връзката между два вида обекти (студент–програма) е предметна връзка (relationship), която в релационния модел се представя чрез външен ключ или чрез отделна релация." }))),
      h("details", { class: "trap" }, h("summary", { text: "Капан: „домейнът са стойностите в колоната“" }), h("div", null, h("p", { text: "Не. Домейнът е множеството на допустимите стойности. Ако никой студент не е от „Математика“, тя пак е в домейна — може да бъде вмъкната." }))),
    );
    draw(); drawProd(); drawDom();
  }

  window.T6.anatomy = anatomy;
})();

</script>
<script>
/* Раздел 2 — Релационен модел (глава 2): релация, атрибут, кортеж, домейн, ключове,
   външен ключ, референтна цялост, NULL. */
(function () {
  const S = window.Study, h = S.h;

  const BASE = "+P INF Informatika; +P MAT Matematika; +S 1 Ana INF; +S 2 Boris MAT; +S 3 Vera NULL; +C C1 Bazi; +C C2 Algoritmi; +E 1 C1 6; +E 1 C2 5; +E 2 C1 4";
  const RULES = { RESTRICT: 0, CASCADE: 1, "SET NULL": 2 };

  /* ---------- чиста симулация (същата като c/02_relmodel.c, включително реда на редовете) ---------- */
  function newDb() { return { p: [], s: [], c: [], e: [] }; }
  function clone(db) { return { p: db.p.map((x) => ({ ...x })), s: db.s.map((x) => ({ ...x })), c: db.c.map((x) => ({ ...x })), e: db.e.map((x) => ({ ...x })) }; }
  const W = 15, cut = (x) => String(x).slice(0, W);

  function parseScript(txt) {
    const cmds = [];
    String(txt).split(";").forEach((raw) => {
      const p = raw.trim().split(/\s+/).filter(Boolean);
      if (!p.length) return;
      if (cmds.length >= 40) throw new Error("Най-много 40 команди.");
      cmds.push({ raw: raw.trim(), op: p[0], a: cut(p[1] || ""), b: p[2] === "NULL" ? "" : cut(p[2] || ""), c: p[3] === "NULL" ? "" : cut(p[3] || ""), n: p.length });
    });
    return cmds;
  }

  /* C atoi: водещо цяло число или 0 */
  const atoi = (s) => { const m = /^\s*([+-]?\d+)/.exec(s); return m ? parseInt(m[1], 10) : 0; };

  function exec(db, cmd, rule, F, snap) {
    const step = (at, msg, extra) => F && F.push(snap(db, { at, msg, cmd: cmd.raw, ...extra }));
    const fail = (at, why, extra) => { step(at, `<b>Отказ.</b> ${why}`, { bad: true, ...extra, log: `✗ ${cmd.raw} — ${why}` }); return why; };
    const findS = (sid) => db.s.findIndex((x) => x.sid === sid);
    const findP = (pid) => db.p.findIndex((x) => x.pid === pid);
    const findC = (cid) => db.c.findIndex((x) => x.cid === cid);

    function delStudent(sid, rule, inner) {
      const k = findS(sid);
      if (k < 0) return fail("d_none", "Няма такъв студент.");
      const refs = db.e.filter((x) => x.sid === sid).length;
      if (!inner) step("d_scan", `Търсим записвания, които сочат към студент ${sid}: <b>${refs}</b>.`, { tab: "e", hlE: db.e.map((x, i) => (x.sid === sid ? i : -1)).filter((i) => i >= 0) });
      if (refs > 0 && rule === 0) return fail("d_restrict", "RESTRICT: има записвания, които сочат към студента.", { tab: "e" });
      if (refs > 0 && rule === 2) return fail("d_setnull_pk", "SET NULL е невъзможно: Enrollment.sid е част от първичния ключ и не допуска NULL.", { tab: "e" });
      db.e = db.e.filter((x) => x.sid !== sid);
      if (refs) step("d_cascade", `CASCADE: изтрити са ${refs} записвания на студент ${sid}.`, { tab: "e" });
      db.s[k] = db.s[db.s.length - 1]; db.s.pop();
      if (!inner) step("d_ok", `Студент ${sid} е изтрит.`, { ok: true, tab: "s", log: `✓ ${cmd.raw}` });
      return null;
    }

    switch (cmd.op) {
      case "+P": {
        if (!cmd.a || !cmd.b) return fail(null, "NOT NULL: pid и pname са задължителни.", { tab: "p" });
        if (findP(cmd.a) >= 0) return fail(null, `PK: вече има специалност ${cmd.a}.`, { tab: "p", hlP: [findP(cmd.a)] });
        db.p.push({ pid: cmd.a, pname: cmd.b });
        step(null, `Специалност ${cmd.a} е добавена.`, { ok: true, tab: "p", log: `✓ ${cmd.raw}` });
        return null;
      }
      case "+C": {
        if (!cmd.a || !cmd.b) return fail(null, "NOT NULL: cid и title са задължителни.", { tab: "c" });
        if (findC(cmd.a) >= 0) return fail(null, `PK: вече има дисциплина ${cmd.a}.`, { tab: "c", hlC: [findC(cmd.a)] });
        db.c.push({ cid: cmd.a, title: cmd.b });
        step(null, `Дисциплина ${cmd.a} е добавена.`, { ok: true, tab: "c", log: `✓ ${cmd.raw}` });
        return null;
      }
      case "+S": {
        const { a: sid, b: name, c: pid } = cmd;
        step("s_null", `NOT NULL: sid = ${sid || "NULL"}, name = ${name || "NULL"}.`, { tab: "s" });
        if (!sid || !name) return fail("s_null", "NOT NULL: sid и name са задължителни.", { tab: "s" });
        const k = findS(sid);
        step("s_pk", `PK: има ли вече студент с sid = ${sid}? ${k >= 0 ? "<b>да</b>" : "не"}.`, { tab: "s", hlS: k >= 0 ? [k] : [] });
        if (k >= 0) return fail("s_pk", "PK: вече има студент с този sid. Първичният ключ трябва да е уникален.", { tab: "s", hlS: [k] });
        if (pid) {
          const j = findP(pid);
          step("s_fk", `FK: pid = ${pid} трябва да съществува в Programme. ${j >= 0 ? "Съществува." : "<b>Не съществува.</b>"}`, { tab: "p", hlP: j >= 0 ? [j] : [] });
          if (j < 0) return fail("s_fk", `FK: няма специалност ${pid}. Референтната цялост не допуска висяща препратка.`, { tab: "p" });
        } else step("s_fk", "FK: pid е NULL — Student.pid допуска NULL, затова няма препратка за проверка.", { tab: "s" });
        db.s.push({ sid, name, pid });
        step("s_ok", `Студент (${sid}, ${name}, ${pid || "NULL"}) е вмъкнат.`, { ok: true, tab: "s", hlS: [db.s.length - 1], log: `✓ ${cmd.raw}` });
        return null;
      }
      case "+E": {
        const { a: sid, b: cid } = cmd;
        const g = cmd.n >= 4 ? atoi(cmd.c) : 0;
        step("e_dom", `Домейн: grade = ${g} ∈ {2..6}? ${g >= 2 && g <= 6 ? "да" : "<b>не</b>"}.`, { tab: "e" });
        if (g < 2 || g > 6) return fail("e_dom", "Домейн: оценката е цяло число от 2 до 6.", { tab: "e" });
        if (!sid || !cid) return fail("e_null", "NOT NULL: колоните на първичния ключ не допускат NULL.", { tab: "e" });
        const dup = db.e.findIndex((x) => x.sid === sid && x.cid === cid);
        step("e_pk", `PK(sid, cid): има ли вече (${sid}, ${cid})? ${dup >= 0 ? "<b>да</b>" : "не"}.`, { tab: "e", hlE: dup >= 0 ? [dup] : [] });
        if (dup >= 0) return fail("e_pk", "PK: двойката (sid, cid) вече съществува — по предпоставката има една оценка на двойка.", { tab: "e", hlE: [dup] });
        const ks = findS(sid);
        step("e_fk1", `FK sid → Student: ${ks >= 0 ? "съществува" : "<b>не съществува</b>"}.`, { tab: "s", hlS: ks >= 0 ? [ks] : [] });
        if (ks < 0) return fail("e_fk1", `FK: няма студент ${sid}.`, { tab: "s" });
        const kc = findC(cid);
        step("e_fk2", `FK cid → Course: ${kc >= 0 ? "съществува" : "<b>не съществува</b>"}.`, { tab: "c", hlC: kc >= 0 ? [kc] : [] });
        if (kc < 0) return fail("e_fk2", `FK: няма дисциплина ${cid}.`, { tab: "c" });
        db.e.push({ sid, cid, grade: g });
        step("e_ok", `Записване (${sid}, ${cid}, ${g}) е вмъкнато.`, { ok: true, tab: "e", hlE: [db.e.length - 1], log: `✓ ${cmd.raw}` });
        return null;
      }
      case "-S": return delStudent(cmd.a, rule, false);
      case "-P": {
        const pid = cmd.a, k = findP(pid);
        if (k < 0) return fail("p_none", "Няма такава специалност.", { tab: "p" });
        const refs = db.s.filter((x) => x.pid === pid).length;
        step("p_scan", `Студенти със Student.pid = ${pid}: <b>${refs}</b>.`, { tab: "s", hlS: db.s.map((x, i) => (x.pid === pid ? i : -1)).filter((i) => i >= 0) });
        if (refs > 0 && rule === 0) return fail("p_restrict", "RESTRICT: има студенти от тази специалност.", { tab: "s" });
        for (let i = 0; i < db.s.length; i++) {
          if (db.s[i].pid !== pid) continue;
          if (rule === 2) { db.s[i].pid = ""; step("p_setnull", `SET NULL: студент ${db.s[i].sid} остава без специалност (pid = NULL).`, { tab: "s", hlS: [i] }); }
          else { const sid = db.s[i].sid; delStudent(sid, 1, true); step("p_cascade", `CASCADE: изтрит е студент ${sid} заедно с неговите записвания.`, { tab: "s" }); i--; }
        }
        db.p[k] = db.p[db.p.length - 1]; db.p.pop();
        step("p_ok", `Специалност ${pid} е изтрита.`, { ok: true, tab: "p", log: `✓ ${cmd.raw}` });
        return null;
      }
      case "-C": {
        const cid = cmd.a, k = findC(cid);
        if (k < 0) return fail(null, "Няма такава дисциплина.", { tab: "c" });
        const refs = db.e.filter((x) => x.cid === cid).length;
        if (refs > 0 && rule === 0) return fail(null, "RESTRICT: има записвания за дисциплината.", { tab: "e" });
        if (refs > 0 && rule === 2) return fail(null, "SET NULL е невъзможно: Enrollment.cid е част от първичния ключ.", { tab: "e" });
        db.e = db.e.filter((x) => x.cid !== cid);
        db.c[k] = db.c[db.c.length - 1]; db.c.pop();
        step(null, `Дисциплина ${cid} е изтрита${refs ? ` (CASCADE: и ${refs} записвания)` : ""}.`, { ok: true, tab: "c", log: `✓ ${cmd.raw}` });
        return null;
      }
      default: return fail(null, `Непозната команда „${S.esc(cmd.op)}“. Използвай +P +S +C +E -P -S -C.`);
    }
  }

  const algos = {
    run_script({ script, rule, base }) {
      const r = RULES[rule];
      if (r === undefined) throw new Error("Непознато правило при изтриване.");
      const db = newDb();
      if (base !== false && base !== "false") for (const c of parseScript(BASE)) exec(db, c, r, null);
      const cmds = parseScript(script);
      if (!cmds.length) throw new Error("Въведи поне една команда, напр. „+E 1 C1 5“.");
      const F = [], res = [];
      const snap = (d, o) => ({ db: clone(d), ...o });
      F.push(snap(db, { msg: `Начално състояние${base === false || base === "false" ? " (празна база)" : " (примерните данни)"}. Правило при изтриване: <b>${rule}</b>.` }));
      for (const c of cmds) {
        const err = exec(db, c, r, F, snap);
        res.push(err ? "err" : "ok");
      }
      const nn = db.s.filter((x) => !x.pid).length;
      F.push(snap(db, { done: true, msg: `Край: ${res.filter((x) => x === "ok").length} приети, ${res.filter((x) => x === "err").length} отказани команди.` }));
      return { frames: F, result: res.join(" "), counts: [db.p.length, db.s.length, db.c.length, db.e.length].join(" "), nullpid: nn, db };
    },
    BASE,

<script>
/* Раздел 3 — Релационна алгебра (глава 3, първа част): σ, π, ×, ⋈, ∪, −, ∩. */
(function () {
  const S = window.Study, h = S.h;

  /* ---------- разбор ---------- */
  function parseRel(txt, name) {
    const segs = String(txt).split("|").map((s) => s.trim());
    if (!segs[0]) throw new Error(`${name}: липсва схема. Формат: „A B C|1 x p|2 y q“.`);
    const cols = segs[0].split(/\s+/).filter(Boolean);
    if (cols.length > 8) throw new Error(`${name}: най-много 8 атрибута.`);
    if (new Set(cols).size !== cols.length) throw new Error(`${name}: повторено име на атрибут.`);
    cols.forEach((c) => { if (c.length > 12) throw new Error(`${name}: името „${c}“ е по-дълго от 12 знака.`); });
    const rows = [];
    segs.slice(1).filter(Boolean).forEach((s, i) => {
      const v = s.split(/\s+/).filter(Boolean);
      if (v.length !== cols.length) throw new Error(`${name}: ред ${i + 1} има ${v.length} стойности, а схемата — ${cols.length} атрибута.`);
      v.forEach((x) => { if (x.length > 15) throw new Error(`${name}: стойността „${x}“ е по-дълга от 15 знака.`); });
      if (rows.some((r) => r.join("\u0001") === v.join("\u0001"))) throw new Error(`${name}: ред (${v.join(", ")}) се повтаря — релацията е множество.`);
      rows.push(v);
    });
    if (rows.length > 8) throw new Error(`${name}: най-много 8 реда (за да е видимо стъпка по стъпка).`);
    return { name, cols, rows };
  }
  const isInt = (s) => /^-?\d+$/.test(s);
  function testCond(x, op, val) {
    const c = isInt(x) && isInt(val) ? parseInt(x, 10) - parseInt(val, 10) : x < val ? -1 : x > val ? 1 : 0;
    return { "=": c === 0, "!=": c !== 0, "<": c < 0, ">": c > 0, "<=": c <= 0, ">=": c >= 0 }[op];
  }
  const rowEq = (a, b) => a.length === b.length && a.every((v, j) => v === b[j]);
  const tup = (r) => "(" + r.join(", ") + ")";

  /* ---------- алгоритми (огледало на c/03_algebra.c, със същите броячи) ---------- */
  const algos = {
    parseRel, testCond,

    run({ op, R, S: Sx, cond, cols, bag }) {
      const A = parseRel(R, "R");
      const F = [];
      let cmp = 0;
      const out = { cols: [], rows: [] };
      const snap = (o) => ({ A, B: o.B || null, out: { cols: out.cols.slice(), rows: out.rows.map((r) => r.slice()) }, stats: { сравнения: cmp, "редове в резултата": out.rows.length }, ...o });
      const contains = (rel, row) => { for (let k = 0; k < rel.length; k++) { cmp++; if (rowEq(row, rel[k])) return k; } return -1; };

      if (op === "sel") {
        const m = /^\s*(\S+)\s*(<=|>=|!=|=|<|>)\s*(\S+)\s*$/.exec(String(cond));
        if (!m) throw new Error("Условие във вида „атрибут оп стойност“, напр. „pid = INF“ или „grade >= 5“.");
        const [, an, o, val] = m;
        const j = A.cols.indexOf(an);
        if (j < 0) throw new Error(`R няма атрибут „${an}“.`);
        out.cols = A.cols.slice();
        const sql = `SELECT *\nFROM R\nWHERE ${an} ${o === "!=" ? "<>" : o} ${isInt(val) ? val : "'" + val + "'"};`;
        F.push(snap({ at: "sel_init", sql, msg: `σ<sub>${S.esc(an)} ${S.esc(o)} ${S.esc(val)}</sub>(R): схемата на резултата е същата като на R.` }));
        A.rows.forEach((r, i) => {
          cmp++;
          const ok = testCond(r[j], o, val);
          F.push(snap({ at: ["sel_loop", "sel_test"], sql, ai: i, aj: j, aok: ok, msg: `Ред ${i + 1}: ${an} = ${S.esc(r[j])}; ${S.esc(r[j])} ${S.esc(o)} ${S.esc(val)} → <b>${ok}</b>.${isInt(r[j]) && isInt(val) ? " (числово сравнение)" : " (сравнение като низове)"}` }));
          if (ok) { out.rows.push(r.slice()); F.push(snap({ at: "sel_keep", sql, ai: i, aok: true, oi: out.rows.length - 1, msg: `Запазваме ${S.esc(tup(r))}.`, log: `σ: ${tup(r)}` })); }
        });
        F.push(snap({ sql, done: true, msg: `Резултат: ${out.rows.length} от ${A.rows.length} реда. Селекцията избира <b>редове</b>; колоните остават.` }));
      } else if (op === "proj") {
        const names = String(cols).split(/[\s,]+/).filter(Boolean);
        if (!names.length) throw new Error("Посочи поне един атрибут за проекцията.");
        const idx = names.map((n) => { const j = A.cols.indexOf(n); if (j < 0) throw new Error(`R няма атрибут „${n}“.`); return j; });
        out.cols = idx.map((j) => A.cols[j]);
        const isBag = bag === true || bag === "true";
        const sql = `SELECT ${isBag ? "" : "DISTINCT "}${names.join(", ")}\nFROM R;`;
        F.push(snap({ at: "pr_init", sql, pcols: idx, msg: `π<sub>${S.esc(names.join(", "))}</sub>(R)${isBag ? " — режим SQL без DISTINCT (мултимножество)" : ""}.` }));
        A.rows.forEach((r, i) => {
          const cand = idx.map((j) => r[j]);
          F.push(snap({ at: ["pr_loop", "pr_build"], sql, ai: i, pcols: idx, msg: `Ред ${i + 1}: кандидат ${S.esc(tup(cand))}.` }));
          if (!isBag) {
            const k = contains(out.rows, cand);
            if (k >= 0) { F.push(snap({ at: ["pr_dup", "pr_skip"], sql, ai: i, pcols: idx, oi: k, dup: true, msg: `${S.esc(tup(cand))} вече е в резултата (ред ${k + 1}) — като множество не го добавяме.`, log: `π: ${tup(cand)} повтаря се` })); return; }
          }
          out.rows.push(cand);
          F.push(snap({ at: ["pr_dup", "pr_keep"], sql, ai: i, pcols: idx, oi: out.rows.length - 1, msg: `Добавяме ${S.esc(tup(cand))}.`, log: `π: ${tup(cand)}` }));
        });
        F.push(snap({ sql, done: true, pcols: idx, msg: isBag ? `SQL без DISTINCT пази ${out.rows.length} реда, включително повторенията.` : `Резултат: ${out.rows.length} различни кортежа. Проекцията избира <b>колони</b> и като операция над множества премахва повторенията.` }));
      } else {
        const B = parseRel(Sx, "S");
        if (op === "prod") {
          out.cols = A.cols.map((c) => (B.cols.includes(c) ? "R." + c : c)).concat(B.cols.map((c) => (A.cols.includes(c) ? "S." + c : c)));
          const sql = "SELECT *\nFROM R CROSS JOIN S;";
          F.push(snap({ B, at: "px_init", sql, msg: `R × S: ${A.rows.length} · ${B.rows.length} = <b>${A.rows.length * B.rows.length}</b> реда, ${out.cols.length} колони. Общите имена получават префикс.` }));
          A.rows.forEach((r, i) => B.rows.forEach((s, k) => {
            cmp++;
            out.rows.push(r.concat(s));
            F.push(snap({ B, at: ["px_inner", "px_emit"], sql, ai: i, bi: k, oi: out.rows.length - 1, msg: `${S.esc(tup(r))} × ${S.esc(tup(s))}.`, log: `×: ${tup(r.concat(s))}` }));
          }));
          F.push(snap({ B, sql, done: true, msg: "Всеки ред на R с всеки ред на S — без условие. Повечето комбинации нямат смисъл; затова съединението добавя условие." }));
        } else if (op === "join") {
          const common = B.cols.filter((c) => A.cols.includes(c));
          const extra = B.cols.map((c, k) => k).filter((k) => !A.cols.includes(B.cols[k]));
          out.cols = A.cols.concat(extra.map((k) => B.cols[k]));
          const sql = common.length ? `SELECT *\nFROM R NATURAL JOIN S;\n-- същото като:\n-- SELECT R.*, ${extra.map((k) => "S." + B.cols[k]).join(", ") || "…"}\n-- FROM R JOIN S ON ${common.map((c) => "R." + c + " = S." + c).join(" AND ")};` : "SELECT *\nFROM R NATURAL JOIN S;  -- няма общи атрибути => R × S";
          F.push(snap({ B, at: "j_init", sql, jc: common, msg: common.length ? `R ⋈ S по общите атрибути: <b>${S.esc(common.join(", "))}</b>. Вложени цикли: всяка двойка редове се проверява.` : "Няма общи атрибути — естественото съединение се свежда до декартово произведение." }));
          A.rows.forEach((r, i) => B.rows.forEach((s, k) => {
            cmp++;
            const bad = common.find((c) => r[A.cols.indexOf(c)] !== s[B.cols.indexOf(c)]);
            const ok = bad === undefined;
            F.push(snap({ B, at: ["j_inner", "j_test"], sql, jc: common, ai: i, bi: k, aok: ok, msg: common.length ? `${S.esc(tup(r))} и ${S.esc(tup(s))}: ${common.map((c) => `${c}: ${S.esc(r[A.cols.indexOf(c)])} ${r[A.cols.indexOf(c)] === s[B.cols.indexOf(c)] ? "=" : "≠"} ${S.esc(s[B.cols.indexOf(c)])}`).join("; ")} → <b>${ok ? "съвпадат" : "не съвпадат"}</b>.` : "Без общи атрибути — всяка двойка съвпада." }));
            if (ok) {
              const row = r.concat(extra.map((e) => s[e]));
              out.rows.push(row);
              F.push(snap({ B, at: "j_emit", sql, jc: common, ai: i, bi: k, aok: true, oi: out.rows.length - 1, msg: `Добавяме ${S.esc(tup(row))}.`, log: `⋈: ${tup(row)}` }));
            }
          }));
          F.push(snap({ B, sql, jc: common, done: true, msg: `Резултат: ${out.rows.length} реда при ${cmp} проверени двойки. Логически: ⋈ = π(σ(R × S)). Реалната СУБД може да избере друг алгоритъм (хеш, сливане, индекс) със същия резултат.` }));
        } else if (op === "union" || op === "diff" || op === "inter") {
          if (A.cols.length !== B.cols.length || A.cols.some((c, j) => c !== B.cols[j]))
            throw new Error(`Схемите не са съвместими: R(${A.cols.join(", ")}) и S(${B.cols.join(", ")}). Обединение, разлика и сечение изискват еднакви атрибути.`);
          out.cols = A.cols.slice();
          const sym = { union: "∪", diff: "−", inter: "∩" }[op];
          const sql = `SELECT * FROM R\n${{ union: "UNION", diff: "EXCEPT", inter: "INTERSECT" }[op]}\nSELECT * FROM S;`;
          F.push(snap({ B, at: ["so_compat", "so_init"], sql, msg: `R ${sym} S. Схемите са съвместими: (${S.esc(A.cols.join(", "))}).` }));
          A.rows.forEach((r, i) => {
            const k = contains(B.rows, r);
            const inS = k >= 0;
            const keep = op === "union" || (op === "diff" && !inS) || (op === "inter" && inS);
            F.push(snap({ B, at: ["so_r", "so_probe"], sql, ai: i, bi: inS ? k : null, aok: keep, msg: `${S.esc(tup(r))} от R ${inS ? "<b>е</b>" : "<b>не е</b>"} в S → ${keep ? "влиза" : "не влиза"} в резултата.` }));
            if (keep && contains(out.rows, r) < 0) {
              out.rows.push(r.slice());
              F.push(snap({ B, at: "so_keep", sql, ai: i, aok: true, oi: out.rows.length - 1, msg: `Добавяме ${S.esc(tup(r))}.`, log: `${sym}: ${tup(r)}` }));
            }
          });
          if (op === "union") B.rows.forEach((s, k) => {
            const has = contains(out.rows, s) >= 0;
            F.push(snap({ B, at: "so_s", sql, bi: k, aok: !has, msg: `${S.esc(tup(s))} от S ${has ? "вече е в резултата — повторение не се добавя" : "е нов"}.` }));
            if (!has) { out.rows.push(s.slice()); F.push(snap({ B, at: "so_add", sql, bi: k, aok: true, oi: out.rows.length - 1, msg: `Добавяме ${S.esc(tup(s))}.`, log: `∪: ${tup(s)}` })); }
          });
          F.push(snap({ B, sql, done: true, msg: `Резултат: ${out.rows.length} реда. Като множества: без повторения. (В SQL: UNION премахва дубликати, UNION ALL — не.)` }));
        } else throw new Error("Непозната операция.");
      }
      return { frames: F, rows: out.rows, cols: out.cols, cmp };
    },
  };

  /* ---------- съдържание ---------- */
  const html = `
<div class="prose">
  <p><dfn data-g="селекция">Селекцията</dfn> избира кортежи по условие, а <dfn data-g="проекция">проекцията</dfn> избира атрибути. <dfn data-g="декартово произведение">Декартовото произведение</dfn> комбинира кортежи от две релации. <dfn data-g="съединение">Съединението</dfn> обединява съответстващи кортежи по зададено условие. Обединение, сечение и разлика изискват <dfn data-g="съвместими схеми">съвместими схеми</dfn>. Тези операции формират <dfn data-g="релационна алгебра">релационната алгебра</dfn>.</p>
</div>

<div class="block">
  <h3>Лаборатория: операциите стъпка по стъпка</h3>
  <p class="muted">Таблиците са редактируеми: формат <code>атрибути|ред|ред…</code>, стойностите се разделят с интервал. Еквивалентната SQL заявка е над визуализацията; изпълнимият код е C.</p>
  <div id="v-alg"></div>
  <details class="hint"><summary>Защо проекцията „губи“ редове, а SQL SELECT — не</summary><div>
    <p>Релацията е множество: два еднакви кортежа са един и същ елемент. Затова π<sub>pid</sub> върху четирима студенти от три специалности дава три реда. SQL таблиците са мултимножества: <code>SELECT pid FROM Student</code> връща четири реда; само <code>SELECT DISTINCT</code> премахва повторенията. Превключи „SQL без DISTINCT“, за да видиш разликата.</p>
  </div></details>
  <details class="hint"><summary>Защо съединението е „селекция върху декартово произведение“</summary><div>
    <p>Логически R ⋈ S = π(σ<sub>R.a = S.a</sub>(R × S)): от всички комбинации оставяме съответстващите и махаме повторената колона. Сравни броя редове на × и ⋈ върху Student и Programme. Това е <b>логически</b> модел — СУБД рядко строи декартовото произведение физически.</p>
  </div></details>
  <details class="trap"><summary>Капан: SELECT не означава само селекция</summary><div>
    <p>Релационната селекция σ избира <b>редове</b>. SQL <code>SELECT</code> изброява резултатните колони (това е проекция) и заедно с FROM, JOIN, WHERE, GROUP BY може да съдържа селекция, съединения, агрегати и други операции. Селекцията в SQL е най-вече <code>WHERE</code>.</p>
  </div></details>
</div>

<div class="block">
  <h3>Схема 5 · Селекция, проекция и съединение</h3>
  <div class="split">
    <div class="key"><b>σ — хоризонтално</b><p>Реже редове. Схемата е същата.</p></div>
    <div class="key"><b>π — вертикално</b><p>Реже колони. Повторенията изчезват (като множество).</p></div>
    <div class="key"><b>⋈ — комбинира</b><p>Свързва съответстващи редове от две релации по условие.</p></div>
  </div>
  <p class="prose muted">Примерът е логически; правилата за дубликати и NULL в SQL се различават от математическите релации — следващият раздел ги показва.</p>
</div>`;

  const STUD = "sid name pid|1 Ana INF|2 Boris MAT|3 Vera INF|4 Galin FIZ";
  const PROG = "pid pname|INF Informatika|MAT Matematika|PED Pedagogika";
  const ENR = "sid cid grade|1 C1 6|1 C2 5|2 C1 4|3 C2 3";
  const OPS = [["sel", "σ селекция"], ["proj", "π проекция"], ["prod", "× декартово произведение"], ["join", "⋈ естествено съединение"], ["union", "∪ обединение"], ["diff", "− разлика"], ["inter", "∩ сечение"]];
  const CODE = { sel: "ch03_select", proj: "ch03_project", prod: "ch03_product", join: "ch03_join", union: "ch03_setops", diff: "ch03_setops", inter: "ch03_setops" };

  function mount(root) {
    S.viz(root.querySelector("#v-alg"), {
      id: "alg", title: "Релационна алгебра върху редактируеми таблици", sub: "Синьо — текущ ред; зелено — влиза в резултата; оранжево — проверява се / повтаря се.",
      code: (inp) => CODE[inp.op] || "ch03_select",
      inputs: [
        { id: "op", label: "Операция", type: "select", value: "sel", options: OPS },
        { id: "R", label: "R", value: STUD, width: "26em" },
        { id: "S", label: "S", value: PROG, width: "26em" },
        { id: "cond", label: "условие (σ)", value: "pid = INF", width: "9em" },
        { id: "cols", label: "атрибути (π)", value: "pid", width: "9em" },
        { id: "bag", label: "SQL без DISTINCT (π)", type: "checkbox", value: false },
      ],
      presets: [
        { label: "σ pid = INF", values: { op: "sel", R: STUD, cond: "pid = INF" } },
        { label: "σ grade ≥ 5", values: { op: "sel", R: ENR, cond: "grade >= 5" } },
        { label: "π pid", values: { op: "proj", R: STUD, cols: "pid", bag: false } },
        { label: "Student × Programme", values: { op: "prod", R: STUD, S: PROG } },
        { label: "Student ⋈ Programme", values: { op: "join", R: STUD, S: PROG } },
        { label: "Student ⋈ Enrollment", values: { op: "join", R: STUD, S: ENR } },
        { label: "R − S", values: { op: "diff", R: "A B C|1 x p|2 x q|3 y p", S: "A B C|2 x q|3 y p|4 z r" } },
        { label: "Несъвместими схеми", values: { op: "union", R: "A B C|1 x p", S: "A B|1 x" } },
      ],
      legend: [["s-act", "текущ ред"], ["s-cmp", "сравнява се / повтаря се"], ["s-done", "влиза в резултата"], ["s-piv", "атрибути на условието"]],
      build: algos.run,
      draw(st, f) {
        st.innerHTML = "";
        if (f.sql) st.append(h("div", { style: { marginBottom: "10px" } }, h("span", { class: "eyebrow", text: "Еквивалентен SQL (само за четене)" }), T6.sql(f.sql)));
        const rowA = {}, rowB = {}, rowO = {}, colA = {}, colB = {};
        if (f.ai != null) rowA[f.ai] = f.aok === true ? "s-done" : f.aok === false ? "s-cmp" : "s-act";
        if (f.bi != null) rowB[f.bi] = f.aok === true ? "s-done" : f.aok === false ? "s-cmp" : "s-act";
        if (f.oi != null) rowO[f.oi] = f.dup ? "s-cmp" : "s-done";
        if (f.aj != null) colA[f.aj] = "s-piv";
        (f.pcols || []).forEach((j) => (colA[j] = "s-piv"));
        (f.jc || []).forEach((c) => { colA[f.A.cols.indexOf(c)] = "s-piv"; if (f.B) colB[f.B.cols.indexOf(c)] = "s-piv"; });
        const kids = [T6.table({ name: "R", cols: f.A.cols, rows: f.A.rows }, { rowCls: rowA, colCls: colA })];
        if (f.B) kids.push(T6.table({ name: "S", cols: f.B.cols, rows: f.B.rows }, { rowCls: rowB, colCls: colB }));
        kids.push(T6.op("⇒"), T6.table({ name: "резултат", cols: f.out.cols, rows: f.out.rows }, { rowCls: rowO, empty: "∅ (засега празен)" }));
        st.append(T6.row(...kids));
      },
    });
  }

  S.chapter({ id: "algebra", order: 3, num: "3", group: "Релационен модел", title: "Релационна алгебра", lead: "Селекция, проекция, декартово произведение, съединение, обединение, разлика и сечение — стъпка по стъпка върху редактируеми таблици, с еквивалентен SQL.", html, mount, algos });
})();

<script>
/* Раздел 4 — SQL (глава 3, втора част): декларативност, логически ред на клаузите,
   LEFT JOIN, COUNT и NULL, тризначна логика, план за изпълнение. */
(function () {
  const S = window.Study, h = S.h;

  function parseStudents(txt) {
    const out = [];
    String(txt).split(/[;,]+/).map((x) => x.trim()).filter(Boolean).forEach((p) => {
      const m = /^(\d+)\s+(\S+)$/.exec(p);
      if (!m) throw new Error(`„${p}“: студент във вида „id име“, напр. „1 Ana“.`);
      if (out.some((s) => s.id === +m[1])) throw new Error(`Повторен id ${m[1]} — Student.id е първичен ключ.`);
      out.push({ id: +m[1], name: m[2].slice(0, 11) });
    });
    if (!out.length) throw new Error("Нужен е поне един студент.");
    if (out.length > 6) throw new Error("Най-много 6 студента.");
    return out.sort((a, b) => a.id - b.id);   /* резултатът се показва по групите в този ред — ORDER BY s.id */
  }
  function parseEnr(txt, studs) {
    const out = [];
    String(txt).split(/[;,]+/).map((x) => x.trim()).filter(Boolean).forEach((p) => {
      const m = /^(\d+)\s+(\d+)\s+(\d+)$/.exec(p);
      if (!m) throw new Error(`„${p}“: записване във вида „student_id course_id grade“, напр. „1 101 6“.`);
      const e = { sid: +m[1], cid: +m[2], grade: +m[3] };
      if (e.grade < 2 || e.grade > 6) throw new Error("Оценката е от 2 до 6.");
      if (!studs.some((s) => s.id === e.sid)) throw new Error(`Външен ключ: няма студент ${e.sid}.`);
      if (out.some((x) => x.sid === e.sid && x.cid === e.cid)) throw new Error(`Повторена двойка (${e.sid}, ${e.cid}) — първичен ключ.`);
      out.push(e);
    });
    if (out.length > 10) throw new Error("Най-много 10 записвания.");
    return out;
  }

  /* тризначна логика: F=0 U=1 T=2 */
  const TV = ["FALSE", "UNKNOWN", "TRUE"];
  const and = (a, b) => Math.min(a, b), or = (a, b) => Math.max(a, b), not = (a) => 2 - a;
  const ge = (x, isNull, g) => (isNull ? 1 : x >= g ? 2 : 0);

  const algos = {
    and, or, not, ge,

    query({ studs, enr, place, g, agg }) {
      const Sx = parseStudents(studs), E = parseEnr(enr, Sx);
      place = +place; agg = +agg;
      g = S.int(g, 2, 6, "Прагът g");
      const rows = [], F = [];
      const cond = place === 1 ? ` AND e.grade >= ${g}` : "";
      const where = place === 2 ? `\nWHERE e.grade >= ${g}` : "";
      const sql = `SELECT s.id, s.name, ${agg ? "COUNT(*)" : "COUNT(e.course_id)"} AS courses\nFROM Student AS s\nLEFT JOIN Enrollment AS e ON e.student_id = s.id${cond}${where}\nGROUP BY s.id, s.name\nORDER BY s.id;`;
      let phase = "FROM / JOIN";
      const snap = (o) => ({ Sx, E, sql, phase, rows: rows.map((r) => ({ ...r })), stats: { "редове след JOIN": rows.length }, ...o });
      F.push(snap({ msg: "Логическият ред на обработка: <b>FROM/JOIN → WHERE → GROUP BY → SELECT (агрегати) → ORDER BY</b>. Записаният ред на клаузите е друг. Реалният план може да се различава, но със същия смисъл." }));
      Sx.forEach((s, i) => {
        let matched = false;
        F.push(snap({ at: "lj_outer", si: i, msg: `Студент (${s.id}, ${s.name}): търсим записвания с e.student_id = ${s.id}${cond ? ` и e.grade ≥ ${g}` : ""}.` }));
        E.forEach((e, k) => {
          let on = e.sid === s.id ? 2 : 0;
          if (place === 1) on = and(on, ge(e.grade, false, g));
          F.push(snap({ at: ["lj_inner", "lj_on"], si: i, ek: k, eok: on === 2, msg: `ON за (${e.sid}, ${e.cid}, ${e.grade}): ${TV[on]}.` }));
          if (on !== 2) return;
          rows.push({ id: s.id, name: s.name, cid: e.cid, grade: e.grade, nul: false });
          matched = true;
          F.push(snap({ at: "lj_match", si: i, ek: k, eok: true, ri: rows.length - 1, msg: `Съвпадение — добавяме ред.`, log: `JOIN: (${s.id}, ${e.cid})` }));
        });
        if (!matched) {
          rows.push({ id: s.id, name: s.name, cid: null, grade: null, nul: true });
          F.push(snap({ at: "lj_pad", si: i, ri: rows.length - 1, msg: `Няма съвпадение. <b>LEFT JOIN</b> пази студента и попълва колоните на e с <b>NULL</b>.`, log: `JOIN: (${s.id}, NULL)` }));
        }
      });
      phase = "WHERE";
      if (place === 2) {
        const kept = [];
        rows.forEach((r, i) => {
          const c = ge(r.grade, r.nul, g);
          F.push(snap({ at: "wh_loop", ri: i, rok: c === 2, msg: `WHERE e.grade >= ${g}: ${r.nul ? "NULL" : r.grade} >= ${g} → <b>${TV[c]}</b>. ${c === 2 ? "Остава." : c === 1 ? "UNKNOWN не е TRUE — редът <b>отпада</b>." : "FALSE — отпада."}` }));
          if (c === 2) kept.push(r);
          else F.push(snap({ at: "wh_drop", ri: i, rok: false, dropped: true, msg: `Ред (${r.id}, ${r.nul ? "NULL" : r.cid}) отпада.${r.nul ? " Така LEFT JOIN-ът на практика става INNER JOIN за този студент." : ""}`, log: `WHERE: −(${r.id}, ${r.nul ? "NULL" : r.cid})` }));
        });
        rows.length = 0; kept.forEach((r) => rows.push(r));
      } else F.push(snap({ at: "wh_loop", msg: place === 1 ? "Условието е в ON — то вече е решило кои записвания да се съединят, а редът с NULL остава. WHERE няма." : "Няма WHERE." }));
      phase = "GROUP BY";
      const counts = [];
      let groups = 0;
      Sx.forEach((s, i) => {
        let cnt = 0, present = false;
        F.push(snap({ at: "gb_group", gi: s.id, counts: counts.slice(), msg: `Група s.id = ${s.id}.` }));
        rows.forEach((r, ri) => {
          if (r.id !== s.id) return;
          present = true;
          const counted = agg === 1 || !r.nul;
          if (counted) cnt++;
          F.push(snap({ at: ["gb_row", "gb_count"], gi: s.id, ri, rok: counted, counts: counts.slice(), msg: agg ? `COUNT(*) брои реда → ${cnt}.` : `COUNT(e.course_id): стойност ${r.nul ? "NULL — <b>не се брои</b>" : r.cid + " — брои се"} → ${cnt}.` }));
        });
        counts.push(present ? cnt : -1);
        if (present) groups++;
        F.push(snap({ at: "gb_emit", gi: s.id, counts: counts.slice(), msg: present ? `(${s.id}, ${s.name}, <b>${cnt}</b>).` : `Студент ${s.id} няма нито един ред след WHERE — групата <b>изчезва</b> от резултата.`, log: present ? `(${s.id}, ${s.name}, ${cnt})` : `(${s.id}) липсва` }));
      });
      phase = "ORDER BY";
      F.push(snap({ done: true, counts: counts.slice(), msg: `Резултат: ${groups} реда, подредени по s.id. ${agg === 1 && place !== 2 ? "COUNT(*) брои и реда с NULL — студент без записвания получава 1, не 0." : ""}` }));
      return { frames: F, counts: counts.join(","), groups };
    },

    tvl({ x, xnull, g, op2, y }) {
      g = S.int(g, -1000, 1000, "g");
      const isNull = xnull === true || xnull === "true";
      const xv = isNull ? null : S.int(x, -1000, 1000, "x");
      const c = ge(xv, isNull, g);
      const yv = { T: 2, U: 1, F: 0 }[y];
      if (yv === undefined) throw new Error("Втората стойност е T, U или F.");
      const F = [];
      F.push({ at: isNull ? "cmp_null" : "cmp_val", c, msg: `x >= ${g}, x = ${isNull ? "NULL" : xv} → <b>${TV[c]}</b>.${isNull ? " Всяко сравнение с NULL (дори NULL = NULL) дава UNKNOWN." : ""}` });
      let r = c, at = "and";
      if (op2 === "AND") { r = and(c, yv); at = "and"; }
      else if (op2 === "OR") { r = or(c, yv); at = "or"; }
      else if (op2 === "NOT") { r = not(c); at = "not"; }
      if (op2 !== "—") F.push({ at, c, r, msg: op2 === "NOT" ? `NOT ${TV[c]} = <b>${TV[r]}</b>.` : `${TV[c]} ${op2} ${TV[yv]} = <b>${TV[r]}</b> (${op2 === "AND" ? "минимумът" : "максимумът"} при FALSE &lt; UNKNOWN &lt; TRUE).` });
      F.push({ at: "where", c, r, done: true, msg: `WHERE ${r === 2 ? "<b>запазва</b>" : "<b>отхвърля</b>"} реда — оставя само TRUE.`, inv: { text: r === 2 ? "TRUE → редът остава" : `${TV[r]} → редът отпада`, ok: r === 2 } });
      return { frames: F, result: r };
    },
  };

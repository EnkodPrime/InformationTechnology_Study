<script>
/* Раздел 5 — Функционални зависимости, затваряне X⁺, кандидатни ключове (глава 4, първа част). */
(function () {
  const S = window.Study, h = S.h;
  const FD = () => window.T6FD;

  const PRESETS = {
    abc: { attrs: "A B C", fds: "A->B; B->C", x: "A", t: "R(A,B,C): A→B, B→C" },
    enr: { attrs: "StudentID StudentName CourseID CourseName Grade", fds: "StudentID->StudentName; CourseID->CourseName; StudentID,CourseID->Grade", x: "StudentID", t: "Enrollment (ръководство)" },
    sct: { attrs: "Student Course Teacher", fds: "Student,Course->Teacher; Teacher->Course", x: "Teacher", t: "Student–Course–Teacher (BCNF пример)" },
    per: { attrs: "NationalID Country DocumentNo Name", fds: "NationalID->Country,DocumentNo,Name; Country,DocumentNo->NationalID", x: "Country,DocumentNo", t: "Два кандидатни ключа с различна дължина" },
    big: { attrs: "A B C D E F", fds: "A,B->C; C->D; D->A; E->F; B,D->E", x: "A,B", t: "Шест атрибута, три ключа" },
  };

  const algos = {
    closure({ attrs, fds, x }) {
      const F = FD(), sch = F.parse(attrs, fds);
      const X = sch.set(String(x));
      if (!X) throw new Error("X е празно — въведи поне един атрибут.");
      const frames = [], cnt = {};
      const res = F.closure(sch, X, cnt, frames);
      let pass = 0, checks = 0;
      frames.forEach((f) => {
        if (f.at === "cl_pass" && f.pass > pass) pass = f.pass;
        if ([].concat(f.at).includes("cl_test")) checks++;
        f.sch = sch; f.X = X; f.stats = { проходи: pass, "проверени ФЗ": checks };
        f.vars = { X: "{" + F.str(sch, X) + "}", "X⁺": "{" + F.str(sch, f.res) + "}" };
      });
      const all = res === sch.all;
      const last = frames[frames.length - 1];
      last.inv = all ? { text: `{${F.str(sch, X)}} е суперключ (X⁺ = всички атрибути)`, ok: true } : { text: `{${F.str(sch, X)}} не е суперключ — липсват ${F.str(sch, sch.all & ~res)}`, ok: false };
      return { frames, result: F.str(sch, res), passes: cnt.passes, checks: cnt.checks, superkey: all };
    },

    keys({ attrs, fds }) {
      const F = FD(), sch = F.parse(attrs, fds);
      if (sch.n > 8) throw new Error("За стъпковото търсене на ключове — най-много 8 атрибута.");
      const frames = [], cnt = {};
      const keys = F.keys(sch, cnt, frames);
      frames.forEach((f) => { f.sch = sch; f.stats = { "изчислени затваряния": "—" }; });
      let c = 0;
      frames.forEach((f) => { if ([].concat(f.at).includes("k_test")) c++; f.stats = { "изчислени затваряния": c, "намерени ключове": f.keys.length }; });
      const prime = F.prime(keys);
      frames.push({ at: "k_size", sch, keys: keys.slice(), done: true, stats: frames[frames.length - 1].stats,
        msg: `Кандидатни ключове: ${keys.map((k) => "{" + F.str(sch, k) + "}").join(", ")}. Първични атрибути: {${F.str(sch, prime)}}. Непървични: {${F.str(sch, sch.all & ~prime)}}.` });
      return { frames, result: keys.map((k) => "{" + F.str(sch, k) + "}").join(" "), closures: cnt.closures, prime: F.str(sch, prime) };
    },

    holds({ rows, x, y }) {
      const lines = String(rows).split("|").map((s) => s.trim()).filter(Boolean);
      if (lines.length < 2) throw new Error("Нужни са схема и поне един ред: „A B|1 x|2 y“.");
      const cols = lines[0].split(/\s+/);
      const data = lines.slice(1).map((l, i) => { const v = l.split(/\s+/); if (v.length !== cols.length) throw new Error(`Ред ${i + 1}: ${v.length} стойности при ${cols.length} атрибута.`); return v; });
      if (data.length > 8) throw new Error("Най-много 8 реда.");
      const idx = (s) => s.split(/[\s,]+/).filter(Boolean).map((n) => { const k = cols.indexOf(n); if (k < 0) throw new Error(`Няма атрибут „${n}“.`); return k; });
      const X = idx(x), Y = idx(y);
      if (!X.length || !Y.length) throw new Error("X и Y не трябва да са празни.");
      const F = [];
      const st = { cols, data, X, Y };
      F.push({ ...st, msg: `Проверяваме дали {${X.map((k) => cols[k]).join(",")}} → {${Y.map((k) => cols[k]).join(",")}} е изпълнена в <b>текущото състояние</b>: всяка двойка редове с еднакво X трябва да има еднакво Y.` });
      for (let i = 0; i < data.length; i++) for (let j = i + 1; j < data.length; j++) {
        const sx = X.every((k) => data[i][k] === data[j][k]), sy = Y.every((k) => data[i][k] === data[j][k]);
        F.push({ ...st, at: ["h_j", "h_x"], pi: i, pj: j, sx, sy, msg: `Редове ${i + 1} и ${j + 1}: X ${sx ? "еднакво" : "различно"}${sx ? `, Y ${sy ? "еднакво" : "<b>различно</b>"}` : " — двойката не е свидетел"}.` });
        if (sx && !sy) {
          F.push({ ...st, at: "h_bad", pi: i, pj: j, sx, sy, bad: true, done: true, msg: `Контрапример: редове ${i + 1} и ${j + 1}. Зависимостта <b>не е изпълнена</b> в това състояние, значи не може да е правило на предметната област.`, inv: { text: "Едно нарушение опровергава ФЗ", ok: false } });
          return { frames: F, ok: 0, pi: i, pj: j };
        }
      }
      F.push({ ...st, at: "h_ok", done: true, msg: "Няма контрапример в текущите редове. Това <b>не доказва</b> зависимостта: следващо допустимо вмъкване може да я наруши. Функционалната зависимост е правило на предметната област, не наблюдение.", inv: { text: "Съвместимо с ФЗ ≠ доказателство за ФЗ", ok: true } });
      return { frames: F, ok: 1, pi: -1, pj: -1 };
    },
  };

  /* ---------- съдържание ---------- */
  const html = `
<div class="prose">
  <p><dfn data-g="функционална зависимост">Функционалната зависимост</dfn> X→Y означава, че във всяко допустимо състояние два кортежа с еднакви стойности на X имат еднакви стойности на Y. Тя изразява <b>правило на предметната област</b>. Случайното съвпадение в текущите редове не доказва зависимостта за всички допустими данни. Лявата страна е <dfn data-g="детерминант">детерминант</dfn>.</p>
  <p>X→Y не казва, че програмата изчислява Y аритметично от X. StudentID→StudentName е ограничение, дори името да няма числова формула. Обратното StudentName→StudentID не следва: различни студенти могат да имат едно име.</p>
</div>

<div class="block">
  <h3>Данните могат само да опровергаят зависимост</h3>
  <div id="v-holds"></div>
  <details class="trap"><summary>Капан: „в таблицата CourseName определя CourseID, значи CourseName→CourseID“</summary><div>
    <p>Текущото <dfn data-g="състояние на база">състояние</dfn> може да е съвместимо със зависимост, която не е правило. Посоката на извода е само една: контрапример в данните опровергава ФЗ; липсата на контрапример не я доказва.</p>
  </div></details>
</div>

<div class="block">
  <h3>Затваряне на атрибути X⁺</h3>
  <p class="prose"><dfn data-g="затваряне на атрибути">Затварянето X⁺</dfn> спрямо набор зависимости е множеството атрибути, които X определя. При A→B и B→C получаваме {A}⁺ = {A, B, C}. Ако това са всички атрибути на схемата, A е <dfn data-g="суперключ">суперключ</dfn>; ако няма по-малък определящ поднабор, е <dfn data-g="кандидатен ключ">кандидатен ключ</dfn>. Така ключовете се <b>извеждат от правилата</b>, а не се избират само по удобен вид на колоната.</p>
  <div id="v-cl"></div>
  <details class="hint"><summary>Защо алгоритъмът винаги спира и е коректен</summary><div>
    <p><b>Спиране:</b> X⁺ само расте и е подмножество на краен брой атрибути n; всеки проход, който не спира, добавя поне един атрибут ⇒ най-много n + 1 прохода.</p>
    <p><b>Коректност:</b> всяко добавяне следва от правилата (транзитивност и обединение на зависимости); при неподвижна точка никоя зависимост не може да добави нищо, значи няма какво друго X да определя чрез тези правила.</p>
    <p>Цена: O(n · |F|) проверки при битови маски — в C всяка проверка е една операция <code>(lhs &amp; ~res) == 0</code>.</p>
  </div></details>
  <div class="key"><span class="formula">X е суперключ ⇔ X⁺ = всички атрибути</span><br><span class="formula">X е кандидатен ключ ⇔ X⁺ = всички и ∀ собствено Y ⊂ X: Y⁺ ≠ всички</span></div>
</div>

<div class="block">
  <h3>Схема 8 · Затваряне за проверка на ключ — всички кандидатни ключове</h3>
  <p class="prose">За схема R(A, B, C) и точно посочените зависимости A определя цялата схема. Минималността на кандидатния ключ се проверява отделно. Алгоритъмът по-долу обхожда подмножествата по нарастващ размер; надмножество на вече намерен ключ се пропуска без затваряне, защото не може да е минимално.</p>
  <div id="v-keys"></div>
  <details class="hint"><summary>Хинт: минимален по включване ≠ най-малък</summary><div><p>Пусни „Два ключа с различна дължина“: {NationalID} и {Country, DocumentNo} са кандидатни ключове. Вторият не престава да е кандидатен, защото никой негов собствен поднабор не е суперключ.</p></div></details>
  <details class="trap"><summary>Капан: експоненциален брой подмножества</summary><div><p>Броят на подмножествата е 2ⁿ − 1, а броят на кандидатните ключове може да е експоненциален в n. Обхождането е учебно — за малки схеми. Пропускането на надмножествата на намерените ключове намалява работата, но не променя най-лошия случай.</p></div></details>
</div>

<div class="block">
  <h3>Предпоставките на примера Enrollment</h3>
  <p class="prose">При Enrollment(StudentID, CourseID, StudentName, CourseName, Grade) предполагаме един запис за двойка студент и дисциплина. Имената зависят само от част от съставния ключ, а Grade — от цялата двойка. Ако се допускат повторно записване, семестри или различни опити, първоначалната схема вече не изразява правилно идентичността. Нормализацията започва с точното предметно правило, не с механично разделяне.</p>
</div>`;

  function drawSchemaFDs(st, f, F) {
    const sch = f.sch;
    const cls = (k) => {
      const b = 1 << k;
      if (f.added && f.added & b) return "s-done";

    st.append(h("div", null, h("span", { class: "eyebrow", text: "Атрибути (лилаво — X; синьо — вече в X⁺; зелено — току-що добавени)" }), T6.attrs(sch.names, (a, k) => cls(k))));
    const tb = h("table", { class: "t", style: { marginTop: "10px" } }, h("tr", null, h("th", { text: "#" }), h("th", { text: "зависимост" }), h("th", { text: "лявата ⊆ X⁺?" })));
    sch.fds.forEach((d, i) => {
      const cur = i === f.fi;
      const inL = f.res != null ? F.sub(d.lhs, f.res) : null;
      tb.append(h("tr", { class: cur ? (f.ok ? "s-done" : "s-cmp") : "" },
        h("td", { class: "mono", text: i + 1 }), h("td", { class: "mono", text: F.fdStr(sch, d) }),
        h("td", { class: "mono", text: inL == null ? "" : inL ? "да" : "не" })));
    });
    st.append(h("div", { class: "tbl-wrap" }, tb));
  }

  function mount(root) {
    S.viz(root.querySelector("#v-holds"), {
      id: "holds", title: "Изпълнена ли е X→Y в текущите редове?", sub: "Сравняват се всички двойки редове.",
      code: "ch05_holds",
      inputs: [
        { id: "rows", label: "Таблица (атрибути|ред|…)", value: "StudentID StudentName CourseID CourseName|1 Ana C1 Bazi|1 Ana C2 Algo|2 Boris C1 Bazi|3 Ana C2 Algo", width: "34em" },
        { id: "x", label: "X", value: "StudentName", width: "9em" }, { id: "y", label: "Y", value: "StudentID", width: "9em" },
      ],
      presets: [
        { label: "StudentID → StudentName", values: { x: "StudentID", y: "StudentName" } },
        { label: "StudentName → StudentID", values: { x: "StudentName", y: "StudentID" } },
        { label: "CourseName → CourseID", values: { x: "CourseName", y: "CourseID" }, title: "Съвместима с данните, но не е правило" },
      ],
      legend: [["s-cmp", "двойка с еднакво X"], ["s-swap", "контрапример"], ["s-piv", "X"], ["s-act", "Y"]],
      build: algos.holds,
      draw(st, f) {
        st.innerHTML = "";
        const rowCls = {}, colCls = {};
        f.X.forEach((k) => (colCls[k] = "s-piv")); f.Y.forEach((k) => (colCls[k] = "s-act"));
        if (f.pi != null) { const c = f.bad ? "s-swap" : f.sx ? "s-cmp" : "s-dim"; rowCls[f.pi] = c; rowCls[f.pj] = c; }
        st.append(T6.table({ cols: f.cols, rows: f.data }, { rowCls, colCls }));
      },
    });

    const P = PRESETS;
    S.viz(root.querySelector("#v-cl"), {
      id: "cl", title: "Затваряне X⁺ стъпка по стъпка", sub: "Зависимости: „X->Y“, разделени с „;“; атрибутите в лявата/дясната страна — със запетая.",
      code: "ch05_closure",
      inputs: [
        { id: "attrs", label: "Схема R", value: P.abc.attrs, width: "22em" },
        { id: "fds", label: "Зависимости F", value: P.abc.fds, width: "30em" },
        { id: "x", label: "X", value: P.abc.x, width: "11em" },
      ],
      presets: Object.values(P).map((p) => ({ label: p.t, values: { attrs: p.attrs, fds: p.fds, x: p.x } })).concat([{ label: "Enrollment: {StudentID, CourseID}⁺", values: { attrs: P.enr.attrs, fds: P.enr.fds, x: "StudentID,CourseID" } }]),
      legend: [["s-piv", "X"], ["s-act", "в X⁺"], ["s-done", "нов"], ["s-cmp", "не се прилага"]],
      build: algos.closure,
      draw(st, f) { st.innerHTML = ""; drawSchemaFDs(st, f, FD()); },
    });

    S.viz(root.querySelector("#v-keys"), {
      id: "keys", title: "Всички кандидатни ключове", sub: "Подмножества по нарастващ размер; надмножествата на намерен ключ се пропускат.",
      code: "ch05_keys",
      inputs: [{ id: "attrs", label: "Схема R", value: P.sct.attrs, width: "22em" }, { id: "fds", label: "Зависимости F", value: P.sct.fds, width: "30em" }],
      presets: Object.values(P).map((p) => ({ label: p.t, values: { attrs: p.attrs, fds: p.fds } })).concat([{ label: "Без зависимости", values: { attrs: "A B C D", fds: "" } }]),
      legend: [["s-act", "проверявано X"], ["s-done", "ключ"], ["s-dim", "надмножество — пропуснато"], ["s-piv", "намерени ключове"]],
      speed: 2,
      build: algos.keys,
      draw(st, f) {
        st.innerHTML = "";
        const F = FD(), sch = f.sch;
        if (f.X != null) {
          st.append(h("div", null, h("span", { class: "eyebrow", text: "Проверявано X" + (f.cl != null ? " и X⁺" : "") }),
            T6.attrs(sch.names, (a, k) => (f.X >> k & 1 ? (f.skip != null ? "s-dim" : f.ok ? "s-done" : "s-act") : f.cl != null && f.cl >> k & 1 ? "s-cmp" : ""))));
        }
        const kb = h("div", { style: { marginTop: "12px" } }, h("span", { class: "eyebrow", text: "Намерени кандидатни ключове" }));
        const row = h("div", { class: "t6-attrs" });
        if (!f.keys.length) row.append(h("span", { class: "muted", text: "— още няма" }));
        f.keys.forEach((k) => row.append(h("span", { class: "pill s-piv", text: "{" + F.str(sch, k) + "}" })));
        kb.append(row);
        st.append(kb);
        if (f.done) {
          const prime = F.prime(f.keys);
          st.append(h("div", { style: { marginTop: "12px" } }, h("span", { class: "eyebrow", text: "Първични (лилаво) и непървични атрибути" }), T6.attrs(sch.names, (a, k) => (prime >> k & 1 ? "s-piv" : ""))));
        }
      },
    });
  }

  S.chapter({ id: "fz", order: 5, num: "5", group: "Зависимости и нормализация", title: "Функционални зависимости и ключове", lead: "X→Y е правило на предметната област. Затварянето X⁺ стъпка по стъпка и извеждане на всички кандидатни ключове.", html, mount, algos });

<script>
/* Раздел 6 — Аномалии и разлагане без загуба (глава 4, втора част; схема 7 и схема 12). */
(function () {
  const S = window.Study, h = S.h;
  const FD = () => window.T6FD;

  const ENR0 = [
    ["1", "Ana", "C1", "Bazi", "6"],
    ["1", "Ana", "C2", "Algoritmi", "5"],
    ["2", "Boris", "C1", "Bazi", "4"],
    ["3", "Vera", "C2", "Algoritmi", "3"],
  ];
  const ENR_COLS = ["StudentID", "StudentName", "CourseID", "CourseName", "Grade"];

  const algos = {
    /** Аномалиите върху обща таблица Enrollment и върху разложената схема. */
    anomaly({ kind, design }) {
      const norm = design === "norm";
      const F = [];
      const all = ENR0.map((r) => r.slice());
      if (!norm) {
        const snap = (rows, o) => ({ norm, rows: rows.map((r) => r.slice()), ...o });
        if (kind === "update") {
          F.push(snap(all, { msg: "Смяна на името на дисциплина C1: „Bazi“ → „Bazi danni“. Името е записано във <b>всеки</b> ред със C1." }));
          const rows = all.map((r) => r.slice());
          const hits = rows.map((r, i) => (r[2] === "C1" ? i : -1)).filter((i) => i >= 0);
          F.push(snap(rows, { hl: hits, cls: "s-cmp", msg: `Трябва да се променят <b>${hits.length}</b> реда.` }));
          rows[hits[0]][3] = "Bazi danni";
          F.push(snap(rows, { hl: [hits[0]], cls: "s-done", cell: [hits[0], 3], msg: "Обновихме първия ред… и приложението „забрави“ втория." }));
          F.push(snap(rows, { hl: hits, cls: "s-swap", done: true, msg: "<b>Аномалия при изменение:</b> една и съща дисциплина C1 има две различни имена. Базата е несъгласувана, без да е нарушено нито едно зададено ограничение.", inv: { text: "CourseID → CourseName е нарушена в данните", ok: false } }));
        } else if (kind === "insert") {
          F.push(snap(all, { msg: "Искаме да добавим нова дисциплина C3 „Mrezhi“, за която още няма записани студенти." }));
          const row = ["NULL", "NULL", "C3", "Mrezhi", "NULL"];
          F.push(snap(all.concat([row]), { hl: [4], cls: "s-swap", done: true, msg: "<b>Аномалия при добавяне:</b> ключът е (StudentID, CourseID) и е задължителен — без студент редът не може да се вмъкне. Фактът „съществува дисциплина C3“ няма къде да се запише.", inv: { text: "PK не допуска NULL в StudentID", ok: false } }));
        } else {
          F.push(snap(all, { msg: "Студентка Vera се отписва от C2 — изтриваме реда (3, C2)." }));
          F.push(snap(all, { hl: [3], cls: "s-cmp", msg: "Изтриваме ред 4." }));
          const rows = all.filter((r, i) => i !== 3);
          F.push(snap(rows, { msg: "Сведенията за C2 оцеляват — има и друг ред (Ana, C2). Сега Ana също се отписва от C2." }));
          F.push(snap(rows, { hl: [1], cls: "s-cmp", msg: "Изтриваме (1, C2) — последния ред с C2." }));
          const rows2 = rows.filter((r, i) => i !== 1);
          F.push(snap(rows2, { done: true, msg: "<b>Аномалия при изтриване:</b> с последното записване изчезна и фактът, че дисциплина C2 се казва „Algoritmi“. Изтрихме повече, отколкото искахме. (Същото важи за Vera като студент.)", inv: { text: "Загубен факт: C2 → Algoritmi", ok: false } }));
        }
      } else {
        const st = { s: [["1", "Ana"], ["2", "Boris"], ["3", "Vera"]], c: [["C1", "Bazi"], ["C2", "Algoritmi"]], e: ENR0.map((r) => [r[0], r[2], r[4]]) };
        const snap = (o) => ({ norm, st: JSON.parse(JSON.stringify(st)), ...o });
        if (kind === "update") {
          F.push(snap({ msg: "Същата смяна в разложената схема Student, Course, Enrollment." }));
          st.c[0][1] = "Bazi danni";
          F.push(snap({ hlC: [0], done: true, msg: "Името е записано <b>на едно място</b> — променяме един ред. Несъгласуваност е невъзможна.", inv: { text: "Един факт — едно място", ok: true } }));
        } else if (kind === "insert") {
          F.push(snap({ msg: "Нова дисциплина C3 без студенти." }));
          st.c.push(["C3", "Mrezhi"]);
          F.push(snap({ hlC: [2], done: true, msg: "Course(CourseID, CourseName) приема C3 самостоятелно.", inv: { text: "Добавянето не изисква несвързан факт", ok: true } }));
        } else {
          F.push(snap({ msg: "Vera и Ana се отписват от C2." }));
          st.e = st.e.filter((r) => r[1] !== "C2");
          F.push(snap({ hlC: [1], done: true, msg: "Записванията изчезнаха, но Course пази C2 „Algoritmi“.", inv: { text: "Фактът за дисциплината оцелява", ok: true } }));
        }
      }
      return { frames: F };
    },

    /** Проекции и тяхното съединение — фалшиви кортежи (огледало на spurious_join в C). */
    spurious({ rows, a1, a2 }) {
      const lines = String(rows).split("|").map((s) => s.trim()).filter(Boolean);
      const cols = lines[0].split(/\s+/);
      if (cols.length > 6) throw new Error("Най-много 6 атрибута.");
      const data = lines.slice(1).map((l, i) => { const v = l.split(/\s+/); if (v.length !== cols.length) throw new Error(`Ред ${i + 1}: ${v.length} стойности при ${cols.length} атрибута.`); return v; });
      if (!data.length) throw new Error("Нужен е поне един ред.");
      if (data.length > 6) throw new Error("Най-много 6 реда.");
      const mask = (s) => s.split(/[\s,]+/).filter(Boolean).reduce((m, n) => { const k = cols.indexOf(n); if (k < 0) throw new Error(`Няма атрибут „${n}“.`); return m | (1 << k); }, 0);
      const A1 = mask(a1), A2 = mask(a2);
      if ((A1 | A2) !== (1 << cols.length) - 1) throw new Error("R1 ∪ R2 трябва да съдържа всички атрибути на R.");
      const same = (a, b, m) => cols.every((_, j) => !(m >> j & 1) || a[j] === b[j]);
      const proj = (m) => { const o = []; data.forEach((r) => { if (!o.some((x) => same(x, r, m))) o.push(r); }); return o; };
      const P1 = proj(A1), P2 = proj(A2), common = A1 & A2;
      const F = [], out = [];
      let sp = 0;
      const pick = (r, m) => cols.map((_, j) => (m >> j & 1 ? r[j] : null)).filter((x) => x !== null);
      const cn = (m) => cols.filter((_, j) => m >> j & 1);
      const snap = (o) => ({ cols, data, P1: P1.map((r) => pick(r, A1)), P2: P2.map((r) => pick(r, A2)), c1: cn(A1), c2: cn(A2), out: out.map((x) => ({ ...x })), stats: { "редове в R": data.length, "в съединението": out.length, "фалшиви": sp }, ...o });
      F.push(snap({ at: "sp_proj", msg: `R1 = π<sub>${cn(A1).join(",")}</sub>(R), R2 = π<sub>${cn(A2).join(",")}</sub>(R). Общи атрибути: <b>${cn(common).join(",") || "няма"}</b>.` }));
      P1.forEach((r, i) => P2.forEach((s, k) => {
        if (!same(r, s, common)) return;
        const row = cols.map((_, j) => (A1 >> j & 1 ? r[j] : s[j]));
        const real = data.some((d) => same(row, d, A1 | A2));
        F.push(snap({ at: ["sp_match", "sp_emit"], i1: i, i2: k, msg: `R1 ред ${i + 1} и R2 ред ${k + 1} съвпадат по ${cn(common).join(",") || "(няма общи — всяка двойка)"} → (${row.join(", ")}).` }));
        out.push({ row, real });
        if (!real) { sp++; F.push(snap({ at: "sp_fake", i1: i, i2: k, last: true, msg: `(${row.join(", ")}) <b>го няма в R</b> — фалшив кортеж.`, log: `фалшив: (${row.join(", ")})` })); }
        else F.push(snap({ i1: i, i2: k, last: true, at: "sp_emit", msg: `(${row.join(", ")}) е в R.`, log: `истински: (${row.join(", ")})` }));
      }));
      F.push(snap({ done: true, msg: sp ? `Съединението дава ${out.length} реда при ${data.length} в R: <b>${sp} фалшиви</b>. Разлагането губи информация — не знаем кои комбинации са истински.` : `Съединението възстановява точно R (${out.length} реда). За <i>това</i> състояние няма загуба — но гаранция за всички състояния дава само проверка по зависимостите (по-долу).`, inv: { text: sp ? "Загуба: R1 ⋈ R2 ⊋ R" : "R1 ⋈ R2 = R в това състояние", ok: !sp } }));
      return { frames: F, n: out.length, sp };
    },

    chase({ attrs, fds, dec }) {
      const F = FD(), sch = F.parse(attrs, fds);
      const parts = String(dec).split("|").map((s) => s.trim()).filter(Boolean);
      if (parts.length < 2) throw new Error("Разлагането трябва да има поне две подсхеми, разделени с „|“.");

      sch.fds.forEach((d) => { pres += F.preserved(sch, rels, d) ? 1 : 0; });
      frames[frames.length - 1].pres = `${pres}/${sch.fds.length}`;

    function render() {
      const s = steps[k];
      box.innerHTML = "";
      box.append(T6.row(...s.tables.map((t) => T6.table({ name: t.name, cols: t.cols, rows: t.rows }, { pk: t.pk, fk: t.fk || [], colCls: t.colCls || {}, rowCls: t.rowCls || {} }))));
      msg.innerHTML = s.msg;
      prev.disabled = k === 0; next.disabled = k === steps.length - 1;
      pos.textContent = `стъпка ${k + 1}/${steps.length}`;
    }
    render();
  }

  function mount(root) {
    S.viz(root.querySelector("#v-1nf"), {
      id: "1nf", title: "Списък в една клетка → отделна релация", sub: "Учебни данни.", code: false,
      inputs: [{ id: "mode", label: "Сценарий", type: "select", value: "query", options: [["query", "търсене по телефон"], ["split", "само разлагането"]] }],
      legend: [["s-cmp", "трябва да се разглоби"], ["s-done", "намерено"]],
      build: algos.phones,
      draw(st, f) {
        st.innerHTML = "";
        if (f.mode === "flat") { const rc = {}; (f.hl || []).forEach((i) => (rc[i] = "s-cmp")); st.append(T6.table({ name: "Customer", cols: ["CustomerID", "Name", "Phones"], rows: f.rows }, { pk: [0], rowCls: rc })); }
        else { const rp = {}; (f.hlP || []).forEach((i) => (rp[i] = "s-done")); st.append(T6.row(T6.table({ name: "Customer", cols: ["CustomerID", "Name"], rows: f.C }, { pk: [0] }), T6.table({ name: "CustomerPhone", cols: ["CustomerID", "Phone"], rows: f.P }, { pk: [0, 1], fk: [0], rowCls: rp }))); }
      },
    });

    S.viz(root.querySelector("#v-nf"), {
      id: "nf", title: "Коя нормална форма? — анализ стъпка по стъпка", sub: "Ключове → 2НФ (части на ключовете) → 3НФ и BCNF (всяка зависимост).",
      code: "ch07_analyze",
      inputs: [
        { id: "attrs", label: "Схема R", value: PRESETS.enr.attrs, width: "24em" },
        { id: "fds", label: "Зависимости F", value: PRESETS.enr.fds, width: "34em" },
      ],
      presets: Object.values(PRESETS).map((p) => ({ label: p.t, values: { attrs: p.attrs, fds: p.fds } })),
      legend: [["s-piv", "първичен атрибут"], ["s-act", "проверявано"], ["s-swap", "нарушение"], ["s-done", "допустимо"]],
      speed: 1,
      build: algos.analyze,
      draw(st, f) {
        st.innerHTML = "";
        const Fd = FD(), sch = f.sch;
        st.append(h("div", null, h("span", { class: "eyebrow", text: "Атрибути (лилаво — първични)" }), T6.attrs(sch.names, (a, k) => {
          if (f.a === k) return f.bad ? "s-swap" : "s-act";
          if (f.X != null && f.X >> k & 1) return "s-act";
          if (f.dep != null && f.dep >> k & 1) return "s-cmp";
          return f.prime >> k & 1 ? "s-piv" : "";
        })));
        st.append(h("p", { class: "t6-res", style: { margin: "8px 0" }, text: "Ключове: " + f.keys.map((k) => "{" + Fd.str(sch, k) + "}").join("  ") }));
        const tb = h("table", { class: "t" }, h("tr", null, h("th", { text: "зависимост" }), h("th", { text: "детерминантът суперключ ли е?" })));
        sch.fds.forEach((d, i) => tb.append(h("tr", { class: f.fi === i ? (f.bad ? "s-swap" : f.sup ? "s-done" : "s-act") : "" }, h("td", { class: "mono", text: Fd.fdStr(sch, d) }), h("td", { class: "mono", text: Fd.closure(sch, d.lhs) === sch.all ? "да" : "не" }))));
        st.append(h("div", { class: "tbl-wrap" }, tb));
        if (f.viol.length) {
          const vb = h("div", { class: "t6-attrs", style: { marginTop: "10px" } });
          f.viol.forEach((v) => vb.append(h("span", { class: "pill s-swap", text: `${["", "", "2НФ", "3НФ", "BCNF"][v.kind]}: ${Fd.str(sch, v.lhs)} → ${sch.names[v.attr]}` })));
          st.append(vb);
        }
        if (f.level) {
          const L = ["1НФ", "2НФ", "3НФ", "BCNF"];
          st.append(h("div", { class: "t6-attrs", style: { marginTop: "10px" } }, ...L.map((x, i) => h("span", { class: "pill " + (i < f.level ? "s-done" : "s-dim"), text: (i < f.level ? "✓ " : "✗ ") + x }))));
        }
      },
    });

    const ENR = [["1", "Ana", "C1", "Bazi", "6"], ["1", "Ana", "C2", "Algoritmi", "5"], ["2", "Boris", "C1", "Bazi", "4"], ["3", "Vera", "C2", "Algoritmi", "3"]];
    const ec = ["StudentID", "StudentName", "CourseID", "CourseName", "Grade"];
    decompDemo(root.querySelector("#d-2nf"), PRESETS.enr, [
      { tables: [{ name: "Enrollment", cols: ec, rows: ENR, pk: [0, 2] }], msg: "Ключ (StudentID, CourseID). StudentName и CourseName се повтарят." },
      { tables: [{ name: "Enrollment", cols: ec, rows: ENR, pk: [0, 2], colCls: { 0: "s-piv", 1: "s-swap" } }], msg: "<b>StudentID → StudentName</b>: StudentName зависи от собствена част на ключа ⇒ нарушение на 2НФ." },
      { tables: [{ name: "Student", cols: ["StudentID", "StudentName"], rows: [["1", "Ana"], ["2", "Boris"], ["3", "Vera"]], pk: [0], colCls: { 1: "s-done" } }, { name: "Enrollment′", cols: ["StudentID", "CourseID", "CourseName", "Grade"], rows: ENR.map((r) => [r[0], r[2], r[3], r[4]]), pk: [0, 1], fk: [0] }], msg: "Отделяме Student(StudentID, StudentName). Всяко име — веднъж. Общият атрибут StudentID е ключ на Student ⇒ без загуба." },
      { tables: [{ name: "Student", cols: ["StudentID", "StudentName"], rows: [["1", "Ana"], ["2", "Boris"], ["3", "Vera"]], pk: [0] }, { name: "Enrollment′", cols: ["StudentID", "CourseID", "CourseName", "Grade"], rows: ENR.map((r) => [r[0], r[2], r[3], r[4]]), pk: [0, 1], fk: [0], colCls: { 1: "s-piv", 2: "s-swap" } }], msg: "<b>CourseID → CourseName</b>: същото нарушение за другата част на ключа." },
      { tables: [{ name: "Student", cols: ["StudentID", "StudentName"], rows: [["1", "Ana"], ["2", "Boris"], ["3", "Vera"]], pk: [0] }, { name: "Course", cols: ["CourseID", "CourseName"], rows: [["C1", "Bazi"], ["C2", "Algoritmi"]], pk: [0], colCls: { 1: "s-done" } }, { name: "Enrollment", cols: ["StudentID", "CourseID", "Grade"], rows: ENR.map((r) => [r[0], r[2], r[4]]), pk: [0, 1], fk: [0, 1], colCls: { 2: "s-done" } }], msg: "Резултат: Student, Course, Enrollment. <b>Grade остава в Enrollment</b>, защото зависи от цялата двойка — при предпоставката „една оценка на двойка“. Всяка таблица е в BCNF." },
    ]);

    const EMP = [["E1", "D1", "IT"], ["E2", "D1", "IT"], ["E3", "D2", "HR"], ["E4", "D1", "IT"]];
    decompDemo(root.querySelector("#d-3nf"), PRESETS.emp, [
      { tables: [{ name: "Employee", cols: ["EmpID", "DeptID", "DeptName"], rows: EMP, pk: [0] }], msg: "Ключ EmpID (един атрибут ⇒ 2НФ е изпълнена автоматично). DeptName се повтаря за всеки служител на катедрата." },
      { tables: [{ name: "Employee", cols: ["EmpID", "DeptID", "DeptName"], rows: EMP, pk: [0], colCls: { 1: "s-piv", 2: "s-swap" } }], msg: "<b>DeptID → DeptName</b>: DeptID не е суперключ, DeptName не е първичен ⇒ нарушение на 3НФ (транзитивно: EmpID → DeptID → DeptName)." },
      { tables: [{ name: "Department", cols: ["DeptID", "DeptName"], rows: [["D1", "IT"], ["D2", "HR"]], pk: [0], colCls: { 1: "s-done" } }, { name: "Employee", cols: ["EmpID", "DeptID"], rows: EMP.map((r) => [r[0], r[1]]), pk: [0], fk: [1] }], msg: "Department(DeptID, DeptName) и Employee(EmpID, DeptID) с външен ключ. Името на катедрата — веднъж." },
    ]);
  }

  S.chapter({ id: "nf123", order: 7, num: "7", group: "Зависимости и нормализация", title: "1НФ, 2НФ и 3НФ", lead: "Атомарност спрямо модела; частична зависимост от собствена част на ключ; 3НФ по формалното условие. Анализатор и разлагания стъпка по стъпка.", html, mount, algos });
})();

</script>
<script>
/* Раздел 8 — Нормална форма на Бойс и Код (глава 6): BCNF срещу 3НФ, разлагане,
   компромисът със запазването на зависимостите, денормализация. */
(function () {
  const S = window.Study, h = S.h;
  const FD = () => window.T6FD;

  const PRESETS = {
    sct: { attrs: "Student Course Teacher", fds: "Student,Course->Teacher; Teacher->Course", t: "Student–Course–Teacher" },
    enr: { attrs: "StudentID StudentName CourseID CourseName Grade", fds: "StudentID->StudentName; CourseID->CourseName; StudentID,CourseID->Grade", t: "Enrollment" },
    emp: { attrs: "EmpID DeptID DeptName", fds: "EmpID->DeptID; DeptID->DeptName", t: "Employee" },
    big: { attrs: "A B C D E F", fds: "A,B->C; C->D; D->A; E->F; B,D->E", t: "Шест атрибута" },
  };

  const algos = {
    bcnf({ attrs, fds }) {
      const F = FD(), sch = F.parse(attrs, fds);
      if (sch.n > 8) throw new Error("Най-много 8 атрибута.");
      const frames = [];
      const rels = F.bcnf(sch, {}, frames);
      let pres = 0;
      const pr = sch.fds.map((d) => { const ok = F.preserved(sch, rels, d); pres += ok; return ok; });
      const ll = F.chase(sch, rels).row > 0;
      frames.forEach((f) => { f.sch = sch; f.stats = { подсхеми: f.rels.length }; });
      const last = frames[frames.length - 1];
      last.pr = pr; last.ll = ll;
      last.inv = { text: `без загуба: ${ll ? "да" : "не"}; запазени ФЗ: ${pres}/${sch.fds.length}`, ok: pres === sch.fds.length };
      return { frames, result: rels.map((r) => "{" + F.str(sch, r) + "}").join(" "), preserved: `${pres}/${sch.fds.length}`, lossless: ll ? 1 : 0 };
    },

    preserve({ attrs, fds, dec, fd }) {
      const F = FD(), sch = F.parse(attrs, fds);
      const rels = String(dec).split("|").map((s) => s.trim()).filter(Boolean).map((p) => sch.set(p));
      if (rels.length < 1) throw new Error("Въведи поне една подсхема.");
      const k = S.int(fd, 1, sch.fds.length, "Номерът на зависимостта");
      const d = sch.fds[k - 1];
      const frames = [];
      const ok = F.preserved(sch, rels, d, {}, frames);
      frames.forEach((f) => { f.sch = sch; f.rels = rels; f.d = d; f.vars = { Z: "{" + F.str(sch, f.Z) + "}" }; });
      return { frames, ok: ok ? 1 : 0 };
    },

    /** Нарушение на неналожено правило в BCNF разлагането (данни). */
    violate({ teacher }) {
      const T = [["Ivanov", "Bazi"], ["Petrov", "Bazi"], ["Georgiev", "Algo"]];
      const A = [["Ana", "Ivanov"], ["Boris", "Petrov"], ["Ana", "Georgiev"]];
      if (!T.some((t) => t[0] === teacher)) throw new Error("Избери преподавател от Teaching.");
      const F = [];
      F.push({ T, A, msg: "Teaching(Teacher, Course) и Assignment(Student, Teacher). Teacher е ключ на Teaching." });
      const A2 = A.concat([["Ana", teacher]]);
      const dup = A.some((r) => r[0] === "Ana" && r[1] === teacher);
      F.push({ T, A: A2, hlA: [A2.length - 1], msg: dup ? `(Ana, ${teacher}) вече съществува — Assignment ще откаже повторение по своя ключ.` : `Вмъкваме (Ana, ${teacher}) в Assignment. Локално: ключът (Student, Teacher) е уникален — <b>приема се</b>.` });
      const course = T.find((t) => t[0] === teacher)[1];
      const conflict = A.filter((r) => r[0] === "Ana" && T.find((t) => t[0] === r[1])[1] === course && r[1] !== teacher);
      const J = A2.map((r) => [r[0], T.find((t) => t[0] === r[1])[1], r[1]]);
      const rc = {};
      J.forEach((r, i) => { if (r[0] === "Ana" && r[1] === course) rc[i] = conflict.length ? "s-swap" : "s-done"; });
      F.push({ T, A: A2, J, rc, done: true, msg: conflict.length ? `Съединението показва: Ana изучава ${course} при <b>двама</b> преподаватели. Правилото (Student, Course) → Teacher е нарушено, но нито една от двете таблици не го забелязва — нужна е проверка върху съединението (тригер, приложна логика).` : `Ana изучава ${course} само при ${teacher} — правилото е спазено. Пробвай преподавател от курс, който Ana вече изучава.`, inv: conflict.length ? { text: "(Student, Course) → Teacher е нарушена", ok: false } : { text: "Няма нарушение", ok: true } });
      return { frames: F, conflict: conflict.length };
    },
  };

  const html = `
<div class="prose">
  <p><dfn data-g="bcnf">BCNF</dfn> (Boyce–Codd Normal Form) изисква всеки <dfn data-g="детерминант">детерминант</dfn> на нетривиална функционална зависимост да е <dfn data-g="суперключ">суперключ</dfn>. Тя е по-строга от <dfn data-g="3нф">3НФ</dfn>, защото не допуска изключението за <dfn data-g="първичен атрибут">първичен атрибут</dfn> отдясно. Всяка релация в BCNF е в 3НФ, но обратното не е общовалидно.</p>
</div>

<div class="block">
  <h3>Схема 13 · Защо 3НФ не е тъждествена на BCNF</h3>
  <p class="prose">Нека R(Student, Course, Teacher) има зависимости (Student, Course)→Teacher и Teacher→Course: всеки преподавател води точно един курс, а за студент и курс има един преподавател. Кандидатни ключове са (Student, Course) и (Student, Teacher). Teacher не е суперключ, но Course е първичен атрибут, затова втората зависимост е допустима в 3НФ и нарушава BCNF.</p>
  <div class="tbl-wrap"><table class="t" id="b-cmp"></table></div>
  <p class="muted">Пусни анализатора от <a href="#nf123">раздел 7</a> с „Student–Course–Teacher (3НФ, не BCNF)“, за да видиш стъпките.</p>
</div>

<div class="block">
  <h3>BCNF разлагане</h3>
  <p class="prose">Стандартният алгоритъм: докато има подсхема Rᵢ с детерминант X, който не е неин суперключ, заместваме Rᵢ с X ∪ (X⁺ ∩ Rᵢ) и Rᵢ − (X⁺ − X). Общата част X е суперключ на първата половина (X определя X⁺ ∩ Rᵢ) — затова всяко разделяне е <dfn data-g="беззагубно разлагане">без загуба</dfn>. <span class="extra-tag">извън конспекта</span> (ръководството дава резултата за примера; общият алгоритъм е стандартен.)</p>
  <div id="v-bcnf"></div>
  <details class="hint"><summary>Защо всяко BCNF разделяне е без загуба, но може да загуби зависимост</summary><div>
    <p>Двете части имат общо X и X → (X⁺ ∩ Rᵢ) — тоест сечението определя едната част. Това е точно условието за беззагубно разлагане на две части. Но зависимост, чиито атрибути попадат в различни части, вече няма таблица, в която да се провери директно; тя е запазена само ако следва от локалните зависимости на частите (напр. при A→B, B→C и разлагане AB, BC зависимостта A→C е запазена). Ако не следва — тя се губи.</p>
  </div></details>
</div>

<div class="block">
  <h3>Компромисът: беззагубност срещу запазване на зависимостите</h3>
  <p class="prose">Разлагането на Teaching(Teacher, Course) и Assignment(Student, Teacher) е без загуба по Teacher→Course, но зависимостта (Student, Course)→Teacher не може да се наложи само чрез отделни локални функционални зависимости в двете таблици. <dfn data-g="запазване на зависимостите">Запазване на зависимостите</dfn> и липса на загуба са отделни свойства. По-високата форма не е автоматично безплатна във всяко отношение.</p>
  <div id="v-pres"></div>
  <div id="v-viol"></div>
  <details class="trap"><summary>Капан: „BCNF винаги е по-добре от 3НФ“</summary><div><p>Тук BCNF премахва повторението „преподавател → курс“, но правилото „един преподавател за студент и курс“ остава без локална проверка. Изборът между 3НФ (запазва зависимостта) и BCNF (премахва още излишък) зависи от това кое е по-важно за предметната област.</p></div></details>
</div>

<div class="block">
  <h3>Нормализацията не е механично раздробяване</h3>
  <p class="prose">Нормализацията не означава механично създаване на възможно най-много таблици. Тя се извършва спрямо реалните правила. <dfn data-g="денормализация">Денормализацията</dfn> е съзнателно дублиране за конкретна нужда и изисква механизъм за съгласуваност. Не трябва да се използва като обяснение за случайно лоша схема.</p>
  <div class="split">
    <div class="key"><b>Нормализация</b><p>Отстранява излишъци и аномалии спрямо зависимостите. Не прави всяка заявка по-бърза.</p></div>
    <div class="key"><b>Денормализация</b><p>Съзнателно, документирано дублиране + правило за съгласуваност (кой и кога обновява копието).</p></div>
  </div>
  <p class="prose muted">По-високите нормални форми разглеждат <dfn data-g="многозначна зависимост">многозначни зависимости</dfn> (4НФ) и <dfn data-g="зависимост на съединение">зависимости на съединение</dfn> (5НФ) — <a href="#nf45">раздел 8а</a>; целият път от сурови данни до 5НФ е в <a href="#patnf">раздел 8б</a>. <span class="extra-tag">извън конспекта</span></p>
</div>`;

  function mount(root) {
    const t = root.querySelector("#b-cmp");
    t.append(h("tr", null, ...["Зависимост", "Детерминантът суперключ ли е?", "Дясната страна първична ли е?", "3НФ", "BCNF"].map((x) => h("th", { text: x }))));
    t.append(h("tr", null, h("td", { class: "mono", text: "Student,Course → Teacher" }), h("td", { text: "да" }), h("td", { text: "да" }), h("td", null, h("span", { class: "pill s-done", text: "допустима" })), h("td", null, h("span", { class: "pill s-done", text: "допустима" }))));
    t.append(h("tr", null, h("td", { class: "mono", text: "Teacher → Course" }), h("td", { text: "не" }), h("td", { text: "да (Course е в ключа Student,Course)" }), h("td", null, h("span", { class: "pill s-done", text: "допустима" })), h("td", null, h("span", { class: "pill s-swap", text: "нарушение" }))));

    S.viz(root.querySelector("#v-bcnf"), {
      id: "bcnf", title: "BCNF разлагане стъпка по стъпка", sub: "Накрая: без загуба ли е и кои зависимости са запазени.",
      code: "ch08_bcnf",
      inputs: [{ id: "attrs", label: "Схема R", value: PRESETS.sct.attrs, width: "24em" }, { id: "fds", label: "Зависимости F", value: PRESETS.sct.fds, width: "34em" }],
      presets: Object.values(PRESETS).map((p) => ({ label: p.t, values: { attrs: p.attrs, fds: p.fds } })),
      legend: [["s-act", "проверявана"], ["s-swap", "нарушение"], ["s-done", "в BCNF"], ["s-piv", "детерминант X"]],
      build: algos.bcnf,
      draw(st, f) {
        st.innerHTML = "";
        const Fd = FD(), sch = f.sch;
        const wrap = h("div", { style: { display: "grid", gap: "8px" } });
        f.rels.forEach((R, i) => {
          const isCur = f.ri === i;
          const cls = (a, k) => (isCur && f.X != null && f.X >> k & 1 ? "s-piv" : isCur && f.c != null && f.c >> k & 1 ? "s-cmp" : "");
          const names = sch.names.filter((n, k) => R >> k & 1);
          const idx = sch.names.map((n, k) => k).filter((k) => R >> k & 1);
          wrap.append(h("div", { class: "row", style: { alignItems: "center" } },
            h("span", { class: "pill " + (isCur ? (f.X != null && f.at !== "b_split" ? "s-swap" : f.okRel === i ? "s-done" : "s-act") : f.done ? "s-done" : ""), text: "R" + (i + 1) }),
            T6.attrs(names, (a, j) => cls(a, idx[j]))));

    const seen = new Set(), rows = [];
    rel.rows.forEach((r) => { const t = idx.map((i) => r[i]); const k = key(t); if (!seen.has(k)) { seen.add(k); rows.push(t); } });

  function mvdMissing(rel, X, Y) {

    const orig = new Set(rel.rows.map(key));

    return { joined: j, spurious, holds: spurious.length === 0 };
  }

<script>
/* Раздел 9 — Транзакции, индекси и възстановяване (глава 7). */
(function () {
  const S = window.Study, h = S.h;

  const algos = {
    transfer({ a, b, amount, crash }) {
      a = S.int(a, 0, 1e6, "Баланс A"); b = S.int(b, 0, 1e6, "Баланс B");
      amount = S.int(amount, 1, 1e6, "Сумата");
      crash = +crash;
      const bal = [a, b], log = [], F = [];
      let undone = 0;
      const snap = (o) => ({ bal: bal.slice(), log: log.map((x) => ({ ...x })), sum: bal[0] + bal[1], ...o });
      F.push(snap({ at: "t_begin", msg: `BEGIN. Инвариант на бизнес правилото: A + B = ${a + b}.` }));
      F.push(snap({ at: "t_check", msg: `Ограничение: A ≥ сумата? ${bal[0]} ≥ ${amount} → ${bal[0] >= amount}.` }));
      const rollback = (why) => {
        F.push(snap({ at: "t_undo", msg: `${why} <b>ROLLBACK</b>: възстановяваме старите стойности от журнала в обратен ред.` }));

      };
      if (bal[0] < amount) { rollback("Недостатъчен баланс."); return { frames: F, ok: 0, bal, undone }; }
      log.push({ acc: 0, old: bal[0] });
      F.push(snap({ at: "t_log1", msg: `Журнал: старото A = ${bal[0]}.`, log: `log A = ${bal[0]}` }));
      bal[0] -= amount;
      F.push(snap({ at: "t_w1", hl: 0, msg: `A := A − ${amount} = ${bal[0]}. Междинно състояние: A + B = ${bal[0] + bal[1]} — <b>правилото е временно нарушено</b>.`, inv: { text: `A + B = ${bal[0] + bal[1]} ≠ ${a + b}`, ok: false } }));
      if (crash === 1) { F.push(snap({ at: "t_crash1", crash: true, msg: "<b>Срив</b> след първия запис." })); rollback("Ако първото действие остане само, се нарушава бизнес правилото."); return { frames: F, ok: 0, bal, undone }; }
      log.push({ acc: 1, old: bal[1] });
      F.push(snap({ at: "t_log2", msg: `Журнал: старото B = ${bal[1]}.`, log: `log B = ${bal[1]}` }));
      bal[1] += amount;
      F.push(snap({ at: "t_w2", hl: 1, msg: `B := B + ${amount} = ${bal[1]}.` }));
      if (crash === 2) { F.push(snap({ at: "t_crash2", crash: true, msg: "<b>Срив</b> преди COMMIT — двата записа са направени, но не са потвърдени." })); rollback("Непотвърдената транзакция се отменя изцяло."); return { frames: F, ok: 0, bal, undone }; }
      F.push(snap({ at: "t_commit", done: true, msg: "<b>COMMIT</b>. Изменението е потвърдено; устойчивостта се отнася до потвърдените изменения при зададения модел за откази.", inv: { text: `A + B = ${bal[0] + bal[1]}`, ok: bal[0] + bal[1] === a + b } }));
      return { frames: F, ok: 1, bal, undone };
    },

    schedule({ sched, x0, d1, d2, mode }) {
      x0 = S.int(x0, 0, 1e6, "Началният баланс");
      const d = [0, S.int(d1, 0, 1e6, "d1"), S.int(d2, 0, 1e6, "d2")];
      mode = +mode;
      const ops = String(sched).trim().split(/\s+/).filter(Boolean);
      if (!ops.length) throw new Error("Празно разписание.");
      ops.forEach((o) => { if (!/^[RWC][12]$/.test(o)) throw new Error(`„${o}“: операциите са R1 W1 C1 R2 W2 C2.`); });
      for (const t of [1, 2]) {
        const seq = ops.filter((o) => +o[1] === t).map((o) => o[0]).join("");
        if (seq !== "RWC") throw new Error(`T${t} трябва да има точно R${t}, W${t}, C${t} в този ред (сега: ${seq || "нищо"}).`);
      }
      let x = x0, lock = 0, waits = 0;
      const local = [0, 0, 0], done = ops.map(() => false), F = [], exec = [];
      const snap = (o) => ({ ops, done: done.slice(), x, local: local.slice(), lock, exec: exec.slice(), stats: { чакания: waits }, vars: { x, "T1.local": mode === 1 ? "—" : local[1], "T2.local": mode === 1 ? "—" : local[2], lock: lock ? "T" + lock : "свободно" }, ...o });
      const names = ["read–modify–write", "атомарна UPDATE x = x − d", "изключително заключване до COMMIT"];
      F.push(snap({ at: "s_next", msg: `x = ${x0}. T1 намалява с ${d[1]}, T2 — с ${d[2]}. Очакван резултат при последователно изпълнение: <b>${x0 - d[1] - d[2]}</b>. Режим: ${names[mode]}.` }));
      let left = ops.length;
      while (left > 0) {
        let progressed = false;
        for (let k = 0; k < ops.length; k++) {
          if (done[k]) continue;
          const t = +ops[k][1], kind = ops[k][0];
          if (ops.some((o, j) => j < k && !done[j] && +o[1] === t)) continue;
          if (mode === 2 && kind === "R" && lock && lock !== t) {
            waits++;
            F.push(snap({ at: "s_wait", cur: k, wait: true, msg: `${ops[k]}: x е заключено от T${lock} — T${t} <b>чака</b>.`, log: `${ops[k]} чака` }));
            continue;
          }
          let msg;
          if (kind === "R") {
            if (mode === 2) lock = t;
            if (mode !== 1) { local[t] = x; msg = `T${t} чете x = ${x}${mode === 2 ? " и заключва x" : ""}.`; }
            else msg = `T${t}: при атомарната команда отделното четене няма ефект — четенето и записът са една стъпка.`;
            F.push(snap({ at: mode === 2 ? ["s_lock", "s_read"] : mode === 1 ? "s_next" : "s_read", cur: k, msg, log: `${ops[k]}: ${mode === 1 ? "—" : "x = " + x}` }));
          } else if (kind === "W") {
            if (mode === 1) { x = x - d[t]; msg = `T${t}: UPDATE x = x − ${d[t]} → x = <b>${x}</b> (прочита текущото x в момента на записа).`; }
            else { const old = x; x = local[t] - d[t]; msg = `T${t} записва x = local − ${d[t]} = ${local[t]} − ${d[t]} = <b>${x}</b>.${local[t] !== old ? ` <b>Внимание:</b> T${t} е прочела ${local[t]}, а x вече беше ${old} — промяната на другата транзакция се губи.` : ""}`; }
            F.push(snap({ at: mode === 1 ? "s_atomic" : "s_write", cur: k, msg, log: `${ops[k]}: x = ${x}` }));
          } else {
            if (lock === t) lock = 0;
            F.push(snap({ at: "s_commit", cur: k, msg: `T${t} COMMIT${mode === 2 ? " — освобождава заключването" : ""}.`, log: `${ops[k]}` }));
          }
          exec.push(ops[k]);
          done[k] = true; left--; progressed = true;
          break;
        }
        if (!progressed) break;
      }
      const ok = x === x0 - d[1] - d[2];
      F.push(snap({ at: "s_end", done: true, msg: ok ? `Краен x = ${x} — съответства на последователно изпълнение.` : `Краен x = ${x}, а трябва ${x0 - d[1] - d[2]}: <b>загубено обновяване</b>. Транзакционната граница сама по себе си не го предотврати.`, inv: { text: `x = ${x}; изпълнен ред: ${exec.join(" ")}`, ok } }));
      return { frames: F, x, waits };
    },

    index({ keys, probe, mode }) {
      const K = S.parseNums(keys, { minLen: 1, maxLen: 24, min: -999, max: 999 });
      if (new Set(K).size !== K.length) throw new Error("Ключовете трябва да са различни (UNIQUE).");
      const p = S.int(probe, -999, 999, "Търсеният ключ");
      const F = [];
      if (mode === "insert") {
        const idx = [];
        let total = 0;
        K.forEach((k) => {
          let i = idx.length, mv = 0;
          while (i > 0 && idx[i - 1] > k) { i--; mv++; }
          idx.splice(i, 0, k); total += mv;
          F.push({ at: mv ? ["ix_shift", "ix_put"] : "ix_put", table: K, idx: idx.slice(), put: i, msg: `Вмъкваме ${k} в таблицата и в индекса: ${mv} отместени елемента в индекса.`, stats: { "отмествания общо": total }, log: `+${k}: ${mv} отм.` });
        });
        F.push({ at: "ix_put", table: K, idx, done: true, msg: `Изградихме индекса за ${K.length} реда с <b>${total}</b> отмествания. Това е цената за поддръжка: всяко INSERT/UPDATE/DELETE на ключ променя и индекса. (Реалните СУБД използват B-дървета, но цената при изменение остава.)`, stats: { "отмествания общо": total } });
        return { frames: F, moves: total };
      }
      const idx = K.slice().sort((a, b) => a - b);
      if (mode === "scan") {
        let c = 0, r = -1;
        for (let i = 0; i < K.length; i++) {
          c++;
          const hit = K[i] === p;
          F.push({ at: hit ? ["ix_scan", "ix_hit"] : "ix_scan", table: K, cur: i, hit, msg: `Ред ${i}: ${K[i]} ${hit ? "=" : "≠"} ${p}.`, stats: { сравнения: c } });
          if (hit) { r = i; break; }
        }
        F.push({ table: K, cur: r, hit: r >= 0, done: true, msg: `Последователно четене: ${c} сравнения${r < 0 ? " — при липсващ ключ винаги всички n" : ""}.`, stats: { сравнения: c } });
        return { frames: F, result: r, cmp: c };
      }
      let lo = 0, hi = idx.length - 1, c = 0, r = -1;
      while (lo <= hi) {
        const mid = lo + ((hi - lo) >> 1);
        c++;
        const hit = idx[mid] === p;
        F.push({ at: hit ? ["ix_bs", "ix_found"] : "ix_bs", idx, lo, hi, mid, hit, msg: `Индекс[${mid}] = ${idx[mid]} ${hit ? "=" : idx[mid] < p ? "<" : ">"} ${p}.`, stats: { сравнения: c } });
        if (hit) { r = mid; break; }
        if (idx[mid] < p) lo = mid + 1; else hi = mid - 1;
      }
      F.push({ idx, mid: r, hit: r >= 0, done: true, msg: `Индекс: ${c} сравнения (≈ log₂ ${idx.length} = ${Math.log2(idx.length).toFixed(1)}). Оптимизаторът може все пак да избере последователно четене, ако очаква по-евтино (напр. малка таблица или голяма част от редовете).`, stats: { сравнения: c } });
      return { frames: F, found: r >= 0 ? 1 : 0, cmp: c };
    },
  };

    /** Векторно търсене: точно (всички разстояния) — учебен двумерен пример от ръководството. */

      const parseV = (s, nm) => { const v = String(s).split(/[\s,;]+/).filter(Boolean).map(Number); if (v.length !== 2 || v.some((x) => !Number.isFinite(x))) throw new Error(`${nm}: две числа, напр. „1 0“.`); return v; };

      const P = String(pts).split("|").map((s) => s.trim()).filter(Boolean).map((s) => {
        const m = /^(\w+)\s*[:=]\s*(.+)$/.exec(s);
        if (!m) throw new Error(`„${s}“: точка във вида „A: 0.9 0.1“.`);

      });
      if (!P.length) throw new Error("Нужна е поне една точка.");

    },
  };

<script>
/* Раздел 2 — процеси и нишки: състояния, PCB, превключване на контекст. */
(function () {
  const S = window.Study, h = S.h;
  const SN = ["готов", "изпълнява се", "блокиран", "завършил"];
  const SC = ["s-cmp", "s-act", "s-swap", "s-done"];
  const READY = 0, RUNNING = 1, BLOCKED = 2, DONE = 3;

  function parseScript(str, n) {
    const toks = String(str).trim().split(/\s+/).filter(Boolean);
    if (toks.length > 40) throw new Error("Най-много 40 събития.");
    return toks.map((t) => {
      if (/^[twx]$/.test(t)) return { ev: t, target: -1 };
      const m = /^d([1-9])$/.exec(t);
      if (m) return { ev: "d", target: +m[1] - 1 };
      throw new Error(`„${t}“ не е събитие. Допустими: t, w, x, d1…d${n}.`);
    });
  }

  const algos = {
    /* Огледало на on_event()/dispatch() от c/02_procesi.c */
    proc({ n, script }) {
      n = S.int(n, 1, 6, "Броят процеси");
      const evs = parseScript(script, n);
      const p = Array.from({ length: n }, (_, i) => ({ pid: i + 1, state: READY, pc: 0 }));
      let rq = [], running = -1, last = -1, kernel = 0, ctx = 0, clock = 0, bad = 0;
      const F = [];
      const snap = (o) => ({ n, p: p.map((x) => ({ ...x })), rq: rq.slice(), running, stats: { "влизания в ядрото": kernel, "превключвания на контекст": ctx }, ...o });
      const dispatch = (fr) => {
        if (running >= 0 || rq.length === 0) {
          if (running < 0) last = -1;
          F.push(snap({ at: "disp", vars: { running: running >= 0 ? "P" + (running + 1) : "—", "опашка": rq.map((i) => "P" + (i + 1)) }, msg: running >= 0 ? `Процесорът е зает от P${running + 1} — няма избор на нов процес, <b>няма превключване на контекст</b>.` : "Опашката на готовите е празна — процесорът остава свободен.", ...fr }));
          return;
        }
        const i = rq.shift();
        p[i].state = RUNNING; running = i;
        const sw = i !== last;
        if (sw) ctx++;
        last = i;
        F.push(snap({ at: sw ? ["run", "ctx"] : "run", hiTr: "dispatch", hiP: i, vars: { running: "P" + (i + 1) }, msg: sw ? `Планировчикът избира P${i + 1} (първия в опашката). Възстановява се неговият <dfn data-g="контекст">контекст</dfn> — превключване №${ctx}.` : `Планировчикът избира отново P${i + 1} — той е единственият готов и контекстът му вече е на процесора: <b>няма превключване на контекст</b>.`, log: `→ P${i + 1} се изпълнява`, ...fr }));

      for (const e of evs) {

        const r = running;
        if (r >= 0) p[r].pc = clock;

        if (e.ev === "t") {

            p[r].state = READY; rq.push(r); running = -1;
            F.push(snap({ at: "tmo", hiTr: "timeout", hiP: r, msg: `Изтича квантът на P${r + 1}: <dfn data-g="изпреварване">изпреварване</dfn>. P${r + 1} става <b>готов</b> и отива в края на опашката.`, log: `P${r + 1}: изпълнява се → готов` }));

        } else if (e.ev === "w") {
          if (r < 0) ok = false;
          else {
            p[r].state = BLOCKED; running = -1;
            F.push(snap({ at: "wait", hiTr: "block", hiP: r, msg: `P${r + 1} заявява вход/изход и чака събитие: става <b>блокиран</b>. Блокираният не е в опашката на готовите.`, log: `P${r + 1}: изпълнява се → блокиран` }));
          }
        } else if (e.ev === "d") {
          const k = e.target;
          if (k < 0 || k >= n || p[k].state !== BLOCKED) ok = false;
          else {
            p[k].state = READY; rq.push(k);
            F.push(snap({ at: ["wake", "io"], hiTr: "wake", hiP: k, msg: `Прекъсване: операцията на P${k + 1} завърши. P${k + 1} става <b>готов</b> — не веднага изпълняващ се.${r >= 0 ? ` P${r + 1} продължава да държи процесора.` : ""}`, log: `P${k + 1}: блокиран → готов` }));
          }
        } else if (e.ev === "x") {
          if (r < 0) ok = false;
          else {
            p[r].state = DONE; running = -1;

          }
        }

          bad++;

          continue;
        }
        dispatch({});
        clock++;
        F.push(snap({ at: "ret", vars: { running: running >= 0 ? "P" + (running + 1) : "—" }, msg: `Връщане в потребителски режим${running >= 0 ? ` — изпълнява се P${running + 1}` : ""}.` }));

      return { frames: F, kernel, ctx, bad, states: st, running: running >= 0 ? running + 1 : 0 };
    },
  };

  const TR = [
    { k: "admit", a: "new", b: "ready", lab: [160, 128, "middle"], t: "приемане", d: "Създаденият процес получава PCB и влиза в опашката на готовите." },

    { k: "timeout", a: "run", b: "ready", lab: [365, 196, "middle"], t: "изтекъл квант", d: "Изпреварване: ОС отнема процесора. Процесът остава годен за работа — става ГОТОВ, не блокиран.", curve: -45 },
    { k: "block", a: "run", b: "blk", lab: [440, 236, "start"], t: "чака събитие", d: "Например вход/изход. Блокираният НЕ чака процесор — чака събитие; допълнителни ядра не му помагат." },
    { k: "wake", a: "blk", b: "ready", lab: [290, 236, "end"], t: "събитието настъпи", d: "Блокираният става ГОТОВ, а не непременно веднага изпълняващ се. Обикновено това става в обработчик на прекъсване." },

  function stateSvg(onPick, hiTr, hiState) {
    const W = 720, H = 320;
    const svg = S.svg("svg", { class: "g", viewBox: `0 0 ${W} ${H}`, width: W, role: "img", "aria-label": "Диаграма на състоянията на процеса" });
    svg.append(S.svg("defs", null, S.svg("marker", { id: "arr2", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" }, S.svg("path", { d: "M0,0 L10,5 L0,10 z", fill: "var(--muted)" }))));
    TR.forEach((T) => {
      const [x1, y1] = NODES[T.a], [x2, y2] = NODES[T.b];
      const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
      const sx = x1 + ux * 48, sy = y1 + uy * 26, ex = x2 - ux * 50, ey = y2 - uy * 28;
      const c = T.curve || 0, mx = (sx + ex) / 2 - uy * c, my = (sy + ey) / 2 + ux * c;

      g.append(S.svg("text", { x: lx, y: ly, "text-anchor": anc, class: on ? "" : "wt", style: on ? "font-size:12px;font-weight:700" : "font-size:11.5px", text: T.t }));
      svg.append(g);
    });
    const map = { ready: READY, run: RUNNING, blk: BLOCKED, done: DONE };
    for (const k in NODES) {
      const [x, y, t] = NODES[k];
      const cls = hiState && hiState[k] ? hiState[k] : (k in map ? SC[map[k]] : "");
      const g = S.svg("g", { class: "node " + cls });

      svg.append(g);
    }

  }

  const algos = {
    /* Огледало на step()/race() от c/04_sinhronizacia.c */
    race({ k, mutex, sched }) {
      k = S.int(k, 1, 5, "Увеличенията на нишка");
      const useM = mutex === true || mutex === "true";
      const sc = parseSched(sched, "AB", 60);
      const s = { counter: 0, owner: -1, blocked: 0 };
      const t = [{ pc: 0, r: 0, left: k }, { pc: 0, r: 0, left: k }];
      const F = [];
      const nm = ["A", "B"];
      const snap = (o) => ({ s: { ...s }, t: t.map((x) => ({ ...x })), useM, k, stats: { counter: s.counter, "очаквано": 2 * k, "блокирани опити": s.blocked }, ...o });
      F.push(snap({ vars: { counter: 0 }, msg: `Две нишки, по ${k} увеличения. ${useM ? "Критичният участък е защитен с <dfn data-g=\"мютекс\">мютекс</dfn>." : "<b>Без защита</b> — counter++ е три отделни микростъпки: load, add, store."}` }));
      const step = (id, phase) => {
        const T = t[id], who = nm[id];
        if (T.pc === 0) {
          if (!useM) { T.pc = 1; return step(id, phase); }
          if (s.owner >= 0) { s.blocked++; F.push(snap({ at: "blocked", who: id, vars: { [`${who}.pc`]: "lock", owner: nm[s.owner] }, msg: `${who}: <code>lock</code> — мютексът е зает от ${nm[s.owner]}. ${who} е <b>блокирана</b> и ще опита пак.`, log: `${who}: lock → чака` })); return; }
          s.owner = id; T.pc = 1;
          F.push(snap({ at: "lock", who: id, vars: { owner: who }, msg: `${who}: <code>lock</code> — мютексът е свободен; ${who} го притежава и влиза в <dfn data-g="критичен участък">критичния участък</dfn>.`, log: `${who}: lock` }));
          return;
        }
        if (T.pc === 1) { T.r = s.counter; T.pc = 2; F.push(snap({ at: "load", who: id, vars: { counter: s.counter, [`${who}.r`]: T.r }, msg: `${who}: <code>r = counter</code> → r = ${T.r}.`, log: `${who}: load ${T.r}` })); return; }
        if (T.pc === 2) { T.r++; T.pc = 3; F.push(snap({ at: "add", who: id, vars: { counter: s.counter, [`${who}.r`]: T.r }, msg: `${who}: <code>r = r + 1</code> → r = ${T.r} (само в регистъра на ${who}).` })); return; }
        if (T.pc === 3) {
          const lost = s.counter >= T.r;
          s.counter = T.r; T.pc = useM ? 4 : 0;
          if (!useM) T.left--;
          F.push(snap({ at: "store", who: id, lost, vars: { counter: s.counter, [`${who}.r`]: T.r }, msg: `${who}: <code>counter = r</code> → counter = ${s.counter}.${lost ? ` <b class="warn">Изгубено увеличение:</b> ${who} записва стойност, пресметната от стара прочетена стойност.` : ""}`, log: `${who}: store ${s.counter}${lost ? " ✗" : ""}` }));
          return;
        }
        if (T.pc === 4) { s.owner = -1; T.pc = 0; T.left--; F.push(snap({ at: "unlock", who: id, vars: { owner: "—" }, msg: `${who}: <code>unlock</code> — мютексът е свободен.`, log: `${who}: unlock` })); }
      };
      for (const c of sc) {
        const id = c === "A" ? 0 : 1;
        if (t[id].left === 0) continue;
        step(id, "sched");
      }
      if (t[0].left > 0 || t[1].left > 0) F.push(snap({ vars: {}, msg: "Разписанието свърши; нишките се довършват, като се редуват." }));
      for (let g = 0; (t[0].left > 0 || t[1].left > 0) && g < 10000; g++)
        for (let id = 0; id < 2; id++) if (t[id].left > 0) step(id, "tail");
      const ok = s.counter === 2 * k;
      F.push(snap({ done: true, vars: { counter: s.counter }, inv: { text: `counter = ${s.counter}, очаквано ${2 * k}`, ok }, msg: ok ? `Крайна стойност <b>${s.counter}</b> — няма загуби.` : `Крайна стойност <b>${s.counter}</b> вместо ${2 * k}: загубени са ${2 * k - s.counter} увеличения.` }));
      return { frames: F, result: s.counter, blocked: s.blocked };
    },

    /* Огледало на producer_step()/consumer_step() */
    pc({ cap, sched }) {
      cap = S.int(cap, 1, 8, "Капацитетът на буфера");
      const sc = parseSched(sched, "PC", 80);
      const q = { buf: Array(cap).fill(null), cap, in: 0, out: 0, count: 0, empty: cap, full: 0, mutex: 1, ppc: 0, cpc: 0, next: 0, produced: 0, consumed: 0, sum: 0, pb: 0, cb: 0, item: null, citem: null };
      const F = [];
      const snap = (o) => ({ q: { ...q, buf: q.buf.slice() }, stats: { произведени: q.produced, консумирани: q.consumed, "блокирани опити P": q.pb, "блокирани опити C": q.cb }, ...o });
      const sv = () => ({ empty: q.empty, full: q.full, mutex: q.mutex, count: q.count });
      F.push(snap({ vars: sv(), msg: `Ограничен буфер с капацитет ${cap}. Семафори: <code>empty = ${cap}</code> (свободни места), <code>full = 0</code> (пълни места), <code>mutex = 1</code> (взаимно изключване).` }));
      const wait = (name) => { if (q[name] === 0) return false; q[name]--; return true; };
      for (const c of sc) {
        if (c === "P") {
          switch (q.ppc) {
            case 0: q.item = ++q.next; q.ppc = 1; F.push(snap({ at: "pmake", who: "P", vars: { ...sv(), item: q.item }, msg: `P произвежда елемент <b>${q.item}</b> (извън критичния участък).` })); break;
            case 1: if (wait("empty")) { q.ppc = 2; F.push(snap({ at: "pempty", who: "P", vars: sv(), msg: `P: <code>wait(empty)</code> — има свободно място; empty = ${q.empty}.` })); } else { q.pb++; F.push(snap({ at: "pempty", who: "P", blockedP: true, vars: sv(), msg: `P: <code>wait(empty)</code> — empty = 0, <b>буферът е пълен</b>. P е блокиран.`, log: "P блокиран: пълен буфер" })); } break;
            case 2: if (wait("mutex")) { q.ppc = 3; F.push(snap({ at: "plock", who: "P", vars: sv(), msg: "P: <code>wait(mutex)</code> — влиза в критичния участък." })); } else { q.pb++; F.push(snap({ at: "plock", who: "P", blockedP: true, vars: sv(), msg: "P: <code>wait(mutex)</code> — C е в критичния участък. P чака.", log: "P чака mutex" })); } break;
            case 3: q.buf[q.in] = q.item; F.push(snap({ at: "pput", who: "P", slot: q.in, vars: sv(), msg: `P: <code>buf[${q.in}] = ${q.item}</code>.`, log: `P: buf[${q.in}] ← ${q.item}` })); q.in = (q.in + 1) % cap; q.count++; q.ppc = 4; break;
            case 4: q.mutex++; q.ppc = 5; F.push(snap({ at: "punlock", who: "P", vars: sv(), msg: "P: <code>signal(mutex)</code> — излиза от критичния участък." })); break;
            case 5: q.full++; q.produced++; q.ppc = 0; F.push(snap({ at: "pfull", who: "P", vars: sv(), msg: `P: <code>signal(full)</code> — full = ${q.full}; ако C е чакал, вече може да продължи.` })); break;
          }
        } else {
          switch (q.cpc) {
            case 0: if (wait("full")) { q.cpc = 1; F.push(snap({ at: "cfull", who: "C", vars: sv(), msg: `C: <code>wait(full)</code> — има елемент; full = ${q.full}.` })); } else { q.cb++; F.push(snap({ at: "cfull", who: "C", blockedC: true, vars: sv(), msg: "C: <code>wait(full)</code> — full = 0, <b>буферът е празен</b>. C е блокиран.", log: "C блокиран: празен буфер" })); } break;
            case 1: if (wait("mutex")) { q.cpc = 2; F.push(snap({ at: "clock", who: "C", vars: sv(), msg: "C: <code>wait(mutex)</code> — влиза в критичния участък." })); } else { q.cb++; F.push(snap({ at: "clock", who: "C", blockedC: true, vars: sv(), msg: "C: <code>wait(mutex)</code> — P е в критичния участък. C чака.", log: "C чака mutex" })); } break;
            case 2: q.citem = q.buf[q.out]; q.buf[q.out] = null; F.push(snap({ at: "cget", who: "C", slot: q.out, vars: { ...sv(), citem: q.citem }, msg: `C: взима <code>buf[${q.out}] = ${q.citem}</code>.`, log: `C: buf[${q.out}] → ${q.citem}` })); q.out = (q.out + 1) % cap; q.count--; q.cpc = 3; break;
            case 3: q.mutex++; q.cpc = 4; F.push(snap({ at: "cunlock", who: "C", vars: sv(), msg: "C: <code>signal(mutex)</code>." })); break;
            case 4: q.empty++; q.cpc = 5; F.push(snap({ at: "cempty", who: "C", vars: sv(), msg: `C: <code>signal(empty)</code> — empty = ${q.empty}; освободено място за P.` })); break;
            case 5: q.consumed++; q.sum += q.citem; q.cpc = 0; F.push(snap({ at: "cuse", who: "C", vars: { ...sv(), citem: q.citem }, msg: `C използва елемент ${q.citem} (извън критичния участък).` })); break;
          }
        }
      }
      const inv = q.empty + q.full + (q.ppc >= 2 && q.ppc <= 5 ? 1 : 0) - (q.cpc >= 1 && q.cpc <= 4 ? 1 : 0);
      F.push(snap({ done: true, vars: sv(), msg: `Край на разписанието: произведени ${q.produced}, консумирани ${q.consumed}, в буфера ${q.count}. Семафорите не позволиха на P да пише в пълен буфер, нито на C да чете от празен.` }));
      void inv;
      return { frames: F, produced: q.produced, consumed: q.consumed, count: q.count, pb: q.pb, cb: q.cb, sum: q.sum };
    },
  };

      inputs: [{ id: "cap", label: "Капацитет", type: "number", value: 2, width: "5em" }, { id: "sched", label: "Разписание (P/C)", value: "CCPPPPPPPPPPPPPPPPPPCCCCCC", width: "22em" }],
      presets: [{ label: "Пълен буфер", values: { cap: 3, sched: "PPPPPPPPPPPPPPPPPPPPPPPPPPPP" } }, { label: "Празен буфер", values: { cap: 2, sched: "CCCCPPPPPPCCCCCC" } }, { label: "Редуване", values: { cap: 1, sched: "PCPCPCPCPCPCPCPCPCPCPC" } }],
      random: () => ({ sched: Array.from({ length: 30 }, () => (Math.random() < 0.5 ? "P" : "C")).join("") }),
      legend: [["s-done", "зает слот"], ["s-act", "запис"], ["s-cmp", "четене"], ["s-swap", "семафор = 0"]],
      build: algos.pc,

    });

    const np = root.querySelector("#noprog"), nn = root.querySelector("#noprog-note");
    const btns = NOPROG.map((N, i) => h("button", { class: "card", "aria-pressed": "false", onclick: () => {
      btns.forEach((b, j) => b.setAttribute("aria-pressed", i === j ? "true" : "false"));
      nn.innerHTML = `<p><b>${N.t}</b> — ${N.d}</p>` + (N.go ? `<p><a href="#${N.go}">→ виж раздела</a></p>` : "");
    } }, h("h4", null, h("dfn", { "data-g": N.g, text: N.t })), h("p", { class: "muted", text: "щракни за механизма" })));
    np.append(...btns);
  }

  S.chapter({ id: "sinhronizacia", order: 4, num: "4", group: "Ресурси", title: "Синхронизация", lead: "Състезание за данни и загубено увеличение, критичен участък, мютекс, семафор, условна променлива, производител–потребител.", html, mount, algos });
})();

</script>
<script>
/* Раздел 5 — взаимно блокиране: условия, граф на ресурсите, предотвратяване/избягване/откриване, банкер. */
(function () {
  const S = window.Study, h = S.h;

  /* hold: за всеки ресурс номер на процес или "-"; want: за всеки процес номер на ресурс или "-" */
  function parseList(str, name, maxLen, maxVal) {
    const parts = String(str).split(/[\s,;]+/).filter(Boolean);
    if (!parts.length) throw new Error(`Полето „${name}“ е празно.`);
    if (parts.length > maxLen) throw new Error(`„${name}“: най-много ${maxLen} стойности.`);
    return parts.map((p) => {
      if (p === "-") return -1;
      const v = Number(p);
      if (!Number.isInteger(v) || v < 1 || v > maxVal) throw new Error(`„${name}“: „${p}“ трябва да е число от 1 до ${maxVal} или „-“.`);
      return v - 1;
    });
  }
  function parseMatrix(str, rows, cols, name) {
    const r = String(str).split(/[;|\n]+/).map((x) => x.trim()).filter(Boolean);
    if (r.length !== rows) throw new Error(`„${name}“: нужни са ${rows} реда, разделени с „;“.`);
    return r.map((row, i) => {
      const v = S.parseNums(row, { min: 0, max: 20, minLen: cols, maxLen: cols });
      if (v.length !== cols) throw new Error(`„${name}“, ред ${i}: нужни са ${cols} числа.`);
      return v;
    });
  }

  const algos = {
    parseList,
    /* Огледало на find_cycle() — от всеки процес поред, до първия цикъл */
    cycle({ hold, want }) {
      const W = parseList(want, "чака", 6, 4), n = W.length;
      const H = parseList(hold, "държи", 4, n), m = H.length;
      W.forEach((r, p) => { if (r >= m) throw new Error(`P${p + 1} чака R${r + 1}, но има само ${m} ресурса.`); if (r >= 0 && H[r] === p) throw new Error(`P${p + 1} не може да чака ресурс, който сам държи.`); });
      const F = [];
      const base = { H, W, n, m };
      F.push({ ...base, vars: { процеси: n, ресурси: m }, msg: "Строим графа на изчакване: P → Q, ако P чака ресурс, държан от Q. При единични ресурси <b>цикъл ⇔ взаимно блокиране</b>." });
      let found = [];
      for (let s = 0; s < n && !found.length; s++) {
        const seen = Array(n).fill(-1), path = [];
        let p = s;
        F.push({ ...base, at: "walk", path: [], cur: s, vars: { старт: "P" + (s + 1) }, msg: `Тръгваме от P${s + 1}.` });
        while (p >= 0 && seen[p] < 0) {
          seen[p] = path.length; path.push(p);
          const r = W[p], q = r >= 0 ? H[r] : -1;
          F.push({ ...base, at: ["next", "edge"], path: path.slice(), cur: p, edgeR: r, vars: { p: "P" + (p + 1), чака: r >= 0 ? "R" + (r + 1) : "—", държател: q >= 0 ? "P" + (q + 1) : "—" }, msg: r < 0 ? `P${p + 1} не чака нищо — може да напредва.` : q < 0 ? `P${p + 1} чака R${r + 1}, който е <b>свободен</b> — заявката може да се удовлетвори.` : `P${p + 1} чака R${r + 1}, държан от P${q + 1} → ребро P${p + 1} → P${q + 1}.`, log: r >= 0 && q >= 0 ? `P${p + 1} → P${q + 1}` : null });
          p = q;
        }
        if (p < 0) F.push({ ...base, at: "nocycle", path: path.slice(), vars: {}, msg: `Веригата от P${s + 1} свършва — без цикъл.` });
        else { found = path.slice(seen[p]); F.push({ ...base, at: "cycle", path: path.slice(), cyc: found.slice(), vars: { цикъл: found.map((x) => "P" + (x + 1)).join(" → ") }, msg: `Стигнахме отново P${p + 1}: <b>цикъл</b> ${found.map((x) => "P" + (x + 1)).join(" → ")} → P${p + 1}. Тези процеси са във взаимно блокиране.`, log: "цикъл!" }); }
      }
      if (!found.length) F.push({ ...base, done: true, vars: {}, msg: "Няма цикъл — няма взаимно блокиране (може да има чакане, но то ще свърши)." });
      return { frames: F, cycle: found.length ? found.map((x) => "P" + (x + 1)).join(",") : "-" };
    },

    /* Огледало на is_safe() и request() */
    banker({ avail, max, alloc, req }) {
      const av = S.parseNums(avail, { min: 0, max: 20, minLen: 1, maxLen: 4 }), m = av.length;
      const rowsMax = String(max).split(/[;|\n]+/).filter((x) => x.trim()).length;
      if (rowsMax < 1 || rowsMax > 6) throw new Error("Между 1 и 6 процеса (редове в Max).");
      const MX = parseMatrix(max, rowsMax, m, "Max"), AL = parseMatrix(alloc, rowsMax, m, "Allocation"), n = rowsMax;
      for (let i = 0; i < n; i++) for (let j = 0; j < m; j++) if (AL[i][j] > MX[i][j]) throw new Error(`P${i}: Allocation > Max за ресурс ${j}.`);
      let R = null, rp = -1;
      const rq = String(req || "").trim();
      if (rq) {
        const mm = /^P?(\d)\s*[:=]\s*(.+)$/i.exec(rq);
        if (!mm) throw new Error("Заявка: формат P1: 1 0 2 (празно = само проверка).");
        rp = +mm[1]; if (rp >= n) throw new Error(`Няма процес P${rp}.`);
        R = S.parseNums(mm[2], { min: 0, max: 20, minLen: m, maxLen: m });
      }
      const F = [];
      const NEED = (A) => MX.map((r, i) => r.map((x, j) => x - A[i][j]));
      let A = AL.map((r) => r.slice()), V = av.slice();
      const snap = (o) => ({ n, m, MX, A: A.map((r) => r.slice()), V: V.slice(), need: NEED(A), R, rp, ...o });
      let reqRes = null;
      if (R) {
        const need = NEED(A);
        F.push(snap({ at: "rq_err", rowHi: rp, vars: { заявка: `P${rp}: [${R}]`, need: `[${need[rp]}]` }, msg: `Заявка от P${rp}: [${R.join(" ")}]. Първо: не надвишава ли обявената остатъчна потребност Need = Max − Allocation = [${need[rp].join(" ")}]?` }));
        if (R.some((x, j) => x > need[rp][j])) {
          F.push(snap({ at: "rq_err", rowHi: rp, done: true, verdict: "err", vars: {}, msg: "<b class=\"warn\">Грешка</b>: процесът иска повече от обявения максимум. Заявката се отхвърля." }));
          return { frames: F, req: -1, safe: null, order: "-" };
        }
        F.push(snap({ at: "rq_avail", rowHi: rp, vars: { available: `[${V}]` }, msg: `Има ли толкова свободни сега? Available = [${V.join(" ")}].` }));
        if (R.some((x, j) => x > V[j])) {
          F.push(snap({ at: "rq_avail", rowHi: rp, done: true, verdict: "wait", vars: {}, msg: "Няма достатъчно свободни ресурси — <b>P" + rp + " трябва да чака</b>." }));
          return { frames: F, req: 0, safe: null, order: "-" };
        }
        A[rp] = A[rp].map((x, j) => x + R[j]); V = V.map((x, j) => x - R[j]);
        F.push(snap({ at: "rq_try", rowHi: rp, vars: { available: `[${V}]` }, msg: `<b>Пробно</b> разпределение: Allocation[P${rp}] += заявката, Available = [${V.join(" ")}]. Сега проверяваме дали полученото състояние е безопасно.` }));
      }
      // is_safe
      const work = V.slice(), fin = Array(n).fill(false), order = [];
      F.push(snap({ at: "init", work: work.slice(), fin: fin.slice(), order: [], vars: { Work: `[${work}]` }, msg: `Work = Available = [${work.join(" ")}]. Търсим процес, чиято Need ≤ Work.` }));
      for (let found = true; found;) {
        found = false;
        for (let i = 0; i < n; i++) {
          if (fin[i]) continue;
          const need = NEED(A)[i];
          const ok = need.every((x, j) => x <= work[j]);
          F.push(snap({ at: ok ? "need" : ["skip", "need"], work: work.slice(), fin: fin.slice(), order: order.slice(), rowHi: i, ok, vars: { i: "P" + i, Need: `[${need}]`, Work: `[${work}]` }, msg: `P${i}: Need [${need.join(" ")}] ${ok ? "≤" : "≰"} Work [${work.join(" ")}] — ${ok ? "може да получи всичко и да завърши." : "сега не може да завърши; пропускаме."}` }));
          if (!ok) continue;
          for (let j = 0; j < m; j++) work[j] += A[i][j];
          fin[i] = true; order.push(i); found = true;
          F.push(snap({ at: "release", work: work.slice(), fin: fin.slice(), order: order.slice(), rowHi: i, vars: { Work: `[${work}]` }, msg: `P${i} завършва и освобождава Allocation [${A[i].join(" ")}] → Work = [${work.join(" ")}].`, log: `P${i} ✓ Work=[${work}]` }));
        }
      }
      const safe = order.length === n;
      const ord = safe ? order.map((x) => "P" + x).join(",") : "-";
      let verdict;
      if (R) { reqRes = safe ? 1 : 0; verdict = safe ? "grant" : "unsafe"; }
      F.push(snap({ at: R ? (safe ? "rq_grant" : ["rq_unsafe", "verdict"]) : "verdict", done: true, verdict, work: work.slice(), fin: fin.slice(), order: order.slice(), vars: { безопасно: safe }, inv: { text: safe ? `безопасна последователност: ${order.map((x) => "P" + x).join(" → ")}` : `несигурно: ${fin.map((f, i) => (f ? null : "P" + i)).filter(Boolean).join(", ")} не могат да завършат гарантирано`, ok: safe },
        msg: R ? (safe ? `Състоянието след заявката е <b>безопасно</b> — заявката се удовлетворява.` : `Състоянието след заявката е <b>небезопасно</b> — пробното разпределение се отменя и P${rp} чака.`) : (safe ? "Състоянието е <b>безопасно</b>." : "Състоянието е <b>небезопасно</b> (не е непременно deadlock, но няма гаранция).") }));
      return { frames: F, req: reqRes, safe: safe ? 1 : 0, order: ord };
    },
  };

  function drawGraph(st, f) {
    st.innerHTML = "";
    const n = f.n, m = f.m;
    const Wd = 560, Hd = 240;
    const px = (p) => 60 + p * ((Wd - 120) / Math.max(1, n - 1)), py = 50;
    const rx = (r) => 80 + r * ((Wd - 160) / Math.max(1, m - 1)), ry = 190;
    const svg = S.svg("svg", { class: "g", viewBox: `0 0 ${Wd} ${Hd}`, width: Wd, role: "img", "aria-label": "Граф на ресурсите" });
    svg.append(S.svg("defs", null, S.svg("marker", { id: "arr5", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto" }, S.svg("path", { d: "M0,0 L10,5 L0,10 z", fill: "var(--muted)" }))));
    const inCyc = (p) => f.cyc && f.cyc.includes(p);
    const line = (x1, y1, x2, y2, cls, dash) => {
      const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1;
      svg.append(S.svg("line", { x1: x1 + dx / L * 20, y1: y1 + dy / L * 20, x2: x2 - dx / L * 22, y2: y2 - dy / L * 22, class: "edge " + cls, "marker-end": "url(#arr5)", "stroke-dasharray": dash ? "6 4" : null }));
    };
    f.H.forEach((p, r) => { if (p >= 0) line(rx(r), ry, px(p), py, inCyc(p) ? "s-swap" : "s-done", false); });
    f.W.forEach((r, p) => { if (r >= 0) line(px(p), py, rx(r), ry, inCyc(p) ? "s-swap" : f.cur === p ? "s-act" : "s-cmp", true); });
    for (let p = 0; p < n; p++) {
      const cls = inCyc(p) ? "s-swap" : f.cur === p ? "s-act" : f.path && f.path.includes(p) ? "s-cmp" : "";
      svg.append(S.svg("g", { class: "node " + cls }, S.svg("circle", { cx: px(p), cy: py, r: 19 }), S.svg("text", { x: px(p), y: py + 5, "text-anchor": "middle", style: "font-weight:700", text: "P" + (p + 1) })));
    }
    for (let r = 0; r < m; r++) {
      svg.append(S.svg("g", { class: "node " + (f.edgeR === r ? "s-act" : "") }, S.svg("rect", { x: rx(r) - 20, y: ry - 18, width: 40, height: 36, rx: 3, fill: "var(--cb, var(--panel))", stroke: "var(--c, var(--ink-2))", "stroke-width": 2 }),
        S.svg("text", { x: rx(r), y: ry + 5, "text-anchor": "middle", text: "R" + (r + 1) })));
    }
    st.append(h("div", { class: "tbl-wrap" }, svg), h("p", { class: "muted", style: { fontSize: ".82rem" }, text: "плътна стрелка R → P: ресурсът е разпределен на P · пунктир P → R: P чака R" }));
  }

  function drawBank(st, f) {
    st.innerHTML = "";
    const tb = h("table", { class: "t grid" });
    const hdr = (t) => h("th", { colspan: f.m, text: t });
    tb.append(h("tr", null, h("th", { text: "" }), hdr("Allocation"), hdr("Max"), hdr("Need"), h("th", { text: "завършва" })));
    for (let i = 0; i < f.n; i++) {
      const hi = f.rowHi === i;
      const cell = (v, extra) => h("td", { class: extra || "", text: v });
      const ord = f.order ? f.order.indexOf(i) : -1;
      tb.append(h("tr", null, h("th", { class: hi ? "s-act" : "", text: "P" + i }),
        ...f.A[i].map((v) => cell(v, hi && f.at === "release" ? "s-done" : "")),
        ...f.MX[i].map((v) => cell(v, "")),
        ...f.need[i].map((v, j) => cell(v, hi && f.work ? (v <= f.work[j] ? "s-done" : "s-swap") : "")),
        h("td", { class: ord >= 0 ? "s-done" : "", text: ord >= 0 ? `${ord + 1}.` : "" })));
    }
    st.append(h("div", { class: "tbl-wrap" }, tb));
    st.append(h("p", { class: "mono", style: { marginTop: "8px" }, html: `Available = [${f.V.join(" ")}]` + (f.work ? ` &nbsp; Work = [${f.work.join(" ")}]` : "") + (f.R ? ` &nbsp; заявка P${f.rp} = [${f.R.join(" ")}]` : "") }));
    if (f.verdict) st.append(h("p", { class: "pill " + (f.verdict === "grant" ? "s-done" : f.verdict === "wait" ? "s-cmp" : "s-swap"), text: { grant: "удовлетворена", wait: "чака", unsafe: "отказ: небезопасно", err: "грешка" }[f.verdict] }));
  }

  const COND = [
    { t: "Взаимно изключване", d: "Ресурсът може да се ползва само от един участник.", prev: "Да се направи ресурсът споделим (напр. само за четене) — не винаги е възможно." },
    { t: "Задържане с изчакване", d: "Участник държи ресурс и чака друг.", prev: "Заявка на всички ресурси наведнъж или освобождаване преди нова заявка." },
    { t: "Липса на принудително отнемане", d: "Ресурсът не може да се отнеме принудително.", prev: "Позволяване на отнемане (напр. при отказана заявка участникът освобождава задържаното)." },
    { t: "Кръгово изчакване", d: "Съществува цикъл от чакащи участници.", prev: "Общ ред за придобиване на заключвания: всички искат R1 преди R2. Трябва да се спазва от <b>всички</b> участници." },
  ];

  const html = `
<div class="prose">
  <p><dfn data-g="взаимно блокиране">Взаимното блокиране</dfn>, deadlock, възниква, когато участници чакат ресурси един от друг и не могат да напредват. Класическите необходими условия са четири. Щракни условие — какво значи да бъде премахнато.</p>
</div>
<div class="cards" id="conds"></div>
<div class="key" id="cond-note">Четирите условия са <b>необходими</b>: ако едно от тях липсва, взаимно блокиране не може да възникне.</div>

<div class="block">
  <h3>Схема 11 · Граф на ресурсите и цикъл</h3>
  <p class="muted">Поле „държи“: за R1, R2, … номер на процеса, който държи ресурса („-“ = свободен). Поле „чака“: за P1, P2, … номер на ресурса, който процесът чака („-“ = нищо). Ресурсите са с по един екземпляр.</p>
  <div id="v-cycle"></div>
  <details class="trap"><summary>Капан: deadlock ≠ гладуване</summary><div>
    <p>При Схема 11 — A държи R1 и чака R2, B държи R2 и чака R1 — при липса на механизъм за отнемане или прекъсване на цикъла никой не напредва. Това е различно от <dfn data-g="гладуване">гладуване</dfn>, при което други участници продължават. Гладуването е неопределено отлагане и не е тъждествено на deadlock.</p>
  </div></details>
  <details class="hint"><summary>Хинт: защо цикълът е достатъчен само при единични ресурси</summary><div>
    <p>Ако от ресурс има няколко еднакви екземпляра, процес в цикъла може да получи друг екземпляр, освободен от процес извън цикъла. Тогава цикълът е необходим, но не достатъчен — затова за многоекземплярни ресурси се използва алгоритъм от типа на банкера по-долу. <span class="extra-tag">извън конспекта</span></p>
  </div></details>
</div>

<div class="block">
  <h3>Три стратегии</h3>
  <div class="tbl-wrap"><table class="t">
    <tr><th>Стратегия</th><th>Идея</th><th>Цена</th></tr>
    <tr><td>Предотвратяване</td><td>премахва възможност за някое необходимо условие (напр. общ ред на заключванията)</td><td>ограничава програмирането</td></tr>
    <tr><td>Избягване</td><td>допуска заявка само ако се запазва <dfn data-g="безопасно състояние">безопасно състояние</dfn>; алгоритъм на банкера</td><td>изисква предварителни оценки за максималните потребности</td></tr>
    <tr><td>Откриване и възстановяване</td><td>допуска възникване и после прекъсва цикъла</td><td>прекъснат участник губи работа</td></tr>
  </table></div>
</div>

<div class="block">
  <h3>Алгоритъм на банкера</h3>
  <p class="prose">Ръководството назовава алгоритъма на банкера като пример за избягване. Стъпките по-долу са класическата му формулировка <span class="extra-tag">извън конспекта</span>: Need = Max − Allocation; състоянието е безопасно, ако съществува ред, в който всеки процес може да получи остатъчната си потребност от Work и после да освободи всичко. Процесите са номерирани P0, P1, … — редовете на матриците се разделят с „;“.</p>
  <div id="v-bank"></div>
  <details class="trap"><summary>Капан: небезопасно ≠ взаимно блокиране</summary><div>

</div>

<div class="key"><b>За запомняне.</b> Четири необходими условия: взаимно изключване, задържане с изчакване, без принудително отнемане, кръгово изчакване. Предотвратяване — премахни условие; избягване — пази безопасно състояние (банкер, изисква Max); откриване — цикъл в графа, после прекъсване. Deadlock ≠ starvation ≠ livelock.</div>`;

  function mount(root) {

      inputs: [{ id: "hold", label: "държи (R1 R2 …)", value: "1 2", width: "10em" }, { id: "want", label: "чака (P1 P2 …)", value: "2 1", width: "10em" }],
      presets: [{ label: "Схема 11", values: { hold: "1 2", want: "2 1" } }, { label: "Верига без цикъл", values: { hold: "1 2 -", want: "2 3 -" } }, { label: "Цикъл от трима", values: { hold: "1 2 3 4", want: "2 3 1 1" } },

      legend: [["s-act", "текущ"], ["s-cmp", "посетен / чака"], ["s-done", "разпределен"], ["s-swap", "цикъл"]],

      code: "s05_banker",
      inputs: [{ id: "avail", label: "Available", value: "3 3 2", width: "7em" },
        { id: "max", label: "Max (редове с ;)", value: "7 5 3; 3 2 2; 9 0 2; 2 2 2; 4 3 3", width: "17em" },
        { id: "alloc", label: "Allocation", value: "0 1 0; 2 0 0; 3 0 2; 2 1 1; 0 0 2", width: "17em" },
        { id: "req", label: "Заявка (P1: 1 0 2)", value: "", width: "9em" }],
      presets: [{ label: "Само проверка", values: { avail: "3 3 2", alloc: "0 1 0; 2 0 0; 3 0 2; 2 1 1; 0 0 2", req: "" } }, { label: "P1: 1 0 2 → да", values: { avail: "3 3 2", alloc: "0 1 0; 2 0 0; 3 0 2; 2 1 1; 0 0 2", req: "P1: 1 0 2" } },
        { label: "след това P4: 3 3 0 → чака", values: { avail: "2 3 0", alloc: "0 1 0; 3 0 2; 3 0 2; 2 1 1; 0 0 2", req: "P4: 3 3 0" } }, { label: "P0: 8 0 0 → грешка", values: { avail: "3 3 2", alloc: "0 1 0; 2 0 0; 3 0 2; 2 1 1; 0 0 2", req: "P0: 8 0 0" } },
        { label: "след това P0: 0 2 0 → небезопасно", values: { avail: "2 3 0", alloc: "0 1 0; 3 0 2; 3 0 2; 2 1 1; 0 0 2", req: "P0: 0 2 0" } }],

  S.chapter({ id: "deadlock", order: 5, num: "5", group: "Ресурси", title: "Взаимно блокиране", lead: "Четирите необходими условия, граф на ресурсите и цикъл, предотвратяване, избягване (алгоритъм на банкера), откриване.", html, mount, algos });
})();

</script>
<script>
/* Раздел 6 — управление на оперативната памет: виртуален адрес, страници, рамки, TLB, page fault. */
(function () {
  const S = window.Study, h = S.h;
  const PERM = { W: "четене и запис", R: "само четене", C: "copy-on-write" };
  const KIND = ["TLB попадение", "TLB пропуск → таблица", "page fault: зареждане", "page fault: copy-on-write", "невалиден достъп"];

  function parseTable(str) {
    const parts = String(str).split(/[\s,;]+/).filter(Boolean);
    if (!parts.length) throw new Error("Таблицата на страниците е празна.");
    if (parts.length > 16) throw new Error("Най-много 16 страници.");
    return parts.map((p, i) => {
      if (p === "-") return { present: false, frame: null, perm: "W" };
      const m = /^(\d+)([WRC])?$/i.exec(p);
      if (!m) throw new Error(`Страница ${i}: „${p}“ — формат: рамка и права (W, R или C), напр. 10W, или „-“ за липсваща.`);
      const f = +m[1];
      if (f > 63) throw new Error("Номерът на рамка трябва да е до 63.");
      return { present: true, frame: f, perm: (m[2] || "W").toUpperCase() };
    });
  }
  function parseAccesses(str) {
    const parts = String(str).split(/[\s,;]+/).filter(Boolean);
    if (!parts.length) throw new Error("Въведи поне един адрес.");
    if (parts.length > 24) throw new Error("Най-много 24 достъпа.");
    return parts.map((p) => {
      const m = /^(w)?(0x[0-9a-f]+|\d+)$/i.exec(p);
      if (!m) throw new Error(`„${p}“ не е адрес. Пример: 12345 (четене) или w8200 (запис).`);
      const v = Number(m[2]);
      if (v > 0xffffff) throw new Error("Адресите трябва да са до 16 777 215.");
      return { va: v, write: !!m[1] };
    });
  }

  const algos = {
    /* Огледало на translate() от c/06_pamet.c */
    mmu({ psize, tlb, table, acc }) {
      const ps = S.int(psize, 16, 65536, "Размерът на страницата");
      if (ps & (ps - 1)) throw new Error("Размерът на страницата трябва да е степен на 2.");
      const shift = Math.log2(ps);
      const tcap = S.int(tlb, 1, 8, "Записите в TLB");
      const pt = parseTable(table), A = parseAccesses(acc);
      let nextFree = Math.max(-1, ...pt.filter((e) => e.present).map((e) => e.frame)) + 1;
      const T = { page: [], frame: [], next: 0 };
      let hits = 0, misses = 0, faults = 0, invalid = 0;
      const F = [], phys = [];
      const snap = (o) => ({ pt: pt.map((e) => ({ ...e })), tlb: { page: T.page.slice(), frame: T.frame.slice() }, shift, ps, stats: { "TLB попадения": hits, "TLB пропуски": misses, "page faults": faults, невалидни: invalid }, ...o });
      const tlbFind = (p) => T.page.indexOf(p);
      const tlbIns = (p, f) => { let i = tlbFind(p); if (i < 0) { if (T.page.length < tcap) i = T.page.length; else { i = T.next; T.next = (T.next + 1) % tcap; } } T.page[i] = p; T.frame[i] = f; return i; };
      F.push(snap({ vars: { "размер на страница": ps, "битове за отместване": shift, "свободна рамка": nextFree }, msg: `Страница ${ps} байта → отместването е ${shift} бита. Номерът на страница = адрес &gt;&gt; ${shift}; отместване = адрес &amp; ${ps - 1}.` }));
      A.forEach(({ va, write }, k) => {
        const page = Math.floor(va / ps), off = va % ps;
        const rw = write ? "запис" : "четене";
        F.push(snap({ at: "split", k, va, page, off, write, vars: { адрес: va, страница: page, отместване: off }, msg: `Достъп №${k + 1} (${rw}): ${va} = ${page}·${ps} + ${off} → страница <b>${page}</b>, отместване <b>${off}</b>.` }));
        const ti = tlbFind(page);
        if (ti >= 0 && !(write && pt[page].perm !== "W")) {
          hits++;
          const pa = T.frame[ti] * ps + off;
          phys.push(pa);
          F.push(snap({ at: ["hit", "tlb"], k, va, page, off, write, tlbHi: ti, vars: { рамка: T.frame[ti], физически: pa }, msg: `<dfn data-g="tlb">TLB</dfn> съдържа страница ${page} → рамка ${T.frame[ti]}. Таблицата не се чете.` }));
          F.push(snap({ at: "phys", k, va, page, off, write, tlbHi: ti, pa, kind: 0, vars: { физически: pa }, msg: `Физически адрес = ${T.frame[ti]}·${ps} + ${off} = <b>${pa}</b>. Отместването е запазено.`, log: `${write ? "w" : ""}${va} → ${pa} (TLB)` }));
          return;
        }
        misses++;
        F.push(snap({ at: ["miss", "tlb"], k, va, page, off, write, vars: { страница: page }, msg: ti >= 0 ? `Страница ${page} е в TLB, но правата (${PERM[pt[page].perm]}) не позволяват запис направо — нужна е таблицата.` : `TLB пропуск: страница ${page} я няма в TLB. Четем таблицата на страниците — <b>това още не е page fault</b>.` }));
        if (page >= pt.length) {
          invalid++; phys.push(-1);
          F.push(snap({ at: ["invalid", "walk"], k, va, page, off, write, kind: 4, vars: {}, msg: `Страница ${page} е извън таблицата (има ${pt.length}). <b>Невалиден достъп</b> — ОС прекратява или сигнализира процеса.`, log: `${write ? "w" : ""}${va} → невалиден` }));
          return;
        }
        const e = pt[page];
        let kind = 1;
        F.push(snap({ at: "walk", k, va, page, off, write, ptHi: page, vars: { присъства: e.present, права: PERM[e.perm] }, msg: `Запис ${page} в таблицата: ${e.present ? `рамка ${e.frame}, ${PERM[e.perm]}` : "<b>липсва в паметта</b>"}.` }));
        if (!e.present) {
          faults++; e.present = true; e.frame = nextFree++; kind = 2;
          F.push(snap({ at: ["load", "absent"], k, va, page, off, write, ptHi: page, fault: true, vars: { рамка: e.frame }, msg: `<dfn data-g="page fault">Page fault</dfn>: страницата липсва. ОС я зарежда от носител в свободна рамка ${e.frame} и обновява таблицата.`, log: `page fault: стр. ${page} → рамка ${e.frame}` }));
        }
        if (write && e.perm === "R") {
          invalid++; phys.push(-1);
          F.push(snap({ at: ["invalid", "rights"], k, va, page, off, write, ptHi: page, kind: 4, vars: {}, msg: `Запис в страница само за четене: <b>нарушение на правата</b> — невалиден достъп.`, log: `w${va} → нарушение на правата` }));
          return;
        }
        if (write && e.perm === "C") {
          faults++; const old = e.frame; e.frame = nextFree++; e.perm = "W"; kind = 3;
          F.push(snap({ at: "cow", k, va, page, off, write, ptHi: page, fault: true, vars: { "стара рамка": old, "нова рамка": e.frame }, msg: `Запис в страница с <dfn data-g="copy-on-write">copy-on-write</dfn>: page fault, ОС копира рамка ${old} в нова рамка ${e.frame} и дава право за запис. Другият участник остава със старата.`, log: `COW: стр. ${page} ${old} → ${e.frame}` }));
        }
        const ti2 = tlbIns(page, e.frame);
        const pa = e.frame * ps + off;
        phys.push(pa);
        F.push(snap({ at: ["fill", "phys"], k, va, page, off, write, ptHi: page, tlbHi: ti2, pa, kind, vars: { рамка: e.frame, физически: pa }, msg: `Преобразуването се записва в TLB. Физически адрес = ${e.frame}·${ps} + ${off} = <b>${pa}</b>.`, log: `${write ? "w" : ""}${va} → ${pa}` }));
      });
      F.push(snap({ done: true, vars: {}, msg: `Край: ${hits} TLB попадения, ${misses} пропуска, от тях page faults: ${faults}, невалидни: ${invalid}. TLB пропуск ≠ page fault.` }));
      return { frames: F, phys: phys.join(","), hits, misses, faults, invalid };
    },
  };

  function drawMMU(st, f) {
    st.innerHTML = "";
    if (f.va != null) {
      const bits = Math.max(f.shift + 4, Math.ceil(Math.log2(f.va + 1)));
      const bin = f.va.toString(2).padStart(bits, "0");
      const pg = bin.slice(0, bits - f.shift), of = bin.slice(bits - f.shift);
      st.append(h("div", { class: "card", style: { marginBottom: "10px" } },
        h("span", { class: "eyebrow", text: `виртуален адрес ${f.va}${f.write ? " · запис" : " · четене"}` }),
        h("p", { class: "mono", style: { overflowWrap: "anywhere" } }, h("span", { class: "pill s-act", text: pg }), " ", h("span", { class: "pill s-cmp", text: of })),
        h("p", { class: "mono", text: `страница = ${f.page}   отместване = ${f.off}` + (f.pa != null ? `   →   физически = ${f.pa}` : "") })));
    }
    const tlb = h("table", { class: "t grid" }, h("tr", null, h("th", { text: "TLB" }), h("th", { text: "стр." }), h("th", { text: "рамка" })));
    if (!f.tlb.page.length) tlb.append(h("tr", null, h("td", { colspan: 3, class: "muted", text: "празен" })));
    f.tlb.page.forEach((p, i) => tlb.append(h("tr", null, h("th", { text: i }), h("td", { class: f.tlbHi === i ? "s-done" : "", text: p }), h("td", { class: f.tlbHi === i ? "s-done" : "", text: f.tlb.frame[i] }))));
    const pt = h("table", { class: "t grid" }, h("tr", null, h("th", { text: "стр." }), h("th", { text: "рамка" }), h("th", { text: "права" })));
    f.pt.forEach((e, i) => {
      const c = f.ptHi === i ? (f.fault ? "s-swap" : "s-act") : "";
      pt.append(h("tr", null, h("th", { text: i }), h("td", { class: c, text: e.present ? e.frame : "—" }), h("td", { class: c, text: e.perm })));
    });
    st.append(h("div", { class: "split" }, h("div", { class: "tbl-wrap" }, h("p", { class: "eyebrow", text: "TLB (кеш)" }), tlb), h("div", { class: "tbl-wrap" }, h("p", { class: "eyebrow", text: "таблица на страниците" }), pt)));
    if (f.kind != null) st.append(h("p", { class: "pill " + ["s-done", "s-cmp", "s-swap", "s-piv", "s-swap"][f.kind], style: { marginTop: "8px" }, text: KIND[f.kind] }));
  }

  const PF = [
    { t: "Страницата липсва", d: "Валиден адрес, но страницата не е в паметта → зареждане от носител.", disk: true },
    { t: "Нулева страница", d: "Нова памет (напр. стек, куп), която още няма съдържание → ОС създава нулирана страница. Без диск.", disk: false },
    { t: "Copy-on-write", d: "Запис в споделена за четене страница → ОС създава отделно копие. Без диск.", disk: false },
    { t: "Невалиден достъп", d: "Адрес извън пространството или нарушение на правата → прекратяване / сигнал.", disk: false },
  ];

  const html = `
<div class="prose">
  <p>ОС разпределя памет и изолира адресните пространства. <dfn data-g="виртуален адрес">Виртуалният адрес</dfn> се преобразува във физически чрез хардуер (<dfn data-g="mmu">MMU</dfn>) и таблици, управлявани от ядрото. Виртуалната памет не означава само използване на диска като разширение на RAM; тя включва <b>абстракцията, преобразуването и защитата</b> на адресите.</p>
  <p>При странициране виртуалното пространство се разделя на <dfn data-g="страница">страници</dfn>, а физическата памет на <dfn data-g="рамка">рамки</dfn>. Адресът съдържа номер на страница и отместване. Таблицата на страниците определя рамката и правата. <dfn data-g="tlb">TLB</dfn> кешира преобразувания.</p>
</div>

<div class="block">
  <h3>Схеми 14–16 · Преобразуване, TLB и page fault</h3>
  <p class="muted">Таблица: за страница 0, 1, 2… рамка и права (<b>W</b> — четене и запис, <b>R</b> — само четене, <b>C</b> — споделена с copy-on-write) или „-“ за липсваща. Достъпи: адрес за четене или <code>w</code>адрес за запис. Нови рамки се дават поред след най-големия зает номер на рамка. Моделът е еднониво учебно преобразуване с байтово адресиране.</p>
  <div id="v-mmu"></div>
  <div class="key">
    <p class="formula">страница = адрес div размер &nbsp;&nbsp; отместване = адрес mod размер</p>
    <p class="formula">физически = рамка × размер + отместване</p>
    <p>Пример от ръководството: 4096 B (12 бита) · 12345 → страница 3, отместване 57 · рамка 10 → 10×4096+57 = <b>41017</b>.</p>
  </div>
  <details class="hint"><summary>Хинт: защо делението е просто изместване</summary><div>
    <p>Размерът на страницата е степен на 2, затова номерът на страницата са старшите битове на адреса, а отместването — младшите. Преобразува се само номерът; отместването се копира без промяна. Синьото и оранжевото в двоичния запис по-горе са точно тези две полета.</p>
  </div></details>
  <details class="trap"><summary>Капан: TLB miss = page fault = четене от диск</summary><div>
    <p>Три различни събития. TLB miss може да се разреши чрез налична таблица, без да има липсваща страница (пробвай 100 в примера „Смесен“). Page fault изисква участие на ОС по конкретна причина. И не всеки page fault е дисково четене — виж картите по-долу.</p>
  </div></details>
</div>

<div class="block">
  <h3>Схема 15 · Какво може да стои зад page fault</h3>
  <p class="muted">„Изключение“ тук не означава непременно фатална програмна грешка: част от изключенията са нормална част от управлението на паметта.</p>
  <div class="cards" id="pf-cards"></div>
</div>

<div class="block">
  <h3>Изолация и споделяне</h3>
  <p class="prose">Два процеса могат да имат еднакъв виртуален адрес, който води до различна физическа памет. Възможно е и различни виртуални адреси да сочат споделена физическа страница. Изолацията и контролираното споделяне са основни цели <b>дори в система без swap</b>.</p>
  <div class="tbl-wrap" id="iso-svg"></div>
  <details class="trap"><summary>Изяснен въпрос: ОС с повече свободна RAM винаги ли е по-добра?</summary><div>
    <p>Не. Свободна памет може да се използва като освобождаем файлов кеш. За натиска върху паметта са важни активните данни и възможността да се освободят кеширани страници, а не само една стойност „free“.</p>
  </div></details>
</div>

<div class="key"><b>За запомняне.</b> Виртуална памет = абстракция + преобразуване + защита. Страница ↔ рамка; преобразува се номерът, отместването остава. TLB е кеш; TLB miss ≠ page fault; page fault ≠ непременно диск.</div>`;

  function mount(root) {
    S.viz(root.querySelector("#v-mmu"), {
      id: "mmu", title: "MMU: виртуален → физически адрес", sub: "Синьо — номер на страница, оранжево — отместване.",
      code: "s06_translate",
      inputs: [{ id: "psize", label: "Размер на страница", type: "select", value: "4096", options: ["256", "1024", "4096"] },
        { id: "tlb", label: "Записи в TLB", type: "number", value: 2, width: "5em" },
        { id: "table", label: "Таблица (стр. 0, 1, …)", value: "5W 2R - 10C", width: "14em" },
        { id: "acc", label: "Достъпи (w = запис)", value: "12345 12400 100 8200 w8200 4100 w4100 70000", width: "22em" }],
      presets: [{ label: "Пример от ръководството", values: { psize: "4096", tlb: 4, table: "5W 2W 7W 10W", acc: "12345" } },
        { label: "Смесен", values: { psize: "4096", tlb: 2, table: "5W 2R - 10C", acc: "12345 12400 100 8200 w8200 4100 w4100 70000" } },

<script>
/* Раздел 7 — разпределяне и заместване: фрагментация, first/best/worst fit, FIFO/LRU/OPT/Clock, Белади, работно множество. */
(function () {
  const S = window.Study, h = S.h;
  const FIT = { first: 0, best: 1, worst: 2 };
  const FITN = { first: "first fit", best: "best fit", worst: "worst fit" };
  const REP = { fifo: 0, lru: 1, opt: 2, clock: 3 };
  const REPN = { fifo: "FIFO", lru: "LRU", opt: "OPT (оптимална)", clock: "Clock" };
  const COLORS = ["#4f7fd0", "#d08a2a", "#3f9a64", "#b0504a", "#8a62c8", "#2a9aa8", "#a07a3a", "#c05a9a", "#6a8a2a", "#5a6aa0"];

  function parseOps(str) {
    const parts = String(str).split(/[\s,;]+/).filter(Boolean);
    if (!parts.length) throw new Error("Въведи поне една операция: +N (заяви N) или -K (освободи процес K).");
    if (parts.length > 20) throw new Error("Най-много 20 операции.");
    return parts.map((p) => {
      const m = /^([+-])(\d+)$/.exec(p);
      if (!m) throw new Error(`„${p}“ не е операция. Формат: +12 (заявка за 12) или -3 (освобождава процес 3).`);
      const v = +m[2];
      if (m[1] === "+" && (v < 1 || v > 100)) throw new Error("Размерът на заявка трябва да е от 1 до 100.");
      return { op: m[1], v };
    });
  }
  function parseRefs(str) {
    return S.parseNums(str, { min: 0, max: 9, minLen: 1, maxLen: 40 });
  }

  const algos = {
    /* Огледало на choose()/alloc()/release() */
    fit({ total, ops, policy }) {
      total = S.int(total, 4, 100, "Общата памет");
      const O = parseOps(ops), pol = FIT[policy];
      if (pol == null) throw new Error("Непозната политика.");
      let B = [{ start: 0, size: total, owner: 0 }], next = 0, failed = 0;
      const F = [];
      const snap = (o) => {
        const holes = B.filter((b) => !b.owner);
        return { B: B.map((b) => ({ ...b })), total, stats: { "свободно общо": holes.reduce((s, b) => s + b.size, 0), "най-голяма дупка": Math.max(0, ...holes.map((b) => b.size)), дупки: holes.length, неуспешни: failed }, ...o };
      };
      F.push(snap({ vars: { политика: FITN[policy] }, msg: `Памет ${total} единици, една дупка. Политика <b>${FITN[policy]}</b>.` }));
      for (const { op, v } of O) {
        if (op === "+") {
          let pick = -1;
          const cand = [];
          for (let i = 0; i < B.length; i++) {
            if (B[i].owner || B[i].size < v) continue;
            cand.push(i);
            if (pick < 0) { pick = i; if (pol === 0) break; continue; }
            if (pol === 1 && B[i].size < B[pick].size) pick = i;
            if (pol === 2 && B[i].size > B[pick].size) pick = i;
          }
          F.push(snap({ at: ["scan", ["first", "best", "worst"][pol]], cand, pick, req: v, vars: { заявка: v, кандидати: cand.map((i) => B[i].size).join(", ") || "—" }, msg: `Заявка за <b>${v}</b>. Дупки, които стигат: ${cand.length ? cand.map((i) => `[${B[i].start}, размер ${B[i].size}]`).join(", ") : "няма"}. ${pick >= 0 ? `${FITN[policy]} избира дупката с размер ${B[pick].size}${pol === 0 ? " (първата)" : pol === 1 ? " (най-малката достатъчна)" : " (най-голямата)"}.` : ""}` }));
          if (pick < 0) {
            failed++;
            const free = B.filter((b) => !b.owner).reduce((s, b) => s + b.size, 0);
            F.push(snap({ at: "fail", req: v, bad: true, vars: {}, msg: `<b class="warn">Отказ.</b> Свободни са общо ${free} единици${free >= v ? `, повече от ${v} — но не в <b>една непрекъсната</b> дупка. Това е външна фрагментация.` : "."}`, log: `+${v} ✗` }));
            continue;
          }
          const id = ++next;
          if (B[pick].size > v) B.splice(pick + 1, 0, { start: B[pick].start + v, size: B[pick].size - v, owner: 0 });
          B[pick].size = v; B[pick].owner = id;
          F.push(snap({ at: ["take", "split"], hi: pick, vars: { процес: id, начало: B[pick].start }, msg: `Процес <b>${id}</b> получава [${B[pick].start}, ${B[pick].start + v}). Остатъкът от дупката остава свободен.`, log: `+${v} → П${id} @${B[pick].start}` }));
        } else {
          const i = B.findIndex((b) => b.owner === v);
          if (i < 0) { F.push(snap({ at: "free", bad: true, vars: {}, msg: `Процес ${v} няма разпределена памет — пропускаме.` })); continue; }
          B[i].owner = 0;
          let merged = 0, k = i;
          if (k + 1 < B.length && !B[k + 1].owner) { B[k].size += B[k + 1].size; B.splice(k + 1, 1); merged++; }
          if (k > 0 && !B[k - 1].owner) { B[k - 1].size += B[k].size; B.splice(k, 1); k--; merged++; }
          F.push(snap({ at: merged ? ["free", "merge"] : "free", hi: k, vars: { освободен: v }, msg: `Процес ${v} освобождава паметта си.${merged ? ` Съседните дупки се <b>сливат</b> (${merged}).` : " Получава се нова дупка между заети блокове."}`, log: `-${v}` }));
        }
      }
      const holes = B.filter((b) => !b.owner);
      F.push(snap({ done: true, vars: {}, msg: `Край. Свободни ${holes.reduce((s, b) => s + b.size, 0)} единици в ${holes.length} дупки; най-голямата е ${Math.max(0, ...holes.map((b) => b.size))}.` }));
      return { frames: F, failed, free: holes.reduce((s, b) => s + b.size, 0), largest: Math.max(0, ...holes.map((b) => b.size)), holes: holes.length, layout: B.map((b) => `${b.owner}:${b.size}`).join(" ") };
    },

    /* Огледало на replace() */
    replace({ refs, nf, policy }) {
      const R = parseRefs(refs);
      nf = S.int(nf, 1, 8, "Броят рамки");
      const pol = REP[policy];
      if (pol == null) throw new Error("Непозната политика.");
      const n = R.length;
      const frame = [], loaded = [], used = [], refbit = [];
      let hand = 0, faults = 0;
      const victims = [], F = [], cols = [];
      const snap = (o) => ({ frame: frame.slice(), refbit: refbit.slice(), hand, nf, R, pol, cols: cols.map((c) => ({ ...c, f: c.f.slice() })), loaded: loaded.slice(), used: used.slice(), stats: { "page faults": faults, попадения: cols.filter((c) => c.hit).length }, ...o });
      F.push(snap({ t: -1, vars: { рамки: nf, политика: REPN[policy] }, msg: `${nf} рамки, политика <b>${REPN[policy]}</b>, ${n} обръщения.` }));
      for (let t = 0; t < n; t++) {
        const p = R[t];
        const hit = frame.indexOf(p);
        if (hit >= 0) {
          used[hit] = t; refbit[hit] = 1;
          cols.push({ p, f: frame.slice(), hit: true, slot: hit });
          F.push(snap({ at: ["hit", "look"], t, slot: hit, vars: { t, страница: p }, msg: `t=${t}: страница ${p} е в рамка ${hit} — <b>попадение</b>.${pol === 1 ? ` LRU обновява времето на последен достъп.` : pol === 3 ? " Clock слага бит за достъп = 1." : pol === 0 ? " FIFO <b>не</b> променя нищо — важи моментът на зареждане." : ""}` }));
          victims.push(-1);
          continue;
        }
        faults++;
        let v, why = "", evict = true, scan = null;
        if (frame.length < nf) { v = frame.length; evict = false; why = "има свободна рамка"; }
        else if (pol === 0) { v = 0; for (let i = 1; i < nf; i++) if (loaded[i] < loaded[v]) v = i; why = `заредена най-рано (t=${loaded[v]})`; }
        else if (pol === 1) { v = 0; for (let i = 1; i < nf; i++) if (used[i] < used[v]) v = i; why = `използвана най-отдавна (t=${used[v]})`; }
        else if (pol === 2) {
          let far = -1; v = 0; const nx = [];
          for (let i = 0; i < nf; i++) { let x = n; for (let k = t + 1; k < n; k++) if (R[k] === frame[i]) { x = k; break; } nx.push(x); if (x > far) { far = x; v = i; } }
          why = nx[v] === n ? "няма да се ползва повече" : `следващо ползване най-далеч (t=${nx[v]})`;
          scan = nx;
        } else {
          const cleared = [];
          while (refbit[hand]) { refbit[hand] = 0; cleared.push(hand); hand = (hand + 1) % nf; }
          v = hand; hand = (hand + 1) % nf;
          why = cleared.length ? `стрелката нулира бита на ${cleared.map((c) => "рамка " + c).join(", ")} (втори шанс) и спира на рамка ${v}` : `стрелката сочи рамка ${v} с бит 0`;
        }
        const old = frame[v];
        victims.push(evict ? old : -1);
        const tagMap = ["fifo", "lru", "opt", "clock"];
        F.push(snap({ at: evict ? ["fault", tagMap[pol]] : ["fault", "freeframe"], t, slot: v, victim: evict ? old : null, scan, vars: { t, страница: p, жертва: evict ? old : "—" }, msg: `t=${t}: страница ${p} липсва — <b>page fault</b>. ${evict ? `Жертва: страница ${old} в рамка ${v} — ${why}.` : `Зареждаме в рамка ${v} (${why}).`}` }));
        frame[v] = p; loaded[v] = t; used[v] = t; refbit[v] = 1;
        cols.push({ p, f: frame.slice(), hit: false, slot: v, victim: evict ? old : null });
        F.push(snap({ at: "load", t, slot: v, vars: { t, [`рамка ${v}`]: p }, msg: `Страница ${p} е заредена в рамка ${v}.`, log: `t=${t}: ${p} ✗${evict ? ` (изх. ${old})` : ""}` }));
      }
      F.push(snap({ t: n, done: true, vars: { "page faults": faults }, msg: `Общо <b>${faults}</b> page faults от ${n} обръщения (${((faults / n) * 100).toFixed(0)}%).` }));
      return { frames: F, faults, victims: victims.filter((x) => x >= 0).join(",") || "-" };
    },
  };

  function drawMem(st, f) {
    st.innerHTML = "";
    const W = 640, Hh = 74, u = (W - 20) / f.total;
    const svg = S.svg("svg", { class: "g", viewBox: `0 0 ${W} ${Hh}`, width: W, role: "img", "aria-label": "Карта на паметта" });
    f.B.forEach((b, i) => {
      const x = 10 + b.start * u, w = b.size * u;
      let stroke = "var(--line)", sw = 1;
      if (f.hi === i) { stroke = "var(--st-act)"; sw = 3; }
      if (f.cand && f.cand.includes(i)) { stroke = f.pick === i ? "var(--st-done)" : "var(--st-cmp)"; sw = 3; }
      svg.append(S.svg("rect", { x, y: 10, width: Math.max(1, w), height: 36, fill: b.owner ? COLORS[(b.owner - 1) % 10] : "var(--panel-2)", stroke, "stroke-width": sw, "stroke-dasharray": b.owner ? null : "4 3" }));
      if (w > 18) svg.append(S.svg("text", { x: x + w / 2, y: 33, "text-anchor": "middle", style: b.owner ? "fill:#fff;font-weight:700;font-size:11px" : "font-size:11px", class: b.owner ? "" : "wt", text: b.owner ? `П${b.owner}·${b.size}` : b.size }));
      svg.append(S.svg("text", { x, y: 64, class: "wt", style: "font-size:10px", text: b.start }));
    });
    svg.append(S.svg("text", { x: W - 10, y: 64, "text-anchor": "end", class: "wt", style: "font-size:10px", text: f.total }));
    st.append(h("div", { class: "tbl-wrap" }, svg));
    if (f.bad) st.append(h("p", { class: "warn", text: "Заявката не може да се удовлетвори с непрекъснат блок." }));
  }

  function drawRep(st, f) {
    st.innerHTML = "";
    const tb = h("table", { class: "t grid" });
    tb.append(h("tr", null, h("th", { text: "t" }), ...f.R.map((_, t) => h("th", { class: t === f.t ? "s-act" : "", text: t }))));
    tb.append(h("tr", null, h("th", { text: "обръщение" }), ...f.R.map((p, t) => h("td", { class: t === f.t ? "s-act" : t > f.t ? "s-dim" : "", style: { fontWeight: 700 }, text: p }))));
    for (let r = 0; r < f.nf; r++) {
      tb.append(h("tr", null, h("th", { text: "рамка " + r + (f.pol === 3 && r === f.hand ? " ◄" : "") }), ...f.R.map((_, t) => {
        const c = f.cols[t];
        if (!c) return h("td", { text: "" });
        const v = c.f[r];
        let cls = "";
        if (c.slot === r) cls = c.hit ? "s-done" : "s-swap";
        return h("td", { class: cls, text: v == null ? "" : v });
      })));
    }
    tb.append(h("tr", null, h("th", { text: "fault" }), ...f.R.map((_, t) => { const c = f.cols[t]; return h("td", { class: c && !c.hit ? "s-swap" : "", text: c ? (c.hit ? "" : "✗") : "" }); })));
    st.append(h("div", { class: "tbl-wrap" }, tb));
    // текущо състояние на рамките
    const box = h("div", { class: "row", style: { marginTop: "10px" } });
    for (let r = 0; r < f.nf; r++) {
      const p = f.frame[r];
      const meta = p == null ? "свободна" : f.pol === 0 ? `заредена t=${f.loaded[r]}` : f.pol === 1 ? `ползвана t=${f.used[r]}` : f.pol === 3 ? `бит=${f.refbit[r]}` : f.scan ? `следв. t=${f.scan[r] === f.R.length ? "∞" : f.scan[r]}` : "";
      box.append(h("div", { class: "card " + (f.slot === r ? (f.victim != null ? "s-swap" : "s-act") : ""), style: { minWidth: "110px", borderColor: f.slot === r ? "var(--c)" : null } },
        h("span", { class: "eyebrow", text: "рамка " + r + (f.pol === 3 && r === f.hand ? " ◄ стрелка" : "") }), h("h4", { class: "mono", text: p == null ? "—" : "стр. " + p }), h("p", { class: "mono", style: { fontSize: ".78rem" }, text: meta })));
    }
    st.append(box);
  }

  const html = `
<div class="prose">
  <p>При непрекъснато разпределяне свободното пространство може да се разпадне на отделни области — <b>външна</b> <dfn data-g="фрагментация">фрагментация</dfn>. <b>Вътрешната</b> фрагментация е неизползвана част вътре във вече разпределен блок. Страницирането премахва нуждата всяко адресно пространство да е физически непрекъснато, но не премахва всички видове фрагментация.</p>
</div>

<div class="block">
  <h3>Схема 17 · Непрекъснато разпределение и външна фрагментация</h3>
  <p class="muted">Операции: <code>+N</code> — нов процес иска N единици; <code>-K</code> — процес K освобождава паметта си. Съседните дупки се сливат. Политиките first/best/worst fit са класическите стратегии за избор на дупка <span class="extra-tag">извън конспекта</span>.</p>
  <div id="v-fit"></div>
  <details class="hint"><summary>Хинт: примерът „дупки 2 и 3“ от ръководството</summary><div>
    <p>Дупки 2 и 3 KiB не удовлетворяват искане за един непрекъснат блок от 4 KiB, въпреки че сборът е 5 KiB. Пусни „Дупки 2 и 3“: свободни са 5 единици, най-голямата дупка е 3, заявката за 4 е отказана.</p>
  </div></details>
  <details class="trap"><summary>Капан: страницирането премахва фрагментацията</summary><div>
    <p>Премахва нуждата целият процес да е физически непрекъснат — значи външната фрагментация на ниво процес изчезва. Но последната частично заета страница пак може да губи място (вътрешна фрагментация), а таблиците имат собствена цена.</p>
  </div></details>
</div>

<div class="block">
  <h3>Схема 18 · Заместване на страници</h3>
  <p class="prose">Когато трябва да се освободи рамка, политиката за заместване избира страница. <dfn data-g="fifo">FIFO</dfn> избира най-рано заредената; <dfn data-g="lru">LRU</dfn> се основава на най-отдавнашното използване; <b>Clock</b> приближава идеята чрез битове за достъп. Оптималната теоретична политика (OPT) избира страницата с най-далечно следващо използване, но изисква знание за бъдещето.</p>
  <div id="v-rep"></div>
  <details class="hint"><summary>Хинт: 1, 2, 3, 1, 4 — еднакво съдържание, различна история</summary><div>
    <p>След 1, 2, 3, 1 трите рамки съдържат {1, 2, 3} и при FIFO, и при LRU. При 4 FIFO изхвърля <b>1</b> (заредена първа), LRU изхвърля <b>2</b> (последен достъп най-отдавна, защото 1 току-що е използвана). Еднаквото текущо съдържание не означава еднаква история. Изборът на жертва не е едно и също с избора на свободна рамка.</p>
  </div></details>
  <details class="hint"><summary>Хинт: как работи Clock <span class="extra-tag">извън конспекта</span></summary><div>
    <p>Рамките са в кръг; при всяко обръщение битът за достъп на страницата става 1. При нужда от жертва стрелката обикаля: страница с бит 1 получава „втори шанс“ (битът се нулира, стрелката продължава), страница с бит 0 се изхвърля. Така се приближава LRU без пазене на точно време за всеки достъп.</p>
  </div></details>
</div>

<div class="block">
  <h3>Аномалия на Белади <span class="extra-tag">извън конспекта</span></h3>
  <p class="prose">При FIFO повече рамки понякога дават <b>повече</b> page faults. LRU и OPT нямат това свойство. Таблицата пресмята същия симулатор за 1…6 рамки върху низа на обръщения по-горе.</p>

<div class="block">
  <h3>Работно множество и thrashing</h3>
  <p class="prose"><dfn data-g="работно множество">Работното множество</dfn> съдържа активно използваните страници за определен интервал. Ако наличната памет е недостатъчна за работните множества, системата може да прекарва голяма част от времето в прехвърляне на страници — <dfn data-g="thrashing">thrashing</dfn>. Решението е свързано с общото натоварване, разпределението и политиката за памет, а не само със скоростта на носителя.</p>
  <p class="muted">Плъзгачът задава броя рамки; низът на обръщения е от симулатора по-горе. Δ е прозорецът на работното множество.</p>
  <div class="row"><label class="field"><span>рамки</span><input type="range" id="ws-f" min="1" max="8" value="3"></label><label class="field"><span>Δ (прозорец)</span><input type="range" id="ws-d" min="1" max="10" value="4"></label><span class="mono" id="ws-lbl"></span></div>
  <div class="tbl-wrap" id="ws"></div>
  <details class="trap"><summary>Капан: „по-добър алгоритъм за заместване оправя thrashing“</summary><div>
    <p>Алгоритъмът за заместване не създава липсващ физически капацитет. Намаляване на едновременно активните процеси може да е по-смислено от още по-често превключване между тях.</p>
  </div></details>
</div>

<div class="key"><b>За запомняне.</b> Вътрешна фрагментация — в блока; външна — между блоковете. FIFO — време на зареждане; LRU — време на последен достъп; OPT — бъдеще (недостижим еталон); Clock — бит за достъп, приближава LRU. Thrashing = работните множества не се побират.</div>`;

  function mount(root) {

      id: "fit", title: "Карта на паметта", sub: "Оранжев контур — дупка, която стига; зелен — избраната.",
      code: "s07_fit",
      inputs: [{ id: "total", label: "Памет", type: "number", value: 40, width: "5em" }, { id: "ops", label: "Операции (+N / -K)", value: "+12 +6 +10 +8 -1 -3 +5 +9 +4", width: "18em" },
        { id: "policy", label: "Политика", type: "select", value: "first", options: Object.keys(FIT).map((k) => [k, FITN[k]]) }],

      legend: [["s-cmp", "стига"], ["s-done", "избрана"], ["s-act", "променен блок"]],
      build: algos.fit, draw: drawMem,
    });

    const bel = root.querySelector("#belady"), ws = root.querySelector("#ws");
    let lastRefs = "1 2 3 4 1 2 5 1 2 3 4 5";
    function renderBelady() {
      bel.innerHTML = "";
      let R;
      try { R = parseRefs(lastRefs); } catch (e) { bel.append(h("p", { class: "warn", text: e.message })); return; }
      const tb = h("table", { class: "t grid" }, h("tr", null, h("th", { text: "рамки" }), ...[1, 2, 3, 4, 5, 6].map((k) => h("th", { text: k }))));
      Object.keys(REP).forEach((p) => {
        const v = [1, 2, 3, 4, 5, 6].map((k) => algos.replace({ refs: lastRefs, nf: k, policy: p }).faults);
        tb.append(h("tr", null, h("th", { text: REPN[p] }), ...v.map((x, i) => h("td", { class: i > 0 && x > v[i - 1] ? "s-swap" : "", text: x }))));
      });
      bel.append(tb, h("p", { class: "muted", style: { fontSize: ".85rem" }, text: `Низ: ${R.join(" ")}. Червено = повече faults при повече рамки (аномалия). Пример: 1 2 3 4 1 2 5 1 2 3 4 5 — FIFO с 3 рамки 9, с 4 рамки 10.` }));
    }
    const fIn = root.querySelector("#ws-f"), dIn = root.querySelector("#ws-d"), lbl = root.querySelector("#ws-lbl");
    function renderWS() {
      ws.innerHTML = "";
      let R; try { R = parseRefs(lastRefs); } catch (e) { return; }
      const nf = +fIn.value, D = +dIn.value;
      lbl.textContent = `рамки = ${nf}, Δ = ${D}`;
      const tb = h("table", { class: "t grid" }, h("tr", null, h("th", { text: "t" }), ...R.map((_, t) => h("th", { text: t }))),
        h("tr", null, h("th", { text: "стр." }), ...R.map((p) => h("td", { text: p }))));
      const wsz = R.map((_, t) => new Set(R.slice(Math.max(0, t - D + 1), t + 1)).size);
      tb.append(h("tr", null, h("th", { text: "|WS(t, Δ)|" }), ...wsz.map((x) => h("td", { class: x > nf ? "s-swap" : "s-done", text: x }))));
      const fl = algos.replace({ refs: lastRefs, nf, policy: "lru" });
      ws.append(tb, h("p", { class: "mono", text: `LRU page faults при ${nf} рамки: ${fl.faults}/${R.length}. Червено: работното множество не се побира в рамките.` }));
    }
    fIn.addEventListener("input", renderWS); dIn.addEventListener("input", renderWS);
    fIn.addEventListener("change", renderWS); dIn.addEventListener("change", renderWS);

    S.viz(root.querySelector("#v-rep"), {
      id: "rep", title: "Заместване на страници", sub: "Червено — page fault (заредената страница); зелено — попадение.",
      code: "s07_replace",
      inputs: [{ id: "refs", label: "Обръщения (страници 0–9)", value: "1 2 3 1 4", width: "20em" }, { id: "nf", label: "Рамки", type: "number", value: 3, width: "5em" },
        { id: "policy", label: "Политика", type: "select", value: "fifo", options: Object.keys(REP).map((k) => [k, REPN[k]]) }],
      presets: [{ label: "Схема 18: 1 2 3 1 4", values: { refs: "1 2 3 1 4", nf: 3 } }, { label: "Класически низ", values: { refs: "7 0 1 2 0 3 0 4 2 3 0 3 2 1 2 0 1 7 0 1", nf: 3 } },
        { label: "Белади, 3 рамки", values: { refs: "1 2 3 4 1 2 5 1 2 3 4 5", nf: 3, policy: "fifo" } }, { label: "Белади, 4 рамки", values: { refs: "1 2 3 4 1 2 5 1 2 3 4 5", nf: 4, policy: "fifo" } }],
      random: () => ({ refs: Array.from({ length: 14 }, () => S.randInt(0, 6)).join(" ") }),
      legend: [["s-swap", "fault / жертва"], ["s-done", "попадение"], ["s-act", "текущо обръщение"]],
      build(inp) { const r = algos.replace(inp); lastRefs = inp.refs; renderBelady(); renderWS(); return r; },

  }

  S.chapter({ id: "zamestvane", order: 7, num: "7", group: "Памет", title: "Разпределяне и заместване на паметта", lead: "Вътрешна и външна фрагментация, first/best/worst fit, FIFO, LRU, OPT, Clock, аномалия на Белади, работно множество и thrashing.", html, mount, algos });

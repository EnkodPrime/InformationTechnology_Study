    svg.append(S.svg("defs", null, S.svg("marker", { id: "ar0", markerUnits: "userSpaceOnUse", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 10, markerHeight: 10, orient: "auto-start-reverse" }, S.svg("path", { d: "M0,0 L10,5 L0,10 z", style: "fill:var(--ink-2)" }))));
    const box = (k, x, y, w, hh, cls) => {
      const g = S.svg("g", { class: "node " + cls, style: "cursor:pointer", tabindex: 0, onclick: () => show(k) },
        S.svg("rect", { x, y, width: w, height: hh, rx: 6, style: "fill:var(--cb,var(--panel));stroke:var(--c,var(--ink-2));stroke-width:2" }),
        S.svg("text", { x: x + w / 2, y: y + hh / 2 + 5, "text-anchor": "middle", style: "font-size:11px", text: AGENT[k].t }));

    const arrow = (x1, y1, x2, y2) => svg.append(S.svg("line", { x1, y1, x2, y2, class: "edge", style: "stroke:var(--ink-2)", "marker-end": "url(#ar0)" }));
    svg.append(S.svg("rect", { x: 200, y: 8, width: 350, height: 214, rx: 10, style: "fill:none;stroke:var(--line);stroke-dasharray:5 4" }));
    svg.append(S.svg("text", { x: 375, y: 26, "text-anchor": "middle", class: "muted", text: "АГЕНТ" }));
    const nodes = {
      env: box("env", 10, 85, 110, 56, "s-piv"),
      obs: box("obs", 215, 40, 110, 40, "s-cmp"),
      st: box("st", 340, 40, 150, 40, ""),
      kn: box("kn", 340, 100, 130, 40, ""),
      goal: box("goal", 340, 160, 130, 40, ""),

    };
    arrow(120, 100, 214, 62); arrow(326, 60, 338, 60); arrow(405, 81, 405, 98); arrow(405, 142, 405, 158);
    arrow(338, 180, 327, 180); arrow(214, 180, 120, 128);

    }
    host.append(h("div", { style: { overflowX: "auto" } }, svg));
    show("obs");
  }

  /* ---------- съдържание ---------- */
  const html = `
<div class="prose">

  <h3>Как се описва задачата</h3>
  <div class="tbl-wrap"><table class="t">

  <h3>Схеми 2 и 3 — граф на състоянията и дърво на търсене</h3>
  <p class="prose"><dfn data-g="граф на състоянията">Графът на състоянията</dfn> съдържа състояния и преходи. <dfn data-g="дърво на търсене">Дървото на търсене</dfn> съдържа конкретни пътища на разглеждане. Състоянието D може да се достигне и през A→B→D, и през A→C→D: то е <b>един връх</b> в графа и <b>два възела</b> в дървото. Промени графа и дълбочината и виж как дървото расте по-бързо от броя на състоянията.</p>

  </div></details>
  <details class="trap"><summary>Капан: „възел“ и „състояние“ като синоними</summary><div>
    <p>Възел в дървото = път до състояние. Връх в графа = състояние. Броят възли расте с броя пътища (често експоненциално), а броят състояния е фиксиран. Разпознаването на повторенията може съществено да намали работата.</p>
  </div></details>

  function mount(root) {
    drawAgent(root.querySelector("#v1-agent"), root.querySelector("#v1-agent-info"));
    S.viz(root.querySelector("#v1-unfold"), {
      id: "c1u", title: "Разгъване на граф в дърво на търсене", sub: "Оранжево — повторено състояние; червено — текущият нов възел е повторение.",
      code: false,
      inputs: [

      ],

</script>
<script>
/* Раздел 2 — търсене и евристики: BFS, DFS, uniform-cost, greedy best-first, A* върху редактируем граф. */
(function () {
  const S = window.Study, h = S.h;

  const MODES = ["bfs", "dfs", "ucs", "greedy", "astar"];
  const MN = { bfs: "BFS (опашка)", dfs: "DFS (стек)", ucs: "Uniform-cost (мин. g)", greedy: "Greedy best-first (мин. h)", astar: "A* (мин. f = g + h)" };

  function parseGraph(edges, heur, directed) {
    const names = [], idx = {}, adj = [], hv = [];
    const id = (s) => {
      if (!/^[A-Za-z0-9_]{1,8}$/.test(s)) throw new Error(`„${s}“: името е от 1 до 8 латински букви/цифри.`);
      if (!(s in idx)) { if (names.length >= 16) throw new Error("Най-много 16 състояния."); idx[s] = names.length; names.push(s); adj.push([]); hv.push(0); }
      return idx[s];
    };
    const items = String(edges).split(/[,;\n]+/).map((x) => x.trim()).filter(Boolean);
    if (!items.length) throw new Error("Въведи поне един преход: „от до цена“.");
    for (const it of items) {
      const p = it.split(/\s+/);
      if (p.length < 2 || p.length > 3) throw new Error(`„${it}“: очаква се „от до [цена]“.`);
      const w = p.length === 3 ? S.int(p[2], 1, 99, `Цената в „${it}“`) : 1;
      const a = id(p[0]), b = id(p[1]);
      adj[a].push([b, w]);
      if (!directed) adj[b].push([a, w]);
      if (adj[a].length > 15 || adj[b].length > 15) throw new Error("Твърде много преходи от едно състояние.");
    }
    for (const tok of String(heur).split(/[\s,;]+/).filter(Boolean)) {
      const m = /^([A-Za-z0-9_]{1,8})=(-?\d+)$/.exec(tok);
      if (!m) throw new Error(`„${tok}“: евристиката се задава като Име=число.`);
      if (!(m[1] in idx)) throw new Error(`Евристика за непознато състояние „${m[1]}“.`);
      hv[idx[m[1]]] = S.int(m[2], 0, 999, "h");
    }
    return { names, idx, adj, h: hv };
  }

  /** точната остатъчна цена h*(n) — Дейкстра от целта по обърнатите ребра (за проверката на допустимост) */
  function exactRemaining(G, goal) {
    const n = G.names.length, d = new Array(n).fill(Infinity), done = new Array(n).fill(false);
    d[goal] = 0;
    for (;;) {
      let u = -1;
      for (let k = 0; k < n; k++) if (!done[k] && d[k] < Infinity && (u < 0 || d[k] < d[u])) u = k;
      if (u < 0) break;
      done[u] = true;
      G.adj.forEach((l, a) => l.forEach(([b, w]) => { if (b === u && d[u] + w < d[a]) d[a] = d[u] + w; }));
    }
    return d;
  }

  /* ---------- чисти функции ---------- */
  const algos = {
    /** Същата графова процедура като search() в 02_search.c */
    search({ edges, heur, start, goal, mode, directed }) {
      const G = parseGraph(edges, heur, !!directed);
      if (!(start in G.idx)) throw new Error(`Началото „${start}“ не е в графа.`);
      if (!(goal in G.idx)) throw new Error(`Целта „${goal}“ не е в графа.`);
      const M = MODES.indexOf(mode);
      if (M < 0) throw new Error("Непознат режим.");
      const s0 = G.idx[start], t = G.idx[goal], n = G.names.length;
      const key = (e) => [e.seq, -e.seq, e.g, G.h[e.node], e.g + G.h[e.node]][M];
      const closed = new Array(n).fill(false), parent = new Array(n).fill(-1);
      let fr = [], seq = 0, expanded = 0;
      const order = [], F = [];
      const st = () => ({ разгънати: expanded, "във фронта": fr.length });
      const push = (o) => F.push(Object.assign({ G, fr: fr.map((e) => Object.assign({}, e)), closed: closed.slice(), parent: parent.slice(), order: order.slice(), mode, stats: st() }, o));
      fr.push({ node: s0, g: 0, parent: -1, seq: seq++ });
      push({ at: "init", cur: s0, vars: { start, goal }, msg: `Фронтът съдържа само началото ${start} с g = 0.`, log: `фронт: ${start}` });
      let cost = -1, finalNode = -1;
      while (fr.length) {
        push({ at: "loop", vars: { "|фронт|": fr.length }, msg: `Фронтът не е празен (${fr.length}). Избираме по критерия на ${MN[mode]}.` });
        let b = 0;
        for (let i = 1; i < fr.length; i++) { const kb = key(fr[b]), ki = key(fr[i]); if (ki < kb || (ki === kb && fr[i].seq < fr[b].seq)) b = i; }
        const e = fr[b];
        push({ at: "pick", pick: e.node, vars: { node: G.names[e.node], g: e.g, h: G.h[e.node], f: e.g + G.h[e.node] }, msg: `Избран: <b>${G.names[e.node]}</b> — ${{ bfs: "най-рано добавеният (опашка)", dfs: "най-късно добавеният (стек)", ucs: `най-малко g = ${e.g}`, greedy: `най-малко h = ${G.h[e.node]}`, astar: `най-малко f = ${e.g} + ${G.h[e.node]} = ${e.g + G.h[e.node]}` }[mode]}.` });
        fr.splice(b, 1);
        closed[e.node] = true; parent[e.node] = e.parent; expanded++; order.push(e.node);
        push({ at: "expand", cur: e.node, vars: { node: G.names[e.node], g: e.g }, msg: `${G.names[e.node]} се изважда и маркира като приключен.`, log: `разгъва ${G.names[e.node]} (g=${e.g})` });
        push({ at: "goaltest", cur: e.node, vars: { node: G.names[e.node], goal }, msg: `Проверка за цел <b>при изваждане</b>: ${G.names[e.node]} ${e.node === t ? "= цел" : "≠ " + goal}.` });
        if (e.node === t) { cost = e.g; finalNode = t; push({ at: "found", cur: t, path: true, vars: { cost }, msg: `Целта е достигната с цена <b>${cost}</b>.`, log: `цел, цена ${cost}` }); break; }
        for (const [v, w] of G.adj[e.node]) {
          const ng = e.g + w;
          push({ at: "nbr", cur: e.node, edge: [e.node, v], vars: { u: G.names[e.node], v: G.names[v], "g+w": ng }, msg: `Преход ${G.names[e.node]}→${G.names[v]} с цена ${w}: g(${G.names[v]}) = ${e.g} + ${w} = ${ng}.` });
          if (closed[v]) { push({ at: "closed", cur: e.node, edge: [e.node, v], vars: { v: G.names[v] }, msg: `${G.names[v]} вече е приключен — не се отваря повторно.` }); continue; }
          const f = fr.findIndex((x) => x.node === v);
          if (f < 0) { fr.push({ node: v, g: ng, parent: e.node, seq: seq++ }); push({ at: "push", cur: e.node, edge: [e.node, v], vars: { v: G.names[v], g: ng }, msg: `${G.names[v]} влиза във фронта (g = ${ng}).`, log: `  + ${G.names[v]} g=${ng}` }); }
          else if ((mode === "ucs" || mode === "astar") && ng < fr[f].g) { const old = fr[f].g; fr[f].g = ng; fr[f].parent = e.node; push({ at: "relax", cur: e.node, edge: [e.node, v], vars: { v: G.names[v], "старо g": old, "ново g": ng }, msg: `${G.names[v]} е във фронта с g = ${old}; новият път е по-евтин → g = ${ng}, родител ${G.names[e.node]}.`, log: `  ↓ ${G.names[v]} g=${ng}` }); }
        }
      }
      let path = [];
      if (cost >= 0) for (let v = finalNode; v >= 0; v = parent[v]) path.unshift(G.names[v]);
      // допустимост и съгласуваност (само за отчета под сцената)
      const hs = exactRemaining(G, t);
      const notAdm = G.names.filter((_, k) => hs[k] < Infinity && G.h[k] > hs[k]);
      const notCons = [];
      G.adj.forEach((l, a) => l.forEach(([b, w]) => { if (G.h[a] > w + G.h[b]) notCons.push(`${G.names[a]}→${G.names[b]}`); }));
      const opt = hs[s0] < Infinity ? hs[s0] : -1;
      if (cost < 0) push({ at: "fail", vars: { return: -1 }, msg: "Фронтът е празен — целта е недостижима.", log: "няма път" });
      const last = F[F.length - 1];
      last.done = true; last.pathNodes = path.map((x) => G.idx[x]);
      last.msg += ` Път: <b>${path.join(" → ") || "—"}</b>. Оптимална цена: ${opt < 0 ? "няма път" : opt}${cost >= 0 && opt >= 0 ? (cost === opt ? " — намереният е оптимален." : ` — <span class="warn">намереният (${cost}) НЕ е оптимален.</span>`) : ""}`;
      F.forEach((fr2) => { fr2.hstar = hs; fr2.notAdm = notAdm; fr2.notCons = notCons; });
      return { frames: F, cost, expanded, order: order.map((k) => G.names[k]).join(" "), path: path.join(" ") || "-", notAdm, notCons, opt };
    },

    /** Схема 6: кой кандидат избира всеки критерий */
    criteria({ gA, hA, gB, hB }) {
      const a = { g: S.int(gA, 0, 999, "g(A)"), h: S.int(hA, 0, 999, "h(A)") }, b = { g: S.int(gB, 0, 999, "g(B)"), h: S.int(hB, 0, 999, "h(B)") };
      const pick = (x, y) => (x < y ? "A" : y < x ? "B" : "равни");
      const rows = [
        { c: "Uniform-cost: g", A: a.g, B: b.g, w: pick(a.g, b.g) },
        { c: "Greedy: h", A: a.h, B: b.h, w: pick(a.h, b.h) },

  function layout(G, root) {

    const maxL = Math.max(0, ...lay);
    lay.forEach((l, k) => { if (l < 0) lay[k] = maxL + 1; });
    const cols = {};
    lay.forEach((l, k) => (cols[l] = cols[l] || []).push(k));
    const nc = Math.max(...lay) + 1, rowsMax = Math.max(...Object.values(cols).map((c) => c.length));
    const W = Math.max(320, nc * 110), H = Math.max(180, rowsMax * 100 + 20), P = [];
    Object.keys(cols).forEach((l) => cols[l].forEach((k, j) => (P[k] = [50 + l * 110, H * (j + 1) / (cols[l].length + 1)])));
    return { P, W, H };
  }

      if (f.mode === "greedy" || f.mode === "astar") svg.append(S.svg("text", { x: x + 20, y: y - 18, class: "wt", style: "fill:var(--st-piv)", text: `h=${G.h[k]}` }));
    });
    st.append(h("div", { style: { overflowX: "auto" } }, svg));
    // фронт
    const tbl = h("table", { class: "t grid" }, h("tr", null, ...["във фронта", "g", "h", "f=g+h", "родител", "ред"].map((x) => h("th", { text: x }))));

  /* ---------- съдържание ---------- */
  const html = `
<div class="prose">

  <details class="hint"><summary>Хинт: какво показват пресетите</summary><div>
    <p><b>„BFS ≠ най-евтин“</b>: BFS намира S→A→G (2 прехода, цена 11), а uniform-cost и A* — S→B→G (цена 7). Най-малко ребра не означава най-малка обща цена.</p>

<script>
/* Раздел 3 — печеливша стратегия и minimax: стойности нагоре по дървото на играта. */
(function () {
  const S = window.Study, h = S.h;

  /* ---------- дърво от вложени скоби, номерация в прав ред (както в 03_minimax.c) ---------- */
  function parseTree(str) {
    const s = String(str).trim();
    if (!s) throw new Error("Въведи дърво, напр. ((3 5) (2 9)).");
    const T = [];
    let p = 0;
    const ws = () => { while (p < s.length && /[\s,]/.test(s[p])) p++; };
    function node(d) {
      ws();
      if (T.length >= 120) throw new Error("Най-много 120 възела.");
      if (d > 6) throw new Error("Най-много 6 нива.");
      const id = T.length;
      T.push({ id, d, kids: [], leaf: false, value: null, parent: -1 });
      if (s[p] === "(") {
        p++;
        for (;;) {
          ws();
          if (p >= s.length) throw new Error("Липсва затваряща скоба.");
          if (s[p] === ")") { p++; break; }
          const c = node(d + 1);
          T[c].parent = id;
          T[id].kids.push(c);
          if (T[id].kids.length > 6) throw new Error("Най-много 6 наследника на възел.");
        }
        if (!T[id].kids.length) throw new Error("Празни скоби () — вътрешен възел без ходове.");
      } else {
        const m = /^-?\d+/.exec(s.slice(p));
        if (!m) throw new Error(`Неочакван знак „${s[p] || "край"}“ на позиция ${p + 1}.`);
        p += m[0].length;
        T[id].leaf = true; T[id].value = S.int(m[0], -99, 99, "Стойността на лист");
      }
      return id;
    }
    node(0);
    ws();
    if (p < s.length) throw new Error(`Излишен текст след дървото: „${s.slice(p, p + 10)}“.`);
    if (T[0].leaf) throw new Error("Коренът трябва да има ходове.");
    return T;
  }
  const isMax = (T, k) => T[k].d % 2 === 0;

  /* ---------- чисти функции ---------- */
  const algos = {
    parseTree,
    /** minimax(s, is_max) от 03_minimax.c — кадър на всяко маркирано действие */
    minimax({ tree }) {
      const T = parseTree(tree);
      const val = new Array(T.length).fill(null), F = [];
      let visited = 0, leaves = 0;
      const stack = [];

      const push = (o) => F.push(Object.assign({ T, val: val.slice(), stack: stack.slice(), stats: st() }, o));
      const who = (k) => (isMax(T, k) ? "MAX" : "MIN");
      function mm(s) {
        visited++; stack.push(s);
        push({ at: "visit", cur: s, vars: { s, ход: who(s) }, msg: `Посещаваме възел ${s} — на ход е <b>${who(s)}</b>.` });
        if (T[s].leaf) {
          leaves++; val[s] = T[s].value;
          push({ at: ["util", "leaf"], cur: s, vars: { s, "U(s)": T[s].value }, msg: `Терминално състояние: V(s) = U(s) = <b>${T[s].value}</b>.`, log: `лист ${s}: ${T[s].value}` });
          stack.pop();
          return T[s].value;
        }
        let best = isMax(T, s) ? -Infinity : Infinity;
        push({ at: "init", cur: s, vars: { s, best: isMax(T, s) ? "−∞" : "+∞" }, msg: `${who(s)} започва с best = ${isMax(T, s) ? "−∞" : "+∞"}.` });
        for (let k = 0; k < T[s].kids.length; k++) {
          const c = T[s].kids[k];
          push({ at: "rec", cur: s, next: c, vars: { s, k, best: fmt(best) }, msg: `Ход ${k + 1} от ${T[s].kids.length}: спускаме се във възел ${c}.` });
          const v = mm(c);
          const nb = isMax(T, s) ? Math.max(best, v) : Math.min(best, v);
          push({ at: "upd", cur: s, from: c, vars: { s, v, best: fmt(nb) }, msg: `${who(s)}: best = ${isMax(T, s) ? "max" : "min"}(${fmt(best)}, ${v}) = <b>${nb}</b>.` });
          best = nb;
        }
        val[s] = best;
        push({ at: "ret", cur: s, vars: { s, return: best }, msg: `Възел ${s} (${who(s)}) връща <b>${best}</b> нагоре.`, log: `${"· ".repeat(T[s].d)}V(${s}) = ${best} (${who(s)})` });
        stack.pop();
        return best;
      }
      const v = mm(0);
      // избран ход: първото дете със стойност v
      const move = T[0].kids.findIndex((c) => val[c] === v);
      const last = F[F.length - 1];
      last.done = true; last.best = T[0].kids[move];
      last.msg = `Стойност на играта: <b>${v}</b>. MAX избира ход ${move + 1} (възел ${T[0].kids[move]}). Посетени ${visited} възела, оценени ${leaves} листа — пълният minimax вижда <b>всички</b>.`;
      return { frames: F, result: v, visited, leaves, move, nodes: T.length };
    },
  };
  const fmt = (x) => (x === Infinity ? "+∞" : x === -Infinity ? "−∞" : x);

  /* ---------- рисуване на дърво на игра ---------- */
  function drawGameTree(st, f, opt = {}) {
    st.innerHTML = "";
    const T = f.T, X = [];
    let leaf = 0;
    (function place(u) { if (!T[u].kids.length) { X[u] = leaf++; return; } T[u].kids.forEach(place); X[u] = (X[T[u].kids[0]] + X[T[u].kids[T[u].kids.length - 1]]) / 2; })(0);
    const maxD = Math.max(...T.map((n) => n.d));
    const dx = Math.max(34, Math.min(90, Math.floor(620 / Math.max(1, leaf)))), W = Math.max(240, leaf * dx + 40), dy = 74, H = 50 + maxD * dy + 20;
    const svg = S.svg("svg", { class: "g", viewBox: `0 0 ${W} ${H}`, width: W });
    const px = (u) => 20 + dx / 2 + X[u] * dx, py = (u) => 28 + T[u].d * dy;
    const onStack = new Set(f.stack || []);
    const cut = new Set(f.cutAll || []);
    T.forEach((n) => { if (n.parent >= 0) {
      const cls = cut.has(n.id) ? "s-swap" : f.best === n.id ? "s-piv" : onStack.has(n.id) ? "s-act" : f.val[n.id] != null ? "s-done" : "";
      svg.append(S.svg("line", { x1: px(n.parent), y1: py(n.parent), x2: px(n.id), y2: py(n.id), class: "edge " + cls, style: cut.has(n.id) ? "stroke-dasharray:4 4" : null }));
    } });
    T.forEach((n) => {
      const u = n.id, x = px(u), y = py(u), mx = isMax(T, u);
      let cls = cut.has(u) ? "s-swap" : u === f.cur ? "s-act" : u === f.best ? "s-piv" : f.val[u] != null ? "s-done" : onStack.has(u) ? "s-cmp" : "";
      if (opt.dimUnvisited && f.val[u] == null && !onStack.has(u) && !cut.has(u)) cls = "s-dim";
      const r = 15;
      const shape = n.leaf ? S.svg("rect", { x: x - r, y: y - r, width: 2 * r, height: 2 * r, rx: 3, style: "fill:var(--cb,var(--panel));stroke:var(--c,var(--ink-2));stroke-width:2" })
        : S.svg("path", { d: mx ? `M${x},${y - r - 3} L${x + r + 3},${y + r - 2} L${x - r - 3},${y + r - 2} Z` : `M${x},${y + r + 3} L${x + r + 3},${y - r + 2} L${x - r - 3},${y - r + 2} Z`, style: "fill:var(--cb,var(--panel));stroke:var(--c,var(--ink-2));stroke-width:2" });
      const shown = n.leaf ? n.value : f.val[u] != null ? f.val[u] : "";
      svg.append(S.svg("g", { class: "node " + cls }, shape, S.svg("text", { x, y: y + (n.leaf ? 5 : mx ? 8 : 2), "text-anchor": "middle", "font-weight": 700, style: "font-size:12px", text: shown })));
      svg.append(S.svg("text", { x: x + (n.leaf ? 0 : 0), y: y - r - 7, "text-anchor": "middle", class: "wt", style: "font-size:9px", text: u }));
      if (opt.ab && f.ab && f.ab[u]) svg.append(S.svg("text", { x, y: y + r + 14, "text-anchor": "middle", class: "wt", style: "font-size:10px", text: `α${fmt(f.ab[u][0])} β${fmt(f.ab[u][1])}` }));
    });
    // етикети на нивата
    for (let d = 0; d < maxD; d++) svg.append(S.svg("text", { x: 4, y: 32 + d * dy, class: "muted", style: "font-size:10px", text: d % 2 ? "MIN" : "MAX" }));
    st.append(h("div", { style: { overflowX: "auto", maxWidth: "100%" } }, svg));
  }

  /* ---------- Схема 8: път ≠ стратегия (щракаема игра) ---------- */
  function strategyGame(host) {
    const OUT = { A: { x: "победа", y: "загуба" }, B: { x: "победа", y: "победа" } };
    const box = h("div", { class: "card" });
    const info = h("p", { "aria-live": "polite" });
    let our = null;
    const row1 = h("div", { class: "row" }, h("span", { class: "muted", text: "Наш ход:" }));
    const row2 = h("div", { class: "row" }, h("span", { class: "muted", text: "Отговор на противника:" }));
    const res = h("div", { class: "row", style: { marginTop: "6px" } });
    ["A", "B"].forEach((m) => row1.append(h("button", { class: "btn", onclick: () => { our = m; render(); }, text: "ход " + m })));
    ["x", "y"].forEach((r) => row2.append(h("button", { class: "btn", onclick: () => { if (!our) { info.textContent = "Първо избери наш ход."; return; } info.innerHTML = `След ход ${our} противникът отговаря с ${r} → <b>${OUT[our][r]}</b>.`; }, text: "отговор " + r })));
    function render() {
      res.innerHTML = "";
      ["A", "B"].forEach((m) => {
        const all = Object.values(OUT[m]).every((o) => o === "победа"), some = Object.values(OUT[m]).some((o) => o === "победа");
        res.append(h("span", { class: "pill " + (all ? "s-done" : some ? "s-cmp" : "s-swap"), text: `${m}: ${all ? "гарантира победа" : some ? "има път към победа, но не я гарантира" : "губи"}` }));
      });
      info.innerHTML = our ? `Избран е ход ${our}. Сега избери отговор на противника — ти играеш и срещу себе си.` : "";
    }
    box.append(row1, row2, info, res);
    const tbl = h("table", { class: "t grid" }, h("tr", null, h("th", { text: "" }), h("th", { text: "отговор x" }), h("th", { text: "отговор y" })),
      ...["A", "B"].map((m) => h("tr", null, h("th", { text: "ход " + m }), ...["x", "y"].map((r) => h("td", { class: OUT[m][r] === "победа" ? "s-done" : "s-swap", text: OUT[m][r] })))));
    host.append(h("div", { class: "split", style: { alignItems: "start" } }, h("div", { class: "tbl-wrap" }, tbl), box));
    render();
  }

  /* ---------- съдържание ---------- */
  const html = `
<div class="prose">
  <p><dfn data-g="стратегия">Стратегията</dfn> е правило за действие за всяка релевантна ситуация или история. <dfn data-g="печеливша стратегия">Печеливша</dfn> е тази, която гарантира победа срещу <b>всички</b> допустими действия на противника при зададените начално състояние и правила. „Често печели“ е по-слабо твърдение и не доказва печеливша стратегия.</p>
</div>

<div class="block">
  <h3>Схема 8 — съществуващ път и гарантирана стратегия</h3>
  <p class="prose">При обикновено търсене питаме дали съществува път до цел. В игра противникът също избира. И двата наши хода имат път към победа; само B я гарантира срещу двата показани отговора при точно това пълно дърво. Изиграй и двете страни.</p>
  <div id="v3-strat"></div>
  <details class="trap"><summary>Капан: „намерих добър ход, значи имам печеливша стратегия“</summary><div>
    <p>Нужно е да се отчетат всички допустими отговори на противника и нашите последващи избори. Един път е само един възможен вариант. Един красив вариант не доказва стратегия, ако противникът може да избере друго продължение.</p>
  </div></details>
</div>

<div class="block">
  <h3>Схема 7 — minimax стъпка по стъпка</h3>
  <p class="prose"><dfn data-g="minimax">Minimax</dfn> е приложим в стандартния модел: крайна детерминирана игра за двама с последователни ходове, пълна информация и нулева сума. MAX (▲) избира най-голямата стойност, MIN (▼) — най-малката за MAX. Стойностите се изкачват <b>отдолу нагоре</b>: листата дават U(s), всеки вътрешен възел връща max или min на децата си. Дървото се въвежда с вложени скоби; номерът над възела е редът на обхождане.</p>
  <div id="v3-mm"></div>
  <div class="key"><span class="formula">V(s) = U(s)                 за терминално s</span><br><span class="formula">V(s) = max V(child)          ход на MAX</span><br><span class="formula">V(s) = min V(child)          ход на MIN</span><br>Пълният minimax при разклонение b и дълбочина d разглежда <b>O(b^d)</b> възли.</div>
  <details class="hint"><summary>Хинт: защо не избираме листа 9</summary><div>
    <p>Левият MIN има листа 3 и 5 и връща 3; десният — 2 и 9 и връща 2. MAX сравнява 3 и 2 и избира левия ход. Листът 9 не оправдава избор надясно: противникът не е длъжен да го предостави. Изборът на 9 би пренебрегнал интереса на противника.</p>
  </div></details>
  <details class="trap"><summary>Капан: точна стойност срещу оценка</summary><div>
    <p>При ограничена дълбочина листата на хоризонта не са терминални — стойността им идва от <dfn data-g="оценъчна функция">оценъчна функция</dfn>. Полученият ход е най-добър спрямо <b>оцененото</b> дърво, а не доказана победа в цялата игра. <dfn data-g="ефект на хоризонта">Ефектът на хоризонта</dfn> възниква, когато съществено последствие остава отвъд границата на търсене.</p>
    <p>При случайни събития се добавят вероятности и очаквани стойности (<dfn data-g="expectiminimax">expectiminimax</dfn>). Случайният ход на средата не е същият като най-неблагоприятния избор на противник.</p>
  </div></details>
  <details class="hint"><summary>Реален пример: IBM Deep Blue</summary><div>
    <p>Исторически пример за игрова система: IBM Deep Blue използва специализирано търсене и оценяване в шах. Учебният minimax обяснява избора срещу оптимален противник; реалните шахматни програми добавят множество оптимизации — първата от тях е <a href="#alfabeta">алфа-бета отсичането</a>.</p>
  </div></details>
</div>`;

  function mount(root) {
    strategyGame(root.querySelector("#v3-strat"));
    S.viz(root.querySelector("#v3-mm"), {
      id: "c3m", title: "Minimax по дървото на играта", sub: "▲ MAX, ▼ MIN, ■ лист. Синьо — текущ; оранжево — в стека на рекурсията; зелено — стойността е изчислена; виолетово — избраният ход.",
      code: "ch03_minimax",
      inputs: [{ id: "tree", label: "Дърво (вложени скоби)", value: "((3 5) (2 9))", width: "26em" }],

        { label: "3 5 срещу 2 9", values: { tree: "((3 5) (2 9))" } },
        { label: "3×3", values: { tree: "((3 12 8) (2 4 6) (14 5 2))" } },
        { label: "дълбочина 3", values: { tree: "(((3 17) (2 12)) ((15) (25 0)) ((2 5) (3)) ((2 14)))" } },
        { label: "път ≠ стратегия (1/−1)", values: { tree: "((1 -1) (1 1))" } },
      ],
      random: () => { const r = () => S.randInt(-9, 20); const b = S.randInt(2, 3); return { tree: "(" + Array.from({ length: b }, () => "(" + Array.from({ length: S.randInt(2, 3) }, () => "(" + Array.from({ length: S.randInt(1, 3) }, r).join(" ") + ")").join(" ") + ")").join(" ") + ")" }; },
      legend: [["s-act", "текущ"], ["s-cmp", "в стека"], ["s-done", "изчислен"], ["s-piv", "избран ход"]],
      build: algos.minimax, draw: (st, f) => drawGameTree(st, f), speed: 1,
    });
  }

  S.Tema08 = Object.assign(S.Tema08 || {}, { drawGameTree, fmt });
  S.chapter({ id: "minimax", order: 3, num: "3", group: "Печеливши стратегии", title: "Печеливша стратегия и minimax",
    lead: "Стратегия срещу всеки отговор на противника, а не един път. Minimax изкачва стойностите от листата до корена: max на ход на MAX, min на ход на MIN.", html, mount, algos });

</script>
<script>
/* Раздел 4 — алфа-бета отсичане: α, β по пътя, отсечени клони, влияние на реда на ходовете. */
(function () {
  const S = window.Study, h = S.h;
  const fmt = (x) => (x === Infinity ? "+∞" : x === -Infinity ? "−∞" : x);

  /* разбор — същият формат и номерация като в 03_minimax.c (самостоятелно копие за тестовете) */
  function parseTree(str) {
    const s = String(str).trim();
    if (!s) throw new Error("Въведи дърво, напр. ((3 5) (2 9)).");
    const T = [];
    let p = 0;
    const ws = () => { while (p < s.length && /[\s,]/.test(s[p])) p++; };
    function node(d) {
      ws();
      if (T.length >= 120) throw new Error("Най-много 120 възела.");
      if (d > 6) throw new Error("Най-много 6 нива.");
      const id = T.length;
      T.push({ id, d, kids: [], leaf: false, value: null, parent: -1 });
      if (s[p] === "(") {
        p++;
        for (;;) {
          ws();
          if (p >= s.length) throw new Error("Липсва затваряща скоба.");
          if (s[p] === ")") { p++; break; }
          const c = node(d + 1);
          T[c].parent = id; T[id].kids.push(c);
          if (T[id].kids.length > 6) throw new Error("Най-много 6 наследника на възел.");
        }
        if (!T[id].kids.length) throw new Error("Празни скоби () — вътрешен възел без ходове.");
      } else {
        const m = /^-?\d+/.exec(s.slice(p));
        if (!m) throw new Error(`Неочакван знак „${s[p] || "край"}“ на позиция ${p + 1}.`);
        p += m[0].length;
        T[id].leaf = true; T[id].value = S.int(m[0], -99, 99, "Стойността на лист");
      }
      return id;
    }
    node(0); ws();
    if (p < s.length) throw new Error(`Излишен текст след дървото: „${s.slice(p, p + 10)}“.`);
    if (T[0].leaf) throw new Error("Коренът трябва да има ходове.");
    return T;
  }
  const isMax = (T, k) => T[k].d % 2 === 0;
  function mmValue(T, s) { if (T[s].leaf) return T[s].value; const v = T[s].kids.map((c) => mmValue(T, c)); return isMax(T, s) ? Math.max(...v) : Math.min(...v); }
  function toStr(T, s) { return T[s].leaf ? String(T[s].value) : "(" + T[s].kids.map((c) => toStr(T, c)).join(" ") + ")"; }
  const subtree = (T, s) => [s, ...T[s].kids.flatMap((c) => subtree(T, c))];

  /* ---------- чисти функции ---------- */
  const algos = {
    /** пренарежда ходовете: best — най-добрият за играча на ход първи; worst — най-лошият първи */
    reorder({ tree, order }) {
      const T = parseTree(tree);
      if (order === "given") return toStr(T, 0);
      (function rec(s) {
        if (T[s].leaf) return;
        T[s].kids.forEach(rec);
        const sign = (isMax(T, s) ? -1 : 1) * (order === "best" ? 1 : -1);
        T[s].kids.sort((a, b) => sign * (mmValue(T, a) - mmValue(T, b)));
      })(0);
      return toStr(T, 0);
    },

    /** alphabeta(s, α, β, is_max) от 03_minimax.c */
    alphabeta({ tree, order }) {
      const src = order && order !== "given" ? algos.reorder({ tree, order }) : tree;
      const T = parseTree(src);
      const val = new Array(T.length).fill(null), ab = new Array(T.length).fill(null), F = [];
      const cutRoots = [], cutAll = [], stack = [];
      let visited = 0, leaves = 0;
      const st = () => ({ "посетени възли": visited, "оценени листа": leaves, "отсечени възли": cutAll.length, "всички възли": T.length });
      const push = (o) => F.push(Object.assign({ T, val: val.slice(), ab: ab.map((x) => (x ? x.slice() : null)), stack: stack.slice(), cutAll: cutAll.slice(), stats: st() }, o));
      const who = (k) => (isMax(T, k) ? "MAX" : "MIN");
      function rec(s, alpha, beta) {
        visited++; stack.push(s); ab[s] = [alpha, beta];
        push({ at: "visit", cur: s, vars: { s, ход: who(s), α: fmt(alpha), β: fmt(beta) }, msg: `Възел ${s} (${who(s)}) получава граници α = ${fmt(alpha)}, β = ${fmt(beta)}.` });
        if (T[s].leaf) {
          leaves++; val[s] = T[s].value;
          push({ at: ["util", "leaf"], cur: s, vars: { s, "U(s)": T[s].value }, msg: `Лист: стойност <b>${T[s].value}</b>.`, log: `лист ${s}: ${T[s].value}` });
          stack.pop(); return T[s].value;
        }
        const mx = isMax(T, s);
        let best = mx ? -Infinity : Infinity;
        push({ at: "init", cur: s, vars: { s, best: fmt(best), α: fmt(alpha), β: fmt(beta) }, msg: `${who(s)}: best = ${fmt(best)}.` });
        for (let k = 0; k < T[s].kids.length; k++) {
          const c = T[s].kids[k];
          push({ at: "rec", cur: s, next: c, vars: { s, k, α: fmt(alpha), β: fmt(beta) }, msg: `Спускаме се в ход ${k + 1} (възел ${c}) с α = ${fmt(alpha)}, β = ${fmt(beta)}.` });
          const v = rec(c, alpha, beta);
          if (mx) { best = Math.max(best, v); alpha = Math.max(alpha, best); }
          else { best = Math.min(best, v); beta = Math.min(beta, best); }
          ab[s] = [alpha, beta];
          push({ at: mx ? "updmax" : "updmin", cur: s, from: c, vars: { s, v, best, α: fmt(alpha), β: fmt(beta) }, msg: mx ? `MAX: best = ${best}; α = max(α, best) = <b>${fmt(alpha)}</b> — MAX вече си е осигурил поне толкова.` : `MIN: best = ${best}; β = min(β, best) = <b>${fmt(beta)}</b> — MIN може да задържи резултата най-много до толкова.` });
          const cut = alpha >= beta;
          push({ at: "test", cur: s, vars: { α: fmt(alpha), β: fmt(beta), "α ≥ β": cut }, msg: `α ≥ β? ${fmt(alpha)} ≥ ${fmt(beta)} → <b>${cut}</b>.${cut ? "" : " Продължаваме със следващия ход."}` });
          if (cut) {
            const rest = T[s].kids.slice(k + 1);
            if (rest.length) {
              rest.forEach((r) => { cutRoots.push(r); cutAll.push(...subtree(T, r)); });
              push({ at: "cut", cur: s, vars: { отсечени: rest.join(" ") }, msg: mx
                ? `<b>Отсичане</b> в MAX възел ${s}: MAX вече има ≥ ${fmt(alpha)}, а MIN по-горе няма да допусне повече от ${fmt(beta)}. Ходове ${rest.join(", ")} не могат да променят избора.`
                : `<b>Отсичане</b> в MIN възел ${s}: тук MIN може да задържи ≤ ${fmt(beta)}, а MAX по-горе вече има ${fmt(alpha)}. MAX няма да избере този клон — останалите ходове (${rest.join(", ")}) не могат да го направят по-добър.`,
                log: `✂ при ${s}: ${rest.join(", ")}` });
            } else push({ at: "cut", cur: s, vars: {}, msg: "α ≥ β, но няма оставащи ходове за отсичане." });
            break;
          }
        }
        val[s] = best;
        push({ at: "ret", cur: s, vars: { s, return: best }, msg: `Възел ${s} връща <b>${best}</b>.`, log: `${"· ".repeat(T[s].d)}V(${s}) = ${best}` });
        stack.pop(); return best;
      }
      const v = rec(0, -Infinity, Infinity);
      const full = mmValue(T, 0);
      const last = F[F.length - 1];
      last.done = true;
      last.inv = { text: `стойността ${v} съвпада с пълния minimax (${full})`, ok: v === full };
      last.msg = `Стойност <b>${v}</b>. Посетени ${visited} от ${T.length} възела, оценени ${leaves} листа; отсечени ${cutAll.length} възела.`;
      return { frames: F, result: v, visited, leaves, cut: cutRoots.join(" ") || "-", nodes: T.length, tree: src };
    },

    /** сравнение по ред на ходовете: посетени възли при пълен minimax и при алфа-бета */
    compare({ tree }) {
      const rows = ["given", "best", "worst"].map((o) => {
        const src = algos.reorder({ tree, order: o });
        const T = parseTree(src);
        const r = algos.alphabeta({ tree: src, order: "given" });
        return { o, src, all: T.length, ab: r.visited, leaves: r.leaves, allLeaves: T.filter((n) => n.leaf).length, v: r.result };
      });
      return { frames: [{ rows }], rows };
    },
  };

  /* ---------- рисуване ---------- */
  function drawAB(st, f) {
    const D = S.Tema08 && S.Tema08.drawGameTree;
    if (!D) { st.textContent = "Липсва рисуването на дърво (раздел 3)."; return; }
    D(st, f, { ab: true });
  }
  function drawCompare(st, f) {
    st.innerHTML = "";
    const N = { given: "както е въведено", best: "най-добрият ход първи", worst: "най-лошият ход първи" };
    const t = h("table", { class: "t grid" }, h("tr", null, ...["ред на ходовете", "дърво", "възли: пълен minimax", "възли: алфа-бета", "листа: minimax → α-β", "стойност"].map((x) => h("th", { text: x }))));
    f.rows.forEach((r) => t.append(h("tr", null, h("td", { style: { textAlign: "left", fontFamily: "var(--f-body)" }, text: N[r.o] }), h("td", { style: { textAlign: "left", fontSize: ".75rem" }, text: r.src }), h("td", { text: r.all }),
      h("td", { class: r.ab < r.all ? "s-done" : "s-swap", text: r.ab }), h("td", { text: `${r.allLeaves} → ${r.leaves}` }), h("td", { text: r.v }))));
    st.append(h("div", { class: "tbl-wrap" }, t));
  }

  /* ---------- съдържание ---------- */
  const html = `
<div class="prose">

<script>
/* Раздел 5 — доказуема печеливша стратегия: игра с купчина, ретроградно оцветяване, индукция. */
(function () {
  const S = window.Study, h = S.h;

  function parseMoves(str) {
    const M = S.parseNums(str, { min: 1, max: 9, minLen: 1, maxLen: 5 });
    return [...new Set(M)].sort((a, b) => a - b);
  }

  /* ---------- чисти функции ---------- */
  const algos = {
    parseMoves,
    /** retro() от 05_nim.c: W/L за 0..N */
    retro({ N, moves, misere }) {
      N = S.int(N, 1, 40, "Броят предмети");
      const M = parseMoves(moves), m = M.length, mis = misere === "1" || misere === true || misere === 1;
      const win = new Array(N + 1).fill(null), best = new Array(N + 1).fill(null), F = [];
      const st = () => ({ печеливши: win.filter((x) => x === 1).length, губещи: win.filter((x) => x === 0).length });
      const push = (o) => F.push(Object.assign({ win: win.slice(), best: best.slice(), N, M, mis, stats: st() }, o));
      win[0] = mis ? 1 : 0; best[0] = -1;
      push({ at: "base", n: 0, vars: { n: 0, "win[0]": win[0] }, msg: mis ? "0 предмета и ти си на ход: противникът е взел последния и <b>губи</b> ⇒ позиция 0 е <b>печеливша</b> (W) за теб." : "0 предмета и ти си на ход: противникът е взел последния и <b>печели</b> ⇒ позиция 0 е <b>губеща</b> (L).", log: `0: ${win[0] ? "W" : "L"} (база)` });
      for (let n = 1; n <= N; n++) {
        win[n] = 0; best[n] = -1;
        push({ at: ["init", "loop"], n, vars: { n }, msg: `Позиция ${n}: приемаме, че е губеща, докато не намерим ход към губеща.` });
        for (let k = 0; k < m; k++) {
          const t = M[k];
          if (t > n) { push({ at: "skip", n, t, vars: { n, t }, msg: `Ход ${t} не е допустим — има само ${n}.` }); continue; }
          const lose = !win[n - t];
          push({ at: "test", n, t, vars: { n, t, "n−t": n - t, "win[n−t]": win[n - t] }, msg: `Вземаме ${t} → оставяме ${n - t}, което е ${win[n - t] ? "W (печеливша за противника)" : "<b>L (губеща за противника)</b>"}.` });
          if (lose) { win[n] = 1; best[n] = t; push({ at: "win", n, t, vars: { n, "best[n]": t }, msg: `Има ход към губеща позиция ⇒ ${n} е <b>печеливша</b>: вземи ${t}.`, log: `${n}: W (вземи ${t} → ${n - t})` }); break; }
        }
        if (!win[n]) push({ at: "move", n, vars: { n }, msg: `Всеки допустим ход оставя печеливша позиция на противника ⇒ ${n} е <b>губеща</b>.`, log: `${n}: L` });
      }
      const L = win.map((w, n) => (w ? null : n)).filter((x) => x !== null);
      const last = F[F.length - 1];
      last.done = true;
      last.msg += ` Губещите позиции до ${N}: <b>${L.join(", ")}</b>.`;
      return { frames: F, pattern: win.map((w) => (w ? "W" : "L")).join(""), best: best.join(" "), win, bestArr: best, M, mis };
    },

    /** игра стратегия срещу стратегия — както в main() на 05_nim.c */
    game({ N, moves, misere }) {
      const R = algos.retro({ N, moves, misere });
      const { win, bestArr, M, mis } = R;
      let n = +N, side = 0;
      const seq = [];
      while (n > 0) {
        let t = win[n] ? bestArr[n] : 0;
        if (!t) for (const x of M) if (x <= n) { t = x; break; }
        if (!t) break;
        seq.push(t); n -= t; side ^= 1;
      }
      let first = mis ? side === 0 : side === 1;
      if (n > 0) first = side === 1;
      return { seq: seq.join(" "), first: first ? 1 : 0 };
    },
  };

  /* ---------- рисуване ---------- */
  function drawRetro(st, f) {
    st.innerHTML = "";
    const cls = {};
    f.win.forEach((w, n) => { cls[n] = w === null ? "s-dim" : w ? "s-done" : "s-swap"; });
    if (f.n != null) cls[f.n] = "s-act";
    if (f.t != null && f.n - f.t >= 0) cls[f.n - f.t] = cls[f.n - f.t] === "s-swap" ? "s-swap" : "s-cmp";
    const arr = f.win.map((w) => (w === null ? "?" : w ? "W" : "L"));
    const ptr = {};
    if (f.n != null) ptr.n = f.n;
    if (f.t != null && f.n - f.t >= 0 && f.n - f.t !== f.n) ptr["n−" + f.t] = f.n - f.t;
    S.drawArray(st, arr, { cls, ptr });
    st.append(h("p", { class: "muted", style: { fontSize: ".8rem", marginTop: "6px" }, text: `Позволени ходове: {${f.M.join(", ")}}. Правило: ${f.mis ? "взелият последния ГУБИ" : "взелият последния ПЕЧЕЛИ"}. W — печеливша за играча на ход, L — губеща.` }));
  }

  /* ---------- интерактивна игра срещу стратегията ---------- */
  function playBox(host) {
    const N = h("input", { type: "number", value: 6, min: 1, max: 40, style: { width: "5em" }, "aria-label": "Начален брой" });
    const Mi = h("input", { type: "text", value: "1 2 3", style: { width: "7em" }, "aria-label": "Позволени ходове" });
    const mis = h("select", { "aria-label": "Правило" }, h("option", { value: "0", text: "взелият последния печели" }), h("option", { value: "1", text: "взелият последния губи" }));
    const first = h("select", { "aria-label": "Кой започва" }, h("option", { value: "me", text: "аз започвам" }), h("option", { value: "ai", text: "стратегията започва" }));
    const pile = h("div", { class: "arr", style: { flexWrap: "wrap", minHeight: "40px" } });
    const btns = h("div", { class: "row" });
    const log = h("div", { class: "log", style: { maxHeight: "180px" } });
    const info = h("p", { "aria-live": "polite" });
    let R = null, n = 0, over = false;
    function start() {
      try { R = algos.retro({ N: N.value, moves: Mi.value, misere: mis.value }); } catch (e) { info.innerHTML = `<span class="warn">${S.esc(e.message)}</span>`; return; }
      n = +N.value; over = false; log.innerHTML = "";
      info.innerHTML = `Позиция ${n} е <b>${R.win[n] ? "печеливша" : "губеща"}</b> за първия играч при оптимална игра.`;
      if (first.value === "ai") aiMove(); else render();
    }
    function end(lastMover) {
      over = true;
      const lastWins = mis.value === "0";
      const winner = lastWins ? lastMover : lastMover === "аз" ? "стратегията" : "аз";
      info.innerHTML = `Купчината е празна. Последният ход беше на <b>${lastMover === "аз" ? "теб" : "стратегията"}</b> ⇒ печели <b>${winner === "аз" ? "ти" : "стратегията"}</b>.`;
      render();
    }
    function stuck(who) { over = true; info.innerHTML = `${who === "аз" ? "Нямаш" : "Стратегията няма"} допустим ход — ${who === "аз" ? "губиш" : "печелиш"}.`; render(); }
    function aiMove() {
      if (over) return;
      let t = R.win[n] ? R.bestArr[n] : 0;
      if (!t) t = R.M.find((x) => x <= n) || 0;
      if (!t) return stuck("ai");
      n -= t;
      log.append(h("div", { html: `стратегията взема ${t} → остават <b>${n}</b> (${R.win[n] ? "W" : "L"} за теб)` }));
      if (n === 0) return end("ai");
      if (!R.M.some((x) => x <= n)) return stuck("аз");
      render();
    }
    function myMove(t) {
      if (over || t > n) return;
      n -= t;
      log.append(h("div", { html: `ти взимаш ${t} → остават <b>${n}</b> (${R.win[n] ? "W" : "L"} за стратегията)` }));
      if (n === 0) return end("аз");
      aiMove();
    }
    function render() {
      pile.innerHTML = "";
      for (let k = 0; k < n; k++) pile.append(h("div", { class: "cell s-piv", style: { width: "22px", height: "22px", minWidth: "22px" } }, ""));
      if (!n) pile.append(h("span", { class: "muted", text: "празно" }));
      btns.innerHTML = "";
      if (R && !over) R.M.forEach((t) => btns.append(h("button", { class: "btn primary", disabled: t > n ? true : null, onclick: () => myMove(t), text: `вземи ${t}` })));
      if (R && !over) btns.append(h("span", { class: "muted", style: { fontSize: ".8rem" }, text: `Позиция ${n}: ${R.win[n] ? "печеливша за теб" : "губеща за теб"}` }));
      log.scrollTop = log.scrollHeight;
    }
    host.append(h("div", { class: "viz" },
      h("div", { class: "viz-head" }, h("h4", { text: "Изиграй срещу печелившата стратегия" }), h("span", { class: "sub", text: "Започни от печеливша позиция и опитай да спечелиш; започни от губеща и виж, че нищо не помага." })),
      h("div", { class: "viz-inputs" }, h("label", { class: "field" }, h("span", { text: "предмети" }), N), h("label", { class: "field" }, h("span", { text: "ходове" }), Mi), h("label", { class: "field" }, h("span", { text: "правило" }), mis), h("label", { class: "field" }, h("span", { text: "кой започва" }), first), h("button", { class: "btn primary", onclick: start, text: "Нова игра" })),
      h("div", { class: "viz-stage" }, pile, btns, info, log)));
    start();
  }

  /* ---------- съдържание ---------- */
  const html = `
<div class="prose">
  <p>Minimax доказва стратегия за конкретно дърво. При игри с проста структура може да се докаже стратегия за <b>всички</b> начални позиции наведнъж. Купчина с n предмета; на ход играчът взема 1, 2 или 3; печели взелият последния.</p>
</div>

<div class="block">
  <h3>Ретроградно оцветяване: печеливши и губещи позиции</h3>
  <p class="prose">Позициите се класифицират отдолу нагоре, точно като стойностите в minimax. Позиция е <b>печеливша (W)</b> за играча на ход, ако има ход към <dfn data-g="губеща позиция">губеща</dfn> за противника; <b>губеща (L)</b> — ако всеки ход води към печеливша. Промени множеството от ходове или правилото.</p>
  <div id="v5-retro"></div>
  <div class="key"><b>Взелият последния печели, ходове {1,2,3}:</b> губещи са кратните на 4. От некратно на 4 оставяме кратно; след ход k на противника вземаме 4 − k и възстановяваме свойството. От купчина 6 първо вземаме 2.</div>
  <details class="hint"><summary>Хинт: доказателството по индукция</summary><div>
    <p><b>Твърдение:</b> n е губеща ⇔ n ≡ 0 (mod 4).</p>
    <p><b>База:</b> n = 0 — играчът на ход няма какво да вземе; противникът е взел последния и е спечелил ⇒ губеща.</p>
    <p><b>Стъпка:</b> ако n = 4q, всеки ход k ∈ {1,2,3} дава 4q − k, което не е кратно на 4 ⇒ по индукционното предположение е печеливша за противника. Ако n = 4q + r, r ∈ {1,2,3}, ходът k = r оставя 4q ⇒ губеща за противника. ∎</p>
    <p>Индукцията доказва резултата <b>за тези правила</b>. Визуализаторът горе е същото доказателство, изпълнено механично.</p>
  </div></details>
  <details class="trap"><summary>Капан: смяна на правилото „последният печели“</summary><div>
    <p>При вземане на 1, 2 или 3, като <b>взелият последния губи</b>, губещи за играча на ход са 1, 5, 9, … (4k + 1). От 2, 3, 4 оставяме 1; от 4k + 1 всяко вземане дава на противника възможност да върне такова състояние. За начални 6 вземаме 1 и оставяме 5. Смяната на правилото променя <b>базовия случай</b> и целия шаблон — стратегията трябва да се преизведе. Пробвай пресета „последният губи“.</p>
  </div></details>
</div>

<div class="block">
  <h3>Схема 10 — игра срещу стратегията</h3>
  <div id="v5-play"></div>
  <details class="hint"><summary>Хинт: защо стратегията играе „най-малкото“ от губеща позиция</summary><div>
    <p>От губеща позиция няма ход, който да гарантира нещо срещу оптимален противник — всеки е еднакво лош. Стратегията взема най-малкия допустим, за да остави на противника повече възможности да сгреши. Това не променя теоретичния изход.</p>
  </div></details>
</div>`;

  function mount(root) {
    S.viz(root.querySelector("#v5-retro"), {
      id: "c5r", title: "Ретроградно оцветяване W/L", sub: "Зелено W — печеливша, червено L — губеща за играча на ход; оранжево — позицията след разглеждания ход.",
      code: "ch05_retro",
      inputs: [
        { id: "N", label: "до n =", type: "number", value: 12, width: "5em" },

      ],
      presets: [
        { label: "{1,2,3}, печели", values: { N: 12, moves: "1 2 3", misere: "0" } },
        { label: "последният губи", values: { N: 13, moves: "1 2 3", misere: "1" } },

(function () {

  function compile(src) {
    const s = String(src).replace(/→/g, "->").replace(/¬/g, "!").replace(/∧/g, "&").replace(/∨/g, "|");
    if (!s.trim()) throw new Error("Празна формула.");
    let p = 0;
    const ws = () => { while (s[p] === " ") p++; };
    function atom() {
      ws();
      if (s[p] === "!") { p++; const a = atom(); return (v) => !a(v); }

      if (k < 0 || !s[p]) throw new Error(`„${s[p] || "край"}“ във „${src}“: допустими са P Q R S ! & | -> ( ).`);

    function conj() { let a = atom(); for (ws(); s[p] === "&"; ws()) { p++; const l = a, r = atom(); a = (v) => l(v) && r(v); } return a; }

    const f = imp();
    ws();

<script>
/* Раздел 8 — продукционни правила: прав и обратен извод върху редактируема база (същият механизъм като 08_rules.c). */
(function () {
  const S = window.Study, h = S.h;
  const enc = typeof TextEncoder !== "undefined" ? new TextEncoder() : null;
  const bytes = (s) => (enc ? enc.encode(s).length : s.length * 2);
  const OPS = [">=", "<=", ">", "<", "="];

  /* ---------- разбор (същите правила като parse_rules / parse_facts в C) ---------- */
  function parseRules(text) {
    const R = [];
    String(text).split(/[;\n]+/).forEach((ln) => {
      const a = ln.indexOf("->");
      if (a < 0) { if (ln.trim()) throw new Error(`„${ln.trim()}“: липсва „->“.`); return; }
      let lhs = ln.slice(0, a), name;
      const c = lhs.indexOf(":");
      if (c >= 0) { name = lhs.slice(0, c).trim(); lhs = lhs.slice(c + 1); } else name = "R" + (R.length + 1);
      const concl = ln.slice(a + 2).trim();
      const cond = lhs.split("&").map((x) => x.trim()).filter(Boolean);
      if (!concl) throw new Error(`Правило ${name}: празно заключение.`);
      if (!cond.length) throw new Error(`Правило ${name}: няма условия.`);
      if (cond.length > 6) throw new Error(`Правило ${name}: най-много 6 условия.`);
      if (bytes(name) > 15) throw new Error(`Името „${name}“ е твърде дълго.`);
      for (const s of [concl, ...cond]) if (bytes(s) > 47 || /\s/.test(s)) throw new Error(`„${s}“: символът трябва да е без интервали и до ~22 букви.`);
      if (/[<>=]/.test(concl)) throw new Error(`Правило ${name}: заключението е символ, не сравнение.`);
      R.push({ name, cond, concl });
    });
    if (!R.length) throw new Error("Няма правила. Формат: R1: A & B -> C (по едно на ред или разделени с ;).");
    if (R.length > 24) throw new Error("Най-много 24 правила.");
    return R;
  }
  function parseFacts(text) {
    const W = [];
    String(text).split(/[\s,]+/).filter(Boolean).forEach((t) => {
      const e = t.indexOf("=");
      if (bytes(t) > 47) throw new Error(`„${t}“ е твърде дълъг.`);
      if (e >= 0) { const n = Number(t.slice(e + 1)); if (!Number.isInteger(n)) throw new Error(`„${t}“: стойността трябва да е цяло число.`); W.push({ sym: t.slice(0, e), num: n, hasNum: true, by: -1 }); }
      else W.push({ sym: t, hasNum: false, by: -1 });
    });
    if (W.length > 20) throw new Error("Най-много 20 начални факта.");
    return W;
  }

  /* ---------- машина за извод ---------- */
  function engine(rules, facts) {
    const R = parseRules(rules), W = parseFacts(facts);
    const E = { R, W, tests: 0, fired: [] };
    E.find = (s) => W.findIndex((f) => f.sym === s);
    E.holds = (c) => {
      E.tests++;
      for (const op of OPS) {
        const p = c.indexOf(op);
        if (p < 0) continue;
        const f = E.find(c.slice(0, p));
        if (f < 0 || !W[f].hasNum) return false;
        const x = W[f].num, n = parseInt(c.slice(p + op.length), 10) || 0;
        return op === ">=" ? x >= n : op === "<=" ? x <= n : op === ">" ? x > n : op === "<" ? x < n : x === n;
      }
      return E.find(c) >= 0;
    };
    E.assert = (s, by) => { if (W.length >= 48) throw new Error("Работната памет е пълна (48 факта)."); W.push({ sym: s, hasNum: false, by }); };
    E.wm = () => W.filter((f) => !f.hasNum).map((f) => f.sym).join(" ") || "-";
    E.firedNames = () => E.fired.map((r) => R[r].name).join(" ") || "-";
    return E;
  }

  /** „как“-обяснение: дърво от факта назад до входните факти */
  function explain(E, sym, seen = new Set()) {
    const i = E.find(sym);
    if (i < 0) return { sym, kind: "missing" };
    const f = E.W[i];
    if (f.by < 0) return { sym: f.hasNum ? `${f.sym}=${f.num}` : sym, kind: "input" };
    if (seen.has(sym)) return { sym, kind: "loop" };
    seen.add(sym);
    const r = E.R[f.by];
    return { sym, kind: "rule", rule: r.name, kids: r.cond.map((c) => {
      const op = OPS.find((o) => c.includes(o));
      if (op) { const v = c.slice(0, c.indexOf(op)), j = E.find(v); return { sym: c, kind: "test", val: j >= 0 ? `${v}=${E.W[j].num}` : "?" }; }
      return explain(E, c, seen);
    }) };
  }

  /* ---------- чисти функции ---------- */
  const algos = {
    parseRules, parseFacts, engine, explain,

    /** forward(strategy, refraction, limit) от 08_rules.c */
    forward({ rules, facts, strategy, refraction, limit }) {
      const E = engine(rules, facts);
      const strat = +strategy === 1 ? 1 : 0, refr = !(refraction === false || refraction === "0");
      const LIM = limit == null ? 12 : S.int(limit, 1, 40, "Лимитът на цикли");
      const { R, W } = E;
      let cycles = 0, result;
      const F = [];
      const snap = () => W.map((f) => Object.assign({}, f));
      const st = () => ({ цикли: cycles, "проверки на условия": E.tests, задействания: E.fired.length });
      const push = (o) => F.push(Object.assign({ R, W: snap(), fired: E.fired.slice(), stats: st() }, o));
      push({ at: "cycle", ruleSt: {}, vars: {}, msg: "Начална работна памет: " + W.map((f) => (f.hasNum ? `${f.sym}=${f.num}` : f.sym)).join(", ") + ". Стратегия: " + (strat ? "по специфичност" : "по реда на правилата") + (refr ? ", с рефракция." : ", <b>без</b> рефракция."), log: "старт" });
      for (;;) {
        if (++cycles > LIM) { push({ at: "limit", ruleSt: {}, vars: { цикъл: cycles }, msg: `<span class="warn">Прекъснато след ${LIM} цикъла</span> — едно и също правило се задейства отново и отново без нова информация. Това е причината за <b>рефракцията</b>.`, inv: { text: "безкраен цикъл без нова информация", ok: false }, log: "✗ лимит" }); result = -1; break; }
        const ruleSt = {};
        let chosen = -1;
        push({ at: "cycle", ruleSt: {}, vars: { цикъл: cycles }, msg: `<b>Цикъл ${cycles}</b>: съпоставяне — проверяваме всяко правило спрямо работната памет.` });
        for (let r = 0; r < R.length; r++) {
          if (refr && E.find(R[r].concl) >= 0) { ruleSt[r] = "refr"; push({ at: "refr", ruleSt: Object.assign({}, ruleSt), rcur: r, vars: { правило: R[r].name }, msg: `${R[r].name}: заключението „${R[r].concl}“ вече е в паметта — рефракция, не се разглежда.` }); continue; }
          let ok = true;
          const cs = [];
          for (let c = 0; c < R[r].cond.length && ok; c++) { ok = E.holds(R[r].cond[c]); cs.push(ok); }
          ruleSt[r] = ok ? "cs" : "no";
          push({ at: "cond", ruleSt: Object.assign({}, ruleSt), rcur: r, conds: cs, vars: { правило: R[r].name }, msg: `${R[r].name}: ${R[r].cond.map((c, k) => (k < cs.length ? `${c} ${cs[k] ? "✓" : "✗"}` : `<span class="muted">${c} (не се проверява)</span>`)).join(", ")} ⇒ ${ok ? "<b>в конфликтното множество</b>" : "не е приложимо"}.` });
          if (!ok) continue;
          if (chosen < 0 || (strat === 1 && R[r].cond.length > R[chosen].cond.length)) chosen = r;
        }
        const cset = Object.keys(ruleSt).filter((k) => ruleSt[k] === "cs").map(Number);
        if (chosen < 0) { push({ at: "stop", ruleSt, vars: {}, msg: "Конфликтното множество е празно — няма какво повече да се изведе. Изводът спира.", log: "край" }); result = E.fired.length; break; }
        push({ at: "conflict", ruleSt, chosen, vars: { "конфликтно множество": cset.map((k) => R[k].name).join(", "), избрано: R[chosen].name }, msg: `<dfn data-g="конфликтно множество">Конфликтно множество</dfn>: {${cset.map((k) => R[k].name).join(", ")}}. Избираме <b>${R[chosen].name}</b> ${strat ? `(най-много условия: ${R[chosen].cond.length})` : "(първо по ред)"}.` });
        const isNew = E.find(R[chosen].concl) < 0;
        if (isNew) E.assert(R[chosen].concl, chosen);
        E.fired.push(chosen);
        push({ at: isNew ? ["fire", "act"] : "act", ruleSt, chosen, newFact: isNew ? R[chosen].concl : null, vars: { задейства: R[chosen].name }, msg: isNew ? `${R[chosen].name} се задейства: добавяме <b>${R[chosen].concl}</b> в работната памет.` : `${R[chosen].name} се задейства отново, но „${R[chosen].concl}“ вече е там — <b>няма нова информация</b>.`, log: `${R[chosen].name} ⇒ ${R[chosen].concl}${isNew ? "" : " (повторно)"}` });
      }
      const last = F[F.length - 1];
      last.done = true;
      return { frames: F, result, wm: E.wm(), fired: E.firedNames(), cycles, tests: E.tests, E };
    },

    /** prove(goal) от 08_rules.c */
    backward({ rules, facts, goal }) {
      const E = engine(rules, facts);
      const G = String(goal).trim();
      if (!G) throw new Error("Въведи цел.");
      const { R, W } = E;
      let calls = 0;
      const STACK = [], F = [], tree = [];
      const snap = () => W.map((f) => Object.assign({}, f));
      const st = () => ({ "извиквания prove": calls, "проверки": E.tests, "дълбочина": STACK.length });
      const push = (o) => F.push(Object.assign({ R, W: snap(), stack: STACK.slice(), tree: tree.map((n) => Object.assign({}, n)), stats: st() }, o));
      function prove(goal, parent) {
        calls++;
        const id = tree.length;
        tree.push({ id, goal, parent, st: "open", rule: null, d: STACK.length });
        push({ at: "call", cur: id, vars: { цел: goal }, msg: `prove(<b>${goal}</b>) — ${STACK.length ? "подцел" : "основна цел"}.` });
        if (E.holds(goal)) { tree[id].st = "fact"; push({ at: "known", cur: id, vars: { цел: goal }, msg: `„${goal}“ е в работната памет (или сравнението е вярно) — <b>доказано</b>.`, log: `${"· ".repeat(STACK.length)}${goal}: факт` }); return true; }
        if (STACK.includes(goal)) { tree[id].st = "loop"; push({ at: "loopchk", cur: id, vars: { цел: goal }, msg: `„${goal}“ вече се доказва по-горе в стека — цикъл, отхвърляме този път.`, log: `${"· ".repeat(STACK.length)}${goal}: цикъл` }); return false; }
        if (STACK.length >= 16) { tree[id].st = "fail"; return false; }
        STACK.push(goal);
        let any = false;
        for (let r = 0; r < R.length; r++) {
          if (R[r].concl !== goal) continue;
          any = true;
          tree[id].rule = R[r].name;
          push({ at: ["try", "rules"], cur: id, rcur: r, vars: { цел: goal, правило: R[r].name }, msg: `Правило ${R[r].name} извежда „${goal}“. Подцели: ${R[r].cond.join(", ")}.` });
          let ok = true;
          for (let c = 0; c < R[r].cond.length && ok; c++) {
            push({ at: "sub", cur: id, rcur: r, vars: { цел: goal, подцел: R[r].cond[c] }, msg: `Подцел ${c + 1}/${R[r].cond.length}: <b>${R[r].cond[c]}</b>.` });
            ok = prove(R[r].cond[c], id);
          }
          if (ok) {
            E.assert(goal, r); E.fired.push(r);
            tree[id].st = "proved";
            STACK.pop();
            push({ at: "proved", cur: id, rcur: r, vars: { цел: goal }, msg: `Всички подцели на ${R[r].name} са доказани ⇒ „${goal}“ е <b>доказано</b> и се добавя в паметта.`, log: `${"· ".repeat(STACK.length)}${goal}: ✓ чрез ${R[r].name}` });
            return true;
          }
          push({ at: "try", cur: id, rcur: r, vars: { цел: goal }, msg: `${R[r].name} не успя. ${R.slice(r + 1).some((x) => x.concl === goal) ? "Пробваме следващо правило със същото заключение." : ""}` });
        }
        STACK.pop();
        tree[id].st = "fail";
        push({ at: "fail", cur: id, vars: { цел: goal }, msg: any ? `Нито едно правило не доказа „${goal}“ — <b>неуспех</b>.` : `„${goal}“ не е факт и няма правило, което да го извежда — <b>неуспех</b>.`, log: `${"· ".repeat(STACK.length)}${goal}: ✗` });
        return false;
      }
      const ok = prove(G, -1);
      const last = F[F.length - 1];
      last.done = true;
      last.inv = { text: ok ? `целта „${G}“ е доказана` : `целта „${G}“ не може да се докаже от наличните факти и правила`, ok };
      return { frames: F, proved: ok ? 1 : 0, wm: E.wm(), fired: E.firedNames(), calls, tests: E.tests, E };
    },
  };

  /* ---------- рисуване ---------- */
  function wmBox(f, extra) {
    const box = h("div", { class: "card" }, h("span", { class: "eyebrow", text: "Работна памет" }));
    const p = h("div", { class: "row", style: { gap: "4px" } });
    f.W.forEach((w) => p.append(h("span", { class: "pill " + (w.by < 0 ? "s-piv" : w.sym === (extra && extra.newFact) ? "s-act" : "s-done"), title: w.by < 0 ? "входен факт" : "изведен от " + f.R[w.by].name, text: w.hasNum ? `${w.sym}=${w.num}` : w.sym })));
    box.append(p, h("p", { class: "muted", style: { fontSize: ".72rem", margin: "6px 0 0" }, text: "виолетово — вход; зелено — изведено" }));
    return box;
  }
  function rulesTable(f, stmap, opts = {}) {
    const LBL = { refr: ["s-dim", "рефракция"], cs: ["s-cmp", "приложимо"], no: ["", "не"] };
    const t = h("table", { class: "t" }, h("tr", null, h("th", { text: "" }), h("th", { text: "АКО" }), h("th", { text: "ТО" }), h("th", { text: "състояние" })));
    f.R.forEach((r, k) => {
      let cls = "", lab = "";
      if (stmap && stmap[k]) { [cls, lab] = LBL[stmap[k]]; }
      if (opts.chosen === k) { cls = "s-done"; lab = "избрано"; }
      if (opts.rcur === k) { cls = "s-act"; lab = lab || "проверява се"; }
      t.append(h("tr", { class: cls }, h("td", { class: "mono", style: { color: "var(--c, inherit)", fontWeight: 600 }, text: r.name }),
        h("td", null, ...r.cond.map((c, i) => h("span", { class: "pill " + (opts.rcur === k && f.conds ? (i < f.conds.length ? (f.conds[i] ? "s-done" : "s-swap") : "s-dim") : ""), style: { margin: "1px" }, text: c }))),
        h("td", { class: "mono", text: r.concl }), h("td", { text: lab })));
    });
    return h("div", { class: "tbl-wrap" }, t);
  }
  function drawForward(st, f) {
    st.innerHTML = "";
    st.append(h("div", { class: "split", style: { alignItems: "start" } }, rulesTable(f, f.ruleSt, { chosen: f.chosen, rcur: f.rcur }), wmBox(f, f)));
  }
  function drawBackward(st, f) {
    st.innerHTML = "";
    const T = f.tree, kids = T.map(() => []);
    T.forEach((n) => { if (n.parent >= 0) kids[n.parent].push(n.id); });
    const ul = (id) => {
      const n = T[id];
      const C = { open: "s-cmp", fact: "s-piv", proved: "s-done", fail: "s-swap", loop: "s-swap" }[n.st];
      const L = { open: "доказва се…", fact: "факт", proved: "доказано чрез " + n.rule, fail: "неуспех", loop: "цикъл" }[n.st];
      return h("li", null, h("span", { class: "pill " + (id === f.cur ? "s-act" : C), text: n.goal }), " ", h("span", { class: "muted", style: { fontSize: ".75rem" }, text: L }),
        kids[id].length ? h("ul", { style: { margin: "4px 0 4px 6px", paddingLeft: "14px", borderLeft: "1px dashed var(--line)" } }, ...kids[id].map(ul)) : null);
    };
    const tree = h("div", { class: "card" }, h("span", { class: "eyebrow", text: "Дърво на доказателството (цел → подцели)" }), T.length ? h("ul", { style: { listStyle: "none", paddingLeft: "0", margin: "6px 0" } }, ul(0)) : null);
    st.append(h("div", { class: "split", style: { alignItems: "start" } }, tree, h("div", { style: { display: "grid", gap: "10px", minWidth: 0 } }, wmBox(f), rulesTable(f, null, { rcur: f.rcur }))));
  }

  /* ---------- съдържание ---------- */
  const KB1 = "R1: T>80 -> прегряване; R2: липсва_захранване -> провери_захранващия_път; R3: има_захранване & не_отговаря -> провери_връзката; R4: не_отговаря -> рестартирай; R5: прегряване & провери_връзката -> спри_и_охлади";
  const KB2 = "R1: A & B -> C; R2: C -> D; R3: D & E -> G; R4: F -> G; R5: G -> H";
  const KB3 = "R1: P -> Q; R2: Q -> P; R3: S -> P";

  const html = `
<div class="prose">
  <p><dfn data-g="продукционно правило">Продукционното правило</dfn> има вид <b>АКО</b> условие <b>ТО</b> заключение или действие. Едни и същи правила могат да се използват в две посоки: <dfn data-g="прав извод">прав извод</dfn> започва от известните факти и извежда следствия; <dfn data-g="обратен извод">обратен извод</dfn> започва от цел и търси подкрепящи факти и подцели. Това са <b>посоки на работа</b>, а не различни степени на логическа надеждност.</p>
  <p>Базата от правила е <b>редактируема</b>: правилата се разделят с „;“, всяко във вид „Име: условие & условие -> заключение“. Условие е символ (факт) или сравнение с числов факт: <code>T&gt;80</code>, <code>T&lt;=5</code>, <code>P=1</code>. Фактите се въвеждат с интервал: <code>T=90 има_захранване</code>.</p>

<div class="block">
  <h3>Прав извод: съпоставяне → конфликтно множество → избор → изпълнение</h3>

  <div class="key">Цикълът на правия извод: (1) <b>съпоставяне</b> на условията с работната памет; (2) <b>конфликтно множество</b> — всички приложими правила; (3) <b>избор</b> по стратегия (приоритет, специфичност, новост); (4) <b>изпълнение</b> — ново заключение в паметта. Край — когато множеството е празно.</div>
  <details class="hint"><summary>Хинт: стратегията променя реда, не резултата (тук)</summary><div>

  </div></details>
</div>

<div class="block">
  <h3>Схема 15 — обратен извод върху същите правила</h3>
  <p class="prose">Целта се доказва, ако е факт или ако има правило с това заключение, чиито условия (подцели) могат да се докажат. Правилата се пробват по ред; при неуспех — следващото със същото заключение. Пробвай „алтернативно правило“ (G се доказва през R4, след като R3 не успява) и „цикъл“.</p>

<script>
/* Раздел 9 — експертни системи: архитектура, мини-система с обяснение, придобиване и проверка на знанията. */
(function () {
  const S = window.Study, h = S.h;

  /* ---------- чисти функции ---------- */
  function parseRulesLite(text) {
    const R = [];
    String(text).split(/[;\n]+/).forEach((ln) => {
      const a = ln.indexOf("->");
      if (a < 0) { if (ln.trim()) throw new Error(`„${ln.trim()}“: липсва „->“.`); return; }
      let lhs = ln.slice(0, a), name;
      const c = lhs.indexOf(":");
      if (c >= 0) { name = lhs.slice(0, c).trim(); lhs = lhs.slice(c + 1); } else name = "R" + (R.length + 1);
      const cond = lhs.split("&").map((x) => x.trim()).filter(Boolean), concl = ln.slice(a + 2).trim();
      if (!cond.length || !concl) throw new Error(`Правило ${name}: нужни са условие и заключение.`);
      R.push({ name, cond, concl });
    });
    if (!R.length) throw new Error("Няма правила.");
    return R;
  }
  const varOf = (c) => { const m = /^([^<>=]+)(>=|<=|>|<|=)/.exec(c); return m ? m[1] : c; };

  const algos = {
    /** Проверка на базата: противоречиви двойки, непокрити условия, недостижими заключения, цикли. */
    checkKB({ rules, inputs, contra }) {
      const R = parseRulesLite(rules);
      const IN = new Set(String(inputs).split(/[\s,;]+/).filter(Boolean));
      const CONTRA = String(contra).split(/[;,]+/).map((x) => x.trim()).filter(Boolean).map((p) => p.split("/").map((x) => x.trim()));
      const concl = new Set(R.map((r) => r.concl));
      const issues = [];
      // 1) условие, което нито е вход, нито се извежда
      R.forEach((r) => r.cond.forEach((c) => { const v = varOf(c); if (!IN.has(v) && !concl.has(v)) issues.push({ kind: "непокрито условие", rule: r.name, text: `„${v}“ не е входно измерване и никое правило не го извежда — ${r.name} никога няма да се задейства.` }); }));
      // 2) еднакви условия, противоречиви заключения
      for (let i = 0; i < R.length; i++) for (let j = i + 1; j < R.length; j++) {
        const same = R[i].cond.slice().sort().join("&") === R[j].cond.slice().sort().join("&");
        const opp = CONTRA.some(([a, b]) => (R[i].concl === a && R[j].concl === b) || (R[i].concl === b && R[j].concl === a));
        if (same && R[i].concl !== R[j].concl && opp) issues.push({ kind: "противоречие", rule: `${R[i].name}, ${R[j].name}`, text: `Едни и същи условия водят до „${R[i].concl}“ и „${R[j].concl}“, обявени за несъвместими.` });
        else if (opp) issues.push({ kind: "възможно противоречие", rule: `${R[i].name}, ${R[j].name}`, text: `„${R[i].concl}“ и „${R[j].concl}“ са несъвместими; проверете дали условията им могат да са верни едновременно.` });

      Object.keys(adj).forEach((u) => { if (!color[u]) dfs(u, [u]); });
      cyc.forEach((c) => issues.push({ kind: "цикъл", rule: "", text: c }));
      return { frames: [{ R, issues }], issues, count: issues.length };
    },
  };

  const ARCH = {

<script>
/* Раздел 10 — допълнение и оценяване: вероятност ≠ размита принадлежност; три вида гаранции; символни, обучаващи и хибридни системи. */
(function () {
  const S = window.Study, h = S.h;

  /* ---------- чисти функции ---------- */
  const algos = {
    /** трапецовидна функция на принадлежност μ(x) с параметри a ≤ b ≤ c ≤ d */
    membership({ a, b, c, d, x }) {
      a = S.int(a, -20, 60, "a"); b = S.int(b, -20, 60, "b"); c = S.int(c, -20, 60, "c"); d = S.int(d, -20, 60, "d"); x = S.int(x, -20, 60, "x");
      if (!(a <= b && b <= c && c <= d)) throw new Error("Нужно е a ≤ b ≤ c ≤ d.");
      const mu = (t) => (t <= a || t >= d ? (t >= b && t <= c ? 1 : 0) : t < b ? (t - a) / (b - a) : t <= c ? 1 : (d - t) / (d - c));
      const pts = [];
      for (let t = -10; t <= 50; t++) pts.push([t, mu(t)]);
      return { frames: [{ a, b, c, d, x, m: mu(x), pts }], mu: mu(x) };
    },
  };

  /* ---------- рисуване ---------- */
  function drawMu(st, f) {
    st.innerHTML = "";

    for (let t = -10; t <= 50; t += 10) svg.append(S.svg("text", { x: X(t), y: H - 12, "text-anchor": "middle", class: "wt", text: t + "°" }));
    svg.append(S.svg("polyline", { points: f.pts.map(([t, m]) => `${X(t)},${Y(m)}`).join(" "), style: "fill:none;stroke:var(--st-piv);stroke-width:2.5" }));

  ];

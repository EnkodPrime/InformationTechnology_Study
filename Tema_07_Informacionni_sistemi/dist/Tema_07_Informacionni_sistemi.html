<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Информационни системи · Тема 7</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* InformationTechnology_Study — обща визия за всички теми.
   Концепция: инженерна тетрадка — тих лист, ясна йерархия, кодът е равностоен на картината.
   Цветът е запазен за състоянията на алгоритъма (сравнение, размяна, готово, опорен). */
:root {
  --bg: #eef1f4;
  --paper: #fbfcfd;
  --panel: #ffffff;
  --panel-2: #f2f5f8;
  --ink: #18212b;
  --ink-2: #3b4856;
  --muted: #66727f;
  --line: #d6dde4;
  --line-2: #e6ebf0;
  --accent: #1f5fbf;
  --accent-ink: #ffffff;
  --accent-soft: #e2ecfa;

  --st-act: #1f5fbf;      /* текущ / активен */
  --st-act-bg: #dce8fb;
  --st-cmp: #b86e00;      /* сравнение */
  --st-cmp-bg: #fbecd2;
  --st-swap: #c2352b;     /* размяна / конфликт */
  --st-swap-bg: #fadcd8;
  --st-done: #1d7a46;     /* готово / вярно */
  --st-done-bg: #d9f0e2;
  --st-piv: #7445b8;      /* опорен / специален */
  --st-piv-bg: #ebe1f8;
  --st-dim: #a7b1bb;

  --code-bg: #f6f8fa;
  --code-ink: #1f2933;
  --code-hl: #fff2c9;
  --code-hl-edge: #d99a00;
  --tk-kw: #8b2bb0;
  --tk-type: #0b6e7a;
  --tk-num: #b35200;
  --tk-str: #2b7a2b;
  --tk-com: #7a8794;
  --tk-fn: #1f5fbf;
  --tk-pp: #a03a6a;

  --f-display: "IBM Plex Sans Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", Roboto, system-ui, sans-serif;
  --f-mono: "JetBrains Mono", "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace;

  --r: 6px;
  --shadow: 0 1px 2px rgba(20, 30, 45, .06), 0 4px 14px rgba(20, 30, 45, .05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1319; --paper: #121921; --panel: #172029; --panel-2: #1c2631;
    --ink: #e4eaf0; --ink-2: #c3ccd5; --muted: #8b98a5; --line: #2b3743; --line-2: #222d38;
    --accent: #6ea3f2; --accent-ink: #0b1420; --accent-soft: #1b2e4a;
    --st-act: #6ea3f2; --st-act-bg: #1d3352; --st-cmp: #f0ad45; --st-cmp-bg: #43331a;
    --st-swap: #f07468; --st-swap-bg: #4a2220; --st-done: #5cc98a; --st-done-bg: #173b28;
    --st-piv: #b494ec; --st-piv-bg: #33264d; --st-dim: #4d5966;
    --code-bg: #121a22; --code-ink: #d9e1e8; --code-hl: #3a3417; --code-hl-edge: #e0b030;
    --tk-kw: #d39af0; --tk-type: #5fc8d3; --tk-num: #f2a55e; --tk-str: #8fd68f; --tk-com: #6d7c8a;
    --tk-fn: #82b3f5; --tk-pp: #e88ab5;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1319; --paper: #121921; --panel: #172029; --panel-2: #1c2631;
  --ink: #e4eaf0; --ink-2: #c3ccd5; --muted: #8b98a5; --line: #2b3743; --line-2: #222d38;
  --accent: #6ea3f2; --accent-ink: #0b1420; --accent-soft: #1b2e4a;
  --st-act: #6ea3f2; --st-act-bg: #1d3352; --st-cmp: #f0ad45; --st-cmp-bg: #43331a;
  --st-swap: #f07468; --st-swap-bg: #4a2220; --st-done: #5cc98a; --st-done-bg: #173b28;
  --st-piv: #b494ec; --st-piv-bg: #33264d; --st-dim: #4d5966;
  --code-bg: #121a22; --code-ink: #d9e1e8; --code-hl: #3a3417; --code-hl-edge: #e0b030;
  --tk-kw: #d39af0; --tk-type: #5fc8d3; --tk-num: #f2a55e; --tk-str: #8fd68f; --tk-com: #6d7c8a;
  --tk-fn: #82b3f5; --tk-pp: #e88ab5;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.6 var(--f-body);
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 30; background: var(--paper);
}
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, kbd, .mono { font-family: var(--f-mono); font-size: .9em; }
code { background: var(--panel-2); padding: .05em .35em; border-radius: 4px; }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: 2rem; font-weight: 600; letter-spacing: -.01em; }
h2 { font-size: 1.55rem; font-weight: 600; }
h3 { font-size: 1.2rem; font-weight: 600; }
h4 { font-size: 1rem; font-weight: 600; }
p { margin: 0; }
.eyebrow { font: 600 .72rem/1.2 var(--f-body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }

/* ---------- каркас ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--paper); border-bottom: 1px solid var(--line);
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.topbar .brand { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.topbar .brand b { font: 600 1.05rem/1.2 var(--f-display); }
.topbar .brand span { font-size: .78rem; color: var(--muted); }
.topbar .sp { flex: 1; }
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  font: 500 .85rem/1 var(--f-body); padding: 8px 12px; border-radius: var(--r); cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; min-height: 34px; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.icon { padding: 8px 10px; font-family: var(--f-mono); }

.layout {
  display: grid; grid-template-columns: 264px minmax(0, 1fr); gap: 0;
  min-height: calc(100vh - 60px);
}
.sidenav {
  border-right: 1px solid var(--line); background: var(--paper);
  padding: 18px 12px 40px; position: sticky; top: 60px; align-self: start;
  max-height: calc(100vh - 60px); overflow: auto;
}
.sidenav ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.sidenav a {
  display: grid; grid-template-columns: 2.1em 1fr; gap: 4px; align-items: baseline;
  text-decoration: none; color: var(--ink-2); padding: 7px 8px; border-radius: var(--r); font-size: .9rem; line-height: 1.3;
}
.sidenav a .n { font: 500 .78rem var(--f-mono); color: var(--muted); }
.sidenav a:hover { background: var(--panel-2); }
.sidenav a.on { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.sidenav a.seen .n::after { content: " ✓"; color: var(--st-done); }
.sidenav .group { margin: 14px 8px 6px; }
.navselect { display: none; }

main.content {
  min-width: 0;
  padding-block: 28px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.chapter { max-width: 1120px; margin: 0 auto; display: grid; gap: 22px; }
.chapter > header { display: grid; gap: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.chapter > header .lead { color: var(--ink-2); max-width: 70ch; font-size: 1.02rem; }
.prose { max-width: 72ch; display: grid; gap: 12px; }
p.prose { display: block; }
.prose ul, .prose ol { margin: 0; padding-left: 1.3em; display: grid; gap: 4px; }
.block { display: grid; gap: 14px; }
.chapter-body > *, .block > * { min-width: 0; }
.block > h3 { padding-top: 6px; }
.chapnav .btn { white-space: normal; text-align: left; max-width: 100%; line-height: 1.3; }
.chapnav { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 16px; margin-top: 10px; }

/* ---------- речник: подсказки ---------- */
dfn[data-g] {
  font-style: normal; border-bottom: 1.5px dotted var(--accent); cursor: help; color: inherit;
}
dfn[data-g]:hover, dfn[data-g]:focus { background: var(--accent-soft); outline: none; }
.term-source {
  display: inline-flex; align-items: center; justify-content: center;
  width: 1.05em; height: 1.05em; margin-left: .16em; vertical-align: .08em;
  border: 1px solid var(--line); border-radius: 50%; color: var(--accent);
  font-family: var(--mono); font-size: .72em; font-weight: 700; line-height: 1;
  text-decoration: none;
}
.term-source:hover, .term-source:focus { background: var(--accent-soft); border-color: var(--accent); outline: none; }
.term-source-card-wrap { position: relative; display: block; min-width: 0; }
.term-source-card-wrap > .card { width: 100%; height: 100%; padding-right: 38px; }
.term-source-card-links { position: absolute; top: 10px; right: 10px; display: flex; gap: 4px; }
.term-source-card-links .term-source { margin-left: 0; font-size: .78em; }
.gtip {
  position: fixed; z-index: 60; max-width: min(360px, calc(100vw - 32px));
  background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r);
  box-shadow: var(--shadow); padding: 10px 12px; font-size: .86rem; line-height: 1.45; display: grid; gap: 4px;
}
.gtip b { font-family: var(--f-display); font-size: .95rem; }
.gtip .en { color: var(--muted); font-size: .78rem; }
.gtip .more { color: var(--ink-2); border-top: 1px solid var(--line-2); padding-top: 6px; margin-top: 2px; }

.drawer {
  position: fixed; z-index: 50; top: 0; right: 0; bottom: 0; width: min(420px, 100vw);
  background: var(--paper); border-left: 1px solid var(--line); box-shadow: var(--shadow);
  display: grid; grid-template-rows: auto auto 1fr;
  padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.drawer .dh { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.drawer .dh h3 { flex: 1; }
.drawer input { margin: 12px 16px; }
.drawer .dl { overflow: auto; padding: 0 16px 30px; display: grid; gap: 10px; align-content: start; }
.drawer .gi { border-bottom: 1px solid var(--line-2); padding-bottom: 8px; display: grid; gap: 2px; }
.drawer .gi b { font-family: var(--f-display); }
.drawer .gi .en { color: var(--muted); font-size: .8rem; }
.drawer .gi .cat { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

/* ---------- хинтове ---------- */
.hint, .trap, .note, .key {
  border: 1px solid var(--line); border-radius: var(--r); background: var(--panel);
  padding: 10px 14px; max-width: 80ch;
}
details.hint > summary, details.trap > summary {
  cursor: pointer; font-weight: 600; list-style: none; display: flex; gap: 8px; align-items: baseline;
}
details.hint > summary::-webkit-details-marker, details.trap > summary::-webkit-details-marker { display: none; }
details.hint > summary::before { content: "?"; font: 700 .75rem/1 var(--f-mono); color: var(--accent-ink); background: var(--accent); border-radius: 50%; width: 18px; height: 18px; display: inline-grid; place-items: center; flex: none; transform: translateY(2px); }
details.trap > summary::before { content: "!"; font: 700 .75rem/1 var(--f-mono); color: #fff; background: var(--st-swap); border-radius: 50%; width: 18px; height: 18px; display: inline-grid; place-items: center; flex: none; transform: translateY(2px); }
details[open] > summary { margin-bottom: 8px; }
details > div { display: grid; gap: 8px; color: var(--ink-2); }
.trap { border-color: color-mix(in srgb, var(--st-swap) 45%, var(--line)); }
.key { border-left: 4px solid var(--accent); background: var(--accent-soft); }
.key .formula, .formula { font-family: var(--f-mono); font-size: .95rem; }
.extra { color: var(--accent); }  /* синият текст — допълнение извън конспекта */
.extra-tag { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); border: 1px solid var(--accent); border-radius: 3px; padding: 0 4px; margin-left: 6px; vertical-align: 2px; }

/* ---------- визуализатор ---------- */
.viz {
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow);
  display: grid; overflow: hidden; min-width: 0;
}
.viz:focus-within { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
.viz-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; padding: 12px 16px 10px; border-bottom: 1px solid var(--line-2); }
.viz-head h4 { font-size: 1.05rem; }
.viz-head .sub { color: var(--muted); font-size: .85rem; }
.viz-inputs { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; padding: 10px 16px; background: var(--panel-2); border-bottom: 1px solid var(--line-2); }
.field { display: grid; gap: 3px; min-width: 0; }
.field > span { font-size: .74rem; color: var(--muted); letter-spacing: .02em; }
input[type=text], input[type=number], input[type=search], select, textarea {
  font: 14px var(--f-mono); color: var(--ink); background: var(--panel); border: 1px solid var(--line);
  border-radius: 5px; padding: 6px 8px; min-height: 34px; max-width: 100%;
}
input[type=range] { accent-color: var(--accent); }
.viz-stage { padding: 16px; min-height: 120px; overflow-x: auto; position: relative; }
.viz-ctrl {
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 12px;
  border-top: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2); background: var(--paper);
}
.viz-ctrl .scrub { flex: 1 1 160px; min-width: 120px; }
.viz-ctrl .pos { font: 500 .8rem var(--f-mono); color: var(--muted); min-width: 7.5em; text-align: right; font-variant-numeric: tabular-nums; }
.viz-ctrl label { font-size: .78rem; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.viz-msg { padding: 10px 16px; font-size: .92rem; min-height: 2.8em; border-bottom: 1px solid var(--line-2); display: grid; gap: 4px; }
.viz-msg .inv { font-size: .82rem; font-family: var(--f-mono); padding: 3px 8px; border-radius: 4px; justify-self: start; }
.viz-msg .inv.ok { background: var(--st-done-bg); color: var(--st-done); }
.viz-msg .inv.bad { background: var(--st-swap-bg); color: var(--st-swap); }
.viz-body { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); min-width: 0; }
.viz-body > * { min-width: 0; }
.viz-code { background: var(--code-bg); border-right: 1px solid var(--line-2); overflow: auto; max-height: 460px; }
.viz-code .ch { display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line-2); font-size: .75rem; color: var(--muted); position: sticky; top: 0; background: var(--code-bg); }
.viz-code .ch .sp { flex: 1; }
.viz-code .ch a, .viz-code .ch button { font-size: .75rem; }
pre.c { margin: 0; padding: 8px 0; font: 13px/1.55 var(--f-mono); color: var(--code-ink); counter-reset: ln; }
pre.c .l { display: block; padding: 0 12px 0 0; white-space: pre; border-left: 3px solid transparent; }
pre.c .l::before { counter-increment: ln; content: counter(ln); display: inline-block; width: 2.6em; padding-right: .9em; text-align: right; color: var(--tk-com); opacity: .7; }
pre.c .l.hl { background: var(--code-hl); border-left-color: var(--code-hl-edge); }
pre.c .l.hl2 { background: color-mix(in srgb, var(--code-hl) 45%, transparent); }
.tk-kw { color: var(--tk-kw); font-weight: 600; } .tk-type { color: var(--tk-type); } .tk-num { color: var(--tk-num); }
.tk-str { color: var(--tk-str); } .tk-com { color: var(--tk-com); font-style: italic; } .tk-fn { color: var(--tk-fn); } .tk-pp { color: var(--tk-pp); }
.viz-side { display: grid; align-content: start; gap: 0; }
.viz-side .sec { padding: 10px 14px; border-bottom: 1px solid var(--line-2); display: grid; gap: 6px; }
.viz-side .sec > .eyebrow { margin-bottom: 2px; }
.vars { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font: 13px var(--f-mono); }
.vars dt { color: var(--muted); } .vars dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.vars dd.chg { color: var(--st-cmp); font-weight: 700; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 14px; font: 13px var(--f-mono); }
.stats span b { font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: .78rem; color: var(--ink-2); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; border: 1.5px solid; }
.log { font: 12.5px/1.45 var(--f-mono); max-height: 150px; overflow: auto; color: var(--ink-2); display: grid; gap: 1px; }
.log div.cur { color: var(--ink); font-weight: 700; }

/* състояния (общи класове за клетки, ленти, възли) */
.s-act { --c: var(--st-act); --cb: var(--st-act-bg); }
.s-cmp { --c: var(--st-cmp); --cb: var(--st-cmp-bg); }
.s-swap { --c: var(--st-swap); --cb: var(--st-swap-bg); }
.s-done { --c: var(--st-done); --cb: var(--st-done-bg); }
.s-piv { --c: var(--st-piv); --cb: var(--st-piv-bg); }
.s-dim { --c: var(--st-dim); --cb: transparent; opacity: .55; }
.legend i { border-color: var(--c, var(--line)); background: var(--cb, transparent); }

/* масив от клетки */
.arr { display: flex; gap: 4px; align-items: flex-end; flex-wrap: nowrap; padding-top: 18px; padding-bottom: 26px; }
.cell {
  position: relative; width: 44px; height: 44px; flex: none; display: grid; place-items: center;
  border: 1.5px solid var(--c, var(--line)); background: var(--cb, var(--panel)); border-radius: 5px;
  font: 600 15px var(--f-mono); color: var(--ink); transition: background .15s, border-color .15s, transform .15s;
}
.cell .ix { position: absolute; bottom: -20px; font: 11px var(--f-mono); color: var(--muted); }
.cell .ptr { position: absolute; top: -19px; font: 700 11px var(--f-mono); color: var(--c, var(--accent)); white-space: nowrap; }
.cell.gap { margin-left: 14px; }
/* ленти */
.bars { display: flex; gap: 3px; align-items: flex-end; height: 200px; padding-bottom: 20px; position: relative; }
.bar { flex: 1 1 0; min-width: 6px; max-width: 46px; background: var(--cb, var(--accent-soft)); border: 1.5px solid var(--c, var(--accent)); border-bottom: none; border-radius: 3px 3px 0 0; position: relative; transition: height .15s; }
.bar .bv { position: absolute; top: -17px; left: 50%; transform: translateX(-50%); font: 10.5px var(--f-mono); color: var(--ink-2); }
.bar .bi { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font: 10px var(--f-mono); color: var(--muted); }

/* таблица */
.tbl-wrap { overflow-x: auto; max-width: 100%; }
table.t { border-collapse: collapse; font-size: .88rem; }
table.t th, table.t td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
table.t th { background: var(--panel-2); font-weight: 600; }
table.grid td, table.grid th { text-align: center; font-family: var(--f-mono); font-variant-numeric: tabular-nums; min-width: 38px; padding: 5px 6px; }
table.grid td { background: var(--cb, var(--panel)); border-color: var(--line); }

<script>
/* InformationTechnology_Study — обща рамка за интерактивните теми.
 *
 * Study.chapter(def)        регистрира глава {id, num, title, group, lead, html, mount(root)}
 * Study.viz(el, cfg)        стъпков визуализатор, синхронизиран с C код (виж README)
 * Study.quiz(el, items)     кратък тест с обяснения
 * Study.drawArray / drawBars помощници за масиви
 * Study.cBase = "https://github.com/EnkodPrime/InformationTechnology_Study/blob/main/Tema_07_Informacionni_sistemi/c/"; Study.boot({...})         стартира страницата
 *
 * Работи от file:// без сървър — само класически <script> файлове.
 */
(function () {
  "use strict";
  const S = (window.Study = {});

  /* ---------------- помощници ---------------- */
  S.esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  S.h = function (tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "html") el.innerHTML = v;
      else if (k === "text") el.textContent = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(c));
    return el;
  };
  const h = S.h;
  const SVGNS = "http://www.w3.org/2000/svg";
  S.svg = function (tag, attrs, ...kids) {
    const el = document.createElementNS(SVGNS, tag);
    if (attrs) for (const k in attrs) if (attrs[k] != null) {
      if (k === "text") el.textContent = attrs[k];
      else if (k === "class") el.setAttribute("class", attrs[k]);
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), attrs[k]);
      else el.setAttribute(k, attrs[k]);
    }
    for (const c of kids.flat()) if (c) el.append(c);
    return el;
  };
  /** "7 3, 9" -> [7,3,9]; хвърля грешка при невалидно число */
  S.parseNums = function (str, { min = -1e9, max = 1e9, maxLen = 64, minLen = 0, int = true } = {}) {
    const parts = String(str).split(/[\s,;]+/).filter(Boolean);
    const out = parts.map((p) => {
      const v = Number(p);
      if (!Number.isFinite(v) || (int && !Number.isInteger(v))) throw new Error(`„${p}“ не е ${int ? "цяло " : ""}число.`);
      if (v < min || v > max) throw new Error(`Стойностите трябва да са между ${min} и ${max}.`);
      return v;
    });
    if (out.length > maxLen) throw new Error(`Най-много ${maxLen} елемента.`);
    if (out.length < minLen) throw new Error(`Нужни са поне ${minLen} елемента.`);
    return out;
  };
  S.int = function (v, lo, hi, name) {
    const n = Number(v);
    if (!Number.isInteger(n)) throw new Error(`${name || "Стойността"} трябва да е цяло число.`);
    if (n < lo || n > hi) throw new Error(`${name || "Стойността"} трябва да е между ${lo} и ${hi}.`);
    return n;
  };
  S.randInt = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
  S.randArray = (n, lo = 1, hi = 99) => Array.from({ length: n }, () => S.randInt(lo, hi));
  S.store = {
    get(k, d) { try { const v = localStorage.getItem("its:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("its:" + k, JSON.stringify(v)); } catch (e) { /* няма памет — без запис */ } },
  };

  /* ---------------- оцветяване на C ---------------- */
  const KW = new Set("if else for while do return break continue switch case default goto sizeof struct union enum typedef static const extern volatile register inline new delete class public private protected template typename namespace using true false nullptr NULL".split(" "));
  const TY = new Set("int long short char unsigned signed float double void bool size_t uint8_t uint16_t uint32_t uint64_t int8_t int16_t int32_t int64_t FILE auto std vector string".split(" "));
  S.highlightC = function (code) {
    const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(^[ \t]*#[^\n]*)|(\b\d+(?:\.\d+)?[uUlLfF]*\b)|([A-Za-z_]\w*)(\s*\()?|([\s\S])/gm;
    let out = "", m;
    while ((m = re.exec(code))) {
      if (m[1]) out += `<span class="tk-com">${S.esc(m[1])}</span>`;
      else if (m[2]) out += `<span class="tk-str">${S.esc(m[2])}</span>`;
      else if (m[3]) out += `<span class="tk-pp">${S.esc(m[3])}</span>`;
      else if (m[4]) out += `<span class="tk-num">${m[4]}</span>`;
      else if (m[5]) {
        const w = m[5];
        if (KW.has(w)) out += `<span class="tk-kw">${w}</span>`;
        else if (TY.has(w)) out += `<span class="tk-type">${w}</span>`;
        else if (m[6]) out += `<span class="tk-fn">${w}</span>`;
        else out += w;
        if (m[6]) out += S.esc(m[6]);
      } else out += S.esc(m[7]);
    }
    // разделяне на редове, като коментарите /* */ на няколко реда се затварят коректно
    const lines = out.split("\n");
    let open = null;
    return lines.map((ln) => {
      let pre = open ? open : "";
      const opens = [...ln.matchAll(/<span class="([^"]+)">/g)].length;
      const closes = (ln.match(/<\/span>/g) || []).length;
      let post = "";
      if (opens > closes) { const last = [...ln.matchAll(/<span class="([^"]+)">/g)].pop(); open = `<span class="${last[1]}">`; post = "</span>"; }
      else if (closes > opens) { open = null; }
      return pre + ln + post;
    });
  };

  /* ---------------- речник / подсказки ---------------- */
  let tipEl = null, tipFor = null;
  function glossLookup(key) {
    const G = window.GLOSSARY || {};
    if (G[key]) return G[key];
    const k = key.toLowerCase().trim();
    for (const g in G) if (g.toLowerCase() === k) return G[g];
    return null;
  }
  S.glossLookup = glossLookup;
  // Справки в Уикипедия за понятията — по тема, в js/sources.js (window.TERM_SOURCES).
  // Българската Уикипедия е предпочетена, когато има статия за същото понятие; иначе английската.
  function sourceFor(key) { return (window.TERM_SOURCES || {})[String(key).toLowerCase().trim()] || null; }
  function sourceLabel(url) {
    return url.includes("bg.wikipedia.org") ? "Уикипедия на български" : "Wikipedia in English";
  }
  function sourceLink(url, term) {
    const title = sourceLabel(url);
    return h("a", {
      class: "term-source", href: url, target: "_blank", rel: "noopener noreferrer",
      title, "aria-label": `${title}: ${term}`
    }, "↗");
  }
  function showTip(target) {
    const g = glossLookup(target.dataset.g);
    if (!g) { console.warn("Липсва в речника:", target.dataset.g); return; }
    hideTip();
    tipEl = h("div", { class: "gtip", role: "tooltip" },
      h("b", { text: g.t }),
      g.en ? h("span", { class: "en", text: g.en }) : null,
      h("span", { html: g.d }),
      g.more ? h("span", { class: "more", html: g.more }) : null);
    document.body.append(tipEl);
    tipFor = target;
    const r = target.getBoundingClientRect(), tr = tipEl.getBoundingClientRect();
    let x = Math.min(Math.max(8, r.left), window.innerWidth - tr.width - 8);
    let y = r.bottom + 6;
    if (y + tr.height > window.innerHeight - 8) y = r.top - tr.height - 6;
    tipEl.style.left = x + "px"; tipEl.style.top = Math.max(8, y) + "px";
  }
  function hideTip() { if (tipEl) tipEl.remove(); tipEl = null; tipFor = null; }
  function bindGlossary() {
    document.addEventListener("mouseover", (e) => { const d = e.target.closest("dfn[data-g]"); if (d && d !== tipFor) showTip(d); });
    document.addEventListener("mouseout", (e) => {
      const d = e.target.closest("dfn[data-g]");
      if (d && !d.contains(e.relatedTarget) && !(tipEl && tipEl.contains(e.relatedTarget))) hideTip();
    });
    document.addEventListener("focusin", (e) => { const d = e.target.closest("dfn[data-g]"); if (d) showTip(d); });
    document.addEventListener("focusout", (e) => {
      if (e.target.closest("dfn[data-g]") && !(tipEl && tipEl.contains(e.relatedTarget))) hideTip();
    });
    document.addEventListener("click", (e) => {
      const d = e.target.closest("dfn[data-g]");
      if (d) { e.preventDefault(); if (tipFor === d) hideTip(); else showTip(d); } else if (!e.target.closest(".gtip")) hideTip();
    });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") { hideTip(); closeDrawer(); } });
    window.addEventListener("scroll", hideTip, { passive: true });
  }
  // Направи всички dfn фокусируеми и добави само икона към проверената справка.
  function prepDfn(root) {
    root.querySelectorAll("dfn[data-g]").forEach((d) => {
      d.setAttribute("tabindex", "0");
      const url = sourceFor(d.dataset.g);
      if (!url || d.closest("a")) return;
      const button = d.closest("button");
      if (button) {
        let wrap = button.parentElement;
        if (!wrap.classList.contains("term-source-card-wrap")) {
          const parent = wrap;
          wrap = h("span", { class: "term-source-card-wrap" });
          parent.insertBefore(wrap, button);
          wrap.append(button);
        }
        let links = wrap.querySelector(".term-source-card-links");
        if (!links) { links = h("span", { class: "term-source-card-links" }); wrap.append(links); }
        if (![...links.querySelectorAll("a")].some((a) => a.href === url)) links.append(sourceLink(url, d.textContent.trim()));
        return;
      }
      if (!(d.nextElementSibling && d.nextElementSibling.classList.contains("term-source"))) d.insertAdjacentElement("afterend", sourceLink(url, d.textContent.trim()));
    });
  }

  let drawer = null;
  function closeDrawer() { if (drawer) drawer.remove(); drawer = null; }
  S.openGlossary = function (q = "") {
    closeDrawer();
    const G = window.GLOSSARY || {};
    const list = h("div", { class: "dl" });
    const inp = h("input", { type: "search", id: "gloss-q", placeholder: "Търси понятие…", value: q, "aria-label": "Търси понятие" });
    function render() {
      const s = inp.value.toLowerCase().trim();
      list.innerHTML = "";
      Object.values(G).filter((g) => !s || (g.t + " " + (g.en || "") + " " + g.d).toLowerCase().includes(s))
        .sort((a, b) => a.t.localeCompare(b.t, "bg"))
        .forEach((g) => list.append(h("div", { class: "gi" },
          g.cat ? h("span", { class: "cat", text: g.cat }) : null,
          h("b", { text: g.t }), g.en ? h("span", { class: "en", text: g.en }) : null,
          h("span", { html: g.d }), g.more ? h("span", { class: "muted", html: g.more }) : null)));
      if (!list.children.length) list.append(h("p", { class: "muted", text: "Няма съвпадения." }));
    }
    inp.addEventListener("input", render);
    drawer = h("aside", { class: "drawer", "aria-label": "Речник" },
      h("div", { class: "dh" }, h("h3", { text: "Речник на понятията" }), h("button", { class: "btn", onclick: closeDrawer, text: "Затвори" })),
      inp, list);
    document.body.append(drawer);
    render();
    inp.focus();
  };

  /* ---------------- визуализатор ---------------- */
  const SPEEDS = [["бавно", 1300], ["нормално", 650], ["бързо", 260], ["много бързо", 80], ["турбо", 15]];

  S.viz = function (host, cfg) {
    const id = cfg.id || "v" + Math.random().toString(36).slice(2, 8);
    const root = h("div", { class: "viz", id: "viz-" + id, tabindex: "-1" });
    const head = h("div", { class: "viz-head" }, h("h4", { text: cfg.title || "" }), cfg.sub ? h("span", { class: "sub", html: cfg.sub }) : null);
    root.append(head);

    // входове
    const inputs = {};
    let inBox = null;
    if (cfg.inputs && cfg.inputs.length) {
      inBox = h("div", { class: "viz-inputs" });
      for (const f of cfg.inputs) {
        let el;
        const fid = `${id}-${f.id}`;
        if (f.type === "select") {
          el = h("select", { id: fid }, ...f.options.map((o) => {
            const [v, t] = Array.isArray(o) ? o : [o, o];
            return h("option", { value: v, text: t, selected: String(v) === String(f.value) ? true : null });
          }));
        } else if (f.type === "checkbox") {
          el = h("input", { type: "checkbox", id: fid, checked: f.value ? true : null });
        } else {
          el = h("input", { id: fid, type: f.type === "number" ? "number" : "text", value: f.value, min: f.min, max: f.max, step: f.step, spellcheck: "false", autocomplete: "off" });
          if (f.width) el.style.width = f.width;
        }
        inputs[f.id] = el;
        const lab = h("label", { class: "field", for: fid }, h("span", { html: f.label }), el);
        if (f.type === "checkbox") { lab.style.display = "flex"; lab.style.gap = "6px"; lab.style.alignItems = "center"; lab.prepend(el); }
        inBox.append(lab);
        el.addEventListener("keydown", (e) => { if (e.key === "Enter") apply(); });
        if (f.type === "select" || f.type === "checkbox" || f.live) el.addEventListener("change", () => apply());
      }
      inBox.append(h("button", { class: "btn primary", onclick: () => apply(), text: "Изпълни" }));
      if (cfg.random) inBox.append(h("button", { class: "btn", onclick: () => { setValues(cfg.random()); apply(); }, text: "Случайни" }));
      if (cfg.presets) for (const p of cfg.presets) inBox.append(h("button", { class: "btn ghost", onclick: () => { setValues(p.values); apply(); }, text: p.label, title: p.title || "" }));
      root.append(inBox);
    }
    function setValues(vals) {
      for (const k in vals) if (inputs[k]) { if (inputs[k].type === "checkbox") inputs[k].checked = !!vals[k]; else inputs[k].value = vals[k]; }
    }
    function readValues() {
      const o = {};
      for (const k in inputs) o[k] = inputs[k].type === "checkbox" ? inputs[k].checked : inputs[k].value;
      return o;
    }

    const stage = h("div", { class: "viz-stage" });
    if (cfg.stageHeight) stage.style.minHeight = cfg.stageHeight + "px";
    root.append(stage);

    const msg = h("div", { class: "viz-msg", "aria-live": "polite" });
    // контроли
    const bFirst = h("button", { class: "btn icon", title: "Начало (Home)", "aria-label": "Начало", text: "⏮" });
    const bPrev = h("button", { class: "btn icon", title: "Стъпка назад (←)", "aria-label": "Стъпка назад", text: "◀" });
    const bPlay = h("button", { class: "btn primary", title: "Пусни / пауза (интервал)", text: "▶ Пусни" });
    const bNext = h("button", { class: "btn icon", title: "Стъпка напред (→)", "aria-label": "Стъпка напред", text: "▶" });
    const bLast = h("button", { class: "btn icon", title: "Край (End)", "aria-label": "Край", text: "⏭" });
    const scrub = h("input", { type: "range", class: "scrub", min: 0, max: 0, value: 0, "aria-label": "Позиция", id: id + "-scrub" });
    const pos = h("span", { class: "pos" });
    const speed = h("select", { id: id + "-speed", "aria-label": "Скорост" }, ...SPEEDS.map(([t, ms], i) => h("option", { value: ms, text: t, selected: i === (cfg.speed ?? 1) ? true : null })));
    const ctrl = h("div", { class: "viz-ctrl" }, bFirst, bPrev, bPlay, bNext, bLast, scrub, pos, h("label", null, "скорост", speed));
    root.append(ctrl, msg);

    // код + странично
    const body = h("div", { class: "viz-body" });
    const codeBox = h("div", { class: "viz-code" });
    const side = h("div", { class: "viz-side" });
    body.append(codeBox, side);
    if (cfg.code !== false) root.append(body);
    const varsSec = h("div", { class: "sec" }, h("span", { class: "eyebrow", text: "Променливи" }), h("dl", { class: "vars" }));
    const statSec = h("div", { class: "sec" }, h("span", { class: "eyebrow", text: "Броячи" }), h("div", { class: "stats" }));
    const logSec = h("div", { class: "sec" }, h("span", { class: "eyebrow", text: "Ход на изпълнението" }), h("div", { class: "log" }));
    const legSec = cfg.legend ? h("div", { class: "sec" }, h("span", { class: "eyebrow", text: "Легенда" }),
      h("div", { class: "legend" }, ...cfg.legend.map(([cls, t]) => h("span", { class: cls }, h("i"), t)))) : null;
    side.append(varsSec, statSec, logSec);
    if (legSec) side.append(legSec);
    if (cfg.sideExtra) side.append(cfg.sideExtra);

    host.append(root);

    let frames = [], i = 0, timer = null, codeKey = null, codeLines = [], tags = {}, inp = {}, extra = null, logIdx = [];

    function loadCode(key) {
      if (cfg.code === false || key === codeKey) return;
      codeKey = key;
      const src = (window.CSRC || {})[key];
      codeBox.innerHTML = "";
      if (!src) { codeBox.append(h("p", { class: "warn", style: { padding: "10px" }, text: "Липсва C код: " + key })); console.warn("Липсва C регион", key); return; }
      tags = src.tags;
      const copy = h("button", { class: "btn ghost", text: "Копирай", onclick: () => {
        const done = () => { copy.textContent = "Копирано"; setTimeout(() => (copy.textContent = "Копирай"), 1200); };
        if (navigator.clipboard) navigator.clipboard.writeText(src.code).then(done, () => selectCode());
        else selectCode();
      } });
      const pre = h("pre", { class: "c" });
      function selectCode() { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
      codeLines = S.highlightC(src.code).map((l) => h("span", { class: "l", html: l || " " }));
      pre.append(...codeLines);
      codeBox.append(h("div", { class: "ch" }, h("span", { class: "mono", text: "C · " + src.file }), h("span", { class: "sp" }),
        h("a", { href: (cfg.cPath || S.cBase || "c/") + src.file, target: "_blank", rel: "noopener", text: "целият файл" }), copy), pre);
    }

    function apply() {
      stop();
      inp = readValues();
      let res;
      try {
        res = cfg.build(inp);
      } catch (e) {
        frames = [];
        stage.innerHTML = "";
        msg.innerHTML = "";
        msg.append(h("span", { class: "warn", text: "Грешка във входа: " + e.message }));
        updateCtrl();
        return;
      }
      if (Array.isArray(res)) res = { frames: res };
      frames = res.frames || [];
      extra = res;
      if (frames.length > 20000) frames = frames.slice(0, 20000);
      logIdx = [];
      frames.forEach((f, k) => { if (f.log) logIdx.push(k); });
      loadCode(typeof cfg.code === "function" ? cfg.code(inp) : cfg.code);
      scrub.max = Math.max(0, frames.length - 1);
      go(cfg.startAtEnd ? frames.length - 1 : 0);
    }

    let prevVars = {};
    function go(k) {
      if (!frames.length) return;
      i = Math.max(0, Math.min(frames.length - 1, k));
      const f = frames[i];
      // сцена
      try { cfg.draw(stage, f, { inputs: inp, frames, i, res: extra }); }
      catch (e) { console.error(e); stage.textContent = "Грешка при рисуване: " + e.message; }
      // съобщение
      msg.innerHTML = "";
      msg.append(h("div", { html: f.msg || "" }));
      if (f.inv) msg.append(h("span", { class: "inv " + (f.inv.ok === false ? "bad" : "ok"), html: (f.inv.ok === false ? "✗ " : "✓ ") + f.inv.text }));
      // код
      codeLines.forEach((l) => l.classList.remove("hl", "hl2"));
      const at = f.at == null ? [] : [].concat(f.at);
      let first = null;
      at.forEach((t, ti) => {
        const ls = tags[t];
        if (!ls) { if (codeKey) console.warn(`Етикет @${t} липсва в ${codeKey}`); return; }
        ls.forEach((n) => { const el = codeLines[n - 1]; if (el) { el.classList.add(ti === 0 ? "hl" : "hl2"); first = first || el; } });
      });
      if (first) {
        const top = first.offsetTop, bh = codeBox.clientHeight;
        if (top < codeBox.scrollTop + 30 || top > codeBox.scrollTop + bh - 40) codeBox.scrollTop = top - bh / 3;
      }
      // променливи
      const dl = varsSec.querySelector("dl");
      dl.innerHTML = "";
      const vars = f.vars || {};
      const vk = Object.keys(vars);
      varsSec.hidden = !vk.length;
      const pv = i > 0 ? frames[i - 1].vars || {} : {};
      vk.forEach((k2) => {
        const val = fmtVal(vars[k2]);
        const changed = i > 0 && k2 in pv && fmtVal(pv[k2]) !== val;
        dl.append(h("dt", { text: k2 }), h("dd", { class: changed ? "chg" : "", text: val }));
      });
      // броячи
      const st = f.stats || {};
      const sk = Object.keys(st);
      statSec.hidden = !sk.length;
      const sb = statSec.querySelector(".stats");
      sb.innerHTML = "";
      sk.forEach((k2) => sb.append(h("span", null, k2 + ": ", h("b", { text: String(st[k2]) }))));
      // лог
      const lb = logSec.querySelector(".log");
      lb.innerHTML = "";
      const upto = logIdx.filter((x) => x <= i);
      logSec.hidden = !logIdx.length;
      upto.slice(-60).forEach((x) => lb.append(h("div", { class: x === upto[upto.length - 1] ? "cur" : "", html: frames[x].log })));
      lb.scrollTop = lb.scrollHeight;
      updateCtrl();
      if (cfg.onFrame) cfg.onFrame(f, i, frames);
    }
    function fmtVal(v) {
      if (Array.isArray(v)) return "[" + v.map((x) => (x === null || x === undefined ? "·" : Array.isArray(x) ? fmtVal(x) : x)).join(", ") + "]";
      if (v === null || v === undefined) return "—";
      if (typeof v === "boolean") return v ? "true" : "false";
      return String(v);
    }
    function updateCtrl() {
      const n = frames.length;
      scrub.value = i;
      pos.textContent = n ? `стъпка ${i + 1}/${n}` : "—";
      bFirst.disabled = bPrev.disabled = !n || i === 0;
      bNext.disabled = bLast.disabled = !n || i >= n - 1;
      bPlay.disabled = !n;
      bPlay.textContent = timer ? "❚❚ Пауза" : i >= n - 1 && n > 1 ? "↺ Отначало" : "▶ Пусни";
    }
    function play() {
      if (timer) return stop();
      if (i >= frames.length - 1) go(0);
      timer = setInterval(() => { if (i >= frames.length - 1) stop(); else go(i + 1); }, +speed.value);
      updateCtrl();
    }
    function stop() { if (timer) clearInterval(timer); timer = null; updateCtrl(); }
    speed.addEventListener("change", () => { if (timer) { stop(); play(); } });
    bFirst.onclick = () => { stop(); go(0); };
    bPrev.onclick = () => { stop(); go(i - 1); };
    bNext.onclick = () => { stop(); go(i + 1); };
    bLast.onclick = () => { stop(); go(frames.length - 1); };
    bPlay.onclick = play;
    scrub.addEventListener("input", () => { stop(); go(+scrub.value); });
    root.addEventListener("keydown", (e) => {
      if (e.target.closest("input:not([type=range]),select,textarea")) return;
      if (e.key === "ArrowRight") { e.preventDefault(); stop(); go(i + 1); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); stop(); go(i - 1); }
      else if (e.key === " ") { e.preventDefault(); play(); }
      else if (e.key === "Home") { e.preventDefault(); stop(); go(0); }
      else if (e.key === "End") { e.preventDefault(); stop(); go(frames.length - 1); }
    });

    const api = { apply, go, stop, setValues, get frames() { return frames; }, get index() { return i; }, root, stage };
    if (cfg.initial) setValues(cfg.initial);
    apply();
    return api;
  };

  /** Статичен изглед на C регион (без стъпки). hl: етикет(и) за подсветка. */
  S.codeView = function (host, key, hl, cPath) {
    const src = (window.CSRC || {})[key];
    const box = h("div", { class: "viz-code", style: { borderRight: "none", border: "1px solid var(--line)", borderRadius: "6px", maxHeight: "none" } });
    if (!src) { box.append(h("p", { class: "warn", text: "Липсва C код: " + key })); host.append(box); return box; }
    const lines = S.highlightC(src.code).map((l) => h("span", { class: "l", html: l || " " }));
    [].concat(hl || []).forEach((t) => (src.tags[t] || []).forEach((n) => lines[n - 1] && lines[n - 1].classList.add("hl")));
    box.append(h("div", { class: "ch" }, h("span", { class: "mono", text: "C · " + src.file }), h("span", { class: "sp" }),
      h("a", { href: (cPath || S.cBase || "c/") + src.file, target: "_blank", rel: "noopener", text: "целият файл" })), h("pre", { class: "c" }, ...lines));
    host.append(box);
    return box;
  };

  /* ---------------- рисуване на масиви ---------------- */
  /** opts: {cls:{i:'s-cmp'}, ptr:{i:'i'}, dim:[from,to] | fn, gapAfter:k, label:i=>txt} */
  S.drawArray = function (el, arr, opts = {}) {
    const box = h("div", { class: "arr" });
    const ptrs = {};
    for (const name in opts.ptr || {}) { const k = opts.ptr[name]; if (k == null || k < 0 || k >= arr.length) continue; (ptrs[k] = ptrs[k] || []).push(name); }
    arr.forEach((v, k) => {
      let cls = (opts.cls && opts.cls[k]) || "";
      if (opts.dim && (typeof opts.dim === "function" ? opts.dim(k) : k < opts.dim[0] || k > opts.dim[1])) cls = cls || "s-dim";
      const c = h("div", { class: "cell " + cls + (opts.gapAt && opts.gapAt.includes(k) ? " gap" : "") },
        v === null || v === undefined ? "" : String(v),
        h("span", { class: "ix", text: opts.index === false ? "" : (opts.label ? opts.label(k) : k) }),
        ptrs[k] ? h("span", { class: "ptr", text: ptrs[k].join(",") }) : null);
      box.append(c);
    });
    if (opts.append) el.append(box); else { el.innerHTML = ""; el.append(box); }
    return box;
  };
  S.drawBars = function (el, arr, opts = {}) {
    const max = Math.max(1, ...arr.map((x) => Math.abs(x)));
    const box = h("div", { class: "bars" });
    if (opts.height) box.style.height = opts.height + "px";
    const showV = arr.length <= (opts.labelsUpTo ?? 32);
    arr.forEach((v, k) => {
      const b = h("div", { class: "bar " + ((opts.cls && opts.cls[k]) || "") });
      b.style.height = Math.max(3, (Math.abs(v) / max) * 100) + "%";
      if (showV) { b.append(h("span", { class: "bv", text: opts.fmt ? opts.fmt(v, k) : v })); b.append(h("span", { class: "bi", text: k })); }
      if (opts.title) b.title = opts.title(v, k);
      box.append(b);
    });
    if (opts.append) el.append(box); else { el.innerHTML = ""; el.append(box); }
    return box;
  };

  /* ---------------- тест ---------------- */
  S.quiz = function (host, items, title = "Провери се") {
    const box = h("div", { class: "quiz" }, h("span", { class: "eyebrow", text: title }));
    items.forEach((it, qi) => {
      const why = h("div", { class: "why", html: it.why || "", hidden: true });
      const opts = h("div", { class: "opts" });
      it.options.forEach((o, oi) => {
        const b = h("button", { class: "btn opt", html: o, onclick: () => {
          opts.querySelectorAll("button").forEach((x, xi) => { x.classList.remove("right", "wrong"); if (xi === it.correct) x.classList.add("right"); });
          if (oi !== it.correct) b.classList.add("wrong");
          why.hidden = false;
          why.innerHTML = (oi === it.correct ? "<b>Вярно.</b> " : "<b>Не точно.</b> ") + (it.why || "");
        } });
        opts.append(b);
      });
      box.append(h("div", { class: "q" }, h("p", { html: `${qi + 1}. ${it.q}` }), opts, why));
    });
    host.append(box);
    return box;
  };

  /* ---------------- глави и навигация ---------------- */
  const chapters = [];
  S.chapter = (def) => chapters.push(def);
  S.chapters = chapters;

  S.boot = function (opt) {
    const theme = S.store.get("theme", null);
    if (theme) document.documentElement.dataset.theme = theme;
    chapters.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
    const nav = document.getElementById("sidenav");
    const sel = document.getElementById("navselect");
    const main = document.getElementById("content");
    const seen = S.store.get(opt.topic + ":seen", {});
    const ol = h("ol");
    let lastGroup = null;
    const links = {};
    chapters.forEach((c) => {
      if (c.group && c.group !== lastGroup) { ol.append(h("li", { class: "group eyebrow", text: c.group })); lastGroup = c.group; }
      const a = h("a", { href: "#" + c.id, class: seen[c.id] ? "seen" : "" }, h("span", { class: "n", text: c.num || "" }), h("span", { text: c.title }));
      links[c.id] = a;
      ol.append(h("li", null, a));
      sel.append(h("option", { value: c.id, text: (c.num ? c.num + " · " : "") + c.title }));
    });
    nav.append(ol);
    sel.addEventListener("change", () => (location.hash = sel.value));
    const mounted = {};
    function show() {
      const id = (location.hash || "").slice(1);
      const c = chapters.find((x) => x.id === id) || chapters[0];
      chapters.forEach((x) => { if (mounted[x.id]) mounted[x.id].hidden = x !== c; });
      Object.values(links).forEach((a) => a.classList.remove("on"));
      links[c.id].classList.add("on");
      sel.value = c.id;
      if (!mounted[c.id]) {
        const idx = chapters.indexOf(c);
        const prev = chapters[idx - 1], next = chapters[idx + 1];
        const sec = h("section", { class: "chapter", id: "ch-" + c.id },
          h("header", null, h("span", { class: "eyebrow", text: (c.group ? c.group + " · " : "") + (c.num ? "Раздел " + c.num : "") }),
            h("h1", { text: c.title }), c.lead ? h("p", { class: "lead", html: c.lead }) : null));
        const body = h("div", { class: "chapter-body", style: { display: "grid", gap: "22px", minWidth: "0" } });
        if (c.html) body.innerHTML = c.html;
        sec.append(body);
        sec.append(h("nav", { class: "chapnav" },
          prev ? h("a", { class: "btn", href: "#" + prev.id, text: "← " + prev.title }) : h("span"),
          next ? h("a", { class: "btn primary", href: "#" + next.id, text: next.title + " →" }) : h("span")));
        main.append(sec);
        mounted[c.id] = sec;
        try { if (c.mount) c.mount(body); } catch (e) { console.error(e); body.prepend(h("p", { class: "warn", text: "Грешка в главата: " + e.message })); }
        prepDfn(sec);
      }
      seen[c.id] = 1; S.store.set(opt.topic + ":seen", seen); links[c.id].classList.add("seen");
      if (S._booted) window.scrollTo(0, 0);
      S._booted = true;
      document.title = c.title + " · " + opt.title;
    }
    window.addEventListener("hashchange", show);
    document.getElementById("btn-gloss").onclick = () => S.openGlossary();
    const tb = document.getElementById("btn-theme");
    const curDark = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    const lab = () => (tb.textContent = curDark() ? "Светла тема" : "Тъмна тема");
    tb.onclick = () => { const t = curDark() ? "light" : "dark"; document.documentElement.dataset.theme = t; S.store.set("theme", t); lab(); };
    lab();
    bindGlossary();
    show();
  };
})();

</script>
<script>
/* Речник за тема 7. Основните определения (d) са от „Тема 7. Речник на понятията“ и от
   терминологичния справочник на „Учебно ръководство, тема 7“. „more“ е уточнение/капан
   от ръководството (разграничения и „Изяснени въпроси“).
   Ключът (малки букви) е това, което се пише в <dfn data-g="ключ">. */
window.GLOSSARY = {
  // 1. Същност
  "информационна система": { cat: "Същност", t: "Информационна система", en: "Information system", d: "Хора, процедури, данни и средства за обработване и използване на информация.", more: "Софтуерът е компонент. Базата от данни също е само компонент — системата включва роли, правила, интерфейси и обратна връзка." },
  "данни": { cat: "Същност", t: "Данни", en: "Data", d: "Представени факти, наблюдения или измервания.", more: "Числото 60 само по себе си не казва достатъчно." },
  "информация": { cat: "Същност", t: "Информация", en: "Information", d: "Данни, интерпретирани в контекст за определена цел.", more: "„60 продажби за деня при цел 80“ позволява оценка 75% от целта. Друг период или друга валута променя извода." },
  "граница на системата": { cat: "Същност", t: "Граница на системата", en: "System boundary", d: "Разделяне между вътрешните компоненти и средата.", more: "Без граница обхватът лесно се разширява неконтролирано." },
  "предметна област": { cat: "Същност", t: "Предметна област", en: "Domain", d: "Реалността, която моделираме: роли, обекти, събития и правила.", more: "Моделът е целенасочено опростяване на тази реалност; терминологичният речник е част от модела." },
  "обратна връзка": { cat: "Същност", t: "Обратна връзка", en: "Feedback", d: "Връщане на резултата към процеса, което позволява корекция.", more: "Обратната връзка е решение или промяна в работата, не просто показване на данни." },

  // 2. Класификация по управленско равнище
  "tps": { cat: "Класификация", t: "TPS", en: "Transaction Processing System", d: "Система за обработка на повтарящи се оперативни събития.", more: "„Транзакционна“ описва вида дейност — не се свежда до SQL командата BEGIN." },
  "mis": { cat: "Класификация", t: "MIS", en: "Management Information System", d: "Система за управленски справки и обобщения.", more: "В тесния класификационен смисъл; терминът „управленска информационна система“ се използва и по-широко." },

<script>
/* Тема 7 — помощници за схеми (кутии, стрелки, участници, хранилища) върху Study.svg.
   Използват се само в mount/draw; чистите algos не зависят от тях (тестват се в node без DOM). */
(function () {
  const S = window.Study;
  let uid = 0;
  const DG = {};

  /** Корен на схема. w, h — координатна система; cls — допълнителен клас (напр. "narrow"). */
  DG.root = function (w, hgt, cls) {
    const id = "ah" + ++uid;
    const svg = S.svg("svg", { class: "dg " + (cls || ""), viewBox: `0 0 ${w} ${hgt}`, role: "img", "data-ah": id });
    svg.append(S.svg("defs", null,
      S.svg("marker", { id, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" },
        S.svg("path", { d: "M0,0 L10,5 L0,10 z", class: "ah" }))));
    return svg;
  };
  DG.wrap = function (host, svg) { const w = S.h("div", { class: "dg-wrap" }); w.append(svg); host.append(w); return w; };

  function label(g, x, y, t, sub, cls) {
    const lines = String(t).split("\n");
    const total = lines.length + (sub ? 1 : 0);
    let yy = y - ((total - 1) * 16) / 2 + 4;
    lines.forEach((ln) => { g.append(S.svg("text", { x, y: yy, "text-anchor": "middle", class: cls || "", text: ln })); yy += 16; });
    if (sub) g.append(S.svg("text", { x, y: yy, "text-anchor": "middle", class: "sub", text: sub }));
  }
  DG.text = function (svg, x, y, t, cls, anchor) {
    const el = S.svg("text", { x, y, "text-anchor": anchor || "middle", class: cls || "", text: t });
    svg.append(el); return el;
  };

  /** Възел: {x, y, w, h, t, sub, cls, shape: "rect"|"ell"|"circ"|"doc", onclick, key} — x, y е центърът. */
  DG.node = function (svg, o) {
    const g = S.svg("g", { class: "nd " + (o.cls || "") + (o.onclick ? " click" : ""), tabindex: o.onclick ? 0 : null, role: o.onclick ? "button" : null, "aria-label": o.onclick ? String(o.t).replace(/\n/g, " ") : null });
    const w = o.w || 120, hh = o.h || 44, x0 = o.x - w / 2, y0 = o.y - hh / 2;
    if (o.shape === "ell") g.append(S.svg("ellipse", { cx: o.x, cy: o.y, rx: w / 2, ry: hh / 2 }));
    else if (o.shape === "circ") g.append(S.svg("circle", { cx: o.x, cy: o.y, r: w / 2 }));
    else g.append(S.svg("rect", { x: x0, y: y0, width: w, height: hh, rx: o.r == null ? 6 : o.r }));
    label(g, o.x, o.y, o.t, o.sub, o.tcls);
    if (o.onclick) {
      g.addEventListener("click", o.onclick);
      g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); o.onclick(e); } });
    }
    if (o.key) g.dataset.key = o.key;
    svg.append(g);
    return g;
  };

  /** Хранилище от данни (DFD): отворен отдясно правоъгълник. */
  DG.store = function (svg, o) {
    const g = S.svg("g", { class: "nd " + (o.cls || "") + (o.onclick ? " click" : "") });
    const w = o.w || 130, hh = o.h || 36, x0 = o.x - w / 2, y0 = o.y - hh / 2;
    g.append(S.svg("rect", { x: x0, y: y0, width: w, height: hh, rx: 0, style: "stroke:none" }));
    g.append(S.svg("path", { d: `M${x0 + w},${y0} H${x0} V${y0 + hh} H${x0 + w} M${x0 + 22},${y0} V${y0 + hh}`, class: "ln", style: "stroke:var(--c,var(--ink-2))" }));
    label(g, o.x + 10, o.y, o.t, o.sub);
    if (o.onclick) g.addEventListener("click", o.onclick);
    svg.append(g);
    return g;
  };

  /** Участник (човече) с надпис отдолу. */
  DG.actor = function (svg, x, y, t, cls, onclick) {
    const g = S.svg("g", { class: "nd " + (cls || "") + (onclick ? " click" : "") });
    g.append(S.svg("circle", { cx: x, cy: y - 22, r: 8, class: "actor" }),
      S.svg("path", { d: `M${x},${y - 14} V${y + 6} M${x - 13},${y - 6} H${x + 13} M${x},${y + 6} L${x - 10},${y + 22} M${x},${y + 6} L${x + 10},${y + 22}`, class: "actor" }));
    label(g, x, y + 38, t);
    if (onclick) g.addEventListener("click", onclick);
    svg.append(g);
    return g;
  };

  /** Линия по точки [[x,y],...]; o: {cls, arrow (по подразбиране true), both, dash, label, lx, ly}. */
  DG.line = function (svg, pts, o = {}) {
    const d = pts.map((p, i) => (i ? "L" : "M") + p[0] + "," + p[1]).join(" ");
    const id = svg.getAttribute("data-ah");
    const el = S.svg("path", { d, class: "ln " + (o.cls || "") + (o.dash ? " dash" : ""),
      "marker-end": o.arrow === false ? null : `url(#${id})`, "marker-start": o.both ? `url(#${id})` : null });
    svg.append(el);
    if (o.label) {
      const a = pts[0], b = pts[pts.length - 1];
      const lx = o.lx != null ? o.lx : (a[0] + b[0]) / 2, ly = o.ly != null ? o.ly : (a[1] + b[1]) / 2 - 6;
      svg.append(S.svg("text", { x: lx, y: ly, "text-anchor": o.anchor || "middle", class: "el", text: o.label }));
    }
    return el;
  };

  /** Маркира избран възел в група. */
  DG.select = function (svg, key) {
    svg.querySelectorAll(".nd[data-key]").forEach((g) => g.classList.toggle("sel", g.dataset.key === key));
  };

  window.DG = DG;
})();

</script>

<script>
/* Раздел 1 — Същност и компоненти (ръководство, глава 1; схеми 1 и 2). */
(function () {
  const S = window.Study, h = S.h, DG = window.DG;

  /* ---------- чисти функции ---------- */
  const PERIODS = { day: "ден", week: "седмица", month: "месец" };
  const algos = {
    /** Схема 2: число → информация. Стъпките добавят контекст; при несъвместим контекст изводът е невалиден. */
    data_to_info({ value, vunit, vperiod, target, tunit, tperiod }) {
      const v = S.int(value, 0, 1e6, "Стойността"), t = S.int(target, 1, 1e6, "Целта");
      const F = [];
      F.push({ stage: 0, msg: `<b>Данни:</b> имаме числото <b>${v}</b>. Без контекст не знаем дали е много или малко, нито какво измерва.`, log: `данни: ${v}` });
      F.push({ stage: 1, msg: `Добавяме <b>единица</b>: ${v} ${vunit}. Вече знаем какво е измерено.`, log: `+ единица: ${vunit}` });
      F.push({ stage: 2, msg: `Добавяме <b>период</b>: ${v} ${vunit} за един ${PERIODS[vperiod]}.`, log: `+ период: ${PERIODS[vperiod]}` });
      F.push({ stage: 3, msg: `Добавяме <b>цел</b>: ${t} ${tunit} за един ${PERIODS[tperiod]}.`, log: `+ цел: ${t} ${tunit}/${PERIODS[tperiod]}` });
      const okUnit = vunit === tunit, okPer = vperiod === tperiod;
      if (!okUnit || !okPer) {
        const why = [!okUnit ? `различни единици (${vunit} / ${tunit})` : null, !okPer ? `различен период (${PERIODS[vperiod]} / ${PERIODS[tperiod]})` : null].filter(Boolean).join(" и ");
        const pct = Math.round((v * 100) / t);
        F.push({ stage: 4, bad: true, pct, msg: `Делението дава ${pct}%, но сравнението е <b>безсмислено</b>: ${why}. Точността на пресмятането не поправя грешния смисъл на входните данни.`, log: `✗ ${pct}% — несъвместим контекст` });
        return { frames: F, valid: false, pct };
      }
      const pct = Math.round((v * 100) / t);
      F.push({ stage: 4, pct, msg: `<b>Информация:</b> ${v} ${vunit} при цел ${t} → <b>${pct}% от целта</b>. Числото е интерпретирано в контекст.`, log: `информация: ${pct}%` });

      return { frames: F, valid: true, pct };

    flow({ scope }) {
      const org = scope === "org";
      const F = [];
      const add = (act, edge, msg, log) => F.push({ act, edge, org, msg, log });
      add("student", null, "<b>Вход.</b> Студентът подава заявление за записване (заявка — входни данни).", "вход: заявление");
      add("ui", "e1", "Заявлението влиза през интерфейса на приложението.", "интерфейс");
      add("clerk", "e2", org ? "<b>Обработка — процедура.</b> Служителят проверява правото на записване по правилата и сроковете. Тази стъпка е <b>вътре</b> в информационната система." : "<b>Обработка — процедура.</b> Служителят проверява правото… но при граница „само софтуер“ тази стъпка е <b>извън</b> модела. Кой отговаря за грешните заявления?", "проверка на права");
      add("db", "e3", "<b>Съхраняване.</b> СУБД записва заявлението и решението. Пази данните, но не носи отговорност за тях.", "съхраняване (СУБД)");
      add("report", "e4", "<b>Изход.</b> Студентът получава потвърждение; ръководството — справка за записванията.", "изход: потвърждение, справка");
      add("mgmt", "e5", "<b>Решение.</b> Ръководството вижда справката и решава например да промени срока или капацитета.", "решение на ръководството");
      add("rules", "e6", org ? "<b>Обратна връзка.</b> Решението променя правилата и процедурите — процесът се коригира. Обратната връзка е <b>промяна в работата</b>, не просто показване на данни." : "<b>Обратна връзка.</b> Ръководството променя правилата… но при граница „само софтуер“ правилата не са част от модела и промяната остава невидима за него.", "обратна връзка: нови правила");
      return { frames: F };

<div class="prose">

    nfr_check({ times, offset, limit, pct }) {

    /** Същото като impact() в C: обхождане в ширина по ребрата на проследимостта. */

        F.push(snap({ at: "loop", cur: -1, vars: { queue: q.slice(head).map((x) => EL[x].id) }, msg: `Опашката не е празна (${q.length - head}).` }));

  <details class="trap"><summary>Капан: приоритетът променя ли истинността на изискване?</summary><div>

  </div></details>

<div class="block">

  <div class="cards" id="models"></div>
  <p class="prose"><dfn data-g="uml">UML</dfn> е език за моделиране, а <dfn data-g="bpmn">BPMN</dfn> е нотация за бизнес процеси; нито едното само по себе си е метод за управление на проект. Реални средства: UML диаграми в Enterprise Architect или Visual Paradigm; изисквания и задачи в Jira, Azure DevOps или Zoho Projects. Инструментът съхранява модела и работата, но не заменя анализа на потребностите.</p>

  const MODELS = [

      random: () => ({ times: S.randArray(16, 200, 2600).join(" ") }),
      speed: 3,
      legend: [["s-act", "текуща"], ["s-done", "в границата"], ["s-swap", "над границата"]],

        const max = Math.max(1, ...vals);

        });

      },
    });

    /* --- случаи на употреба --- */
    const UC = {

      clerk: { t: "Служител (участник)", d: "Външна роля. Цел: да одобри или отхвърли заявление." },
      uc1: { t: "Подаване на заявление", d: "Случай на употреба: студентът постига целта „записан съм“ чрез взаимодействие със системата." },
      uc2: { t: "Одобряване на заявление", d: "Случай на употреба на служителя. Свързан е с първия: одобрява се подаденото заявление." },
    };
    const s9 = root.querySelector("#s9"), d9 = root.querySelector("#s9-det");
    let u9 = "uc1";
    function draw9() {

      const svg = DG.root(640, 230);

      DG.text(svg, 320, 40, "Университетска система (граница)", "sub");
      DG.line(svg, [[90, 110], [205, 80]], { arrow: false, cls: u9 === "student" || u9 === "uc1" ? "s-act" : "" });
      DG.line(svg, [[550, 110], [435, 160]], { arrow: false, cls: u9 === "clerk" || u9 === "uc2" ? "s-act" : "" });
      DG.line(svg, [[320, 102], [320, 140]], { dash: true, label: "свързани цели", lx: 330, ly: 125, anchor: "start" });
      DG.actor(svg, 70, 100, "Студент", u9 === "student" ? "s-act" : "", () => { u9 = "student"; draw9(); });
      DG.actor(svg, 570, 100, "Служител", u9 === "clerk" ? "s-act" : "", () => { u9 = "clerk"; draw9(); });
      DG.node(svg, { x: 320, y: 80, w: 220, h: 42, shape: "ell", t: "Подаване на заявление", cls: u9 === "uc1" ? "s-act" : "", onclick: () => { u9 = "uc1"; draw9(); } });
      DG.node(svg, { x: 320, y: 165, w: 220, h: 42, shape: "ell", t: "Одобряване на заявление", cls: u9 === "uc2" ? "s-act" : "", onclick: () => { u9 = "uc2"; draw9(); } });
      DG.wrap(s9, svg);
      d9.innerHTML = `<h4>${UC[u9].t}</h4><p>${UC[u9].d}</p>`;
    }
    draw9();

    /* --- контекст / DFD --- */
    const lb = root.querySelector("#dfn-lvl"), s10 = root.querySelector("#s10"), n10 = root.querySelector("#s10-note");
    let lvl = 0;
    const NOTES = [
      "Ниво 0 (контекст): цялата система е един процес. Показани са само външните участници и потоците през границата.",
      "Ниво 1: процесът е разделен на подпроцеси и хранилища. Външните потоци са същите като на ниво 0 — балансиране между нивата.",
    ];
    function draw10() {
      lb.innerHTML = "";
      ["Ниво 0 — контекст", "Ниво 1 — процеси и хранилища"].forEach((t, k) => lb.append(h("button", { class: "chip", "aria-pressed": k === lvl ? "true" : "false", text: t, onclick: () => { lvl = k; draw10(); } })));
      s10.innerHTML = "";
      const svg = DG.root(640, 300);
      DG.node(svg, { x: 70, y: 80, w: 110, h: 44, t: "Студент", r: 0 });
      DG.node(svg, { x: 70, y: 230, w: 110, h: 44, t: "Служител", r: 0 });
      DG.node(svg, { x: 580, y: 150, w: 100, h: 44, t: "Банка", r: 0 });
      if (lvl === 0) {
        svg.append(S.svg("rect", { x: 200, y: 40, width: 260, height: 230, rx: 14, class: "boundary" }));
        DG.node(svg, { x: 330, y: 155, w: 160, h: 90, shape: "circ", t: "0\nСистема за\nзаписване", cls: "s-piv" });
        DG.line(svg, [[126, 80], [262, 125]], { label: "заявление", lx: 190, ly: 92 });
        DG.line(svg, [[262, 140], [126, 95]], { label: "потвърждение", lx: 175, ly: 135 });
        DG.line(svg, [[126, 230], [265, 180]], { label: "решение", lx: 190, ly: 225 });
        DG.line(svg, [[408, 150], [528, 150]], { label: "такса", lx: 468, ly: 142 });
      } else {
        svg.append(S.svg("rect", { x: 160, y: 25, width: 350, height: 260, rx: 14, class: "boundary" }));
        DG.node(svg, { x: 245, y: 80, w: 90, h: 90, shape: "circ", t: "1\nПриемане" });
        DG.node(svg, { x: 245, y: 225, w: 90, h: 90, shape: "circ", t: "2\nПроверка" });
        DG.node(svg, { x: 430, y: 150, w: 90, h: 90, shape: "circ", t: "3\nЗаписване" });
        DG.store(svg, { x: 400, y: 60, w: 130, h: 30, t: "D1 Заявления" });
        DG.store(svg, { x: 400, y: 250, w: 130, h: 30, t: "D2 Записвания" });
        DG.line(svg, [[126, 80], [198, 80]], { label: "заявление", lx: 165, ly: 72 });
        DG.line(svg, [[290, 75], [335, 62]]);
        DG.line(svg, [[335, 65], [270, 205]], { label: "", });
        DG.line(svg, [[126, 230], [198, 228]], { label: "решение", lx: 160, ly: 222 });
        DG.line(svg, [[290, 210], [388, 170]], { label: "одобрено", lx: 330, ly: 178 });

        DG.line(svg, [[475, 150], [528, 150]], { label: "такса", lx: 502, ly: 142 });

      DG.wrap(s10, svg);
      n10.textContent = NOTES[lvl] + " Учебен пример [допускане: конкретните процеси и хранилища не са дадени в материала].";

    /* --- модели --- */
    const mb = root.querySelector("#models");

  S.chapter({ id: "iziskvania", order: 6, num: "6", group: "Жизнен цикъл и проектиране", title: "Изисквания и моделиране", lead: "Функционални и измерими нефункционални изисквания, проследимост, случаи на употреба, контекст и потоци от данни.", html, mount, algos });

<script>
/* Раздел 7 — Проектиране на решението (ръководство, глава 6; схеми 12–14). C: c/07_design.c */
(function () {
  const S = window.Study, h = S.h, DG = window.DG;

  const RES = { 0: "чака", 1: "записан", "-1": "няма места", "-2": "вече е записан" };

  /* ---------- чисти функции (същата логика като c/07_design.c) ---------- */
  function parseStudents(s) {
    const a = S.parseNums(s, { min: 100, max: 999, minLen: 2, maxLen: 3 });
    return a;
  }
  const algos = {
    race({ students, free, sched, mode }) {
      const st = parseStudents(students);
      const f0 = S.int(free, 0, 5, "Свободните места");
      const atomic = mode === "atomic";
      const sc = String(sched).toUpperCase().replace(/\s+/g, "");
      if (!/^[A-C]*$/.test(sc)) throw new Error("Графикът съдържа само буквите A, B, C (по една на стъпка).");
      if (sc.length > 12) throw new Error("Графикът е най-много 12 стъпки.");
      const nr = st.length;
      if ([...sc].some((ch) => ch.charCodeAt(0) - 65 >= nr)) throw new Error(`Има ${nr} заявки — използвай само ${"ABC".slice(0, nr).split("").join(", ")}.`);
      const c = { free: f0, enrolled: [] };
      const R = st.map((s) => ({ student: s, phase: 0, seen_free: null, seen_dup: null, result: 0 }));
      const F = [];
      const snap = (o) => Object.assign({ c: { free: c.free, enrolled: c.enrolled.slice() }, R: R.map((r) => Object.assign({}, r)), atomic,
        vars: Object.assign({ "c->free": c.free, "c->n_enrolled": c.enrolled.length }, ...R.map((r, k) => ({ [`${"ABC"[k]}.phase`]: r.phase, [`${"ABC"[k]}.result`]: r.result }))) }, o);
      F.push(snap({ at: [], k: -1, msg: `Курсът има <b>${f0}</b> свободни места. ${nr} едновременни заявки (${R.map((r, k) => "ABC"[k] + "=" + r.student).join(", ")}). Режим: <b>${atomic ? "атомарно при запис" : "проверка, после запис"}</b>.`, log: "старт" }));
      const step = (k) => {
        const r = R[k], L = "ABC"[k];
        if (!atomic) {
          if (r.phase === 0) {
            r.seen_free = c.free; r.seen_dup = c.enrolled.includes(r.student) ? 1 : 0; r.phase = 1;
            F.push(snap({ at: "read", k, msg: `${L}: <b>чете</b> free = ${r.seen_free}, вече записан = ${r.seen_dup}. Проверката изглежда успешна${r.seen_free > 0 && !r.seen_dup ? "" : " — не"}.`, log: `${L} чете free=${r.seen_free}` }));
            return;
          }
          if (r.seen_dup) { r.result = -2; r.phase = 2; F.push(snap({ at: "dup", k, msg: `${L}: по прочетеното е вече записан → отказ.`, log: `${L}: дубликат` })); return; }
          if (r.seen_free <= 0) { r.result = -1; r.phase = 2; F.push(snap({ at: "full", k, msg: `${L}: по прочетеното няма места → отказ.`, log: `${L}: няма места` })); return; }
          const before = c.free;
          c.free = r.seen_free - 1;
          c.enrolled.push(r.student);
          r.result = 1; r.phase = 2;
          const lost = before !== r.seen_free;
          const dup = c.enrolled.filter((x) => x === r.student).length > 1;
          F.push(snap({ at: ["write", "ok"], k, conflict: lost || c.enrolled.length > f0 || dup, msg: `${L}: <b>записва</b> free = ${r.seen_free} − 1 = ${c.free}${lost ? ` — но междувременно free беше ${before}! Изменението на другата заявка е <b>загубено</b>.` : "."}${dup ? " Студентът е записан <b>два пъти</b>." : ""}`, log: `${L} пише free=${c.free}${lost ? " ✗" : ""}` }));
          return;
        }
        if (c.enrolled.includes(r.student)) { r.result = -2; r.phase = 2; F.push(snap({ at: "adup", k, msg: `${L}: уникалното ограничение (студент, курс) отхвърля дубликата <b>при запис</b>.`, log: `${L}: дубликат` })); return; }
        if (c.free <= 0) { r.result = -1; r.phase = 2; F.push(snap({ at: "afull", k, msg: `${L}: условното изменение (free &gt; 0) не минава — няма места.`, log: `${L}: няма места` })); return; }
        c.free--; c.enrolled.push(r.student); r.result = 1; r.phase = 2;
        F.push(snap({ at: ["awrite", "aok"], k, msg: `${L}: проверка и изменение в <b>една неделима стъпка</b>: free = ${c.free}.`, log: `${L} записан, free=${c.free}` }));
      };
      for (const ch of sc) { const k = ch.charCodeAt(0) - 65; if (R[k].phase !== 2) step(k); }
      for (let k = 0; k < nr; k++) while (R[k].phase !== 2) step(k);
      const over = c.enrolled.length > f0 || new Set(c.enrolled).size !== c.enrolled.length;
      F.push(snap({ at: [], k: -1, done: true, over, msg: `Край: записани ${c.enrolled.length} при ${f0} места, free = ${c.free}. ${over ? "<b>Правилото е нарушено</b> — проверката „на екрана“ не го защитава." : "Правилото е спазено."}`,
        inv: { text: `записани (${c.enrolled.length}) ≤ места (${f0}) и без дубликати`, ok: !over }, log: over ? "✗ нарушено" : "✓ спазено" }));
      return { frames: F, free: c.free, enrolled: c.enrolled.length, res: R.map((r) => r.result).join(",") };
    },

    idem({ lost, use_key }) {
      const L = S.parseNums(lost, { min: 0, max: 1, minLen: 1, maxLen: 5 });
      const key = !!use_key && use_key !== "0";
      const srv = { seen: [], saved: [], effects: 0 };
      const F = [];
      const snap = (o) => Object.assign({ effects: srv.effects, seen: srv.seen.slice(), key, vars: { "s->effects": srv.effects, "s->n_seen": srv.seen.length, use_key: key ? 1 : 0, a: o.a } }, o);
      F.push(snap({ at: [], a: -1, msg: `Клиентът изпраща записване (op_id = 501). Опити: ${L.length}. Изгубени отговори на опити: ${L.map((x, k) => (x ? k + 1 : null)).filter(Boolean).join(", ") || "няма"}. Идентификатор на операцията: <b>${key ? "да" : "не"}</b>.` }));
      let got = -1;
      for (let a = 0; a < L.length; a++) {
        F.push(snap({ at: ["send", "srv"], a, ph: "send", msg: `Опит ${a + 1}: клиентът изпраща заявката.`, log: `→ опит ${a + 1}` }));
        let resp, replay = false;
        if (key) {
          const i = srv.seen.indexOf(501);
          F.push(snap({ at: "lookup", a, ph: "srv", msg: `Сървърът търси op_id 501 сред обработените: ${i >= 0 ? "<b>намерен</b>" : "няма го"}.` }));
          if (i >= 0) { resp = srv.saved[i]; replay = true; F.push(snap({ at: "replay", a, ph: "srv", replay: true, msg: "Повторение → връща <b>запазения резултат</b> без нов бизнес ефект.", log: "повторение, без ефект" })); }
        }
        if (!replay) {
          srv.effects++;
          F.push(snap({ at: "effect", a, ph: "srv", eff: true, msg: `Сървърът изпълнява операцията → <b>бизнес ефект №${srv.effects}</b>${srv.effects > 1 ? " — <b>двойно действие!</b>" : ""}.`, log: `ефект ${srv.effects}${srv.effects > 1 ? " ✗" : ""}` }));
          if (key) { srv.seen.push(501); srv.saved.push(srv.effects); F.push(snap({ at: "store", a, ph: "srv", msg: "Запазва op_id 501 и резултата." })); }
          resp = srv.effects;
        }
        if (L[a]) { F.push(snap({ at: "lost", a, ph: "lost", msg: `Отговорът на опит ${a + 1} се <b>губи</b> (прекъсната връзка). Клиентът не знае дали операцията е изпълнена — повтаря.`, log: "✗ отговорът е изгубен" })); continue; }
        got = a + 1;
        F.push(snap({ at: "got", a, ph: "got", msg: `Клиентът получава отговор (резултат ${resp}) на опит ${got}.`, log: `← отговор, опит ${got}` }));
        break;
      }
      if (got < 0) F.push(snap({ at: "giveup", a: L.length - 1, ph: "lost", msg: "Опитите свършиха без отговор. Клиентът не знае резултата — но ефектът може вече да е настъпил." }));
      const bad = srv.effects > 1;
      F.push(snap({ at: [], a: -1, done: true, msg: `Бизнес ефекти: <b>${srv.effects}</b>. ${bad ? "Транспортното повторение е създало двойно действие." : "Повторението има същия предвиден ефект като едно изпълнение."}`, inv: { text: "ефектите ≤ 1 (идемпотентност)", ok: !bad } }));
      return { frames: F, got, effects: srv.effects };
    },
  };

<script>
/* Раздел 8 — Модели на разработване и проверка (ръководство, глава 7; схеми 15–18). */
(function () {
  const S = window.Study, h = S.h, DG = window.DG;

  const ACT = ["Анализ", "Проектиране", "Реализация", "Проверка"];
  const AS = ["А", "П", "Р", "В"];

  /* ---------- чисти функции ---------- */
  const algos = {
    /** Учебен модел за „късна промяна на изискване“.
        Работата е разделена на `parts` функционални части; всяка минава А→П→Р→В.
        Каскадно: всяка дейност се прави за всички части наведнъж. Итеративно-инкрементно: всяка итерация минава А→П→Р→В за една част.
        След стъпка `at` идва промяна в изискването на част `part`. Брои се колко вече извършени единици работа по тази част
        трябва да се повторят и кога потребителят е видял първата проверена (използваема) част.
        [допускане: всички единици работа са с еднаква цена; промяната засяга само избраната част] */
    rework({ model, parts, at, part }) {
      const n = S.int(parts, 2, 6, "Броят части");
      const total = 4 * n;
      const t = S.int(at, 1, total, "Моментът на промяната");
      const q = S.int(part, 1, n, "Засегнатата част") - 1;
      const seq = [];
      if (model === "waterfall") { for (let a = 0; a < 4; a++) for (let p = 0; p < n; p++) seq.push([a, p]); }
      else { for (let p = 0; p < n; p++) for (let a = 0; a < 4; a++) seq.push([a, p]); }
      const firstUse = seq.findIndex(([a]) => a === 3) + 1;
      const done = Array.from({ length: 4 }, () => Array(n).fill(0));
      const F = [];
      let delivered = 0;
      for (let s = 0; s < t; s++) {
        const [a, p] = seq[s];
        done[a][p] = 1;
        if (a === 3) delivered++;
        F.push({ grid: done.map((r) => r.slice()), cur: [a, p], q, msg: `Стъпка ${s + 1}: <b>${ACT[a]}</b> на част ${p + 1}.${a === 3 ? ` Част ${p + 1} е проверена и може да бъде показана на потребителя.` : ""}`, stats: { стъпка: s + 1, "проверени части": delivered }, log: `${AS[a]}${p + 1}` });
      }
      const hit = [];
      for (let a = 0; a < 4; a++) if (done[a][q]) hit.push([a, q]);
      const grid = done.map((r) => r.slice());
      hit.forEach(([a, p]) => (grid[a][p] = 2));
      const seen = delivered ? `Потребителят е видял ${delivered} проверени части (първата — на стъпка ${firstUse}) и е можел да даде обратна връзка.` : `Потребителят още не е видял работеща част (първата идва на стъпка ${firstUse}).`;
      F.push({ grid, cur: null, q, change: true, msg: `<b>Промяна в изискването на част ${q + 1}</b> след стъпка ${t}. По тази част вече са извършени <b>${hit.length}</b> единици работа — те се повтарят. ${seen}`, stats: { стъпка: t, "за повторение": hit.length, "първа използваема": firstUse }, log: `↯ промяна в част ${q + 1}: ${hit.length} за повторение` });
      return { frames: F, rework: hit.length, firstUse, delivered };
    },

    /** Спираловиден модел: всеки цикъл започва с анализ на риска. risks — оценки 1..9 на рисковете;
        на всеки цикъл се адресира най-големият, прототипът го намалява. */
    spiral({ risks, threshold }) {
      const r = S.parseNums(risks, { min: 1, max: 9, minLen: 1, maxLen: 6 });
      const thr = S.int(threshold, 1, 9, "Прагът");
      const names = r.map((_, k) => "Р" + (k + 1));
      const F = [];
      let cyc = 0;
      const cur = r.slice();
      F.push({ r: cur.slice(), cyc, q: -1, msg: `Рискове: ${cur.map((v, k) => names[k] + "=" + v).join(", ")}. Цикли, докато всички станат ≤ ${thr}.` });
      while (Math.max(...cur) > thr && cyc < 12) {
        cyc++;
        const k = cur.indexOf(Math.max(...cur));
        F.push({ r: cur.slice(), cyc, q: 0, k, msg: `<b>Цикъл ${cyc}, квадрант 1 — цели, алтернативи и ограничения.</b> Уточняваме какво искаме от тази обиколка.`, log: `цикъл ${cyc}` });
        F.push({ r: cur.slice(), cyc, q: 1, k, msg: `<b>Квадрант 2 — оценка на алтернативите и анализ на риска.</b> Най-голям е ${names[k]} = ${cur[k]}. Изграждаме прототип, който проверява точно тази хипотеза.`, log: `риск ${names[k]}=${cur[k]}` });
        cur[k] = Math.max(1, cur[k] - 4);
        F.push({ r: cur.slice(), cyc, q: 1, k, res: true, msg: `<b>Квадрант 2 — разрешаване на риска.</b> Прототипът намалява ${names[k]} до ${cur[k]}.`, log: `${names[k]} → ${cur[k]}` });
        F.push({ r: cur.slice(), cyc, q: 2, k, res: true, msg: `<b>Квадрант 3 — разработване и проверка</b> на продукта от следващото ниво, вече при по-нисък риск.` });
        F.push({ r: cur.slice(), cyc, q: 3, k, msg: `<b>Квадрант 4 — планиране на следващия цикъл.</b> Остават: ${cur.map((v, j) => names[j] + "=" + v).join(", ")}.` });
      }
      F.push({ r: cur.slice(), cyc, q: -1, done: true, msg: `Всички рискове ≤ ${thr} след <b>${cyc}</b> цикъла. Рискът е в центъра — броят обиколки се определя от него, а не от предварителен план.`, inv: { text: "max риск ≤ праг", ok: Math.max(...cur) <= thr } });
      return { frames: F, cycles: cyc };
    },
  };

  const MODELS = {
    waterfall: { t: "Каскаден", g: "каскаден модел", d: "Организира дейностите предимно последователно и предполага относително стабилни изисквания." },
    iter: { t: "Итеративен", g: "итерация", d: "Повтаря и уточнява решенията." },
    incr: { t: "Инкрементен", g: "инкремент", d: "Добавя функционалност на части. Итеративният и инкрементният могат да се съчетават." },
    spiral: { t: "Спираловиден", g: "спираловиден модел", d: "Поставя риска в центъра на повторяемите цикли." },
    agile: { t: "Гъвкави подходи", g: "гъвкави подходи", d: "Кратка обратна връзка и адаптация. Не премахват изискванията, проектните решения или документацията." },
  };

  const html = `
<div class="prose">

<div class="block">

  function mount(root) {
    /* --- схема 15 --- */
    const mb = root.querySelector("#mdl"), s15 = root.querySelector("#s15"), d15 = root.querySelector("#s15-det");
    let m = "waterfall";
    function draw15() {
      mb.innerHTML = "";

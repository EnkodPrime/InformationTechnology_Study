        });

        for (let k = 0; k < n; k++) {
          const cx = 90 + k * (520 / (n - 1 || 1)) * (n === 4 ? 0.95 : 1), cy = 120;
          svg.append(S.svg("circle", { cx, cy, r: 55, class: "ln", style: "stroke:var(--st-act)" }));

          DG.text(svg, cx, cy + 4, m === "incr" ? `+ част ${k + 1}` : m === "agile" ? `кратък цикъл ${k + 1}` : `итерация ${k + 1}`, "sub");
          if (m !== "iter") DG.node(svg, { x: cx, y: 215, w: 90, h: 30, t: m === "agile" ? "обратна връзка" : `${k + 1} части`, cls: "s-done" });
          if (k < n - 1) DG.line(svg, [[cx + 57, cy], [cx + (520 / (n - 1)) * (n === 4 ? 0.95 : 1) - 57, cy]]);
        }
      } else {
        const pts = [];
        for (let t = 0; t <= 4 * Math.PI * 2.2; t += 0.1) { const r = 8 + t * 3.6; pts.push([320 + r * Math.cos(t), 130 + r * Math.sin(t) * 0.95]); }
        svg.append(S.svg("path", { d: "M" + pts.map((p) => p.join(",")).join(" L"), class: "ln", style: "stroke:var(--st-act)" }));
        svg.append(S.svg("line", { x1: 320, y1: 10, x2: 320, y2: 250, class: "ln dash" }), S.svg("line", { x1: 150, y1: 130, x2: 490, y2: 130, class: "ln dash" }));
        [["цели", 240, 40], ["анализ на риска", 420, 40], ["разработване и проверка", 430, 235], ["планиране", 220, 235]].forEach(([t, x, y]) => DG.text(svg, x, y, t, "sub"));
      }
      DG.wrap(s15, svg);
      const M = MODELS[m];
      d15.innerHTML = `<h4><dfn data-g="${M.g}" tabindex="0">${M.t}</dfn></h4><p>${M.d}</p>`;
    }
    draw15();

    /* --- rework --- */
    S.viz(root.querySelector("#v-rework"), {
      id: "rework", title: "Цена на късната промяна (учебен модел)", sub: "Ред = дейност, колона = функционална част.", code: false,
      inputs: [
        { id: "model", label: "модел", type: "select", value: "waterfall", options: [["waterfall", "каскаден"], ["iter", "итеративно-инкрементен"]] },
        { id: "parts", label: "части", type: "number", value: 4, width: "5em" },
        { id: "at", label: "промяна след стъпка", type: "number", value: 14, width: "5em" },
        { id: "part", label: "засегната част", type: "number", value: 1, width: "5em" },
      ],
      presets: [{ label: "Каскадно, част 1", values: { model: "waterfall", at: 14, part: 1 } }, { label: "Итеративно, част 1", values: { model: "iter", at: 14, part: 1 } }, { label: "Итеративно, част 4", values: { model: "iter", at: 14, part: 4 } }, { label: "Рано (стъпка 3)", values: { at: 3 } }],
      speed: 2,
      legend: [["s-act", "текуща"], ["s-done", "извършена"], ["s-swap", "за повторение"]],
      build: algos.rework,

        f.grid.forEach((row, a) => tb.append(h("tr", null, h("th", { text: ACT[a] }), ...row.map((v, p) => {
          const cur = f.cur && f.cur[0] === a && f.cur[1] === p;

        }))));
        st.append(h("div", { class: "tbl-wrap" }, tb));
      },
    });

    /* --- спирала --- */
    const Q = ["цели", "риск", "разработване", "планиране"];
    S.viz(root.querySelector("#v-spiral"), {
      id: "spiral", title: "Цикли до приемлив риск", sub: "Учебен модел: всеки прототип намалява адресирания риск с 4 точки (оценки 1–9).", code: false,

      presets: [{ label: "Нисък риск", values: { risks: "2 3 1" } }, { label: "Висок риск", values: { risks: "9 9 8 6" } }],
      build: algos.spiral,
      draw(st, f) {
        st.innerHTML = "";
        const row = h("div", { class: "phase-row" });
        Q.forEach((q, j) => row.append(h("span", { class: "ph " + (j === f.q ? "s-act" : "s-dim"), text: q })));
        st.append(h("p", { class: "mini", text: `цикъл ${f.cyc}` }), row);
        const b = h("div", { style: { marginTop: "10px", maxWidth: "420px" } });
        st.append(b);
        S.drawBars(b, f.r, { height: 130, cls: f.k != null ? { [f.k]: f.res ? "s-done" : "s-swap" } : {}, fmt: (v, k) => "Р" + (k + 1) + "=" + v });
      },
    });

    /* --- V&V --- */
    const vv = root.querySelector("#vv"), vo = root.querySelector("#vv-out");
    const st = { req: "right", impl: "spec" };
    const OPT = {
      req: [["right", "„Студентът да не може да се запише два пъти в дисциплина за семестър“ (вярно отразява нуждата)"], ["wrong", "„Студентът да не може да се запише два пъти в една и съща дисциплина“ — без семестър (повторно записване в нов семестър е нужно)"]],

    function drawVV() {
      vv.innerHTML = "";
      [["req", "Изискване"], ["impl", "Реализация"]].forEach(([k, t]) => {
        const c = h("div", { class: "chips" });
        OPT[k].forEach(([v, l]) => c.append(h("button", { class: "chip", style: { textAlign: "left" }, "aria-pressed": st[k] === v ? "true" : "false", text: l, onclick: () => { st[k] = v; drawVV(); } })));
        vv.append(h("div", { class: "axis" }, h("b", { text: t }), c));
      });
      const ver = st.impl === "spec", val = ver && st.req === "right";
      vo.innerHTML = `<p><span class="pill ${ver ? "s-done" : "s-swap"}">верификация: ${ver ? "минава" : "не минава"}</span> <span class="pill ${!ver ? "s-piv" : val ? "s-done" : "s-swap"}">валидация: ${!ver ? "зависи от отклонението" : val ? "минава" : "не минава"}</span></p>
        <p>${ver && !val ? "Системата <b>точно изпълнява написаното</b> — и пак не е пригодна: студент, който трябва да повтори дисциплината в нов семестър, не може да се запише. Грешката е в изискването, не в кода." : !ver ? "Реализацията не съответства на спецификацията — верификацията го открива. Пригодността е <b>отделен въпрос</b>, който валидацията проверява независимо: отклонението може да направи системата непригодна, а при погрешно изискване може дори да е по-близо до нуждата." : "Съответства на спецификацията и спецификацията отразява нуждата."}</p>
        <p class="mini">[допускане: примерът с повторно записване в нов семестър е учебна илюстрация, изградена върху правилото от ръководството „студент, дисциплина и семестър“.]</p>`;
    }
    drawVV();

    const LV = [["Модулна", "Ограничен компонент"], ["Интеграционна", "Взаимодействия"], ["Системна", "Цялото решение"], ["Приемателна", "Критериите на възложителя"]];
    const lvb = root.querySelector("#levels");
    LV.forEach(([t, d]) => lvb.append(h("div", { class: "card" }, h("h4", { text: t }), h("p", { text: d }))));

    /* --- преминаване --- */
    const CUT = {
      direct: { t: "Пряко", n: "Сменя наведнъж. Концентрира промяната — и риска — в един момент." },
      phased: { t: "Поетапно", n: "Прехвърля части (модули) последователно." },

        svg.append(S.svg("rect", { x: cut, y: cu === "parallel" ? y + 30 : y, width: T1 - cut, height: 26, rx: 4, style: "fill:var(--st-done-bg);stroke:var(--st-done)" }));

        DG.text(svg, (cut + T1) / 2, (cu === "parallel" ? y + 30 : y) + 17, "нова", "el");
      });
      DG.wrap(s17, svg);
      n17.textContent = CUT[cu].n;
    }
    draw17();
  }

  S.chapter({ id: "modeli", order: 8, num: "8", group: "Жизнен цикъл и проектиране", title: "Модели на разработване и проверка", lead: "Каскаден, итеративен, инкрементен, спираловиден и гъвкав подход; верификация срещу валидация; начини за преминаване.", html, mount, algos });
})();

<script>

(function () {
  const S = window.Study, h = S.h;

  const STUDENTS = [101, 102, 103, 104];
  const SRC = [[1, 101, 12000], [2, 102, 5000], [3, 103, 25000], [4, 101, 3000], [5, 104, 9999]];
  const BUGS = { none: "без грешка", noconv: "без превалутиране", fkshift: "изместено съпоставяне на студентите", dupid: "последният ред затрит с копие", drop: "изпуснат ред", fktypo: "несъществуващ студент" };
  const CHECKS = ["брой редове", "уникален ключ", "чужди ключове", "контролна сума (€)", "ред по ред"];

  /* ---------- чисти функции (същата логика като c/09_migration.c) ---------- */
  const bgn_to_eur = (st) => Math.floor((st * 100000 + 97791) / 195583);
  function migrate(src, bug) {
    const dst = [];
    src.forEach((row, i) => {
      const n = src.length;
      if (bug === "drop" && i === n - 1) return;
      let r = { id: row[0], student: row[1], amount: row[2] };
      if (bug !== "noconv") r.amount = bgn_to_eur(r.amount);
      if (bug === "fkshift") { const k = STUDENTS.indexOf(row[1]); if (k >= 0) r.student = STUDENTS[(k + 1) % STUDENTS.length]; }
      if (bug === "fktypo" && i === 0) r.student += 1000;
      if (bug === "dupid" && i === n - 1 && n > 1) r = Object.assign({}, dst[dst.length - 1]);
      dst.push(r);
    });
    return dst;
  }
  function parseSrc(s) {
    const rows = String(s).split(/[;\n]+/).map((x) => x.trim()).filter(Boolean).map((x) => {
      const p = S.parseNums(x, { min: 0, max: 1e7, minLen: 3, maxLen: 3 });
      if (!STUDENTS.includes(p[1])) throw new Error(`Студент ${p[1]} не съществува (има ${STUDENTS.join(", ")}).`);
      return p;
    });
    if (rows.length < 2 || rows.length > 8) throw new Error("Нужни са от 2 до 8 реда (ид студент стотинки; …).");
    return rows;
  }

  const algos = {
    bgn_to_eur,
    accept({ rows, bug }) {
      const src = parseSrc(rows);
      if (!BUGS[bug]) throw new Error("Непозната грешка.");
      const dst = migrate(src, bug);
      const n = src.length, m = dst.length, F = [];
      let mask = 0;
      const res = [null, null, null, null, null];
      const snap = (o) => Object.assign({ src, dst, res: res.slice(), mask }, o);
      F.push(snap({ at: "enter", vars: { n, m }, msg: `Миграция „${BUGS[bug]}“: ${n} реда в старата система (стотинки), ${m} в новата (евроценти). Курс 1 € = 1.95583 лв.`, log: `n=${n}, m=${m}` }));
      // 1
      res[0] = m === n; if (res[0]) mask |= 1;
      F.push(snap({ at: "count", chk: 0, vars: { n, m, mask }, msg: `<b>1. Брой редове:</b> ${m} ${m === n ? "=" : "≠"} ${n}.`, log: `брой ${res[0] ? "✓" : "✗"}` }));
      // 2
      let uniq = true, bi = -1, bj = -1;
      for (let i = 0; i < m && uniq; i++) for (let j = i + 1; j < m; j++) if (dst[i].id === dst[j].id) { uniq = false; bi = i; bj = j; break; }
      res[1] = uniq; if (uniq) mask |= 2;
      F.push(snap({ at: "pk", chk: 1, bad: uniq ? [] : [bi, bj], vars: { mask }, msg: `<b>2. Уникален първичен ключ:</b> ${uniq ? "всички ид са различни" : `ид ${dst[bi].id} се среща два пъти`}.`, log: `ключ ${uniq ? "✓" : "✗"}` }));
      // 3
      const badFk = dst.map((r, i) => (STUDENTS.includes(r.student) ? -1 : i)).filter((i) => i >= 0);
      res[2] = !badFk.length; if (res[2]) mask |= 4;
      F.push(snap({ at: "fk", chk: 2, bad: badFk, vars: { mask }, msg: `<b>3. Чужди ключове:</b> ${badFk.length ? `студент ${dst[badFk[0]].student} не съществува` : "всички студенти съществуват"}.`, log: `FK ${res[2] ? "✓" : "✗"}` }));
      // 4
      const want = src.reduce((s, r) => s + bgn_to_eur(r[2]), 0), got = dst.reduce((s, r) => s + r.amount, 0);
      res[3] = want === got; if (res[3]) mask |= 8;
      F.push(snap({ at: "sum", chk: 3, vars: { want, got, mask }, msg: `<b>4. Контролна сума в евроценти:</b> очаквано ${want}, получено ${got}${want === got ? "" : ` (×${(got / want).toFixed(2)})`}.`, log: `сума ${res[3] ? "✓" : "✗"}` }));
      // 5
      const miss = [];
      src.forEach((r, i) => { if (!dst.some((d) => d.id === r[0] && d.student === r[1] && d.amount === bgn_to_eur(r[2]))) miss.push(i); });
      res[4] = !miss.length; if (res[4]) mask |= 16;
      F.push(snap({ at: "rec", chk: 4, srcBad: miss, vars: { mask }, msg: `<b>5. Съпоставяне ред по ред:</b> ${miss.length ? `${miss.length} реда нямат съответствие (ид ${miss.map((i) => src[i][0]).join(", ")})` : "всеки ред има същия студент и сума"}.`, log: `ред по ред ${res[4] ? "✓" : "✗"}` }));
      const pass = mask === 31;
      F.push(snap({ at: "ret", vars: { return: mask }, done: true, msg: pass ? "Всички проверки минават — миграцията може да бъде приета." : `Миграцията <b>не се приема</b>.${res[0] && !pass ? " Обърни внимание: броят редове съвпада, а смисълът не е запазен." : ""}`, inv: { text: "mask = 31 (всички 5 проверки)", ok: pass }, log: `return ${mask}` }));
      return { frames: F, mask, rows: m };
    },
  };

    ["Внедряване", "migracia", "Мигрират се активните студенти и се обучават служителите."],
    ["Експлоатация", "zhiznen", "Измерват се откази и време за обработка, коригират се дефекти."],

<div class="block">
  <h3>Схеми 19 и 20. Миграция с проверки преди приемане</h3>
  <p class="prose"><dfn data-g="миграция">Миграцията</dfn> включва извличане, преобразуване, съпоставяне на идентичности, зареждане и проверки. Броят редове е необходима, но недостатъчна проверка: еднакъв брой с объркани валути или чужди ключове остава грешна база. Пренасянето на байтове не доказва запазен смисъл.</p>
  <p class="prose muted">Учебен пример: плащания на студенти от стара система (в стотинки) към нова (в евроценти) по фиксирания курс 1 € = 1.95583 лв. Избери типична грешка и виж кои проверки я хващат.</p>
  <div id="v-mig"></div>

    <p>Всеки ред получава съществуващ, но <b>чужд</b> студент. Броят, ключовете, чуждите ключове и сумата са верни — само проверката ред по ред (идентичност + сума за всеки ид) показва, че плащането е приписано на друг човек. Смисловите проверки са част от приемането.</p>

      presets: [{ label: "Без превалутиране", values: { bug: "noconv" } }, { label: "Изпуснат ред", values: { bug: "drop" } }, { label: "Чиста", values: { bug: "none" } }],
      legend: [["s-act", "проверява се"], ["s-done", "минала"], ["s-swap", "неуспешна / засегнат ред"]],

        const tDst = h("table", { class: "t grid" }, h("tr", null, h("th", { text: "ид" }), h("th", { text: "студент" }), h("th", { text: "€ цента" })));
        f.dst.forEach((r, i) => tDst.append(h("tr", null, ...[r.id, r.student, r.amount].map((v) => h("td", { class: (f.bad || []).includes(i) ? "s-swap" : "", text: v })))));
        st.append(h("div", { class: "split", style: { marginTop: "12px" } },
          h("div", null, h("div", { class: "mini", text: "стара система" }), h("div", { class: "tbl-wrap" }, tSrc)),
          h("div", null, h("div", { class: "mini", text: "нова система" }), h("div", { class: "tbl-wrap" }, tDst))));

  S.chapter({ id: "migracia", order: 9, num: "9", group: "Жизнен цикъл и проектиране", title: "Единен пример и миграция", lead: "Целият жизнен цикъл на един пример; миграция с проверки на смисъла; ETL/ELT; микросервиси.", html, mount, algos });

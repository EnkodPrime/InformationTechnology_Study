        });
        st.append(row);
        if (f.X) st.append(h("p", { class: "mono", style: { marginTop: "10px" }, text: "x = " + f.X.slice(1).map((v, i) => `x${i + 1}=${v}`).join("  ") }));
        if (f.brute) {
          const tb = h("div", { style: { display: "flex", flexWrap: "wrap", gap: "4px", marginTop: "10px" } });
          f.hist.forEach(([x, ok]) => tb.append(h("span", { class: "pill " + (ok ? "s-done" : "s-dim"), text: x })));
          st.append(tb);
        }
      },
    });
    sApi.root.querySelector("#sat-formula").addEventListener("input", renderLive);
    renderLive();

    /* (в) посока на сводимостта */
    const DIRS = [
      { t: "известна трудна A → нова B", d: "A ≤ₚ B, където A е известна NP-пълна (напр. Хамилтонов цикъл), B е новата задача (TSP).", ok: "<b>Доказва:</b> B е поне толкова трудна, колкото A ⇒ B е NP-трудна. Ако освен това B ∈ NP ⇒ B е NP-пълна.", no: "<b>Не доказва:</b> че B няма полиномиален алгоритъм (това би изисквало P ≠ NP)." },
      { t: "нова B → известна трудна A", d: "B ≤ₚ A: новата задача се свежда до известна трудна.", ok: "<b>Доказва само:</b> B не е по-трудна от A (ако A има полиномиален алгоритъм, и B има).", no: "<b>Не доказва</b> нищо за трудността на B — и лесна задача се свежда до SAT." },
    ];
    const dBox = root.querySelector("#dir"), dInfo = root.querySelector("#dir-info");
    const dBtns = DIRS.map((D, i) => h("button", { class: "card", "aria-pressed": i ? "false" : "true", onclick: () => pickDir(i) }, h("span", { class: "eyebrow", text: "посока " + (i + 1) }), h("h4", { text: D.t }), h("p", { text: D.d })));
    dBox.append(...dBtns);
    function pickDir(i) {
      dBtns.forEach((b, j) => b.setAttribute("aria-pressed", i === j ? "true" : "false"));
      const W = 520, Hh = 70;
      const svg = S.svg("svg", { class: "g", viewBox: `0 0 ${W} ${Hh}`, width: W });
      const [L, R] = i === 0 ? ["A: Хам. цикъл (известна)", "B: TSP (нова)"] : ["B: нова задача", "A: SAT (известна)"];
      svg.append(S.svg("g", { class: "node s-piv" }, S.svg("rect", { x: 4, y: 14, width: 200, height: 40, rx: 6, style: "fill:var(--cb);stroke:var(--c);stroke-width:2" })), S.svg("text", { x: 104, y: 39, "text-anchor": "middle", text: L }));
      svg.append(S.svg("g", { class: "node s-act" }, S.svg("rect", { x: 316, y: 14, width: 200, height: 40, rx: 6, style: "fill:var(--cb);stroke:var(--c);stroke-width:2" })), S.svg("text", { x: 416, y: 39, "text-anchor": "middle", text: R }));
      svg.append(S.svg("line", { x1: 208, y1: 34, x2: 304, y2: 34, class: "edge s-act" }), S.svg("path", { d: "M304 27 L314 34 L304 41 Z", style: "fill:var(--st-act)" }), S.svg("text", { x: 258, y: 26, "text-anchor": "middle", text: "f, ≤ₚ" }));
      dInfo.innerHTML = "";
      dInfo.append(svg, h("p", { html: DIRS[i].ok }), h("p", { html: DIRS[i].no }));
    }
    pickDir(0);

    S.viz(root.querySelector("#v-red"), {
      id: "red", title: "f: граф → матрица на разстояния, K = n", sub: "Отговорът „да/не“ се запазва.",
      code: "ch04_reduce",
      inputs: [{ id: "graph", label: "Граф", type: "select", value: "house", options: Object.keys(GRAPHS).map((k) => [k, GRAPHS[k].t]) }],
      speed: 2,
      legend: [["s-act", "текуща клетка"], ["s-done", "тегло 1 (ребро) / обиколка"], ["s-cmp", "тегло 2"]],
      build: (inp) => { const g = GRAPHS[inp.graph] || GRAPHS.house; return algos.reduce({ n: g.n, edges: g.e }); },
      startAtEnd: false,
      draw(st, f) {
        st.innerHTML = "";
        const N = f.G.n, inTour = new Set();
        if (f.tour) for (let i = 0; i < N; i++) { const a = f.tour[i], b = f.tour[(i + 1) % N]; inTour.add(a + "," + b); inTour.add(b + "," + a); }
        const edgeCls = {};
        if (f.tour) for (let i = 0; i < N; i++) { const a = f.tour[i], b = f.tour[(i + 1) % N]; edgeCls[a < b ? a + "-" + b : b + "-" + a] = "s-done"; }
        if (f.cell && f.G.adj[f.cell[0]][f.cell[1]]) edgeCls[f.cell[0] + "-" + f.cell[1]] = "s-act";
        const nodeCls = {};
        if (f.cell) { nodeCls[f.cell[0]] = "s-act"; nodeCls[f.cell[1]] = "s-act"; }
        const svg = drawGraph(f.G, { edgeCls, nodeCls });
        const tb = h("table", { class: "t grid" }, h("tr", null, h("th", { text: "d" }), ...Array.from({ length: N }, (_, j) => h("th", { text: j }))));
        for (let u = 0; u < N; u++) {
          const tr = h("tr", null, h("th", { text: u }));
          for (let v = 0; v < N; v++) {
            const x = f.d[u][v];
            let cls = x == null || u === v ? "" : inTour.has(u + "," + v) ? "s-done" : "";
            if (f.cell && ((f.cell[0] === u && f.cell[1] === v) || (f.cell[0] === v && f.cell[1] === u))) cls = "s-act";
            else if (x === 2 && !cls) cls = "s-cmp";
            tr.append(h("td", { class: cls, text: x == null ? "" : x }));
          }
          tb.append(tr);
        }
        const right = h("div", null, h("div", { class: "tbl-wrap" }, tb));
        if (f.K) right.append(h("p", { class: "mono", style: { marginTop: "8px" }, text: `K = ${f.K}` }));
        st.append(h("div", { class: "split" }, h("div", null, h("span", { class: "eyebrow", text: "вход за A: граф G" }), svg), h("div", null, h("span", { class: "eyebrow", text: "вход за B: f(G)" }), right)));
      },
    });

    /* (г) класове */
    const EX = {
      reach: { t: "достижимост в граф", cls: "P", d: "В P — BFS/DFS за линейно време (<a href=\"#izchislimost\">раздел 2</a>)." },
      par: { t: "четност", cls: "P", d: "В P — един остатък по модул 2." },
      sat2: { t: "2-SAT", cls: "P", d: "В P — има полиномиален алгоритъм, въпреки близкото име с 3-SAT." },
      sat: { t: "SAT / 3-SAT", cls: "NPC", d: "NP-пълни. SAT е първата доказано NP-пълна задача (Кук–Левин)." },
      ham: { t: "Хамилтонов цикъл", cls: "NPC", d: "NP-пълна: сертификатът е самият цикъл; трудността — чрез свеждане от известна NP-пълна задача." },
      tspd: { t: "TSP решаваща (≤ K)", cls: "NPC", d: "NP-пълна (при двоично кодирани цели тегла). Хамилтонов цикъл ≤ₚ TSP — виж по-горе." },
      tspo: { t: "TSP оптимизационна", cls: "NPH", d: "NP-трудна, но <b>не е в NP</b>: не е задача за разпознаване (търси минимална обиколка, не отговор да/не)." },
      halt: { t: "проблем за спирането", cls: "NPH", d: "NP-трудна и <b>неразрешима</b> <span class=\"extra-tag\">извън конспекта</span> — всяка задача от NP се свежда до нея, но тя не е в NP." },
    };
    let world = "neq", sel = "sat";
    const wBox = root.querySelector("#world"), cBox = root.querySelector("#classes"), cInfo = root.querySelector("#cls-info");
    const wb = [["neq", "свят „P ≠ NP“ (условно)"], ["eq", "свят „P = NP“ (условно)"]].map(([k, t]) => h("button", { class: "btn", "aria-pressed": k === world ? "true" : "false", text: t, onclick: () => { world = k; wb.forEach((b) => b.setAttribute("aria-pressed", b.textContent === t ? "true" : "false")); drawCls(); } }));
    wBox.append(...wb);
    function drawCls() {
      cBox.innerHTML = "";
      const W = 640, H = 300;
      const svg = S.svg("svg", { class: "g", viewBox: `0 0 ${W} ${H}`, width: W, style: "min-width:540px" });
      const el = (cls, cx, cy, rx, ry, dash) => S.svg("g", { class: "node " + cls }, S.svg("ellipse", { cx, cy, rx, ry, style: `fill:var(--cb);fill-opacity:.55;stroke:var(--c);stroke-width:2${dash ? ";stroke-dasharray:6 4" : ""}` }));
      const T = (x, y, t, a = "middle") => S.svg("text", { x, y, "text-anchor": a, "font-weight": 600, text: t });
      svg.append(S.svg("text", { x: W / 2, y: 18, "text-anchor": "middle", class: "muted", text: world === "neq" ? "АКО P ≠ NP (недоказано; P ⊆ NP е доказано)" : "АКО P = NP (недоказано)" }));
      svg.append(el("s-swap", 450, 165, 180, 120, true), T(560, 70, "NP-трудни"));
      if (world === "neq") {
        svg.append(el("s-act", 195, 165, 180, 120), T(70, 70, "NP"));
        svg.append(el("s-done", 135, 175, 100, 75), T(135, 128, "P"));
      } else {
        svg.append(el("s-done", 195, 165, 180, 120), T(85, 70, "P = NP"));
      }
      svg.append(S.svg("text", { x: 322, y: 102, "text-anchor": "middle", class: "wt", text: "NP-пълни" }));
      const SH = { reach: "достижимост", par: "четност", sat2: "2-SAT", sat: "SAT, 3-SAT", ham: "Хам. цикъл", tspd: "TSP ≤ K", tspo: "TSP оптим.", halt: "спиране" };
      const place = { reach: [70, 168], par: [70, 193], sat2: [70, 218], sat: [282, 140], ham: [282, 170], tspd: [282, 200], tspo: [470, 160], halt: [470, 195] };
      for (const k in EX) {
        const [x, y] = place[k];
        const g = S.svg("g", { style: "cursor:pointer", tabindex: 0, role: "button", onclick: () => { sel = k; drawCls(); }, onmouseenter: () => showEx(k), onkeydown: (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); sel = k; drawCls(); } } },
          S.svg("circle", { cx: x - 8, cy: y - 4, r: 4, style: "fill:var(--ink)" }), S.svg("text", { x: x, y: y, "font-weight": k === sel ? 700 : 400, "text-decoration": k === sel ? "underline" : null, text: SH[k] }),
          S.svg("title", { text: EX[k].t }));
        svg.append(g);
      }
      cBox.append(svg);
      showEx(sel);
    }
    function showEx(k) {
      const E = EX[k];
      const where = { P: "P (следователно и NP)", NPC: "NP-пълни = NP ∩ NP-трудни", NPH: "NP-трудни, извън NP" }[E.cls];
      cInfo.innerHTML = `<p><b>${E.t}</b> — ${where}</p><p>${E.d}</p>` + (E.cls === "NPC" ? `<p class="muted">${world === "neq" ? "Ако P ≠ NP — не е в P. Това е условно." : "Ако P = NP — щеше да е в P. Също условно."}</p>` : "");
    }
    drawCls();

  }

  S.chapter({ id: "pnp", order: 4, num: "4", group: "Изчислимост и сложност", title: "Класове P и NP, сводимост, NP-пълнота", lead: "Бързо решаване срещу бърза проверка. Сертификати, свеждане между задачи и защо P = NP? е открит въпрос.", html, mount, algos });
})();

</script>
<script>
/* Раздел 5 — Рекурсия: базов случай, стек на извикванията, завършване, брой извиквания. */
(function () {
  const S = window.Study, h = S.h;

  Object.assign(window.GLOSSARY, {
    "стек на извикванията": { cat: "Методи", t: "Стек на извикванията", en: "Call stack", d: "Структура (LIFO), в която всяко незавършило извикване държи своя рамка: параметри, локални променливи и адрес на връщане.", more: "Стекът пази незавършената работа: при fact(4) рамката „4 × ?“ чака резултата на fact(3)." },
    "рамка на стека": { cat: "Методи", t: "Рамка на стека", en: "Stack frame / activation record", d: "Паметта на едно активно извикване: аргументи, локални променливи, адрес на връщане.", more: "Рекурсия с дълбочина d държи d рамки едновременно ⇒ Θ(d) памет." },
    "препълване на стека": { cat: "Методи", t: "Препълване на стека", en: "Stack overflow", d: "Изчерпване на паметта за стека — типично при твърде дълбока или безкрайна рекурсия.", more: "В C това е недефинирано поведение / срив (SIGSEGV), а не изключение." },
    "намаляваща мярка": { cat: "Методи", t: "Намаляваща мярка (рекурсия)", en: "Decreasing measure", d: "Величина на аргумента, която строго намалява при всяко рекурсивно извикване и е ограничена отдолу, така че базовият случай неизбежно се достига.", more: "Аналог на ранговата функция при цикли. За fact(n−1) мярката е n, но само при n ≥ 0." },
    "дърво на извикванията": { cat: "Методи", t: "Дърво на извикванията", en: "Recursion / call tree", d: "Дърво, в което всеки възел е едно извикване, а децата му са извикванията, които то прави.", more: "Броят възли = брой извиквания; височината = максимална дълбочина на стека." },
    "бързо степенуване": { cat: "Методи", t: "Бързо степенуване", en: "Exponentiation by squaring", d: "xⁿ = (x^⌊n/2⌋)² · (x при нечетно n): едно рекурсивно извикване за половината ⇒ Θ(log n) извиквания.", more: "Ключът е, че резултатът за n/2 се изчислява веднъж и се използва два пъти." },
    "опашкова рекурсия": { cat: "Методи", t: "Опашкова рекурсия", en: "Tail recursion", d: "Рекурсивното извикване е последното действие на функцията — няма работа след връщането.", more: "Компилаторът може (но C стандартът не задължава) да я превърне в цикъл. fact(n) = n·fact(n−1) НЕ е опашкова — умножението е след връщането." },
  });

  /* ---------- чисти функции ---------- */
  const big = (v) => String(v);
  // снимка на стека: всяка рамка {f, n, x, wait, ret}
  const snap = (st) => st.map((r) => Object.assign({}, r));

  const algos = {
    /** a) факториел — рекурсивно (стек) или итеративно */
    fact({ n, iter }) {
      n = S.int(n, 0, 20, "n");
      return iter ? algos.fact_iter(n) : algos.fact_rec(n);
    },
    fact_rec(n) {
      const F = [], st = [];
      let calls = 0, depth = 0, maxd = 0, mults = 0;
      const stats = () => ({ извиквания: calls, "дълбочина на стека": depth, "максимум": maxd, умножения: mults });
      function rec(n) {
        calls++; depth++; maxd = Math.max(maxd, depth);
        st.push({ f: "fact", n, wait: null, ret: null });
        const top = st[st.length - 1];
        F.push({ at: "enter", stack: snap(st), cur: st.length - 1, vars: { n }, stats: stats(), msg: `Извикване <code>fact(${n})</code>: нова <dfn data-g="рамка на стека">рамка</dfn> върху стека (дълбочина ${depth}).`, log: `${"  ".repeat(depth - 1)}→ fact(${n})` });
        F.push({ at: "base_test", stack: snap(st), cur: st.length - 1, vars: { n }, stats: stats(), msg: `<dfn data-g="базов случай">Базов случай</dfn>? <code>n == 0</code>: ${n} == 0 → <b>${n === 0}</b>.` });
        let r;
        if (n === 0) {
          r = 1n;
          top.ret = "1";
          F.push({ at: "base", stack: snap(st), cur: st.length - 1, vars: { n, return: "1" }, stats: stats(), msg: `0! = 1 — връщаме <b>1</b> без ново извикване. Оттук започва <b>връщането</b> в обратен ред.`, log: `${"  ".repeat(depth - 1)}← 1` });
        } else {
          top.wait = `${n} × fact(${n - 1})`;
          F.push({ at: "call", stack: snap(st), cur: st.length - 1, vars: { n, r: "?" }, stats: stats(), msg: `Рекурсивно правило: ${n}! = ${n} · (${n - 1})!. Рамката на fact(${n}) <b>чака</b> — умножението по ${n} е незавършена работа, която стекът пази.` });
          const sub = rec(n - 1);
          top.wait = null;
          mults++;
          r = BigInt(n) * sub;
          top.ret = big(r);
          F.push({ at: "mul", stack: snap(st), cur: st.length - 1, vars: { n, r: big(sub), return: big(r) }, stats: stats(), msg: `Върна се fact(${n - 1}) = ${big(sub)}. Умножението <b>при връщане</b>: ${n} · ${big(sub)} = <b>${big(r)}</b>.`, log: `${"  ".repeat(depth - 1)}← ${n}·${big(sub)} = ${big(r)}` });
        }
        st.pop(); depth--;
        return r;
      }
      const res = rec(n);
      F.push({ at: "mul", stack: [], cur: -1, done: true, vars: { "fact(n)": big(res) }, stats: stats(), msg: `Готово: ${n}! = <b>${big(res)}</b>. Извиквания: ${calls} = n + 1, максимална дълбочина ${maxd} ⇒ стекът е Θ(n).`, inv: { text: `T(n) = T(n−1) + Θ(1) = Θ(n); памет за стека Θ(n)`, ok: true } });
      if (n === 0) F[F.length - 1].at = "base";
      return { frames: F, result: big(res), calls, maxDepth: maxd };
    },
    fact_iter(n) {
      const F = [];
      let r = 1n, mults = 0;
      const stats = () => ({ умножения: mults, "дълбочина на стека": 1, "максимум": 1 });
      F.push({ at: "init", iter: true, r: "1", i: null, n, vars: { n, r: "1" }, stats: stats(), msg: `Итеративно: една променлива r = 1. Само една рамка (на fact_iter) през цялото време.`, log: "r = 1" });
      let i = 2;
      for (; i <= n; i++) {
        F.push({ at: "loop", iter: true, r: big(r), i, n, vars: { n, i, r: big(r) }, stats: stats(), msg: `<code>i &lt;= n</code>: ${i} ≤ ${n} — продължаваме.` });
        r *= BigInt(i); mults++;
        F.push({ at: "mul", iter: true, r: big(r), i, n, vars: { n, i, r: big(r) }, stats: stats(), msg: `r = r · ${i} = <b>${big(r)}</b>.`, log: `r ·= ${i} → ${big(r)}` });
      }
      F.push({ at: "loop", iter: true, r: big(r), i, n, vars: { n, i, r: big(r) }, stats: stats(), msg: `<code>i &lt;= n</code>: ${i} ≤ ${n} — невярно, цикълът свършва.` });
      F.push({ at: "ret", iter: true, done: true, r: big(r), i, n, vars: { n, return: big(r) }, stats: stats(), msg: `Връщаме <b>${big(r)}</b>. Същото време Θ(n), но <b>Θ(1)</b> допълнителна памет — няма растящ стек.`, log: `return ${big(r)}` });
      return { frames: F, result: big(r), calls: 1, maxDepth: 1 };
    },

    /** b) недостижим базов случай: стекът расте до лимит */
    bad_base({ variant, n, limit }) {
      const v = variant || "dfact_bad";
      n = S.int(n, -20, 30, "n");
      limit = S.int(limit, 5, 60, "Лимит на стека");
      if (v === "fact" && n > 20) throw new Error("За fact n ≤ 20 (иначе препълване на unsigned long long).");
      const step = v === "fact" ? 1 : 2;
      const baseOk = v === "dfact_ok" ? (k) => k <= 1 : (k) => k === 0;
      const baseTxt = v === "dfact_ok" ? "n &lt;= 1" : "n == 0";
      const F = [], st = [];
      let calls = 0, depth = 0, maxd = 0, overflow = false;
      const stats = () => ({ извиквания: calls, "дълбочина": depth, "максимум": maxd, "лимит": limit });
      const fname = v === "fact" ? "fact" : v;
      function rec(k) {
        if (depth + 1 > limit) {
          overflow = true;
          F.push({ at: "call", stack: snap(st), cur: st.length - 1, limit, overflow: true, vars: { n: k }, stats: stats(), msg: `<b>Препълване на стека</b> (stack overflow): опит за рамка №${depth + 1} при лимит ${limit}. Аргументът стигна ${k} и продължава да намалява — базовият случай <code>${baseTxt}</code> никога няма да е верен.`, inv: { text: `базов случай съществува, но НЕ е достижим от n = ${n}`, ok: false }, log: `✗ overflow при ${fname}(${k})` });
          return null;
        }
        calls++; depth++; maxd = Math.max(maxd, depth);
        st.push({ f: fname, n: k, wait: null, ret: null });
        const top = st[st.length - 1];
        F.push({ at: "enter", stack: snap(st), cur: st.length - 1, limit, vars: { n: k }, stats: stats(), msg: `Извикване <code>${fname}(${k})</code> — дълбочина ${depth} от ${limit}.`, log: `${fname}(${k})` });
        const b = baseOk(k);
        F.push({ at: "base_test", stack: snap(st), cur: st.length - 1, limit, vars: { n: k }, stats: stats(), msg: `<code>${baseTxt}</code>? при n = ${k} → <b>${b}</b>.${!b && k < 0 ? " Аргументът вече е отрицателен — мярката n не е ограничена отдолу от базовия случай." : ""}` });
        let r;
        if (b) {
          r = 1n; top.ret = "1";
          F.push({ at: "base", stack: snap(st), cur: st.length - 1, limit, vars: { n: k, return: "1" }, stats: stats(), msg: `Базов случай — връщаме 1.`, log: `← 1` });
        } else {
          top.wait = `${k} × ${fname}(${k - step})`;
          F.push({ at: "call", stack: snap(st), cur: st.length - 1, limit, vars: { n: k }, stats: stats(), msg: `Рекурсивно извикване с аргумент ${k} − ${step} = ${k - step}.` });
          const sub = rec(k - step);
          if (sub === null) return null;
          top.wait = null;
          r = BigInt(k) * sub; top.ret = big(r);
          F.push({ at: "mul", stack: snap(st), cur: st.length - 1, limit, vars: { n: k, return: big(r) }, stats: stats(), msg: `${k} · ${big(sub)} = <b>${big(r)}</b>, връщане.`, log: `← ${big(r)}` });
        }
        st.pop(); depth--;
        return r;
      }
      const res = rec(n);
      if (res !== null) F.push({ at: "mul", stack: [], cur: -1, limit, done: true, vars: { result: big(res) }, stats: stats(), msg: `Завърши: ${fname}(${n}) = <b>${big(res)}</b> с ${calls} извиквания (макс. дълбочина ${maxd}).`, inv: { text: `мярката n намалява с ${step} и достига базовия случай`, ok: true } });
      if (res !== null && calls === 1) F[F.length - 1].at = "base";
      return { frames: F, result: res === null ? null : big(res), calls, maxDepth: maxd, overflow, stopDepth: overflow ? limit + 1 : maxd };
    },

    /** c) дърво на извикванията за x^n */
    pow_tree({ variant, x, n }) {
      const v = variant || "pow_fast";
      x = S.int(x, -9, 9, "x");
      n = S.int(n, 0, 40, "n");
      const bx = BigInt(x);
      if (bx !== 0n && n > 0 && (bx < 0n ? -bx : bx) ** BigInt(n) >= 2n ** 63n) throw new Error(`|x|^n надхвърля long long (2⁶³). Намали x или n.`);
      const F = [], nodes = [];
      let calls = 0, depth = 0, maxd = 0, mults = 0;
      const stats = () => ({ извиквания: calls, умножения: mults, дълбочина: depth, "макс. дълбочина": maxd });
      const snapN = () => nodes.map((o) => ({ id: o.id, p: o.p, n: o.n, val: o.val, st: o.st }));
      function rec(k, parent, tag) {
        calls++; depth++; maxd = Math.max(maxd, depth);
        const me = { id: nodes.length, p: parent, n: k, val: null, st: "act" };
        nodes.push(me);
        F.push({ at: tag ? [tag, "enter"] : "enter", nodes: snapN(), cur: me.id, vars: { x, n: k }, stats: stats(), msg: `Извикване ${v}(x, ${k}) — възел №${calls} в <dfn data-g="дърво на извикванията">дървото</dfn>.` });
        let r;
        if (k === 0) {
          r = 1n; me.val = "1"; me.st = "done";
          F.push({ at: "base", nodes: snapN(), cur: me.id, vars: { x, n: k, return: "1" }, stats: stats(), msg: `x⁰ = 1 — базов случай.` });
        } else if (v === "pow_lin") {
          me.st = "wait";
          const s = rec(k - 1, me.id, "call");
          r = bx * s; mults++;
          me.val = big(r); me.st = "done";
          F.push({ at: "comb", nodes: snapN(), cur: me.id, vars: { x, n: k, r: big(s), return: big(r) }, stats: stats(), msg: `x · x^${k - 1} = <b>${big(r)}</b>.` });
        } else if (v === "pow_twice") {
          me.st = "wait";
          const a = rec(k >> 1, me.id, "call1");
          const b = rec(k >> 1, me.id, "call2");
          r = a * b; mults++;
          if (k % 2) { r *= bx; mults++; }
          me.val = big(r); me.st = "done";
          F.push({ at: "comb", nodes: snapN(), cur: me.id, vars: { x, n: k, a: big(a), b: big(b), return: big(r) }, stats: stats(), msg: `a · b${k % 2 ? " · x" : ""} = <b>${big(r)}</b>. Второто извикване изчисли <b>същото</b> като първото — двойна работа.` });
        } else {
          me.st = "wait";
          const hh = rec(k >> 1, me.id, "call");
          r = hh * hh; mults++;
          if (k % 2) { r *= bx; mults++; }
          me.val = big(r); me.st = "done";
          F.push({ at: "comb", nodes: snapN(), cur: me.id, vars: { x, n: k, h: big(hh), return: big(r) }, stats: stats(), msg: `h · h${k % 2 ? " · x" : ""} = <b>${big(r)}</b> — резултатът за ⌊${k}/2⌋ се използва два пъти, изчислен веднъж.` });
        }
        depth--;
        return r;
      }
      const res = rec(n, -1, null);
      const fin = F[F.length - 1];
      fin.done = true;
      fin.msg += ` <b>Общо ${calls} извиквания</b> за n = ${n}.`;
      fin.log = `${v}(${x}, ${n}) = ${big(res)}`;
      return { frames: F, result: big(res), calls, mults, maxDepth: maxd };
    },
    /** брой извиквания без кадри (за таблицата) */
    pow_calls(v, n) {
      if (n === 0) return 1;
      if (v === "pow_lin") return 1 + algos.pow_calls(v, n - 1);
      if (v === "pow_twice") return 1 + 2 * algos.pow_calls(v, n >> 1);
      return 1 + algos.pow_calls(v, n >> 1);
    },
  };

  /* ---------- рисуване ---------- */
  function drawStack(st, f) {
    st.innerHTML = "";
    const limit = f.limit;
    const compact = f.stack.length > 9;
    const wrap = h("div", { style: { display: "grid", gap: "10px", gridTemplateColumns: "minmax(0,1fr)" } });
    if (limit) {
      const pct = Math.min(100, (f.stack.length / limit) * 100);
      wrap.append(h("div", { class: "row", style: { gap: "8px" } },
        h("span", { class: "muted", style: { fontSize: ".8rem" }, text: `стек: ${f.stack.length}/${limit}` }),
        h("div", { style: { flex: "1 1 160px", height: "10px", border: "1px solid var(--line)", borderRadius: "5px", overflow: "hidden" } },
          h("div", { class: f.overflow ? "s-swap" : pct > 75 ? "s-cmp" : "s-act", style: { width: pct + "%", height: "100%", background: "var(--c)" } }))));
    }
    const col = h("div", { style: { display: "flex", flexDirection: "column", gap: compact ? "2px" : "4px", maxWidth: "460px" } });
    if (!f.stack.length) col.append(h("p", { class: "muted", text: f.done ? "Стекът е празен — всички извиквания са завършили." : "Празен стек." }));
    // върхът на стека — най-горе
    for (let k = f.stack.length - 1; k >= 0; k--) {
      const r = f.stack[k];
      const cls = f.overflow && k === f.stack.length - 1 ? "s-swap" : k === f.cur ? (r.ret != null ? "s-done" : "s-act") : "s-dim";
      const txt = `${r.f}(${r.n})`;
      const right = r.ret != null ? `връща ${r.ret}` : r.wait ? `чака: ${r.wait}` : "";
      col.append(h("div", { class: cls, style: {
        display: "flex", justifyContent: "space-between", gap: "10px", alignItems: "center",
        border: "1.5px solid var(--c, var(--line))", background: "var(--cb, var(--panel))", borderRadius: "5px",
        padding: compact ? "1px 8px" : "6px 10px", font: `${compact ? 11.5 : 13.5}px var(--f-mono)`, opacity: cls === "s-dim" ? ".75" : "1",
      } }, h("b", { text: txt }), h("span", { class: "muted", style: { overflowWrap: "anywhere", textAlign: "right" }, text: right })));
    }
    if (f.stack.length) col.append(h("div", { class: "muted", style: { fontSize: ".72rem", textAlign: "center" }, text: "▲ връх на стека · дъно ▼ (main)" }));
    wrap.append(col);
    st.append(wrap);
  }

  function drawIter(st, f) {
    st.innerHTML = "";
    const cells = [], cls = {};
    for (let k = 1; k <= Math.max(1, f.n); k++) cells.push(k);
    cells.forEach((k, j) => { if (f.i != null && k < f.i && k >= 2) cls[j] = "s-done"; if (k === f.i) cls[j] = "s-act"; if (f.done && k >= 2) cls[j] = "s-done"; });
    const box = h("div", { style: { display: "grid", gap: "10px" } });
    S.drawArray(box, cells, { cls, label: () => "", index: false, append: true });
    box.append(h("div", { class: "row" },
      h("span", { class: "pill s-act", text: "една рамка: fact_iter" }),
      h("span", { class: "pill", style: { fontFamily: "var(--f-mono)" }, text: `r = ${f.r}` })));
    st.append(box);
  }

  function layoutTree(nodes) {
    const kids = nodes.map(() => []);
    nodes.forEach((o) => { if (o.p >= 0) kids[o.p].push(o.id); });
    const pos = {};
    let leaf = 0, maxDepth = 0;
    (function place(id, d) {
      maxDepth = Math.max(maxDepth, d);
      if (!kids[id].length) { pos[id] = { x: leaf++, d }; return; }
      kids[id].forEach((c) => place(c, d + 1));
      const xs = kids[id].map((c) => pos[c].x);
      pos[id] = { x: kids[id].length === 1 ? xs[0] : (Math.min(...xs) + Math.max(...xs)) / 2, d };
    })(0, 0);
    return { pos, leaves: leaf, depth: maxDepth };
  }
  function drawTree(st, f, all) {
    st.innerHTML = "";
    // окончателното дърво определя разположението — възлите не „скачат“
    const fin = all[all.length - 1].nodes;
    const L = layoutTree(fin);
    const dx = Math.max(26, Math.min(56, 900 / Math.max(1, L.leaves))), dy = 46;
    const W = Math.max(260, L.leaves * dx + 40), H = (L.depth + 1) * dy + 20;
    const X = (id) => 20 + dx / 2 + L.pos[id].x * dx, Y = (id) => 22 + L.pos[id].d * dy;
    const svg = S.svg("svg", { class: "g", viewBox: `0 0 ${W} ${H}`, width: W, style: "max-height:560px" });
    fin.forEach((o) => { if (o.p >= 0) svg.append(S.svg("line", { class: "edge" + (f.nodes[o.id] ? "" : " s-dim"), x1: X(o.p), y1: Y(o.p), x2: X(o.id), y2: Y(o.id), style: f.nodes[o.id] ? null : "opacity:.25" })); });
    const r = Math.min(15, dx / 2 - 2);
    fin.forEach((o) => {
      const live = f.nodes[o.id];
      let cls = "node ";
      if (!live) cls += "s-dim";
      else if (o.id === f.cur) cls += live.st === "done" ? "s-done" : "s-act";
      else if (live.st === "done") cls += "s-done";
      else cls += "s-cmp";
      const g = S.svg("g", { class: cls, style: live ? null : "opacity:.18" }, S.svg("circle", { cx: X(o.id), cy: Y(o.id), r }),
        S.svg("text", { x: X(o.id), y: Y(o.id) + 4, "text-anchor": "middle", style: `font-size:${r > 11 ? 12 : 9}px`, text: o.n }));
      g.append(S.svg("title", { text: `n = ${o.n}${live && live.val != null ? ", връща " + live.val : ""}` }));
      svg.append(g);
    });
    st.append(svg);
  }

  /* ---------- съдържание ---------- */
  const html = `
<div class="prose">
  <p><dfn data-g="рекурсия">Рекурсията</dfn> дефинира изчисление чрез <b>по-прости случаи на същата задача</b>. Рекурсивното определение съдържа <dfn data-g="базов случай">базов случай</dfn> и правило за рекурсивно преминаване; за да завърши, е нужна <dfn data-g="намаляваща мярка">намаляваща мярка</dfn>, която води до базовия случай.</p>
  <p>Рекурсията е <b>начин за организиране</b> на алгоритъма, а не самостоятелна гаранция за ефективност: рекурсивен алгоритъм може да е линеен, експоненциален и т.н. Определят го броят извиквания, размерът на подзадачите и работата извън тях.</p>
</div>

<div class="block">
  <h3>Факториел и стекът на извикванията</h3>
  <div class="key"><span class="formula">0! = 1;   n! = n · (n − 1)!  за n &gt; 0</span><br><span class="formula">T(n) = T(n − 1) + Θ(1) = Θ(n)  ·  стек Θ(n)  ·  итеративно: Θ(1) допълнителна памет</span></div>
  <p class="prose">За fact(4) е нужно 4 × fact(3), за fact(3) — 3 × fact(2)… Всяко незавършило извикване държи <dfn data-g="рамка на стека">рамка</dfn> в <dfn data-g="стек на извикванията">стека на извикванията</dfn>: стекът пази <b>незавършената работа</b> („умножи по 4, когато се върне отговорът“). Връщането протича в обратен ред.</p>
  <div id="v5-fact"></div>
  <details class="hint"><summary>Хинт: защо рекурсивният факториел е Θ(n) по време и Θ(n) по памет</summary><div>
    <p>Всяко извикване прави константна работа (сравнение, едно умножение) плюс едно извикване с n − 1 ⇒ T(n) = T(n − 1) + Θ(1); разгъваме n пъти до T(0) ⇒ Θ(n). Това е при <b>единична цена на умножение</b>.</p>
    <p>Паметта: в момента на базовия случай на стека едновременно стоят n + 1 рамки — нито една не е завършила, защото всяка чака умножението си. Итеративната версия има само r и i ⇒ Θ(1) допълнителна памет. Разликата между итерация и рекурсия тук е <b>стековата памет</b>, не времето.</p>
  </div></details>
  <details class="trap"><summary>Капан: „умножението е O(1)“ при големи числа</summary><div>
    <p>Θ(n) е вярно при единична цена на умножението. При реални големи цели числа (n! има ≈ n log n бита) цената на умножението <b>не е константна</b> и общото време расте по-бързо. Тук unsigned long long спира при n = 20 (21! &gt; 2⁶⁴).</p>
    <p class="muted"><dfn data-g="опашкова рекурсия">Опашкова рекурсия</dfn> <span class="extra-tag">извън конспекта</span>: fact не е опашкова — умножението става след връщането, затова рамката трябва да оцелее.</p>
  </div></details>
</div>

<div class="block">
  <h3>Базов случай ≠ завършване</h3>
  <p class="prose">Наличието на базов случай <b>не доказва</b> сам по себе си, че до него се стига. Определение с fact(n − 1) изисква отделно отношение към нула и отрицателни входове: при n &lt; 0 аргументът се отдалечава от 0. Вариантът <code>n · f(n − 2)</code> с базов случай само <code>n == 0</code> прескача нулата при нечетно n. Стекът расте до лимита → <dfn data-g="препълване на стека">препълване на стека</dfn>.</p>
  <div id="v5-bad"></div>
  <details class="hint"><summary>Хинт: как се доказва завършване на рекурсия</summary><div>
    <p>Посочва се <dfn data-g="намаляваща мярка">мярка</dfn> μ(аргумент) с цели неотрицателни стойности, която строго намалява при всяко извикване, и се показва, че всеки аргумент с най-малка мярка попада в базов случай. За fact: μ(n) = n, но само за n ≥ 0 — затова предусловието „n ≥ 0“ е част от коректността. За n · f(n − 2) правилният базов случай е <code>n &lt;= 1</code>.</p>
  </div></details>
  <details class="trap"><summary>Капан: „има базов случай, значи спира“</summary><div>
    <p>Грешно. Нужни са и двете: базов случай <b>и</b> доказателство, че всяка верига от извиквания достига до него (намаляваща мярка, ограничена отдолу). В C безкрайната рекурсия не е „изключение“ — това е препълване на стека и срив.</p>
  </div></details>
</div>

<div class="block">
  <h3>Броят извиквания определя сложността</h3>
  <p class="prose">Три рекурсивни реализации на xⁿ. Всичките са рекурсивни и всичките са коректни — различават се по <dfn data-g="дърво на извикванията">дървото на извикванията</dfn>. Сложността идва от <b>броя на извикванията</b> (и работата във всяко), не от самия факт, че има рекурсия.</p>
  <div id="v5-pow"></div>
  <div class="tbl-wrap"><table class="t grid" id="t5-pow"></table></div>
  <div class="key"><span class="formula">pow_lin:   C(n) = C(n − 1) + 1   ⇒ n + 1 = Θ(n) извиквания</span><br>
    <span class="formula">pow_twice: C(n) = 2·C(n/2) + 1  ⇒ Θ(n) извиквания (две еднакви подзадачи!)</span><br>
    <span class="formula">pow_fast:  C(n) = C(n/2) + 1    ⇒ ⌊log₂ n⌋ + 2 (n ≥ 1) = Θ(log n) извиквания</span></div>
  <details class="hint"><summary>Хинт: защо pow_twice не печели нищо, въпреки че „дели наполовина“</summary><div>
    <p>Делението наполовина намалява <b>размера</b> на подзадачата, но pow_twice прави <b>две</b> подзадачи с еднакъв размер n/2 ⇒ на ниво k има 2ᵏ възела, нивата са ⌊log₂ n⌋ + 2 (до n = 0) ⇒ общо 2<sup>⌊log₂ n⌋+2</sup> − 1 извиквания — между 2n + 1 и 4n − 1 (при n = 2ᵏ: 4n − 1). <dfn data-g="бързо степенуване">Бързото степенуване</dfn> забелязва, че двете подзадачи са <b>една и съща</b>, изчислява я веднъж и използва резултата два пъти ⇒ една подзадача на ниво ⇒ Θ(log n).</p>
    <p>Същата идея (не изчислявай една подзадача два пъти) е в основата на <a href="#dp">динамичното програмиране</a>: рекурсия + <dfn data-g="мемоизация">мемоизация</dfn> е DP — двете не се изключват.</p>
  </div></details>
  <details class="trap"><summary>Капан: „рекурсията е бавна“ / „рекурсията е ефективна“</summary><div>
    <p>И двете са грешни като общи твърдения. Рекурсията е начин за организиране. Наивната рекурсия за числата на Фибоначи е експоненциална заради повтарящи се подзадачи; Merge Sort е Θ(n log n); бързото степенуване е Θ(log n). Анализът минава през рекурентно уравнение за конкретния алгоритъм.</p>
  </div></details>
</div>`;

  function mount(root) {

      id: "c5fact", title: "fact(n) — стек на извикванията", sub: "Рамките се добавят при извикване и се махат при връщане с изчислената стойност.",

        { id: "n", label: "n", type: "number", value: 7, width: "6em" },

      code: (i) => "ch05_" + i.variant,
      inputs: [
        { id: "variant", label: "реализация", type: "select", value: "pow_fast", options: [["pow_lin", "линейна x·x^(n−1)"], ["pow_twice", "две извиквания за n/2"], ["pow_fast", "бързо степенуване"]] },
        { id: "x", label: "x (−9…9)", type: "number", value: 2, width: "5em" },
        { id: "n", label: "n (0…40)", type: "number", value: 13, width: "5em" },
      ],
      presets: [{ label: "n = 16", values: { n: 16, x: 2 } }, { label: "n = 31", values: { n: 31, x: 2 } }, { label: "(−3)⁷", values: { x: -3, n: 7 } }],
      legend: [["s-act", "текущо извикване"], ["s-cmp", "чака подзадачи"], ["s-done", "върнато"]],
      speed: 2, stageHeight: 200,

  S.chapter({ id: "rekursia", order: 5, num: "5", group: "Задължителни парадигми", title: "Рекурсия", lead: "Базов случай, рекурсивно правило и намаляваща мярка. Какво пази стекът, кога рекурсията не спира и защо броят извиквания — а не рекурсията — определя сложността.", html, mount, algos });

</script>
<script>
/* Раздел 6 — Разделяй и владей: Merge Sort, рекурентно дърво, двоично търсене, Quick Sort. */
(function () {
  const S = window.Study, h = S.h;

  Object.assign(window.GLOSSARY, {
    "merge sort": { cat: "Методи", t: "Сортиране чрез сливане (Merge Sort)", en: "Merge Sort", d: "Масивът се дели на две приблизително равни части, те се сортират рекурсивно и се сливат.", more: "T(n) = 2T(n/2) + Θ(n) = Θ(n log n) във всеки случай; стандартната реализация изисква Θ(n) допълнителна памет." },
    "сливане": { cat: "Методи", t: "Сливане (merge)", en: "Merge", d: "Обединяване на две сортирани последователности в една чрез многократно сравняване на текущите им първи елементи.", more: "Θ(n) за общо n елемента. Това е стъпката, която реално подрежда — самото разделяне не сортира." },
    "двоично търсене": { cat: "Методи", t: "Двоично търсене", en: "Binary search", d: "Търсене в сортиран масив: сравнява се със средния елемент и се продължава само в едната половина.", more: "T(n) = T(n/2) + Θ(1) = Θ(log n). Предусловие: масивът е сортиран — иначе отговорът може да е грешен." },
    "quick sort": { cat: "Методи", t: "Бързо сортиране (Quick Sort)", en: "Quick Sort", d: "Разделя масива спрямо опорен елемент на „по-малки или равни“ и „по-големи“ и сортира двете части рекурсивно.", more: "Времето зависи от баланса на разделянията: Θ(n log n) при добър баланс, Θ(n²) в най-лошия случай. Не е стабилно." },
    "опорен елемент": { cat: "Методи", t: "Опорен елемент", en: "Pivot", d: "Елементът, спрямо който Quick Sort разделя подмасива.", more: "Последен елемент върху вече сортиран масив дава най-лошия случай Θ(n²). Случаен избор ⇒ очаквано O(n log n) (Las Vegas)." },
    "разделяне на lomuto": { cat: "Методи", t: "Разделяне на Lomuto", en: "Lomuto partition", d: "Опорният е в a[hi]; индекс i пази границата на зоната ≤ pivot, j обхожда; накрая опорният се разменя с a[i].", more: "Прави точно hi − lo сравнения на разделяне. Алтернатива: схемата на Hoare (по-малко размени)." },
    "основна теорема": { cat: "Методи", t: "Основна теорема (Master theorem)", en: "Master theorem", d: "Готово решение за T(n) = a·T(n/b) + f(n), като се сравнява f(n) с n^(log_b a).", more: "Извън конспекта. 2T(n/2)+n ⇒ n log n; T(n/2)+1 ⇒ log n; 2T(n/2)+1 ⇒ n." },
    "предусловие": { cat: "Алгоритми и коректност", t: "Предусловие", en: "Precondition", d: "Условие върху входа, при което алгоритъмът гарантира верен резултат.", more: "За двоичното търсене: сортиран масив. При нарушено предусловие коректността не е обещана." },
  });

  /* ---------- чисти функции ---------- */
  const A = (s, o) => S.parseNums(s, Object.assign({ min: -999, max: 999 }, o));

  const algos = {
    /** a) Merge Sort top-down с буфер tmp — същите броячи като C */
    merge_sort({ arr }) {
      const a = A(arr, { minLen: 1, maxLen: 16 });
      const n = a.length, tmp = new Array(n).fill(null), F = [];
      let cmp = 0, copy = 0;
      // всички подмасиви [lo,hi) — за неподвижна схема на нивата
      const segs = {};
      (function pre(lo, hi, d) { segs[lo + "," + hi] = { lo, hi, d, st: "wait", vals: null }; if (hi - lo < 2) return; const m = lo + ((hi - lo) >> 1); pre(lo, m, d + 1); pre(m, hi, d + 1); })(0, n, 0);
      const snapSegs = () => { const o = {}; for (const k in segs) o[k] = { st: segs[k].st, vals: segs[k].vals ? segs[k].vals.slice() : null }; return o; };
      const st = () => ({ сравнения: cmp, копирания: copy });
      const push = (o) => F.push(Object.assign({ a: a.slice(), tmp: tmp.slice(), segs: snapSegs(), stats: st() }, o));
      function merge(lo, mid, hi) {
        const key = lo + "," + hi;
        for (let q = lo; q < hi; q++) tmp[q] = null;
        let i = lo, j = mid, k = lo;
        const P = () => ({ i: i < mid ? i : null, j: j < hi ? j : null, k: k < hi ? k : null });
        const V = () => ({ lo, mid, hi, i, j, k });
        push({ at: "m_init", seg: key, m: { lo, mid, hi }, ptr: P(), vars: V(), msg: `<dfn data-g="сливане">Сливане</dfn> на a[${lo}..${mid}) = [${a.slice(lo, mid).join(", ")}] и a[${mid}..${hi}) = [${a.slice(mid, hi).join(", ")}]. Двете половини вече са сортирани.` });
        while (i < mid && j < hi) {
          cmp++;
          const le = a[i] <= a[j];
          push({ at: "m_cmp", seg: key, m: { lo, mid, hi }, ptr: P(), cmpIJ: true, vars: V(), msg: `Сравняваме текущите първи елементи: a[${i}] = ${a[i]} ${le ? "≤" : ">"} a[${j}] = ${a[j]} → взимаме от <b>${le ? "лявата" : "дясната"}</b> половина.` });
          if (le) tmp[k++] = a[i++]; else tmp[k++] = a[j++];
          copy++;
          push({ at: le ? "m_left" : "m_right", seg: key, m: { lo, mid, hi }, ptr: P(), wrote: k - 1, vars: V(), log: `tmp[${k - 1}] = ${tmp[k - 1]}` });
        }
        while (i < mid) { tmp[k++] = a[i++]; copy++; push({ at: "m_restL", seg: key, m: { lo, mid, hi }, ptr: P(), wrote: k - 1, vars: V(), msg: `Дясната половина е изчерпана — копираме остатъка от лявата.`, log: `tmp[${k - 1}] = ${tmp[k - 1]} (остатък)` }); }
        while (j < hi) { tmp[k++] = a[j++]; copy++; push({ at: "m_restR", seg: key, m: { lo, mid, hi }, ptr: P(), wrote: k - 1, vars: V(), msg: `Лявата половина е изчерпана — копираме остатъка от дясната.`, log: `tmp[${k - 1}] = ${tmp[k - 1]} (остатък)` }); }
        for (k = lo; k < hi; k++) { a[k] = tmp[k]; copy++; }
        segs[key].st = "done"; segs[key].vals = a.slice(lo, hi);
        push({ at: "m_back", seg: key, m: { lo, mid, hi }, ptr: {}, back: true, vars: { lo, mid, hi }, msg: `Копираме tmp[${lo}..${hi}) обратно в a: [${a.slice(lo, hi).join(", ")}] — подмасивът е сортиран.`, log: `a[${lo}..${hi}) = [${a.slice(lo, hi).join(", ")}]` });
      }
      function rec(lo, hi) {
        const key = lo + "," + hi;
        segs[key].st = "act";
        push({ at: "enter", seg: key, vars: { lo, hi }, msg: `merge_sort_rec(a, ${lo}, ${hi}) — подмасив a[${lo}..${hi}) с ${hi - lo} елемента.`, log: `${"· ".repeat(segs[key].d)}[${lo}, ${hi})` });
        if (hi - lo < 2) {
          segs[key].st = "done"; segs[key].vals = a.slice(lo, hi);
          push({ at: "base", seg: key, vars: { lo, hi }, msg: `${hi - lo} елемент${hi - lo === 1 ? "" : "а"} — вече е сортиран (базов случай).` });
          return;
        }
        const mid = lo + ((hi - lo) >> 1);
        segs[key].st = "split";
        push({ at: "split", seg: key, vars: { lo, hi, mid }, msg: `<b>Разделяне</b>: mid = ${lo} + (${hi} − ${lo})/2 = ${mid} → [${lo}, ${mid}) и [${mid}, ${hi}).` });
        push({ at: "left", seg: key, vars: { lo, hi, mid }, msg: `Рекурсивно сортираме лявата половина [${lo}, ${mid}).` });
        rec(lo, mid);
        push({ at: "right", seg: key, vars: { lo, hi, mid }, msg: `Рекурсивно сортираме дясната половина [${mid}, ${hi}).` });
        rec(mid, hi);
        segs[key].st = "act";
        push({ at: "merge", seg: key, vars: { lo, hi, mid }, msg: `<b>Обединяване</b>: двете половини са сортирани — сливаме ги.` });
        merge(lo, mid, hi);
      }
      rec(0, n);
      const last = F[F.length - 1];
      last.done = true;
      last.msg = `Сортирано: [${a.join(", ")}]. Сравнения: ${cmp}, копирания: ${copy} (= 2 × сумата от размерите на всички сливания; при n = 2ᵏ точно 2n·log₂ n).`;
      return { frames: F, result: a.join(" "), cmp, copy };
    },

    /** b) дърво на рекурентното уравнение */
    rec_tree({ kind, n }) {
      n = S.int(n, 1, 64, "n");
      if (n & (n - 1)) throw new Error("n трябва да е степен на 2.");
      const L = Math.log2(n), F = [], levels = [];
      let total = 0;
      for (let k = 0; k <= L; k++) {
        const size = n >> k;
        const cnt = kind === "bs" ? 1 : 2 ** k;
        const each = kind === "ms" ? size : 1;
        const work = cnt * each;
        total += work;
        levels.push({ k, size, cnt, each, work });
        F.push({ levels: levels.slice(), total, kind, n, L, msg: `Ниво ${k}: ${cnt} подзадач${cnt === 1 ? "а" : "и"} с размер ${size}, всяка с работа ${kind === "ms" ? "c·" + size : "c"} ⇒ ниво = <b>${kind === "ms" ? "c·" : ""}${work}${kind === "ms" ? "" : "·c"}</b>. Натрупано: ${total}·c.`, stats: { нива: k + 1, "работа общо (·c)": total } });
      }
      const fin = { ms: `${n}·(${L}+1) = n(log₂n + 1) ⇒ <b>Θ(n log n)</b>`, bs: `${L}+1 = log₂n + 1 ⇒ <b>Θ(log n)</b>`, one: `2n − 1 = ${2 * n - 1} ⇒ <b>Θ(n)</b>` }[kind];
      F.push({ levels: levels.slice(), total, kind, n, L, done: true, msg: `Нива: log₂${n} + 1 = ${L + 1}. Общо: ${total}·c = ${fin}.`, stats: { нива: L + 1, "работа общо (·c)": total } });
      return { frames: F, total, levels: L + 1 };
    },

    /** c) двоично търсене */
    binary_search({ arr, key, pre }) {
      let a = A(arr, { minLen: 0, maxLen: 24 });
      key = S.int(key, -999, 999, "key");
      const sorted = a.every((v, k) => k === 0 || a[k - 1] <= v);
      let note = "";
      if (!sorted) {
        if (pre === "sort") { a = a.slice().sort((x, y) => x - y); note = "Входът не беше сортиран — сортиран автоматично. "; }
        else if (pre === "reject") throw new Error("Масивът не е сортиран — нарушено предусловие на двоичното търсене. Избери „сортирай“ или „пусни въпреки това“.");
      }
      const n = a.length, F = [];
      let cmp = 0, lo = 0, hi = n - 1;
      const bad = !sorted && pre === "raw";
      const st = () => ({ сравнения: cmp, "интервал": Math.max(0, hi - lo + 1) });
      F.push({ at: "init", a, lo, hi, mid: null, bad, vars: { n, key, lo, hi }, stats: st(), msg: note + (bad ? `<span class="warn">Внимание: масивът НЕ е сортиран — <dfn data-g="предусловие">предусловието</dfn> е нарушено.</span> ` : "") + `lo = 0, hi = n − 1 = ${n - 1}.`, log: `търсим ${key}` });
      while (true) {
        F.push({ at: "loop", a, lo, hi, mid: null, bad, vars: { key, lo, hi }, stats: st(), msg: `<code>lo &lt;= hi</code>: ${lo} ≤ ${hi} → <b>${lo <= hi}</b>.` });
        if (lo > hi) break;
        const mid = lo + ((hi - lo) >> 1);
        F.push({ at: "mid", a, lo, hi, mid, bad, vars: { key, lo, hi, mid }, stats: st(), msg: `mid = lo + (hi − lo)/2 = ${lo} + ${(hi - lo)}/2 = <b>${mid}</b>.` });
        cmp++;
        const eq = a[mid] === key;
        F.push({ at: "eq", a, lo, hi, mid, cmpk: true, bad, vars: { key, lo, hi, mid, "a[mid]": a[mid] }, stats: st(), msg: `a[${mid}] == key? ${a[mid]} == ${key} → <b>${eq}</b>.`, log: `a[${mid}]=${a[mid]} vs ${key}` });
        if (eq) {
          F.push({ at: "found", a, lo, hi, mid, found: true, done: true, bad, vars: { key, mid, return: mid }, stats: st(), msg: `Намерено на индекс <b>${mid}</b> след ${cmp} сравнения.`, log: `return ${mid}` });
          return { frames: F, result: mid, cmp, a };
        }
        cmp++;
        const less = a[mid] < key;
        F.push({ at: "lt", a, lo, hi, mid, cmpk: true, bad, vars: { key, lo, hi, mid, "a[mid]": a[mid] }, stats: st(), msg: `a[${mid}] &lt; key? ${a[mid]} &lt; ${key} → <b>${less}</b> ⇒ ${less ? "търсим вдясно" : "търсим вляво"}.${bad ? " (При несортиран масив това заключение е необосновано!)" : ""}` });
        if (less) lo = mid + 1; else hi = mid - 1;
        F.push({ at: less ? "right" : "left", a, lo, hi, mid, bad, vars: { key, lo, hi }, stats: st(), msg: less ? `lo = mid + 1 = ${lo}. Лявата половина отпада.` : `hi = mid − 1 = ${hi}. Дясната половина отпада.` });
      }
      const really = a.indexOf(key);
      F.push({ at: "notfound", a, lo, hi, mid: null, done: true, bad, vars: { key, return: -1 }, stats: st(), msg: `Интервалът е празен — връщаме <b>−1</b> след ${cmp} сравнения.` + (really >= 0 ? ` <span class="warn">Грешен отговор: ${key} е на индекс ${really}! Двоичното търсене е коректно само при сортиран вход.</span>` : ""), inv: really >= 0 ? { text: "нарушено предусловие ⇒ няма гаранция за коректност", ok: false } : null, log: "return -1" });
      return { frames: F, result: -1, cmp, a };
    },

    /** d) Quick Sort (Lomuto) с избор на опорен елемент — същите броячи и същият ГПСЧ като C */
    quick_sort({ arr, mode }) {
      const a = A(arr, { minLen: 1, maxLen: 24 });
      mode = S.int(mode, 0, 3, "Режим");
      const n = a.length, F = [], fixed = new Set();
      let cmp = 0, swp = 0, depth = 0, maxd = 0, seed = 12345;
      const rnd = (m) => { seed = (Math.imul(seed, 1103515245) + 12345) >>> 0; return (seed & 0x7fffffff) % m; };
      const lt = (x, y) => { cmp++; return x < y; };
      const swap = (x, y) => { const t = a[x]; a[x] = a[y]; a[y] = t; swp++; };
      const stack = [];
      const st = () => ({ сравнения: cmp, размени: swp, дълбочина: depth, "макс. дълбочина": maxd });
      const push = (o) => F.push(Object.assign({ a: a.slice(), fixed: [...fixed], stack: stack.slice(), stats: st() }, o));
      const MN = ["последен", "среден", "случаен", "медиана от три"];
      function choose(lo, hi) {
        const mid = lo + ((hi - lo) >> 1);
        if (mode === 0) return hi;
        if (mode === 1) return mid;
        if (mode === 2) return lo + rnd(hi - lo + 1);
        if (lt(a[lo], a[mid])) return lt(a[mid], a[hi]) ? mid : (lt(a[lo], a[hi]) ? hi : lo);
        return lt(a[lo], a[hi]) ? lo : (lt(a[mid], a[hi]) ? hi : mid);
      }
      function partition(lo, hi) {
        const p = choose(lo, hi);
        push({ at: "choose", lo, hi, piv: p, vars: { lo, hi, p }, msg: `<dfn data-g="опорен елемент">Опорен елемент</dfn> (${MN[mode]}): a[${p}] = <b>${a[p]}</b>.` });
        swap(p, hi);
        push({ at: "tolast", lo, hi, piv: hi, vars: { lo, hi, p }, msg: `Преместваме опорния в края: swap(a[${p}], a[${hi}]).${p === hi ? " (Вече е там — размяна сам със себе си, но се брои.)" : ""}` });
        const pivot = a[hi];
        let i = lo;
        push({ at: "pinit", lo, hi, piv: hi, i, vars: { pivot, i }, msg: `pivot = ${pivot}, i = ${lo}. Зоната a[lo..i) ще съдържа елементите ≤ pivot.` });
        for (let j = lo; j < hi; j++) {
          const le = !lt(pivot, a[j]);
          push({ at: "pcmp", lo, hi, piv: hi, i, j, vars: { pivot, i, j, "a[j]": a[j] }, msg: `a[${j}] = ${a[j]} ${le ? "≤" : ">"} pivot = ${pivot}${le ? " → в лявата зона" : " → остава вдясно"}.` });
          if (le) {
            swap(i, j);
            push({ at: "pswap", lo, hi, piv: hi, i, j, sw: [i, j], vars: { pivot, i, j }, msg: `swap(a[${i}], a[${j}]), i = ${i + 1}.` });
            i++;
          }
        }
        swap(i, hi);
        fixed.add(i);
        push({ at: "pfinal", lo, hi, piv: i, i, vars: { pivot, i, return: i }, msg: `Опорният застава на окончателното си място ${i}: вляво ${i - lo} елемента ≤ ${pivot}, вдясно ${hi - i} &gt; ${pivot}.${Math.min(i - lo, hi - i) === 0 && hi > lo ? " <b>Небалансирано разделяне</b> (0 : " + (hi - lo) + ")." : ""}`, log: `[${lo}..${hi}] pivot ${pivot} → поз. ${i} (${i - lo}:${hi - i})` });
        return i;
      }
      function qs(lo, hi) {
        push({ at: "enter", lo, hi, vars: { lo, hi }, msg: `quick_sort(a, ${lo}, ${hi}).` });
        if (lo >= hi) {
          if (lo === hi) fixed.add(lo);
          push({ at: "base", lo, hi, vars: { lo, hi }, msg: lo === hi ? `Един елемент — на мястото си.` : `Празен подмасив.` });
          return;
        }
        depth++; maxd = Math.max(maxd, depth);
        stack.push([lo, hi]);
        push({ at: "part", lo, hi, vars: { lo, hi }, msg: `Разделяне на a[${lo}..${hi}] — дълбочина на рекурсията ${depth}.` });
        const p = partition(lo, hi);
        push({ at: "left", lo, hi: p - 1, vars: { lo, p }, msg: `Лява част [${lo}..${p - 1}].` });
        qs(lo, p - 1);
        push({ at: "right", lo: p + 1, hi, vars: { p, hi }, msg: `Дясна част [${p + 1}..${hi}].` });
        qs(p + 1, hi);
        depth--; stack.pop();
      }
      qs(0, n - 1);
      for (let k = 0; k < n; k++) fixed.add(k);
      const lg = Math.ceil(Math.log2(n + 1));
      push({ at: "enter", done: true, lo: 0, hi: n - 1, vars: { n }, msg: `Сортирано. Сравнения: <b>${cmp}</b> (n(n−1)/2 = ${n * (n - 1) / 2}), макс. дълбочина <b>${maxd}</b> (⌈log₂(n+1)⌉ = ${lg}).${maxd >= n - 1 && n > 3 ? " Дълбочина ≈ n ⇒ най-лош случай Θ(n²)." : ""}` });
      return { frames: F, result: a.join(" "), cmp, swp, maxd };
    },
  };

  /* ---------- рисуване ---------- */
  function drawMerge(st, f) {
    st.innerHTML = "";
    const n = f.a.length;
    const levels = {};
    for (const k in f.segs) { const [lo, hi] = k.split(",").map(Number); const d = depthOf(k, f); (levels[d] = levels[d] || []).push({ k, lo, hi }); }
    const cw = n > 10 ? 26 : 34;
    const grid = h("div", { style: { display: "grid", gap: "6px", gridTemplateColumns: `repeat(${n}, ${cw}px)`, columnGap: "4px", width: "max-content" } });
    Object.keys(levels).sort((x, y) => x - y).forEach((d) => {
      levels[d].forEach((s) => {
        const ss = f.segs[s.k];
        const vals = ss.vals || f.a.slice(s.lo, s.hi);
        const cls = s.k === f.seg ? "s-act" : ss.st === "done" ? "s-done" : ss.st === "split" ? "s-cmp" : "s-dim";
        const box = h("div", { class: cls, style: { gridColumn: `${s.lo + 1} / ${s.hi + 1}`, gridRow: +d + 1, display: "flex", border: "1.5px solid var(--c)", background: "var(--cb)", borderRadius: "4px", opacity: cls === "s-dim" ? ".5" : "1" } },
          ...vals.map((v) => h("span", { style: { flex: "1", textAlign: "center", font: `600 ${n > 10 ? 11 : 13}px var(--f-mono)`, padding: "3px 0" }, text: v })));
        grid.append(box);
      });
    });
    st.append(h("div", { class: "muted", style: { fontSize: ".75rem", marginBottom: "4px" }, text: "Дърво на рекурсията: ниво 0 горе; надолу — разделяне, нагоре — сливане" }), grid);
    // масив + tmp
    const cls = {};
    if (f.m) {
      for (let q = 0; q < n; q++) if (q < f.m.lo || q >= f.m.hi) cls[q] = "s-dim";
      if (f.ptr && f.ptr.i != null) cls[f.ptr.i] = f.cmpIJ ? "s-cmp" : "s-act";
      if (f.ptr && f.ptr.j != null) cls[f.ptr.j] = f.cmpIJ ? "s-cmp" : "s-piv";
      if (f.back) for (let q = f.m.lo; q < f.m.hi; q++) cls[q] = "s-done";
    }
    const row = h("div", { style: { display: "grid", gap: "0", marginTop: "10px" } });
    row.append(h("span", { class: "eyebrow", text: "a[]" }));
    S.drawArray(row, f.a, { cls, append: true, ptr: f.ptr ? { i: f.ptr.i, j: f.ptr.j } : {}, gapAt: f.m ? [f.m.mid] : [] });
    if (f.m) {
      row.append(h("span", { class: "eyebrow", text: "tmp[]" }));
      const tc = {}; if (f.wrote != null) tc[f.wrote] = "s-swap";
      for (let q = 0; q < n; q++) if (q < f.m.lo || q >= f.m.hi) tc[q] = "s-dim";
      S.drawArray(row, f.tmp, { cls: tc, append: true, ptr: f.ptr && f.ptr.k != null ? { k: f.ptr.k } : {} });
    }
    st.append(row);
  }
  function depthOf(k, f) { // дълбочина: по броя на обхващащите сегменти
    const [lo, hi] = k.split(",").map(Number);
    let d = 0;
    for (const o in f.segs) { if (o === k) continue; const [l2, h2] = o.split(",").map(Number); if (l2 <= lo && hi <= h2 && (h2 - l2) > (hi - lo)) d++; }
    return d;
  }

  function drawRecTree(st, f) {
    st.innerHTML = "";
    const avail = (st.clientWidth || 840) - 32, lab = 130;
    const W = Math.max(200, Math.min(640, avail - lab)), rowH = 34, H = (f.L + 1) * rowH + 10;
    const svg = S.svg("svg", { class: "g", viewBox: `0 0 ${W + lab} ${H}`, width: W + lab });
    f.levels.forEach((L, idx) => {
      const y = 6 + idx * rowH, cnt = L.cnt;
      const span = f.kind === "bs" ? W / f.n * L.size : W / cnt;
      const gap = cnt > 32 ? 0.5 : 2;
      for (let q = 0; q < cnt; q++) {
        const x = f.kind === "bs" ? 0 : q * span;
        const last = idx === f.levels.length - 1 && !f.done;
        svg.append(S.svg("rect", { x: x + gap / 2, y, width: Math.max(1, span - gap), height: rowH - 10, rx: 3, class: "", style: `fill:var(${last ? "--st-act-bg" : "--st-done-bg"});stroke:var(${last ? "--st-act" : "--st-done"});stroke-width:1` }));
      }
      if (span > 22) for (let q = 0; q < cnt; q++) svg.append(S.svg("text", { x: (f.kind === "bs" ? 0 : q * span) + span / 2, y: y + 17, "text-anchor": "middle", style: "font-size:11px", text: L.size }));
      svg.append(S.svg("text", { x: W + 12, y: y + 17, style: "font-size:12px", text: `${cnt}×${f.kind === "ms" ? "c·" + L.size : "c"} = ${L.work}c` }));
    });
    st.append(svg);
  }

  function drawBS(st, f) {
    st.innerHTML = "";
    if (!f.a.length) { st.append(h("p", { class: "muted", text: "Празен масив: hi = −1 < lo = 0, цикълът не започва." })); return; }
    const cls = {};
    f.a.forEach((_, k) => { if (k < f.lo || k > f.hi) cls[k] = "s-dim"; });
    if (f.mid != null) cls[f.mid] = f.found ? "s-done" : f.cmpk ? "s-cmp" : "s-act";
    const ptr = {};
    if (f.lo < f.a.length) ptr.lo = f.lo;
    if (f.hi >= 0) ptr.hi = f.hi;
    if (f.mid != null) ptr.mid = f.mid;
    const box = S.drawArray(st, f.a, { cls, ptr });
    if (f.bad) st.append(h("p", { class: "warn", text: "Масивът не е сортиран: изхвърлянето на половина не е обосновано." }));
    return box;
  }

  function drawQS(st, f) {
    st.innerHTML = "";
    const cls = {}, fx = new Set(f.fixed);
    f.a.forEach((_, k) => { if (fx.has(k)) cls[k] = "s-done"; else if (k < f.lo || k > f.hi) cls[k] = "s-dim"; });
    if (f.piv != null) cls[f.piv] = "s-piv";
    if (f.j != null) cls[f.j] = "s-cmp";
    if (f.sw) f.sw.forEach((k) => (cls[k] = "s-swap"));
    if (f.done) f.a.forEach((_, k) => (cls[k] = "s-done"));
    const ptr = {};
    if (f.i != null) ptr.i = f.i;
    if (f.j != null) ptr.j = f.j;
    S.drawBars(st, f.a, { cls, height: 150, labelsUpTo: 24 });
    const pr = h("div", { class: "row", style: { font: "12px var(--f-mono)", gap: "6px", marginTop: "6px" } });
    pr.append(h("span", { class: "muted", text: "указатели:" }), h("span", { text: `i=${f.i ?? "—"}  j=${f.j ?? "—"}  [lo..hi]=[${f.lo}..${f.hi}]` }));
    st.append(pr);
    const sk = h("div", { class: "row", style: { gap: "4px", marginTop: "6px" } }, h("span", { class: "muted", style: { fontSize: ".75rem" }, text: `стек на рекурсията (${f.stack.length}):` }));
    f.stack.forEach((r) => sk.append(h("span", { class: "pill", style: { fontFamily: "var(--f-mono)" }, text: `${r[0]}..${r[1]}` })));
    st.append(sk);
  }

  /* ---------- съдържание ---------- */
  const html = `
<div class="prose">
  <p><dfn data-g="разделяй и владей">Разделяй и владей</dfn>: задачата се разделя на по-малки подзадачи, те се решават, а частичните резултати се обединяват. Етапи: <b>разделяне → решаване → обединяване</b>. Подзадачите обикновено са <b>независими</b> (за разлика от <a href="#dp">динамичното програмиране</a>).</p>
</div>

<div class="block">
  <h3>Merge Sort — дърво на рекурсията</h3>
  <p class="prose"><dfn data-g="merge sort">Merge Sort</dfn>: масивът се дели на две приблизително равни части, те се сортират рекурсивно и се сливат. [8, 3, 6, 2] → [8, 3] и [6, 2] → [3, 8] и [2, 6] → [2, 3, 6, 8]. Самото разделяне <b>не сортира</b> — съществена е коректната операция за обединяване: <dfn data-g="сливане">сливане</dfn> чрез сравняване на текущите първи елементи.</p>
  <div id="v6-ms"></div>
  <details class="hint"><summary>Хинт: откъде идва n log n</summary><div>
    <p>На всяко ниво на дървото подмасивите заедно покриват целия масив ⇒ сливанията на едно ниво струват общо Θ(n). Размерът се дели на 2 ⇒ нивата са log₂ n (+1 с листата). Θ(n) на ниво × log n нива = Θ(n log n). Това е вярно за <b>всеки</b> вход — броят нива не зависи от стойностите.</p>
    <p>Броячът „копирания“ е най-много 2·n на ниво (n в tmp и n обратно) — точно 2·n, когато всички подмасиви на нивото се сливат (напр. при n = 2ᵏ) — оттук и Θ(n) допълнителната памет за tmp.</p>
  </div></details>
  <details class="trap"><summary>Капан: „разделянето сортира“ / „Merge Sort е на място“</summary><div>
    <p>Разделянето само намалява размера; подреждането става при сливането. Стандартната реализация изисква <b>Θ(n) допълнителна памет</b> — не е на място.</p>
    <p>Реални библиотеки: C++ <code>std::stable_sort</code> е стабилно; Python <code>list.sort</code>/<code>sorted</code> са стабилни (Timsort). Не всяко библиотечно сортиране е учебният Merge Sort.</p>
  </div></details>
</div>

<div class="block">
  <h3>Рекурентното уравнение като дърво</h3>
  <div class="key"><span class="formula">T(n) = 2T(n/2) + cn  ⇒  Θ(n log n)</span>  — логаритмичен брой нива, линейна обща работа на ниво.</div>
  <div id="v6-rec"></div>
  <details class="hint"><summary>Хинт: три уравнения, три различни отговора <span class="extra-tag">извън конспекта</span></summary><div>
    <p>Решават се с метода на дървото (виж горе) или с <dfn data-g="основна теорема">основната теорема</dfn>. 2T(n/2) + n: работата е еднаква на всяко ниво ⇒ n·log n. T(n/2) + 1: един възел на ниво ⇒ log n. 2T(n/2) + 1: работата се удвоява надолу и листата доминират ⇒ n.</p>
  </div></details>
</div>

<div class="block">
  <h3>Двоично търсене</h3>
  <p class="prose"><dfn data-g="двоично търсене">Двоичното търсене</dfn> продължава само в <b>едната</b> половина: T(n) = T(n/2) + Θ(1) = Θ(log n). Работи само при <dfn data-g="предусловие">предусловие</dfn> — сортиран масив.</p>
  <div id="v6-bs"></div>
  <details class="hint"><summary>Хинт: защо mid = lo + (hi − lo)/2, а не (lo + hi)/2</summary><div>
    <p>При int и големи масиви lo + hi може да надхвърли INT_MAX — препълване на знаково цяло число е недефинирано поведение в C. lo + (hi − lo)/2 дава същия резултат без препълване. Класически бъг, открит в библиотеки след години употреба.</p>
    <p>Инвариант: ако key е в масива, той е в a[lo..hi]. Мярка: hi − lo + 1 намалява поне наполовина ⇒ най-много ⌊log₂ n⌋ + 1 итерации.</p>
  </div></details>
  <details class="trap"><summary>Капан: всяка рекурсия ли е „разделяй и владей“?</summary><div>
    <p>Двоичното търсене има една подзадача и няма обединяване — в литературата често се класифицира и като <dfn data-g="намаляване на размера">намаляване на размера</dfn>. Не всяка рекурсивна програма е „разделяй и владей“ в същия практически смисъл.</p>
  </div></details>
</div>

<div class="block">
  <h3>Quick Sort и изборът на опорен елемент</h3>
  <p class="prose"><dfn data-g="quick sort">Quick Sort</dfn> разделя подмасива спрямо <dfn data-g="опорен елемент">опорен елемент</dfn> (тук — <dfn data-g="разделяне на lomuto">разделяне на Lomuto</dfn>) и сортира двете части рекурсивно. Тук работата е в <b>разделянето</b>, а обединяване няма. Времето зависи от <b>баланса на разделянията</b>.</p>
  <div id="v6-qs"></div>

    <p>При много повтарящи се ключове Lomuto също деградира — всички равни отиват вляво.</p>

<script>
/* Раздел 7 — Лаборатория за сортиране: шест алгоритъма, еднакви броячи с C, състезание, стабилност. */
(function () {
  const S = window.Study, h = S.h;

  Object.assign(window.GLOSSARY, {
    "сортиране чрез пряк избор": { cat: "Методи", t: "Сортиране чрез пряк избор", en: "Selection sort", d: "На позиция i се поставя минимумът на a[i..n−1].", more: "Винаги n(n−1)/2 сравнения ⇒ Θ(n²) във всеки случай; най-много n−1 размени. Не е стабилно (размяната прескача равни)." },
    "метод на мехурчето": { cat: "Методи", t: "Метод на мехурчето", en: "Bubble sort", d: "Съседни двойки в грешен ред се разменят; след всеки проход най-големият елемент е в края.", more: "С ранно спиране (проход без размени) най-добрият случай е Θ(n); най-лошият Θ(n²). Стабилно." },
    "сортиране чрез вмъкване": { cat: "Методи", t: "Сортиране чрез вмъкване", en: "Insertion sort", d: "Подредените първи n−1 елемента се допълват чрез вмъкване на последния на правилното място.", more: "Намаляване на размера (една подзадача). Θ(n) при сортиран вход, Θ(n²) в най-лошия; бързо при почти сортиран вход. Стабилно, на място." },
    "пирамидално сортиране": { cat: "Методи", t: "Пирамидално сортиране", en: "Heap sort", d: "Строи се max-пирамида, после n−1 пъти максимумът се разменя с последния елемент и пирамидата се възстановява.", more: "Извън конспекта. O(n log n) във всеки случай (Θ(n log n) в най-лошия; при всички равни ключове — Θ(n)), на място, не е стабилно." },
    "сортиране на място": { cat: "Методи", t: "Сортиране на място", en: "In-place sort", d: "Използва O(1) (или O(log n) за стека) допълнителна памет освен входния масив.", more: "Merge Sort върху масив не е на място — нужен е буфер Θ(n)." },
    "долна граница за сортиране": { cat: "Сложност", t: "Долна граница Ω(n log n)", en: "Comparison-sort lower bound", d: "Всеки алгоритъм, който сортира само чрез сравнения, прави Ω(n log n) сравнения в най-лошия случай.", more: "Дървото на решенията трябва да различи n! наредби ⇒ височина ≥ log₂ n! = Θ(n log n). Не забранява counting sort при допълнителни предпоставки за ключовете." },
    "counting sort": { cat: "Методи", t: "Сортиране чрез броене", en: "Counting sort", d: "Брои срещанията на всеки ключ от малък целочислен диапазон [0, k) и възстановява реда без сравнения.", more: "Извън конспекта. Θ(n + k) — не противоречи на Ω(n log n), защото не сортира чрез сравнения." },
  });

  /* ---------- общи данни ---------- */
  const ALG = ["selection", "bubble", "insertion", "merge", "quick", "heap"];
  const NAME = { selection: "пряк избор", bubble: "мехурче", insertion: "вмъкване", merge: "сливане", quick: "бързо", heap: "пирамидално" };
  const PROPS = {
    selection: { stable: false, inplace: "да", worst: "Θ(n²)", avg: "Θ(n²)", best: "Θ(n²)", g: "сортиране чрез пряк избор" },
    bubble: { stable: true, inplace: "да", worst: "Θ(n²)", avg: "Θ(n²)", best: "Θ(n)", g: "метод на мехурчето" },
    insertion: { stable: true, inplace: "да", worst: "Θ(n²)", avg: "Θ(n²)", best: "Θ(n)", g: "сортиране чрез вмъкване", tag: "намаляване на размера" },
    merge: { stable: true, inplace: "не — Θ(n) буфер", worst: "Θ(n log n)", avg: "Θ(n log n)", best: "Θ(n log n)", g: "merge sort", tag: "разделяй и владей" },
    quick: { stable: false, inplace: "да (+ стек)", worst: "Θ(n²)", avg: "Θ(n log n)", best: "Θ(n log n)", g: "quick sort", tag: "разделяй и владей" },
    heap: { stable: false, inplace: "да", worst: "Θ(n log n)", avg: "Θ(n log n)", best: "Θ(n log n) (Θ(n) при всички равни ключове)", g: "пирамидално сортиране", extra: true },
  };
  const TYPES = [["0", "случаен"], ["1", "сортиран"], ["2", "обратно сортиран"], ["3", "почти сортиран"], ["4", "много повторения"], ["5", "собствен"]];

  /** генератор на входове — същият LCG като в C */
  function gen(n, type, seed) {
    let s = seed >>> 0;
    const rnd = (m) => { s = (Math.imul(s, 1103515245) + 12345) >>> 0; return (s & 0x7fffffff) % m; };
    const a = [];
    for (let i = 0; i < n; i++) {
      let v;
      if (type === 1 || type === 3) v = i + 1;
      else if (type === 2) v = n - i;
      else if (type === 4) v = 1 + rnd(5);
      else v = 1 + rnd(n * 3);
      a.push({ key: v, id: i });
    }
    if (type === 3) for (let t = 0; t < Math.max(Math.floor(n / 10), 1); t++) { const x = rnd(n), y = rnd(n); const tt = a[x]; a[x] = a[y]; a[y] = tt; }
    return a;
  }

  /* ---------- алгоритмите: един код за стъпки и за състезание ---------- */
  // c: {cmp, swp, wr, less(x,y), swap(i,j), fr(at, o)}
  const SORT = {
    selection(a, c) {
      const n = a.length;
      for (let i = 0; i < n - 1; i++) {
        c.fr("outer", { act: [i], done: [0, i], vars: { i }, msg: `Проход i = ${i}: търсим минимума в a[${i}..${n - 1}] и го поставяме на позиция ${i}.` });
        let m = i;
        c.fr("minit", { act: [i], piv: [m], done: [0, i], vars: { i, m } });
        for (let j = i + 1; j < n; j++) {
          const l = c.less(a[j], a[m]);
          c.fr("cmp", { cmp: [j, m], piv: [m], done: [0, i], vars: { i, j, m }, msg: `a[${j}] = ${a[j].key} &lt; a[m] = ${a[m].key}? <b>${l}</b>` });
          if (l) { m = j; c.fr("newmin", { piv: [m], done: [0, i], vars: { i, j, m }, msg: `Нов минимум: m = ${m} (стойност ${a[m].key}).` }); }
        }
        c.fr("test", { act: [i], piv: [m], done: [0, i], vars: { i, m }, msg: m !== i ? `Минимумът ${a[m].key} е на позиция ${m} ≠ ${i} → размяна.` : `Минимумът вече е на позиция ${i} — без размяна.` });
        if (m !== i) { c.swap(i, m); c.fr("swap", { sw: [i, m], done: [0, i + 1], vars: { i, m }, log: `swap(a[${i}], a[${m}])` }); }
      }
      c.fr("outer", { done: [0, n], vars: {}, msg: "Готово.", fin: true });
    },
    bubble(a, c) {
      const n = a.length;
      let end = n - 1;
      for (; end > 0; end--) {
        c.fr("outer", { done: [end + 1, n], vars: { end }, msg: `Проход до позиция ${end}: най-големият от a[0..${end}] ще „изплува“ в a[${end}].` });
        let swapped = 0;
        c.fr("flag", { done: [end + 1, n], vars: { end, swapped } });
        for (let j = 0; j < end; j++) {
          const l = c.less(a[j + 1], a[j]);
          c.fr("cmp", { cmp: [j, j + 1], done: [end + 1, n], vars: { end, j, swapped }, msg: `a[${j + 1}] = ${a[j + 1].key} &lt; a[${j}] = ${a[j].key}? <b>${l}</b>${l ? "" : " (равните НЕ се разменят — стабилност)"}` });
          if (l) { c.swap(j, j + 1); swapped = 1; c.fr("swap", { sw: [j, j + 1], done: [end + 1, n], vars: { end, j, swapped } }); }
        }
        c.fr("early", { done: [end, n], vars: { end, swapped }, msg: swapped ? `Имаше размени — продължаваме.` : `<b>Нито една размяна</b> в прохода ⇒ масивът е сортиран, спираме рано.`, log: `проход ${n - 1 - end + 1}: ${swapped ? "с размени" : "без размени"}` });
        if (!swapped) { c.fr("stop", { done: [0, n], vars: { end }, msg: `Ранно спиране след ${n - end} прохода.`, fin: true }); return; }
      }
      c.fr("outer", { done: [0, n], vars: { end }, msg: "Готово.", fin: true });
    },
    insertion(a, c) {
      const n = a.length;
      for (let i = 1; i < n; i++) {
        c.fr("outer", { sorted: [0, i], act: [i], vars: { i }, msg: `a[0..${i - 1}] е подредено (по-малката задача). Вмъкваме a[${i}] = ${a[i].key} — <dfn data-g="намаляване на размера">намаляване на размера</dfn>.` });
        const x = a[i];
        let j = i - 1;
        c.fr("take", { sorted: [0, i], hole: i, vars: { i, x: x.key, j } });
        while (true) {
          if (!(j >= 0)) break;
          const l = c.less(x, a[j]);
          c.fr("cmp", { sorted: [0, i + 1], hole: j + 1, cmp: [j], vars: { i, x: x.key, j }, msg: `x = ${x.key} &lt; a[${j}] = ${a[j].key}? <b>${l}</b>${l ? " → изместваме a[" + j + "] надясно." : " → мястото е намерено."}` });
          if (!l) break;
          a[j + 1] = a[j]; c.wr++;
          c.fr("shift", { sorted: [0, i + 1], hole: j, sw: [j + 1], vars: { i, x: x.key, j } });
          j--;
        }
        a[j + 1] = x; c.wr++;
        c.fr("put", { sorted: [0, i + 1], act: [j + 1], vars: { i, x: x.key, j }, msg: `Поставяме x = ${x.key} на позиция ${j + 1}.`, log: `вмъкнат ${x.key} на поз. ${j + 1}` });
      }
      c.fr("outer", { done: [0, n], vars: {}, msg: "Готово.", fin: true });
    },
    merge(a, c) {
      const n = a.length, tmp = new Array(n);
      const rec = (lo, hi) => {
        if (hi - lo < 2) { c.fr("base", { rng: [lo, hi], vars: { lo, hi } }); return; }
        const mid = lo + ((hi - lo) >> 1);
        c.fr("split", { rng: [lo, hi], vars: { lo, mid, hi }, msg: `Разделяне [${lo}, ${hi}) → [${lo}, ${mid}) и [${mid}, ${hi}).` });
        rec(lo, mid); rec(mid, hi);
        let i = lo, j = mid, k = lo;
        c.fr("minit", { rng: [lo, hi], gap: mid, vars: { lo, mid, hi, i, j, k }, msg: `Сливане на [${lo}, ${mid}) и [${mid}, ${hi}).` });
        while (i < mid && j < hi) {
          const takeL = !c.less(a[j], a[i]);
          c.fr("cmp", { rng: [lo, hi], gap: mid, cmp: [i, j], vars: { lo, mid, hi, i, j, k }, msg: `a[${i}] = ${a[i].key} ≤ a[${j}] = ${a[j].key}? <b>${takeL}</b>${a[i].key === a[j].key ? " — при равенство взимаме от ЛЯВАТА: стабилност." : ""}` });
          if (takeL) tmp[k++] = a[i++]; else tmp[k++] = a[j++];
          c.wr++;
          c.fr(takeL ? "takeL" : "takeR", { rng: [lo, hi], gap: mid, vars: { lo, mid, hi, i, j, k }, log: `tmp[${k - 1}] = ${tmp[k - 1].key}` });
        }
        while (i < mid) { tmp[k++] = a[i++]; c.wr++; }
        while (j < hi) { tmp[k++] = a[j++]; c.wr++; }
        c.fr("rest", { rng: [lo, hi], gap: mid, vars: { lo, mid, hi, i, j, k }, msg: `Копираме остатъка в tmp.` });
        for (k = lo; k < hi; k++) { a[k] = tmp[k]; c.wr++; }
        c.fr("back", { rng: [lo, hi], sortedR: [lo, hi], vars: { lo, hi }, msg: `tmp[${lo}..${hi}) → a: подмасивът е сортиран.` });
      };
      rec(0, n);
      c.fr("back", { done: [0, n], vars: {}, msg: "Готово.", fin: true });
    },
    quick(a, c) {
      const fixed = [];
      const rec = (lo, hi) => {
        if (lo >= hi) { if (lo === hi) { fixed.push(lo); c.fr("base", { fixed: fixed.slice(), rng: [lo, hi + 1], vars: { lo, hi } }); } return; }
        const mid = lo + ((hi - lo) >> 1);
        c.swap(mid, hi);
        c.fr("pivot", { fixed: fixed.slice(), rng: [lo, hi + 1], piv: [hi], sw: [mid, hi], vars: { lo, hi, mid }, msg: `Опорен — средният a[${mid}] = ${a[hi].key}, преместен в края (a[${hi}]).` });
        let i = lo;
        for (let j = lo; j < hi; j++) {
          const le = !c.less(a[hi], a[j]);
          c.fr("cmp", { fixed: fixed.slice(), rng: [lo, hi + 1], piv: [hi], cmp: [j], ptr: { i, j }, vars: { lo, hi, i, j }, msg: `a[${j}] = ${a[j].key} ≤ pivot = ${a[hi].key}? <b>${le}</b>` });
          if (le) { c.swap(i, j); c.fr("swap", { fixed: fixed.slice(), rng: [lo, hi + 1], piv: [hi], sw: [i, j], ptr: { i, j }, vars: { lo, hi, i, j } }); i++; }
        }
        c.swap(i, hi);
        fixed.push(i);
        c.fr("place", { fixed: fixed.slice(), rng: [lo, hi + 1], piv: [i], vars: { lo, hi, p: i }, msg: `Опорният ${a[i].key} е на окончателното си място ${i} (${i - lo} : ${hi - i}).`, log: `[${lo}..${hi}] → pivot на ${i}` });
        rec(lo, i - 1); rec(i + 1, hi);
      };
      rec(0, a.length - 1);
      c.fr("place", { done: [0, a.length], vars: {}, msg: "Готово.", fin: true });
    },
    heap(a, c) {
      const n = a.length;
      const sift = (k, m, phase) => {
        for (;;) {
          let ch = 2 * k + 1;
          c.fr("child", { heap: m, act: [k], cmp: ch < m ? [ch] : [], vars: { k, c: ch, n: m }, msg: `${phase}: sift_down от ${k}; ляво дете ${ch}${ch >= m ? " — извън пирамидата, край." : "."}` });
          if (ch >= m) return;
          if (ch + 1 < m) {
            const l = c.less(a[ch], a[ch + 1]);
            if (l) ch++;
            c.fr("cmp2", { heap: m, act: [k], cmp: [ch], vars: { k, c: ch, n: m }, msg: `По-голямото дете: a[${ch}] = ${a[ch].key}.` });
          }
          const ok = !c.less(a[k], a[ch]);
          c.fr("cmp", { heap: m, act: [k], cmp: [ch], vars: { k, c: ch, n: m }, msg: `a[${k}] = ${a[k].key} ≥ a[${ch}] = ${a[ch].key}? <b>${ok}</b>${ok ? " — свойството на пирамидата е възстановено." : ""}` });
          if (ok) return;
          c.swap(k, ch);
          c.fr("swap", { heap: m, sw: [k, ch], vars: { k, c: ch, n: m } });
          k = ch;
        }
      };
      for (let k = (n >> 1) - 1; k >= 0; k--) { c.fr("build", { heap: n, act: [k], vars: { k }, msg: `Изграждане на max-пирамида: възел ${k}.` }); sift(k, n, "изграждане"); }
      for (let end = n - 1; end > 0; end--) {
        c.fr("extract", { heap: end + 1, vars: { end }, msg: `Максимумът a[0] = ${a[0].key} отива в края a[${end}].` });
        c.swap(0, end);
        c.fr("top", { heap: end, sw: [0, end], vars: { end }, log: `max ${a[end].key} → поз. ${end}` });

      }
      c.fr("extract", { done: [0, n], vars: {}, msg: "Готово.", fin: true });

  function run(name, items, rec, maxFrames = 6000) {
    const a = items.map((o) => ({ key: o.key, id: o.id }));
    const F = [];
    const c = { cmp: 0, swp: 0, wr: 0 };
    c.less = (x, y) => { c.cmp++; return x.key < y.key; };
    c.swap = (i, j) => { const t = a[i]; a[i] = a[j]; a[j] = t; c.swp++; c.wr += 2; };
    c.fr = rec ? (at, o) => {

      F.push(Object.assign({ at, keys: a.map((x) => x.key), ids: a.map((x) => x.id), stats: { сравнения: c.cmp, размени: c.swp, записи: c.wr } }, o));
    } : () => {};
    SORT[name](a, c);
    return { frames: F, a, cmp: c.cmp, swp: c.swp, wr: c.wr, keys: a.map((x) => x.key).join(" "), ids: a.map((x) => x.id).join(" ") };
  }

      return v.map((k, i) => ({ key: k, id: i }));
    }
    n = S.int(n, 1, maxN, "n");
    seed = S.int(seed, 0, 2 ** 31 - 1, "seed");
    return gen(n, t, seed);
  }

  const algos = {
    gen, run,
    /** a) стъпков визуализатор */
    sort_steps(inp) {
      const name = ALG.includes(inp.algo) ? inp.algo : "selection";

    (f.piv || []).forEach((k) => (cls[k] = "s-piv"));
    (f.cmp || []).forEach((k) => (cls[k] = "s-cmp"));

    const sgo = () => {
      sout.innerHTML = "";
      let R;
      try { R = algos.stability({ arr: fA.value }); } catch (e) { sout.append(h("p", { class: "warn", text: "Грешка във входа: " + e.message })); return; }
      const tb = h("table", { class: "t grid" });
      tb.append(h("tr", null, h("th", { text: "вход" }), ...R.items.map((x) => h("td", { text: x.lab })), h("th", { text: "" })));
      R.res.forEach((r) => {
        const bad = new Set();
        for (let k = 1; k < r.ids.length; k++) if (R.items[r.ids[k - 1]].key === R.items[r.ids[k]].key && r.ids[k - 1] > r.ids[k]) { bad.add(k - 1); bad.add(k); }
        tb.append(h("tr", null, h("th", { text: NAME[r.name] }), ...r.out.map((lab, k) => h("td", { class: bad.has(k) ? "s-swap" : "", text: lab })),
          h("td", null, h("span", { class: "pill " + (r.stable ? "s-done" : "s-swap"), text: r.stable ? "редът запазен" : "редът нарушен" }))));
      });
      sout.append(h("div", { class: "tbl-wrap" }, tb), h("p", { class: "muted", style: { marginTop: "8px", fontSize: ".85rem" }, text: "„Редът запазен“ се отнася само за този вход; гаранцията (стабилен / не) е в пилюлите на визуализатора горе." }));
    };
    fA.addEventListener("keydown", (e) => { if (e.key === "Enter") sgo(); });
    sin.append(h("label", { class: "field", for: "s7-a" }, h("span", { text: "ключове с етикет (5a 5b …)" }), fA), h("button", { class: "btn primary", text: "Изпълни", onclick: sgo }),
      h("button", { class: "btn ghost", text: "много равни", onclick: () => { fA.value = "2a 1a 2b 1b 2c 1c 2d 1d"; sgo(); } }));
    sgo();
    root.querySelector("#s7-code").append(h("p", { class: "muted", style: { marginBottom: "6px" }, html: "Сливането — подсветен е редът, от който зависи стабилността:" }));
    S.codeView(root.querySelector("#s7-code"), "ch07_merge", "cmp");

  }

  S.chapter({ id: "sortirovki", order: 7, num: "7", group: "Задължителни парадигми", title: "Лаборатория за сортиране", lead: "Шест метода върху един и същ вход: пряк избор, мехурче, вмъкване (намаляване на размера), сливане и бързо (разделяй и владей), пирамидално. Броячи, които съвпадат с C, състезание n² срещу n log n и стабилност.", html, mount, algos });
})();

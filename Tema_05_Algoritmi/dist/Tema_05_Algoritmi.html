 "ch08_iv_end": {
  "file": "08_greedy.c",
  "code": "/* Оптимален алчен избор: сортираме по нарастващ край и вземаме\n   всеки интервал, чието начало е >= края на последния избран. */\nstatic int cmp_end(const void *pa, const void *pb)\n{\n    const Interval *a = pa, *b = pb;\n    if (a->e != b->e) return a->e < b->e ? -1 : 1;\n    return a->id - b->id;\n}\n\nint select_by_end(const Interval in[], int n, int chosen[])\n{\n    Interval v[MAXN];\n    memcpy(v, in, (size_t)n * sizeof v[0]);\n    qsort(v, (size_t)n, sizeof v[0], cmp_end);\n    int m = 0;\n    int last_end = INT_MIN;\n    for (int i = 0; i < n; i++) {\n        if (v[i].s < last_end)\n            continue;        /* пресича последния */\n        chosen[m++] = v[i].id;\n        last_end = v[i].e;\n    }\n    return m;\n}",

 "ch08_iv_key": {
  "file": "08_greedy.c",
  "code": "/* Общ шаблон „сортирай по ключ, вземи всичко съвместимо“.\n   Ключът е стратегията: начало, дължина или брой конфликти.\n   Без сортиране по край трябва да се проверяват ВСИЧКИ избрани. */\nint select_by_key(const Interval in[], int n, int strategy, int chosen[])\n{\n    Interval v[MAXN];\n    for (int i = 0; i < n; i++) {\n        v[i] = in[i];\n        if (strategy == BY_START)      v[i].key = in[i].s;\n        else if (strategy == BY_LEN)   v[i].key = in[i].e - in[i].s;\n        else if (strategy == BY_CONFLICTS) {\n            v[i].key = 0;\n            for (int j = 0; j < n; j++)\n                if (j != i && overlap(&in[i], &in[j])) v[i].key++;\n        } else                         v[i].key = in[i].e;\n    }\n    qsort(v, (size_t)n, sizeof v[0], cmp_key);\n    int m = 0;\n    for (int i = 0; i < n; i++) {\n        bool ok = true;\n        for (int j = 0; j < m && ok; j++)\n            if (overlap(&v[i], &in[chosen[j]])) ok = false;\n        if (!ok)\n            continue;\n        chosen[m++] = v[i].id;\n    }\n    return m;\n}",

 "ch08_coins_greedy": {
  "file": "08_greedy.c",
  "code": "/* d[0] < d[1] < ... < d[k-1]. Алчно: всеки път най-голямата\n   монета, която още се побира. Връща броя монети или -1. */\nint coins_greedy(const int d[], int k, int amount, int used[])\n{\n    int cnt = 0;\n    for (int i = k - 1; i >= 0; i--) {\n        while (amount >= d[i]) {\n            amount -= d[i];\n            used[cnt++] = d[i];\n        }\n    }\n    return amount == 0 ? cnt : -1;  /* -1: остатъкът не може да се плати */\n}",

 "ch08_dijkstra": {
  "file": "08_greedy.c",
  "code": "/* Дейкстра, O(V^2): всеки път най-близкият непосетен връх.\n   Коректен само при НЕОТРИЦАТЕЛНИ тегла. */\nvoid dijkstra(const int w[V][V], int src, int dist[V], int prev[V])\n{\n    bool visited[V];\n    for (int v = 0; v < V; v++) {\n        dist[v] = INF; prev[v] = -1; visited[v] = false;\n    }\n    dist[src] = 0;\n    for (int it = 0; it < V; it++) {\n        int u = -1;\n        for (int v = 0; v < V; v++)\n            if (!visited[v] && (u < 0 || dist[v] < dist[u])) u = v;\n        if (dist[u] == INF) break;  /* останалите са недостижими */\n        visited[u] = true;          /* dist[u] се смята за окончателно */\n        for (int v = 0; v < V; v++)\n            if (w[u][v] != NOEDGE && !visited[v] && dist[u] + w[u][v] < dist[v]) {\n                dist[v] = dist[u] + w[u][v];\n                prev[v] = u;\n            }\n    }\n}",

  "code": "/* D[i][c] — максимална стойност от първите i предмета\n   при вместимост c. Всеки предмет — най-много веднъж. */\nint knapsack(const int w[], const int v[], int n, int W)\n{\n    for (int c = 0; c <= W; c++)\n        D[0][c] = 0;\n    for (int i = 1; i <= n; i++)\n        for (int c = 0; c <= W; c++) {\n            D[i][c] = D[i - 1][c];      /* не взимаме i */\n            if (w[i - 1] <= c) {\n                int take = v[i - 1] + D[i - 1][c - w[i - 1]];\n                if (take > D[i][c])\n                    D[i][c] = take;\n            }\n        }\n    return D[n][W];\n}\n\n/* Обратно проследяване: кои предмети са взети */\nint knapsack_items(const int w[], int n, int W, int taken[])\n{\n    int m = 0, c = W;\n    for (int i = n; i >= 1; i--)\n        if (D[i][c] != D[i - 1][c]) {   /* i е взет */\n            taken[m++] = i;\n            c -= w[i - 1];\n        }\n    return m;\n}",

  "file": "09_dp.c",
  "code": "/* Едномерен масив: dp[c] е редът D(i, c) „на място“.\n   down = 1: c надолу — всеки предмет най-много веднъж (0/1);\n   down = 0: c нагоре — dp[c - w] вече съдържа предмет i,\n             т.е. той се ползва многократно (неограничена раница). */\nint knapsack_1d(const int w[], const int v[], int n, int W, int down)\n{\n    int dp[MAXW + 1];\n    for (int c = 0; c <= W; c++) dp[c] = 0;\n    for (int i = 0; i < n; i++) {\n        if (down) {\n            for (int c = W; c >= w[i]; c--)\n                if (v[i] + dp[c - w[i]] > dp[c])\n                    dp[c] = v[i] + dp[c - w[i]];\n        } else {\n            for (int c = w[i]; c <= W; c++)\n                if (v[i] + dp[c - w[i]] > dp[c])\n                    dp[c] = v[i] + dp[c - w[i]];\n        }\n    }\n    return dp[W];\n}",

  "code": "/* N дами: col[r] = колоната на дамата в ред r. */\nstatic int N, col[MAXN];\nstatic long placed, pruned, solutions;\nstatic int first_only, stop;\n\n/* Ред на дамата, която атакува клетка (row, c), или -1. */\nstatic int attacker(int row, int c)\n{\n    for (int r = 0; r < row; r++)\n        if (col[r] == c || abs(col[r] - c) == row - r)\n            return r;            /* същата колона или диагонал */\n    return -1;\n}\n\nstatic void place(int row)\n{\n    if (row == N) {\n        solutions++;\n        if (first_only) stop = 1;\n        return;\n    }\n    for (int c = 0; c < N && !stop; c++) {\n        if (attacker(row, c) >= 0) {\n            pruned++;      /* отрязан клон */\n            continue;\n        }\n        col[row] = c; placed++;\n        place(row + 1);\n        col[row] = -1;     /* връщане назад */\n    }\n}",

 "ch10_fermat": {
  "file": "10_more.c",
  "code": "/* Модулно степенуване: a^e mod m за O(log e) умножения. m < 2^32. */\nuint64_t powmod(uint64_t a, uint64_t e, uint64_t m)\n{\n    uint64_t r = 1 % m;\n    a %= m;\n    while (e > 0) {\n        if (e & 1) r = r * a % m;\n        a = a * a % m;\n        e >>= 1;\n    }\n    return r;\n}\n\n/* Тест на Ферма: 0 = сигурно съставно, 1 = \"вероятно просто\". */\nint fermat(uint64_t n, const uint64_t base[], int k)\n{\n    for (int i = 0; i < k; i++) {\n        uint64_t a = base[i];\n        if (powmod(a, n - 1, n) != 1)\n            return 0;      /* a е свидетел */\n    }\n    return 1;              /* грешка е възможна */\n}",

  "code": "/* Милър–Рабин: n - 1 = d * 2^s, d нечетно.  (powmod — виж теста на Ферма) */\nint miller_rabin(uint64_t n, const uint64_t base[], int k)\n{\n    uint64_t d = n - 1; int s = 0;\n    while ((d & 1) == 0) { d >>= 1; s++; }\n    for (int i = 0; i < k; i++) {\n        uint64_t x = powmod(base[i], d, n);\n        if (x == 1 || x == n - 1) continue;\n        int r;\n        for (r = 1; r < s; r++) {\n            x = x * x % n;\n            if (x == n - 1) break;\n        }\n        if (r == s) return 0;   /* свидетел */\n    }\n    return 1;                   /* вероятно просто */\n}",

 "ch10_mitm": {
  "file": "10_more.c",
  "code": "typedef struct { long sum; unsigned mask; } Item;\n\nstatic int by_sum(const void *p, const void *q)\n{\n    const Item *a = p, *b = q;\n    if (a->sum != b->sum) return a->sum < b->sum ? -1 : 1;\n    return a->mask < b->mask ? -1 : a->mask > b->mask;\n}\n\n/* Има ли подмножество на x[0..n-1] със сума T? */\nint mitm(const long x[], int n, long T, unsigned *ma, unsigned *mb, long *probes)\n{\n    int h = n / 2, m = n - h, na = 1 << h, nb = 1 << m, ok = 0;\n    Item *A = malloc(sizeof *A * (size_t)na), *B = malloc(sizeof *B * (size_t)nb);\n    if (!A || !B) { free(A); free(B); return -1; }\n    for (int s = 0; s < na; s++) {                   /* суми на лявата половина */\n        A[s].sum = 0; A[s].mask = (unsigned)s;\n        for (int i = 0; i < h; i++) if (s >> i & 1) A[s].sum += x[i];\n    }\n    for (int s = 0; s < nb; s++) {                   /* суми на дясната половина */\n        B[s].sum = 0; B[s].mask = (unsigned)s;\n        for (int i = 0; i < m; i++) if (s >> i & 1) B[s].sum += x[h + i];\n    }\n    qsort(B, (size_t)nb, sizeof *B, by_sum);\n    for (int s = 0; s < na && !ok; s++) {\n        long need = T - A[s].sum;\n        int lo = 0, hi = nb;                         /* двоично търсене */\n        while (lo < hi) {\n            int mid = (lo + hi) / 2; ++*probes;\n            if (B[mid].sum < need) lo = mid + 1; else hi = mid;\n        }\n        if (lo < nb && B[lo].sum == need) {\n            *ma = A[s].mask; *mb = B[lo].mask; ok = 1;\n        }\n    }\n    free(A); free(B);\n    return ok;\n}",

<script>
/* Раздел 1 — Понятие за алгоритъм, свойства, коректност. */
(function () {
  const S = window.Study, h = S.h;

  /* ---------- чисти функции: генерират стъпките (тестват се и в node) ---------- */
  const algos = {
    linear_search({ arr, key }) {
      const a = S.parseNums(arr, { minLen: 0, maxLen: 20 });
      key = S.int(key, -1e6, 1e6, "Търсеното");
      const n = a.length, F = [];
      let cmp = 0;
      const inv = (i) => ({ text: i === 0 ? `key=${key} не е в a[0..−1] (празно — вярно тривиално)` : `key=${key} не е в a[0..${i - 1}]`, ok: !a.slice(0, i).includes(key) });
      F.push({ at: "enter", vars: { n, key }, msg: `Влизаме в <code>linear_search</code> с n = ${n}.`, a, i: -1, log: `вход n=${n}, key=${key}` });
      for (let i = 0; i < n; i++) {
        F.push({ at: "loop", vars: { n, key, i }, a, i, msg: `Проверка на условието <code>i &lt; n</code>: ${i} &lt; ${n} — вярно, продължаваме.`, inv: inv(i), stats: { сравнения: cmp } });
        cmp++;
        const hit = a[i] === key;
        F.push({ at: "cmp", vars: { n, key, i, "a[i]": a[i] }, a, i, cmp: true, hit, msg: `Сравняваме <code>a[${i}] == key</code>: ${a[i]} == ${key} → <b>${hit}</b>.`, inv: inv(i), stats: { сравнения: cmp }, log: `a[${i}]=${a[i]} ${hit ? "==" : "≠"} ${key}` });
        if (hit) {
          F.push({ at: "found", vars: { n, key, i, return: i }, a, i, hit: true, done: true, msg: `Намерено на индекс <b>${i}</b>. Връщаме ${i}. Направени са ${cmp} сравнения.`, stats: { сравнения: cmp }, log: `return ${i}` , result: i});
          return { frames: F, result: i, cmp };
        }
      }
      F.push({ at: "loop", vars: { n, key, i: n }, a, i: n, msg: `Условието <code>i &lt; n</code> е невярно (${n} &lt; ${n}). Цикълът свършва.`, inv: inv(n), stats: { сравнения: cmp } });
      F.push({ at: "notfound", vars: { n, key, return: -1 }, a, i: n, done: true, msg: `Инвариантът при i = n гласи: key не е в целия масив. Затова <b>−1</b> е правилен отговор — отрицателният отговор също е резултат.`, inv: inv(n), stats: { сравнения: cmp }, log: "return -1", result: -1 });
      return { frames: F, result: -1, cmp };
    },

    gcd_euclid({ a, b }) {
      a = S.int(a, 0, 1e9, "a"); b = S.int(b, 0, 1e9, "b");
      const g = (x, y) => { while (y) [x, y] = [y, x % y]; return x; };
      const G = g(a, b), F = [], rows = [];
      let it = 0;
      const inv = (x, y) => ({ text: `НОД(${x}, ${y}) = ${g(x, y)} = НОД(a₀, b₀)`, ok: g(x, y) === G });
      F.push({ at: "enter", vars: { a, b }, rows: [], cur: [a, b], msg: `Начално състояние (a, b) = (${a}, ${b}).`, inv: inv(a, b), log: `(${a}, ${b})` });
      while (true) {
        F.push({ at: "cond", vars: { a, b }, rows: rows.slice(), cur: [a, b], msg: `<code>b != 0</code>? ${b} != 0 → <b>${b !== 0}</b>.${b ? "" : " Цикълът свършва."}`, inv: inv(a, b), stats: { итерации: it } });
        if (b === 0) break;
        const r = a % b;
        F.push({ at: "mod", vars: { a, b, r }, rows: rows.slice(), cur: [a, b], r, msg: `r = a mod b = ${a} mod ${b} = <b>${r}</b>. Остатъкът е строго по-малък от b — рангът намалява.`, inv: inv(a, b), stats: { итерации: it } });
        rows.push([a, b, r]);
        a = b; b = r; it++;
        F.push({ at: "shift", vars: { a, b, r }, rows: rows.slice(), cur: [a, b], msg: `Ново състояние (a, b) = (${a}, ${b}). Общите делители са същите, защото всеки общ делител на a и b дели и a − q·b.`, inv: inv(a, b), stats: { итерации: it }, log: `(${a}, ${b})` });
      }
      F.push({ at: "ret", vars: { a, b, return: a }, rows: rows.slice(), cur: [a, b], done: true, msg: `b = 0, следователно НОД = a = <b>${a}</b>. Инвариантът + b = 0 дават резултата: НОД(a, 0) = a.`, inv: inv(a, b), stats: { итерации: it }, log: `return ${a}` });
      return { frames: F, result: a, it };
    },

    is_even_partial({ x, cap }) {
      let v = S.int(x, -50, 50, "x");
      cap = S.int(cap, 5, 200, "Лимит");
      const x0 = v, F = [];
      F.push({ at: "enter", vars: { x: v }, x: v, x0, msg: `Вход x = ${v}.`, log: `x = ${v}` });
      let k = 0;
      while (true) {
        F.push({ at: "cond", vars: { x: v }, x: v, x0, msg: `<code>x != 0</code>? ${v} != 0 → <b>${v !== 0}</b>.`, stats: { стъпки: k } });
        if (v === 0) break;
        if (k >= cap) {
          F.push({ at: "cond", vars: { x: v }, x: v, x0, stuck: true, msg: `Лимитът от ${cap} стъпки е изчерпан. x вече е ${v} и само намалява — <b>никога</b> няма да стане 0. Програмата не завършва ⇒ няма <dfn data-g="пълна коректност">пълна коректност</dfn>.`, stats: { стъпки: k }, inv: { text: "Частична коректност: ако беше спряла, отговорът „четно“ щеше да е верен", ok: true } });
          return { frames: F, halted: false };
        }
        v -= 2; k++;
        F.push({ at: "step", vars: { x: v }, x: v, x0, msg: `x = x − 2 → ${v}.`, stats: { стъпки: k }, log: `x = ${v}` });
      }
      F.push({ at: "ret", vars: { x: v, return: 1 }, x: v, x0, done: true, msg: `Спря след ${k} стъпки и върна „четно“ — вярно за x = ${x0}.`, stats: { стъпки: k }, inv: { text: "Спряла ⇒ резултатът е верен (частична коректност)", ok: true } });
      return { frames: F, halted: true };
    },
  };

  <p class="prose">Доказателствата използват <dfn data-g="инвариант на цикъл">инвариант на цикъла</dfn> (за верността) и <dfn data-g="рангова функция">рангова функция</dfn> (за завършването). Трите стъпки за инвариант: <b>инициализация</b> (вярно преди първата итерация), <b>запазване</b> (ако е вярно преди итерация, остава вярно след нея), <b>завършване</b> (при излизане от цикъла инвариантът + условието за изход дават резултата).</p>
  <div id="v-linear"></div>
  <details class="hint"><summary>Хинт: как да кажеш инварианта на линейното търсене на изпита</summary><div>
    <p>„Преди проверката на позиция i търсеният елемент не е открит сред позициите 0..i−1.“ При i = 0 това е празно множество — тривиално вярно (инициализация). Ако a[i] ≠ key, преминаваме към i+1 и твърдението остава вярно (запазване). При i = n: елементът не е в целия масив ⇒ връщаме −1 (завършване).</p>

</div>`;

  const LEVELS = [
    { k: "Задача", q: "Какво се търси?", ex: "„Подреди n числа в ненамаляващ ред.“ Спецификация: изходът е пермутация на входа и a[i] ≤ a[i+1].", note: "Задачата има много алгоритми. Класовете P и NP се отнасят до задачи." },
    { k: "Алгоритъм", q: "Как се намира?", ex: "Merge Sort: раздели наполовина, сортирай всяка половина, слей. Θ(n log n).", note: "Един алгоритъм има много програми. Сложността O/Ω/Θ се изследва за алгоритми." },
    { k: "Програма", q: "Как е реализиран?", ex: "Функция <code>merge_sort(int *a, int n)</code> на C, компилирана с gcc за ARM Cortex-M.", note: "Езикът и платформата са ниво на реализация — не променят класа на задачата." },

  function mount(root) {

      code: "gcd_euclid",

      presets: [{ label: "1071, 462", values: { a: 1071, b: 462 } }, { label: "Фибоначи 89, 55", values: { a: 89, b: 55 }, title: "Най-лошият случай: съседни числа на Фибоначи" }, { label: "a < b", values: { a: 18, b: 84 } }],

      code: "is_even_partial",
      inputs: [{ id: "x", label: "x", type: "number", value: 6, width: "6em" }, { id: "cap", label: "лимит стъпки", type: "number", value: 12, width: "6em" }],
      presets: [{ label: "x = 7 (нечетно)", values: { x: 7 } }, { label: "x = −4", values: { x: -4 } }],
      build: algos.is_even_partial,

        const lo = Math.min(f.x0, f.x, -12), hi = Math.max(f.x0, 2);
        const W = 640, H = 70, sx = (v) => 20 + ((v - lo) / (hi - lo || 1)) * (W - 40);
        const svg = S.svg("svg", { class: "g", viewBox: `0 0 ${W} ${H}`, width: W });
        svg.append(S.svg("line", { x1: 20, y1: 35, x2: W - 20, y2: 35, class: "edge" }));
        for (let v = Math.ceil(lo); v <= hi; v++) if (v % 2 === 0 || hi - lo < 30) svg.append(S.svg("text", { x: sx(v), y: 62, "text-anchor": "middle", class: "wt", text: v }));
        svg.append(S.svg("g", { class: "node s-done" }, S.svg("circle", { cx: sx(0), cy: 35, r: 7 })));

  S.chapter({ id: "algoritam", order: 1, num: "1", group: "Основа", title: "Алгоритъм, свойства и коректност", lead: "Какво е алгоритъм, кои са шестте свойства и как се доказва, че е правилен и че спира.", html, mount, algos });

<script>
/* Раздел 2 — Изчислимост и разрешимост. */
(function () {
  const S = window.Study, h = S.h;

  Object.assign(window.GLOSSARY, {
    "bfs": { cat: "Изчислимост", t: "Обхождане в ширина (BFS)", en: "Breadth-first search", d: "Обхождане на граф с опашка: първо всички върхове на 1 ребро, после на 2 и т.н.", more: "Върховете се изваждат по нарастващ брой ребра от началото — затова BFS дава най-кратък път в непретеглен граф." },
    "диагонален аргумент": { cat: "Изчислимост", t: "Диагонален аргумент", en: "Diagonal argument", d: "Строи се обект, който се различава от i-тия елемент на списък в i-тата позиция — следователно не е в списъка.", more: "Тюринг го използва, за да покаже, че няма общ алгоритъм за проблема за спирането." },
    "частично рекурсивни функции": { cat: "Изчислимост", t: "Частично рекурсивни функции", en: "Partial recursive functions", d: "Формален модел на изчислимите функции, построен от базови функции чрез композиция, примитивна рекурсия и минимизация.", more: "„Частично“ — функцията може да не е дефинирана (изчислението да не спира) за някои входове." },
    "ламбда-изчисление": { cat: "Изчислимост", t: "Ламбда-изчисление", en: "Lambda calculus", d: "Формален модел на изчисление чрез дефиниране и прилагане на функции (Чърч).", more: "Изчислява същия клас функции като машината на Тюринг." },
    "допълнение на задача": { cat: "Изчислимост", t: "Допълнение на задача", en: "Complement", d: "Задачата със същите входове и разменени отговори „да“ и „не“.", more: "Ако и задачата, и допълнението ѝ са полуразрешими, задачата е разрешима (пускат се двете процедури паралелно)." },
  });

  /* ---------- граф за раздел (а) ---------- */
  const V = "ABCDEFGH".split("");
  const EDGES = ["AB", "AC", "BD", "CD", "CE", "DF", "EF", "EG", "FG"];
  const POS = { A: [50, 130], B: [170, 50], C: [170, 210], D: [310, 50], E: [310, 210], F: [440, 130], G: [550, 210], H: [550, 50] };
  const norm = (e) => (e[0] < e[1] ? e : e[1] + e[0]);
  function parseCut(cut) {
    const out = new Set();
    for (const p of String(cut).toUpperCase().split(/[\s,;]+/).filter(Boolean)) {
      if (!/^[A-H]{2}$/.test(p)) throw new Error(`„${p}“ не е ребро (пиши две букви, напр. DF).`);
      if (!EDGES.includes(norm(p))) throw new Error(`Ребро ${p} не съществува в графа.`);
      out.add(norm(p));
    }
    return out;
  }

  /* ---------- програми за раздел (б) ---------- */
  const PROGS = {
    collatz: { name: "Колац", key: "ch02_collatz", halted: (s) => s === 1, next: (s) => (s % 2 === 0 ? s / 2 : 3 * s + 1), lo: 0, hi: 100000 },
    is_even: { name: "is_even (x −= 2)", key: "ch02_is_even", halted: (s) => s === 0, next: (s) => s - 2, lo: -1000, hi: 1000 },
    countdown: { name: "брояч надолу", key: "ch02_countdown", halted: (s) => s <= 0, next: (s) => s - 1, lo: -1000, hi: 1000 },
    forever: { name: "while(1)", key: "ch02_forever", halted: () => false, next: (s) => s, lo: -1000, hi: 1000 },
  };

  /* ---------- чисти функции ---------- */
  const algos = {
    /* BFS в три формулировки: mode = dec | search | opt */
    bfs({ s, t, cut, mode }) {
      s = String(s).toUpperCase(); t = String(t).toUpperCase();
      if (!V.includes(s) || !V.includes(t)) throw new Error("Началото и краят са букви A…H.");
      const cutSet = parseCut(cut || "");
      if (!["dec", "search", "opt"].includes(mode)) mode = "dec";
      const n = V.length, adj = V.map(() => V.map(() => 0));
      for (const e of EDGES) if (!cutSet.has(e)) { const a = V.indexOf(e[0]), b = V.indexOf(e[1]); adj[a][b] = adj[b][a] = 1; }
      const S0 = V.indexOf(s), T0 = V.indexOf(t);
      const F = [], dist = Array(n).fill(-1), parent = Array(n).fill(-1), queue = [];
      let head = 0, nb = 0;
      const snap = (extra) => Object.assign({ dist: dist.slice(), parent: parent.slice(), queue: queue.slice(head), done: queue.slice(0, head), cut: [...cutSet], s: S0, t: T0, mode, stats: { "извадени": head, "разгледани ребра": nb } }, extra);
      const qs = () => queue.slice(head).map((x) => V[x]).join(" ") || "∅";
      F.push(snap({ at: "init", vars: { s, t }, msg: `Всички <code>dist[v] = -1</code> (непосетени). Въпрос: ${mode === "dec" ? `<b>има ли</b> път от ${s} до ${t}?` : mode === "search" ? `<b>намери</b> път от ${s} до ${t}.` : `<b>най-краткият</b> път от ${s} до ${t} — колко ребра?`}` }));
      dist[S0] = 0; queue.push(S0);
      F.push(snap({ at: "start", vars: { s, t, queue: qs() }, msg: `dist[${s}] = 0, ${s} влиза в опашката.`, log: `start ${s}` }));
      let found = -1;
      while (true) {
        F.push(snap({ at: "loop", vars: { queue: qs() }, msg: `<code>head &lt; tail</code>? Опашка: ${qs()} → <b>${head < queue.length}</b>.` }));
        if (head >= queue.length) break;
        const u = queue[head++];
        if (u === T0) {
          found = dist[u];
          F.push(snap({ at: "found", u, vars: { u: V[u], "dist[u]": dist[u] }, msg: `Изваден е ${V[u]} = t. Намерен на разстояние <b>${dist[u]}</b> ребра.`, log: `deq ${V[u]} = t` }));
          break;
        }
        F.push(snap({ at: "deq", u, vars: { u: V[u], "dist[u]": dist[u], queue: qs() }, msg: `Изваждаме u = ${V[u]} (разстояние ${dist[u]}). Не е t — разглеждаме съседите му.`, log: `deq ${V[u]} (d=${dist[u]})` }));
        for (let v = 0; v < n; v++) {
          if (!adj[u][v]) continue;
          nb++;
          const fresh = dist[v] < 0;
          F.push(snap({ at: "edge", u, v, vars: { u: V[u], v: V[v], "dist[v]": dist[v] }, msg: `Ребро ${V[u]}–${V[v]}: ${fresh ? `${V[v]} е непосетен.` : `${V[v]} вече е посетен (dist = ${dist[v]}) — пропускаме.`}` }));
          if (fresh) {
            dist[v] = dist[u] + 1; parent[v] = u; queue.push(v);
            F.push(snap({ at: "visit", u, v, vars: { u: V[u], v: V[v], "dist[v]": dist[v], queue: qs() }, msg: `dist[${V[v]}] = ${dist[v]}, parent[${V[v]}] = ${V[u]}, ${V[v]} влиза в опашката.`, log: `${V[v]}: d=${dist[v]}, от ${V[u]}` }));
          }
        }
      }
      const reached = dist.map((d, k) => (d >= 0 ? V[k] : null)).filter(Boolean);
      if (found < 0) {
        F.push(snap({ at: "empty", vars: { return: -1 }, msg: `Опашката е празна. Обходени са <b>всички</b> ${reached.length} върха, достижими от ${s}: {${reached.join(", ")}}. ${t} не е сред тях.`, inv: { text: `„няма път“ е ДОКАЗАНО: графът е краен и BFS го изчерпа`, ok: true }, log: "опашката е празна" }));
      }
      let path = [];
      if (found >= 0) for (let v = T0; v !== -1; v = parent[v]) path.unshift(v);
      const P = path.map((x) => V[x]).join(" ");
      if (mode === "dec") {
        F.push(snap({ at: ["dec", found >= 0 ? "found" : "empty"], path, final: true, vars: { return: found >= 0 ? 1 : 0 }, msg: found >= 0 ? `Разпознаване: отговор <b>ДА</b> — има път от ${s} до ${t}.` : `Разпознаване: отговор <b>НЕ</b>. Тук „не“ е доказано, защото изчерпахме крайно пространство. В общия случай „не намерих“ ≠ „не съществува“.`, log: `reachable = ${found >= 0 ? 1 : 0}` }));
      } else if (mode === "search") {
        if (found >= 0) {
          const acc = [];
          for (let v = T0; v !== -1; v = parent[v]) { acc.unshift(v); F.push(snap({ at: "back", path: acc.slice(), vars: { v: V[v], "parent[v]": parent[v] < 0 ? "-1" : V[parent[v]] }, msg: `Връщаме се по parent[]: ${V[v]}${parent[v] >= 0 ? " ← " + V[parent[v]] : " (начало)"}.` })); }
          F.push(snap({ at: "back", path, final: true, vars: { path: P }, msg: `Търсене: намерен път <b>${path.map((x) => V[x]).join(" → ")}</b>. Обектът-отговор е самият път.`, log: `path = ${P}` }));
        } else F.push(snap({ at: "empty", path: [], final: true, vars: { len: 0 }, msg: `Търсене: няма какво да върнем — няма път (доказано от изчерпания BFS).`, log: "path = —" }));
      } else {
        F.push(snap({ at: ["opt", found >= 0 ? "found" : "empty"], path, final: true, vars: { return: found }, msg: found >= 0 ? `Оптимизация: най-краткият път има <b>${found}</b> ребра (${path.map((x) => V[x]).join(" → ")}). BFS вади върховете по нарастващо разстояние, затова първото изваждане на ${t} е минимално.` : `Оптимизация: няма допустим път ⇒ няма и минимум (връщаме −1).`, log: `shortest = ${found}` }));
      }
      return { frames: F, reach: found >= 0 ? 1 : 0, dist: found, path: P || "-" };
    },

    /* симулация с лимит — полуразрешаваща процедура */
    semi({ prog, x, limit }) {
      const P = PROGS[prog];
      if (!P) throw new Error("Непозната програма.");
      x = S.int(x, P.lo, P.hi, "Входът");
      limit = S.int(limit, 1, 600, "Лимитът");
      const F = [], trace = [x];
      let s = x, steps = 0;
      const mk = (o) => Object.assign({ trace: trace.slice(-40), total: trace.length, state: s, prog, pkey: P.key, stats: { стъпки: steps, лимит: limit } }, o);
      F.push(mk({ at: "enter", pAt: "enter", vars: { x, s }, msg: `Симулираме ${P.name} върху вход ${x}.`, log: `x = ${x}` }));
      while (true) {
        const hd = P.halted(s);
        F.push(mk({ at: "check", pAt: "cond", vars: { s, steps }, msg: `Спряла ли е P в състояние ${s}? → <b>${hd ? "да" : "не"}</b>.` }));
        if (hd) break;
        F.push(mk({ at: "limit", pAt: "cond", vars: { s, steps }, msg: `steps == limit? ${steps} == ${limit} → <b>${steps === limit}</b>.` }));
        if (steps === limit) {
          F.push(mk({ at: "unknown", pAt: "cond", verdict: "unknown", vars: { s, steps, return: 0 }, msg: `Лимитът изтече: <b>„още не“</b>. Не можем да кажем „НЕ, никога не спира“ — може да спре на стъпка ${limit + 1} или по-късно.`, inv: { text: "Краен брой стъпки без спиране не доказва неспиране", ok: false }, log: `лимит ${limit}: още не` }));
          return { frames: F, result: 0, steps };
        }
        s = P.next(s); steps++; trace.push(s);
        F.push(mk({ at: "sim", pAt: "step", vars: { s, steps }, msg: `Една стъпка на P: s = ${s}.`, log: `${steps}: ${s}` }));
      }
      F.push(mk({ at: "yes", pAt: "halt", verdict: "yes", vars: { s, steps, return: 1 }, msg: `P спря след ${steps} стъпки: <b>ДА, спира (потвърдено)</b>. Положителният отговор се потвърждава от завършило изчисление.`, inv: { text: "Спирането е наблюдавано — това е доказателство", ok: true }, log: `спря на стъпка ${steps}` }));
      return { frames: F, result: 1, steps };
    },

    /* диагоналният аргумент: rows = "1010 0110 ..." */
    diag({ rows }) {
      const R = String(rows).trim().split(/[\s,;]+/).filter(Boolean);
      const n = R.length;
      if (n < 2 || n > 6) throw new Error("Нужни са от 2 до 6 реда.");
      for (const r of R) if (!/^[01]+$/.test(r) || r.length !== n) throw new Error(`Всеки ред е низ от ${n} символа 0/1 (таблицата е квадратна).`);
      const H = R.map((r) => r.split("").map(Number));
      const F = [], d = Array(n).fill(null);
      F.push({ at: "loop", H, d: d.slice(), vars: { n }, msg: `Предполагаем решател H: H[i][j] = 1 значи „P${"i"} спира върху вход P${"j"}“. Строим D ред по ред по диагонала.` });
      for (let i = 0; i < n; i++) {
        d[i] = H[i][i] ? 0 : 1;
        F.push({ at: "flip", H, d: d.slice(), cell: [i, i], vars: { i, "H[i][i]": H[i][i], "d[i]": d[i] }, msg: `H[${i}][${i}] = ${H[i][i]} (${H[i][i] ? "спира" : "цикли"}) ⇒ D(P${i}) ${d[i] ? "спира" : "цикли"} — обратното.`, log: `d[${i}] = !${H[i][i]} = ${d[i]}` });
      }
      let eqRow = -1;
      for (let i = 0; i < n; i++) {
        F.push({ at: "row", H, d: d.slice(), row: i, vars: { i }, msg: `Сравняваме D с ред P${i}.` });
        let same = true;
        for (let j = 0; j < n && same; j++) {
          same = H[i][j] === d[j];
          F.push({ at: "cmp", H, d: d.slice(), row: i, cell: [i, j], diff: !same, vars: { i, j, "H[i][j]": H[i][j], "d[j]": d[j] }, msg: same ? `Колона ${j}: съвпадат (${d[j]}).` : `Колона ${j}: <b>различни</b> (H=${H[i][j]}, D=${d[j]}) ⇒ D ≠ P${i}.${j === i ? " Различието е точно на диагонала — така е построено D." : ""}`, log: same ? null : `D ≠ P${i} (колона ${j})` });
        }
        if (same) { eqRow = i; break; }
      }
      F.push({ at: "none", H, d: d.slice(), vars: { return: eqRow }, final: true, msg: `D се различава от всеки ред ⇒ D не е в списъка. Но D е програма, построена от H — ако H съществуваше, D щеше да е в списъка на всички програми. <b>Противоречие ⇒ няма такъв H.</b>`, inv: { text: "Нито един ред не е равен на D", ok: eqRow === -1 }, log: "return -1" });
      return { frames: F, d: d.join(""), result: eqRow };
    },
  };

  /* ---------- съдържание ---------- */
  const html = `
<div class="prose">
  <p>Основният въпрос на раздела: <b>съществува ли принципно алгоритъм</b> за дадена задача? Теорията на <dfn data-g="изчислимост">изчислимостта</dfn> изследва именно това. Тя е логически различна от теорията на сложността, която пита <i>колко ресурси</i> са нужни (<a href="#slozhnost">раздел 3</a>).</p>
  <p>Формални модели на изчисление: <dfn data-g="машина на тюринг">машина на Тюринг</dfn>, <dfn data-g="частично рекурсивни функции">частично рекурсивни функции</dfn>, <dfn data-g="ламбда-изчисление">ламбда-изчисление</dfn>. <dfn data-g="теза на чърч–тюринг">Тезата на Чърч–Тюринг</dfn> твърди, че ефективно изчислимото съвпада с изчислимото от машина на Тюринг — това е <b>теза, не теорема</b>: „ефективно изчислимо“ е интуитивно понятие и не може да се докаже формално.</p>
</div>

<div class="block">
  <h3>Видове задачи — една задача, три формулировки</h3>
  <div class="cards">
    <div class="card"><span class="eyebrow">да / не</span><h4><dfn data-g="задача за разпознаване">Разпознаване</dfn></h4><p>„Съществува ли път от A до F?“</p></div>
    <div class="card"><span class="eyebrow">обект</span><h4><dfn data-g="задача за търсене">Търсене</dfn></h4><p>„Намерете такъв път.“</p></div>
    <div class="card"><span class="eyebrow">минимум / максимум</span><h4><dfn data-g="оптимизационна задача">Оптимизация</dfn></h4><p>„Намерете най-късия път.“</p></div>
    <div class="card"><span class="eyebrow">стойност</span><h4>Изчисляване на функция</h4><p>„Пресметнете НОД(a, b).“ (<a href="#algoritam">раздел 1</a>)</p></div>
  </div>
  <p class="muted">Избери формулировка, начален и краен връх. Щракни върху ребро в графа, за да го премахнеш (или върнеш). Връх H е изолиран.</p>
  <div class="cards" id="modes"></div>
  <div id="v-bfs"></div>
  <details class="hint"><summary>Хинт: защо тук „не намерих“ е доказателство, а по принцип не е</summary><div>
    <p>Графът е <b>краен</b>. <dfn data-g="bfs">BFS</dfn> посещава всеки връх, достижим от s, и спира, когато опашката се изпразни. Празната опашка означава: всички достижими върхове са изброени. Ако t не е сред тях, пътят не съществува — това е доказателство чрез изчерпване.</p>
    <p>При безкрайно (или неограничено) пространство на търсене изчерпване няма. Процедура, която търси и „още не е намерила“, не доказва нищо за несъществуването. Точно това се случва в следващия визуализатор.</p>
  </div></details>
  <div class="key"><p class="formula">Разпознаване ⟶ да/не · Търсене ⟶ обект · Оптимизация ⟶ най-добър обект</p><p>Отговорът „не намерих“ не е доказателство за „не съществува“ — освен когато пространството е изчерпано.</p></div>
</div>

<div class="block">
  <h3>Разрешима, полуразрешима, неразрешима</h3>
  <div class="split">
    <div class="key"><b><dfn data-g="разрешима задача">Разрешима</dfn></b><p>Съществува алгоритъм, който <b>за всеки вход завършва</b> и отговаря правилно да/не.</p></div>
    <div class="key"><b><dfn data-g="полуразрешима задача">Полуразрешима</dfn></b><p>Положителните случаи се потвърждават чрез завършващо изчисление; при отрицателен процедурата може да не спре.</p></div>
    <div class="key"><b><dfn data-g="неразрешима задача">Неразрешима</dfn></b><p>Няма алгоритъм, който завършва с правилен отговор за <b>всички</b> входове.</p></div>
  </div>
  <p class="prose"><dfn data-g="проблем за спирането">Проблемът за спирането</dfn> („спира ли програмата P върху вход x?“) е <b>неразрешим</b> (Тюринг), но е <b>полуразрешим</b>: симулираме P и потвърждаваме спирането, ако то настъпи. Симулаторът по-долу е точно тази процедура — с лимит, за да можеш да я наблюдаваш.</p>
  <div id="v-semi"></div>
  <details class="hint"><summary>Хинт: защо лимитът не помага</summary><div>
    <p>Каквото и число L да избереш, винаги има програми, които спират на стъпка L + 1. Затова „не спря за L стъпки“ не позволява извод „никога няма да спре“. Колац с n = 27 спира след 111 стъпки — с лимит 100 изглежда като „не спира“.</p>
    <p>Колац за n = 0 наистина не спира (0 → 0 → 0…), но симулаторът не може да го <i>докаже</i>: той вижда само „още не“. Доказателството идва от разсъждение извън симулацията. За n ≥ 1 дали Колац винаги спира е открит въпрос <span class="extra-tag">извън конспекта</span>.</p>
  </div></details>
  <details class="trap"><summary>Капан: „неразрешима“ = „твърде бавна“</summary><div>
    <p>Не. Неразрешимостта е <b>липса на общ алгоритъм</b>, не голямо време. Колкото и бърз да е компютърът, общ алгоритъм за проблема за спирането няма.</p>
  </div></details>
</div>

<div class="block">
  <h3>Диагоналният аргумент на Тюринг</h3>
  <p class="prose">Да допуснем, че има решател H(P, x), който винаги завършва и казва вярно дали P спира върху x. Изреждаме програмите P0, P1, P2, … и попълваме таблицата H(Pi, Pj). Строим D: <b>D(P) зацикля, ако H казва „P спира върху P“, иначе спира</b>. Щракни клетките, за да смениш предсказанията на H — D винаги излиза извън списъка (<dfn data-g="диагонален аргумент">диагонален аргумент</dfn>).</p>
  <div id="v-diag"></div>
  <div id="diag-code" style="min-width:0"></div>
  <details class="hint"><summary>Хинт: краткото доказателство за устния изпит</summary><div>
    <p>Допускаме, че halts съществува. Строим D(p): ако halts(p, p) — зацикли; иначе — спри. Питаме: спира ли D(D)?</p>
    <p>Ако halts(D, D) = 1 („спира“), D(D) зацикля — halts греши. Ако halts(D, D) = 0 („цикли“), D(D) спира — halts пак греши. Противоречие ⇒ halts не съществува.</p>
    <p>Таблицата е същото доказателство, видяно през всички програми едновременно: редът на D се различава от ред i в клетка (i, i).</p>
  </div></details>
  <details class="trap"><summary>Капан: „заглушката halts в C кода доказва нещо“</summary><div>
    <p>Не. Заглушката е само за да се компилира примерът. Тя винаги казва „цикли“ и следователно греши за D. Доказателството е, че <b>всяка</b> функция на мястото на halts греши за някой вход.</p>
  </div></details>
</div>

<div class="block">
  <h3>Вложени класове, не три кутии</h3>
  <p class="muted">Щракни върху пример, за да видиш защо е на това място.</p>
  <div class="split"><div id="venn"></div><div class="key" id="venn-info"></div></div>
  <details class="trap"><summary>Капан: „разрешима, полуразрешима, неразрешима“ са три неприпокриващи се кутии</summary><div>
    <p>Не са. Всяка разрешима задача е и полуразрешима. Проблемът за спирането е едновременно полуразрешим и неразрешим.</p>
  </div></details>
</div>

<div class="block">
  <h3>Недетерминирана машина</h3>
  <p class="prose"><dfn data-g="недетерминирана машина">Недетерминираната машина</dfn> е модел с разклонения: в дадено състояние може да има няколко възможни прехода. Тя <b>приема входа, ако съществува приемащ клон</b>.</p>
  <details class="trap"><summary>Капан: недетерминизъм = случайност = много ядра</summary><div>
    <p>Недетерминираната машина не „избира случайно“ и не е „безкрайно много ядра“. Недетерминизъм, <dfn data-g="вероятностен алгоритъм">вероятностен алгоритъм</dfn> и хардуерна паралелност са <b>три различни понятия</b>. Недетерминизмът е математическа дефиниция за приемане („съществува клон“), не физическо устройство.</p>
  </div></details>
  <div class="key"><p>Изчислимост ≠ сложност. Първо: <b>съществува ли</b> алгоритъм. После (<a href="#slozhnost">раздел 3</a>): <b>колко</b> струва.</p></div>
</div>`;

  const VENN = [
    { k: "par", t: "Четност на число", x: 230, y: 187, cls: "s-done", d: "<b>Разрешима</b> (и следователно полуразрешима). Алгоритъм: x mod 2 — завършва за всеки вход." },
    { k: "reach", t: "Има ли път s→t", x: 230, y: 215, cls: "s-done", d: "<b>Разрешима</b>. BFS върху краен граф винаги завършва и доказва и „да“, и „не“ (виж първия визуализатор)." },
    { k: "halt", t: "Проблем за спирането", x: 230, y: 88, cls: "s-cmp", d: "<b>Полуразрешима, но неразрешима</b>. Симулацията потвърждава „спира“, ако това е вярно; за „не спира“ общ алгоритъм няма." },
    { k: "cohalt", t: "„P НЕ спира върху x“", x: 230, y: 44, cls: "s-swap", d: "Допълнението на проблема за спирането — <b>не е полуразрешимо</b> <span class=\"extra-tag\">извън конспекта</span>. Ако и то, и спирането бяха полуразрешими, щяхме да пуснем двете процедури паралелно и да получим общ алгоритъм за спирането — противоречие." },
  ];

  function mount(root) {
    /* (а) три формулировки */
    let bfsApi = null;
    const MODES = [["dec", "Разпознаване", "Има ли път?"], ["search", "Търсене", "Намери път"], ["opt", "Оптимизация", "Най-кратък път"]];
    const mBox = root.querySelector("#modes");
    const mBtns = MODES.map(([k, t, q]) => h("button", { class: "card", "aria-pressed": k === "dec" ? "true" : "false", onclick: () => { bfsApi.setValues({ mode: k }); bfsApi.apply(); } },
      h("h4", { text: t }), h("p", { text: q })));
    mBox.append(...mBtns);
    bfsApi = S.viz(root.querySelector("#v-bfs"), {
      id: "bfs3", title: "BFS с опашка — разпознаване, търсене, оптимизация", sub: "Числото под върха е dist[v] (брой ребра от s); — = непосетен.",
      code: "ch02_bfs",
      inputs: [
        { id: "mode", label: "Формулировка", type: "select", value: "dec", options: MODES.map(([k, t]) => [k, t]) },
        { id: "s", label: "от", type: "select", value: "A", options: V },
        { id: "t", label: "до", type: "select", value: "F", options: V },
        { id: "cut", label: "Премахнати ребра", value: "", width: "10em" },
      ],
      presets: [{ label: "A→H (изолиран)", values: { s: "A", t: "H", cut: "" } }, { label: "Махни DF, EF", values: { s: "A", t: "F", cut: "DF EF" } }, { label: "Откъсни F", values: { s: "A", t: "F", cut: "DF EF FG" } }, { label: "Всички ребра", values: { cut: "" } }],
      legend: [["s-piv", "начало s"], ["s-act", "текущ u"], ["s-cmp", "в опашката"], ["s-done", "обработен / път"], ["s-dim", "премахнато ребро"]],
      build: algos.bfs,
      onFrame(f) { mBtns.forEach((b, i) => b.setAttribute("aria-pressed", MODES[i][0] === f.mode ? "true" : "false")); },
      draw(st, f) {
        st.innerHTML = "";
        const W = 600, H = 260;
        const svg = S.svg("svg", { class: "g", viewBox: `0 0 ${W} ${H}`, width: W });
        const inPath = new Set();
        if (f.path) for (let k = 0; k + 1 < f.path.length; k++) inPath.add(norm(V[f.path[k]] + V[f.path[k + 1]]));
        const cut = new Set(f.cut);
        for (const e of EDGES) {
          const [x1, y1] = POS[e[0]], [x2, y2] = POS[e[1]];
          const a = V.indexOf(e[0]), b = V.indexOf(e[1]);
          let cls = "edge";
          if (cut.has(e)) cls += " s-dim";
          else if (inPath.has(e)) cls += " s-done";
          else if (f.u != null && f.v != null && ((f.u === a && f.v === b) || (f.u === b && f.v === a))) cls += " s-cmp";
          else if (f.parent[b] === a || f.parent[a] === b) cls += " s-act";
          const line = S.svg("line", { x1, y1, x2, y2, class: cls, "stroke-dasharray": cut.has(e) ? "6 5" : null });
          const hit = S.svg("line", { x1, y1, x2, y2, stroke: "transparent", "stroke-width": 16, style: "cursor:pointer", onclick: () => toggleEdge(e) },
            S.svg("title", { text: (cut.has(e) ? "Върни ребро " : "Премахни ребро ") + e }));
          svg.append(line, hit);
        }
        const inQ = new Set(f.queue), done = new Set(f.done);
        V.forEach((name, k) => {
          const [x, y] = POS[name];
          let cls = "node";
          if (f.path && f.path.includes(k) && f.final) cls += " s-done";
          else if (k === f.u) cls += " s-act";
          else if (inQ.has(k)) cls += " s-cmp";
          else if (k === f.s) cls += " s-piv";
          else if (done.has(k)) cls += " s-done";
          const g = S.svg("g", { class: cls }, S.svg("circle", { cx: x, cy: y, r: 19 }));
          svg.append(g, S.svg("text", { x, y: y + 5, "text-anchor": "middle", text: name, "font-weight": 700 }));
          const lab = (k === f.s ? "s " : k === f.t ? "t " : "") + (f.dist[k] >= 0 ? "d=" + f.dist[k] : "—");
          svg.append(S.svg("text", { x, y: y < 130 ? y - 26 : y + 36, "text-anchor": "middle", class: "wt", text: lab }));
        });
        st.append(svg);
        const q = h("div", { class: "row" }, h("span", { class: "eyebrow", text: "Опашка" }));
        st.append(q);
        const qa = h("div");
        st.append(qa);
        if (f.queue.length) S.drawArray(qa, f.queue.map((x) => V[x]), { index: false, cls: { 0: "s-cmp" }, ptr: { head: 0 } });
        else qa.append(h("p", { class: "muted", text: "празна" }));
      },
    });
    function toggleEdge(e) {
      const inp = bfsApi.root.querySelector("#bfs3-cut");
      let cur;
      try { cur = parseCut(inp.value); } catch (err) { cur = new Set(); }
      if (cur.has(e)) cur.delete(e); else cur.add(e);
      bfsApi.setValues({ cut: [...cur].sort().join(" ") });
      bfsApi.apply();
      bfsApi.go(bfsApi.frames.length - 1);
    }

    /* (б) полуразрешимост */
    S.viz(root.querySelector("#v-semi"), {
      id: "semi", title: "Полуразрешимост: симулирай и чакай", sub: "Отгоре: процедурата halts_within. В сцената: симулираната програма P и текущият ѝ ред.",
      code: "ch02_semi",
      inputs: [
        { id: "prog", label: "Програма P", type: "select", value: "collatz", options: Object.keys(PROGS).map((k) => [k, PROGS[k].name]) },
        { id: "x", label: "вход x", type: "number", value: 27, width: "7em" },
        { id: "limit", label: "лимит стъпки", type: "number", value: 100, width: "6em" },
      ],
      presets: [{ label: "Колац 27, лимит 120", values: { prog: "collatz", x: 27, limit: 120 } }, { label: "Колац 0", values: { prog: "collatz", x: 0, limit: 30 } }, { label: "is_even(7)", values: { prog: "is_even", x: 7, limit: 30 } }, { label: "while(1)", values: { prog: "forever", x: 0, limit: 20 } }],
      speed: 2,
      build: algos.semi,
      draw(st, f) {
        st.innerHTML = "";
        const verdict = f.verdict === "yes" ? h("span", { class: "pill s-done", text: "ДА, спира (потвърдено)" })
          : f.verdict === "unknown" ? h("span", { class: "pill s-cmp", text: "още не — не можем да кажем НЕ" }) : h("span", { class: "pill s-act", text: "симулира се…" });
        st.append(h("div", { class: "row", style: { marginBottom: "10px" } }, verdict, h("span", { class: "muted", text: `състояние s = ${f.state}` })));
        const wrap = h("div", { class: "split" });
        const left = h("div"), right = h("div");
        S.codeView(left, f.pkey, f.pAt);
        const tr = f.trace, show = tr.slice(-24);
        S.drawBars(right, show.map((v) => Math.abs(v)), { height: 150, labelsUpTo: 24, fmt: (v, k) => show[k], cls: { [show.length - 1]: f.verdict === "yes" ? "s-done" : f.verdict === "unknown" ? "s-cmp" : "s-act" } });
        right.append(h("p", { class: "muted", style: { marginTop: "6px" }, text: `Последните ${show.length} състояния (общо ${f.total}).` }));
        wrap.append(left, right);
        st.append(wrap);
      },
    });

    /* (в) диагонал */
    let dApi = null;
    dApi = S.viz(root.querySelector("#v-diag"), {
      id: "diag", title: "Таблица H(Pi, Pj) и диагоналната програма D", sub: "1 = „спира“, 0 = „цикли“. Щракни клетка, за да промениш H.",
      code: "ch02_diag",
      inputs: [{ id: "rows", label: "Редове на H", value: "1010 0110 1101 0011", width: "18em" }],
      presets: [{ label: "Всичко „цикли“", values: { rows: "00000 00000 00000 00000 00000" } }, { label: "6×6", values: { rows: "110100 011001 101011 000110 111111 010101" } }],
      random: () => { const n = S.randInt(3, 6); return { rows: Array.from({ length: n }, () => Array.from({ length: n }, () => S.randInt(0, 1)).join("")).join(" ") }; },
      legend: [["s-piv", "диагонал"], ["s-cmp", "сравнява се"], ["s-swap", "различие"], ["s-done", "D"]],
      build: algos.diag,
      draw(st, f) {
        st.innerHTML = "";
        const n = f.H.length;
        const tb = h("table", { class: "t grid" });
        tb.append(h("tr", null, h("th", { text: "H" }), ...Array.from({ length: n }, (_, j) => h("th", { text: "P" + j }))));
        f.H.forEach((r, i) => {
          const tr = h("tr", null, h("th", { text: "P" + i, class: f.row === i ? "s-act" : "" }));
          r.forEach((v, j) => {
            let cls = i === j ? "s-piv" : "";
            if (f.cell && f.cell[0] === i && f.cell[1] === j) cls = f.diff ? "s-swap" : "s-cmp";
            tr.append(h("td", { class: cls, text: v ? "спира" : "цикли", title: "Щракни за смяна", style: { cursor: "pointer" }, onclick: () => toggle(i, j) }));
          });
          tb.append(tr);
        });
        tb.append(h("tr", null, h("th", { text: "D" }), ...f.d.map((v, j) => h("td", { class: v == null ? "" : f.cell && f.cell[1] === j && f.row != null ? (f.diff ? "s-swap" : "s-cmp") : "s-done", text: v == null ? "?" : v ? "спира" : "цикли" }))));
        st.append(h("div", { class: "tbl-wrap" }, tb));
        if (f.final) st.append(h("p", { class: "warn", style: { marginTop: "8px" }, text: "D ≠ всеки ред (поне по диагонала) ⇒ D не е в списъка ⇒ противоречие ⇒ H не съществува." }));
      },
    });
    function toggle(i, j) {
      const inp = dApi.root.querySelector("#diag-rows");
      const R = inp.value.trim().split(/[\s,;]+/).map((r) => r.split(""));
      R[i][j] = R[i][j] === "1" ? "0" : "1";
      dApi.setValues({ rows: R.map((r) => r.join("")).join(" ") });
      dApi.apply();
      dApi.go(dApi.frames.length - 1);
    }
    const dc = root.querySelector("#diag-code");
    dc.append(h("p", { class: "muted", style: { marginBottom: "6px" }, html: "Същото като C: <code>halts</code> е указател към хипотетична функция. Подсветен е въпросът, който D задава." }));
    S.codeView(dc, "ch02_diag_D", "ask");

    /* (г) Venn */
    const vb = root.querySelector("#venn"), info = root.querySelector("#venn-info");
    const W = 460, H = 262;
    const svg = S.svg("svg", { class: "g", viewBox: `0 0 ${W} ${H}`, width: W });
    svg.append(S.svg("rect", { x: 4, y: 4, width: W - 8, height: H - 8, rx: 10, class: "edge" }));
    svg.append(S.svg("text", { x: 16, y: 22, class: "muted", text: "всички задачи за разпознаване" }));
    svg.append(S.svg("g", { class: "node s-cmp" }, S.svg("ellipse", { cx: 230, cy: 160, rx: 200, ry: 95, style: "fill:var(--cb);stroke:var(--c);stroke-width:2" })));
    svg.append(S.svg("text", { x: 230, y: 118, "text-anchor": "middle", class: "muted", text: "полуразрешими" }));
    svg.append(S.svg("g", { class: "node s-done" }, S.svg("ellipse", { cx: 230, cy: 192, rx: 130, ry: 52, style: "fill:var(--cb);stroke:var(--c);stroke-width:2" })));
    svg.append(S.svg("text", { x: 230, y: 158, "text-anchor": "middle", class: "muted", text: "разрешими" }));
    const pts = [];
    VENN.forEach((p, k) => {
      const g = S.svg("g", { style: "cursor:pointer", tabindex: 0, role: "button", onclick: () => pick(k), onkeydown: (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(k); } } },
        S.svg("g", { class: "node " + p.cls }, S.svg("circle", { cx: p.x - 85, cy: p.y - 4, r: 6 })),
        S.svg("text", { x: p.x - 72, y: p.y, text: p.t }));
      pts.push(g); svg.append(g);
    });
    vb.append(svg);
    function pick(k) {
      pts.forEach((g, j) => g.setAttribute("font-weight", j === k ? "700" : "400"));
      info.innerHTML = `<p><b>${VENN[k].t}</b></p><p>${VENN[k].d}</p><p class="muted">Разрешими ⊂ полуразрешими. Неразрешими = всичко извън вътрешната елипса.</p>`;
    }
    pick(2);

  }

  S.chapter({ id: "izchislimost", order: 2, num: "2", group: "Изчислимост и сложност", title: "Изчислимост и разрешимост", lead: "Съществува ли принципно алгоритъм? Видове задачи, разрешимост, проблемът за спирането и диагоналният аргумент.", html, mount, algos });
})();

</script>
<script>
/* Раздел 3 — допълнение: асимптотични означения O, Ω, Θ, o, ω.
   Интерактивна лаборатория: избираш двойка функции f, g и отношение; плъзгачите задават
   константите и прага n₀; графиките показват f и c·g, както и отношението f/g.
   Регистрира се към раздел „slozhnost“ чрез Study.asymLab(host). */
(function () {

      h("div", { class: "viz-inputs" }, sC, sC1, sC2, sN0, autoBtn, h("label", { class: "field", style: { display: "flex", gap: "6px", alignItems: "center" } }, logCb, "логаритмична ос y")),
      h("div", { class: "viz-stage" }, h("span", { class: "eyebrow", text: "f(n) и границата" }), cv, h("span", { class: "eyebrow", style: { display: "block", marginTop: "10px" }, text: "Отношението f(n) / g(n)" }), cvR),
      info, truthBox, h("div", { class: "viz-stage", style: { minHeight: "0" } }, tblBox));
    host.append(box);

    pairSel.addEventListener("change", () => {
      P = PAIRS.find((p) => p.id === pairSel.value);
      c = P.c; c1 = P.c1; c2 = P.c2; n0 = Math.min(P.n0, P.N); N = P.N; logY = P.log;
      syncSliders(); draw();
    });
    function syncSliders() {
      const th = rel === "Th";
      sC.hidden = th; sC1.hidden = !th; sC2.hidden = !th;
      n0R.max = Math.max(10, Math.min(P.N - 1, P.N > 500 ? 2000 : P.N - 1));
      n0R.value = n0; n0Out.textContent = n0;
      logCb.checked = logY;
      [sC, sC1, sC2].forEach((s) => s.sync());
    }

    function draw() {
      const isTh = rel === "Th";
      const lo = isTh ? (n) => c1 * P.G(n) : (n) => c * P.G(n);
      const hi = isTh ? (n) => c2 * P.G(n) : null;
      // точки: всички n при N ≤ 200, иначе ~200 равномерни
      const step = Math.max(1, Math.ceil(N / 200));
      const pts = []; for (let n = 1; n <= N; n += step) pts.push(n); if (pts[pts.length - 1] !== N) pts.push(N);
      const bad = check(P, rel, c, c1, c2, n0, N);
      const badSet = new Set(bad);
      plotMain(pts, lo, hi, badSet);
      plotRatio(pts, badSet);
      // съобщение
      const R = RELS.find((r) => r.k === rel);
      const cTxt = isTh ? `c₁ = ${fmt(c1)}, c₂ = ${fmt(c2)}` : `c = ${fmt(c)}`;
      const ineq = rel === "O" ? "f(n) ≤ c·g(n)" : rel === "Om" ? "f(n) ≥ c·g(n)" : rel === "Th" ? "c₁·g(n) ≤ f(n) ≤ c₂·g(n)" : rel === "o" ? "f(n) < c·g(n)" : "f(n) > c·g(n)";
      info.innerHTML = bad.length
        ? `<div>С ${cTxt} и n₀ = ${n0}: <b>${ineq}</b> е <b class="warn">нарушено</b> при ${bad.length} стойности на n (${bad.slice(0, 6).join(", ")}${bad.length > 6 ? ", …" : ""}).</div>`
        : `<div>С ${cTxt} и n₀ = ${n0}: <b>${ineq}</b> е изпълнено за всички n от ${n0} до ${N} <span class="muted">(числено)</span>.</div>`;
      // истина за двойката
      const T = P.truth;
      truthBox.innerHTML = "";
      const row = h("div", { class: "row" }, h("b", { text: "За тази двойка:" }));
      RELS.forEach((x) => row.append(h("span", { class: "pill " + (T[x.k] ? "s-done" : "s-swap"), text: `f ${T[x.k] ? "=" : "≠"} ${RELNAME[x.k]}(g)` })));
      truthBox.append(row, h("p", null, h("b", { text: `Граница на f/g: ${P.lim}. ` }), P.why));
      if ((rel === "o" || rel === "om") && T[rel]) truthBox.append(h("p", { class: "muted", text: "Една константа не стига да се докаже o/ω — нужно е за всяка. Таблицата отдолу показва, че прагът съществува за все по-строги c." }));
      if ((rel === "O" || rel === "Om" || rel === "Th") && !T[rel]) truthBox.append(h("p", { class: "muted", text: "Опитай различни константи: за невярно отношение няма c, с които нарушенията да изчезнат за всички големи n." }));
      // таблица праг n₀ за различни c
      tblBox.innerHTML = "";
      if (rel !== "Th") {
        const cs = rel === "o" || rel === "O" ? [10, 1, 0.1, 0.01, 0.001] : [0.1, 1, 10, 100, 1000];
        const t = h("table", { class: "t", style: { marginTop: "4px" } }, h("tr", null, h("th", { text: "c" }), ...cs.map((x) => h("th", { class: "mono", text: fmt(x) }))));
        t.append(h("tr", null, h("td", { text: `най-малък праг n₀ (до N = ${N})` }), ...cs.map((x) => { const m = minN0(P, rel, x, 0, 0, N); return h("td", { class: "mono " + (m > 0 ? "" : "warn"), text: m > 0 ? m : "няма" }); })));
        tblBox.append(h("span", { class: "eyebrow", text: rel === "o" || rel === "om" ? "Прагът за все по-строги константи" : "Прагът за различни константи" }), t);
        if (!T[rel]) tblBox.append(h("p", { class: "muted", style: { fontSize: ".85rem", marginTop: "6px" }, text: `Отношението е невярно: за всяко c има нарушения при достатъчно голямо n. Ако в таблицата се вижда праг, той е само в рамките на проверката до N = ${N}.` }));
      }
    }

    function axes(ctx, W, H, L, R, Tp, B, pw, ph, ymin, ymax, log, sx) {
      ctx.clearRect(0, 0, W, H);
      ctx.font = "11px " + css("--f-mono"); ctx.fillStyle = css("--muted"); ctx.textAlign = "center";
      const ticks = [1, Math.round(N / 4), Math.round(N / 2), Math.round((3 * N) / 4), N];
      ticks.forEach((n) => ctx.fillText("n=" + n, sx(n), H - 8));
      ctx.textAlign = "right";
      const ys = log ? [ymin, Math.sqrt(ymin * ymax), ymax] : [ymin, (ymin + ymax) / 2, ymax];
      ys.forEach((v) => { const y = Tp + ph - (log ? (Math.log10(v) - Math.log10(ymin)) / (Math.log10(ymax) - Math.log10(ymin) || 1) : (v - ymin) / (ymax - ymin || 1)) * ph; ctx.fillText(fmt(v), L - 6, y + 4); ctx.strokeStyle = css("--line-2"); ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(L + pw, y); ctx.stroke(); });
      ctx.fillStyle = css("--panel-2"); ctx.globalAlpha = 0.7; ctx.fillRect(sx(n0), Tp, L + pw - sx(n0), ph); ctx.globalAlpha = 1;
      ctx.fillStyle = css("--muted"); ctx.textAlign = "left"; ctx.fillText("n₀", sx(n0) + 3, Tp + 12);
    }

    function plotMain(pts, lo, hi, badSet) {
      const { ctx, W, H } = setupCanvas(cv, 280);
      const L = W < 500 ? 52 : 78, R = W < 500 ? 34 : 70, Tp = 10, B = 26, pw = W - L - R, ph = H - Tp - B;
      const sx = (n) => L + ((n - 1) / Math.max(1, N - 1)) * pw;
      let vals = [];
      pts.forEach((n) => { vals.push(P.F(n), lo(n)); if (hi) vals.push(hi(n)); });
      vals = vals.filter((v) => isFinite(v));
      const pos = vals.filter((v) => v > 0);
      let ymin = logY ? Math.max(1e-3, Math.min(...pos)) : Math.min(0, ...vals), ymax = Math.max(...vals);
      if (ymax <= ymin) ymax = ymin + 1;
      const sy = (v) => {
        if (logY) { const a = Math.log10(ymin), b = Math.log10(ymax); return Tp + ph - ((Math.log10(Math.max(v, ymin)) - a) / (b - a || 1)) * ph; }
        return Tp + ph - ((v - ymin) / (ymax - ymin)) * ph;
      };
      axes(ctx, W, H, L, R, Tp, B, pw, ph, ymin, ymax, logY, sx);
      const labs = [];
      const line = (f, col, dash, lab2) => {
        ctx.strokeStyle = css(col); ctx.setLineDash(dash); ctx.lineWidth = 2; ctx.beginPath();
        pts.forEach((n, i) => (i ? ctx.lineTo(sx(n), sy(f(n))) : ctx.moveTo(sx(n), sy(f(n)))));
        ctx.stroke(); ctx.setLineDash([]);
        let y = sy(f(N)) + 4; while (labs.some((q) => Math.abs(q - y) < 13)) y += 13; labs.push(y);
        ctx.fillStyle = css(col); ctx.textAlign = "left"; ctx.font = "600 12px " + css("--f-mono"); ctx.fillText(lab2, L + pw + 6, Math.min(H - 4, Math.max(12, y)));
      };
      if (hi) line(hi, "--st-cmp", [6, 4], "c₂·g");
      line(lo, hi ? "--st-act" : "--st-cmp", [6, 4], hi ? "c₁·g" : "c·g");
      if (P.id === "osc") {
        // при осцилиращата функция рисуваме само точки — линията през четни/нечетни е подвеждаща
      } else line(P.F, "--ink", [], "f");
      pts.forEach((n) => {
        ctx.fillStyle = css(n < n0 ? "--st-dim" : badSet.has(n) ? "--st-swap" : "--st-done");
        ctx.beginPath(); ctx.arc(sx(n), sy(P.F(n)), n >= n0 && badSet.has(n) ? 3.8 : 2.6, 0, 7); ctx.fill();
      });
    }

    function plotRatio(pts, badSet) {
      const { ctx, W, H } = setupCanvas(cvR, 200);
      const L = W < 500 ? 52 : 78, R = W < 500 ? 34 : 70, Tp = 10, B = 26, pw = W - L - R, ph = H - Tp - B;
      const sx = (n) => L + ((n - 1) / Math.max(1, N - 1)) * pw;
      const ratio = (n) => P.F(n) / P.G(n);
      const rs = pts.map(ratio).filter((v) => isFinite(v));
      const refs = rel === "Th" ? [c1, c2] : [c];
      const useLog = Math.max(...rs, ...refs) / Math.max(1e-6, Math.min(...rs.filter((v) => v > 0), ...refs)) > 50;
      let ymin = useLog ? Math.max(1e-4, Math.min(...rs.filter((v) => v > 0), ...refs) / 1.5) : 0;
      let ymax = Math.max(...rs, ...refs) * 1.15;
      if (ymax <= ymin) ymax = ymin + 1;
      const sy = (v) => {
        if (useLog) { const a = Math.log10(ymin), b = Math.log10(ymax); return Tp + ph - ((Math.log10(Math.max(v, ymin)) - a) / (b - a || 1)) * ph; }
        return Tp + ph - ((v - ymin) / (ymax - ymin)) * ph;
      };
      axes(ctx, W, H, L, R, Tp, B, pw, ph, useLog ? ymin : Math.max(ymin, 0), ymax, useLog, sx);
      // коридор / граница
      ctx.font = "600 12px " + css("--f-mono"); ctx.textAlign = "left";
      if (rel === "Th") {
        ctx.fillStyle = css("--st-done-bg"); ctx.globalAlpha = 0.6; ctx.fillRect(L, sy(c2), pw, sy(c1) - sy(c2)); ctx.globalAlpha = 1;
        [[c1, "c₁", "--st-act"], [c2, "c₂", "--st-cmp"]].forEach(([v, t, col]) => { ctx.strokeStyle = css(col); ctx.setLineDash([6, 4]); ctx.beginPath(); ctx.moveTo(L, sy(v)); ctx.lineTo(L + pw, sy(v)); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle = css(col); ctx.fillText(t, L + pw + 6, sy(v) + 4); });
      } else {
        ctx.strokeStyle = css("--st-cmp"); ctx.setLineDash([6, 4]); ctx.beginPath(); ctx.moveTo(L, sy(c)); ctx.lineTo(L + pw, sy(c)); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = css("--st-cmp"); ctx.fillText("c", L + pw + 6, sy(c) + 4);
      }
      if (P.id !== "osc") {
        ctx.strokeStyle = css("--ink"); ctx.lineWidth = 2; ctx.beginPath();
        pts.forEach((n, i) => (i ? ctx.lineTo(sx(n), sy(ratio(n))) : ctx.moveTo(sx(n), sy(ratio(n)))));
        ctx.stroke();
      }
      pts.forEach((n) => {
        ctx.fillStyle = css(n < n0 ? "--st-dim" : badSet.has(n) ? "--st-swap" : "--st-done");
        ctx.beginPath(); ctx.arc(sx(n), sy(ratio(n)), 2.4, 0, 7); ctx.fill();
      });
      ctx.fillStyle = css("--ink"); ctx.fillText("f/g", L + pw + 6, Math.min(H - 4, Math.max(12, sy(ratio(N)) + 4 + (Math.abs(sy(ratio(N)) - sy(c)) < 13 ? 13 : 0))));
    }

    syncSliders();
    draw();
    new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
    window.addEventListener("resize", draw);
  }

  S.asymLab = mount;
  S.asymAlgos = algos;
})();

</script>
<script>
/* Раздел 3 — Изчислителна сложност. */
(function () {
  const S = window.Study, h = S.h;

  Object.assign(window.GLOSSARY, {
    "елементарна операция": { cat: "Сложност", t: "Елементарна операция", en: "Elementary operation", d: "Стъпка, която в избрания изчислителен модел се брои като една единица време (сравнение, присвояване, аритметика с думи с фиксирана дължина).", more: "Операция с произволно голямо цяло число не е винаги един такт — зависи от модела." },
    "изчислителен модел": { cat: "Сложност", t: "Изчислителен модел", en: "Model of computation", d: "Формално описание кои операции са разрешени и колко струва всяка (машина на Тюринг, RAM модел, модел на сравненията).", more: "Долните граници зависят от модела: Ω(n log n) важи за сортиране чрез сравнения." },
    "ред на растеж": { cat: "Сложност", t: "Ред на растеж", en: "Order of growth", d: "Как нараства функцията при n → ∞, без постоянните множители и по-нисшите членове.", more: "1 → log n → n → n log n → n² → 2ⁿ → n!" },
  });

  /* ---------- функции за растеж ---------- */
  const lg = (x) => Math.log2(x);
  const fact = (n) => { let r = 1; for (let k = 2; k <= n; k++) r *= k; return r; };
  const FN = [
    { k: "1", t: "1", f: () => 1, col: "--muted", dash: [2, 3], ex: "константен" },
    { k: "log", t: "log₂ n", f: (n) => (n < 1 ? 0 : lg(n)), col: "--st-done", dash: [], ex: "логаритмичен" },
    { k: "n", t: "n", f: (n) => n, col: "--st-act", dash: [], ex: "линеен" },
    { k: "nlog", t: "n log₂ n", f: (n) => (n < 1 ? 0 : n * lg(n)), col: "--st-piv", dash: [], ex: "n log n" },
    { k: "n2", t: "n²", f: (n) => n * n, col: "--st-cmp", dash: [], ex: "квадратичен" },
    { k: "n3", t: "n³", f: (n) => n * n * n, col: "--st-cmp", dash: [7, 4], ex: "кубичен" },
    { k: "2n", t: "2ⁿ", f: (n) => Math.pow(2, n), col: "--st-swap", dash: [], ex: "експоненциален" },
    { k: "fact", t: "n!", f: fact, col: "--st-swap", dash: [7, 4], ex: "факториален" },
  ];
  const UNIVERSE_S = 13.8e9 * 365.25 * 86400;
  /** време при 10⁹ операции/сек, в човешки единици */
  function human(ops) {
    const s = ops / 1e9;
    if (s > UNIVERSE_S) return "по-дълго от възрастта на Вселената";
    const Y = 365.25 * 86400;
    const trim = (x) => (x.includes(".") ? x.replace(/\.?0+$/, "") : x);
    const f = (v, u) => (v >= 100 ? Math.round(v).toLocaleString("bg") : trim(v >= 10 ? v.toFixed(1) : v.toFixed(2))) + " " + u;
    if (s < 1e-6) return f(s * 1e9, "ns");
    if (s < 1e-3) return f(s * 1e6, "µs");
    if (s < 1) return f(s * 1e3, "ms");
    if (s < 60) return f(s, "s");
    if (s < 3600) return f(s / 60, "мин");
    if (s < 86400) return f(s / 3600, "часа");
    if (s < Y) return f(s / 86400, "дни");
    if (s < 1e6 * Y) return f(s / Y, "години");
    return (s / Y).toExponential(1).replace("e+", "·10^") + " години";
  }
  const fmtNum = (v) => (v < 1e6 ? (Number.isInteger(v) ? v.toLocaleString("bg") : v.toFixed(2)) : v.toExponential(2).replace("e+", "·10^"));

  /* ---------- фрагменти ---------- */
  const FRAG = {
    single: { key: "ch03_single", t: "единичен цикъл", formula: "n", f: (n) => n },
    nested: { key: "ch03_nested", t: "два вложени цикъла", formula: "n²", f: (n) => n * n },
    tri: { key: "ch03_tri", t: "триъгълен цикъл", formula: "n(n+1)/2", f: (n) => (n * (n + 1)) / 2 },
    double: { key: "ch03_double", t: "удвояване i *= 2", formula: "⌊log₂ n⌋ + 1", f: (n) => (n < 1 ? 0 : Math.floor(lg(n)) + 1) },
    rec: { key: "ch03_rec", t: "рекурсия T(n)=2T(n/2)+n", formula: "n·log₂ n (точно при n = 2ᵏ)", f: (n) => (n < 1 ? 0 : n * lg(n)) },
  };
  const STEP_MAX = 260;

  /* ---------- чисти функции ---------- */
  const algos = {
    frag({ frag, n }) {
      const D = FRAG[frag];
      if (!D) throw new Error("Непознат фрагмент.");
      n = S.int(n, 0, 60, "n");
      let count = 0;
      const F = [];
      // точен брой (същият код като в C)
      const run = {
        single() { for (let i = 0; i < n; i++) count++; },
        nested() { for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) count++; },
        tri() { for (let i = 0; i < n; i++) for (let j = i; j < n; j++) count++; },
        double() { for (let i = 1; i <= n; i *= 2) count++; },
        rec() { const r = (m) => { if (m <= 1) return; for (let i = 0; i < m; i++) count++; r(Math.floor(m / 2)); r(m - Math.floor(m / 2)); }; r(n); },
      };
      run[frag]();
      const total = count, fv = D.f(n);
      const step = total <= STEP_MAX;
      count = 0;
      if (step) {
        const ops = []; // за рисуване
        const st = () => ({ count });
        const P = (o) => F.push(Object.assign({ frag, n, step: true, ops: ops.slice(), stats: st() }, o));
        if (frag === "single") {
          for (let i = 0; ; i++) {
            P({ at: "loop", vars: { n, i }, i, msg: `i &lt; n? ${i} &lt; ${n} → <b>${i < n}</b>` });
            if (i >= n) break;
            count++; ops.push([i]);
            P({ at: "op", vars: { n, i }, i, msg: `<code>count++</code> → ${count}`, log: `i=${i}: count=${count}` });
          }
        } else if (frag === "nested" || frag === "tri") {
          for (let i = 0; ; i++) {
            P({ at: "outer", vars: { n, i }, i, msg: `Външен: i &lt; n? ${i} &lt; ${n} → <b>${i < n}</b>` });
            if (i >= n) break;
            for (let j = frag === "tri" ? i : 0; j < n; j++) {
              count++; ops.push([i, j]);
              P({ at: ["op", "inner"], vars: { n, i, j }, i, j, msg: `j = ${j}: <code>count++</code> → ${count}`, log: `(${i},${j}) count=${count}` });
            }
          }
        } else if (frag === "double") {
          for (let i = 1; ; i *= 2) {
            P({ at: "loop", vars: { n, i }, i, msg: `i &lt;= n? ${i} &lt;= ${n} → <b>${i <= n}</b>` });
            if (i > n) break;
            count++; ops.push([i]);
            P({ at: "op", vars: { n, i }, i, msg: `<code>count++</code> → ${count}. После i *= 2.`, log: `i=${i}: count=${count}` });
          }
        } else {
          const calls = [];
          const r = (m, off, d) => {
            const c = { off, m, d, st: "act" }; calls.push(c);
            const snap = () => calls.map((x) => Object.assign({}, x));
            P({ at: "enter", vars: { n: m, depth: d }, calls: snap(), msg: `Извикване rec(${m}) на дълбочина ${d}.` });
            if (m <= 1) { c.st = "done"; P({ at: "base", vars: { n: m }, calls: snap(), msg: `n ≤ 1 — базов случай, 0 операции.` }); return; }
            count += m; ops.push([m]);
            P({ at: "op", vars: { n: m, depth: d }, calls: snap(), msg: `Цикълът прави ${m} пъти <code>count++</code> → ${count}.`, log: `rec(${m}): +${m} → ${count}` });
            P({ at: "left", vars: { n: m }, calls: snap(), msg: `Ляво: rec(${Math.floor(m / 2)}).` });
            r(Math.floor(m / 2), off, d + 1);
            P({ at: "right", vars: { n: m }, calls: calls.map((x) => Object.assign({}, x)), msg: `Дясно: rec(${m - Math.floor(m / 2)}).` });
            r(m - Math.floor(m / 2), off + Math.floor(m / 2), d + 1);
            c.st = "done";
          };
          r(n, 0, 0);
        }
      }
      F.push({ frag, n, step, final: true, at: frag === "rec" ? "op" : "op", stats: { count: total }, vars: { n, count: total }, fv, total,
        msg: `Общо <b>count = ${total}</b>. Формула ${D.formula} = ${Number.isInteger(fv) ? fv : fv.toFixed(2)}.${step ? "" : ` (Стъпковият режим е до ${STEP_MAX} операции — тук е показан само резултатът.)`}`,
        calls: F.length && F[F.length - 1].calls ? F[F.length - 1].calls.map((c) => Object.assign({}, c, { st: "done" })) : null, ops: F.length ? F[F.length - 1].ops : [] });
      return { frames: F, result: total };
    },

    lsearch({ n, pos }) {
      n = S.int(n, 1, 20, "n");
      pos = S.int(pos, -1, n - 1, "Позицията");
      const a = Array.from({ length: n }, (_, i) => 10 * (i + 1));
      const key = pos < 0 ? 7 : a[pos];
      const F = [];
      let cmp = 0;
      const extra = { a, n, key };
      for (let i = 0; i < n; i++) {

<script>
/* Раздел 4 — Класове P и NP, сводимост, NP-пълнота. */
(function () {

  Object.assign(window.GLOSSARY, {

    "теорема на кук–левин": { cat: "Класове", t: "Теорема на Кук–Левин", en: "Cook–Levin theorem", d: "SAT е NP-пълна — първата задача, за която това е доказано.", more: "След нея NP-пълнотата на други задачи се доказва чрез свеждане от вече известна NP-пълна задача." },
    "2-sat": { cat: "Класове", t: "2-SAT", d: "SAT, в която всяка клауза има най-много 2 литерала.", more: "Има полиномиален алгоритъм — близкото име с 3-SAT не определя еднаква сложност." },
  });

  /* ---------- графи ---------- */
  const GRAPHS = {
    house: { t: "Къща (5)", n: 5, e: "02 24 41 13 30 21" },
    petal: { t: "Папийонка (5, няма цикъл)", n: 5, e: "01 02 03 04 12 34" },
    hex: { t: "Шестоъгълник (6)", n: 6, e: "03 31 15 52 24 40 01 45" },
    star: { t: "Звезда (6, няма цикъл)", n: 6, e: "01 02 03 04 05 12" },
    sept: { t: "Седем върха (7)", n: 7, e: "04 41 15 52 26 63 30 12 56" },
  };
  function parseGraph(n, edges) {
    n = S.int(n, 3, 7, "Броят върхове");
    const adj = Array.from({ length: n }, () => Array(n).fill(0)), list = [];
    for (const p of String(edges).split(/[\s,;]+/).filter(Boolean)) {
      if (!/^\d\d$/.test(p)) throw new Error(`„${p}“ не е ребро — пиши две цифри, напр. 02.`);
      const a = +p[0], b = +p[1];
      if (a >= n || b >= n) throw new Error(`Ребро ${p}: върховете са 0…${n - 1}.`);
      if (a === b) throw new Error(`Ребро ${p}: примки не се допускат.`);
      if (!adj[a][b]) list.push([a, b]);

    if (!/^\d$/.test(p)) throw new Error(`„${p}“ не е връх (една цифра).`);
    return +p;
  });
  function nextPerm(a, from) { // лексикографски, върху a[from..]
    const m = a.length;
    let i = m - 2;
    while (i >= from && a[i] >= a[i + 1]) i--;
    if (i < from) return false;
    let j = m - 1;
    while (a[j] <= a[i]) j--;
    [a[i], a[j]] = [a[j], a[i]];
    for (let l = i + 1, r = m - 1; l < r; l++, r--) [a[l], a[r]] = [a[r], a[l]];

  }

    if (cyc.length !== n) return false;
    const seen = Array(n).fill(0);

    for (let i = 0; i < n; i++) if (!adj[cyc[i]][cyc[(i + 1) % n]]) return false;
    return true;
  }

  const FORMULAS = {
    f1: { t: "(x1∨¬x2)∧(x2∨x3)∧(¬x1∨¬x3)", s: "1 -2 | 2 3 | -1 -3" },
    f2: { t: "неизпълнима, 2 променливи", s: "1 2 | -1 2 | 1 -2 | -1 -2" },
    f3: { t: "„точно x2“", s: "1 2 3 | -1 -2 | -2 -3 | -1 -3 | 2" },

  /* ---------- чисти функции ---------- */
  const algos = {
    ham_verify({ n, edges, cert }) {

      const F = [], seen = Array(G.n).fill(0), k = cyc.length;
      const base = () => ({ G, cyc, seen: seen.slice() });

      F.push(Object.assign(base(), { at: "len", vars: { n: G.n, k }, msg: `k == n? ${k} == ${G.n} → <b>${k === G.n}</b>.` }));
      if (k !== G.n) return fail({ at: "len" }, `сертификатът има ${k} върха, а трябва точно ${G.n}.`);
      for (let i = 0; i < k; i++) {
        const v = cyc[i];
        F.push(Object.assign(base(), { at: "loop", cur: v, idx: i, vars: { i, v }, msg: `Позиция ${i}: връх ${v}. Виждан ли е?` }));
        if (seen[v]) return fail({ at: "dup", cur: v, idx: i, bad: v }, `връх ${v} се повтаря.`);

        F.push(Object.assign(base(), { at: "mark", cur: v, idx: i, vars: { i, v }, msg: `Нов — маркираме ${v}.` }));
      }
      for (let i = 0; i < k; i++) {
        const a = cyc[i], b = cyc[(i + 1) % k];
        const ok = !!G.adj[a][b];
        F.push(Object.assign(base(), { at: "pair", pair: [a, b], pairIdx: i, pairOk: ok, vars: { i, a, b }, msg: `Двойка ${a}→${b}${i === k - 1 ? " (последен→първи)" : ""}: ребро ли е? <b>${ok ? "да" : "не"}</b>.` }));
        if (!ok) return fail({ at: "noedge", pair: [a, b], pairIdx: i, pairOk: false }, `между ${a} и ${b} няма ребро.`);
      }
      F.push(Object.assign(base(), { at: "ok", verdict: true, final: true, pairIdx: k, vars: { return: 1 }, msg: `<b>Валиден сертификат</b>: всеки връх точно веднъж и всички ${k} съседни двойки (вкл. последен→първи) са ребра. Проверката е O(n²) — полиномиална.`, log: "return 1" }));

    },

    ham_search({ n, edges }) {
      const G = parseGraph(n, edges);
      const F = [], cyc = Array.from({ length: G.n }, (_, i) => i);
      let tried = 0;
      F.push({ G, cyc: cyc.slice(), at: "init", search: true, vars: { n: G.n, "(n−1)!": fact(G.n - 1) }, stats: { пробвани: 0 }, msg: `Връх 0 е фиксиран; остават (n−1)! = ${fact(G.n - 1)} наредби.` });

        tried++;

        if (ok) {
          F.push({ G, cyc: cyc.slice(), at: "found", search: true, verdict: true, final: true, vars: { return: 1 }, stats: { пробвани: tried }, msg: `Намерен след <b>${tried}</b> от ${fact(G.n - 1)} кандидата. Намерената наредба е сертификат.` });
          return { frames: F, result: 1, tried, cyc: cyc.join("") };
        }
      } while (nextPerm(cyc, 1));
      F.push({ G, cyc: null, at: "none", search: true, verdict: false, final: true, vars: { return: 0 }, stats: { пробвани: tried }, msg: `Всички ${tried} = (n−1)! наредби са проверени ⇒ <b>няма</b> Хамилтонов цикъл (доказано чрез изчерпване). Растежът (n−1)! прави това непрактично за голямо n.` });

    sat_eval({ formula, x }) {

      let ops = 0;
      for (let c = 0; c < f.length; c++) {
        F.push({ at: "clause", f, X, st: st.slice(), c, vars: { c, клауза: clauseTxt(f[c]) }, stats: { литерали: ops }, msg: `Клауза ${c}: ${clauseTxt(f[c])}.` });
        let sat = false;
        for (let k = 0; k < f[c].length; k++) {

          F.push({ at: "false", f, X, st: st.slice(), c, final: true, verdict: false, vars: { return: 0 }, stats: { литерали: ops }, msg: `Клауза ${c} е <b>невярна</b> ⇒ присвояването НЕ изпълнява формулата. Това не значи, че формулата е неизпълнима — може да има друг сертификат.`, log: `C${c} ✗ → 0` });
          return { frames: F, result: 0, ops };
        }
        F.push({ at: "true", f, X, st: st.slice(), c, vars: { c }, stats: { литерали: ops }, msg: `Клауза ${c} е вярна.`, log: `C${c} ✓` });
      }
      F.push({ at: "ok", f, X, st: st.slice(), final: true, verdict: true, vars: { return: 1 }, stats: { литерали: ops }, msg: `Всички клаузи са верни ⇒ присвояването е <b>валиден сертификат</b>. Проверени ${ops} литерала — O(дължина на формулата).`, log: "return 1" });

      return { frames: F, result: `K${N} sum${sum} ham${ham} tsp${tsp}` };

        if (f.search) {
          side.append(h("p", null, h("b", { text: "Кандидат: " }), h("span", { class: "mono", text: f.cyc ? f.cyc.join(" → ") + " → " + f.cyc[0] : "—" })));
          const n = G.n, rows = h("table", { class: "t" }, h("tr", null, h("th", { text: "n" }), h("th", { text: "(n−1)! кандидата" })));
          [n, 10, 15, 20].forEach((k) => rows.append(h("tr", { class: k === n ? "" : "muted" }, h("td", { class: "mono", text: k }), h("td", { class: "mono", text: fact(k - 1).toLocaleString("bg") }))));
          side.append(h("div", { class: "tbl-wrap" }, rows));
        } else {
          side.append(h("div", { class: "row" }, h("span", { class: "eyebrow", text: "Сертификат" })));
          const box = h("div");
          if (f.cyc.length) S.drawArray(box, f.cyc, { cls: Object.fromEntries(f.cyc.map((v, i) => [i, f.idx === i ? (f.bad != null ? "s-swap" : "s-act") : f.pairIdx != null && (i === f.pairIdx || i === (f.pairIdx + 1) % f.cyc.length) && f.pair ? (f.pairOk ? "s-act" : "s-swap") : ""])) });
          else box.append(h("p", { class: "muted", text: "празен — щракни върхове в графа" }));
          side.append(box);
        }
        if (f.final) side.append(h("span", { class: "pill " + (f.verdict ? "s-done" : "s-swap"), style: { justifySelf: "start" }, text: f.search ? (f.verdict ? "намерен цикъл" : "няма цикъл (изчерпано)") : f.verdict ? "сертификатът е валиден" : "сертификатът е отхвърлен" }));
        st.append(h("div", { class: "split" }, h("div", null, svg), side));
      },
    });
    hApi.root.querySelector("#ham-graph").addEventListener("change", (e) => {
      const g = GRAPHS[e.target.value];
      if (g) { hApi.setValues({ n: g.n, edges: g.e, cert: "" }); hApi.apply(); }
    });

    /* (б) SAT */
    let sApi = null;
    const live = root.querySelector("#sat-live");
    const liveBox = h("div", { class: "viz" }, h("div", { class: "viz-head" }, h("h4", { text: "Присвояване на живо" }), h("span", { class: "sub", text: "Щракни xᵢ, за да го смениш." })));
    const toggles = h("div", { class: "viz-inputs" }), clauses = h("div", { class: "viz-stage", style: { minHeight: "0" } });
    liveBox.append(toggles, clauses);
    live.append(liveBox);
    function renderLive() {
      const fe = root.querySelector("#sat-formula"), xe = root.querySelector("#sat-x");
      if (!fe || !xe) return;
      const inp = { formula: fe.value, x: xe.value };
      toggles.innerHTML = ""; clauses.innerHTML = "";
      let P;
      try { P = parseCNF(inp.formula); } catch (e) { clauses.append(h("p", { class: "warn", text: e.message })); return; }
      let xs = String(inp.x).replace(/\s/g, "");
      if (!/^[01]*$/.test(xs)) xs = "";

      const X = [0, ...xs.split("").map(Number)];
      for (let i = 1; i <= P.n; i++) toggles.append(h("button", { class: "btn", "aria-pressed": X[i] ? "true" : "false", text: `x${i} = ${X[i]}`, onclick: () => { X[i] = 1 - X[i]; sApi.setValues({ x: X.slice(1).join(""), mode: "eval" }); sApi.apply(); sApi.go(sApi.frames.length - 1); } }));
      const row = h("div", { class: "row" });
      P.f.forEach((c, k) => { const ok = c.some((l) => (l > 0 ? X[l] : !X[-l])); row.append(h("span", { class: "pill " + (ok ? "s-done" : "s-swap"), text: `C${k} ${clauseTxt(c)} ${ok ? "✓" : "✗"}` })); });
      const all = evalPlain(P.f, X);
      clauses.append(row, h("p", { style: { marginTop: "8px" }, html: all ? `<b>Формулата е вярна</b> при x = ${xs} — това присвояване е сертификат.` : `<b>Невярна</b> при x = ${xs}. Това не казва дали друго присвояване би я изпълнило.` }));

    sApi = S.viz(root.querySelector("#v-sat"), {
      id: "sat", title: "SAT: проверка O(дължина) срещу изчерпване 2ⁿ", sub: "Литерал: 3 = x3, −3 = ¬x3; клаузите се разделят с |.",
      code: (inp) => (inp.mode === "brute" ? "ch04_sat_brute" : "ch04_sat_eval"),

        { id: "formula", label: "Формула (КНФ)", value: FORMULAS.f1.s, width: "17em" },
        { id: "x", label: "x1…xn", value: "110", width: "6em" },
      ],
      presets: [
        { label: "сертификат 110", values: { formula: FORMULAS.f1.s, x: "110", mode: "eval" } },
        { label: "сертификат 111", values: { formula: FORMULAS.f1.s, x: "111", mode: "eval" } },
        { label: "неизпълнима", values: { formula: FORMULAS.f2.s, x: "11", mode: "brute" } },
        { label: "„точно x2“", values: { formula: FORMULAS.f3.s, x: "000", mode: "brute" } },
        { label: "верига (5)", values: { formula: FORMULAS.f4.s, x: "11111", mode: "brute" } },
      ],
      legend: [["s-act", "текущ литерал"], ["s-done", "вярна клауза"], ["s-swap", "невярна клауза"]],
      build: (inp) => (inp.mode === "brute" ? algos.sat_brute(inp) : algos.sat_eval(inp)),
      onFrame: () => { if (sApi) renderLive(); },
      draw(st, f) {

          const lits = c.map((l, j) => {
            const active = f.c === k && f.k === j && !f.brute;
            return h("span", { class: active ? "pill s-act" : "", style: { padding: active ? "2px 6px" : "0" }, text: litTxt(l) });
          });
          const parts = [];
          lits.forEach((x, j) => { if (j) parts.push(" ∨ "); parts.push(x); });
